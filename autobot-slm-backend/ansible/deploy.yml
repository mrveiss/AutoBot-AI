# Ansible Playbook - Main Deployment Entry Point
# Supports blue-green deployments with role borrowing (Issue #726)
---

- name: Deploy Roles to Target Host
  hosts: "{{ target_host | default('all') }}"
  become: true
  gather_facts: true

  vars:
    target_roles: "{{ target_roles | default('slm-agent') }}"

  # #14289: chromadb_service_owner MUST derive from host state
  # (role_redis_active / role_ai_stack_active), never from target_roles. A unit
  # shared by two roles may only be claimed from facts about the host — target_roles
  # says which roles THIS run deploys, not which roles are actually present. Deriving
  # from target_roles meant a `target_roles=ai-stack` redeploy against an
  # already-combined host reclaimed the unit from redis on every run, even though
  # redis was never touched (#4090).
  #
  # #14678: everywhere else, this is the ONLY tracked definition of the
  # role-active facts -- provision-fleet-roles.yml dropped this same
  # vars_files because every inventory builder now links the real
  # group_vars beside its temp inventory (#11781, #14286). This play is
  # the one exception: its only two callers, services/deployment.py
  # (_build_ansible_base_command) and services/blue_green.py
  # (_deploy_roles_to_node), invoke it with a bare `-i "<host>,"` string,
  # not a directory, so Ansible has nowhere to auto-discover group_vars
  # from -- group_vars/all.yml never loads on this codepath. vars_files
  # is not a leftover duplicate here; it is the only way these facts
  # reach this play. Removing it needs those two callers to write a real
  # inventory (with group_vars linked, as playbook_executor.py's dynamic
  # inventories already do) first -- tracked as its own follow-up (#15348)
  # so it doesn't block the rest of #14678.
  vars_files:
    - playbooks/vars/role_active_facts.yml

  tasks:
    - name: Parse target roles
      ansible.builtin.set_fact:
        role_list: "{{ target_roles.split(',') | map('trim') | list }}"

    - name: Display roles to deploy
      ansible.builtin.debug:
        msg: "Deploying roles: {{ role_list | join(', ') }}"

    # SLM Manager (self-deploy)
    - name: Deploy slm-manager role
      ansible.builtin.include_role:
        name: slm_manager
      when: "'slm-manager' in role_list"

    # Core Infrastructure Roles
    - name: Deploy slm-agent role
      ansible.builtin.include_role:
        name: slm_agent
      when: "'slm-agent' in role_list"

    - name: Deploy redis role
      ansible.builtin.include_role:
        name: redis
      when: "'redis' in role_list"

    # AI/ML Roles
    # python_interpreter (#13843, was python314) must be present before
    # ai-stack or backend creates its venv (#3538, #3584)
    - name: Install Python interpreter prerequisite for ai-stack and backend
      ansible.builtin.include_role:
        name: python_interpreter
      when: "'ai-stack' in role_list or 'backend' in role_list"

    - name: Deploy backend role
      ansible.builtin.include_role:
        name: backend
      when: "'backend' in role_list"

    - name: Deploy frontend role
      ansible.builtin.include_role:
        name: frontend
      when: "'frontend' in role_list"

    - name: Deploy npu-worker role
      ansible.builtin.include_role:
        name: npu-worker
      when: "'npu-worker' in role_list"

    - name: Deploy ai-stack role
      ansible.builtin.include_role:
        name: ai-stack
      when: "'ai-stack' in role_list"

    - name: Deploy llm role
      ansible.builtin.include_role:
        name: llm
      when: "'llm' in role_list"

    # Automation Roles
    - name: Deploy browser role
      ansible.builtin.include_role:
        name: browser
      when: "'browser' in role_list"

    # Remote Access Roles
    - name: Deploy vnc role
      ansible.builtin.include_role:
        name: vnc
      when: "'vnc' in role_list"

    # Database Roles
    - name: Deploy postgresql role
      ansible.builtin.include_role:
        name: postgresql
      when: "'postgresql' in role_list"

    # Monitoring Roles
    - name: Deploy monitoring role
      ansible.builtin.include_role:
        name: monitoring
      when: "'monitoring' in role_list"

    # Container Roles (#3424)
    - name: Deploy docker role
      ansible.builtin.include_role:
        name: docker
      when: "'docker' in role_list"

    - name: Deployment complete
      ansible.builtin.debug:
        msg: "Successfully deployed roles: {{ role_list | join(', ') }}"
