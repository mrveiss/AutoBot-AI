---
# AutoBot Main Deployment Playbook
- name: Deploy AutoBot Infrastructure
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Update system packages
      apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
      tags: ['system', 'update']

    - name: Install common packages
      apt:
        name:
          - curl
          - wget
          - git
          - htop
          - vim
          - unzip
          - software-properties-common
          # Network diagnostics (#703)
          - netcat-openbsd
          - iputils-ping
          - dnsutils
        state: present
      tags: ['system', 'packages']

  roles:
    - common
    - network
    - security
    - time_sync

# Frontend VMs
- name: Deploy Frontend Services
  hosts: frontend
  become: true
  roles:
    - nodejs
    - nginx
    - frontend_app
  tags: ['frontend']

# Backend VMs
- name: Deploy Backend Services
  hosts: backend
  become: true
  roles:
    - python
    - fastapi_app
    - backend_services
  tags: ['backend']

# AI Stack VMs
- name: Deploy AI Services
  hosts: ai_stack
  become: true
  roles:
    - python
    - cuda_drivers
    - ai_models
    - ai_services
  tags: ['ai']

# NPU Worker VMs
- name: Deploy NPU Services
  hosts: npu_workers
  become: true
  roles:
    - python
    - intel_npu
    - npu_services
  tags: ['npu']

# Database VMs
- name: Deploy Database Services
  hosts: database
  become: true
  roles:
    - redis_stack
    - data_backup
  tags: ['database']

# Final configuration
- name: Configure Service Communication
  hosts: autobot_cluster
  become: true
  tasks:
    - name: Generate service discovery configuration
      template:
        src: service_discovery.j2
        dest: /etc/autobot/services.yml
      notify: restart_services
  tags: ['config']
