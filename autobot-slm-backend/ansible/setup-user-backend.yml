---
# Setup User Backend (Main) from Blank Ubuntu 22.04
#
# This playbook provisions the main AutoBot backend with:
# - FastAPI backend service
# - Python virtual environment
# - Database migrations
# - TLS certificates
# - VNC server for desktop access
# - Integration with Redis, AI Stack, NPU
#
# Usage:
#   ansible-playbook setup-user-backend.yml --limit main
#   ansible-playbook setup-user-backend.yml --limit ${AUTOBOT_BACKEND_HOST}

- name: Setup User Backend Node
  hosts: main
  become: true
  gather_facts: true

  vars:
    # #13539/B3: `backend_install_dir` means the BACKEND COMPONENT directory
    # everywhere else it is defined (roles/backend/defaults/main.yml,
    # roles/ai-stack/defaults/main.yml) and every template that consumes it
    # derives the deploy root back out via `| dirname` -- so overriding it
    # here with the deploy root silently broke that derivation (the
    # autobot_shared PYTHONPATH entry and uvicorn's --log-config resolved to
    # /opt/autobot_shared instead of /opt/autobot/autobot_shared). Declare the
    # root under its own name and derive backend_install_dir FROM it, so the
    # role's `| dirname` convention still lands on /opt/autobot.
    backend_deployed_root: /opt/autobot
    backend_install_dir: "{{ backend_deployed_root }}/autobot-backend"
    backend_code_dir: "{{ backend_install_dir }}"
    # #15560/3: this was `backend_shared_dir` -- the right value under a name
    # nothing consumes. The `backend` role (and the `autobot_shared` role it
    # sits beside) reads `backend_shared_standalone_dir`, whose default is a
    # hardcoded /opt/autobot/autobot_shared that does NOT follow the
    # backend_deployed_root this play declares. So the play's deploy root was
    # silently not reaching the one directory the standalone PYTHONPATH copy
    # lands in. Renamed to the consumed name rather than deleted: the omission
    # was the bug.
    backend_shared_standalone_dir: "{{ backend_deployed_root }}/autobot_shared"
    backend_user: autobot
    backend_group: autobot
    backend_port: 8001
    backend_https_port: 8443
    backend_service_name: autobot-backend
    vnc_port: 6080

    # Integration endpoints
    redis_host: "{{ infrastructure.hosts.database }}"
    redis_port: 6379
    ai_stack_host: "{{ infrastructure.hosts.aiml }}"
    ai_stack_port: 8080
    npu_worker_host: "{{ infrastructure.hosts.npu }}"
    npu_worker_port: 8081
    browser_worker_host: "{{ infrastructure.hosts.browser }}"
    browser_worker_port: 9001  # Port 9001 is canonical; 3000 was Grafana's port (#5608)

  pre_tasks:
    - name: Display provisioning info
      debug:
        msg: |
          ═══════════════════════════════════════════════════════════════
          User Backend Node Provisioning
          ═══════════════════════════════════════════════════════════════
          Target: {{ inventory_hostname }} ({{ ansible_host }})
          Code: {{ backend_code_dir }}
          HTTP: {{ backend_port }}
          HTTPS: {{ backend_https_port }}
          VNC: {{ vnc_port }}
          User: {{ backend_user }}
          ═══════════════════════════════════════════════════════════════
          Integrations:
          - Redis: {{ redis_host }}:{{ redis_port }}
          - AI Stack: {{ ai_stack_host }}:{{ ai_stack_port }}
          - NPU Worker: {{ npu_worker_host }}:{{ npu_worker_port }}
          - Browser: {{ browser_worker_host }}:{{ browser_worker_port }}
          ═══════════════════════════════════════════════════════════════

  roles:
    - role: common
      tags: [common, base]

    - role: backend
      tags: [backend, api]

    - role: vnc
      tags: [vnc, desktop]
      when: enable_vnc | default(true)

  post_tasks:
    # Strict migration sequence (#10001/#10026): the old task invoked alembic
    # without -c migrations/alembic.ini (guaranteed "No config file" failure)
    # and swallowed it with failed_when: false — native deployments never
    # migrated. Now: gate on Postgres-backed mode -> backup -> baseline
    # adoption -> strict upgrade head. Any failure aborts the deploy with the
    # captured alembic output.
    - name: Read backend user mode (#10001)
      ansible.builtin.shell: "grep -oP '^AUTOBOT_USER_MODE=\\K.*' {{ backend_code_dir }}/.env"
      register: backend_user_mode_probe
      changed_when: false
      failed_when: false  # absent .env/var = not yet configured; skip until set
      tags: [migrations]

    - name: Database migration sequence (Postgres-backed modes) (#10001)
      when: backend_user_mode_probe.stdout | default('') | trim != ''
      tags: [migrations]
      block:
        # Strict migration sequence consolidated into one shared include
        # (#10046): fail-closed backup -> baseline adoption -> strict
        # `alembic upgrade head`. Changes happen in one place for both
        # setup-user-backend.yml and playbooks/update-all-nodes.yml.
        - name: Run strict backend migration sequence (#10001, #10026, #10046)
          ansible.builtin.include_tasks: _shared/tasks/migrate_backend_db.yml
          vars:
            migration_code_dir: "{{ backend_code_dir }}"
            migration_user: "{{ backend_user }}"
            migration_become: false

    - name: Verify backend service
      systemd:
        name: "{{ backend_service_name }}"
        state: started
        enabled: true
      tags: [verify]

    - name: Check backend health
      uri:
        url: "http://127.0.0.1:8001/api/health"
        validate_certs: false
        status_code: [200, 404]
        timeout: 10
      register: health_check
      failed_when: false
      tags: [verify]

    - name: Display setup summary
      debug:
        msg: |
          ═══════════════════════════════════════════════════════════════
          User Backend Setup Complete
          ═══════════════════════════════════════════════════════════════
          Service: {{ backend_service_name }}
          Status: {{ 'Running' if health_check.status == 200 else 'Starting' }}
          HTTP: http://{{ ansible_host }}:{{ backend_port }}
          HTTPS: https://{{ ansible_host }}:{{ backend_https_port }}
          VNC: http://{{ ansible_host }}:{{ vnc_port }}
          Code: {{ backend_code_dir }}
          Migrations: {{ 'Applied' if migration_result.rc == 0 else 'Check logs' }}
          ═══════════════════════════════════════════════════════════════
      tags: [verify]
