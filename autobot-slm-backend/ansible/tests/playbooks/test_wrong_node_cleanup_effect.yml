# AutoBot - Test playbook: wrong-node cleanup actually removes a directory (#15822)
#
# tests/playbooks/test_clean_yml_loops.yml runs the same shared task in --check
# mode, which proves the loops unroll and nothing more. #15822 was invisible to
# it in both directions at once: the run aborted with
#
#   object of type 'bool' has no len()
#
# and, underneath that, the allowlist at roles/_shared/tasks/clean_wrong_node_dir.yml
# had stopped matching, so wrong-node cleanup had not fired on any host since
# 2026-08-24. A guard that only asserts "the play did not raise" is satisfied by
# a task that does nothing, which is exactly the state that shipped. So this
# playbook runs for real (NOT --check) against fixture directories it creates
# itself, and asserts on the filesystem afterwards.
#
# Four cases, because one direction is not a test:
#   A  role fact decidably FALSE      -> the directory is REMOVED
#   B  role fact decidably TRUE       -> the directory is KEPT
#   C  role fact UNDEFINED            -> the directory is KEPT, decision reported
#   D  the loop variable itself       -> the token survives set_fact coercion
#
# B and C are what stop a blanket "delete everything" from passing; A is what
# stops a blanket "delete nothing" — the shape the fix has to restore — from
# passing. Each case also asserts the *reason*: the normalised token and its
# type. Exit status alone cannot tell "kept because the fact said so" apart from
# "kept because the task never ran".
#
# The fixture names are prefixed `_test_` so they cannot collide with a real
# component directory, and the play refuses to start if one already exists —
# it must only ever delete something it made itself.
#
# Usage (runs for real; use a throwaway host):
#   cd autobot-slm-backend/ansible
#   ansible-playbook --connection=local -i 'localhost,' \
#                    tests/playbooks/test_wrong_node_cleanup_effect.yml
---
- name: "Test: wrong-node cleanup removes the wrong dir and keeps the right one (#15822)"
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  # #15822/#15824: the install root comes from the role's own defaults, which
  # are the SSOT for it. This play includes a shared TASK file rather than the
  # role, so role defaults are not loaded automatically and nothing else
  # supplies slm_base_dir -- CI runs this with `-i 'localhost,'` and no
  # inventory, so group_vars never loads either.
  #
  # Loading the defaults file directly is what keeps the value in one place.
  # The alternatives both reintroduce the literal: passing `-e slm_base_dir=...`
  # from the workflow moves the hardcoded path into the YAML that runs the play,
  # and `| default('/opt/autobot')` puts it back in the play wearing a
  # safer-looking shape.
  #
  # Same defect shape as #15824, one workflow over: a play invoked without the
  # inventory that defines its variables.
  vars_files:
    - ../../roles/slm_manager/defaults/main.yml

  vars:
    # Decidably false — this directory does not belong on this host.
    role_effect_absent_active: false
    # Decidably true — this directory does belong here.
    role_effect_present_active: true
    # role_effect_missing_active is deliberately never defined.
    # SSOT: the install root is `slm_base_dir` (roles/slm_manager/defaults),
    # never a literal. Hardcoding it would make this playbook silently test the
    # wrong tree on any deployment that relocates the install — and every
    # assertion would still pass, because they would be asserting about
    # directories this play created itself under the wrong root.
    #
    # No `| default(...)` either: a fallback literal is the same hazard wearing
    # a safer-looking shape. Undefined must stop the play, which the assert in
    # the first task does, rather than quietly testing /opt/autobot on a host
    # that does not use it.
    _base_dir: "{{ slm_base_dir }}"
    _fixture_removed: "_test_wrong_node_15822"
    _fixture_kept: "_test_right_node_15822"
    _fixture_undecidable: "_test_undecidable_15822"
    _fixture_loopvar: "_test_loopvar_collision_15822"
    _fixtures:
      - "{{ _fixture_removed }}"
      - "{{ _fixture_kept }}"
      - "{{ _fixture_undecidable }}"
      - "{{ _fixture_loopvar }}"

  tasks:
    # #15822: the install root comes from SSOT, and an undefined one must stop
    # the play rather than fall back to a literal. A fallback would let this
    # create fixtures under a root the deployment does not use, then assert
    # about them successfully — a green run proving nothing about the host.
    - name: "Pre-flight: the install root must come from SSOT"
      ansible.builtin.assert:
        that:
          - slm_base_dir is defined
          - slm_base_dir | length > 0
        fail_msg: >-
          slm_base_dir is not defined. This playbook asserts on real
          directories under the install root and must not guess it.

    - name: "Pre-flight: stat the fixture paths"
      ansible.builtin.stat:
        path: "{{ _base_dir }}/{{ item }}"
      loop: "{{ _fixtures }}"
      register: _fixtures_before
      become: true

    - name: "Pre-flight: refuse to run over anything this play did not create"
      ansible.builtin.assert:
        that:
          - _fixtures_before.results | rejectattr('stat.exists') | list | length == (_fixtures | length)
        fail_msg: >-
          A fixture path under /opt/autobot already exists. This play deletes
          for real, so it will only ever operate on directories it created in
          this run. Remove the leftovers by hand and re-run.
        success_msg: "No fixture leftovers — safe to create and delete."

    - name: "Create the fixture directories"
      ansible.builtin.file:
        path: "{{ _base_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ _fixtures }}"
      become: true

    # ------------------------------------------------------------------
    # Case A — decidably false: the cleanup must fire
    # ------------------------------------------------------------------
    - name: "Case A: run the wrong-node cleanup with a decidably FALSE role fact"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/_shared/tasks/clean_wrong_node_dir.yml"
      vars:
        caller_role: "Effect test"
        dir_name: "{{ _fixture_removed }}"
        role_check_fact: role_effect_absent_active

    - name: "Case A: stat the directory that should be gone"
      ansible.builtin.stat:
        path: "{{ _base_dir }}/{{ _fixture_removed }}"
      register: _after_removed
      become: true

    - name: "Case A: assert the wrong-node directory was ACTUALLY removed"
      ansible.builtin.assert:
        that:
          - not _after_removed.stat.exists
        fail_msg: >-
          /opt/autobot/{{ _fixture_removed }} is still there after a cleanup run
          whose role fact was explicitly false. Wrong-node cleanup is not firing.
          This is the silent half of #15822: nothing raises, and nothing happens.
        success_msg: "Wrong-node directory removed."

    - name: "Case A: the normalised token is the STRING 'false', not a bool (#15822)"
      ansible.builtin.assert:
        that:
          - _wrong_node_gate.token == 'false'
          - _wrong_node_gate.token | type_debug != 'bool'
        fail_msg: >-
          role_effect_absent_active normalised to {{ _wrong_node_gate.token | to_json }}
          ({{ _wrong_node_gate.token | type_debug }}). set_fact coerces a top-level
          string argument whose value is 'true'/'false'/'yes'/'no' back into a
          Python bool, and a bool matches none of the false-token spellings — so
          the cleanup below cannot fire and `| length` on the token raises. That
          is #15822 exactly.
        success_msg: "Token survived set_fact as the string 'false'."

    # ------------------------------------------------------------------
    # Case B — decidably true: the cleanup must NOT fire
    # ------------------------------------------------------------------
    - name: "Case B: run the wrong-node cleanup with a decidably TRUE role fact"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/_shared/tasks/clean_wrong_node_dir.yml"
      vars:
        caller_role: "Effect test"
        dir_name: "{{ _fixture_kept }}"
        role_check_fact: role_effect_present_active

    - name: "Case B: stat the directory that should still be there"
      ansible.builtin.stat:
        path: "{{ _base_dir }}/{{ _fixture_kept }}"
      register: _after_kept
      become: true

    - name: "Case B: assert the right-node directory was LEFT ALONE"
      ansible.builtin.assert:
        that:
          - _after_kept.stat.exists
        fail_msg: >-
          /opt/autobot/{{ _fixture_kept }} was deleted even though its role fact
          is true. A cleanup that deletes unconditionally would pass Case A for
          the wrong reason; this is the row that catches it.
        success_msg: "Right-node directory kept."

    - name: "Case B: the normalised token is the STRING 'true', not a bool (#15822)"
      ansible.builtin.assert:
        that:
          - _wrong_node_gate.token == 'true'
          - _wrong_node_gate.token | type_debug != 'bool'
        fail_msg: >-
          role_effect_present_active normalised to {{ _wrong_node_gate.token | to_json }}
          ({{ _wrong_node_gate.token | type_debug }}) instead of the string 'true'.
        success_msg: "Token survived set_fact as the string 'true'."

    # ------------------------------------------------------------------
    # Case C — undefined fact: kept, and the reason is reported
    # ------------------------------------------------------------------
    - name: "Case C: run the wrong-node cleanup with an UNDEFINED role fact"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/_shared/tasks/clean_wrong_node_dir.yml"
      vars:
        caller_role: "Effect test"
        dir_name: "{{ _fixture_undecidable }}"
        role_check_fact: role_effect_missing_active

    - name: "Case C: stat the directory an undecidable fact must not touch"
      ansible.builtin.stat:
        path: "{{ _base_dir }}/{{ _fixture_undecidable }}"
      register: _after_undecidable
      become: true

    - name: "Case C: assert the undecidable directory was LEFT ALONE"
      ansible.builtin.assert:
        that:
          - _after_undecidable.stat.exists
        fail_msg: >-
          /opt/autobot/{{ _fixture_undecidable }} was deleted on a host where the
          role fact is not defined at all. Unknown must never mean inactive
          (#14856).
        success_msg: "Undecidable directory kept."

    - name: "Case C: the undecidable token is the empty string, and rendering it does not raise"
      ansible.builtin.assert:
        that:
          - _wrong_node_gate.token == ''
          - (_wrong_node_gate.token | string | trim) == ''
        fail_msg: >-
          An undefined role fact normalised to {{ _wrong_node_gate.token | to_json }}
          instead of ''. The 'not decidable' branch reads this value, and the
          emptiness test in front of it must answer for whatever type it is —
          `| length` did not, which is what raised
          "object of type 'bool' has no len()" on every provisioning run.
        success_msg: "Undefined fact is an empty token and renders cleanly."

    # ------------------------------------------------------------------
    # Case D — reached through `loop_var: _wrong_node`, as four roles do
    # ------------------------------------------------------------------
    # roles/{ai-stack,browser,npu-worker,slm_manager}/tasks/clean.yml all loop
    # over the shared task with `loop_var: _wrong_node`. A loop var outranks a
    # fact, so a fact of that name is shadowed by the loop ITEM on exactly the
    # call sites this task exists to serve — the gate would then read
    # `<loop item>.token`, find nothing there, and decide nothing at all. Cases
    # A-C reach the task directly and cannot see that; this one does, so the
    # normalised fact can never be renamed back into the collision unnoticed.
    - name: "Case D: run the cleanup through a loop whose loop_var is _wrong_node"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/_shared/tasks/clean_wrong_node_dir.yml"
      loop:
        - {dir_name: "{{ _fixture_loopvar }}", role_check_fact: "role_effect_absent_active"}
      loop_control:
        loop_var: _wrong_node
      vars:
        caller_role: "Effect test"
        dir_name: "{{ _wrong_node.dir_name }}"
        role_check_fact: "{{ _wrong_node.role_check_fact }}"

    - name: "Case D: stat the directory that should be gone"
      ansible.builtin.stat:
        path: "{{ _base_dir }}/{{ _fixture_loopvar }}"
      register: _after_loopvar
      become: true

    - name: "Case D: assert the cleanup still fired under the colliding loop_var"
      ansible.builtin.assert:
        that:
          - not _after_loopvar.stat.exists
        fail_msg: >-
          /opt/autobot/{{ _fixture_loopvar }} survived a cleanup run whose role
          fact was explicitly false, reached the way ai-stack, browser,
          npu-worker and slm_manager reach it. The normalised fact is being
          shadowed by the loop item, so the gate reads an attribute that is not
          there and the delete branch can never be selected.
        success_msg: "Cleanup fired through a loop_var named _wrong_node."

    # Through the primitive, not with a hand-written `state: absent`. A component
    # directory under /opt/autobot has exactly one removal path in this tree and
    # a test fixture is not an exception to it — spelling the delete out here is
    # the shape #14856 was filed for, and the tree-wide guard in
    # tests/test_cleanup_never_destroys_data_14856.py rejects it by design.
    - name: "Tear down the surviving fixtures through the one guarded primitive"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/_shared/tasks/remove_component_dir.yml"
      loop: "{{ _fixtures }}"
      loop_control:
        loop_var: _teardown_dir
      vars:
        caller_role: "Effect test"
        remove_dir_path: "{{ _base_dir }}/{{ _teardown_dir }}"
        remove_reason: "test fixture teardown (#15822)"
