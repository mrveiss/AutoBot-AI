---
# Configure systemd-resolved

- name: Check if systemd-resolved is available
  command: systemctl status systemd-resolved
  register: resolved_check
  changed_when: false
  # (#2872) Intentional: systemd-resolved may not be installed on all hosts;
  # the result gates conditional configuration below.
  failed_when: false

- name: Configure systemd-resolved
  template:
    src: resolved.conf.j2
    dest: /etc/systemd/resolved.conf
    owner: root
    group: root
    mode: '0644'
  when: resolved_check.rc == 0
  notify: restart systemd-resolved

- name: Enable systemd-resolved
  systemd:
    name: systemd-resolved
    enabled: true
    state: started
  when: resolved_check.rc == 0

- name: Link resolv.conf to systemd-resolved
  file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when: resolved_check.rc == 0

- name: Verify systemd-resolved status
  command: systemctl is-active systemd-resolved
  register: resolved_status
  changed_when: false
  # (#2872) Intentional: status check for display only; non-zero rc
  # just means the service is inactive, reported below.
  failed_when: false
  when: resolved_check.rc == 0

- name: Display systemd-resolved status
  debug:
    msg: "systemd-resolved status: {{ resolved_status.stdout }}"
  when: resolved_check.rc == 0
