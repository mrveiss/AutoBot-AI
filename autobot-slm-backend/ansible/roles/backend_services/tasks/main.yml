---
# Backend Services Role
- name: Create AutoBot user
  user:
    name: autobot
    home: /opt/autobot
    shell: /bin/bash
    system: true

- name: Create AutoBot directories
  file:
    path: "{{ item }}"
    state: directory
    owner: autobot
    group: autobot
    mode: '0755'
  loop:
    - /opt/autobot/app
    - /opt/autobot/logs
    - /opt/autobot/data
    - /opt/autobot/config
    - /opt/autobot/venv

# #11374: Install the target interpreter BEFORE any venv work. The
# ensure_venv_version step below removes a wrong-version venv, and the
# subsequent pip step recreates it with virtualenv_python: python3.14 —
# both fail if python3.14 is absent (the live py3.12 drift). The
# python_interpreter role (#13843, was python314) is idempotent (checks
# `python3.14 --version` first) and fail-loud (verifies the interpreter after
# install), so re-running is a no-op. #13842: no version override here any
# more -- the role's own default now derives it from .python-version.
- name: "Backend Services | Install target Python interpreter"
  ansible.builtin.include_role:
    name: python_interpreter
    public: true  # #16750: role defaults (python_interpreter_binary) must reach the pip task below

- name: "Backend Services | Enforce venv target Python version (env-drift fix)"
  ansible.builtin.include_role:
    name: python_interpreter
    tasks_from: ensure_venv_version
  vars:
    venv_path: /opt/autobot/venv
    venv_python: python3.14

# #16641: `virtualenv_python:` alone only applies when `virtualenv_command:`
# names the standalone `virtualenv` tool -- it is silently ignored for `-m
# venv`, and without either, pip fell back to shelling out to `virtualenv`
# itself, which these hosts do not have. `virtualenv_command:` below replaces
# it with the stdlib's `venv` module, using the interpreter
# python_interpreter (included above) already installed.
# #17246: `code_source` is the controller's git checkout and no task syncs it
# to a node, so this constraints path did not exist here -- the #17242 class,
# caught by the widened detector rather than by another failed provision. The
# file is staged onto the node first and read from there.
- name: "Stage the manifests this node's pip step reads (#17246, #17331)"
  ansible.builtin.include_tasks: ../../_shared/tasks/stage_shared_manifests.yml
  when: not (autobot_shared_manifests_staged | default(false))
  # Tagged `always` for the reason update-all-nodes.yml gives at its own
  # staging task: the staged file is a precondition of the pip step below,
  # so a tag selection that runs the install but not the staging would
  # constrain against a file that is not there. Enumerating the consumer
  # tags would go stale; `always` cannot.
  tags: [always]

- name: Install Python dependencies
  pip:
    requirements: /opt/autobot/app/requirements.txt
    virtualenv: /opt/autobot/venv
    virtualenv_command: "{{ python_interpreter_binary }} -m venv"
    # #15684: constraints/shared.txt applied here too, the same shape every
    # other pip site in this venv now uses.
    extra_args: "-c {{ autobot.base_dir }}/constraints/shared.txt"
  become_user: autobot
  environment:
    PIP_DEFAULT_TIMEOUT: "120"
  timeout: 600  # Issue #2835: prevent indefinite hang on dependency resolution conflicts

- name: Copy AutoBot application files
  synchronize:
    src: "{{ playbook_dir }}/../"
    dest: /opt/autobot/app/
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=venv"
      - "--exclude=docker"
  become_user: autobot
  notify: restart backend services

- name: Generate environment configuration
  template:
    src: backend.env.j2
    dest: /opt/autobot/config/backend.env
    owner: autobot
    group: autobot
    mode: '0640'
  notify: restart backend services

# #10005: Render the backend role's unit template — the single source of truth
# for autobot-backend.service (carries the #9934 LimitNOFILE directive). This
# role previously referenced a bare `autobot-backend.service.j2` that resolved
# nowhere (the role has no templates/ dir); the drifted near-copy at
# ansible/templates/systemd/ was unreferenced and is deleted. Vars map the
# canonical template onto this role's install layout.
- name: Create systemd service files
  template:
    src: ../../backend/templates/autobot-backend.service.j2
    dest: /etc/systemd/system/autobot-backend.service
    mode: '0644'
  vars:
    backend_user: autobot
    backend_group: autobot
    backend_install_dir: /opt/autobot/app
    backend_code_dir: /opt/autobot/app
    backend_log_dir: /opt/autobot/logs
    backend_host: "0.0.0.0"
    backend_port: 8001
    backend_workers: 4
  notify:
    - reload systemd
    - restart backend services

- name: Enable and start backend services
  systemd:
    name: autobot-backend
    enabled: true
    state: started
    daemon_reload: true
