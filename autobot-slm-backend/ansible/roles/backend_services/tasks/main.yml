---
# Backend Services Role
- name: Create AutoBot user
  user:
    name: autobot
    home: /opt/autobot
    shell: /bin/bash
    system: true

- name: Create AutoBot directories
  file:
    path: "{{ item }}"
    state: directory
    owner: autobot
    group: autobot
    mode: '0755'
  loop:
    - /opt/autobot/app
    - /opt/autobot/logs
    - /opt/autobot/data
    - /opt/autobot/config
    - /opt/autobot/venv

- name: Install Python dependencies
  pip:
    requirements: /opt/autobot/app/requirements.txt
    virtualenv: /opt/autobot/venv
    virtualenv_python: python3.14
  become_user: autobot
  environment:
    PIP_DEFAULT_TIMEOUT: "120"
  timeout: 600  # Issue #2835: prevent indefinite hang on dependency resolution conflicts

- name: Copy AutoBot application files
  synchronize:
    src: "{{ playbook_dir }}/../"
    dest: /opt/autobot/app/
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=venv"
      - "--exclude=docker"
  become_user: autobot
  notify: restart backend services

- name: Generate environment configuration
  template:
    src: backend.env.j2
    dest: /opt/autobot/config/backend.env
    owner: autobot
    group: autobot
    mode: '0640'
  notify: restart backend services

# #10005: Render the backend role's unit template — the single source of truth
# for autobot-backend.service (carries the #9934 LimitNOFILE directive). This
# role previously referenced a bare `autobot-backend.service.j2` that resolved
# nowhere (the role has no templates/ dir); the drifted near-copy at
# ansible/templates/systemd/ was unreferenced and is deleted. Vars map the
# canonical template onto this role's install layout.
- name: Create systemd service files
  template:
    src: ../../backend/templates/autobot-backend.service.j2
    dest: /etc/systemd/system/autobot-backend.service
    mode: '0644'
  vars:
    backend_user: autobot
    backend_group: autobot
    backend_install_dir: /opt/autobot/app
    backend_code_dir: /opt/autobot/app
    backend_log_dir: /opt/autobot/logs
    backend_host: "0.0.0.0"
    backend_port: 8001
    backend_workers: 4
  notify:
    - reload systemd
    - restart backend services

- name: Enable and start backend services
  systemd:
    name: autobot-backend
    enabled: true
    state: started
    daemon_reload: true
