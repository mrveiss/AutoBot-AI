# Service Authentication Role - Handlers
---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: restart backend
  when: inventory_hostname in groups['backend']
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: autobot-backend
  become: true
