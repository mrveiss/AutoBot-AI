# VNC Role - the pinned noVNC install and the websockify unit that serves it (#22146).
# One home for novnc_path: main.yml imports this file, and update-all-nodes.yml
# includes it with `tasks_from: novnc` so the builtin updater converges a node
# whose noVNC pin (#13069) or websockify unit predates it, without re-running the
# provisioning half of the role (apt, accounts, passwords).
---
# #14319: the fleet update includes this file without the rest of the role, so it bypasses
# main.yml's emergency-admin rejection and the account creation. Both are checked here on that
# path (novnc_require_vnc_account is set only by update-all-nodes.yml); provisioning runs
# main.yml's own copy of the rejection before it creates any account.
- name: "VNC | Reject the emergency admin account (fleet update, #14319)"
  when: novnc_require_vnc_account | default(false) | bool
  ansible.builtin.assert:
    that:
      - vnc_user != vnc_forbidden_user
    fail_msg: >-
      vnc_user is set to '{{ vnc_forbidden_user }}', the emergency admin
      safety-net account (see roles/common/vars/main.yml
      emergency_admin_user and playbooks/rotate-ssh-keys.yml). VNC must not
      run under it -- see #14319. Set VNC_USER (or AUTOBOT_VNC_USER) to a
      different account, or leave it unset to use the default
      (autobot-vnc).
    success_msg: "VNC will run as '{{ vnc_user }}'"

# The fleet update (never provisioning) sets novnc_require_vnc_account: the unit below runs as
# this account, so a node that was never provisioned fails here, naming the account, rather
# than at a later restart. Provisioning creates the account after this file, so it leaves it unset.
- name: "VNC | The service account and group exist (fleet update, #14319)"
  ansible.builtin.getent:
    database: "{{ item.getent_database }}"
    key: "{{ item.key }}"
  loop:
    - { getent_database: passwd, key: "{{ vnc_user }}" }
    - { getent_database: group, key: "{{ vnc_group }}" }
  when: novnc_require_vnc_account | default(false) | bool

# Upstream publishes no release assets, so the tag archive is the distribution.
# If GitHub ever re-compresses it the checksum fails loudly, which is the safe
# failure mode — a mismatched archive is never installed.
- name: Download noVNC {{ novnc_version }} tarball (#13069)
  ansible.builtin.get_url:
    url: "{{ novnc_archive_url }}"
    dest: "{{ novnc_archive_path }}"
    checksum: "sha256:{{ novnc_archive_sha256 }}"
    mode: "0644"
  become: true

- name: Unpack noVNC {{ novnc_version }} to versioned root (#13069)
  ansible.builtin.unarchive:
    src: "{{ novnc_archive_path }}"
    dest: "{{ novnc_install_root | dirname }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ novnc_install_root }}/vnc.html"
  become: true

- name: Point {{ novnc_path }} at noVNC {{ novnc_version }} (#13069)
  ansible.builtin.file:
    src: "{{ novnc_install_root }}"
    dest: "{{ novnc_path }}"
    state: link
    force: true
  become: true
  notify: restart websockify

# The distro `novnc` package is 1.0.0 (2018) on Ubuntu 22.04 -- it predates VeNCrypt support
# and caused the unreachable-server failure in #13060 (#13069). It is removed LAST, once the
# pinned copy is downloaded, checksum-verified, unpacked and linked, so a failed download can
# never leave a node without any noVNC.
- name: Remove distro noVNC package (superseded by pinned upstream; #13069)
  ansible.builtin.apt:
    name: novnc
    state: absent
  become: true

- name: Deploy websockify systemd service
  ansible.builtin.template:
    src: vnc-websockify.service.j2
    dest: /etc/systemd/system/{{ websockify_service_name }}.service
    mode: "0644"
  become: true
  when: websockify_enabled | bool
  notify:
    - reload systemd
    - restart websockify
