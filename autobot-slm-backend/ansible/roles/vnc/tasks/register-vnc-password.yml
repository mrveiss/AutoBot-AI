# VNC Role - Register the VNC password in the canonical secrets system (#16299)
#
# Split out from tasks/main.yml (#16299 review round 2) so it can be called
# from two different points depending on whether the calling playbook runs
# the backend's secrets-table migration:
#
# - tasks/main.yml calls this best-effort (block/rescue) for every playbook
#   where the backend is already provisioned and migrated (deploy.yml,
#   playbooks/deploy_role.yml, playbooks/enroll-node.yml,
#   playbooks/provision-fleet-roles.yml).
# - setup-user-backend.yml ALSO calls this directly from its own post_tasks,
#   after the migration sequence, for the one playbook where a fresh host's
#   vault does not exist yet when tasks/main.yml's own call runs. Safe to
#   call twice: gated on an actual read-back of the vault (does this name
#   already exist?), not a local marker file, so the second, later call
#   succeeds regardless of whether the first one ran, skipped, or failed.
#
# Caller contract: vnc_password_result (the generated password) and vnc_type
# must already be set. Requires vnc_type == 'desktop' -- refused elsewhere
# (tasks/main.yml) as a hard failure, not swallowed by this file's own
# best-effort callers, since a non-desktop vnc_type is a real
# misconfiguration (would send the password in cleartext to a remote host),
# not a migration-timing flake.
---
- name: "VNC | Read AUTOBOT_INTERNAL_API_KEY from slm-secrets.env (#16299)"
  ansible.builtin.shell:
    cmd: >-
      grep -oP '^AUTOBOT_INTERNAL_API_KEY=\K.*'
      /etc/autobot/slm-secrets.env 2>/dev/null || true
  register: _vnc_internal_api_key_read
  changed_when: false
  failed_when: false
  no_log: true

- name: "VNC | Fail if backend_port is not defined (#16299 review: no port literals)"
  ansible.builtin.assert:
    that:
      - backend_port is defined
    fail_msg: >-
      backend_port is not defined -- this role does not hardcode a port default
      (roles/backend/defaults/main.yml's own backend_port is the single source of
      truth). Set it via inventory/group_vars, or ensure the backend role runs in
      the same play first.

- name: "VNC | Check if the VNC password is already registered in the secrets vault (#16299)"
  ansible.builtin.uri:
    url: "http://{{ main_host }}:{{ backend_port }}/api/v2/secrets/system"
    method: GET
    headers:
      X-Internal-API-Key: "{{ _vnc_internal_api_key_read.stdout | trim }}"
    status_code: [200]
    validate_certs: false
  register: _vnc_existing_secrets
  retries: 12
  delay: 5
  until: _vnc_existing_secrets.status | default(0) == 200
  when: (_vnc_internal_api_key_read.stdout | default('') | trim) | length > 0

- name: "VNC | Register VNC password in the canonical secrets system (#16299)"
  ansible.builtin.uri:
    url: "http://{{ main_host }}:{{ backend_port }}/api/v2/secrets/system"
    method: POST
    headers:
      X-Internal-API-Key: "{{ _vnc_internal_api_key_read.stdout | trim }}"
    body_format: json
    body:
      owner_vault: system
      name: "vnc-password-{{ vnc_type }}"
      secret_type: vnc_password
      value: "{{ vnc_password_result.stdout }}"
    status_code: [201]
    validate_certs: false
  register: _vnc_register_result
  retries: 5
  delay: 5
  until: _vnc_register_result.status | default(0) == 201
  when:
    - (_vnc_internal_api_key_read.stdout | default('') | trim) | length > 0
    - _vnc_existing_secrets is succeeded
    - (_vnc_existing_secrets.json | default([]) | selectattr('name', 'equalto', 'vnc-password-' + vnc_type) | list | length) == 0
  no_log: true
