# VNC Role - Install and configure VNC server with noVNC web interface
---
# #6719: bounded shell apt-get update — see roles/nginx/tasks/main.yml.
- name: VNC | Refresh apt cache (best-effort, bounded; #6719)
  ansible.builtin.command:
    cmd: >-
      timeout 60 apt-get update -qq
      -o Acquire::Retries=0
      -o Acquire::http::Timeout=10
  become: true
  changed_when: false
  failed_when: false

- name: Install VNC server packages
  ansible.builtin.apt:
    name:
      - tigervnc-standalone-server
      - tigervnc-common
      - tigervnc-tools
      - x11vnc
      - websockify
      - novnc
      - xfce4
      - xfce4-terminal
      - dbus-x11
    state: present
  become: true

- name: Create VNC user if not exists
  ansible.builtin.user:
    name: "{{ vnc_user }}"
    shell: /bin/bash
    create_home: true
    state: present
  become: true

- name: Create VNC configuration directory
  ansible.builtin.file:
    path: "/home/{{ vnc_user }}/.vnc"
    state: directory
    mode: "0700"
    owner: "{{ vnc_user }}"
    group: "{{ vnc_group }}"
  become: true

- name: Check if VNC secrets file already exists
  ansible.builtin.stat:
    path: /etc/autobot/vnc-secrets.env
  register: vnc_secrets_stat
  become: true

- name: Generate secure VNC password
  ansible.builtin.shell: |
    set -e
    password=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 16)
    echo "VNC_PASSWORD=${password}" > /etc/autobot/vnc-secrets.env
    chmod 0640 /etc/autobot/vnc-secrets.env
    chown root:{{ vnc_group }} /etc/autobot/vnc-secrets.env
  args:
    creates: /etc/autobot/vnc-secrets.env
  become: true
  when: not vnc_secrets_stat.stat.exists

- name: Read VNC password from secrets file
  ansible.builtin.shell: >
    grep '^VNC_PASSWORD=' /etc/autobot/vnc-secrets.env | cut -d= -f2
  register: vnc_password_result
  changed_when: false
  become: true

- name: Set VNC password file for user
  ansible.builtin.shell: |
    set -e
    echo '{{ vnc_password_result.stdout }}' | vncpasswd -f \
      > /home/{{ vnc_user }}/.vnc/passwd
    chmod 0600 /home/{{ vnc_user }}/.vnc/passwd
    chown {{ vnc_user }}:{{ vnc_group }} /home/{{ vnc_user }}/.vnc/passwd
  become: true
  when: vnc_password_result.stdout | length > 0
  notify: restart vnc-server

# --- x11vnc password file for desktop_streaming_manager (#1969) ---
- name: Create x11vnc password file from VNC password
  ansible.builtin.shell: |
    set -e
    x11vnc -storepasswd '{{ vnc_password_result.stdout }}' \
      /home/{{ vnc_user }}/.vnc/x11vnc.passwd
    chmod 0600 /home/{{ vnc_user }}/.vnc/x11vnc.passwd
    chown {{ vnc_user }}:{{ vnc_group }} /home/{{ vnc_user }}/.vnc/x11vnc.passwd
  args:
    creates: "/home/{{ vnc_user }}/.vnc/x11vnc.passwd"
  become: true
  when: vnc_password_result.stdout | length > 0

# --- TLS cert verification for websockify (#1962) ---
- name: Ensure TLS cert directory exists
  ansible.builtin.file:
    path: /etc/autobot/certs
    state: directory
    mode: "0755"
  become: true

- name: Check TLS certificates exist for websockify
  ansible.builtin.stat:
    path: "/etc/autobot/certs/{{ item }}"
  register: tls_cert_check
  loop:
    - server-cert.pem
    - server-key.pem
  become: true

- name: Generate self-signed TLS cert if missing (#1962)
  ansible.builtin.shell: |
    set -e
    openssl req -x509 -newkey rsa:2048 -nodes \
      -keyout /etc/autobot/certs/server-key.pem \
      -out /etc/autobot/certs/server-cert.pem \
      -days 3650 -subj '/CN={{ inventory_hostname }}.autobot.internal'
    chmod 0644 /etc/autobot/certs/server-cert.pem
    chmod 0600 /etc/autobot/certs/server-key.pem
  become: true
  when: tls_cert_check.results | selectattr('stat.exists', 'equalto', false) | list | length > 0

- name: Deploy VNC xstartup script
  ansible.builtin.template:
    src: xstartup.j2
    dest: "/home/{{ vnc_user }}/.vnc/xstartup"
    mode: "0755"
    owner: "{{ vnc_user }}"
    group: "{{ vnc_group }}"
  become: true
  notify: restart vnc-server

- name: Deploy VNC config file
  ansible.builtin.template:
    src: vnc-config.j2
    dest: "/home/{{ vnc_user }}/.vnc/config"
    mode: "0644"
    owner: "{{ vnc_user }}"
    group: "{{ vnc_group }}"
  become: true
  notify: restart vnc-server

- name: Deploy VNC server systemd service
  ansible.builtin.template:
    src: vnc-server.service.j2
    dest: /etc/systemd/system/{{ vnc_service_name }}.service
    mode: "0644"
  become: true
  notify:
    - reload systemd
    - restart vnc-server

- name: Deploy websockify systemd service
  ansible.builtin.template:
    src: vnc-websockify.service.j2
    dest: /etc/systemd/system/{{ websockify_service_name }}.service
    mode: "0644"
  become: true
  when: websockify_enabled | bool
  notify:
    - reload systemd
    - restart websockify

- name: Enable and start VNC server
  ansible.builtin.systemd:
    name: "{{ vnc_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Enable and start websockify
  ansible.builtin.systemd:
    name: "{{ websockify_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  become: true
  when: websockify_enabled | bool

# --- Auto-register VNC credentials in SLM database (#2926) ---
# Registration is best-effort: VNC works without it. SLM may be unreachable from
# nodes on a different subnet or before firewall rules are open. block/rescue is
# used here because ignore_errors on include_tasks does not propagate into the
# included tasks themselves.
- name: Register VNC credentials in SLM (best-effort)
  when:
    - vnc_register_credentials | bool
    - vnc_password_result.stdout | length > 0
    - slm_node_id is defined
  block:
    - name: Register VNC credentials in SLM
      ansible.builtin.include_tasks: register-credentials.yml
  rescue:
    - name: VNC credential registration skipped (SLM unreachable)
      ansible.builtin.debug:
        msg: >-
          VNC credential auto-registration failed for {{ inventory_hostname }}
          (SLM at {{ slm_api_url }} unreachable — register credentials manually
          via SLM UI > Nodes > VNC Credentials)
