---
# Open the ports the vnc role really serves (#22211): the RFB port of the configured display
# (display :1 listens on 5901) and the websockify port. Both from the internal subnet only.
# One home: bootstrap-node.yml and provision-fleet-roles.yml include this file.

- name: vnc | Allow the RFB port of display {{ vnc_display }} from the internal subnet
  community.general.ufw:
    rule: allow
    port: "{{ vnc_rfb_port | string }}"
    proto: tcp
    src: "{{ network_subnet }}"
    comment: "VNC RFB (display :{{ vnc_display }}) - internal only"

- name: vnc | Allow the websockify port from the internal subnet
  community.general.ufw:
    rule: allow
    port: "{{ websockify_port | string }}"
    proto: tcp
    src: "{{ network_subnet }}"
    comment: "noVNC websockify - internal only"
