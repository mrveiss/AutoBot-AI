# VNC Role - Handlers
---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: restart vnc-server
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: "{{ vnc_service_name }}"

- name: restart websockify
  when: websockify_enabled | bool
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: "{{ websockify_service_name }}"
