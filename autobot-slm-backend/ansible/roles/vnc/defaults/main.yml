# VNC Role - Default variables (override via env vars or playbook)
---
# VNC server settings - all from environment or playbook variables
vnc_user: "{{ lookup('env', 'VNC_USER') | default('autobot', true) }}"
vnc_group: "{{ lookup('env', 'VNC_GROUP') | default('autobot', true) }}"
vnc_display: "{{ lookup('env', 'VNC_DISPLAY') | default('1', true) }}"
vnc_geometry: "{{ lookup('env', 'VNC_GEOMETRY') | default('1920x1080', true) }}"
vnc_depth: "{{ lookup('env', 'VNC_DEPTH') | default('24', true) }}"

# Websockify settings
websockify_port: "{{ lookup('env', 'WEBSOCKIFY_PORT') | default('6080', true) }}"
websockify_enabled: "{{ lookup('env', 'WEBSOCKIFY_ENABLED') | default('true', true) }}"

# noVNC installation
#
# #13069: pinned to an explicit upstream release, NOT the distro package. Ubuntu
# 22.04 ships `novnc 1:1.0.0-5` — upstream 1.0.0 is from 2018 and predates
# VeNCrypt support (added in 1.4.0), which is what broke the deploy in #13060.
# Bump novnc_version and novnc_archive_sha256 together to upgrade.
#
# The archive is the GitHub tag tarball: upstream publishes no release assets, so
# the tag archive IS the distribution. It is self-contained — .gitmodules is empty
# and vendor/pako is fully populated.
novnc_version: "1.7.0"
novnc_archive_sha256: b1003a11b6e6e8d8f7f5e5586daae7f8ca651d8aee0aa155ff9ac841c48f52c6

# Versioned install root + stable symlink, so a rollback is a symlink flip.
# novnc_path deliberately does NOT point at /usr/share/novnc: that directory is
# dpkg-owned by the distro package, and replacing it with a symlink collides.
novnc_install_root: "/opt/noVNC-{{ novnc_version }}"
novnc_path: /opt/novnc

# Security - password auto-generated to /etc/autobot/vnc-secrets.env
#
# #13060: VncAuth is what this role actually provisions — `vncpasswd -f` (see
# tasks/main.yml) writes a VncAuth-format password file. TLSVnc and X509Vnc are
# VeNCrypt sub-types that wrap that same VncAuth challenge for native viewers
# able to negotiate them.
#
# Do NOT set this to bare "VeNCrypt": that names only the wrapper and leaves the
# sub-type list empty, so NO client completes the handshake — not even a
# VeNCrypt-capable one. It also locks out noVNC < 1.4.0 (the `novnc` apt package
# ships 1.0.0 on some releases), which has no VeNCrypt support at all.
#
# VncAuth on the raw RFB hop is safe here: websockify terminates TLS for the
# browser (see vnc-websockify.service.j2) and connects to VNC over loopback.
vnc_security_type: "{{ lookup('env', 'VNC_SECURITY_TYPE') | default('VncAuth,TLSVnc,X509Vnc', true) }}"
vnc_always_shared: "{{ lookup('env', 'VNC_ALWAYS_SHARED') | default('0', true) }}"

# #13060: dedicated VNC keypair, read by BOTH the X509Vnc security type (Xvnc,
# running as vnc_user) and websockify --ssl-only (also vnc_user). The shared node
# key at /etc/autobot/certs/server-key.pem is root:root 0600 and is consumed by
# nginx, Redis and PostgreSQL, so it must not be opened up to vnc_user.
vnc_tls_cert: /etc/autobot/certs/vnc-cert.pem
vnc_tls_key: /etc/autobot/certs/vnc-key.pem

# Service management
vnc_service_name: vnc-server
websockify_service_name: vnc-websockify

# SLM credential auto-registration (#2926)
vnc_register_credentials: true
# #9953: /slm prefix is the UNIVERSAL SLM API path — served in both co-located
# and dedicated nginx modes (#3268). The bare /api/ path routes to the USER
# backend on co-located hosts, so SLM auth there returns 401.
slm_api_url: "https://{{ slm_host | default('127.0.0.1') }}/slm"
slm_admin_user: "admin"
slm_admin_password: "{{ lookup('env', 'SLM_ADMIN_PASSWORD') | default('admin', true) }}"
