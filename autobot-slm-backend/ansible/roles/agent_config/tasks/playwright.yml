---
# Install Playwright and browser dependencies

- name: Install Playwright system dependencies
  package:
    name:
      - libnss3
      - libnspr4
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libcups2
      - libdrm2
      - libdbus-1-3
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libgbm1
      - libasound2
    state: present

# #15684: this venv is also filled from the deployed root requirements.txt
# (python_deps.yml), so this restates a package that manifest could declare
# instead -- multi-source, #15671's class of bug. Left as-is rather than
# moved: root requirements.txt is `-r`-included by autobot-backend's own
# manifest (autobot-backend/requirements.txt:66), so adding playwright there
# would pull a headless-browser automation stack into the backend's venv too,
# which nothing in autobot-backend imports. See MULTI_SOURCE_VENVS in
# repo_tests/ansible_manifest_resolution.py for the recorded reason.
- name: Install Playwright via pip in venv
  pip:
    name: playwright
    virtualenv: "{{ venv_dir }}"
    # #16641: see roles/browser/tasks/main.yml for the full reason.
    virtualenv_command: "{{ python_interpreter_binary }} -m venv"
    # #15684: constraints/shared.txt applied here too, the same shape
    # openvino.yml's pip task in this role already uses.
    extra_args: "-c {{ code_source_dir | default(autobot.base_dir ~ '/code_source') }}/constraints/shared.txt"
  become_user: "{{ service_user }}"
  environment:
    PIP_DEFAULT_TIMEOUT: "120"
  timeout: 300  # Issue #2835: prevent indefinite hang on dependency resolution

- name: Check if Playwright browsers are installed
  stat:
    path: "{{ ansible_facts['env'].HOME }}/.cache/ms-playwright"
  register: playwright_browsers
  become_user: "{{ service_user }}"

- name: Install Playwright browsers
  command: "{{ venv_dir }}/bin/playwright install {{ item }}"
  loop: "{{ playwright_browsers_list }}"
  become_user: "{{ service_user }}"
  when: not playwright_browsers.stat.exists

- name: Install Playwright system dependencies via playwright CLI
  command: "{{ venv_dir }}/bin/playwright install-deps"
  become_user: "{{ service_user }}"
  when: not playwright_browsers.stat.exists

- name: Verify Playwright installation
  command: "{{ venv_dir }}/bin/playwright --version"
  register: playwright_version_check
  changed_when: false
  become_user: "{{ service_user }}"
