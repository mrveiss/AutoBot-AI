---
# Create systemd service for AutoBot agent

- name: Create systemd service file
  template:
    src: autobot-agent.service.j2
    dest: /etc/systemd/system/autobot-agent.service
    owner: root
    group: root
    mode: '0644'
  notify: restart autobot-agent

- name: Reload systemd daemon
  systemd:
    daemon_reload: true

- name: Enable autobot-agent service
  systemd:
    name: autobot-agent
    enabled: true

# (#2872) Removed failed_when: false — service start failures must
# surface so deployment reports the real state.
- name: Start autobot-agent service
  ansible.builtin.systemd:
    name: autobot-agent
    state: started
  register: service_start

- name: Wait for agent to be ready
  wait_for:
    port: "{{ agent_port }}"
    host: localhost
    timeout: 30
  when: service_start.changed
