---
# agent_config role - Main tasks

- name: Create project directory structure
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '0755'
  loop:
    - "{{ project_root }}"
    - "{{ config_dir }}"
    - "{{ logs_dir }}"
    - "{{ docs_dir }}"
    - "{{ uploads_dir }}"
    - "{{ models_dir }}"
    - "{{ models_dir }}/transformers"
    - "{{ models_dir }}/huggingface"

- name: Install system dependencies
  include_tasks: system_packages.yml

# #16641: makes python_interpreter_binary available to every pip task below
# that sets virtualenv_command: (python_env.yml, python_deps.yml,
# openvino.yml, playwright.yml) -- python_env.yml's own
# ensure_venv_version call only checks/removes a wrong-version venv, it
# never derives that fact.
- name: Install target Python interpreter
  include_role:
    name: python_interpreter

- name: Set up Python environment
  include_tasks: python_env.yml

- name: Install Python dependencies
  include_tasks: python_deps.yml

- name: Install OpenVINO
  include_tasks: openvino.yml
  when: install_openvino

- name: Install and configure Ollama
  include_tasks: ollama.yml
  when: install_ollama

- name: Install Node.js
  include_tasks: nodejs.yml
  when: install_nodejs

- name: Install Playwright
  include_tasks: playwright.yml
  when: install_playwright

- name: Configure agent environment
  include_tasks: config.yml

- name: Create systemd service
  include_tasks: service.yml
  when: create_systemd_service

- name: Verify installation
  include_tasks: verify.yml
