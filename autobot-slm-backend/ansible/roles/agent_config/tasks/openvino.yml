---
# Install OpenVINO for NPU/GPU acceleration

- name: Add OpenVINO GPG key
  apt_key:
    url: https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
    state: present

# #7218: idempotent repo-add — preserve device-shipped OpenVINO repo if present
- name: "Add OpenVINO repository (idempotent, #7218)"
  ansible.builtin.include_tasks: ../../_shared/tasks/add_apt_repository_idempotent.yml
  vars:
    apt_repo_match: "apt.repos.intel.com/openvino"
    apt_repo_spec: "deb https://apt.repos.intel.com/openvino/{{ openvino_version }} ubuntu22 main"
    apt_repo_filename: "intel-openvino"
    apt_repo_label: "OpenVINO"

# #6719: bounded shell apt-get update — see roles/nginx/tasks/main.yml.
- name: agent_config openvino | Refresh apt cache after OpenVINO repo add (best-effort, bounded; #6719)
  ansible.builtin.command:
    cmd: >-
      timeout 60 apt-get update -qq
      -o Acquire::Retries=0
      -o Acquire::http::Timeout=10
  become: true
  changed_when: false
  failed_when: false

- name: Install OpenVINO Runtime
  package:
    name: "openvino-{{ openvino_version }}"
    state: present

- name: Check if NPU driver is needed
  stat:
    path: /dev/accel/accel0
  register: npu_device

- name: Install Intel NPU driver
  package:
    name: intel-driver-compiler-npu
    state: present
  when: npu_device.stat.exists

- name: Add service user to render group for GPU access
  user:
    name: "{{ service_user }}"
    groups: render
    append: true

- name: Set up OpenVINO environment in venv
  pip:
    name: openvino
    virtualenv: "{{ venv_dir }}"
  become_user: "{{ service_user }}"
  environment:
    PIP_DEFAULT_TIMEOUT: "120"
  timeout: 300  # Issue #2835: prevent indefinite hang on dependency resolution

- name: Verify OpenVINO installation
  command: "{{ venv_dir }}/bin/python -c 'import openvino; print(openvino.__version__)'"
  register: openvino_version_check
  changed_when: false
  failed_when: openvino_version_check.rc != 0
