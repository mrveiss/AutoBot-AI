---
# Install OpenVINO for NPU/GPU acceleration

- name: Add OpenVINO GPG key
  apt_key:
    url: https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
    state: present

# #7218: idempotent repo-add — preserve device-shipped OpenVINO repo if present
- name: "Add OpenVINO repository (idempotent, #7218)"
  ansible.builtin.include_tasks: ../../_shared/tasks/add_apt_repository_idempotent.yml
  vars:
    apt_repo_match: "apt.repos.intel.com/openvino"
    apt_repo_spec: "deb https://apt.repos.intel.com/openvino/{{ openvino_version }} ubuntu22 main"
    apt_repo_filename: "intel-openvino"
    apt_repo_label: "OpenVINO"

# #6719: bounded shell apt-get update — see roles/nginx/tasks/main.yml.
- name: agent_config openvino | Refresh apt cache after OpenVINO repo add (best-effort, bounded; #6719)
  ansible.builtin.command:
    cmd: >-
      timeout 60 apt-get update -qq
      -o Acquire::Retries=0
      -o Acquire::http::Timeout=10
  become: true
  changed_when: false
  failed_when: false

- name: Install OpenVINO Runtime
  package:
    name: "openvino-{{ openvino_version }}"
    state: present

- name: Check if NPU driver is needed
  stat:
    path: /dev/accel/accel0
  register: npu_device

- name: Install Intel NPU driver
  package:
    name: intel-driver-compiler-npu
    state: present
  when: npu_device.stat.exists

- name: Add service user to render group for GPU access
  user:
    name: "{{ service_user }}"
    groups: render
    append: true

# #14476: had no version floor at all and no constraints file -- looser than
# even the pre-#14449 npu-worker role, which at least said `>=2024.0`.
# #15408: the floor is no longer restated here -- constraints/shared.txt is the
# single source of truth, applied below so no future dependency can drag numpy
# below its pinned floor either.
# #15601: the `-c` fallback derives from `autobot.base_dir`
# (inventory/group_vars/all.yml) rather than restating the install root as a
# literal. An explicit `code_source_dir` override is still honoured -- only the
# default stops being a second copy of a value the SSOT already publishes, so a
# moved base directory cannot leave this role provisioning against the old path
# (the failure shape #14272 records for ai-stack: a wrong constraints path
# aborts the pip run). Same shape as roles/tts-worker (#15599).
#
# #15684: this venv is also filled from the deployed root requirements.txt
# (python_deps.yml), so this restates a package that manifest could declare
# instead -- multi-source, #15671's class of bug. Left as-is rather than
# moved: root requirements.txt is `-r`-included by autobot-backend's own
# manifest (autobot-backend/requirements.txt:66), so adding openvino there
# would pull Intel's NPU runtime into the backend's venv too, which nothing
# in autobot-backend imports. See MULTI_SOURCE_VENVS in
# repo_tests/ansible_manifest_resolution.py for the recorded reason.
# #17246: `code_source` is the controller's git checkout and no task syncs it
# to a node, so this constraints path did not exist here -- the #17242 class,
# caught by the widened detector rather than by another failed provision. The
# file is staged onto the node first and read from there.
- name: "Stage the manifests this node's pip step reads (#17246, #17331)"
  ansible.builtin.include_tasks: ../../_shared/tasks/stage_shared_manifests.yml
  when: not (autobot_shared_manifests_staged | default(false))
  # Tagged `always` for the reason update-all-nodes.yml gives at its own
  # staging task: the staged file is a precondition of the pip step below,
  # so a tag selection that runs the install but not the staging would
  # constrain against a file that is not there. Enumerating the consumer
  # tags would go stale; `always` cannot.
  tags: [always]

- name: Set up OpenVINO environment in venv
  pip:
    name: openvino
    virtualenv: "{{ venv_dir }}"
    # #16641: see roles/browser/tasks/main.yml for the full reason.
    virtualenv_command: "{{ python_interpreter_binary }} -m venv"
    extra_args: "-c {{ autobot.base_dir }}/constraints/shared.txt"
  become_user: "{{ service_user }}"
  environment:
    PIP_DEFAULT_TIMEOUT: "120"
  timeout: 300  # Issue #2835: prevent indefinite hang on dependency resolution

- name: Verify OpenVINO installation
  command: "{{ venv_dir }}/bin/python -c 'import openvino; print(openvino.__version__)'"
  register: openvino_version_check
  changed_when: false
  failed_when: openvino_version_check.rc != 0
