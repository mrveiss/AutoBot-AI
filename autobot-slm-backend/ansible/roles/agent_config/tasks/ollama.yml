---
# Install and configure Ollama

- name: Check if Ollama is installed
  command: which ollama
  register: ollama_check
  # (#2872) Intentional: `which` exits rc=1 when binary is absent;
  # the result gates conditional installation below.
  failed_when: false
  changed_when: false

- name: Download Ollama installer
  get_url:
    url: https://ollama.ai/install.sh
    dest: /tmp/ollama-install.sh
    mode: '0755'
  when: ollama_check.rc != 0

- name: Install Ollama
  shell: /tmp/ollama-install.sh
  when: ollama_check.rc != 0

- name: Start Ollama service
  systemd:
    name: ollama
    state: started
    enabled: true

- name: Pull Ollama models
  command: "ollama pull {{ item }}"
  loop: "{{ ollama_models }}"
  async: 1800
  poll: 0
  register: model_pulls
  changed_when: false

- name: Wait for model downloads
  async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ model_pulls.results }}"
  register: model_pull_results
  until: model_pull_results.finished
  retries: 60
  delay: 30

- name: Check every pulled model is the right kind for its role (#19736)
  ansible.builtin.include_tasks: ../../../_shared/tasks/assert_model_kinds.yml
  vars:
    model_kind_embedding: "{{ ollama_embedding_model }}"
    model_kind_completion: "{{ ollama_models }}"
