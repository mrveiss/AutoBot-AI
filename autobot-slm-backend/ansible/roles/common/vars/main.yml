---
# Common role variables

common_packages:
  - python3
  - python3-pip
  - python3-venv
  - git
  - curl
  - wget
  - vim
  - htop
  - net-tools
  - ufw
  - rsync
  - ca-certificates
  - gnupg
  - lsb-release
  # Network diagnostics (#703)
  - netcat-openbsd
  - iputils-ping
  - dnsutils

autobot_user: autobot
autobot_home: /home/autobot

# Emergency admin user for fallback access when SSH keys fail
emergency_admin_user: autobot_admin
# Password hash MUST come from Ansible Vault (vault_emergency_admin_password_hash)
# or --extra-vars. Never hardcode hashes in version control (#2853).
emergency_admin_password_hash: "{{ vault_emergency_admin_password_hash | default(omit) }}"

autobot_directories:
  - "{{ autobot_home }}/autobot-vue"
  - "{{ autobot_home }}/backend"
  - "{{ autobot_home }}/logs"
  - "{{ autobot_home }}/data"
  - "{{ autobot_home }}/config"
  - "{{ autobot_home }}/scripts"
  - "/var/log/autobot"
