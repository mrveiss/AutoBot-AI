# Shared dependency role: nginx
# Installs nginx and ensures service is running.
# Vhost configuration stays in service roles (slm_manager, backend, frontend).
---

# #6719: refresh apt cache via shell-bounded apt-get update.
# Why not `apt: update_cache=true cache_valid_time=3600`:
#   - cache_valid_time only skips refresh when cache is fresh; once stale, the
#     module still runs full apt-get update and aborts on any partial-fetch
#     warning ("Failed to update apt cache: unknown reason"). A flaky third-
#     party PPA (Launchpad ansible/deadsnakes, nvidia.github.io, etc.) takes
#     down the whole deploy.
#   - apt-get update via the CLI exits 0 with `W: Failed to fetch ...` for
#     unreachable sources — the cache is updated for everything that did
#     reach. That is the correct semantics for our use case.
# Bounds:
#   - timeout 60s : prevents the multi-minute TCP-retry hang we saw on flaky
#     IPv6 routes to Launchpad.
#   - Acquire::Retries=0 : disables apt's per-repo 3x backoff.
#   - Acquire::http::Timeout=10 : per-request HTTP timeout.
#   - failed_when: false : ignore the exit code; the next apt task will
#     surface a real error if the cache is genuinely broken (e.g. nginx
#     metadata missing entirely).
- name: "nginx | Refresh apt cache (best-effort, bounded; #6719)"
  ansible.builtin.command:
    cmd: >-
      timeout 60 apt-get update -qq
      -o Acquire::Retries=0
      -o Acquire::http::Timeout=10
  become: true
  changed_when: false
  failed_when: false
  tags: ['deps', 'nginx']

- name: "nginx | Install nginx"
  ansible.builtin.apt:
    name: nginx
    state: present
  become: true
  tags: ['deps', 'nginx']

# #16020: nginx must not be started before the keypair its config references
# exists. Every AutoBot nginx vhost carries `ssl_certificate
# /etc/autobot/certs/server-cert.pem`, and `nginx -t` runs in ExecStartPre --
# so a missing cert is not a degraded start, it is a unit that can never come
# up. Observed on a VNC node: six consecutive failed restarts over ten hours,
# each ending `[emerg] cannot load certificate ... No such file or directory`,
# every one of them failing the manage-service play that requested it.
#
# This role previously did three things -- refresh apt, install nginx, start it
# -- and starting was the only one that could fail for a reason outside itself.
- name: "nginx | Ensure the shared node TLS keypair exists (#16020)"
  ansible.builtin.include_tasks: ../../../_shared/tasks/ensure_node_tls_cert.yml
  tags: ['deps', 'nginx']

- name: "nginx | Ensure service is enabled and running"
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  become: true
  tags: ['deps', 'nginx']
