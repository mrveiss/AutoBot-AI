# Frontend role handlers

# #16979 (PR review): ansible runs notified handlers in DEFINITION order, not
# notify order -- `test nginx config` must be listed before `restart nginx`
# (which despite its name only reloads, state: reloaded) or a bad render gets
# reloaded before nginx -t ever runs. A failing `nginx -t` here fails this
# handler task, which aborts the play for this host before any later handler
# (including restart nginx) runs -- no ignore_errors/failed_when on this
# handler, so that stop-the-reload behaviour needs no extra code, only this
# order. Mirrors roles/slm_manager/handlers/main.yml, which already lists
# `test nginx config` before its own `reload nginx`/`restart nginx`.
- name: test nginx config
  command: nginx -t
  become: true

- name: restart nginx
  systemd:
    name: nginx
    state: reloaded
  become: true

- name: restart frontend
  systemd:
    name: autobot-frontend
    state: restarted
  become: true
  # (#2872) Intentional: autobot-frontend service may not exist on hosts
  # that serve only the static build via nginx (no dev server).  Handler
  # is notified from tasks that conditionally deploy the unit file.
  failed_when: false

- name: reload systemd
  systemd:
    daemon_reload: true
  become: true

- name: reload firewall
  ufw:
    state: reloaded
  become: true
