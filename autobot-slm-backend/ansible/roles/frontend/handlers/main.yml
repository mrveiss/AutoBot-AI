---
# Frontend role handlers

- name: restart nginx
  systemd:
    name: nginx
    state: reloaded
  become: true

- name: test nginx config
  command: nginx -t
  become: true

- name: restart frontend
  systemd:
    name: autobot-frontend
    state: restarted
  become: true
  # (#2872) Intentional: autobot-frontend service may not exist on hosts
  # that serve only the static build via nginx (no dev server).  Handler
  # is notified from tasks that conditionally deploy the unit file.
  failed_when: false

- name: reload systemd
  systemd:
    daemon_reload: true
  become: true

- name: reload firewall
  ufw:
    state: reloaded
  become: true
