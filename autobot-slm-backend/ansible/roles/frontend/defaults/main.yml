---
# Frontend configuration defaults  (#926 Phase 4: service account created, migration in Phase 7)
network_subnet: "{{ (lookup('env', 'NETWORK_SUBNET') | trim) or (lookup('pipe', 'grep -oP \"NETWORK_SUBNET=\\K.*\" /etc/autobot/slm-secrets.env 2>/dev/null || true') | trim) or undef(hint='network_subnet is unset: set NETWORK_SUBNET in the environment or in /etc/autobot/slm-secrets.env. It is a firewall source, so it never falls back to an open range (#17642)') }}"
frontend_service_account: autobot-frontend  # Phase 7: migrate service to run as this account
frontend_user: autobot
frontend_group: autobot
frontend_install_dir: "{{ autobot.base_dir }}"
frontend_log_dir: /var/log/autobot

# Deployment
frontend_repo_url: "https://github.com/mrveiss/AutoBot-AI.git"
frontend_version: main
frontend_deploy_from_git: true
frontend_build_production: false

# Node.js
nodejs_version: "{{ node_major }}"

# Server settings
# nginx HTTPS port (the served URL). frontend_port (vars/main.yml) is the Vite dev port only (#19326).
frontend_tls_port: 443
nginx_http_port: 80

# Backend connection (user backend on main machine)
# Backend runs on HTTPS port 8443 with SSL certificates
# backend_host and backend_port are set dynamically by
# _build_infra_vars() in setup_wizard.py at provisioning time
#
# #10348: default to EMPTY = relative same-origin /api. nginx serves the SPA and
# proxies /api to the backend, so the browser must call the SAME origin it loaded
# from — an absolute base (esp. one built from backend_host, which is the 0.0.0.0
# BIND address) is a different origin that CSP `connect-src 'self'` blocks, making
# the whole GUI unusable. Only set an absolute URL when the frontend is genuinely
# served from a different origin than the backend (and add it to CSP connect-src).
frontend_backend_url: ""

# #19832: SLM backend behind /slm/api (unified UI, epic #19829, ADR-011).
# Two shapes, chosen by whether slm_host (the inventory's SLM address; install.sh records the
# machine's LAN address there) is one of THIS node's addresses:
#   same machine -> plain HTTP to the loopback uvicorn (slm_manager binds slm_backend_host
#                   127.0.0.1), /slm/api/x becomes /api/x;
#   separate SLM -> HTTPS to the SLM's nginx vhost on slm_nginx_tls_port, keeping /slm/api/x
#                   (that vhost already serves it). No uvicorn bind or firewall change: 443 is
#                   already open on the SLM. The certificate is verified against the fleet CA
#                   (ca-cert.pem beside this node's own cert, distribute-tls-certs.yml).
# The port numbers are the SSOT group_vars (slm_backend_port, slm_nginx_tls_port).
#
# Placement is decided WITHOUT depending on gathered facts: update-all-nodes.yml Play 2 runs
# gather_facts:false, so ansible_facts is empty there. Three verdicts:
#   local     -- slm_host is unset or one of this node's identities (loopback, ansible_host,
#                inventory_hostname, and the gathered addresses/hostname when facts exist), or
#                slm_colocated_frontend is true.
#   remote    -- certain: slm_host is an IP literal and either facts are gathered and it is not one
#                of this node's addresses, or ansible_host is also a non-loopback IP literal on a
#                non-local connection and differs from it.
#   ambiguous -- cannot tell (hostnames vs addresses, a loopback/local-connection ansible_host
#                with no facts). tasks/code_only.yml settles it from the filesystem: remote only
#                when the fleet CA is present, otherwise local; an ambiguous node never fails.
frontend_slm_node_identities: >-
  {{ ['127.0.0.1', '::1', 'localhost', ansible_host | default(''), inventory_hostname | default('')]
     + (ansible_facts['all_ipv4_addresses'] | default([]))
     + [ansible_facts['hostname'] | default(''), ansible_facts['fqdn'] | default('')] }}
frontend_slm_host_is_ip: >-
  {{ (slm_host | default('127.0.0.1')) is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}$') or ':' in (slm_host | default('127.0.0.1')) }}
frontend_slm_ansible_host_is_remote_ip: >-
  {{ (ansible_host | default('')) is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}$')
     and not (ansible_host | default('')) is match('^127[.]')
     and (ansible_connection | default('ssh')) not in ['local', 'localhost'] }}
frontend_slm_placement: >-
  {%- if (slm_colocated_frontend | default(false) | bool) or (slm_host | default('127.0.0.1')) in frontend_slm_node_identities -%}local
  {%- elif not (frontend_slm_host_is_ip | bool) -%}ambiguous
  {%- elif (ansible_facts['all_ipv4_addresses'] | default([])) | length > 0 -%}remote
  {%- elif frontend_slm_ansible_host_is_remote_ip | bool -%}remote
  {%- else -%}ambiguous{%- endif -%}
frontend_slm_backend_remote: "{{ frontend_slm_placement == 'remote' }}"
frontend_slm_backend_host: "{{ slm_host if (frontend_slm_backend_remote | bool) else '127.0.0.1' }}"
frontend_slm_backend_port: "{{ slm_nginx_tls_port if (frontend_slm_backend_remote | bool) else slm_backend_port }}"
frontend_slm_backend_protocol: "{{ 'https' if (frontend_slm_backend_remote | bool) else 'http' }}"
# Upstream path prefix of /slm/api/: stripped to /api/ for uvicorn, kept for the SLM's nginx.
frontend_slm_upstream_prefix: "{{ '/slm/api/' if (frontend_slm_backend_remote | bool) else '/api/' }}"
frontend_slm_ca_cert: "{{ frontend_tls_cert_dir }}/ca-cert.pem"
# Request-body cap on /slm/api/: the SLM vhost's own cap (agent event sync, #1090), one value.
frontend_slm_client_max_body_size: "{{ slm_client_max_body_size }}"

# Issue #1098: Backend upstream health tracking
backend_max_fails: 3
backend_fail_timeout: "30s"

# TLS Configuration
frontend_tls_cert_dir: "{{ autobot_tls_remote_cert_dir | default('/etc/autobot/certs') }}"  # #19366
frontend_tls_cert: "{{ frontend_tls_cert_dir }}/server-cert.pem"
frontend_tls_key: "{{ frontend_tls_cert_dir }}/server-key.pem"

# Frontend app directory. #15603: `current` is the atomically-flipped symlink
# roles/_shared/tasks/build_publish_slm_frontend.yml publishes (mirroring the
# SLM frontend's own `current` since #15610) — not a directory vite empties
# and refills in place. Every other reference to this variable only ever
# does `| dirname` on it to reach the package directory, which resolves
# identically regardless of the leaf name, so this is the one place the
# meaning actually changes.
frontend_dist_dir: "{{ frontend_install_dir }}/autobot-frontend/current"
