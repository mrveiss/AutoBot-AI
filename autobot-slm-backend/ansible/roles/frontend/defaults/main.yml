---
# Frontend configuration defaults  (#926 Phase 4: service account created, migration in Phase 7)
network_subnet: "{{ (lookup('env', 'NETWORK_SUBNET') | trim) or (lookup('pipe', 'grep -oP \"NETWORK_SUBNET=\\K.*\" /etc/autobot/slm-secrets.env 2>/dev/null || true') | trim) or undef(hint='network_subnet is unset: set NETWORK_SUBNET in the environment or in /etc/autobot/slm-secrets.env. It is a firewall source, so it never falls back to an open range (#17642)') }}"
frontend_service_account: autobot-frontend  # Phase 7: migrate service to run as this account
frontend_user: autobot
frontend_group: autobot
frontend_install_dir: "{{ autobot.base_dir }}"
frontend_log_dir: /var/log/autobot

# Deployment
frontend_repo_url: "https://github.com/mrveiss/AutoBot-AI.git"
frontend_version: main
frontend_deploy_from_git: true
frontend_build_production: false

# Node.js
nodejs_version: "{{ node_major }}"

# Server settings
# nginx HTTPS port (the served URL). frontend_port (vars/main.yml) is the Vite dev port only (#19326).
frontend_tls_port: 443
nginx_http_port: 80

# Backend connection (user backend on main machine)
# Backend runs on HTTPS port 8443 with SSL certificates
# backend_host and backend_port are set dynamically by
# _build_infra_vars() in setup_wizard.py at provisioning time
#
# #10348: default to EMPTY = relative same-origin /api. nginx serves the SPA and
# proxies /api to the backend, so the browser must call the SAME origin it loaded
# from — an absolute base (esp. one built from backend_host, which is the 0.0.0.0
# BIND address) is a different origin that CSP `connect-src 'self'` blocks, making
# the whole GUI unusable. Only set an absolute URL when the frontend is genuinely
# served from a different origin than the backend (and add it to CSP connect-src).
frontend_backend_url: ""

# #19832: SLM backend behind /slm/api (unified UI, epic #19829). The SLM backend can
# run on this host or on its own machine; the host is the inventory's slm_host and the
# port the SSOT slm_backend_port (inventory/group_vars/all.yml, the one authority). The SLM uvicorn speaks plain HTTP.
frontend_slm_backend_host: "{{ slm_host | default('127.0.0.1') }}"
frontend_slm_backend_port: "{{ slm_backend_port }}"
frontend_slm_backend_protocol: http

# Issue #1098: Backend upstream health tracking
backend_max_fails: 3
backend_fail_timeout: "30s"

# TLS Configuration
frontend_tls_cert_dir: "{{ autobot_tls_remote_cert_dir | default('/etc/autobot/certs') }}"  # #19366
frontend_tls_cert: "{{ frontend_tls_cert_dir }}/server-cert.pem"
frontend_tls_key: "{{ frontend_tls_cert_dir }}/server-key.pem"

# Frontend app directory. #15603: `current` is the atomically-flipped symlink
# roles/_shared/tasks/build_publish_slm_frontend.yml publishes (mirroring the
# SLM frontend's own `current` since #15610) — not a directory vite empties
# and refills in place. Every other reference to this variable only ever
# does `| dirname` on it to reach the package directory, which resolves
# identically regardless of the leaf name, so this is the one place the
# meaning actually changes.
frontend_dist_dir: "{{ frontend_install_dir }}/autobot-frontend/current"
