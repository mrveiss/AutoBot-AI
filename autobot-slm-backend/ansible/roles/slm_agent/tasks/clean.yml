---
# SLM Agent role - Phase 1 CLEAN task (#926 Phase 4)
# Removes stale agent code copied to wrong paths on any node.
# The legacy autobot-agent.service is already cleaned in main.yml (#917).
#
# All deletions target LEGACY agent paths only (agent, slm-agent,
# /opt/slm-agent). No cross-role directories are touched, so no
# node_roles guards are needed (#2836).

- name: "SLM Agent | Clean: legacy flat agent dir at /opt/autobot/agent"
  ansible.builtin.file:
    path: /opt/autobot/agent
    state: absent
  tags: ['clean']

- name: "SLM Agent | Clean: legacy slm-agent dir at /opt/autobot/slm-agent"
  ansible.builtin.file:
    path: /opt/autobot/slm-agent
    state: absent
  tags: ['clean']

# Issue #1163: Remove symlink workaround before deploying real directory
- name: "SLM Agent | Clean: stat canonical agent dir (detect symlink)"
  ansible.builtin.stat:
    path: "{{ slm_agent_dir }}"
    follow: false
  register: slm_agent_dir_stat
  tags: ['clean']

- name: "SLM Agent | Clean: remove symlink at canonical path (replaced by real dir)"
  ansible.builtin.file:
    path: "{{ slm_agent_dir }}"
    state: absent
  when: slm_agent_dir_stat.stat.exists and slm_agent_dir_stat.stat.islnk
  become: true
  tags: ['clean']

- name: "SLM Agent | Clean: pre-#1129 flat install at /opt/slm-agent"
  ansible.builtin.file:
    path: /opt/slm-agent
    state: absent
  become: true
  tags: ['clean']

# #11508: a stale, hand-created systemd drop-in repointed the agent's ExecStart
# interpreter at the SLM backend venv (/opt/autobot/autobot-slm-backend/venv/bin/
# python). That venv has no aiohttp, so a fresh restart crash-looped
# (ModuleNotFoundError: No module named 'aiohttp'). The role owns the agent
# runtime on the SYSTEM interpreter (see slm-agent.service.j2 + the redis dep in
# defaults) — remove the override so the base unit's ExecStart is authoritative.
# Ansible manages this on-box artifact (it is NOT tracked in the repo); the
# systemd reload/restart later in main.yml picks up the change.
- name: "SLM Agent | Clean: remove stale pythonpath.conf systemd drop-in (#11508)"
  ansible.builtin.file:
    path: /etc/systemd/system/slm-agent.service.d/pythonpath.conf
    state: absent
  become: true
  notify:
    - Reload systemd
    - Restart SLM agent
  tags: ['clean', 'systemd']
