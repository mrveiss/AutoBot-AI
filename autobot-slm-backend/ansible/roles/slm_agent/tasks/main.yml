---
# SLM Agent Role - Main Tasks
# Deploys the SLM node agent as a systemd service

# ============================================================
# Phase 1 CLEAN - remove legacy/wrong-node dirs  (#926 Phase 4)
# ============================================================
- name: "SLM Agent | Include clean tasks"
  ansible.builtin.import_tasks: clean.yml
  tags: ['clean']

- name: "SLM Agent | Validate required variables"
  assert:
    that:
      - slm_node_id is defined
      - slm_node_id | length > 0
    fail_msg: "slm_node_id must be defined for each host"
  tags: ['slm_agent', 'validate']

# Clean up legacy autobot-agent.service that predated this role (#917)
- name: "SLM Agent | Check if legacy autobot-agent.service exists"
  ansible.builtin.stat:
    path: /etc/systemd/system/autobot-agent.service
  register: legacy_agent_unit
  tags: ['slm_agent', 'cleanup']

- name: "SLM Agent | Stop and disable legacy autobot-agent.service"
  ansible.builtin.systemd:
    name: autobot-agent
    state: stopped
    enabled: false
    daemon_reload: true
  when: legacy_agent_unit.stat.exists
  # (#2872) Intentional: legacy service may already be stopped/disabled;
  # this is cleanup of a previous service name (#917).
  failed_when: false
  become: true
  tags: ['slm_agent', 'cleanup']

- name: "SLM Agent | Remove legacy autobot-agent.service unit file"
  ansible.builtin.file:
    path: /etc/systemd/system/autobot-agent.service
    state: absent
  when: legacy_agent_unit.stat.exists
  become: true
  notify: Reload systemd
  tags: ['slm_agent', 'cleanup']

- name: "SLM Agent | Add agent user to systemd-journal group for log access"
  ansible.builtin.user:
    name: "{{ slm_agent_user }}"
    groups: systemd-journal
    append: true
  become: true
  tags: ['slm_agent', 'setup']

- name: "SLM Agent | Ensure ansible.log is readable by agent user (GH#8925-2)"
  ansible.builtin.acl:
    path: /var/log/autobot/ansible.log
    entity: "{{ slm_agent_user }}"
    etype: user
    permissions: r
    state: present
  become: true
  # (#2872) Intentional: file may not exist yet on first provisioning;
  # ACL is applied if/when the file is created. On systems without ACL
  # support, the task is skipped gracefully.
  failed_when: false
  tags: ['slm_agent', 'setup']

- name: "SLM Agent | Create agent directories"
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ slm_agent_user }}"
    group: "{{ slm_agent_group }}"
    mode: '0755'
  loop:
    - "{{ slm_agent_dir }}"
    - "{{ slm_agent_dir }}/slm"
    - "{{ slm_agent_dir }}/slm/agent"
    - "{{ slm_agent_data_dir }}"
  become: true
  tags: ['slm_agent', 'directories']

# Issue #741: Version tracking - Get git commit and deploy version.json
- name: "SLM Agent | Get current git commit hash"
  delegate_to: localhost
  run_once: true
  become: false
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "{{ playbook_dir }}/../../.."
  register: git_commit_result
  changed_when: false
  # (#2872) Intentional: git may not be available on the Ansible controller
  # (e.g. container-based CI); version falls back to 'unknown'.
  failed_when: false
  tags: ['slm_agent', 'version']

- name: "SLM Agent | Set git commit fact"
  ansible.builtin.set_fact:
    git_commit: "{{ git_commit_result.stdout | default('unknown') }}"
  tags: ['slm_agent', 'version']

- name: "SLM Agent | Deploy version.json"
  ansible.builtin.template:
    src: version.json.j2
    dest: "{{ slm_agent_data_dir }}/version.json"
    owner: "{{ slm_agent_user }}"
    group: "{{ slm_agent_group }}"
    mode: '0644'
  become: true
  tags: ['slm_agent', 'version']

- name: "SLM Agent | Ensure python3-venv is present (#14278)"
  ansible.builtin.package:
    name: python3-venv
    state: present
  become: true
  tags: ['slm_agent', 'packages']

# #14278: into a venv, not system Python. Every other component on the platform
# already works this way (ai-stack, npu-worker, tts-worker, slm-backend); the
# agent was the only exception, and it is the one that could not be provisioned
# on a node whose distro owns one of its transitive dependencies.
#
# `--break-system-packages` is gone with it: inside a venv it is neither needed
# nor meaningful.
- name: "SLM Agent | Install Python dependencies into the agent venv (#14278)"
  ansible.builtin.pip:
    name: "{{ slm_agent_python_packages }}"
    state: present
    virtualenv: "{{ slm_agent_venv }}"
    virtualenv_command: python3 -m venv
  become: true
  become_user: "{{ slm_agent_user }}"
  environment:
    PIP_DEFAULT_TIMEOUT: "120"
  timeout: 300  # Issue #2835: prevent indefinite hang on dependency resolution
  tags: ['slm_agent', 'packages']

- name: "SLM Agent | Copy agent source - __init__.py (slm package)"
  copy:
    content: |
      # AutoBot - AI-Powered Automation Platform
      # Copyright (c) 2025 mrveiss
      # Author: mrveiss
      """SLM Package."""
    dest: "{{ slm_agent_dir }}/slm/__init__.py"
    owner: "{{ slm_agent_user }}"
    group: "{{ slm_agent_group }}"
    mode: '0644'
  become: true
  notify: Restart SLM agent
  tags: ['slm_agent', 'deploy']

- name: "SLM Agent | Copy agent source - __init__.py (agent module)"
  copy:
    src: slm/agent/__init__.py
    dest: "{{ slm_agent_dir }}/slm/agent/__init__.py"
    owner: "{{ slm_agent_user }}"
    group: "{{ slm_agent_group }}"
    mode: '0644'
  become: true
  notify: Restart SLM agent
  tags: ['slm_agent', 'deploy']

- name: "SLM Agent | Copy agent source - agent.py"
  copy:
    src: slm/agent/agent.py
    dest: "{{ slm_agent_dir }}/slm/agent/agent.py"
    owner: "{{ slm_agent_user }}"
    group: "{{ slm_agent_group }}"
    mode: '0644'
  become: true
  notify: Restart SLM agent
  tags: ['slm_agent', 'deploy']

- name: "SLM Agent | Copy agent source - health_collector.py"
  copy:
    src: slm/agent/health_collector.py
    dest: "{{ slm_agent_dir }}/slm/agent/health_collector.py"
    owner: "{{ slm_agent_user }}"
    group: "{{ slm_agent_group }}"
    mode: '0644'
  become: true
  notify: Restart SLM agent
  tags: ['slm_agent', 'deploy']

# Issue #741: Deploy version tracking module
- name: "SLM Agent | Copy agent source - version.py"
  copy:
    src: slm/agent/version.py
    dest: "{{ slm_agent_dir }}/slm/agent/version.py"
    owner: "{{ slm_agent_user }}"
    group: "{{ slm_agent_group }}"
    mode: '0644'
  become: true
  notify: Restart SLM agent
  tags: ['slm_agent', 'deploy']

# Issue #1164: Deploy role detection modules (added after #779)
- name: "SLM Agent | Copy agent source - role_detector.py"
  copy:
    src: slm/agent/role_detector.py
    dest: "{{ slm_agent_dir }}/slm/agent/role_detector.py"
    owner: "{{ slm_agent_user }}"
    group: "{{ slm_agent_group }}"
    mode: '0644'
  become: true
  notify: Restart SLM agent
  tags: ['slm_agent', 'deploy']

- name: "SLM Agent | Copy agent source - port_scanner.py"
  copy:
    src: slm/agent/port_scanner.py
    dest: "{{ slm_agent_dir }}/slm/agent/port_scanner.py"
    owner: "{{ slm_agent_user }}"
    group: "{{ slm_agent_group }}"
    mode: '0644'
  become: true
  notify: Restart SLM agent
  tags: ['slm_agent', 'deploy']

- name: "SLM Agent | Deploy agent configuration"
  template:
    src: agent-config.yaml.j2
    dest: "{{ slm_agent_dir }}/config.yaml"
    owner: "{{ slm_agent_user }}"
    group: "{{ slm_agent_group }}"
    mode: '0640'
  become: true
  notify: Restart SLM agent
  tags: ['slm_agent', 'config']

# Issue #1129: Role metadata for SLM role registry / portability
- name: "SLM Agent | Deploy role.json metadata"
  template:
    src: role.json.j2
    dest: "{{ slm_agent_dir }}/role.json"
    owner: "{{ slm_agent_user }}"
    group: "{{ slm_agent_group }}"
    mode: '0644'
  become: true
  tags: ['slm_agent', 'deploy', 'role-meta']

# #11450: the agent authenticates its heartbeat/events/code-sync/roles calls
# with the shared AUTOBOT_INTERNAL_API_KEY. Write it to a 0600 EnvironmentFile
# (loaded by the unit) rather than baking the secret into the world-readable
# .service unit.
#
# #11480 review: the `autobot_internal_api_key` var is NOT supplied on the
# self-update / provision-fleet / deploy-slm-agent import paths, so relying on
# it alone wrote the file EMPTY and the agent still 401'd. Resolve the key from,
# in order: the ansible var (provision extra_var) → the node's own
# slm-secrets.env → autobot-backend.env (both already carry the key, #10263/
# #10492). Remote agent-only nodes without either file get an empty key and the
# agent logs the #11450 401 hint until the key is provisioned.
# #14350: read the SLM's OWN key first, from the control node.
#
# The agent authenticates its heartbeat AGAINST the SLM backend, which loads
# /etc/autobot/slm-secrets.env. That file is therefore the only source of truth
# for what the agent's key must be. It is read from the SLM manager as resolved
# from inventory group membership, not from whatever host happens to be driving
# the play.
#
# The two values this replaces as the primary source were each wrong in a
# different direction, and the repo has an issue for both:
#
#   * the `autobot_internal_api_key` var carries the MANAGED BACKEND's key,
#     which drifted from the SLM's on some installs — #11507 / #11450.
#   * the NODE's own copy is a cache of whatever was current at enrollment. When
#     it goes stale, every redeploy faithfully rewrites the stale value and the
#     manager cannot correct it — the agent 401s forever (#14350). The repair
#     mechanism was reading its input from the thing that needed repairing.
#
# Failure here is not fatal: an empty result falls through to the previous
# order, so a control node without the file behaves exactly as before.
- name: "SLM Agent | Read the SLM's own AUTOBOT_INTERNAL_API_KEY (authoritative) (#14350)"
  ansible.builtin.shell: >-
    set -o pipefail;
    f=/etc/autobot/slm-secrets.env;
    if [ -r "$f" ]; then
      grep -m1 '^AUTOBOT_INTERNAL_API_KEY=' "$f" | cut -d= -f2-;
    fi
  args:
    executable: /bin/bash
  # Review of #14350: NOT `localhost`. That would read whichever machine
  # invoked ansible-playbook, which is the SLM only by convention -- the
  # repo's own runbooks disagree on whether a fleet update may be driven from
  # a dev box, and any host carrying the slm_manager role has its own
  # slm-secrets.env. Reading the wrong one here would OUTRANK the node's
  # correct key, which is worse than the bug being fixed.
  #
  # `slm_manager_inventory_host` resolves the SLM from group membership
  # (group_vars/all.yml, #9956) and is already used this way by
  # playbooks/setup-internal-ca.yml.
  delegate_to: "{{ slm_manager_inventory_host }}"
  become: true
  register: _slm_own_key
  changed_when: false
  failed_when: false
  no_log: true
  tags: ['slm_agent', 'systemd', 'secrets']

- name: "SLM Agent | Read AUTOBOT_INTERNAL_API_KEY from node secrets (fallback when var unset) (#11480)"
  ansible.builtin.shell: >-
    set -o pipefail;
    for f in /etc/autobot/slm-secrets.env /etc/autobot/autobot-backend.env; do
      if [ -r "$f" ]; then
        v=$(grep -m1 '^AUTOBOT_INTERNAL_API_KEY=' "$f" | cut -d= -f2-);
        if [ -n "$v" ]; then printf '%s' "$v"; exit 0; fi;
      fi;
    done
  args:
    executable: /bin/bash
  become: true
  register: _agent_key_from_node
  changed_when: false
  failed_when: false
  no_log: true
  tags: ['slm_agent', 'systemd', 'secrets']

- name: "SLM Agent | Resolve effective internal API key (SLM slm-secrets.env wins) (#11450 #11507)"
  ansible.builtin.set_fact:
    # Order, most authoritative first (#14350):
    #   1. the SLM's OWN slm-secrets.env, read from the control node. The agent
    #      authenticates against the SLM, so this is what the key must equal.
    #   2. the node's own secrets file — the previous primary. Kept as a
    #      fallback for a control node that cannot read its own key, but it is
    #      no longer allowed to WIN: a stale copy there is unfixable by any
    #      redeploy, which is the #14350 failure.
    #   3. the autobot_internal_api_key var, which reflects the managed
    #      backend's key and has drifted from the SLM's on some installs
    #      (#11507) — last, for the same reason it was demoted originally.
    _agent_internal_api_key: >-
      {{ (_slm_own_key.stdout | default('') | trim)
         or (_agent_key_from_node.stdout | default('') | trim)
         or (autobot_internal_api_key | default('') | trim) }}
  no_log: true
  tags: ['slm_agent', 'systemd', 'secrets']

- name: "SLM Agent | Deploy agent secrets EnvironmentFile (#11450)"
  ansible.builtin.copy:
    content: |
      # Managed by Ansible - do not edit manually
      AUTOBOT_INTERNAL_API_KEY={{ _agent_internal_api_key }}
    dest: "{{ slm_agent_data_dir }}/agent-secrets.env"
    owner: "{{ slm_agent_user }}"
    group: "{{ slm_agent_group }}"
    mode: '0600'
  become: true
  no_log: true
  notify: Restart SLM agent
  tags: ['slm_agent', 'systemd', 'secrets']

- name: "SLM Agent | Warn when no internal API key could be resolved (#11480)"
  ansible.builtin.debug:
    msg: >-
      WARNING: no AUTOBOT_INTERNAL_API_KEY resolved for {{ inventory_hostname }}
      (no var, no slm-secrets.env / autobot-backend.env) — agent heartbeats will
      401 until the key is provisioned (#11450).
  when: not (_agent_internal_api_key | trim)
  tags: ['slm_agent', 'systemd', 'secrets']

- name: "SLM Agent | Deploy systemd service unit"
  template:
    src: slm-agent.service.j2
    dest: /etc/systemd/system/slm-agent.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify:
    - Reload systemd
    - Restart SLM agent
  tags: ['slm_agent', 'systemd']

- name: "SLM Agent | Configure firewall - Allow admin heartbeat port"
  ufw:
    rule: allow
    from_ip: "{{ slm_admin_url | regex_replace('^https?://([^:/]+).*$', '\\1') }}"
    port: "{{ slm_agent_api_port | default('8444') }}"
    proto: tcp
    comment: "SLM Agent API"
  become: true
  when: slm_agent_api_port is defined
  tags: ['slm_agent', 'firewall']

- name: "SLM Agent | Enable and start service"
  systemd:
    name: slm-agent
    enabled: true
    state: started
    daemon_reload: true
  become: true
  tags: ['slm_agent', 'service']

- name: "SLM Agent | Wait for agent to start"
  wait_for:
    timeout: 5
  tags: ['slm_agent', 'service']

- name: "SLM Agent | Verify agent is running"
  systemd:
    name: slm-agent
  register: slm_agent_status
  become: true
  tags: ['slm_agent', 'verify']

# General fleet monitoring - node_exporter on every managed node (#945)
- name: "SLM Agent | Install node_exporter"
  ansible.builtin.import_tasks: node_exporter.yml
  tags: ['slm_agent', 'node_exporter']

- name: "SLM Agent | Display deployment summary"
  debug:
    msg:
      - "=== SLM Agent Deployment Complete ==="
      - "Node ID: {{ slm_node_id }}"
      - "Admin URL: {{ slm_admin_url }}"
      - "Heartbeat Interval: {{ slm_heartbeat_interval }}s"
      - "Agent Directory: {{ slm_agent_dir }}"
      - "Data Directory: {{ slm_agent_data_dir }}"
      - "Version: {{ slm_agent_version | default(git_commit, true) | default('unknown', true) }}"
      - "Services Monitored: {{ slm_services_to_monitor | join(', ') | default('None') }}"
      - "Service Status: {{ slm_agent_status.status.ActiveState }}"
  tags: ['slm_agent', 'report']
