---
# SLM Agent Role - Default Variables
# Override these in inventory or playbook variables

# Admin connectivity
# slm_host must be provided by inventory or via -e.  The setup wizard
# injects it from settings.external_url (#2747); static inventories derive
# it from hostvars['autobot-slm']['ansible_host'].  The loopback fallback
# here is intentionally safe: it triggers an obvious connection failure
# rather than silently routing to a different machine's IP.
# SLM API is always at /slm/api/ regardless of co-location mode (#3268).
# In co-located mode, nginx routes /api/ to the user backend; /slm/api/ reaches SLM.
# In standalone mode, nginx exposes both /api/ and /slm/api/ as aliases to SLM.
# Using /slm consistently means all agents (local + remote) work in both modes.
slm_admin_url: "https://{{ slm_host | default('127.0.0.1') }}/slm"
slm_heartbeat_interval: 30

# Agent user/group (should match common role's autobot user)
slm_agent_user: autobot
slm_agent_group: autobot

# Installation directories (#1121/#1129: role-centric layout under /opt/autobot/)
slm_agent_dir: /opt/autobot/autobot-slm-agent
# #14278: the agent's dependencies live in their own venv. Installing them into
# system Python with --break-system-packages fails on any node whose distro owns
# a transitive dependency: pip may write to the system environment but cannot
# uninstall what dpkg installed, so an upgrade of e.g. typing_extensions aborts
# provisioning with "RECORD file not found. The package was installed by debian."
slm_agent_venv: "{{ slm_agent_dir }}/venv"
slm_agent_data_dir: /var/lib/slm-agent

# Python dependencies for the agent (#11508)
# #14278: the agent runs on its OWN venv (slm_agent_venv, see the unit's
# ExecStart), and MUST have every module it + autobot_shared import on that ONE
# interpreter — it borrows from neither the SLM backend venv nor system Python.
# A clean venv inherits nothing, so anything the import chain touches has to be
# listed here explicitly; under system Python some of it was satisfied by
# whatever apt happened to have installed.
#   - aiohttp: agent.py HTTP client/server
#   - psutil:  health_collector resource metrics
#   - redis:   autobot_shared.redis_client (health_collector.py imports it at
#              module load) — was MISSING here, so a fresh restart on the system
#              python crash-looped with ModuleNotFoundError: No module named 'redis'.
#   - pydantic-settings / sqlalchemy: autobot_shared transitive deps (its config +
#              DB modules, per autobot_shared/pyproject.toml). The agent imports
#              autobot_shared, so these load at agent startup — MISSING here caused
#              the same ModuleNotFoundError crash-loop on 2026-07-23 (#12142).
slm_agent_python_packages:
  - aiohttp
  - psutil
  - redis
  - pydantic-settings
  - sqlalchemy
  # #14278: required by the agent's own import chain, and previously satisfied by
  # accident because system Python usually has the distro's python3-yaml. A clean
  # venv has nothing, so without this the unit crash-loops on
  # ModuleNotFoundError before SLMAgent.run() is reached:
  #   slm/agent/__init__.py -> health_collector -> autobot_shared.redis_client
  #   -> autobot_shared.redis_management.config -> import yaml
  # autobot_shared/pyproject.toml declares pyyaml>=6.0.3 for exactly this reason.
  - pyyaml

# Services to monitor (systemd service names)
# Override per-host in inventory, e.g.:
#   slm_services_to_monitor:
#     - redis-stack-server
#     - nginx
slm_services_to_monitor: []

# Port checks (optional)
# Format: [{"host": "localhost", "port": 6379}]
slm_ports_to_check: []

# Logging configuration
slm_agent_log_level: INFO
slm_agent_debug: false

# Systemd service configuration
slm_agent_restart_sec: 10
slm_agent_watchdog_sec: 60

# Node Exporter (general fleet monitoring, issue #945)
node_exporter_version: "1.7.0"
node_exporter_port: 9100

# Issue #741: Version tracking
# Set this to override the git commit (e.g., for releases)
# When empty, the current git commit hash is auto-detected
slm_agent_version: ""

# Redis connection (Issue #9226)
# Agent imports from autobot_shared which requires REDIS_HOST set
slm_agent_redis_host: "{{ redis_host | default('127.0.0.1') }}"
