---
# SLM Agent Role - Handlers

- name: Reload systemd
  systemd:
    daemon_reload: true
  become: true

- name: Restart SLM agent
  when: autobot_restart_services | default(true) | bool  # #20743: false on a sync without restarts
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: slm-agent
  become: true

- name: Stop SLM agent
  systemd:
    name: slm-agent
    state: stopped
  become: true

- name: Start SLM agent
  systemd:
    name: slm-agent
    state: started
  become: true

- name: Restart node_exporter
  when: autobot_restart_services | default(true) | bool  # #20743: false on a sync without restarts
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: node_exporter
  become: true
