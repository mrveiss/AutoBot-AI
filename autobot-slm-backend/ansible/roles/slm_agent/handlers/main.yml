# SLM Agent Role - Handlers

- name: Reload systemd
  systemd:
    daemon_reload: true
  become: true

- name: Restart SLM agent
  systemd:
    name: slm-agent
    state: restarted
  become: true

- name: Stop SLM agent
  systemd:
    name: slm-agent
    state: stopped
  become: true

- name: Start SLM agent
  systemd:
    name: slm-agent
    state: started
  become: true

- name: Restart node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted
  become: true
