---
# Backend configuration defaults  (#926 Phase 4: service account created, migration in Phase 7)
backend_service_account: autobot-backend  # Phase 7: migrate service to run as this account
backend_user: autobot
backend_group: autobot
backend_install_dir: /opt/autobot/autobot-backend
backend_code_dir: "{{ backend_install_dir }}"  # Actual code location (can be overridden by playbook)
backend_shared_standalone_dir: /opt/autobot/autobot_shared  # Standalone PYTHONPATH copy used by workers (#3649)
backend_log_dir: /var/log/autobot
backend_data_dir: /var/lib/autobot

# Deployment
backend_repo_url: "https://github.com/mrveiss/AutoBot-AI.git"
backend_version: main
backend_deploy_from_git: true

# Server settings
# Issue #957: nginx holds port 8443 (TLS) permanently; uvicorn binds plain HTTP on localhost.
# Windows Defender Firewall rule is evaluated once for nginx, never for uvicorn restarts.
backend_host: "127.0.0.1"   # uvicorn: localhost only (nginx proxies from LAN)
backend_port: 8001           # uvicorn: plain HTTP port (internal)
backend_nginx_port: 8443     # nginx: external TLS port (LAN-facing)
backend_workers: 4

# Celery worker settings (Issue #863)
celery_concurrency: 4  # Number of worker processes
celery_max_tasks_per_child: 1000  # Restart worker after N tasks (prevents memory leaks)

# Redis connection
backend_redis_host: "{{ redis_host | default('127.0.0.1') }}"
backend_redis_port: 6379
backend_redis_password: ""

# User management mode (Issue #2953)
# single_user: no auth, no PostgreSQL (default for single-host installs)
# single_company/multi_company/provider: requires PostgreSQL
backend_user_mode: "single_user"

# PostgreSQL for non-single_user modes (Issue #2953)
backend_postgres_host: "127.0.0.1"
backend_postgres_port: 5432
backend_postgres_db: "autobot_users"
backend_postgres_user: "autobot_app"
backend_postgres_password: ""  # Generated by postgresql role if empty

# API settings
backend_secret_key: "change-me-in-production"
backend_jwt_secret: "autobot-jwt-secret-change-in-production-minimum-32-chars"
backend_cors_origins: "*"
# Internal API key shared with SLM backend for proxy authentication (#1779, #3512).
# REQUIRED for personality and voice proxies — set via Ansible Vault or inventory.
autobot_internal_api_key: ""
# SLM WebSocket auth bearer value — populated from /etc/autobot/slm-secrets.env at deploy time (#7689).
backend_slm_auth_tok: ""

# LLM Configuration (Issue #858)
backend_llm_provider: "ollama"  # Default LLM provider for all agents
backend_llm_endpoint: "http://127.0.0.1:11434"  # Default Ollama endpoint
backend_llm_model: "qwen3.5:9b"  # Default LLM model

# Browser Worker connection (Playwright VM — leave empty for single-host deploys)
backend_browser_host: ""    # Set to browser VM IP in fleet deployments; empty = disabled
backend_browser_port: 9001  # Port 9001 is canonical; 3000 was Grafana's port (#5608)

# AI Stack connection (co-located: use 127.0.0.1; WSL2: may need 10.255.255.254)
backend_ai_stack_host: "127.0.0.1"
backend_ai_stack_port: 8080

# ChromaDB connection (co-located: ai-stack node; fleet deployment: ai-stack node IP)
# Default follows backend_ai_stack_host so WSL2 auto-detection (#3503) propagates here too.
backend_chromadb_host: "{{ backend_ai_stack_host }}"
backend_chromadb_port: 8100

# Service Authentication
service_auth_service_id: "main-backend"
service_auth_keys_dir: "/etc/autobot/service-keys"
service_auth_enforcement_mode: true
service_auth_override_token: ""
service_auth_circuit_breaker_percentage: 100
service_auth_timestamp_window: 300
service_auth_rate_limit_window: 300
service_auth_rate_limit_max_failures: 10

# Post-deploy smoke test (#3687): retry-based health check polls /api/health
# until it returns 200. Retries every 5 seconds (600s = 120 retries max).
# 10-minute window required: torch/sentence-transformers/chromadb imports
# take 5-6 minutes on first start; 60-retry (5 min) window was too tight.
backend_health_check_port: 8001
backend_health_check_retries: 120      # Max retry attempts (120 × 5s = 600s total)
backend_health_check_delay: 5          # Seconds between retries

# Audit log file path (#8936: ensures AUTOBOT_AUDIT_LOG_FILE is always set in prod)
backend_audit_log_file: /opt/autobot/logs/audit.log
