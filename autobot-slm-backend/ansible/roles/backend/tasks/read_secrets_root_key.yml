#
# #19051: the ONE home of the backend's root-key read. Both backend env renders
# include it -- the full role run (tasks/main.yml) and the builtin updater's
# `tasks_from: env_only` (update-all-nodes.yml PLAY 2). It used to live in
# main.yml only, so the updater rendered the role default "" and every System
# vault call returned 503 on an updated install while the SLM file held a key.
#
# Sets `autobot_secrets_root_key` from /etc/autobot/slm-secrets.env when the file
# carries a key, and fails the deploy when the file exists but yields none.
---
- name: "Backend | Stat slm-secrets.env for the root-key read (#19051)"
  ansible.builtin.stat:
    path: /etc/autobot/slm-secrets.env
  register: _root_key_slm_secrets_stat
  tags: ['backend', 'config', 'env']

# #14758: the envelope secret store raised at import on every provisioned
# deployment because nothing ever wrote its root key, and each consumer swallowed
# the failure, so an entirely absent store looked like "that secret does not
# exist". slm_manager generates it into slm-secrets.env; read it here so both
# services derive the same vault KEKs. The SLM's SSO vault migration states
# outright that it needs the BACKEND's root key, so two values would be a silent
# decryption failure rather than a config nuisance.
- name: "Backend | Read AUTOBOT_SECRETS_ROOT_KEY from slm-secrets.env (#14758)"
  ansible.builtin.shell:
    cmd: >-
      grep -oP '^\s*(export\s+)?AUTOBOT_SECRETS_ROOT_KEY=\K.+'
      /etc/autobot/slm-secrets.env 2>/dev/null || true
  register: _backend_secrets_root_key
  changed_when: false
  failed_when: false
  when: _root_key_slm_secrets_stat.stat.exists | default(false)
  no_log: true
  tags: ['backend', 'config', 'env']

# #19051: the SAME line shapes the SLM back-fill's presence check accepts (an
# `export ` prefix, a quoted value), so a key it counts as present is read here.
- name: "Backend | Unquote the root key read from slm-secrets.env (#19051)"
  ansible.builtin.set_fact:
    _backend_slm_root_key: "{{ _backend_secrets_root_key.stdout | default('') | trim | regex_replace('^[\"\\x27]|[\"\\x27]$', '') }}"
  no_log: true
  tags: ['backend', 'config', 'env']

- name: "Backend | Align autobot_secrets_root_key with slm-secrets.env when present (#14758)"
  ansible.builtin.set_fact:
    autobot_secrets_root_key: "{{ _backend_slm_root_key }}"
  when: _backend_slm_root_key | length > 0
  no_log: true
  tags: ['backend', 'config', 'env']

# #19051: where the SLM secrets file is on this host, it is the root key's only
# source, so an empty key here means the back-fill never ran. Rendering
# `AUTOBOT_SECRETS_ROOT_KEY=` turned that into a 503 from every System vault
# call, discovered only from the backend log. Stop the deploy and name the fix.
- name: "Backend | Fail when the SLM secrets file yields no root key (#19051)"
  ansible.builtin.fail:
    msg: >-
      AUTOBOT_SECRETS_ROOT_KEY is empty in /etc/autobot/slm-secrets.env, so the
      backend would start with the System vault disabled. Run the builtin update,
      whose PLAY 1 back-fills the key (slm_manager secrets_root_key.yml), then
      re-run this deploy.
  when:
    - _root_key_slm_secrets_stat.stat.exists | default(false)
    # The FILE's key, not the merged var: an inventory key must not mask an SLM file that has none.
    - _backend_slm_root_key | length == 0
  tags: ['backend', 'config', 'env']
