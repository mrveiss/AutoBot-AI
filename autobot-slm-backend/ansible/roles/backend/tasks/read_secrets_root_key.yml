# #19051: the ONE home of the backend's root-key read. Both backend env renders
# include it -- the full role run (tasks/main.yml) and the builtin updater's
# `tasks_from: env_only` (update-all-nodes.yml PLAY 2). It used to live in
# main.yml only, so the updater rendered the role default "" and every System
# vault call returned 503 on an updated install while the SLM file held a key.
#
# Sets `autobot_secrets_root_key` from the SLM's slm-secrets.env when the file
# carries a key, and fails the deploy when the file exists but yields none.
---
# #20941: the read itself is the ONE shared task file, run on the SLM host, so a backend on
# another node gets the key too (it used to stat a file only the SLM host has). `apply` carries
# this include's tags into it: tags on an include gate the include, not its tasks.
- name: "Backend | Read AUTOBOT_SECRETS_ROOT_KEY from the SLM's slm-secrets.env (#14758, #20941)"
  ansible.builtin.include_tasks:
    file: ../../../_shared/tasks/read_slm_secrets_root_key.yml
    apply:
      tags: ['backend', 'config', 'env']
  tags: ['backend', 'config', 'env']

# #19051: where the SLM secrets file exists, it is the root key's only source, so an empty
# key here means the back-fill never ran. Rendering `AUTOBOT_SECRETS_ROOT_KEY=` turned that
# into a 503 from every System vault call, discovered only from the backend log. Stop the
# deploy and name the fix.
- name: "Backend | Fail when the SLM secrets file yields no root key (#19051)"
  ansible.builtin.fail:
    msg: >-
      AUTOBOT_SECRETS_ROOT_KEY is empty in the SLM's slm-secrets.env, so the
      backend would start with the System vault disabled. Run the builtin update,
      whose PLAY 1 back-fills the key (slm_manager secrets_root_key.yml), then
      re-run this deploy.
  when:
    - _slm_root_key_file_exists | default(false)
    # The FILE's key, not the merged var: an inventory key must not mask an SLM file that has none.
    - _slm_root_key_read | length == 0
  tags: ['backend', 'config', 'env']
