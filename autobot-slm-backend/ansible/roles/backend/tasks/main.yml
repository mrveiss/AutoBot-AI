#
# Backend Role - FastAPI backend deployment for AutoBot
---

# ============================================================
# Phase 1 CLEAN - remove legacy/wrong-node dirs  (#926 Phase 4)
# ============================================================
- name: "Backend | Include clean tasks"
  ansible.builtin.import_tasks: clean.yml
  tags: ['clean']

# #12777: detect (and optionally fix) discarded core dumps before anything else
# runs, so the report is visible near the top of the deploy output rather than
# buried after the install steps.
- name: "Backend | Include core-capture diagnostics"
  ansible.builtin.import_tasks: core_capture.yml
  tags: ['backend', 'diagnostics']

# ============================================================
# Per-role service account  (#926 Phase 4)
# ============================================================
- name: "Backend | Create per-role service account"
  ansible.builtin.user:
    name: "{{ backend_service_account }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    groups: "{{ backend_group }}"
    append: true
    comment: "AutoBot backend service account"
    state: present
  tags: ['backend', 'users']

# ==========================================================
# WSL2 auto-detection (#3503): 127.0.0.1 is ECONNREFUSED on
# WSL2 mirrored networking — override backend_ai_stack_host
# per-host at deploy time if it has not been explicitly set.
# ==========================================================
- name: "Backend | Read /proc/version to detect WSL2 (#3503)"
  ansible.builtin.slurp:
    src: /proc/version
  register: _proc_version
  changed_when: false
  failed_when: false
  tags: ['backend', 'config']

- name: "Backend | Set backend_ai_stack_host on WSL2 hosts (#3503, #17244)"
  ansible.builtin.set_fact:
    # #17244: ask the locality question too, not just "is this WSL2".
    # The WSL2 gateway address reaches the Windows side; it is the right
    # answer only when the AI stack is NOT on this node. When the stack is
    # co-located, loopback is. This mirrors the backend_chromadb_host task
    # below, which has always asked role_ai_stack_active -- the two sat
    # twelve lines apart and disagreed. Behaviour is unchanged whenever the
    # stack is not on this node, which is the case #3503 fixed.
    backend_ai_stack_host: "{{ backend_wsl2_loopback_host if (role_ai_stack_active | default(false) | bool) else backend_wsl2_gateway_host }}"
  when:
    - _proc_version.content is defined
    - (_proc_version.content | b64decode | lower) is search('microsoft')
    - backend_ai_stack_host == backend_ai_stack_host_shipped_default
  tags: ['backend', 'config']

- name: "Backend | Set backend_chromadb_host on WSL2 hosts (#3541, #4084, #4087)"
  ansible.builtin.set_fact:
    # ChromaDB always runs on the same host as AI Stack.
    # On WSL2: use 127.0.0.1 when ai-stack is co-located on this node,
    # otherwise mirror backend_ai_stack_host (already WSL2-adjusted above).
    # #14181: was `'ai-stack' in node_roles` -- the deprecated short form
    # (#7053). role_ai_stack_active is the shared fact the rule prefers: it
    # already ORs the short form, the canonical `autobot-ai-stack`, and the
    # ai_stack/aiml inventory groups, so this gate widens rather than narrows.
    backend_chromadb_host: "{{ '127.0.0.1' if (role_ai_stack_active | default(false) | bool) else backend_ai_stack_host }}"
  when:
    - _proc_version.content is defined
    - (_proc_version.content | b64decode | lower) is search('microsoft')
    - backend_chromadb_host == '127.0.0.1'
  tags: ['backend', 'config']

- name: "Backend | Set backend_host=0.0.0.0 on WSL2 hosts (#5608, #MVA-1423)"
  ansible.builtin.set_fact:
    # 10.255.255.254 is the Windows host IP seen FROM WSL2 — not a local
    # interface; uvicorn cannot bind to it (EADDRNOTAVAIL). Use 0.0.0.0 so
    # uvicorn binds all interfaces (loopback + WSL2 virtual adapter) while
    # remaining reachable from nginx and the health check on 127.0.0.1.
    backend_host: "0.0.0.0"
  when:
    - _proc_version.content is defined
    - (_proc_version.content | b64decode | lower) is search('microsoft')
    - backend_host == '127.0.0.1'
  tags: ['backend', 'config']

# ============================================================
# Per-role env at /etc/autobot/  (#926 Phase 4)
# ============================================================
- name: "Backend | Ensure /etc/autobot dir exists"
  ansible.builtin.file:
    path: /etc/autobot
    state: directory
    mode: "0755"
    owner: root
    group: root
  tags: ['backend', 'config']

# #6677 + #7272: Stat the SLM TLS certs before rendering the env file.
# The template only sets AUTOBOT_TLS_CA_PATH when the cert actually exists,
# so installs without TLS (or where distribute-tls-certs.yml has not yet
# run) don't ship a dangling env var that points at a missing file.
# Now uses the shared _shared/tasks/stat_tls_certs.yml helper (#7272) —
# the helper registers tls_server_cert/tls_server_key/tls_ca_cert; the
# backend template only references tls_ca_cert.
- name: "Backend | Stat SLM TLS certs (#6677/#7272)"
  ansible.builtin.include_tasks: ../../../_shared/tasks/stat_tls_certs.yml
  vars:
    tls_cert_dir: /etc/autobot/certs
  tags: ['backend', 'config']

# #7689: Read SLM_AUTH_TOKEN from /etc/autobot/slm-secrets.env on the target
# host and expose it as backend_slm_auth_tok for the backend.env.j2 template.
# The secrets file is written by the slm_manager role; on single-host deploys
# it is already present before this role runs.
- name: "Backend | Read SLM_AUTH_TOKEN from slm-secrets.env (#7689)"
  ansible.builtin.shell:
    cmd: >-
      grep -oP '^SLM_AUTH_TOKEN=\K.*'
      /etc/autobot/slm-secrets.env 2>/dev/null || true
  register: _backend_slm_auth_tok
  changed_when: false
  failed_when: false
  tags: ['backend', 'config']

- name: "Backend | Set slm auth fact for env template (#7689)"
  ansible.builtin.set_fact:
    backend_slm_auth_tok: "{{ _backend_slm_auth_tok.stdout | default('') | trim }}"
  tags: ['backend', 'config']

# #10400: Backend signs the service JWT with AUTOBOT_JWT_SECRET, but SLM verifies
# it with SLM_SECRET_KEY. Provisioning never distributed the SLM key to the backend,
# so the backend→SLM WebSocket handshake was rejected with 4001. Read SLM_SECRET_KEY
# from /etc/autobot/slm-secrets.env (written by the slm_manager role) and surface it
# as backend_jwt_secret so backend.env.j2 renders AUTOBOT_JWT_SECRET to the same value.
- name: "Backend | Read SLM_SECRET_KEY from slm-secrets.env (#10400)"
  ansible.builtin.shell:
    cmd: >-
      grep -oP '^SLM_SECRET_KEY=\K.*'
      /etc/autobot/slm-secrets.env 2>/dev/null || true
  register: _backend_slm_secret_key
  changed_when: false
  failed_when: false
  no_log: true
  tags: ['backend', 'config']

- name: "Backend | Align backend_jwt_secret with SLM_SECRET_KEY when present (#10400)"
  ansible.builtin.set_fact:
    backend_jwt_secret: "{{ _backend_slm_secret_key.stdout | trim }}"
  when: (_backend_slm_secret_key.stdout | default('') | trim) | length > 0
  no_log: true
  tags: ['backend', 'config']

# #16299: backend_secret_key's own role default (below in this file) was the
# guessable literal "change-me-in-production". slm_manager generates a real one
# once and persists it here, the same #10400 pattern as SLM_SECRET_KEY above. A
# backend deployed standalone, with no slm-secrets.env ever reaching it, keeps
# its own role default as a documented fallback.
- name: "Backend | Read AUTOBOT_BACKEND_SECRET_KEY from slm-secrets.env (#16299)"
  ansible.builtin.shell:
    cmd: >-
      grep -oP '^AUTOBOT_BACKEND_SECRET_KEY=\K.*'
      /etc/autobot/slm-secrets.env 2>/dev/null || true
  register: _backend_secret_key_read
  changed_when: false
  failed_when: false
  no_log: true
  tags: ['backend', 'config']

# #16299 review: guarded to replace ONLY the known shipped default, not
# whatever backend_secret_key already resolved to here -- backend commonly
# runs on a different host/play than slm_manager (the whole reason this reads
# from a file instead of a live fact), so an operator who set a real value in
# THIS role's own inventory (host_vars/group_vars for the backend host) must
# not have it silently replaced by slm_manager's generated one just because
# the file happens to carry a value. Only the literal default is eligible.
- name: "Backend | Align backend_secret_key with AUTOBOT_BACKEND_SECRET_KEY when present (#16299)"
  ansible.builtin.set_fact:
    backend_secret_key: "{{ _backend_secret_key_read.stdout | trim }}"
  when:
    - (_backend_secret_key_read.stdout | default('') | trim) | length > 0
    - backend_secret_key == 'change-me-in-production'
  no_log: true
  tags: ['backend', 'config']

# #11507: Derive AUTOBOT_INTERNAL_API_KEY from /etc/autobot/slm-secrets.env (the
# single source of truth — the SLM SystemSecret; slm_manager writes it there) and
# set autobot_internal_api_key BEFORE rendering EITHER env file. Previously the
# /etc/autobot/autobot-backend.env below was rendered from the raw inventory var
# while the code-dir .env (rendered later, after the #10636 read-back) used the
# slm-secrets value — so the managed backend and the SLM drifted onto two keys and
# every cross-service call 401'd. Reading it here converges both env files on one
# value. Gated on a non-empty read so a host without slm-secrets.env keeps the
# inventory/vault var (mirrors the #10400 SLM_SECRET_KEY pattern above).
# #12145: stat first so the read-retry below only spins while the file exists.
- name: "Backend | Stat slm-secrets.env for the internal-key read (#12145)"
  ansible.builtin.stat:
    path: /etc/autobot/slm-secrets.env
  register: _slm_secrets_stat
  tags: ['backend', 'config']

- name: "Backend | Read AUTOBOT_INTERNAL_API_KEY from slm-secrets.env (#11507)"
  ansible.builtin.shell:
    cmd: >-
      grep -oP '^AUTOBOT_INTERNAL_API_KEY=\K.*'
      /etc/autobot/slm-secrets.env 2>/dev/null || true
  register: _backend_internal_api_key
  changed_when: false
  failed_when: false
  no_log: true
  # #12145: retry on a transient empty read (file mid-write during a concurrent
  # deploy) so the key is not silently left drifted; short-circuits when the file
  # is absent (nothing to align).
  until: >-
    (_backend_internal_api_key.stdout | default('') | trim | length > 0)
    or (not (_slm_secrets_stat.stat.exists | default(false)))
  retries: 5
  delay: 2
  tags: ['backend', 'config']

- name: "Backend | Align autobot_internal_api_key with slm-secrets.env when present (#11507)"
  ansible.builtin.set_fact:
    autobot_internal_api_key: "{{ _backend_internal_api_key.stdout | trim }}"
  when: (_backend_internal_api_key.stdout | default('') | trim) | length > 0
  no_log: true
  tags: ['backend', 'config']

# #12513: the CLIENT half of chroma's token auth. backend.env.j2 already renders
# AUTOBOT_CHROMADB_AUTH_TOKEN and its default was "" -- the backend sent no
# credential, which was only consistent because the server enforced none either.
# Turning the server on without this would 401 every RAG call, so both sides read
# the same value from the same file and cannot drift.
- name: "Backend | Read the shared ChromaDB auth token from slm-secrets.env (#12513)"
  ansible.builtin.include_tasks: ../../../_shared/tasks/read_chromadb_auth_token.yml
  tags: ['backend', 'config']

- name: "Backend | Align backend_chromadb_auth_token with slm-secrets.env when present (#12513)"
  ansible.builtin.set_fact:
    backend_chromadb_auth_token: "{{ _chromadb_auth_token_read }}"
  when: (_chromadb_auth_token_read | default('') | trim) | length > 0
  no_log: true
  tags: ['backend', 'config']

# #16627 (P1b of #13568): the backend authenticates to Redis as `default` with the
# SLM-generated password while the server stays nopass. Adopted only when no
# password is set, so a password a server may already enforce is never replaced,
# and always together with the username (a password alone is refused by nopass).
- name: "Backend | Read the SLM-generated Redis credential (#16627)"
  ansible.builtin.include_tasks: ../../../_shared/tasks/read_redis_password.yml
  tags: ['backend', 'config']

- name: "Backend | Adopt the SLM-generated Redis credential when none is set (#16627)"
  ansible.builtin.set_fact:
    backend_redis_password: "{{ _redis_password_read }}"
    backend_redis_username: "{{ backend_redis_username | default('', true) or _redis_username_read }}"
  when:
    - (_redis_password_read | default('') | trim) | length > 0
    - (backend_redis_password | default('') | trim) | length == 0
  no_log: true
  tags: ['backend', 'config']

# #14758: the envelope secret store raised at import on every provisioned
# deployment because nothing ever wrote its root key, and each consumer swallowed
# the failure, so an entirely absent store looked like "that secret does not
# exist". slm_manager generates it into slm-secrets.env; read it here so both
# services derive the same vault KEKs. The SLM's SSO vault migration states
# outright that it needs the BACKEND's root key, so two values would be a silent
# decryption failure rather than a config nuisance.
- name: "Backend | Read AUTOBOT_SECRETS_ROOT_KEY from slm-secrets.env (#14758)"
  ansible.builtin.shell:
    cmd: >-
      grep -oP '^AUTOBOT_SECRETS_ROOT_KEY=\K.*'
      /etc/autobot/slm-secrets.env 2>/dev/null || true
  register: _backend_secrets_root_key
  changed_when: false
  failed_when: false
  when: _slm_secrets_stat.stat.exists | default(false)
  no_log: true
  tags: ['backend', 'config']

- name: "Backend | Align autobot_secrets_root_key with slm-secrets.env when present (#14758)"
  ansible.builtin.set_fact:
    autobot_secrets_root_key: "{{ _backend_secrets_root_key.stdout | trim }}"
  when: (_backend_secrets_root_key.stdout | default('') | trim) | length > 0
  no_log: true
  tags: ['backend', 'config']

# #9914: Deploy the systemd unit BEFORE any stop/start so a fresh VM provisions
# out-of-box. Previously the unit was deployed after the MVA-1633 start task, so
# first-run on a clean node failed: "Could not find the requested service
# autobot-backend". Tagged backend,config so tag-filtered runs register it too.
# #13765: the unit below derives MemoryHigh/MemoryMax from ansible_memtotal_mb.
# A full role run normally has facts, but this role is also reached with
# gather_facts disabled, and an absent fact renders NO limits while looking
# exactly like a deliberately-unlimited small host. Same include as
# unit_only.yml so there is one place that guarantees the fact.
- name: "Backend | Resolve host memory before rendering the unit (#13765)"
  ansible.builtin.include_tasks: memory_limits.yml
  tags: ['backend', 'config']

- name: "Backend | Deploy backend systemd service (#9914)"
  ansible.builtin.template:
    src: autobot-backend.service.j2
    dest: /etc/systemd/system/autobot-backend.service
    mode: "0644"
  notify:
    - reload systemd
    - restart backend
  tags: ['backend', 'config']

# #11670/#11671: The rendered unit above is the SINGLE source of truth. Retire the
# hand-placed drop-ins under autobot-backend.service.d/ (from the one-off
# fix-backend-deadlock.sh / fix-backend-worker-deadlock.yml scripts) that shadowed
# it — single-worker.conf overrode ExecStart (so template changes like #11668's
# graceful-shutdown never reached the box), timeout.conf forced the 15-min stop
# hang, and override.conf set AUTOBOT_USER_MODE=single_user, silently disabling
# full user management (CRITICAL, #11671). Those concerns now live in the template
# (worker count via backend_workers, timeouts via backend_start/stop_timeout_sec),
# so remove the whole manual drop-in dir on every deploy — ansible owns no drop-in,
# so the rendered unit stays authoritative and the box can no longer drift.
- name: "Backend | Remove stale manual systemd drop-ins so the rendered unit is authoritative (#11670/#11671)"
  ansible.builtin.file:
    path: /etc/systemd/system/autobot-backend.service.d
    state: absent
  notify:
    - reload systemd
    - restart backend
  tags: ['backend', 'config']

- name: "Backend | Reload systemd so the unit is registered before start (#9914)"
  ansible.builtin.systemd:
    daemon_reload: true
  tags: ['backend', 'config']

# ============================================================
# #12139: Always-restart safety net around the MVA-1633
# stop -> heavy-work -> start window.
# The MVA-1633 stop below explicitly stops autobot-backend, then ~670 lines of
# risky work (apt/pip install, code sync, alembic migrations, ownership fixes)
# run BEFORE the service is started again. If ANY task in that window FAILS, the
# block aborts straight to `always:`, which unconditionally starts the service
# so the backend is never left DEAD on a mid-deploy error (the 2026-07-23 login
# outage: backend stopped 12:01, not recovered until a manual start at 12:48).
# The existing explicit `state: started` tasks are kept; the `always` is a
# belt-and-suspenders guarantee on top of them.
# NOTE: `always` runs on task FAILURE / mid-deploy error, but NOT if the ansible
# process is hard-KILLED (SIGKILL) mid-run — that process-kill case is separately
# handled by #11492's executor detach (already merged) once deployed. This fix
# handles the task-failure/mid-deploy-error case, which is what left the backend
# dead today.
# ============================================================
# Placed BEFORE the restart-guarded window below on purpose (#12681): these
# tasks reach two third-party apt repos, and inside that block a transient
# outage would abort the whole deploy — code sync, config, workers, nginx and
# the health check — after the service was already stopped. Out here a repo
# hiccup fails this feature loudly and leaves a running backend running.
# #12681: the LLC agent CLIs. docker/backend/Dockerfile installs `claude` and
# `gh` from signed apt repos and proves both resolve at build time, but NOTHING
# installed them on an ansible-provisioned host. `resolve_cli_binary` therefore
# returned None for every claude_code / copilot_local agent hired on a systemd
# deployment, so the agent could be hired and could never run — which is the
# "provisioning fails invisibly" symptom the issue reports.
#
# Same signed repos as the image, fetched with get_url rather than piped to a
# shell. Failing loudly here is deliberate: a host that cannot install the CLI
# should fail provisioning rather than come up hosting agents that cannot run.
- name: "Backend | Ensure the apt keyring directory exists (#12681)"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  tags: ['backend', 'packages', 'llc']

- name: "Backend | Read the dpkg architecture for the CLI apt sources (#12681)"
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: _backend_dpkg_arch
  changed_when: false
  tags: ['backend', 'packages', 'llc']

- name: "Backend | Install the agent CLI repository signing keys (#12681)"
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    mode: "0644"
    # #2835 precedent: bound the fetch. lock_timeout below bounds the dpkg lock,
    # not a hung TCP connection to a third-party host — an unbounded fetch stalls
    # the whole play rather than failing it.
    timeout: 120
  loop:
    - url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
      dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    - url: https://downloads.claude.ai/keys/claude-code.asc
      dest: /etc/apt/keyrings/claude-code.asc
  loop_control:
    label: "{{ item.dest }}"
  become: true
  register: _backend_cli_keys
  tags: ['backend', 'packages', 'llc']

- name: "Backend | Add the agent CLI apt sources (#12681)"
  ansible.builtin.copy:
    dest: "/etc/apt/sources.list.d/{{ item.file }}"
    content: "{{ item.line }}\n"
    mode: "0644"
  loop:
    - file: github-cli.list
      line: >-
        deb [arch={{ _backend_dpkg_arch.stdout | trim }}
        signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg]
        https://cli.github.com/packages stable main
    - file: claude-code.list
      line: >-
        deb [signed-by=/etc/apt/keyrings/claude-code.asc]
        https://downloads.claude.ai/claude-code/apt/stable stable main
  loop_control:
    label: "{{ item.file }}"
  become: true
  register: _backend_cli_sources
  tags: ['backend', 'packages', 'llc']

# Also refreshed when a version is pinned: the keys and sources only change on
# first install, so a converged host would otherwise never refresh, and pinning a
# newly-released version would fail against a stale cache — defeating the point
# of the pin.
- name: "Backend | Refresh apt after adding the agent CLI sources (#12681)"
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: 60
  become: true
  when: >-
    _backend_cli_sources is changed
    or _backend_cli_keys is changed
    or (backend_claude_cli_version | default('') | trim | length > 0)
  tags: ['backend', 'packages', 'llc']

# An empty version takes the current stable-channel build; set
# backend_claude_cli_version to pin an exact package version.
- name: "Backend | Install the LLC agent CLIs (#12681)"
  ansible.builtin.apt:
    name: "{{ ['gh'] + ['claude-code' + ('=' + backend_claude_cli_version if (backend_claude_cli_version | default('') | trim | length > 0) else '')] }}"
    state: present
    install_recommends: false
    lock_timeout: 60
  become: true
  tags: ['backend', 'packages', 'llc']

# The image runs `claude --version` at build time so an install regression
# fails the build instead of silently breaking dispatch. The equivalent here is
# to resolve them on the host: a task that installs without checking would let
# a broken PATH look identical to a successful provision.
- name: "Backend | Verify the agent CLIs resolve on PATH (#12681)"
  ansible.builtin.command:
    cmd: "{{ item }} --version"
  loop:
    - gh
    - claude
  changed_when: false
  tags: ['backend', 'packages', 'llc']


- name: "Backend | Restart-guarded env-update + heavy-work window (#12139)"
  block:
  # MVA-1633: Prevent systemd Restart=always race during env updates.
  # The backend service may restart BEFORE the new .env is written if we use
  # async notify. Stop explicitly, write env files, verify they exist, then start.
  - name: "Backend | Stop service before env update (MVA-1633)"
    ansible.builtin.systemd:
      name: autobot-backend
      state: stopped
      daemon_reload: false
    changed_when: false
    failed_when: false
    tags: ['backend', 'config']

  - name: "Backend | Deploy /etc/autobot/autobot-backend.env"
    ansible.builtin.template:
      src: backend.env.j2
      dest: /etc/autobot/autobot-backend.env
      mode: "0640"
      owner: root
      group: "{{ backend_service_account }}"
    tags: ['backend', 'config']

  # Issue #2953: Write deployment.mode into config/config.yaml so the backend
  # config loader can read it without relying on env alone.
  - name: "Backend | Ensure config directory exists"
    ansible.builtin.file:
      path: "{{ backend_code_dir }}/config"
      state: directory
      mode: "0755"
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"
    tags: ['backend', 'config']

  - name: "Backend | Write deployment section to config/config.yaml (#2953)"
    ansible.builtin.template:
      src: config.yaml.j2
      dest: "{{ backend_code_dir }}/config/config.yaml"
      mode: "0644"
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"
      force: false  # Never overwrite an existing config.yaml — it may have user customisations
    tags: ['backend', 'config']

  # ============================================================
  # Backend-specific system dependencies (Python 3.14 now in shared Phase 0)
  # ============================================================
  # #6719: bounded shell apt-get update — see roles/nginx/tasks/main.yml.
  - name: "Backend | Refresh apt cache (best-effort, bounded; #6719)"
    ansible.builtin.command:
      cmd: >-
        timeout 60 apt-get update -qq
        -o Acquire::Retries=0
        -o Acquire::http::Timeout=10
    become: true
    changed_when: false
    failed_when: false
    tags: ['backend', 'packages']

  - name: "Backend | Install backend-specific system dependencies"
    ansible.builtin.apt:
      name:
        - build-essential
        - libssl-dev
        - zlib1g-dev
        - libbz2-dev
        - libreadline-dev
        - libsqlite3-dev
        - libncursesw5-dev
        - xz-utils
        - tk-dev
        - libxml2-dev
        - libxmlsec1-dev
        - libffi-dev
        - liblzma-dev
        - git
        - curl
        # GUI / display (VNC, xvfb headless, GUI automation)
        - xvfb
        - x11-utils
        - x11-apps
        # Audio / voice processing (PyAudio, librosa, Whisper)
        - ffmpeg
        - libsndfile1
        - libsndfile1-dev
        - portaudio19-dev
        # Text-to-speech engine for pyttsx3 (#10566): without espeak-ng the backend
        # reports "no speech voices installed" and TTS output is unavailable.
        - espeak-ng
        - espeak-ng-data
        # OCR / CAPTCHA solver (tesseract, Issue #206)
        - tesseract-ocr
        - libtesseract-dev
        # Matplotlib GUI backend
        - python3-tk
        # PostgreSQL client — pg_dump for the fail-closed pre-migration backup
        # of a REMOTE (colocated SLM) Postgres before Alembic upgrades (#10045)
        - postgresql-client
      state: present
    tags: ['backend', 'packages']


  - name: Create autobot user
    ansible.builtin.user:
      name: "{{ backend_user }}"
      shell: /bin/bash
      create_home: true
      state: present

  - name: Create backend directories
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: directory
      mode: "{{ item.mode }}"
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"
    loop:
      - {path: "{{ backend_install_dir }}", mode: "0755"}
      - {path: "{{ backend_log_dir }}", mode: "0755"}
      - {path: "{{ backend_data_dir }}", mode: "0755"}
      - {path: "{{ backend_data_dir }}/conversation_files", mode: "0755"}
      # #10911: service-keys holds the durable RSA JWT keypair; 0700 so only the
      # backend user can read the private key.
      - {path: "{{ backend_data_dir }}/service-keys", mode: "0700"}

  - name: Sync autobot-backend code from code_source
    ansible.posix.synchronize:
      src: "{{ code_source_dir }}/autobot-backend/"
      dest: "{{ backend_code_dir }}/"
      rsync_opts:
        - "--exclude=__pycache__"
        - "--exclude=*.pyc"
        - "--exclude=*.egg-info"
        - "--exclude=.git"
        - "--exclude=venv"
    notify:
      - restart backend
      - restart celery
    tags: ['backend', 'deploy']

  # #16310: files deleted from source pile up forever otherwise -- the
  # synchronize task above never deletes (no `delete: true`), by design, to
  # protect host state it cannot enumerate itself.
  - name: "Backend | Delete files removed from source (#16310)"
    ansible.builtin.include_tasks: ../../_shared/tasks/sync_deletions.yml
    vars:
      sync_deletions_label: "Backend"
      sync_deletions_source_dir: "{{ code_source_dir }}/autobot-backend"
      sync_deletions_target_dir: "{{ backend_code_dir }}"
      sync_deletions_owner: "{{ backend_user }}"
    tags: ['backend', 'deploy']

  # #16310 AC4, moved to its own file (review round 6, reachability): the
  # update path never runs this main.yml (see npu_workers_cleanup.yml's own
  # header), so it must also be reachable from PLAY 2 via
  # `include_role: {name: backend, tasks_from: npu_workers_cleanup}`. This
  # include covers the provisioning path (site.yml, provision-fleet-roles.yml
  # Phase 4a run main.yml in full).
  - name: "Backend | Clean up legacy npu_workers.yaml duplicate (#16310)"
    ansible.builtin.include_tasks: npu_workers_cleanup.yml
    tags: ['backend', 'deploy']

  - name: "Backend | Fix ownership of backend code dir after sync"
    ansible.builtin.file:
      path: "{{ backend_code_dir }}"
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"
      recurse: true
    tags: ['backend', 'deploy']

  # MVA-1633: Ensure startup validation script is executable
  - name: "Backend | Make startup validation script executable (MVA-1633)"
    ansible.builtin.file:
      path: "{{ backend_code_dir }}/startup_validation.py"
      mode: "0755"
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"
    tags: ['backend', 'deploy']

  # GH#9084: Write manifest listing vars that startup_validation.py must find non-empty.
  # Ansible owns this list — validator reads it so the two stay in sync automatically.
  - name: "Backend | Write startup validation vars manifest (#9084)"
    ansible.builtin.copy:
      dest: "{{ backend_code_dir }}/.validation_vars"
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"
      mode: "0640"
      content: |
        # Auto-generated by Ansible — do not edit manually.
        # Lists env vars startup_validation.py checks are non-empty after provisioning.
        # Must match vars emitted by backend.env.j2 with no | default() guard.
        AUTOBOT_REDIS_URL
        AUTOBOT_AI_STACK_HOST
        AUTOBOT_CHROMADB_HOST
        AUTOBOT_DEFAULT_LLM_MODEL
    tags: ['backend', 'deploy']

  - name: Sync backend config directory from code_source
    ansible.posix.synchronize:
      src: "{{ code_source_dir }}/autobot-backend/config/"
      dest: "{{ backend_code_dir }}/config/"
      rsync_opts:
        - "--exclude=__pycache__"
        - "--exclude=*.pyc"
    notify: restart backend
    tags: ['backend', 'deploy']

  # Issue #10294: plugins ship at the repo root (code_source/plugins/), a SIBLING of
  # autobot-backend/, so the autobot-backend code sync never copied them. The backend
  # resolves plugins at {{ backend_code_dir }}/plugins (AUTOBOT_BASE_DIR/plugins), which
  # did not exist → discover_plugins() found nothing and every core plugin (image/video
  # generation, kb-event, etc.) silently failed to register. Sync them into place.
  - name: Sync plugins directory from code_source (#10294)
    ansible.posix.synchronize:
      src: "{{ code_source_dir }}/plugins/"
      dest: "{{ backend_code_dir }}/plugins/"
      rsync_opts:
        - "--exclude=__pycache__"
        - "--exclude=*.pyc"
    notify: restart backend
    tags: ['backend', 'deploy']

  # Issue #10020: The old rsync task created a real directory copy of autobot_shared
  # inside backend_install_dir (/opt/autobot/autobot-backend/autobot_shared/).
  # Because PYTHONPATH lists backend_install_dir first, that embedded copy shadowed
  # the standalone /opt/autobot/autobot_shared/ on every partial sync — the root cause
  # of stale-shadow divergence. Replaced with a symlink so the embedded path always
  # resolves to the single canonical standalone copy, making import priority irrelevant.
  #
  # Step 1: stat the embedded path so subsequent tasks can gate on whether it is a
  # real directory (needs removal) or already a symlink (leave it; force: true handles update).
  - name: "Backend | Stat embedded autobot_shared path (#10020)"
    ansible.builtin.stat:
      path: "{{ backend_install_dir }}/autobot_shared"
    register: _embedded_shared_stat
    tags: ['backend', 'deploy']

  # Step 2: If a real directory exists (not a symlink), remove it before creating the symlink.
  # ansible.builtin.file with state: link + force: true can replace an existing symlink but
  # will fail if a non-empty directory occupies the destination.
  - name: "Backend | Remove stale embedded autobot_shared real-dir if present (#10020)"
    ansible.builtin.file:
      path: "{{ backend_install_dir }}/autobot_shared"
      state: absent
    when:
      - _embedded_shared_stat.stat.exists
      - not _embedded_shared_stat.stat.islnk
    tags: ['backend', 'deploy']

  # Step 3: Create (or update) the symlink. force: true updates the link target when the
  # destination is already a symlink pointing elsewhere (e.g. old partial-path symlinks).
  - name: "Backend | Symlink embedded autobot_shared to standalone canonical copy (#10020)"
    ansible.builtin.file:
      # #13539/B4: was "{{ backend_shared_standalone_dir }}" (absolute,
      # /opt/autobot/autobot_shared) -- escapes to the live tree under a
      # relocated deploy root. backend_install_dir and
      # backend_shared_standalone_dir are always siblings under the same
      # root, so the relative form resolves identically today and stays
      # correct under a relocation.
      src: ../autobot_shared
      dest: "{{ backend_install_dir }}/autobot_shared"
      state: link
      force: true
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"
    notify:
      - restart backend
      - restart celery
    tags: ['backend', 'deploy']

  # Issue #3649: Sync the single canonical autobot_shared to the standalone PYTHONPATH dir.
  # Workers, Celery, and MCP-bridge services all import from here. The backend's embedded
  # path is now a symlink to this directory, so syncing here is sufficient for all consumers.
  - name: "Backend | Sync autobot_shared to standalone PYTHONPATH dir (#3649)"
    ansible.posix.synchronize:
      src: "{{ code_source_dir }}/autobot_shared/"
      dest: "{{ backend_shared_standalone_dir }}/"
      rsync_opts:
        - "--exclude=__pycache__"
        - "--exclude=*.pyc"
        - "--exclude=*.egg-info"
        - "--exclude=.git"
        - "--delete"
    notify:
      - restart backend
      - restart celery
    tags: ['backend', 'deploy']

  - name: "Backend | Fix ownership of standalone autobot_shared (#3649)"
    ansible.builtin.file:
      path: "{{ backend_shared_standalone_dir }}"
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"
      recurse: true

  - name: "Backend | Sync docs directory from code_source (#4100)"
    ansible.posix.synchronize:
      src: "{{ code_source_dir }}/docs/"
      dest: "{{ backend_install_dir }}/../docs/"
      delete: true
      rsync_opts:
        - "--exclude=__pycache__"
        - "--exclude=*.pyc"
        - "--exclude=.git"
        - "--exclude=archives"
        # Host-generated state, mirrored from HOST_STATE_EXCLUDES in
        # services/deploy_artifacts.py (#14231). Anchored entries cannot match
        # anything here, and cost nothing -- carrying the whole vocabulary is what
        # keeps the delete-style syncs from disagreeing with each other again.
        - "--exclude=.env"
        - "--exclude=.env.*"
        - "--exclude=data"
        - "--exclude=logs"
        - "--exclude=/config/"
        - "--exclude=/.deployed_commit"
        - "--exclude=/.autobot_sync_deletions_commit"
        - "--exclude=/ansible/enroll.yml"
    tags: ['backend', 'deploy']

  # Issue #10020: backend_install_dir/autobot_shared is now a symlink to
  # backend_shared_standalone_dir — cleaning one is enough, but both find
  # commands are kept for clarity; find follows the symlink, so the second
  # is effectively a no-op when the target is the same directory.
  - name: "Backend | Clear stale .pyc files after source sync (#6193)"
    ansible.builtin.shell: |
      find "{{ backend_code_dir }}" -name '*.pyc' -delete
      find "{{ backend_shared_standalone_dir }}" -name '*.pyc' -delete 2>/dev/null || true
    changed_when: false
    tags: ['backend', 'deploy']

  # Issue #912: Deploy error catalog so it is always available on the VM.
  # path_constants.py resolves PROJECT_ROOT as 3 levels up from constants/,
  # putting CONFIG_DIR at /opt/autobot/infrastructure/shared/config/ which is
  # not synced by default. Deploying via Ansible ensures it is always present.
  - name: Create infrastructure shared config directory  # Issue #912
    ansible.builtin.file:
      path: "{{ backend_install_dir | dirname }}/infrastructure/shared/config"
      state: directory
      mode: "0755"
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"

  - name: Deploy error catalog to infrastructure config path  # Issue #912
    ansible.builtin.copy:
      src: error_messages.yaml
      dest: "{{ backend_install_dir | dirname }}/infrastructure/shared/config/error_messages.yaml"
      mode: "0644"
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"

  # Issue #3873: permission_rules.yaml is read from /opt/autobot/config/ at
  # runtime (three levels up from services/permission_matcher.py).  The clean
  # task that previously wiped /opt/autobot/config has been removed; this task
  # ensures the directory and file are always present after each deploy.
  - name: "Backend | Ensure /opt/autobot/config directory exists (#3873)"
    ansible.builtin.file:
      path: "{{ backend_install_dir | dirname }}/config"
      state: directory
      mode: "0755"
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"
    tags: ['backend', 'config']

  - name: "Backend | Deploy permission_rules.yaml to infrastructure config path (#3873)"
    ansible.builtin.copy:
      src: permission_rules.yaml
      dest: "{{ backend_install_dir | dirname }}/config/permission_rules.yaml"
      mode: "0644"
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"
    notify: restart backend
    tags: ['backend', 'config']

  - name: Check if backend code already synced
    ansible.builtin.stat:
      path: "{{ backend_code_dir }}/main.py"
    register: _backend_code_present

  - name: Clone/update AutoBot repository
    ansible.builtin.git:
      repo: "{{ backend_repo_url }}"
      dest: "{{ backend_install_dir }}"
      version: "{{ backend_version }}"
      force: true
    become_user: "{{ backend_user }}"
    when:
      - backend_deploy_from_git | default(true)
      - not _backend_code_present.stat.exists

  - name: Check if venv directory itself is a symlink (legacy layout)
    ansible.builtin.stat:
      path: "{{ backend_code_dir }}/venv"
    register: venv_check

  - name: Remove old/broken venv if the directory is a symlink
    ansible.builtin.file:
      path: "{{ backend_code_dir }}/venv"
      state: absent
    when: venv_check.stat.exists and venv_check.stat.islnk

  # #7052: Detect partially-corrupted venv from a prior failed install.
  # A venv with a working python3.14 binary but stale .pth files (e.g. from
  # an editable install whose finder module was removed during venv rebuild)
  # breaks pip on first import. The `Create venv` task below skips when
  # bin/activate exists, so without this check the corruption survives reinstall.
  - name: "Backend | Check venv health (pip importable, #7052)"
    ansible.builtin.command:
      cmd: "{{ backend_code_dir }}/venv/bin/python3.14 -c 'import pip'"
    register: _venv_health
    changed_when: false
    failed_when: false
    when: venv_check.stat.exists and venv_check.stat.isdir

  - name: "Backend | Remove broken venv when health check failed (#7052)"
    ansible.builtin.file:
      path: "{{ backend_code_dir }}/venv"
      state: absent
    when:
      - venv_check.stat.exists and venv_check.stat.isdir
      - (_venv_health.rc | default(0)) != 0

  - name: "Backend | Enforce venv target Python version (env-drift fix)"
    ansible.builtin.include_role:
      name: python_interpreter
      tasks_from: ensure_venv_version
    vars:
      venv_path: "{{ backend_code_dir }}/venv"
      venv_python: python3.14

  - name: Create Python 3.14 virtual environment via deadsnakes
    ansible.builtin.command:
      cmd: "python3.14 -m venv {{ backend_code_dir }}/venv"
      creates: "{{ backend_code_dir }}/venv/bin/activate"
    become_user: "{{ backend_user }}"

  - name: Fix venv ownership
    ansible.builtin.file:
      path: "{{ backend_code_dir }}/venv"
      state: directory
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"
      recurse: true

  - name: Upgrade pip
    ansible.builtin.pip:
      name: pip
      state: latest
      virtualenv: "{{ backend_code_dir }}/venv"
      # #16641: without this, pip falls back to shelling out to the
      # standalone `virtualenv` executable, absent from these hosts --
      # matches the interpreter "Create Python 3.14 virtual environment via
      # deadsnakes" above already targets.
      virtualenv_command: "python3.14 -m venv"
    become_user: "{{ backend_user }}"
    environment:
      PIP_DEFAULT_TIMEOUT: "120"
    timeout: 120  # Issue #2835: prevent indefinite hang on network issues

  - name: Install autobot_shared as editable package
    ansible.builtin.pip:
      name: "{{ backend_install_dir }}/autobot_shared"
      editable: true
      virtualenv: "{{ backend_code_dir }}/venv"
      # #16641: see "Upgrade pip" above.
      virtualenv_command: "python3.14 -m venv"
    become_user: "{{ backend_user }}"
    environment:
      PIP_DEFAULT_TIMEOUT: "120"
    timeout: 120  # Issue #2835: prevent indefinite hang
    when: backend_install_dir is defined
    notify:
      - restart backend
      - restart celery

  # The filtered file is written to /tmp, so its sibling-relative `-c
  # ../constraints/shared.txt` (#10524) and `-r ../requirements.txt` (#11135)
  # includes would resolve relative to /tmp and fail (pip errors on a missing
  # file). Delegate the filter+rewrite to the canonical
  # scripts/build-filtered-requirements.sh (#11134), which rewrites both to the
  # code_source path, which always exists as the git checkout, so the pinned
  # constraints AND root runtime deps are actually applied on deploy (#11117,
  # #11135). services/role_registry.py's backend post_sync_cmd invokes the same
  # script, so both deploy paths share one implementation instead of drifting.
  # #17242: generated ON THE CONTROLLER, not on the target. `code_source` is the
  # git checkout and no task syncs it to a remote node, so running this script
  # from it on the target exits 127 on every host that is not the manager --
  # which is why this passed for as long as the manager was the only backend
  # host. Same reason `_shared/tasks/sync_deletions.yml` delegates its own
  # code_source reads to localhost.
  #
  # The output is carried in a registered variable rather than through a file,
  # which also removes the fixed `/tmp/requirements-filtered.txt`: a shared name
  # in a world-writable directory that every host in the run would have
  # collided on the moment this task moved to the controller.
  - name: "Backend | Unique id for this run's controller temp files (#17242)"
    ansible.builtin.set_fact:
      _req_run_id: "{{ 999999999 | random }}"
    # Set once per host per run, so the generate step and the copy that reads
    # its output agree. inventory_hostname alone was not enough: two runs for
    # the SAME host share a controller file, and the later generation can
    # replace it before the earlier copy reads it.

  - name: Create filtered backend requirements (on the controller, #17242)
    ansible.builtin.shell:
      cmd: >-
        bash {{ code_source_dir }}/scripts/build-filtered-requirements.sh
        {{ code_source_dir }}/autobot-backend/requirements.txt
        {{ code_source_dir }}
        > /tmp/filtered-requirements.{{ inventory_hostname }}.{{ _req_run_id }}.txt
    changed_when: false
    delegate_to: localhost
    become: false

  - name: Write filtered backend requirements to the target (#17242)
    ansible.builtin.copy:
      src: "/tmp/filtered-requirements.{{ inventory_hostname }}.{{ _req_run_id }}.txt"
      dest: "{{ backend_code_dir }}/filtered-requirements.txt"
      owner: "{{ backend_user }}"
      mode: "0644"
    become: true

  # (#2872) Removed failed_when: false — pip install failures must surface.
  # The Ansible pip module raises on any pip error; the old bypass (Issue #892)
  # masked real dependency failures during deployment.
  - name: Install filtered backend requirements
    # #17242: reads the copy written above, inside the backend tree. The old
    # path was a fixed name under /tmp, shared by every host and pre-creatable
    # by any local user.
    ansible.builtin.pip:
      requirements: "{{ backend_code_dir }}/filtered-requirements.txt"
      virtualenv: "{{ backend_code_dir }}/venv"
      # #16641: see "Upgrade pip" above.
      virtualenv_command: "python3.14 -m venv"
    become_user: "{{ backend_user }}"
    environment:
      PIP_DEFAULT_TIMEOUT: "120"
      PIP_USE_DEPRECATED: "legacy-resolver"  # Issue #858: Handle complex OpenTelemetry+ChromaDB dependency graph
    timeout: 600  # Issue #2835: prevent indefinite hang on dependency resolution conflicts
    register: pip_install_result

  # GPU / CUDA-torch / vLLM extras (#10288, #15162): the GPU probe and the
  # CUDA-torch install answer "does this host have an NVIDIA GPU", which is
  # independent of "does this host run in-process vLLM". Coupling them meant a
  # GPU host that left vLLM disabled (the default) was never even probed, and
  # silently kept the CPU-only torch from requirements.txt. vllm itself stays
  # opt-in (#10251/#10287) since it drags the CUDA toolkit + extra wheels, but
  # CUDA torch/torchvision install whenever a GPU is present, vLLM or not.
  - name: "Backend | Detect NVIDIA GPU (#10288, #15162)"
    ansible.builtin.command:
      cmd: nvidia-smi --query-gpu=name --format=csv,noheader
    register: backend_nvidia_smi_result
    changed_when: false
    # nvidia-smi exits rc != 0 when no GPU is present; the result only gates the
    # optional GPU-reqs installs below, so a non-zero rc is expected on CPU nodes.
    failed_when: false
    when: backend_has_gpu == "auto"

  - name: "Backend | Resolve GPU availability (#10288, #15162)"
    ansible.builtin.set_fact:
      backend_gpu_available: "{{ (backend_nvidia_smi_result.rc | default(1)) == 0 and (backend_nvidia_smi_result.stdout | default('') | trim | length > 0) if backend_has_gpu == 'auto' else (backend_has_gpu | bool) }}"

  # Install CUDA-built torch/torchvision whenever a GPU is present, regardless
  # of vLLM. This is the fix for #15162: a GPU host that does not opt into
  # vLLM used to keep the CPU-only torch from requirements.txt with nothing
  # reporting the downgrade. Uses the repo-root requirements-gpu-torch.txt from
  # code_source (sibling of the autobot-backend subtree; not part of the
  # backend code rsync).
  # #17243: these three manifests sit at the REPO ROOT inside code_source. The
  # backend sync copies only code_source/autobot-backend/, so on a non-manager
  # backend the root-level files are absent and pip aborts -- the same defect as
  # #17242, one directory up, and missed by the first sweep because these are
  # `pip:` tasks rather than shell ones. Stage them from the controller.
  # These three manifests sit at the REPO ROOT inside code_source, which is the
  # controller's checkout; the backend sync copies only autobot-backend/, so the
  # root-level files are absent on a non-manager backend and pip aborts (#17243).
  #
  # Filtered through the canonical script rather than copied raw: a file copied
  # out of the repo lands at a different depth, so any relative -c/-r include it
  # gains later would resolve somewhere else (#14272). None of the three carries
  # one today, which makes this cheap now and correct if that changes.
  #
  # One task per manifest, not a loop: a loop renders the destination as a
  # template, and the manifest-resolution guard cannot tie that back to the
  # manifest it carries.
  - name: "Backend | Filter requirements-gpu-torch.txt on the controller (#17243)"
    ansible.builtin.shell:
      cmd: >-
        bash {{ code_source_dir }}/scripts/build-filtered-requirements.sh
        {{ code_source_dir }}/requirements-gpu-torch.txt
        {{ code_source_dir }}
        > /tmp/filtered-requirements-gpu-torch.{{ inventory_hostname }}.{{ _req_run_id }}.txt
    changed_when: false
    delegate_to: localhost
    become: false
    when: backend_gpu_available | default(false) | bool

  - name: "Backend | Stage filtered requirements-gpu-torch.txt onto the target (#17243)"
    ansible.builtin.copy:
      src: "/tmp/filtered-requirements-gpu-torch.{{ inventory_hostname }}.{{ _req_run_id }}.txt"
      dest: "{{ backend_code_dir }}/filtered-requirements-gpu-torch.txt"
      owner: "{{ backend_user }}"
      mode: "0644"
    become: true
    when: backend_gpu_available | default(false) | bool

  - name: "Backend | Filter requirements-gpu-faiss.txt on the controller (#17243)"
    ansible.builtin.shell:
      cmd: >-
        bash {{ code_source_dir }}/scripts/build-filtered-requirements.sh
        {{ code_source_dir }}/requirements-gpu-faiss.txt
        {{ code_source_dir }}
        > /tmp/filtered-requirements-gpu-faiss.{{ inventory_hostname }}.{{ _req_run_id }}.txt
    changed_when: false
    delegate_to: localhost
    become: false
    when: backend_gpu_available | default(false) | bool

  - name: "Backend | Stage filtered requirements-gpu-faiss.txt onto the target (#17243)"
    ansible.builtin.copy:
      src: "/tmp/filtered-requirements-gpu-faiss.{{ inventory_hostname }}.{{ _req_run_id }}.txt"
      dest: "{{ backend_code_dir }}/filtered-requirements-gpu-faiss.txt"
      owner: "{{ backend_user }}"
      mode: "0644"
    become: true
    when: backend_gpu_available | default(false) | bool

  - name: "Backend | Filter requirements-gpu.txt on the controller (#17243)"
    ansible.builtin.shell:
      cmd: >-
        bash {{ code_source_dir }}/scripts/build-filtered-requirements.sh
        {{ code_source_dir }}/requirements-gpu.txt
        {{ code_source_dir }}
        > /tmp/filtered-requirements-gpu.{{ inventory_hostname }}.{{ _req_run_id }}.txt
    changed_when: false
    delegate_to: localhost
    become: false
    when: backend_gpu_available | default(false) | bool

  - name: "Backend | Stage filtered requirements-gpu.txt onto the target (#17243)"
    ansible.builtin.copy:
      src: "/tmp/filtered-requirements-gpu.{{ inventory_hostname }}.{{ _req_run_id }}.txt"
      dest: "{{ backend_code_dir }}/filtered-requirements-gpu.txt"
      owner: "{{ backend_user }}"
      mode: "0644"
    become: true
    when: backend_gpu_available | default(false) | bool

  - name: "Backend | Install CUDA torch requirements (requirements-gpu-torch.txt) (#15162)"
    ansible.builtin.pip:
      requirements: "{{ backend_code_dir }}/filtered-requirements-gpu-torch.txt"
      virtualenv: "{{ backend_code_dir }}/venv"
      # #16641: see "Upgrade pip" above.
      virtualenv_command: "python3.14 -m venv"
    become_user: "{{ backend_user }}"
    environment:
      PIP_DEFAULT_TIMEOUT: "120"
    timeout: 1800  # CUDA-built torch is large
    when: backend_gpu_available | default(false) | bool

  # Install GPU-built faiss whenever a GPU is present, the same gate as CUDA
  # torch above and independent of vLLM (#15163: gpu_vector_search.py's
  # GPU-accelerated search has been unreachable since #387, because every
  # automated install path only ever provided faiss-cpu).
  #
  # Unlike torch (one package name, CPU vs CUDA build selected by index-url --
  # see the Dockerfile's --index-url .../whl/cpu), faiss-cpu and faiss-gpu are
  # two DIFFERENT package names that both provide the top-level `faiss`
  # module. Installing faiss-gpu on top of an existing faiss-cpu without
  # removing the latter first risks two packages' files fighting over the
  # same import -- so faiss-cpu is explicitly uninstalled first.
  - name: "Backend | Remove CPU-only faiss before installing the GPU build (#15163)"
    ansible.builtin.pip:
      name: faiss-cpu
      state: absent
      virtualenv: "{{ backend_code_dir }}/venv"
      # #16641: see "Upgrade pip" above.
      virtualenv_command: "python3.14 -m venv"
    become_user: "{{ backend_user }}"
    when: backend_gpu_available | default(false) | bool

  - name: "Backend | Install GPU faiss requirements (requirements-gpu-faiss.txt) (#15163)"
    ansible.builtin.pip:
      requirements: "{{ backend_code_dir }}/filtered-requirements-gpu-faiss.txt"
      virtualenv: "{{ backend_code_dir }}/venv"
      # #16641: see "Upgrade pip" above.
      virtualenv_command: "python3.14 -m venv"
    become_user: "{{ backend_user }}"
    environment:
      PIP_DEFAULT_TIMEOUT: "120"
    timeout: 1800  # GPU-built faiss is large
    when: backend_gpu_available | default(false) | bool

  # Install vLLM only when vLLM is enabled AND a GPU is present. vLLM remains
  # genuinely opt-in (#10251/#10287); it pins the same torch build the task
  # above already installs whenever backend_gpu_available is true, so no
  # duplicate CUDA-torch download happens here.
  - name: "Backend | Install GPU/vLLM requirements (requirements-gpu.txt) (#10288)"
    ansible.builtin.pip:
      requirements: "{{ backend_code_dir }}/filtered-requirements-gpu.txt"
      virtualenv: "{{ backend_code_dir }}/venv"
      # #16641: see "Upgrade pip" above.
      virtualenv_command: "python3.14 -m venv"
    become_user: "{{ backend_user }}"
    environment:
      PIP_DEFAULT_TIMEOUT: "120"
    timeout: 1800  # vllm wheels are large
    when:
      - backend_vllm_enabled | bool
      - backend_gpu_available | default(false) | bool

  # Silence is the actual defect (#15162): report exactly which torch variant
  # this deploy chose and why, so an operator can see the decision instead of
  # inferring it from performance later.
  - name: "Backend | Resolve GPU/CUDA-torch deploy decision (#15162)"
    ansible.builtin.set_fact:
      backend_cuda_torch_installed: "{{ backend_gpu_available | default(false) | bool }}"
      backend_faiss_gpu_installed: "{{ backend_gpu_available | default(false) | bool }}"
      backend_vllm_installed: >-
        {{ (backend_vllm_enabled | bool) and
           (backend_gpu_available | default(false) | bool) }}
      # "no GPU detected" only applies to the auto-probe path; an explicit
      # backend_has_gpu override that still resolves to no GPU names the
      # override itself, so the operator sees the actual reason rather than
      # a probe result that never ran.
      backend_gpu_skip_reason: >-
        {{ 'no GPU detected' if backend_has_gpu == 'auto'
           else 'backend_has_gpu=' ~ backend_has_gpu }}

  - name: "Backend | Report GPU/CUDA-torch deploy decision (#15162)"
    ansible.builtin.debug:
      msg: >-
        GPU deploy decision: gpu_available={{ backend_gpu_available | default(false) }}
        (backend_has_gpu={{ backend_has_gpu }}) ->
        cuda_torch={{ 'installed' if backend_cuda_torch_installed
          else 'skipped (' ~ backend_gpu_skip_reason ~ ')' }};
        faiss_gpu={{ 'installed' if backend_faiss_gpu_installed
          else 'skipped (' ~ backend_gpu_skip_reason ~ ')' }};
        vllm_enabled={{ backend_vllm_enabled | bool }} ->
        vllm={{ 'installed' if backend_vllm_installed
          else ('skipped (vLLM disabled)' if not (backend_vllm_enabled | bool)
          else 'skipped (' ~ backend_gpu_skip_reason ~ ')') }}

  - name: Deploy aioredis compatibility shim for Python 3.14
    ansible.builtin.template:
      src: aioredis_shim.py.j2
      dest: "{{ backend_code_dir }}/venv/lib/python3.14/site-packages/aioredis.py"
      mode: '0644'
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"

  - name: Reinstall autobot_shared to pick up ssot_config fixes
    ansible.builtin.pip:
      name: "{{ backend_install_dir }}/autobot_shared"
      editable: true
      virtualenv: "{{ backend_code_dir }}/venv"
      state: forcereinstall
      extra_args: "--no-deps"
      # #16641: see "Upgrade pip" above.
      virtualenv_command: "python3.14 -m venv"
    become_user: "{{ backend_user }}"
    environment:
      PIP_DEFAULT_TIMEOUT: "120"
    timeout: 120  # Issue #2835: prevent indefinite hang
    when: backend_install_dir is defined
    notify:
      - restart backend
      - restart celery

  # ==========================================================
  # PostgreSQL for User Management (Issue #2953)
  # AutoBot always runs full user management (#10713); every supported user mode
  # is Postgres-backed, so this always runs.
  # Re-uses the shared postgresql role with autobot_users DB.
  # ==========================================================
  - name: "Backend | Configure PostgreSQL for user management (#2953)"
    ansible.builtin.include_role:
      name: postgresql
    vars:
      db_user: "{{ backend_postgres_user | default('autobot_app') }}"
      db_env_prefix: "AUTOBOT"
      db_host: "127.0.0.1"
      databases:
        - "{{ backend_postgres_db | default('autobot_users') }}"
      postgresql_listen_addresses: "localhost"
      # #10636 gave the backend its OWN creds file because the postgresql role
      # then rendered the WHOLE file from a template, so writing AUTOBOT_DB_*
      # erased the SLM's SLM_DB_* entries on a collapsed single-box deploy.
      #
      # #12224 removed that hazard: the role now writes each prefix as its own
      # marked blockinfile region, so SLM_* and AUTOBOT_* coexist in one file and
      # neither clobbers the other. The separate file therefore solves a problem
      # that no longer exists -- and it kept drifting, ending up a month stale
      # with a password Postgres rejects, which is how #12883 became an outage.
      #
      # #12907: the AUTOBOT block now lands in the canonical db-credentials.env
      # (the role default), and the legacy file is retired once that block is in
      # place. One store, one authority, no precedence for consumers to know.
      # #10636: The postgresql role's pg_hba render is additive (it discovers every
      # existing login role first — see roles/postgresql/tasks/configure.yml — so
      # slm_app's rules survive), and this second run must ONLY reload, never
      # restart, the shared instance. postgresql.conf renders identically on both
      # runs (both pass listen_addresses=localhost), so no restart is triggered.
    tags: ['backend', 'postgresql']

  # ==========================================================
  # TLS Certificate Generation (Issue #892, consolidated #16020)
  # ==========================================================
  - name: "Backend | Ensure the shared node TLS keypair exists (#16020)"
    ansible.builtin.include_tasks: ../../../_shared/tasks/ensure_node_tls_cert.yml
    tags: ['backend', 'tls']

  # #16020: the shared task has no restart handler of its own -- it also
  # serves nginx, Redis and PostgreSQL, none of which restart the same way.
  # Reuses the shared task's own registered vars (the exact condition it used
  # to decide whether to (re)generate) rather than re-deriving the check, so
  # backend keeps restarting on a cert rotation as it did before consolidation.
  - name: "Backend | Flag a cert rotation for the restart handler"
    ansible.builtin.set_fact:
      _backend_cert_rotated: "{{ not autobot_node_cert_stat.stat.exists or (autobot_node_cert_valid.rc | default(1)) != 0 }}"
    changed_when: _backend_cert_rotated
    notify: restart backend

  # #16020: EXISTENCE is consolidated above; ownership stays here, since the
  # backend process reads the key as backend_user, not root like the shared
  # task's other consumers (nginx, Redis, PostgreSQL).
  - name: Set certificate key permissions
    ansible.builtin.file:
      path: "{{ item }}"
      mode: "0600"
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"
    loop:
      - /etc/autobot/certs/server-key.pem
      - /etc/autobot/certs/server-cert.pem

  # #10636: full-user-management secrets for the runtime .env. The DB password
  # is created by the postgresql role above (db_password); the initial-admin
  # password (which seeds the default admin on first boot) comes from
  # /etc/autobot/slm-secrets.env (written by slm_manager). The internal service API
  # key is read earlier from the same file (#11507) so both env files carry one key.
  # Without these the clean-install .env has no DB password / admin → /login has
  # no account, matching the deploy-path wiring in update-all-nodes.yml.
  - name: "Backend | Read admin seed password (AUTOBOT_ADMIN_PASSWORD, fallback SLM_ADMIN_PASSWORD) (#10636)"
    ansible.builtin.shell:
      cmd: >-
        grep -oP '^AUTOBOT_ADMIN_PASSWORD=\K.*' /etc/autobot/slm-secrets.env 2>/dev/null
        || grep -oP '^SLM_ADMIN_PASSWORD=\K.*' /etc/autobot/slm-secrets.env 2>/dev/null
        || true
    register: _backend_admin_password
    changed_when: false
    failed_when: false
    no_log: true
    tags: ['backend', 'config']

  # #10636 / #12520: autobot-db-credentials.env is the SINGLE role-managed
  # authority for the autobot_app DB password. The postgresql include above
  # ALTERs the autobot_app role in Postgres and records that exact value as
  # AUTOBOT_DB_PASSWORD (reuse-existing so a redeploy never regenerates it —
  # #12224). Read that authority UNCONDITIONALLY (never the SLM's
  # db-credentials.env) so backend_postgres_password — and therefore the .env's
  # AUTOBOT_POSTGRES_PASSWORD, which autobot-backend.service.j2 loads as the ONLY
  # EnvironmentFile carrying it — is rendered FROM the role-managed credential and
  # cannot drift from Postgres (#12520). Reading even when the in-memory
  # db_password fact is present is safe: the role wrote both in the same include,
  # so they are identical in a full run; on a tag-skip / separate-provisioning
  # run the file is the only truth.
  - name: "Backend | Read role-managed AUTOBOT_DB_PASSWORD (single authority, #10636, #12520)"
    ansible.builtin.shell:
      cmd: >-
        grep -oP '^AUTOBOT_DB_PASSWORD=\K.*'
        /etc/autobot/autobot-db-credentials.env 2>/dev/null || true
    register: _backend_db_password_file
    changed_when: false
    failed_when: false
    no_log: true
    tags: ['backend', 'config']

  - name: "Backend | Set full-user-management .env facts (#10636, #12520)"
    ansible.builtin.set_fact:
      # autobot_internal_api_key is set earlier from slm-secrets.env (#11507) so both
      # env files render one value; do not re-set (and never blank) it here.
      autobot_admin_password: "{{ _backend_admin_password.stdout | default('') | trim }}"
      # #12520: role-managed creds file FIRST (the value actually applied to
      # Postgres), then the in-memory db_password from this run, then a deliberate
      # external override (a genuinely remote DB has no local creds file, so the
      # override survives). This order makes the .env render structurally from the
      # single role-managed authority; the assert below is the regression guard.
      backend_postgres_password: >-
        {{ (_backend_db_password_file.stdout | default('') | trim)
           | default(db_password | default(''), true)
           | default(backend_postgres_password | default(''), true) }}
    no_log: true
    tags: ['backend', 'config']

  # Issue #2824: Deploy .env to backend_code_dir so the systemd
  # EnvironmentFile directive can find it.  Previous code deployed to
  # backend_install_dir which diverges when playbooks override
  # backend_code_dir (e.g. setup-user-backend.yml sets it to
  # backend_install_dir/autobot-backend).  The path expression here
  # mirrors the `EnvironmentFile=` directive in autobot-backend.service.j2
  # (named, not line-numbered -- it had moved from :15 to :62; #15877).
  - name: "Backend | Deploy .env to code dir (matches systemd EnvironmentFile) (#2824)"
    ansible.builtin.template:
      src: backend.env.j2
      dest: "{{ backend_code_dir | default(backend_install_dir) }}/.env"
      mode: "0600"
      owner: "{{ backend_user }}"
      group: "{{ backend_group }}"
      backup: true
    tags: ['backend', 'config']

  # MVA-1633: Verify .env file exists (will be read by service on restart)
  - name: "Backend | Verify .env file readable (MVA-1633)"
    ansible.builtin.stat:
      path: "{{ backend_code_dir | default(backend_install_dir) }}/.env"
    register: _backend_env_stat
    failed_when: not _backend_env_stat.stat.exists
    tags: ['backend', 'config']

  # ==========================================================
  # #12520: Regression guard — the backend .env AUTOBOT_POSTGRES_PASSWORD MUST
  # match the role-managed autobot-db-credentials.env AUTOBOT_DB_PASSWORD.
  #
  # The autobot_app DB password has ONE authority: the postgresql role, which
  # ALTERs the autobot_app role in Postgres and records the value as
  # AUTOBOT_DB_PASSWORD in autobot-db-credentials.env (reuse-existing, #12224).
  # The backend systemd unit loads ONLY its private .env, whose
  # AUTOBOT_POSTGRES_PASSWORD is rendered from backend_postgres_password. If that
  # ever drifts from the role-managed value the backend bakes a wrong password
  # and fails asyncpg auth on the next restart — the #12520 outage (same class
  # as #12297). This turns that silent runtime failure into a hard, early deploy
  # failure so the drift can never reach a restart.
  #
  # Scope: assert only for the co-located topology (local DB). When the backend
  # targets a REMOTE Postgres (backend_postgres_host is not localhost),
  # backend_postgres_password is a deliberate remote override that need not match
  # any local creds file, so the check is skipped — mirrors #12297's
  # "differing value = deliberate override, preserved".
  #
  # SECURITY: every message below renders BOOLEANS / KEY NAMES ONLY. A password
  # value must NEVER reach Ansible stdout/logs (learned from the #12297 fail_msg
  # leak): the parsed maps' VALUES are the DB password, so they are never emitted.
  # ==========================================================
  - name: "Backend | #12520: stat role-managed creds file"
    ansible.builtin.stat:
      path: "/etc/autobot/autobot-db-credentials.env"
    register: _backend_dbcreds_stat
    tags: ['backend', 'config']

  - name: "Backend | #12520: verify .env DB password matches role-managed creds"
    when:
      - _backend_env_stat.stat.exists
      - _backend_dbcreds_stat.stat.exists
      - (backend_postgres_host | default('127.0.0.1')) in ['127.0.0.1', 'localhost', '::1']
    tags: ['backend', 'config']
    block:
      - name: "Backend | #12520: slurp role-managed creds file"
        ansible.builtin.slurp:
          src: "/etc/autobot/autobot-db-credentials.env"
        register: _backend_dbcreds_raw
        no_log: true

      - name: "Backend | #12520: slurp rendered backend .env"
        ansible.builtin.slurp:
          src: "{{ backend_code_dir | default(backend_install_dir) }}/.env"
        register: _backend_env_raw
        no_log: true

      - name: "Backend | #12520: parse role-managed AUTOBOT_DB_PASSWORD (key->value)"
        ansible.builtin.set_fact:
          _backend_dbcreds_map: >-
            {{ dict(_backend_dbcreds_raw.content | b64decode
                    | regex_findall('(?m)^(AUTOBOT_DB_PASSWORD)=(.*)$')) }}
        no_log: true

      - name: "Backend | #12520: parse rendered AUTOBOT_POSTGRES_PASSWORD (key->value)"
        ansible.builtin.set_fact:
          _backend_env_map: >-
            {{ dict(_backend_env_raw.content | b64decode
                    | regex_findall('(?m)^(AUTOBOT_POSTGRES_PASSWORD)=(.*)$')) }}
        no_log: true

      # KEYS / BOOLEANS ONLY in every message. The `that` expressions reference
      # the map values by variable, and Ansible prints the LITERAL assertion
      # string (variable names) on failure, never the resolved secret; fail_msg
      # renders only key-presence booleans.
      - name: "Backend | #12520: assert .env DB password matches role-managed creds"
        ansible.builtin.assert:
          that:
            - "'AUTOBOT_DB_PASSWORD' in _backend_dbcreds_map"
            - "'AUTOBOT_POSTGRES_PASSWORD' in _backend_env_map"
            - (_backend_env_map['AUTOBOT_POSTGRES_PASSWORD'] | trim) == (_backend_dbcreds_map['AUTOBOT_DB_PASSWORD'] | trim)
          fail_msg: >-
            backend .env AUTOBOT_POSTGRES_PASSWORD drifted from the role-managed
            autobot-db-credentials.env AUTOBOT_DB_PASSWORD
            (role_pw_present={{ 'AUTOBOT_DB_PASSWORD' in _backend_dbcreds_map }},
             env_pw_present={{ 'AUTOBOT_POSTGRES_PASSWORD' in _backend_env_map }}).
            Re-run the backend postgresql include so both derive from the single
            role-managed authority (#12520).
          success_msg: "backend .env AUTOBOT_POSTGRES_PASSWORD matches role-managed creds (#12520)."
        tags: ['backend', 'config']

  # MVA-1633: Explicit start to match the unconditional stop above. Without this,
  # idempotent tag-filtered runs (--tags backend,config) stop the service and
  # never restart it when no change-detected task accumulates notify: restart backend.
  - name: "Backend | Start service after env update (MVA-1633)"
    ansible.builtin.systemd:
      name: autobot-backend
      state: started
      daemon_reload: false
    tags: ['backend', 'config']

  - name: Enable and start backend service
    ansible.builtin.systemd:
      name: autobot-backend
      state: started
      enabled: true
      daemon_reload: true
  always:
    # #12139: Guarantee autobot-backend ends STARTED whether the block succeeded
    # or a mid-task failure aborted it. Idempotent when the explicit MVA-1633
    # start / enable-and-start above already ran. `failed_when: false` so this
    # guard can never itself abort the `always` (the always must never fail-out).
    # Tagged backend,config to match the MVA-1633 stop above, so any run that can
    # stop the service (backend/config tags, or a full run) also runs the guard.
    - name: "Backend | Always-restart guard so backend can't be left dead (#12139)"
      ansible.builtin.systemd:
        name: autobot-backend
        state: started
        daemon_reload: true
      failed_when: false
      tags: ['backend', 'config']

# Issue #863: Deploy Celery worker service for background tasks
- name: Deploy Celery worker systemd service
  ansible.builtin.template:
    src: autobot-celery.service.j2
    dest: /etc/systemd/system/autobot-celery.service
    mode: "0644"
  notify:
    - reload systemd
    - restart celery

- name: Enable and start Celery worker service
  ansible.builtin.systemd:
    name: autobot-celery
    state: started
    enabled: true
    daemon_reload: true

# Issue #6555: Deploy Celery Beat — fires the periodic schedules
# declared in celery_app.conf.beat_schedule (knowledge cleanup,
# sync queue prune). Without Beat the schedules are dead config.
- name: "Beat | Ensure schedule directory exists"
  ansible.builtin.file:
    path: "{{ celery_beat_schedule_file | default('/var/lib/autobot/celerybeat-schedule') | dirname }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_group }}"
    mode: "0750"

- name: "Beat | Deploy Celery Beat systemd service (#6555)"
  ansible.builtin.template:
    src: autobot-celery-beat.service.j2
    dest: /etc/systemd/system/autobot-celery-beat.service
    mode: "0644"
  notify:
    - reload systemd
    - restart celery beat

- name: "Beat | Enable and start Celery Beat service"
  ansible.builtin.systemd:
    name: autobot-celery-beat
    state: started
    enabled: true
    daemon_reload: true

# ==========================================================
# nginx reverse proxy (Issue #957)
# Holds port backend_nginx_port (8443) permanently so WDF
# rule is evaluated once for nginx, not on every uvicorn restart.
#
# Co-located mode (#2829): When SLM and backend share a host,
# the SLM nginx proxies directly to uvicorn (port 8001, HTTP).
# The standalone backend nginx vhost is skipped to avoid a
# redundant double-proxy (SLM:443 -> backend:8443 -> uvicorn:8001).
# ==========================================================

# Cleanup: disable standalone backend nginx when co-located with SLM
- name: "Backend nginx | Disable standalone vhost when co-located with SLM (#2829)"
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/autobot-backend.conf
    state: absent
  notify: reload nginx backend
  when: slm_colocated_frontend | default(false) | bool
  tags: ['backend', 'nginx']

- name: "Backend nginx | Deploy reverse-proxy vhost config"
  ansible.builtin.template:
    src: nginx-backend.conf.j2
    dest: /etc/nginx/sites-available/autobot-backend.conf
    mode: "0644"
    owner: root
    group: root
  notify: reload nginx backend
  when: not (slm_colocated_frontend | default(false) | bool)
  tags: ['backend', 'nginx']

# #16979 (PR review): the render above only touches sites-available. This
# role's own main.yml always runs render+enable together (no `tasks_from`
# self-update seam splits them -- see repo_tests/nginx_sites_enabled_link_
# enforced_16979_test.py), so this was never the *reachability* gap #16979
# fixed elsewhere. But the "Enable vhost" task below had no non-symlink
# handling at all: a stale regular file at sites-enabled/autobot-backend.conf
# would make `state: link` hard-fail a full re-provision, where the SLM/
# frontend sites instead silently kept serving stale content. Same fix here
# for consistency -- every render site behaves the same way.
- name: "Backend nginx | Stat sites-enabled file to detect non-symlink (#16979)"
  ansible.builtin.stat:
    path: /etc/nginx/sites-enabled/autobot-backend.conf
  register: _backend_nginx_sites_enabled_stat
  when: not (slm_colocated_frontend | default(false) | bool)
  tags: ['backend', 'nginx']

# nginx loads every file under sites-enabled/, so a backup left there would
# be served as a second site -- move it beside the sites-available/ backup
# a re-render would leave (#16979 AC2, same reasoning as
# roles/slm_manager/tasks/nginx_site.yml).
- name: "Backend nginx | Back up non-symlink sites-enabled file before replacing it (#16979)"
  ansible.builtin.command:
    cmd: >-
      mv /etc/nginx/sites-enabled/autobot-backend.conf
      /etc/nginx/sites-available/autobot-backend.conf.enabled-backup.{{
      _backend_nginx_sites_enabled_stat.stat.mtime | int }}
  when:
    - not (slm_colocated_frontend | default(false) | bool)
    - _backend_nginx_sites_enabled_stat.stat.exists
    # order-independent (#16979 review): default(false) instead of relying
    # on the list's short-circuit order.
    - not (_backend_nginx_sites_enabled_stat.stat.islnk | default(false))
  changed_when: true
  tags: ['backend', 'nginx']

- name: "Backend nginx | Enable vhost (symlink)"
  ansible.builtin.file:
    src: /etc/nginx/sites-available/autobot-backend.conf
    dest: /etc/nginx/sites-enabled/autobot-backend.conf
    state: link
  notify: reload nginx backend
  when: not (slm_colocated_frontend | default(false) | bool)
  tags: ['backend', 'nginx']

- name: "Backend nginx | Stat sites-enabled after linking (#16979)"
  ansible.builtin.stat:
    path: /etc/nginx/sites-enabled/autobot-backend.conf
  register: _backend_nginx_sites_enabled_check
  when: not (slm_colocated_frontend | default(false) | bool)
  tags: ['backend', 'nginx']

# AC3-equivalent (#16979 review): fail loudly rather than let nginx quietly
# serve the wrong file.
- name: "Backend nginx | Assert sites-enabled resolves to the rendered site (#16979)"
  ansible.builtin.assert:
    that:
      - _backend_nginx_sites_enabled_check.stat.exists
      - _backend_nginx_sites_enabled_check.stat.islnk
      - _backend_nginx_sites_enabled_check.stat.lnk_source == '/etc/nginx/sites-available/autobot-backend.conf'
    fail_msg: >-
      /etc/nginx/sites-enabled/autobot-backend.conf is not a symlink resolving to
      /etc/nginx/sites-available/autobot-backend.conf -- nginx is not serving the
      rendered backend site config (#16979).
    success_msg: "sites-enabled/autobot-backend.conf resolves to the rendered site config."
  when: not (slm_colocated_frontend | default(false) | bool)
  tags: ['backend', 'nginx']

- name: "Backend nginx | Disable default vhost"
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx backend
  tags: ['backend', 'nginx']

- name: "Backend nginx | Validate nginx config"
  ansible.builtin.command: nginx -t
  changed_when: false
  tags: ['backend', 'nginx']

- name: "Backend nginx | Enable and start nginx"
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
    daemon_reload: true
  tags: ['backend', 'nginx']

# ==========================================================
# UFW loopback0 rule (WSL2 mirrored networking)
# WSL2 mirrored networking routes 127.0.0.1 traffic through
# the loopback0 interface, NOT lo. UFW's default lo accept
# rule does NOT cover loopback0, so nginx->uvicorn (port 8001)
# connections are dropped by UFW INPUT DROP policy.
# This rule is harmless on non-WSL2 hosts (no loopback0 traffic).
# ==========================================================
- name: "Backend | Check if UFW is installed"
  ansible.builtin.command: which ufw
  register: _backend_ufw_check
  changed_when: false
  # (#2872) Intentional: UFW may not be installed on all hosts.
  failed_when: false
  tags: ['backend', 'ufw']

- name: "Backend | Allow loopback0 interface (WSL2 mirrored networking)"
  community.general.ufw:
    rule: allow
    interface: loopback0
    direction: in
  when: _backend_ufw_check.rc == 0
  tags: ['backend', 'ufw']

# ==========================================================
# Cognition Store seed-on-deploy (#4679)
# Pre-populates ChromaDB cognition_store collection with curated
# foundational docs so new deployments avoid cold-start degradation.
# Runs only when cognition_seed.yaml is present; non-fatal if it fails.
# ==========================================================
- name: "Backend | Check cognition_seed.yaml exists (#4679)"
  ansible.builtin.stat:
    path: "{{ backend_code_dir }}/cognition_seed.yaml"
  register: _cognition_seed_manifest
  tags: ['backend', 'cognition-seed']

- name: "Backend | Seed Cognition Store from manifest (#4679)"
  ansible.builtin.command:
    cmd: >
      {{ backend_code_dir }}/venv/bin/python -c
      "import asyncio;
      from services.knowledge.cognition_seeder import CognitionSeeder;
      s = CognitionSeeder();
      count = asyncio.run(s.seed_from_manifest('{{ backend_code_dir }}/cognition_seed.yaml'));
      print('cognition_store seeded:', count, 'chunks')"
    chdir: "{{ backend_code_dir }}"
  environment:
    PYTHONPATH: "{{ backend_code_dir }}:{{ backend_shared_standalone_dir }}"
  become: true
  become_user: "{{ backend_service_account }}"
  when: _cognition_seed_manifest.stat.exists
  failed_when: false
  changed_when: false
  tags: ['backend', 'cognition-seed']

# ==========================================================
# Post-deploy smoke test (#3687)
# systemd reports active (running) even when all uvicorn
# workers crash-loop because the master process stays alive.
# Probing the TCP port and /api/health catches that case and
# fails the play before the deploy is marked complete.
# Issue #3856: flush handlers here so any pending restart fires
# before the health check, not after.
# ==========================================================
- name: "Backend | Flush handlers before smoke test (#3856)"
  ansible.builtin.meta: flush_handlers
  tags: ['backend', 'smoke-test']

- name: "Backend | Wait for backend to be healthy (#3687)"
  ansible.builtin.uri:
    # Always probe via loopback — backend_host may be 0.0.0.0 on WSL2
    # (#MVA-1423) which is not a valid URL target.
    url: "http://127.0.0.1:{{ backend_health_check_port }}/api/health"
    status_code: 200
  retries: "{{ backend_health_check_retries | default(60) }}"
  delay: "{{ backend_health_check_delay | default(5) }}"
  tags: ['backend', 'smoke-test']
  register: backend_health_check
  until: backend_health_check is succeeded
  # GH#9281/MVA-2431: Allow Phase 4c (nginx co-location) to run even if
  # the backend health check times out on slow restarts. Phase 4c has no
  # dependency on backend health — it only needs nginx config and the user
  # frontend package.json. The backend service will eventually come up via
  # systemd, but nginx must switch to co-located mode immediately so users
  # can access the frontend.
  ignore_errors: true
