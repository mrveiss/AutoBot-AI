---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart backend
  when: autobot_restart_services | default(true) | bool  # #20743: false on a sync without restarts
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: autobot-backend

- name: restart celery
  when: autobot_restart_services | default(true) | bool  # #20743: false on a sync without restarts
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: autobot-celery

- name: restart celery beat
  when: autobot_restart_services | default(true) | bool  # #20743: false on a sync without restarts
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: autobot-celery-beat

- name: reload nginx backend
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

- name: restart nginx backend
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
