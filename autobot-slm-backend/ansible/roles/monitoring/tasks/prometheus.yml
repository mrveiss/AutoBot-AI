# Ansible Monitoring Role - Prometheus Installation
---

- name: Create prometheus group
  ansible.builtin.group:
    name: "{{ prometheus_group }}"
    system: true
    state: present

- name: Create prometheus user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Check if Prometheus binary exists
  ansible.builtin.stat:
    path: "{{ prometheus_install_dir }}/prometheus"
  register: _prometheus_binary

- name: Create prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"
  loop:
    - "{{ prometheus_install_dir }}"
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_data_dir }}"

- name: Download Prometheus
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    mode: "0644"
  when: not _prometheus_binary.stat.exists

- name: Extract Prometheus
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: "{{ prometheus_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
  when: not _prometheus_binary.stat.exists

# Topology detection and the config render live in their own file so the same
# tasks can run again after the fleet roles exist (#14337). In this play they
# run before the backend role has been provisioned at all, so on a first-ever
# run the decision they make is based on a host that has no backend on it yet.
- name: "Prometheus | Resolve the scrape topology and write the config"
  ansible.builtin.include_tasks: prometheus_config.yml

# #12460: the alert rules live in the repo under autobot-monitoring/ and were
# never installed, so `rule_files` had nothing to point at on a fleet host.
# Copied from the deployed checkout rather than duplicated into the role, so the
# repo stays the single source for every alert.
- name: Create Prometheus rules directory
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}/rules"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"

- name: Find Prometheus alert rules in the repo
  ansible.builtin.find:
    paths: "{{ autobot_repo_dir }}/autobot-monitoring"
    patterns: "alerts-*.yml"
  register: _prometheus_alert_rules

# `find` returns an empty list for a missing directory without failing, so a
# monitoring-only node with no repo checkout would report green while installing
# zero alerts — the same silent no-op this change exists to remove. Fail loudly
# instead; a node that legitimately ships no rules sets the flag below.
- name: Assert Prometheus alert rules were found
  ansible.builtin.assert:
    that: _prometheus_alert_rules.files | length > 0
    fail_msg: >-
      No alerts-*.yml found under {{ autobot_repo_dir }}/autobot-monitoring.
      Prometheus would start with rule_files pointing at an empty directory and
      no alert would ever fire. Check autobot_repo_dir, or set
      prometheus_alert_rules_required=false for a node that intentionally has none.
  when: prometheus_alert_rules_required | bool

- name: Install Prometheus alert rules
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ prometheus_config_dir }}/rules/{{ item.path | basename }}"
    remote_src: true
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0644"
  loop: "{{ _prometheus_alert_rules.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  notify: Restart prometheus

- name: Create Prometheus systemd service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart prometheus

- name: Enable and start Prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true
    daemon_reload: true

# #14531: everything above proves the rule FILES were found, copied and pointed
# at by the config. None of it proves the running Prometheus read any of them.
# The deployed host carried `rule_files: []` and 0 loaded rules for four months
# while every task here reported changed/ok — so no alert could fire, and an
# alerting stack with no rules is indistinguishable from a fleet in perfect
# health. Both produce silence.
#
# Ask the server what it actually loaded, after the restart it needed.
- name: "Prometheus | Apply the pending restart before verifying what loaded (#14531)"
  ansible.builtin.meta: flush_handlers

- name: "Prometheus | Ask the running server which rules it loaded (#14531)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_port }}/api/v1/rules"
    return_content: true
  register: _prometheus_loaded_rules
  retries: "{{ prometheus_rules_check_retries | default(12) }}"
  delay: "{{ prometheus_rules_check_delay | default(5) }}"
  until: _prometheus_loaded_rules.status | default(0) == 200
  changed_when: false

- name: "Prometheus | Assert the rules reached the server, not just the disk (#14531)"
  # Counts RULES, not groups. A group that parsed but contained nothing would
  # satisfy a groups-only check while alerting on nothing — the same shape as
  # the rule files existing on disk and never being read.
  ansible.builtin.assert:
    that:
      - >-
        (_prometheus_loaded_rules.json.data.groups | default([])
         | map(attribute='rules', default=[]) | map('length') | sum) > 0
    fail_msg: >-
      Prometheus is running but has loaded 0 alert rules. The files under
      {{ prometheus_config_dir }}/rules were installed and rule_files points at
      them, so the gap is between the config and the server — check that
      rule_files is not [] in the rendered prometheus.yml, and that the server
      restarted after the config changed. Until this passes, no alert on this
      host can fire and nothing else reports that (#14531).
    success_msg: >-
      Prometheus loaded
      {{ _prometheus_loaded_rules.json.data.groups | default([])
         | map(attribute='rules', default=[]) | map('length') | sum }} alert rule(s)
      in {{ _prometheus_loaded_rules.json.data.groups | default([]) | length }} group(s).
  when: prometheus_alert_rules_required | bool
