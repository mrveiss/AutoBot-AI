# Ansible Monitoring Role - Node Exporter Installation
---

- name: Create node_exporter user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# A version bump replaces the installed binary, not only a missing one (#18556 review).
- name: Check whether the pinned node_exporter release is installed
  ansible.builtin.include_tasks: release_binary.yml
  vars:
    release_binary: /opt/node_exporter/node_exporter
    release_version: "{{ node_exporter_version }}"

- name: Download Node Exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    mode: "0644"
  when: release_install_needed | bool

- name: Create node_exporter directory
  ansible.builtin.file:
    path: /opt/node_exporter
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: "0755"

- name: Extract Node Exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: /opt/node_exporter
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: node_exporter
    group: node_exporter
  when: release_install_needed | bool
  notify: Restart node_exporter

- name: Create Node Exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart node_exporter

- name: Enable and start Node Exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
