# Ansible Monitoring Role - Grafana Installation
---

- name: Install or upgrade Grafana to grafana_version
  ansible.builtin.include_tasks: grafana_install.yml

# #16299: grafana_admin_password's own role default (defaults/main.yml) is the
# guessable literal "admin". When this role runs alongside slm_manager
# (playbooks/deploy-slm-manager.yml), slm_manager generates a real one once and
# persists it to /etc/autobot/slm-secrets.env; read it back here the same way
# the backend role reads SLM_SECRET_KEY back (#10400). A monitoring stack
# deployed standalone (deploy-monitoring.yml), with no SLM present at all,
# keeps this role's own "admin" default as a documented fallback.
- name: "Read GRAFANA_ADMIN_PASSWORD from slm-secrets.env (#16299)"
  ansible.builtin.shell:
    cmd: >-
      grep -oP '^GRAFANA_ADMIN_PASSWORD=\K.*'
      /etc/autobot/slm-secrets.env 2>/dev/null || true
  register: _grafana_admin_password_read
  changed_when: false
  failed_when: false
  no_log: true

# #16299 review: guarded to replace ONLY the known shipped default, not
# whatever grafana_admin_password already resolved to here -- an operator who
# set a real value in THIS play's own inventory (deploy-monitoring.yml
# standalone, or a group_vars override on the combined play) must not have it
# silently replaced by slm_manager's generated one just because the file
# happens to carry a value. Only the literal default is eligible.
- name: "Align grafana_admin_password with GRAFANA_ADMIN_PASSWORD when present (#16299)"
  ansible.builtin.set_fact:
    grafana_admin_password: "{{ _grafana_admin_password_read.stdout | trim }}"
  when:
    - (_grafana_admin_password_read.stdout | default('') | trim) | length > 0
    - grafana_admin_password == 'admin'
  no_log: true

- name: Configure Grafana
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Create Grafana provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: grafana
    mode: "0755"
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards

- name: Configure Prometheus datasource
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Configure dashboard provisioning
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: /etc/grafana/provisioning/dashboards/default.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Create dashboard directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: root
    group: grafana
    mode: "0755"

- name: Deploy AutoBot dashboards
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../autobot-infrastructure/shared/config/grafana/dashboards/"
    dest: /var/lib/grafana/dashboards/
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Enable and start Grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: started
    enabled: true

# #18556: ported from install-prometheus-stack.sh verify_installation, which
# asked Grafana /api/health after starting it. A started unit is not a serving
# Grafana; flush the pending restart first so the answer is about the new config.
- name: "Grafana | Apply the pending restart before checking health (#18556)"
  ansible.builtin.meta: flush_handlers
  when: monitoring_install_grafana | bool

- name: "Grafana | Ask the running server whether it is healthy (#18556)"
  ansible.builtin.uri:
    url: "http://{{ monitoring_local_host }}:{{ grafana_port }}/api/health"
    return_content: true
  register: _grafana_health
  retries: "{{ grafana_health_check_retries }}"
  delay: "{{ grafana_health_check_delay }}"
  until: _grafana_health.status | default(0) == 200
  changed_when: false
  when: monitoring_install_grafana | bool
