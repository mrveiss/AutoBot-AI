# Ansible Monitoring Role - Firewall Configuration
---

- name: Check if UFW is installed
  ansible.builtin.command: which ufw
  register: ufw_installed
  changed_when: false
  # (#2872) Intentional: UFW may not be installed on all hosts;
  # the result gates conditional firewall rules below.
  failed_when: false

- name: Configure UFW for Prometheus
  community.general.ufw:
    rule: allow
    port: "{{ prometheus_port }}"
    proto: tcp
    comment: "Prometheus"
  when:
    - ufw_installed.rc == 0
    - monitoring_install_prometheus | bool

- name: Configure UFW for Grafana
  community.general.ufw:
    rule: allow
    port: "{{ grafana_port }}"
    proto: tcp
    comment: "Grafana"
  when:
    - ufw_installed.rc == 0
    - monitoring_install_grafana | bool

- name: Configure UFW for Node Exporter
  community.general.ufw:
    rule: allow
    port: "{{ node_exporter_port }}"
    proto: tcp
    comment: "Node Exporter"
  when:
    - ufw_installed.rc == 0
    - monitoring_install_node_exporter | bool
