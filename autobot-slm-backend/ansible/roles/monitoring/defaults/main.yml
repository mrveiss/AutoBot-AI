# Ansible Monitoring Role - Default Variables
---

# Installation options
monitoring_install_prometheus: true
monitoring_install_grafana: true
monitoring_install_node_exporter: true
# #18556: Alertmanager was installed only by the retired
# autobot-infrastructure/shared/scripts/install-prometheus-stack.sh. Off by
# default so a host that never ran that script is unchanged; set true on the
# node that hosts alert routing.
monitoring_install_alertmanager: false

# monitoring_listen_address / monitoring_local_host are declared ONCE in
# inventory/group_vars/all.yml: the slm_agent role renders this role's
# node_exporter.service.j2 too, and a role default is not in scope there.

# Prometheus settings. prometheus_version is the ONE Prometheus version: CI reads
# it from this line to pin promtool (.github/workflows/ci.yml, #18556).
prometheus_version: "2.53.0"
prometheus_port: 9090
prometheus_retention_time: "15d"
prometheus_retention_size: "10GB"
prometheus_scrape_interval: "15s"
prometheus_evaluation_interval: "15s"

# Alertmanager settings (#18556, ported from install-prometheus-stack.sh)
alertmanager_version: "0.26.0"
alertmanager_port: 9093
# Host the release tarball is fetched from; a var so an air-gapped fleet can
# point it at an internal mirror without editing the task.
alertmanager_release_host: "github.com"
alertmanager_user: "alertmanager"
alertmanager_group: "alertmanager"
# Install dirs derive from the one install root (#18880): the parent of
# autobot.base_dir, so the path on a default host is unchanged. /etc and /var
# below are FHS service locations (docs/developer/ARCHITECTURE_EXCEPTIONS.md).
alertmanager_install_dir: "{{ autobot.base_dir | dirname }}/alertmanager"
# Downloaded into the install dir (created before the fetch), removed after extract.
alertmanager_archive: "{{ alertmanager_install_dir }}/alertmanager-{{ alertmanager_version }}.tar.gz"
# Loopback only, and its own value: the sole consumer is the co-located Prometheus
# (prometheus.yml.j2 targets this address). The API can create/delete silences and has
# no auth, so it never follows monitoring_local_host (a scrape-target name an operator
# may point at a routable address) nor monitoring_listen_address, and has no firewall rule.
alertmanager_listen_address: "127.0.0.1"
alertmanager_config_dir: "/etc/alertmanager"
alertmanager_data_dir: "/var/lib/alertmanager"
# #18556: what the role creates where a host may run its own Alertmanager. Each path absent
# before the role ran is recorded as created_path= in the install record (install.sh's
# INSTALL_RECORD), and scripts/uninstall.sh (RECORDED_PATHS) removes only recorded ones.
alertmanager_owned_paths:
  - "{{ alertmanager_install_dir }}"
  - "{{ alertmanager_config_dir }}"
  - "{{ alertmanager_data_dir }}"
  - /etc/systemd/system/alertmanager.service
autobot_install_record: /etc/autobot/install-record
# The routing config and the rule file live once in the repo (the backend's
# webhook tests read the same alertmanager.yml); copied from the repo clone,
# as the alert rules are, never duplicated into the role.
alertmanager_config_src: "{{ code_source_dir }}/autobot-infrastructure/shared/config/prometheus/alertmanager.yml"
alertmanager_rules_src: "{{ code_source_dir }}/autobot-infrastructure/shared/config/prometheus/alertmanager_rules.yml"
alertmanager_health_check_retries: 12
alertmanager_health_check_delay: 5

# Grafana settings. grafana_version is the ONE Grafana version (#19329): the compose
# stacks pin the same value, and repo_tests/monitoring_versions_one_home_19329_test.py
# fails when one differs.
grafana_version: "11.1.0"
grafana_apt_host: "apt.grafana.com"
grafana_port: 3000
grafana_admin_user: "admin"
grafana_admin_password: "admin"  # Should be overridden in production
grafana_allow_anonymous: true  # Required for iframe embedding in SLM frontend
grafana_health_check_retries: 12
grafana_health_check_delay: 5

# Node exporter settings
node_exporter_version: "1.7.0"
node_exporter_port: 9100

# User/group settings
prometheus_user: "prometheus"
prometheus_group: "prometheus"
grafana_user: "grafana"
grafana_group: "grafana"

# Installation directories
prometheus_install_dir: "{{ autobot.base_dir | dirname }}/prometheus"
prometheus_config_dir: "/etc/prometheus"
# #16375: the file Prometheus reads its backend scrape credential from
# (`bearer_token_file`). Written by this role from `prometheus_scrape_token`,
# which the SLM delivers from its secret store; never set a literal token here.
prometheus_scrape_token_file: "{{ prometheus_config_dir }}/autobot-scrape-token"

# #12460: fail the play when no alerts-*.yml is found rather than installing
# zero rules silently. Set false only for a node that intentionally ships none.
prometheus_alert_rules_required: true
# How long to wait for Prometheus to serve /api/v1/rules after a restart
# (#14531). Var-backed rather than literal, matching backend_health_check_*:
# a large WAL replay can outlast a fixed minute and false-fail the play.
prometheus_rules_check_retries: 12
prometheus_rules_check_delay: 5
prometheus_data_dir: "/var/lib/prometheus"
grafana_data_dir: "/var/lib/grafana"

# SLM integration
slm_api_url: "http://localhost:8000"
slm_metrics_endpoint: "/api/metrics"

# Daily health check cron settings (MVA-291)
monitoring_install_health_check_cron: true
autobot_repo_dir: "{{ autobot.base_dir }}"  # Override per inventory for your deployment path
code_source_dir: "{{ autobot.base_dir }}/code_source"  # Full repo clone; matches slm_manager default
autobot_log_dir: "/var/log/autobot"
health_check_cron_wrapper: "/usr/local/bin/autobot-health-check-cron.sh"

# #14315: mirrored from roles/backend/defaults/main.yml.
#
# The monitoring role renders the scrape config but runs against `slm_server`,
# while the backend role runs against `backend` — role defaults do not cross
# hosts, so `backend_port` is simply undefined here. A `| default(8001)` inline
# would have been a second hardcoded literal wearing a derivation's clothes,
# which is the failure being fixed. Mirrored explicitly instead, and
# test_prometheus_scrape_targets_14315_test.py fails if these drift from the
# backend role's own values.
backend_port: 8001           # uvicorn: plain HTTP, loopback only
backend_nginx_port: 8443     # nginx: external TLS, the only LAN-facing entry
