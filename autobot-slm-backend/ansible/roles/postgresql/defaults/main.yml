# PostgreSQL Role Defaults
---

# PostgreSQL version
postgresql_version: "16"

# APT repository release codename override
# Set this if ansible_facts['distribution_release'] is not supported by pgdg
# (e.g. focal EOL, kali-rolling). Use the nearest Debian/Ubuntu LTS codename.
# Leave empty to auto-detect from ansible_facts['distribution_release'].
postgresql_apt_release: ""

# Service configuration
postgresql_service: "postgresql"
postgresql_data_dir: "/var/lib/postgresql/{{ postgresql_version }}/main"
postgresql_config_dir: "/etc/postgresql/{{ postgresql_version }}/main"

# Connection settings
# #19239: listen_addresses has ONE definition -- this one. Every play that applies this role on
# a host (the SLM play, both user-management DB plays, the backend role on a collapsed box)
# renders the same value, so no run flips it and restarts Postgres, and none can cut remote
# clients by running last. Plays never override it.
#   - always loopback;
#   - plus this host's own fleet address when it is in a group that serves remote clients.
# Never "*": that exposes 5432 on every interface.
postgresql_fleet_groups: ['slm_server', 'slm', 'redis']
postgresql_serves_fleet: "{{ group_names | intersect(postgresql_fleet_groups) | length > 0 }}"
# This host's own address: the first of slm_host / ansible_host actually assigned here (on the DB
# VM slm_host names ANOTHER host; a missing SLM_HOST defaults slm_host to loopback), else the
# default-route address. Empty means unknown -- configure.yml fails a fleet host on that.
# One fleet address only: a multi-NIC host serving clients on several interfaces, or an ansible_host
# given as a hostname (never matched against all_ipv4_addresses, so default_ipv4 is used), needs
# SLM_HOST/ansible_host set to the serving IP.
_postgresql_own_addresses: "{{ ansible_facts['all_ipv4_addresses'] | default([]) | reject('match', '^127[.]') | list }}"
postgresql_fleet_address: >-
  {{ ([slm_host | default(''), ansible_host | default('')] | select('in', _postgresql_own_addresses) | list
      + [(ansible_facts['default_ipv4'] | default({}))['address'] | default('')])
     | reject('equalto', '') | reject('match', '^127[.]') | first | default('') }}
postgresql_listen_addresses: >-
  {{ (['localhost'] + ([postgresql_fleet_address] if postgresql_serves_fleet | bool else [])) | reject('equalto', '') | unique | join(',') }}
postgresql_port: 5432
postgresql_max_connections: 100

# Memory settings (tuned for 4GB RAM VM)
postgresql_shared_buffers: "256MB"
postgresql_effective_cache_size: "1GB"
postgresql_work_mem: "16MB"
postgresql_maintenance_work_mem: "128MB"

# WAL settings
postgresql_wal_buffers: "8MB"
postgresql_min_wal_size: "1GB"
postgresql_max_wal_size: "2GB"

# Checkpoint settings
postgresql_checkpoint_completion_target: 0.9

# Logging
postgresql_log_destination: "stderr"
postgresql_logging_collector: "on"
postgresql_log_directory: "log"
postgresql_log_filename: "postgresql-%Y-%m-%d_%H%M%S.log"
postgresql_log_rotation_age: "1d"
postgresql_log_rotation_size: "100MB"

# Locale (auto-detect: prefer en_US.UTF-8, fall back to C.UTF-8)
postgresql_locale: "{{ 'en_US.UTF-8' if ansible_facts['env'].LANG is defined and 'en_US' in ansible_facts['env'].LANG else 'C.UTF-8' }}"

# Authentication
postgresql_password_encryption: "scram-sha-256"

# Credentials storage
postgresql_credentials_dir: "/etc/autobot"
postgresql_credentials_file: "db-credentials.env"

# Database user and databases (override per-playbook)
db_user: "slm_app"
# App users that share THIS Postgres instance, rendered into pg_hba.conf.
# Defaults to [db_user] (one user per instance — multi-VM, unchanged). On a
# collapsed single-box deploy set this to every app user on the instance
# (e.g. [slm_app, autobot_app]) so provisioning one never drops the others
# from pg_hba (#10636).
postgresql_app_users: "{{ [db_user] }}"
db_host: "127.0.0.1"
db_env_prefix: "SLM"
databases:
  - slm
  - slm_users
  - autobot_users

# #12297: Host at which the SLM control plane (slm_app) reaches the
# autobot_users DB. Topology-aware and derived exactly like
# deploy-user-management-db.yml Phase 3 (redis_host | default('127.0.0.1')):
#   - Co-located single box: redis_host is left undefined by the inventory
#     (#12214), so this resolves to 127.0.0.1 (autobot_users is local).
#   - Remote DB VM: redis_host points at the database VM, so the role-managed
#     AUTOBOT_USERS_DATABASE_URL targets the correct remote host instead of a
#     hardcoded localhost. Genuinely-remote credentials/overrides still live in
#     slm-secrets.env and are preserved by the #12297 duplicate-only strip.
slm_autobot_users_host: "{{ redis_host | default('127.0.0.1') }}"

# AutoBot user
autobot_user: "autobot"
autobot_group: "autobot"

# Health check (retry-based polling instead of fixed timeout)
postgresql_health_check_retries: 60  # Max attempts (60 × 5s = 300s)
postgresql_health_check_delay: 5     # Seconds between retries

# ==========================================
# Scheduled backups (systemd timer + pg_dumpall) — #11383
# ==========================================
# Master switch. Set false to skip backup provisioning entirely (idempotent).
postgresql_backup_enabled: true

# Destination for compressed cluster dumps. Owned by the AutoBot service user.
postgresql_backup_dir: "/var/backups/autobot/postgresql"

# systemd OnCalendar schedule (see `man systemd.time`). Default: daily 02:30.
postgresql_backup_on_calendar: "*-*-* 02:30:00"

# Spread load / avoid thundering-herd when many nodes share a schedule.
postgresql_backup_randomized_delay_sec: 900

# Keep dumps for this many days; older *.sql.gz files are pruned each run.
postgresql_backup_retention_days: 14

# Filename prefix for each dump (timestamp is appended).
postgresql_backup_prefix: "postgresql-all"

# #19812: the user and password as a connection URL holds them. urlencode leaves "/" alone, and a
# raw "/" ends the credentials early.
db_url_credentials: "{{ db_user | urlencode | replace('/', '%2F') }}:{{ db_password | urlencode | replace('/', '%2F') }}"
