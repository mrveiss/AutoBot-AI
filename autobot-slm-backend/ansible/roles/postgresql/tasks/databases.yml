# PostgreSQL Database Creation Tasks
---

- name: Check if credentials file already exists
  ansible.builtin.stat:
    path: "{{ postgresql_credentials_dir }}/{{ postgresql_credentials_file }}"
  register: _db_creds_stat

- name: Read existing password from credentials file
  ansible.builtin.shell:
    cmd: >-
      grep '^{{ db_env_prefix }}_DB_PASSWORD='
      {{ postgresql_credentials_dir }}/{{ postgresql_credentials_file }}
      | cut -d= -f2
  register: _existing_db_password
  changed_when: false
  no_log: true
  when:
    - _db_creds_stat.stat.exists
    - db_password is not defined

- name: Reuse existing database password
  ansible.builtin.set_fact:
    db_password: "{{ _existing_db_password.stdout | trim }}"
  when:
    - db_password is not defined
    - _existing_db_password.stdout | default('') | trim | length > 0
  no_log: true

- name: Generate new database password
  ansible.builtin.set_fact:
    db_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  when: db_password is not defined
  no_log: true

- name: Create database user
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    state: present
    login_unix_socket: /var/run/postgresql
  become: true
  become_user: postgres
  no_log: true

- name: Create databases
  community.postgresql.postgresql_db:
    name: "{{ item }}"
    owner: "{{ db_user }}"
    encoding: UTF8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    template: template0
    state: present
    login_unix_socket: /var/run/postgresql
  become: true
  become_user: postgres
  loop: "{{ databases }}"

- name: Grant privileges on databases
  community.postgresql.postgresql_privs:
    database: "{{ item }}"
    privs: ALL
    type: database
    role: "{{ db_user }}"
    login_unix_socket: /var/run/postgresql
  become: true
  become_user: postgres
  loop: "{{ databases }}"

# PG15+ no longer grants CREATE on schema public to non-owners, so the
# database-level grant above is not enough for Alembic to create tables.
# Grant schema-level privileges so app migrations can run (#10636).
- name: Grant schema-public privileges
  community.postgresql.postgresql_privs:
    database: "{{ item }}"
    type: schema
    objs: public
    privs: ALL
    role: "{{ db_user }}"
    login_unix_socket: /var/run/postgresql
  become: true
  become_user: postgres
  loop: "{{ databases }}"

# #12224: db-credentials.env is SHARED between the SLM phase (SLM_*) and the
# managed-backend phase (AUTOBOT_*). The previous `template` module rewrote the
# WHOLE file with only the current prefix, so on a co-located box the second
# phase erased the first phase's keys (e.g. SLM_DATABASE_URL) — the SLM control
# plane then lost its creds and crash-looped on the next restart. Write each
# prefix as its own marked block so both coexist and neither clobbers the other;
# this also lets "Reuse existing database password" find the prior password, so
# a redeploy no longer regenerates it and env/Postgres never diverge.
#
# #12297 (Arm 1): the SLM connects slm_app -> the autobot_users DB, but that
# URL used to live ONLY in slm-secrets.env — a stale landmine that overrode
# the role-managed value forever. Emit a role-managed AUTOBOT_USERS_DATABASE_URL
# in the SLM block so db-credentials.env is the single authority for all three
# SLM DB URLs. The host is topology-derived (slm_autobot_users_host =
# redis_host | default('127.0.0.1')): localhost when autobot_users is
# co-located, the DB-VM host when it is remote — never a hardcoded localhost.
# The generic URL loop skips autobot_users for the SLM prefix so this
# topology-aware line is the single source (no duplicate even when
# autobot_users is in `databases`, e.g. deploy-slm-manager.yml default list).
- name: "Save credentials to file (per-prefix block, #12224, #12297)"
  ansible.builtin.blockinfile:
    path: "{{ postgresql_credentials_dir }}/{{ postgresql_credentials_file }}"
    marker: "# {mark} {{ db_env_prefix }} DB CREDENTIALS (managed by postgresql role)"
    create: true
    owner: "{{ autobot_user }}"
    group: "{{ autobot_group }}"
    mode: '0600'
    block: |
      {{ db_env_prefix }}_DB_HOST={{ db_host | default('127.0.0.1') }}
      {{ db_env_prefix }}_DB_PORT={{ postgresql_port }}
      {{ db_env_prefix }}_DB_USER={{ db_user }}
      {{ db_env_prefix }}_DB_PASSWORD={{ db_password }}
      {{ db_env_prefix }}_DB_NAME={{ databases | first }}
      {% for db in databases %}
      {{ db_env_prefix }}_DB_{{ db | upper | replace('-', '_') }}={{ db }}
      {% endfor %}
      {{ db_env_prefix }}_DATABASE_URL=postgresql+asyncpg://{{ db_user }}:{{ db_password }}@{{ db_host | default('127.0.0.1') }}:{{ postgresql_port }}/{{ databases | first }}
      {% for db in databases[1:] if not (db_env_prefix == 'SLM' and db == 'autobot_users') %}
      {{ db | upper | replace('-', '_') }}_DATABASE_URL=postgresql+asyncpg://{{ db_user }}:{{ db_password }}@{{ db_host | default('127.0.0.1') }}:{{ postgresql_port }}/{{ db }}
      {% endfor %}
      {% if db_env_prefix == 'SLM' %}
      AUTOBOT_USERS_DATABASE_URL=postgresql+asyncpg://{{ db_user }}:{{ db_password }}@{{ slm_autobot_users_host }}:{{ postgresql_port }}/autobot_users
      {% endif %}
  become: true
  no_log: true

# #12907 reconciliation (strip pre-#12224 unmarked duplicates, retire the
# superseded legacy store) lives in credentials_reconcile.yml so the builtin
# updater can apply the SAME tasks without running the whole role (#12959) —
# before that split the fix was role-only and never reached a host.
#
# Runs AFTER blockinfile, never before: the managed block must already be in
# place, so a play that aborts here can never leave a host with no credentials.
- name: "Reconcile the {{ db_env_prefix }} credential store (#12907)"
  ansible.builtin.include_tasks: credentials_reconcile.yml

- name: Display database setup completion
  ansible.builtin.debug:
    msg:
      - "PostgreSQL databases created successfully"
      - "User: {{ db_user }}"
      - "Databases: {{ databases | join(', ') }}"
      - "Credentials saved to: {{ postgresql_credentials_dir }}/{{ postgresql_credentials_file }}"
