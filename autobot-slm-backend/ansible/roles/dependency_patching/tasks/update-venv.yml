---
# Python Virtual Environment Update Tasks
# Issue #682: Update Python packages with CVE fixes

- name: Get current service definition
  ansible.builtin.set_fact:
    current_service: "{{ service_definitions[group_names | first] | default({}) }}"

- name: Set venv path for this host
  ansible.builtin.set_fact:
    host_venv_path: "{{ current_service.venv_path | default(venv_path) }}"

- name: Check if venv exists
  ansible.builtin.stat:
    path: "{{ host_venv_path }}/bin/pip"
  register: venv_exists

- name: Fail if venv does not exist
  ansible.builtin.fail:
    msg: "Virtual environment not found at {{ host_venv_path }}"
  when: not venv_exists.stat.exists

- name: Get current package versions (for audit log)
  ansible.builtin.command:
    cmd: "{{ host_venv_path }}/bin/pip freeze"
  register: pip_freeze_before
  changed_when: false

# #19428: a floor in constraints/shared.txt reaches a venv here too, not only through a manifest
# reinstall. Read the SSOT on the node (staged by update-all-nodes.yml, #17243 -- a missing file
# fails this task rather than patching without the floors), name every constrained package this
# venv already holds, and constrain the install against the file. A package the venv does not
# hold is never added: the constraints file covers several components' venvs.
- name: Read the shared constraints SSOT (#19428)
  ansible.builtin.slurp:
    src: "{{ constraints_path }}"
  register: _constraints_file

- name: Name the constrained packages this venv holds (#19428)
  ansible.builtin.set_fact:
    constrained_installed: "{{ _constrained_names | select('in', _installed_names) | list }}"
  vars:
    _constrained_names: >-
      {{ (_constraints_file.content | b64decode).splitlines()
         | map('regex_replace', '#.*$', '') | map('trim') | reject('equalto', '')
         | map('regex_replace', '^([A-Za-z0-9][A-Za-z0-9._-]*).*$', '\1')
         | map('lower') | map('regex_replace', '[._]', '-') | list }}
    _installed_names: >-
      {{ pip_freeze_before.stdout_lines
         | map('regex_replace', '^([A-Za-z0-9][A-Za-z0-9._-]*).*$', '\1')
         | map('lower') | map('regex_replace', '[._]', '-') | list }}

- name: Create temporary requirements file with security updates
  ansible.builtin.template:
    src: requirements-security-update.txt.j2
    dest: /tmp/requirements-security-update.txt
    mode: '0644'

- name: Update Python packages with security fixes
  block:
    # #16641: `virtualenv:` alone falls back to the standalone `virtualenv`
    # executable if the venv does not exist, and this fleet only has the
    # stdlib's `venv` module -- but "Fail if venv does not exist" above
    # already aborts the play before either pip task here can run against a
    # missing venv, so `virtualenv_command:` is unreachable defence-in-depth
    # rather than a live gap. Not version-pinned: this role patches whatever
    # venv `host_venv_path` names, for whichever service defines it, so no
    # single target interpreter applies the way it does in a role that owns
    # one component's venv.
    - name: Upgrade pip first (if needed)
      ansible.builtin.pip:
        name: pip
        state: latest
        virtualenv: "{{ host_venv_path }}"
        virtualenv_command: "python3 -m venv"
        extra_args: "{{ pip_extra_args }}"
      when: "'pip' in python_security_updates"

    # #16641: see "Upgrade pip first (if needed)" above.
    - name: Install security updates
      ansible.builtin.pip:
        requirements: /tmp/requirements-security-update.txt
        virtualenv: "{{ host_venv_path }}"
        virtualenv_command: "python3 -m venv"
        extra_args: "{{ pip_extra_args }} -c {{ constraints_path }}"  # the SSOT floors (#19428)
      register: pip_update
      timeout: "{{ update_timeout }}"

    - name: Get updated package versions (for audit log)
      ansible.builtin.command:
        cmd: "{{ host_venv_path }}/bin/pip freeze"
      register: pip_freeze_after
      changed_when: false

    - name: Log package update summary
      ansible.builtin.debug:
        msg: |
          Package update completed on {{ inventory_hostname }}
          Changed packages:
          {{ pip_update.stdout_lines | default(['No changes']) | join('\n') }}

  rescue:
    - name: Update failed - initiate rollback
      ansible.builtin.include_tasks: rollback.yml
      when: rollback_on_failure

    - name: Fail the play after rollback
      ansible.builtin.fail:
        msg: "Package update failed on {{ inventory_hostname }}. Rollback {{ 'completed' if rollback_on_failure else 'skipped' }}."

- name: Clean up temporary requirements file
  ansible.builtin.file:
    path: /tmp/requirements-security-update.txt
    state: absent

- name: Record update results
  ansible.builtin.set_fact:
    update_results:
      host: "{{ inventory_hostname }}"
      packages_updated: "{{ pip_update.changed | default(false) }}"
      timestamp: "{{ ansible_facts['date_time'].iso8601 }}"
