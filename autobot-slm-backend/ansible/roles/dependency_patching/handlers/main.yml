---
# Dependency Patching Role - Handlers
# Issue #682: Service management handlers

- name: Restart backend service
  listen: restart autobot services
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: autobot-backend
    restart_unit_daemon_reload: true

- name: Restart AI stack service
  listen: restart autobot services
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: autobot-aistack
    restart_unit_daemon_reload: true

- name: Restart NPU worker service
  listen: restart autobot services
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: autobot-npu
    restart_unit_daemon_reload: true

- name: Restart frontend service
  listen: restart autobot services
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: autobot-frontend
    restart_unit_daemon_reload: true

- name: Restart Redis service
  listen: restart redis
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: redis-stack-server

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "reload systemd"
