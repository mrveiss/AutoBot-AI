---
# Access control role default variables

# Service configuration
service_user: autobot
service_group: autobot
project_root: /opt/autobot
config_dir: /etc/autobot
logs_dir: /var/log/autobot

# Access control mode
access_control_mode: log_only  # log_only, partial, full
enable_audit_logging: true
enable_session_validation: true

# Policy configuration
access_policies:
  - name: "session_ownership"
    enabled: true
    enforcement_level: "{{ access_control_mode }}"
  - name: "resource_permissions"
    enabled: true
    enforcement_level: "{{ access_control_mode }}"
  - name: "api_rate_limiting"
    enabled: false
    enforcement_level: "log_only"

# Audit logging
audit_log_level: INFO
audit_log_rotation: 7  # days
audit_log_format: json
audit_backends:
  - file
  - redis

# Enforcement posture written into the flag store at provisioning time (#14866).
# Valid values: disabled, log_only, enforced. Must stay in step with
# services.feature_flags.PROVISIONED_ENFORCEMENT_MODE_DEFAULT -- an install
# provisioned by Ansible and one provisioned by running the seeder directly must
# not end up with different postures. Pinned by
# repo_tests/access_control_enforcement_provisioning_test.py.
access_control_enforcement_mode: log_only
access_control_enforcement_seeder: >-
  {{ project_root }}/autobot-infrastructure/shared/scripts/security/seed_enforcement_mode.py
# The seeder imports services.feature_flags and autobot_shared, so it needs the
# BACKEND venv, not `{{ project_root }}/venv` -- that path does not exist on a
# provisioned host (roles/backend installs into
# `backend_install_dir`/venv = /opt/autobot/autobot-backend/venv). Pointing at
# the missing one made the task fail on every host, which is this issue's own
# defect a layer down: the writer is wired in and still never writes.
access_control_backend_dir: "{{ project_root }}/autobot-backend"
access_control_enforcement_python: "{{ access_control_backend_dir }}/venv/bin/python"

# Session ownership
session_ownership_backfill: true
session_ownership_strict_mode: false  # Reject if owner missing

# Gradual rollout configuration
rollout_phase: 0  # 0=prep, 1=backfill, 2=audit, 3=log_only, 4=partial, 5=full, 6=validation
auto_proceed_phases: false
rollout_validation_timeout: 300  # seconds

# Monitoring
enable_access_monitoring: true
monitoring_interval: 60  # seconds
alert_on_violations: true
alert_threshold: 10  # violations per minute

# Redis configuration
redis_backup_before_changes: true
redis_backup_retention_days: 30

# Validation
run_validation_tests: true
validation_test_count: 100
validation_failure_threshold: 5  # percent

# Rollback configuration
enable_auto_rollback: false
rollback_on_error_rate: 10  # percent

# Legacy compatibility
legacy_mode_support: true
grace_period_days: 30
