# LLM Role - Ollama LLM inference server for AutoBot
# Issue #1040: GPU detection + conditional model pulling
---

# -----------------------------------------------------------------
# Phase 1: GPU Detection
# -----------------------------------------------------------------

- name: "GPU | Detect NVIDIA GPU via nvidia-smi"
  ansible.builtin.command:
    cmd: nvidia-smi --query-gpu=name --format=csv,noheader
  register: _nvidia_smi_result
  changed_when: false
  # (#2872) Intentional: nvidia-smi exits rc != 0 when no GPU is present;
  # the result drives GPU vs CPU model selection below.
  failed_when: false
  when: llm_has_gpu == "auto"

- name: "GPU | Set GPU fact from detection"
  ansible.builtin.set_fact:
    _llm_gpu_detected: >-
      {{ _nvidia_smi_result.rc == 0
         and _nvidia_smi_result.stdout | default('') | length > 0 }}
  when: llm_has_gpu == "auto"

- name: "GPU | Set GPU fact from override"
  ansible.builtin.set_fact:
    _llm_gpu_detected: "{{ llm_has_gpu | bool }}"
  when: llm_has_gpu != "auto"

- name: "GPU | Report detection result"
  ansible.builtin.debug:
    msg: >-
      GPU detected: {{ _llm_gpu_detected }}
      {% if _nvidia_smi_result is defined and _nvidia_smi_result.rc == 0 %}
      ({{ _nvidia_smi_result.stdout | default('unknown') | trim }})
      {% endif %}

- name: "GPU | Build model list for this node"
  ansible.builtin.set_fact:
    _llm_models_to_pull: >-
      {{ llm_cpu_models + (llm_gpu_models if _llm_gpu_detected | bool else []) }}

- name: "GPU | Set effective concurrency for CPU-only nodes"
  ansible.builtin.set_fact:
    _llm_effective_max_loaded: "{{ llm_cpu_max_loaded_models }}"
    _llm_effective_num_parallel: "{{ llm_cpu_num_parallel }}"
    _llm_effective_keep_alive: "{{ llm_cpu_keep_alive }}"
    _llm_effective_num_gpu: -1
  when: not (_llm_gpu_detected | bool)

- name: "GPU | Set effective concurrency for GPU nodes"
  ansible.builtin.set_fact:
    _llm_effective_max_loaded: "{{ llm_max_loaded_models }}"
    _llm_effective_num_parallel: "{{ llm_num_parallel }}"
    _llm_effective_keep_alive: "{{ llm_keep_alive }}"
    _llm_effective_num_gpu: "{{ llm_num_gpu }}"
  when: _llm_gpu_detected | bool

- name: "GPU | Display effective configuration"
  ansible.builtin.debug:
    msg:
      - "Models to pull: {{ _llm_models_to_pull }}"
      - "Max loaded: {{ _llm_effective_max_loaded }}"
      - "Parallel: {{ _llm_effective_num_parallel }}"
      - "GPU layers: {{ _llm_effective_num_gpu }}"

# -----------------------------------------------------------------
# Phase 2: Ollama Installation
# -----------------------------------------------------------------

- name: "Install | Check if Ollama is already installed"
  ansible.builtin.stat:
    path: /usr/local/bin/ollama
  register: _ollama_binary

# #18128: presence is not enough. Gating install on the binary existing meant
# an Ollama already on the box was never upgraded, so the registry refused a
# manifest it could not read and the role failed pulling a model it ships by
# default (412, observed on 0.19.0). Compare the version and install when absent
# OR below the floor; the vendor installer upgrades in place.
- name: "Install | Read the installed Ollama version (#18128)"
  ansible.builtin.command:
    cmd: ollama --version
  register: _ollama_version_raw
  changed_when: false
  failed_when: false
  when: _ollama_binary.stat.exists
  check_mode: false

- name: "Install | Parse the installed Ollama version (#18128)"
  ansible.builtin.set_fact:
    # `ollama version is 0.19.0` -> `0.19.0`. An unparseable or failed read
    # this empty, which the condition below treats as "needs installing" and not
    # as "satisfied" -- a version we could not read must not pass a floor check.
    _ollama_version: >-
      {{ (_ollama_version_raw.stdout | default('')
          | regex_search('[0-9]+\.[0-9]+\.[0-9]+') | default('', true))
         if (_ollama_binary.stat.exists
             and (_ollama_version_raw.rc | default(1)) == 0)
         else '' }}

- name: "Install | Decide whether Ollama must be installed or upgraded (#18128)"
  ansible.builtin.set_fact:
    _ollama_needs_install: >-
      {{ (not _ollama_binary.stat.exists)
         or (_ollama_version | length == 0)
         or (_ollama_version is version(llm_ollama_min_version, '<')) }}

- name: "Install | Report the Ollama version decision (#18128)"
  ansible.builtin.debug:
    msg: >-
      Ollama installed={{ _ollama_version | default('(none)', true) }}
      floor={{ llm_ollama_min_version }}
      action={{ 'install/upgrade' if _ollama_needs_install else 'keep' }}

# #6719: bounded shell apt-get update — see roles/nginx/tasks/main.yml.
- name: "Install | Refresh apt cache (best-effort, bounded; #6719)"
  ansible.builtin.command:
    cmd: >-
      timeout 60 apt-get update -qq
      -o Acquire::Retries=0
      -o Acquire::http::Timeout=10
  become: true
  changed_when: false
  failed_when: false
  when: _ollama_needs_install

- name: "Install | Install LLM dependencies"
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - zstd
    state: present
  when: _ollama_needs_install

- name: "Install | Download Ollama installer"
  ansible.builtin.get_url:
    url: https://ollama.ai/install.sh
    dest: /tmp/ollama-install.sh
    mode: "0755"
  when:
    - llm_install_ollama | default(true)
    - _ollama_needs_install

- name: "Install | Install Ollama"
  # No `creates:` guard (#18128): it skipped when the binary existed, which is
  # the upgrade case. `_ollama_needs_install` is the idempotence condition now.
  ansible.builtin.shell:
    cmd: /tmp/ollama-install.sh
  when:
    - llm_install_ollama | default(true)
    - _ollama_needs_install

- name: "Install | Create Ollama data directory"
  ansible.builtin.file:
    path: "{{ llm_models_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ llm_user }}"
    group: "{{ llm_group }}"

# -----------------------------------------------------------------
# Phase 3: Service Configuration
# -----------------------------------------------------------------

- name: "Service | Deploy Ollama systemd service"
  ansible.builtin.template:
    src: ollama.service.j2
    dest: /etc/systemd/system/ollama.service
    mode: "0644"
  notify:
    - reload systemd
    - restart ollama

- name: "Service | Enable and start Ollama"
  ansible.builtin.systemd:
    name: ollama
    state: started
    enabled: true
    daemon_reload: true

- name: "Service | Wait for Ollama to be ready"
  ansible.builtin.uri:
    url: "http://localhost:{{ llm_port }}/api/tags"
    method: GET
    status_code: 200
  register: result
  until: result.status == 200
  retries: 30
  delay: 2

# -----------------------------------------------------------------
# Phase 4: Model Pulling (conditional on hardware)
# -----------------------------------------------------------------

# #19862: "All 0 models present" read as success when Apply sent empty lists. This fails rather than
# warns, unlike the skipped-GPU-tier warning below: there a node still gets its CPU models, here it gets
# none. llm_pull_models: false is how an operator asks for a node with no models.
- name: "Models | There is something to pull"
  ansible.builtin.assert:
    that:
      - _llm_models_to_pull | length > 0
    fail_msg: >-
      No models to pull for this node (GPU detected: {{ _llm_gpu_detected }}): the model lists that apply
      to it are empty. Set them, or set llm_pull_models to false to provision this node without models.
    quiet: true
  when: llm_pull_models | default(true)

- name: "Models | Pull models appropriate for this node"
  ansible.builtin.command:
    cmd: "ollama pull {{ item }}"
  loop: "{{ _llm_models_to_pull }}"
  when: llm_pull_models | default(true)
  become: true
  register: _model_pull
  changed_when: "'pulling' in (_model_pull.stderr | default(''))"
  failed_when: _model_pull.rc != 0
  tags: ['llm', 'models']


# #15502: a pull that returned 0 is not proof the model is usable. Check presence, and name the
# tiers this node class does not pull so the skip is visible rather than silent.
- name: "Models | List the models Ollama holds"
  ansible.builtin.command:
    cmd: ollama list
  become: true
  register: _llm_installed
  changed_when: false
  check_mode: false
  when: llm_pull_models | default(true)
  tags: ['llm', 'models']

- name: "Models | Assert every model for this node is present"
  ansible.builtin.assert:
    that: _llm_missing | length == 0
    fail_msg: >-
      Ollama is missing {{ _llm_missing | length }} model(s) this node should hold:
      {{ _llm_missing | join(', ') }}. Held: {{ _llm_held | join(', ') }}.
    success_msg: "All {{ _llm_models_to_pull | length }} models for this node are present."
  vars:
    # `ollama list` prints a NAME header row, then `<name>:<tag>  <id>  <size>  <age>`.
    _llm_held: >-
      {{ _llm_installed.stdout_lines[1:] | map('regex_replace', '\s.*$', '')
         | map('regex_replace', ':latest$', '') | list }}
    _llm_missing: >-
      {{ _llm_models_to_pull | map('regex_replace', ':latest$', '')
         | reject('in', _llm_held) | list }}
  when:
    - llm_pull_models | default(true)
    - not ansible_check_mode
  tags: ['llm', 'models']

- name: "Models | WARNING canonical tiers skipped on this node class"
  ansible.builtin.debug:
    msg: >-
      WARNING: this node is CPU-only, so the GPU-class tier models were NOT pulled and the
      tiers they serve are unavailable here: {{ llm_gpu_models | join(', ') }}.
  when:
    - llm_pull_models | default(true)
    - not (_llm_gpu_detected | bool)
    - llm_gpu_models | length > 0
  tags: ['llm', 'models']
