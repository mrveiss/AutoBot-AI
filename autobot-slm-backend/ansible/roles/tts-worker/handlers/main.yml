---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart tts-worker
  when: autobot_restart_services | default(true) | bool  # #20743: false on a sync without restarts
  ansible.builtin.systemd:
    name: autobot-tts-worker
    state: restarted
