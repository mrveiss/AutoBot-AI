# TTS Worker Role - Pocket TTS text-to-speech service (#1054)
---

# ============================================================
# Per-role service account
# ============================================================
- name: "TTS Worker | Create autobot-tts system group"
  ansible.builtin.group:
    name: "{{ tts_group }}"
    system: true
    state: present
  tags: ['tts', 'users']

- name: "TTS Worker | Create per-role service account"
  ansible.builtin.user:
    name: "{{ tts_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    group: "{{ tts_group }}"
    comment: "AutoBot TTS worker service account"
    state: present
  tags: ['tts', 'users']

# #12425: supplementary (not primary) membership in the shared `autobot`
# group so this role can write into the shared, setgid /var/log/autobot dir
# (see common role) via group permission, without owning that directory
# itself — see the "Create service directories" task below, which
# deliberately excludes tts_log_dir from the owner/group it applies to the
# role's own, exclusively-owned dirs.
- name: "TTS Worker | Join shared autobot log group (#12425)"
  ansible.builtin.user:
    name: "{{ tts_user }}"
    groups: autobot
    append: true
  tags: ['tts', 'users']

# ============================================================
# Per-role env at /etc/autobot/
# ============================================================
- name: "TTS Worker | Ensure /etc/autobot dir exists"
  ansible.builtin.file:
    path: /etc/autobot
    state: directory
    mode: "0755"
    owner: root
    group: root
  tags: ['tts', 'config']

- name: "TTS Worker | Deploy /etc/autobot/autobot-tts-worker.env"
  ansible.builtin.template:
    src: tts-worker.env.j2
    dest: /etc/autobot/autobot-tts-worker.env
    mode: "0640"
    owner: root
    group: "{{ tts_group }}"
  notify: restart tts-worker
  tags: ['tts', 'config']

# ============================================================
# System dependencies
# ============================================================
# #6719: bounded shell apt-get update — see roles/nginx/tasks/main.yml.
- name: "TTS Worker | Refresh apt cache (best-effort, bounded; #6719)"
  ansible.builtin.command:
    cmd: >-
      timeout 60 apt-get update -qq
      -o Acquire::Retries=0
      -o Acquire::http::Timeout=10
  become: true
  changed_when: false
  failed_when: false
  tags: ['tts', 'packages']

- name: "TTS Worker | Install system dependencies"
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - libsndfile1
    state: present
  tags: ['tts', 'packages']

# ============================================================
# Directories
# ============================================================
- name: "TTS Worker | Create service directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ tts_user }}"
    group: "{{ tts_group }}"
  loop:
    - "{{ tts_install_dir }}"
    - "{{ tts_models_dir }}"
    - "{{ tts_voices_dir }}"
  tags: ['tts', 'dirs']

# #12425: tts_log_dir defaults to the SHARED /var/log/autobot (common role),
# not a TTS-exclusive path — re-chowning it to tts_user/tts_group above (as
# the other three, genuinely TTS-exclusive dirs correctly are) clobbered
# common's autobot:autobot ownership on every run of this role, leaving the
# `autobot` service user (autobot-slm-backend) unable to create its own
# self-update-ansible.log. Converge to the SAME canonical ownership the
# common role applies, regardless of which role runs last; the group-write
# bit + this role's own membership in the `autobot` group (above) is what
# lets tts_user still write its log files here.
- name: "TTS Worker | Ensure shared log directory uses canonical ownership (#12425)"
  ansible.builtin.file:
    path: "{{ tts_log_dir }}"
    state: directory
    mode: "02775"
    owner: autobot
    group: autobot
  # Only applies the shared canonical ownership while tts_log_dir actually
  # points at the shared dir; a future group_vars override to a
  # TTS-exclusive path falls through to the tts_user-owned dir below instead.
  when: tts_log_dir == '/var/log/autobot'
  tags: ['tts', 'dirs']

- name: "TTS Worker | Create TTS-exclusive log directory (override path only, #12425)"
  ansible.builtin.file:
    path: "{{ tts_log_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ tts_user }}"
    group: "{{ tts_group }}"
  when: tts_log_dir != '/var/log/autobot'
  tags: ['tts', 'dirs']

- name: "TTS Worker | Fix HF model cache ownership (hub/xet may be owned by earlier user)"
  ansible.builtin.command:
    cmd: "chown -R {{ tts_user }}:{{ tts_group }} {{ tts_models_dir }}/{{ item }}"
    removes: "{{ tts_models_dir }}/{{ item }}"
  loop:
    - hub
    - xet
  become: true
  tags: ['tts', 'dirs']

# ============================================================
# Python venv
# ============================================================
- name: "TTS Worker | Enforce venv target Python version (env-drift fix)"
  ansible.builtin.include_role:
    name: python314
    tasks_from: ensure_venv_version
  vars:
    venv_path: "{{ tts_install_dir }}/venv"
    venv_python: python3.14
  tags: ['tts', 'venv']

- name: "TTS Worker | Create Python virtual environment"
  ansible.builtin.command:
    cmd: python3.14 -m venv {{ tts_install_dir }}/venv
    creates: "{{ tts_install_dir }}/venv/bin/python"
  tags: ['tts', 'venv']

- name: "TTS Worker | Fix venv ownership"
  ansible.builtin.file:
    path: "{{ tts_install_dir }}/venv"
    state: directory
    owner: "{{ tts_user }}"
    group: "{{ tts_group }}"
    recurse: true
  tags: ['tts', 'venv']

- name: "TTS Worker | Upgrade pip in venv"
  ansible.builtin.pip:
    name: pip
    virtualenv: "{{ tts_install_dir }}/venv"
    state: latest
  become_user: "{{ tts_user }}"
  environment:
    PIP_DEFAULT_TIMEOUT: "120"
  timeout: 120  # Issue #2835: prevent indefinite hang on network issues
  tags: ['tts', 'venv']

- name: "TTS Worker | Install FastAPI and server dependencies"
  ansible.builtin.pip:
    name:
      - fastapi>=0.100.0
      - uvicorn[standard]>=0.20.0
      - python-multipart>=0.0.6
      - aiofiles>=23.0.0
    virtualenv: "{{ tts_install_dir }}/venv"
    state: present
  become_user: "{{ tts_user }}"
  environment:
    PIP_DEFAULT_TIMEOUT: "120"
  timeout: 300  # Issue #2835: prevent indefinite hang on dependency resolution
  tags: ['tts', 'packages']

- name: "TTS Worker | Install torch CPU-only (Pocket TTS requires >=2.5)"
  ansible.builtin.pip:
    name:
      - "torch>=2.5.0"
    virtualenv: "{{ tts_install_dir }}/venv"
    state: present
    extra_args: "--index-url https://download.pytorch.org/whl/cpu --timeout 300"
  become_user: "{{ tts_user }}"
  environment:
    PIP_DEFAULT_TIMEOUT: "300"
  timeout: 600  # Issue #2835: torch downloads are large, prevent indefinite hang
  tags: ['tts', 'packages']

- name: "TTS Worker | Install pocket-tts and audio dependencies"
  ansible.builtin.pip:
    name:
      # pocket-tts>=2.0.0 is required for TTSModel.generate_audio_stream()
      # (incremental audio-chunk streaming used by /tts/synthesize/stream,
      # #12501) — verified present on 1.1.1, 2.0.0, and 2.1.0 (latest at
      # pin time). Floor pinned to the earliest version validated against
      # the worker's streaming code path, rather than an unbounded
      # latest-wins resolve.
      - pocket-tts>=2.0.0
      - soundfile>=0.12.0
      - numpy>=1.24.0
      - scipy>=1.10.0
    virtualenv: "{{ tts_install_dir }}/venv"
    state: present
    extra_args: "--timeout 300"
  become_user: "{{ tts_user }}"
  environment:
    PIP_DEFAULT_TIMEOUT: "300"
  timeout: 600  # Issue #2835: prevent indefinite hang on dependency resolution conflicts
  tags: ['tts', 'packages']

# ============================================================
# Pre-download model so BUILTIN_VOICES are available (#10566)
# ============================================================
# Without the model cached, the worker's first start fails to load it and the
# UI shows "no speech voices installed". Pull the weights at provision time as
# the service user (correct cache ownership) using the same HF env the worker
# uses. Best-effort: a gated model without a token, or no network, leaves the
# download to the worker's own first-start retry rather than failing the play.
- name: "TTS Worker | Deploy model pre-download helper"
  ansible.builtin.template:
    src: predownload-model.py.j2
    dest: "{{ tts_install_dir }}/predownload-model.py"
    mode: "0755"
    owner: "{{ tts_user }}"
    group: "{{ tts_group }}"
  when: tts_predownload_model | default(true) | bool
  tags: ['tts', 'model']

- name: "TTS Worker | Pre-download Pocket TTS model into cache (best-effort)"
  ansible.builtin.command:
    cmd: "{{ tts_install_dir }}/venv/bin/python {{ tts_install_dir }}/predownload-model.py"
  become_user: "{{ tts_user }}"
  environment:
    TTS_MODEL_ID: "{{ tts_model_id }}"
    TTS_MODELS_DIR: "{{ tts_models_dir }}"
    HF_HOME: "{{ tts_models_dir }}"
    XDG_CACHE_HOME: "{{ tts_models_dir }}"
    HF_TOKEN: "{{ tts_hf_token | default('') }}"
    HUGGING_FACE_HUB_TOKEN: "{{ tts_hf_token | default('') }}"
  register: _tts_predownload
  # Exit 2 = could not download (gated/no-token or offline); the worker retries
  # on first start, so do not fail provisioning. Only a crash (rc 1) is fatal.
  failed_when: _tts_predownload.rc not in [0, 2]
  changed_when: _tts_predownload.rc == 0
  timeout: 900  # Model shards are large; cap the download like the torch step.
  when: tts_predownload_model | default(true) | bool
  tags: ['tts', 'model']

- name: "TTS Worker | Warn when the model could not be pre-downloaded"
  ansible.builtin.debug:
    msg: >-
      Pocket TTS model '{{ tts_model_id }}' was not pre-downloaded
      (built-in voices will be unavailable until the worker downloads it on
      first start). Most common cause: the model is gated and tts_hf_token
      (vault_hf_token) is not set, or the host has no network access.
  when:
    - tts_predownload_model | default(true) | bool
    - _tts_predownload.rc | default(0) == 2
  tags: ['tts', 'model']

# ============================================================
# Deploy service files
# ============================================================
# #12886: these live in code_only.yml so the builtin updater can refresh a
# deployed worker without re-running the provisioning above. Included here
# rather than duplicated, so provisioning and update share one definition.
- name: "TTS Worker | Deploy service files"
  ansible.builtin.include_tasks: code_only.yml
  tags: ['tts', 'deploy']

# ============================================================
# Firewall
# ============================================================
- name: "TTS Worker | Check if UFW is installed"
  ansible.builtin.command: which ufw
  register: _ufw_installed
  changed_when: false
  # (#2872) Intentional: UFW may not be installed on all hosts.
  failed_when: false
  tags: ['tts', 'firewall']

- name: "TTS Worker | Allow TTS worker port via UFW"
  community.general.ufw:
    rule: allow
    port: "{{ tts_port }}"
    proto: tcp
    comment: "TTS Worker API"
  when: _ufw_installed.rc == 0
  tags: ['tts', 'firewall']

# ============================================================
# Enable and start
# ============================================================
- name: "TTS Worker | Enable and start service"
  ansible.builtin.systemd:
    name: autobot-tts-worker
    state: started
    enabled: true
    daemon_reload: true
  tags: ['tts', 'service']
