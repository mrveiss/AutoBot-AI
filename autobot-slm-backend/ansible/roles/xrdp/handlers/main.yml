# xrdp Role - Handlers (GH#1525)
---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: restart xrdp
  ansible.builtin.systemd:
    name: "{{ xrdp_service_name }}"
    state: restarted
  become: true
