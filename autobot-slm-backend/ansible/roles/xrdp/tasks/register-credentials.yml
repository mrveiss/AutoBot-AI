#
# xrdp Role - Register RDP credentials in SLM database (GH#1525)
#
# Called at the end of the xrdp role to auto-register this node's
# RDP credentials so they appear in fleet tools automatically.
---
- name: "xrdp | Register this node's RDP credentials (#18558)"
  ansible.builtin.include_tasks: ../../../_shared/tasks/register_node_credentials.yml
  vars:
    node_credentials_label: xrdp
    node_credentials_kind: RDP
    node_credentials_path: rdp-credentials
    node_credentials_body:
      credential_type: "rdp"
      name: "{{ inventory_hostname }} RDP"
      port: "{{ xrdp_port | int }}"
      auth_method: "pam"
