---
# Browser role - Playwright, VNC, and desktop environment

# ============================================================
# Phase 1 CLEAN - remove legacy/wrong-node dirs  (#926 Phase 4)
# ============================================================
- name: "Browser | Include clean tasks"
  ansible.builtin.import_tasks: clean.yml
  tags: ['clean']

# ============================================================
# Per-role service account  (#926 Phase 4)
# ============================================================
- name: "Browser | Create autobot-browser system group"
  ansible.builtin.group:
    name: "{{ browser_group }}"
    system: true
    state: present
  tags: ['browser', 'users']

- name: "Browser | Create per-role service account"
  ansible.builtin.user:
    name: "{{ browser_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    group: "{{ browser_group }}"
    comment: "AutoBot browser-worker service account"
    state: present
  tags: ['browser', 'users']

# ============================================================
# Per-role env at /etc/autobot/  (#926 Phase 4)
# ============================================================
- name: "Browser | Ensure /etc/autobot dir exists"
  ansible.builtin.file:
    path: /etc/autobot
    state: directory
    mode: "0755"
    owner: root
    group: root
  tags: ['browser', 'config']

- name: "Browser | Deploy /etc/autobot/autobot-browser-worker.env"
  ansible.builtin.template:
    src: autobot-browser-worker.env.j2
    dest: /etc/autobot/autobot-browser-worker.env
    mode: "0640"
    owner: root
    group: "{{ browser_group }}"
  tags: ['browser', 'config']

# ============================================================
# Sync browser worker code from code_source
# ============================================================
- name: "Browser | Ensure worker directory exists"
  ansible.builtin.file:
    path: /opt/autobot/autobot-browser-worker
    state: directory
    owner: "{{ browser_user }}"
    group: "{{ browser_group }}"
    mode: '0755'
  become: true
  tags: ['browser', 'deploy']

- name: "Browser | Sync browser worker code from code_source"
  ansible.posix.synchronize:
    src: "{{ code_source_dir | default('/opt/autobot/code_source') }}/autobot-browser-worker/"
    dest: /opt/autobot/autobot-browser-worker/
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=__pycache__"
      - "--exclude=.git"
      - "--exclude=venv"
  tags: ['browser', 'deploy']

# ============================================================
# VNC + desktop environment (opt-in, default false)  (#1363)
# Guard: install_vnc must be true AND node must have 'vnc' in
# node_roles (when defined).  Prevents VNC deployment on headless
# Playwright workers like .25.  (#2989)
# ============================================================
- name: "Browser | Install desktop environment and VNC"
  apt:
    name:
      - xfce4
      - xfce4-goodies
      - tightvncserver
      - dbus-x11
      - x11vnc
      - xvfb
    state: present
  become: true
  when:
    - install_vnc | default(false)
    - node_roles is not defined or 'vnc' in node_roles
  tags: ['browser', 'packages', 'vnc']

# ============================================================
# Playwright headless browser automation
# Node.js is installed by shared dependency roles in Phase 0
# ============================================================
- name: "Browser | Install Playwright system dependencies"
  apt:
    # Ubuntu 24.04 (noble) renamed several libs with `t64` suffix as part of
    # the time_t 64-bit transition. The transitional virtual packages are
    # missing on arm64 noble (DGX Spark + ARM64 servers).
    #
    # Audit (#7220):
    #   libasound2 — confirmed broken on arm64 noble (#7207)
    #   libatk1.0-0 — packages.ubuntu.com returns HTTP 500 on arm64 noble
    #     (suspect; defensive rename applied)
    #   libcups2, libatk-bridge2.0-0 — both forms exist on noble (transitional
    #     packages still present); no rename needed yet
    #   Other libs (libnss3, libdrm2, libxkbcommon0, libxcomposite1,
    #     libxdamage1, libxfixes3, libxrandr2, libgbm1) kept original names
    name: >-
      {{ ['python3', 'python3-pip', 'python3-venv',
          'libnss3', 'libatk-bridge2.0-0',
          'libcups2', 'libdrm2', 'libxkbcommon0',
          'libxcomposite1', 'libxdamage1', 'libxfixes3',
          'libxrandr2', 'libgbm1']
          + (['libasound2t64', 'libatk1.0-0t64']
             if ansible_facts['distribution_release'] == 'noble'
             else ['libasound2', 'libatk1.0-0']) }}
    state: present
  become: true
  tags: ['browser', 'packages']

- name: "Browser | Install Playwright and FastAPI dependencies via pip"
  pip:
    name:
      - playwright
      - playwright-stealth
      - uvicorn
      - fastapi
    state: present
    executable: pip3
  become: true
  environment:
    PIP_DEFAULT_TIMEOUT: "120"
  timeout: 300  # Issue #2835: prevent indefinite hang on dependency resolution
  tags: ['browser', 'packages']

- name: "Browser | Check if browser worker directory exists"
  ansible.builtin.stat:
    path: /opt/autobot/autobot-browser-worker/package.json
  register: _browser_worker_dir
  tags: ['browser', 'packages']

# (#2872) Replaced failed_when: false with a stat guard -- npm install
# failures on a deployed worker directory must surface.
- name: "Browser | Install Node.js dependencies for browser worker"
  npm:
    path: /opt/autobot/autobot-browser-worker
    state: present
  become: true
  when: _browser_worker_dir.stat.exists | default(false)
  tags: ['browser', 'packages']

# Install Chromium via the Node.js playwright package (not Python pip playwright).
# Browsers live under /var/lib/autobot/playwright-browsers (world-readable, root-owned)
# so the service user can always find them regardless of which user ran the install
# or where the service user's HOME points. (#4662)
- name: "Browser | Create Playwright browsers directory"
  ansible.builtin.file:
    path: /var/lib/autobot/playwright-browsers
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: ['browser', 'packages']

# Guard: skip the ~2-minute install when Chromium is already present. (#4855, #4662)
# Playwright installs into a versioned subdir (chromium-NNNN/chrome-linux/chrome);
# find the first match rather than hard-coding the version number.
- name: "Browser | Check if Playwright Chromium is already installed"
  ansible.builtin.find:
    paths: /var/lib/autobot/playwright-browsers
    patterns: "chrome"
    recurse: true
    file_type: file
  register: _chromium_binary
  tags: ['browser', 'packages']

- name: "Browser | Install Playwright chromium browser via Node.js"
  ansible.builtin.command:
    cmd: node_modules/.bin/playwright install chromium
    chdir: /opt/autobot/autobot-browser-worker
  become: true
  environment:
    PLAYWRIGHT_BROWSERS_PATH: /var/lib/autobot/playwright-browsers
  changed_when: true
  when:
    - _browser_worker_dir.stat.exists | default(false)
    - _chromium_binary.matched == 0
  tags: ['browser', 'packages']

- name: "Browser | Find Playwright browser directories for permission fix (#5085)"
  ansible.builtin.find:
    paths: /var/lib/autobot/playwright-browsers
    file_type: directory
    recurse: true
  register: _pb_dirs
  become: true
  when: _browser_worker_dir.stat.exists | default(false)
  tags: ['browser', 'packages']

- name: "Browser | Set Playwright browser directories world-executable (#5085)"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0755"
  loop: "{{ _pb_dirs.files | default([]) }}"
  become: true
  when: _browser_worker_dir.stat.exists | default(false)
  tags: ['browser', 'packages']

- name: "Browser | Find Playwright browser data files for permission fix (#5085)"
  ansible.builtin.find:
    paths: /var/lib/autobot/playwright-browsers
    file_type: file
    recurse: true
  register: _pb_files
  become: true
  when: _browser_worker_dir.stat.exists | default(false)
  tags: ['browser', 'packages']

- name: "Browser | Set Playwright browser data files world-readable (#5085)"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: file
    mode: "0644"
  loop: "{{ _pb_files.files | default([]) }}"
  become: true
  when: _browser_worker_dir.stat.exists | default(false)
  tags: ['browser', 'packages']

- name: "Browser | Create VNC directory"
  file:
    path: /home/autobot/.vnc
    state: directory
    owner: autobot
    group: autobot
    mode: '0700'
  become: true
  when:
    - install_vnc | default(false)
    - node_roles is not defined or 'vnc' in node_roles
  tags: ['browser', 'directories', 'vnc']

- name: "Browser | Check if VNC secrets file exists"
  stat:
    path: /etc/autobot/vnc-secrets.env
  register: browser_vnc_secrets_stat
  become: true
  when:
    - install_vnc | default(false)
    - node_roles is not defined or 'vnc' in node_roles
  tags: ['browser', 'vnc']

- name: "Browser | Generate secure VNC password"
  shell: |
    password=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 16)
    echo "VNC_PASSWORD=${password}" > /etc/autobot/vnc-secrets.env
    chmod 0640 /etc/autobot/vnc-secrets.env
    chown root:autobot /etc/autobot/vnc-secrets.env
  args:
    creates: /etc/autobot/vnc-secrets.env
  become: true
  when:
    - install_vnc | default(false)
    - node_roles is not defined or 'vnc' in node_roles
    - not (browser_vnc_secrets_stat.stat.exists | default(false))
  tags: ['browser', 'vnc']

- name: "Browser | Read VNC password"
  shell: >
    grep '^VNC_PASSWORD=' /etc/autobot/vnc-secrets.env
    | cut -d= -f2
  register: browser_vnc_password
  changed_when: false
  become: true
  when:
    - install_vnc | default(false)
    - node_roles is not defined or 'vnc' in node_roles
  tags: ['browser', 'vnc']

- name: "Browser | Set VNC password file"
  shell: |
    echo '{{ browser_vnc_password.stdout }}' | vncpasswd -f \
      > /home/autobot/.vnc/passwd
    chmod 0600 /home/autobot/.vnc/passwd
    chown autobot:autobot /home/autobot/.vnc/passwd
  become: true
  when:
    - install_vnc | default(false)
    - node_roles is not defined or 'vnc' in node_roles
    - browser_vnc_password.stdout | default('') | length > 0
  tags: ['browser', 'vnc']

- name: "Browser | Create VNC systemd service"
  template:
    src: vnc.service.j2
    dest: /etc/systemd/system/autobot-vnc.service
    mode: '0644'
  become: true
  when:
    - install_vnc | default(false)
    - node_roles is not defined or 'vnc' in node_roles
  notify:
    - reload systemd
    - restart vnc
  tags: ['browser', 'systemd', 'vnc']

- name: "Browser | Create Playwright systemd service"
  template:
    src: playwright.service.j2
    dest: /etc/systemd/system/autobot-playwright.service
    mode: '0644'
  become: true
  notify:
    - reload systemd
    - restart playwright
  tags: ['browser', 'systemd']

- name: "Browser | Configure firewall - Allow VNC"
  ufw:
    rule: allow
    port: "{{ vnc_port }}"
    proto: tcp
    from_ip: "{{ network_subnet }}"
    comment: "VNC Server"
  become: true
  when:
    - install_vnc | default(false)
    - node_roles is not defined or 'vnc' in node_roles
  notify: reload firewall
  tags: ['browser', 'firewall', 'vnc']

- name: "Browser | Remove legacy playwright UFW rules (#4633)"
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    from_ip: "{{ network_subnet }}"
    delete: true
  become: true
  loop: "{{ playwright_ports_legacy | default([]) }}"
  when: item | int != playwright_port | int
  ignore_errors: true
  tags: ['browser', 'firewall']

- name: "Browser | Configure firewall - Allow Playwright API"
  ufw:
    rule: allow
    port: "{{ playwright_port }}"
    proto: tcp
    from_ip: "{{ network_subnet }}"
    comment: "Playwright API"
  become: true
  notify: reload firewall
  tags: ['browser', 'firewall']

- name: "Browser | Enable VNC service"
  systemd:
    name: autobot-vnc
    enabled: true
    daemon_reload: true
  become: true
  when:
    - install_vnc | default(false)
    - node_roles is not defined or 'vnc' in node_roles
  tags: ['browser', 'service', 'vnc']

- name: "Browser | Enable Playwright service"
  systemd:
    name: autobot-playwright
    enabled: true
    daemon_reload: true
  become: true
  tags: ['browser', 'service']

- name: "Browser | Display configuration summary"
  debug:
    msg:
      - "=== Browser Configuration Complete ==="
      - "Playwright Port: {{ playwright_port }}"
      - "Browsers: Chromium"
      - "VNC Installed: {{ install_vnc | default(false) }}"
      - "Services: autobot-playwright{{ ' + autobot-vnc' if (install_vnc | default(false)) else '' }}"
      - "Note: Services will start when code is synced"
  tags: ['browser', 'report']
