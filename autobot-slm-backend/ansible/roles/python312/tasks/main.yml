# Shared dependency role: Python 3.12 (deadsnakes PPA)
# Installs Python 3.12 interpreter and venv support.
# Venv creation and pip installs stay in service roles.
---

- name: "python312 | Check if Python 3.12 is available"
  ansible.builtin.command:
    cmd: python3.12 --version
  register: _py312_check
  changed_when: false
  # (#2872) Intentional: python3.12 may not be installed yet;
  # rc != 0 triggers the deadsnakes PPA installation below.
  failed_when: false
  tags: ['deps', 'python312']

- name: "python312 | Install software-properties-common"
  ansible.builtin.apt:
    name: software-properties-common
    state: present
  become: true
  when: _py312_check.rc != 0
  tags: ['deps', 'python312']

# #7218: idempotent repo-add — preserve device-shipped PPA if present
- name: "python312 | Add deadsnakes PPA (idempotent, #7218)"
  ansible.builtin.include_tasks: ../../_shared/tasks/add_apt_repository_idempotent.yml
  vars:
    apt_repo_match: "deadsnakes/ppa"
    apt_repo_spec: "ppa:deadsnakes/ppa"
    apt_repo_filename: "deadsnakes"
    apt_repo_label: "deadsnakes (Python 3.12)"
  when: _py312_check.rc != 0
  tags: ['deps', 'python312']

# #6719: bounded shell apt-get update — see roles/nginx/tasks/main.yml.
# Only fires when Python 3.12 is missing, but when it does it must tolerate
# flaky PPAs (the deadsnakes PPA was just added; if it's unreachable, the
# next deploy retry will still need to install Python 3.12).
- name: "python312 | Refresh apt cache (best-effort, bounded; #6719)"
  ansible.builtin.command:
    cmd: >-
      timeout 60 apt-get update -qq
      -o Acquire::Retries=0
      -o Acquire::http::Timeout=10
  become: true
  changed_when: false
  failed_when: false
  when: _py312_check.rc != 0
  tags: ['deps', 'python312']

- name: "python312 | Install Python 3.12"
  ansible.builtin.apt:
    name: "{{ python312_packages }}"
    state: present
  become: true
  when: _py312_check.rc != 0
  tags: ['deps', 'python312']

- name: "python312 | Verify Python 3.12 is available"
  ansible.builtin.command:
    cmd: python3.12 --version
  changed_when: false
  tags: ['deps', 'python312']
