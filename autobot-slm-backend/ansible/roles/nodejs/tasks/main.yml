# Shared dependency role: Node.js (NodeSource)
# Installs Node.js and npm.
# npm install / npm build stays in service roles.
---

- name: "nodejs | Check if Node.js is already installed"
  ansible.builtin.command:
    cmd: node --version
  register: _node_check
  changed_when: false
  # (#2872) Intentional: `node` exits rc=127 when not installed;
  # the result gates conditional installation below.
  failed_when: false
  tags: ['deps', 'nodejs']

- name: "nodejs | Install prerequisites"
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - ca-certificates
    state: present
  become: true
  when: _node_check.rc != 0
  tags: ['deps', 'nodejs']

- name: "nodejs | Check if NodeSource repo exists"
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/nodesource.list
  register: _nodesource_repo
  tags: ['deps', 'nodejs']

- name: "nodejs | Add NodeSource repository"
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_{{ nodejs_major_version }}.x | bash -
  become: true
  when:
    - _node_check.rc != 0
    - not _nodesource_repo.stat.exists
  tags: ['deps', 'nodejs']

# #6719: bounded shell apt-get update — see roles/nginx/tasks/main.yml for
# rationale. Ansible's apt module aborts on any partial-fetch warning, the
# CLI does not. cache_valid_time alone isn't enough once cache ages past 1h.
- name: "nodejs | Refresh apt cache (best-effort, bounded; #6719)"
  ansible.builtin.command:
    cmd: >-
      timeout 60 apt-get update -qq
      -o Acquire::Retries=0
      -o Acquire::http::Timeout=10
  become: true
  changed_when: false
  failed_when: false
  tags: ['deps', 'nodejs']

- name: "nodejs | Install Node.js"
  ansible.builtin.apt:
    name: nodejs
    state: present
  become: true
  tags: ['deps', 'nodejs']

- name: "nodejs | Verify Node.js is available"
  ansible.builtin.command:
    cmd: node --version
  changed_when: false
  tags: ['deps', 'nodejs']
