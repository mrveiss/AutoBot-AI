# Shared dependency role: Node.js (NodeSource)
# Installs Node.js and npm, and upgrades a host below node_major (#19661). The one
# NodeSource install in Ansible; repo_tests/node_major_one_home_19328_test.py holds that.
# npm install / npm build stays in service roles.
---

- name: "nodejs | Read the installed Node.js version"
  ansible.builtin.command:
    cmd: node --version
  register: _node_check
  changed_when: false
  # (#2872) Intentional: `node` exits rc=127 when not installed;
  # the result gates conditional installation below.
  failed_when: false
  tags: ['deps', 'nodejs']
  check_mode: false

- name: "nodejs | Compare the installed major with node_major"
  ansible.builtin.set_fact:
    _nodejs_upgraded: false
    _nodejs_installed_major: "{{ (_node_check.stdout | default('') | regex_replace('^v(\\d+).*$', '\\1')) | int }}"
  tags: ['deps', 'nodejs']

# A newer major is reported, never downgraded: apt would not move it, and the
# code it runs has already been built against it.
- name: "nodejs | Report a major newer than node_major"
  ansible.builtin.debug:
    msg: "Node.js v{{ _nodejs_installed_major }} is newer than node_major {{ nodejs_major_version }}; left as it is"
  when: _nodejs_installed_major | int > nodejs_major_version | int
  tags: ['deps', 'nodejs']

- name: "nodejs | Install or upgrade"
  ansible.builtin.include_tasks: install.yml
  when: _nodejs_installed_major | int < nodejs_major_version | int
  tags: ['deps', 'nodejs']
