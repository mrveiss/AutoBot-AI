#
# The updater's entry point (#19661). A failed Node.js upgrade is reported and the
# host keeps the Node.js it had: a NodeSource outage must not abort a fleet rollout
# under any_errors_fatal (#10026), and the next update retries the upgrade.
---

- name: "nodejs | Upgrade an installed Node.js below node_major"
  block:
    - name: "nodejs | Compare and upgrade"
      ansible.builtin.include_tasks: main.yml
      vars:
        nodejs_upgrade_only: true
  rescue:
    - name: "nodejs | Report the failed upgrade"
      ansible.builtin.debug:
        msg: >-
          WARNING: Node.js upgrade to {{ nodejs_major_version }} failed on {{ inventory_hostname }}
          ({{ ansible_failed_result.msg | default('no message') }}). This host keeps its current
          Node.js; the next update retries.
