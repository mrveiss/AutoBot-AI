---
# Handlers for distributed_setup role

- name: reload systemd
  systemd:
    daemon_reload: true

- name: restart autobot-coordinator
  when: create_systemd_services
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: autobot-coordinator

- name: restart health-monitor
  when: create_systemd_services
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: autobot-health-monitor.timer
