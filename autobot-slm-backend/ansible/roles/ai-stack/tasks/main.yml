# AI Stack Role - AI processing components for AutoBot
---

# ============================================================
# Phase 1 CLEAN - remove legacy/wrong-node dirs  (#926 Phase 4)
# ============================================================
- name: "AI Stack | Include clean tasks"
  ansible.builtin.import_tasks: clean.yml
  tags: ['clean']

# ============================================================
# Service account setup (#926 Phase 4, #4091: unified autobot account)
# ============================================================
# AI Stack uses the existing autobot:autobot account created by backend role.
# No separate account creation needed — all AutoBot services share autobot.

# ============================================================
# Per-role env at /etc/autobot/  (#926 Phase 4)
# ============================================================
- name: "AI Stack | Ensure /etc/autobot dir exists"
  ansible.builtin.file:
    path: /etc/autobot
    state: directory
    mode: "0755"
    owner: root
    group: root
  tags: ['ai', 'config']

# #16627 (P1b of #13568): the AI stack's Redis client (autobot_shared, via
# REDIS_* in this env file) authenticates as `default` with the SLM-generated
# password while the server stays nopass. Adopted only when no password is set,
# and always with the username -- a password alone is refused by nopass.
- name: "AI Stack | Read the SLM-generated Redis credential (#16627)"
  ansible.builtin.include_tasks: ../../../_shared/tasks/read_redis_password.yml
  tags: ['ai', 'config']

- name: "AI Stack | Adopt the SLM-generated Redis credential when none is set (#16627)"
  ansible.builtin.set_fact:
    ai_redis_password: "{{ _redis_password_read }}"
    ai_redis_username: "{{ ai_redis_username | default('', true) or _redis_username_read }}"
  when:
    - (_redis_password_read | default('') | trim) | length > 0
    - (ai_redis_password | default('') | trim) | length == 0
  no_log: true
  tags: ['ai', 'config']

- name: "AI Stack | Deploy /etc/autobot/autobot-ai-stack.env"
  ansible.builtin.template:
    src: ai-stack.env.j2
    dest: /etc/autobot/autobot-ai-stack.env
    mode: "0640"
    owner: root
    group: "{{ ai_group }}"
  notify: restart ai-stack
  tags: ['ai', 'config']

# ============================================================
# #6719: bounded shell apt-get update — see roles/nginx/tasks/main.yml.
- name: "AI Stack | Refresh apt cache (best-effort, bounded; #6719)"
  ansible.builtin.command:
    cmd: >-
      timeout 60 apt-get update -qq
      -o Acquire::Retries=0
      -o Acquire::http::Timeout=10
  become: true
  changed_when: false
  failed_when: false
  tags: ['ai-stack', 'packages']

- name: "AI Stack | Install build dependencies"
  ansible.builtin.apt:
    name:
      - build-essential
    state: present
  tags: ['ai-stack', 'packages']

- name: Create AI stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ ai_user }}"
    group: "{{ ai_group }}"
  loop:
    - "{{ ai_install_dir }}"
    - "{{ ai_log_dir }}"
    - "{{ ai_data_dir }}"
    - "{{ ai_data_dir }}/chromadb"

# ============================================================
# MVA-79: Stop ChromaDB before venv operations.
# The chroma binary lives inside the venv; wiping the venv while the service
# is running causes an outage (reported in MVA-28 and MVA-66).
# failed_when: false handles fresh installs where the unit does not exist yet.
# ============================================================
- name: "AI Stack | Stop ChromaDB before venv recreation (MVA-79)"
  ansible.builtin.systemd:
    name: autobot-chromadb
    state: stopped
  failed_when: false
  tags: ['ai', 'venv']

- name: Check existing venv Python version (#3534)
  ansible.builtin.command:
    cmd: "{{ ai_install_dir }}/venv/bin/python --version"
  register: _ai_venv_python_version
  changed_when: false
  failed_when: false

- name: Remove stale venv if not Python 3.14 (#3534)
  ansible.builtin.file:
    path: "{{ ai_install_dir }}/venv"
    state: absent
  when:
    - _ai_venv_python_version.rc == 0
    - "'Python 3.14' not in _ai_venv_python_version.stdout"

- name: Create Python virtual environment (#3534)
  ansible.builtin.command:
    cmd: python3.14 -m venv {{ ai_install_dir }}/venv
    creates: "{{ ai_install_dir }}/venv/bin/python"

- name: Fix venv ownership
  ansible.builtin.file:
    path: "{{ ai_install_dir }}/venv"
    state: directory
    owner: "{{ ai_user }}"
    group: "{{ ai_group }}"
    recurse: true

- name: Create pip cache directory for ai user (#3535)
  ansible.builtin.file:
    path: "{{ ai_data_dir }}/.cache/pip"
    state: directory
    owner: "{{ ai_user }}"
    group: "{{ ai_group }}"
    mode: "0755"

- name: Upgrade pip in venv
  ansible.builtin.pip:
    name: pip
    virtualenv: "{{ ai_install_dir }}/venv"
    # #16641: without this, pip falls back to shelling out to the standalone
    # `virtualenv` executable, absent from these hosts. Matches the
    # interpreter the "Create Python virtual environment" task above targets.
    virtualenv_command: "python3.14 -m venv"
    state: latest
  become_user: "{{ ai_user }}"
  environment:
    PIP_DEFAULT_TIMEOUT: "120"
    HOME: "{{ ai_data_dir }}"
  timeout: 120  # Issue #2835: prevent indefinite hang on network issues

# #14809: the requirements file must be delivered BEFORE anything filters or
# installs from it. It used to be copied further down, in the application-source
# loop, which runs AFTER the pip install below -- so a bad requirements file was
# self-perpetuating: the failing install aborted the play before the copy that
# would have replaced it. The node kept installing spacy long after #14279
# removed it precisely because no stable spacy supports 3.14, and the fix could
# never arrive. Delivery of a fix must not be gated behind the step the fix
# exists to unbreak.
- name: "AI Stack | Deploy requirements-ai.txt before installing from it (#14809)"
  ansible.builtin.copy:
    src: "{{ code_source_dir | default(autobot.base_dir ~ '/code_source') }}/autobot-infrastructure/shared/docker/ai-stack/requirements-ai.txt"
    dest: "{{ ai_install_dir }}/requirements-ai.txt"
    owner: "{{ ai_user }}"
    group: "{{ ai_group }}"
    mode: "0644"
  become: true
  tags: ['ai', 'deploy']

- name: Check if requirements-ai.txt exists
  ansible.builtin.stat:
    path: "{{ ai_install_dir }}/requirements-ai.txt"
  register: _ai_requirements_file

# #14272: requirements-ai.txt carries `-c ../../../../constraints/shared.txt`,
# correct where the file LIVES in the repo and wrong where it is DEPLOYED — four
# levels up from /opt/autobot/autobot-ai-stack/ is `/`, so pip looked for
# /constraints/shared.txt and aborted provisioning.
#
# Rewritten through the canonical scripts/build-filtered-requirements.sh rather
# than with a second sed here: the backend role and services/role_registry.py
# already share that script for exactly this, and it says so in its own header
# (#11117). It was never wired in here, which is the whole bug.
# #17242: generated ON THE CONTROLLER. `code_source` is the git checkout and
# nothing syncs it to a remote node, so running this script out of it on an
# ai_stack host exits 127 -- the same defect #17242 hit in the backend role, in
# a role that never runs on the manager at all. The source manifest is read from
# the same controller path the deploy task above uses.
- name: "AI Stack | Unique id for this run's controller temp files (#17242)"
  ansible.builtin.set_fact:
    _req_run_id: "{{ 999999999 | random }}"
  # Set once per host per run, so the generate step and the copy that reads
  # its output agree. inventory_hostname alone was not enough: two runs for
  # the SAME host share a controller file, and the later generation can
  # replace it before the earlier copy reads it.

- name: Create filtered AI-stack requirements (on the controller, #14272, #17242)
  ansible.builtin.shell:
    cmd: >-
      bash {{ code_source_dir | default(autobot.base_dir ~ '/code_source') }}/scripts/build-filtered-requirements.sh
      {{ code_source_dir | default(autobot.base_dir ~ '/code_source') }}/{{ ai_stack_requirements_rel }}
      {{ code_source_dir | default(autobot.base_dir ~ '/code_source') }}
      > /tmp/filtered-requirements-ai.{{ inventory_hostname }}.{{ _req_run_id }}.txt
  changed_when: false
  delegate_to: localhost
  become: false
  when: _ai_requirements_file.stat.exists
  tags: ['ai', 'deploy']

- name: Write filtered AI-stack requirements to the target (#17242)
  ansible.builtin.copy:
    src: "/tmp/filtered-requirements-ai.{{ inventory_hostname }}.{{ _req_run_id }}.txt"
    dest: "{{ ai_install_dir }}/filtered-requirements-ai.txt"
    owner: "{{ ai_user }}"
    mode: "0644"
  become: true
  when: _ai_requirements_file.stat.exists
  tags: ['ai', 'deploy']

- name: Install AI Python packages from requirements-ai.txt
  ansible.builtin.pip:
    requirements: "{{ ai_install_dir }}/filtered-requirements-ai.txt"
    virtualenv: "{{ ai_install_dir }}/venv"
    # #16641: see "Upgrade pip in venv" above.
    virtualenv_command: "python3.14 -m venv"
    state: present
    extra_args: "--timeout 300"
  become_user: "{{ ai_user }}"
  environment:
    PIP_DEFAULT_TIMEOUT: "300"
    HOME: "{{ ai_data_dir }}"
  timeout: 600  # Issue #2835: prevent indefinite hang on dependency resolution conflicts
  when: _ai_requirements_file.stat.exists

# #15684: this used to be a fallback `name:` list for when
# requirements-ai.txt was absent, restating the manifest's packages by hand
# (and drifting out of sync with it -- #15623 had to raise two of its floors
# by reading, because the union comparison that predated #15629 could not
# see they had fallen behind). That state was never reachable: "AI Stack |
# Deploy requirements-ai.txt before installing from it (#14809)" above is
# unconditional, so by the time `_ai_requirements_file` is checked the file
# always exists -- a host with none is not a state this role can actually
# reach, let alone one worth a second, hand-kept package list for. Removed
# rather than kept as a decision-with-a-reason (#15684's other option),
# because a branch nothing can ever take is not a source of truth to keep
# describing.

- name: Deploy AI stack environment file
  ansible.builtin.template:
    src: ai-stack.env.j2
    dest: "{{ ai_install_dir }}/.env"
    mode: "0600"
    owner: "{{ ai_user }}"
    group: "{{ ai_group }}"
  notify: restart ai-stack

- name: Deploy AI Stack application source files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ai_install_dir }}/{{ item | basename }}"
    owner: "{{ ai_user }}"
    group: "{{ ai_group }}"
    mode: "0644"
  loop:
    - "{{ playbook_dir }}/../../../autobot-infrastructure/shared/docker/ai-stack/ai_api_server.py"
    - "{{ playbook_dir }}/../../../autobot-infrastructure/shared/docker/ai-stack/ai_container_main.py"
  notify: restart ai-stack
  tags: ['ai', 'deploy']

- name: "AI Stack | Create src/ directory for backend module symlinks"
  ansible.builtin.file:
    path: "{{ ai_install_dir }}/src"
    state: directory
    mode: "0755"
    owner: "{{ ai_user }}"
    group: "{{ ai_group }}"
  tags: ['ai', 'deploy']

- name: Create src/ symlinks to backend modules (co-located deployment)
  ansible.builtin.file:
    # #15560/1 (same family as #13539/B4): was "{{ backend_install_dir }}/{{ item }}",
    # which renders absolute. A link whose target does not depend on where the
    # link itself lives cannot survive the tree moving -- it re-anchors to the
    # live root under any deploy-root relocation, which is exactly the property
    # #13539's release scheme depends on. The link lives at
    # `{{ ai_install_dir }}/src/`, and ai_install_dir and backend_install_dir are
    # always siblings under the same deploy root, so `../../<backend dir name>`
    # resolves identically today and stays correct under a relocation. The
    # basename is taken FROM backend_install_dir rather than spelled out, so an
    # install that renames the backend component directory still resolves.
    src: "../../{{ backend_install_dir | basename }}/{{ item }}"
    dest: "{{ ai_install_dir }}/src/{{ item }}"
    state: link
    owner: "{{ ai_user }}"
    group: "{{ ai_group }}"
    force: true
  loop:
    - agents
    - autobot_shared
  tags: ['ai', 'deploy']

# #12513: see roles/redis/tasks/code_only.yml — same read, same reason. (#13535
# moved that read out of roles/redis/tasks/chromadb.yml, which this used to
# name and which now carries no auth tasks at all.) Whichever
# of the two roles owns chroma on this topology must land the same credential the
# backend sends, so both defer to the SLM-generated value.
# #13460: these service files are defined once, in code_only.yml, so the
# builtin updater can deliver them without re-running provisioning. Copying
# them into the playbook instead is the inline-vs-role duplication that made
# this role undeliverable in the first place (#12959).
- name: "AI Stack | Deploy service files"
  ansible.builtin.include_tasks: code_only.yml
  tags: ['ai', 'deploy']

- name: Enable and start ChromaDB service
  ansible.builtin.systemd:
    name: autobot-chromadb
    state: started
    enabled: true
    daemon_reload: true

- name: Enable and start AI Stack API service
  ansible.builtin.systemd:
    name: autobot-ai-stack
    state: started
    enabled: true
    daemon_reload: true
