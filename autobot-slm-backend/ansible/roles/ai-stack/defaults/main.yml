---
# AI Stack configuration defaults  (#926 Phase 4: unified service account)
# All AutoBot services on a host use autobot:autobot regardless of role (#4091).
# This simplifies permissions and avoids ownership conflicts during co-location.
ai_service_account: autobot
ai_user: autobot
ai_group: autobot
ai_install_dir: /opt/autobot/autobot-ai-stack
ai_log_dir: /var/log/autobot
# Issue #3097: ai-stack and backend share /var/lib/autobot for data storage
ai_data_dir: /var/lib/autobot

# Co-located backend (used when ai-stack runs on the same host as autobot-backend)
backend_install_dir: /opt/autobot/autobot-backend

# Server settings
ai_host: "0.0.0.0"
ai_port: 8080

# ChromaDB
chromadb_persist_dir: /var/lib/autobot/chromadb
chromadb_host: "0.0.0.0"
chromadb_port: 8100

# Ollama (remote on backend node - resolved from inventory)
ollama_host: "{{ backend_host | default(ansible_host) }}"
ollama_port: 11434

# Agent LLM endpoints — injected into ai-stack.env; default to Ollama (#4661)
ai_chat_endpoint: "http://{{ ollama_host }}:{{ ollama_port }}"
ai_rag_endpoint: "http://{{ ollama_host }}:{{ ollama_port }}"
ai_classification_endpoint: "http://{{ ollama_host }}:{{ ollama_port }}"

# Redis connection (resolved from inventory)
ai_redis_host: "{{ redis_host | default(ansible_host) }}"
ai_redis_port: "{{ redis_port | default(6379) }}"
ai_redis_password: "{{ vault_redis_password | default('') }}"

# Agent LLM model names — required by get_agent_model_explicit() in ssot_config.py.
# Defaults mirror the constants in autobot-backend/autobot_shared/ssot_config.py.
# Override per-host in inventory when running non-default models.
ai_chat_model: "qwen3.5:9b"
ai_rag_model: "mistral:7b-instruct"
ai_classification_model: "gemma2:2b"
