---
# AI Stack configuration defaults  (#926 Phase 4: unified service account)
# All AutoBot services on a host use autobot:autobot regardless of role (#4091).
# This simplifies permissions and avoids ownership conflicts during co-location.
ai_service_account: autobot
ai_user: autobot
ai_group: autobot
ai_install_dir: /opt/autobot/autobot-ai-stack
ai_log_dir: /var/log/autobot
# Issue #3097: ai-stack and backend share /var/lib/autobot for data storage
ai_data_dir: /var/lib/autobot

# Co-located backend (used when ai-stack runs on the same host as autobot-backend)
backend_install_dir: /opt/autobot/autobot-backend

# Server settings
ai_host: "0.0.0.0"
ai_port: 8080

# ChromaDB
chromadb_persist_dir: /var/lib/autobot/chromadb
chromadb_host: "0.0.0.0"
chromadb_port: 8100
# CHROMA_SERVER_AUTHN_* token auth (#12513). Empty (default) = auth disabled,
# matching pre-#12513 behaviour. Override via group_vars/vault; must match
# the redis role's chromadb_auth_token / backend role's
# backend_chromadb_auth_token when chroma is co-located here instead of on
# the db-stack node (#4087 topology).
chromadb_auth_token: ""
# Same file, same contract as the redis role: it must equal the unit's
# EnvironmentFile= line, and it is written before the unit is deployed (#12513).
chromadb_authn_env_file: /etc/autobot/chromadb.env

# Ollama (remote on backend node - resolved from inventory)
ollama_host: "{{ backend_host | default(ansible_host) }}"
ollama_port: 11434

# Agent LLM endpoints — injected into ai-stack.env; default to Ollama (#4661)
ai_chat_endpoint: "http://{{ ollama_host }}:{{ ollama_port }}"
ai_rag_endpoint: "http://{{ ollama_host }}:{{ ollama_port }}"
ai_classification_endpoint: "http://{{ ollama_host }}:{{ ollama_port }}"

# Redis connection (resolved from inventory)
ai_redis_host: "{{ redis_host | default(ansible_host) }}"
ai_redis_port: "{{ redis_port | default(6379) }}"
ai_redis_password: "{{ vault_redis_password | default('') }}"

# Agent LLM model names — required by get_agent_model_explicit() in ssot_config.py.
# Defaults mirror the 6-tier constants in autobot-backend/autobot_shared/ssot_config.py.
# Override per-host in inventory when running non-default models.
# Quality tier (qwen3.5:9b)
ai_chat_model: "qwen3.5:9b"
ai_code_generation_model: "qwen3.5:9b"
ai_data_analysis_model: "qwen3.5:9b"
ai_image_analysis_model: "qwen3.5:9b"
# Instruction tier (mistral:7b-instruct)
ai_rag_model: "mistral:7b-instruct"
ai_audio_processing_model: "mistral:7b-instruct"
ai_kb_librarian_model: "mistral:7b-instruct"
ai_knowledge_extraction_model: "mistral:7b-instruct"
ai_knowledge_retrieval_model: "mistral:7b-instruct"
ai_summarization_model: "mistral:7b-instruct"
ai_translation_model: "mistral:7b-instruct"
# Classification tier (gemma2:2b)
ai_classification_model: "gemma2:2b"
ai_sentiment_analysis_model: "gemma2:2b"
# Light tier (phi3:mini)
ai_llm_failsafe_model: "phi3:mini"
# System tier (dolphin-llama3:8b)
ai_system_commands_model: "dolphin-llama3:8b"

# #13870: which role owns /etc/systemd/system/autobot-chromadb.service.
#
# BOTH roles legitimately install and run chromadb, for different topologies,
# and both used to write the SAME unit path from their own template. Whichever
# ran last won, so the deployed ExecStart, Description and restart policy all
# flipped with run order — observed live during the #4090 investigation.
#
# This default is the role's OWN name, deliberately: it is the last-resort
# floor, and it must fail SAFE. A shared default of one role's name meant every
# topology running the other role alone deployed no unit at all — five of six
# entry points, including the updater's — which is worse than the flip being
# fixed. The both-roles case is resolved one precedence level up, by
# `chromadb_service_owner` in group_vars/all.yml.
chromadb_service_owner: "ai-stack"

# #13870: cgroup memory accounting for chroma on the ai-stack topology.
#
# MemoryHigh, not MemoryMax, and that is the point. MemoryHigh is a THROTTLE:
# exceeding it drives reclaim and increments `memory.events high`, which is the
# counter #13765 built alerting on — it reached 21,052 on a host that systemd
# still reported as `active`. MemoryMax is a KILL: setting a hard cap on a
# service that has never had one OOM-kills it the moment it exceeds the number,
# so introducing one blind would trade an observability gap for an outage.
#
# Set chromadb_memory_max explicitly once a host's real ceiling is known.
chromadb_memory_high: "4G"
chromadb_memory_max: ""
