---
- name: restart redis for replication
  ansible.builtin.systemd:
    # #14516: a handler fires at play end, so a wrong unit name here fails
    # late and obscures which change triggered it.
    name: "{{ redis_service_name | default('redis-stack-server') }}"
    state: restarted
