---
# Redis Replication Configuration Defaults
# Issue #726 Phase 4: Redis replication orchestration

# Replication mode: 'replica' or 'primary'
redis_replication_mode: "primary"

# Master configuration (for replicas)
redis_master_host: ""
redis_master_port: 6379
redis_master_auth: ""
# #16626: ACL user the replica authenticates to the master as, with masterauth.
# Read from the controller env like the replication credential; "" keeps it unset.
redis_master_user: "{{ lookup('env', 'AUTOBOT_REDIS_USERNAME') }}"

# Replica configuration
redis_replica_read_only: true
redis_replica_priority: 100
redis_replica_serve_stale_data: true
redis_repl_diskless_sync: false
redis_repl_diskless_sync_delay: 5

# Replication monitoring
redis_repl_timeout: 60
redis_repl_ping_replica_period: 10
redis_min_replicas_to_write: 0
redis_min_replicas_max_lag: 10

# Connection settings
redis_port: 6379
redis_password: ""
# #16626: ACL username for this role's redis-cli calls; "" keeps password-only AUTH
redis_username: "{{ lookup('env', 'AUTOBOT_REDIS_USERNAME') }}"
# #17434: follows roles/redis. Nine tasks in this role consume it; while the
# role is unwired (#17176) the old plain-redis value was latent, and wiring it
# would have made every replication edit a silent no-op against a file that
# does not exist on a provisioned node.
redis_config_file: "/etc/redis-stack.conf"
