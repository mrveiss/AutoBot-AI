# Shared dependency role: install a deadsnakes Python interpreter.
# Version is parameterized via python_interpreter_version (#13842: derived
# from .python-version by default, see defaults/main.yml). #13843 renamed
# this role from `python314` -- the `python314` tag below is kept as a
# permanent compatibility alias, not a transitional one: it is baked into an
# already-deployed sudoers NOPASSWD grant (configure-python-provision-
# permissions.yml) that this change cannot regenerate on live hosts, and
# `code_sync.py` invokes that exact tag for the same reason. Both tags select
# every task in this role.
# Venv creation and pip installs stay in service roles.
---

# #13842: derive from .python-version (the SSOT) unless a caller passed an
# explicit override. `role_path` is only valid inside this role's own task
# context, which is why this is a `set_fact` here rather than a `defaults:`
# entry -- see defaults/main.yml for why that shape broke.
- name: "python_interpreter | Derive interpreter version from .python-version unless overridden"
  ansible.builtin.set_fact:
    python_interpreter_version: "{{ lookup('file', role_path + '/../../../../.python-version') | trim }}"
  when: python_interpreter_version | default('') | length == 0
  tags: ['deps', 'python_interpreter', 'python314']

- name: "python_interpreter | Check if Python {{ python_interpreter_version }} is available"
  ansible.builtin.command:
    cmd: "{{ python_interpreter_binary }} --version"
  register: _py_check
  changed_when: false
  # (#2872) Intentional: the interpreter may not be installed yet;
  # rc != 0 triggers the deadsnakes PPA installation below.
  failed_when: false
  tags: ['deps', 'python_interpreter', 'python314']

- name: "python_interpreter | Install software-properties-common"
  ansible.builtin.apt:
    name: software-properties-common
    state: present
  become: true
  when: _py_check.rc != 0
  tags: ['deps', 'python_interpreter', 'python314']

# #7218: idempotent repo-add — preserve device-shipped PPA if present
- name: "python_interpreter | Add deadsnakes PPA (idempotent, #7218)"
  ansible.builtin.include_tasks: ../../_shared/tasks/add_apt_repository_idempotent.yml
  vars:
    apt_repo_match: "deadsnakes/ppa"
    apt_repo_spec: "ppa:deadsnakes/ppa"
    apt_repo_filename: "deadsnakes"
    apt_repo_label: "deadsnakes (Python {{ python_interpreter_version }})"
  when: _py_check.rc != 0
  tags: ['deps', 'python_interpreter', 'python314']

# #6719: bounded shell apt-get update — see roles/nginx/tasks/main.yml.
# Only fires when the interpreter is missing, but when it does it must tolerate
# flaky PPAs (the deadsnakes PPA was just added; if it's unreachable, the
# next deploy retry will still need to install the interpreter).
- name: "python_interpreter | Refresh apt cache (best-effort, bounded; #6719)"
  ansible.builtin.command:
    cmd: >-
      timeout 60 apt-get update -qq
      -o Acquire::Retries=0
      -o Acquire::http::Timeout=10
  become: true
  changed_when: false
  failed_when: false
  when: _py_check.rc != 0
  tags: ['deps', 'python_interpreter', 'python314']

- name: "python_interpreter | Install Python {{ python_interpreter_version }}"
  ansible.builtin.apt:
    name: "{{ python_interpreter_packages }}"
    state: present
  become: true
  when: _py_check.rc != 0
  tags: ['deps', 'python_interpreter', 'python314']

# Fail-loud: a broken PPA must fail the deploy here, not silently leave the
# wrong interpreter for the venv step to trip over. No failed_when: false.
- name: "python_interpreter | Verify Python {{ python_interpreter_version }} is available"
  ansible.builtin.command:
    cmd: "{{ python_interpreter_binary }} --version"
  changed_when: false
  tags: ['deps', 'python_interpreter', 'python314']
