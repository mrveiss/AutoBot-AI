---
# Render the SLM nginx site config from the ONE template (#15610).
#
# The site config names the path nginx serves the SLM bundle from. #15610
# moved that path from `dist/` — a directory renamed on every publish, which
# is why the served path briefly did not exist — to `current`, a symlink
# flipped by a single rename(2). A served-path change is only real on a host
# whose config has been re-rendered, so every play that publishes the frontend
# has to be able to re-render it.
#
# `playbooks/update-all-nodes.yml` PLAY 1 is the self-update path: it deploys
# the SLM backend by unarchive and never runs this role, so before #15610 it
# published a new bundle and left nginx pointing wherever the last full
# provision had aimed it. It now includes this file with
# `include_role: tasks_from: nginx_site.yml` — the same seam #14624 used to
# stop the systemd unit going stale for exactly the same reason. A copied
# template task in the playbook would be the second copy that drifts.
#
# Callers: tasks/main.yml (the role's own run) and
# playbooks/update-all-nodes.yml. `playbooks/provision-fleet-roles.yml`
# re-renders the same template directly for the co-located case (#3012).
#
# #16979: the render alone is not enough. Both self-update playbooks
# (`playbooks/update-all-nodes.yml`, `playbooks/update-node.yml`) include
# ONLY this file via `tasks_from: nginx_site.yml` -- so the steps that make
# the rendered file live (detect a non-symlink sites-enabled entry, replace
# it, verify the link) must live here too, not in tasks/main.yml, or a host
# whose sites-enabled/{{ slm_nginx_config }} is a stale regular file never
# gets repaired by anything short of a full re-provision. Observed on the
# live install: sites-available kept advancing on every self-update while
# sites-enabled stayed frozen on a build from over two months earlier.

- name: "SLM | Detect co-located mode before rendering the site config (#3013)"
  ansible.builtin.include_tasks: colocated_frontend_detect.yml
  tags: ['slm', 'frontend', 'nginx']

- name: "SLM | Deploy nginx configuration"
  ansible.builtin.template:
    src: autobot-slm.conf.j2
    dest: /etc/nginx/sites-available/{{ slm_nginx_config }}
    mode: "0644"
    backup: true
  become: true
  notify:
    - test nginx config
    - reload nginx
  tags: ['slm', 'nginx']

- name: "SLM | Stat sites-enabled file to detect non-symlink (#1122, #16979)"
  ansible.builtin.stat:
    path: /etc/nginx/sites-enabled/{{ slm_nginx_config }}
  register: _slm_nginx_sites_enabled_stat
  become: true
  tags: ['slm', 'nginx']

# nginx loads every file it finds under sites-enabled/, so a backup left in
# that directory would itself be served as a second site (#16979 AC2). Move
# it beside the sites-available/ backups `template: backup: true` above
# already writes, named from the stale file's own mtime -- no dependency on
# fact-gathering (both self-update plays run with gather_facts: false and do
# not always gather ansible_facts['date_time'] before this file runs; #11480
# hit the same class of failure for a different template). Idempotent: once
# this has run, sites-enabled/{{ slm_nginx_config }} is a symlink, so a
# second pass finds `islnk` true and skips straight to the enable step below.
- name: "SLM | Back up non-symlink sites-enabled file before replacing it (#1122, #16979)"
  ansible.builtin.command:
    cmd: >-
      mv /etc/nginx/sites-enabled/{{ slm_nginx_config }}
      /etc/nginx/sites-available/{{ slm_nginx_config }}.enabled-backup.{{
      _slm_nginx_sites_enabled_stat.stat.mtime | int }}
  become: true
  when:
    - _slm_nginx_sites_enabled_stat.stat.exists
    # order-independent (#16979 review): each `when:` item must stand on its
    # own -- `default(false)` rather than relying on the list's short-circuit
    # order to keep an undefined `islnk` from ever being evaluated.
    - not (_slm_nginx_sites_enabled_stat.stat.islnk | default(false))
  changed_when: true
  tags: ['slm', 'nginx']

- name: "SLM | Enable nginx site (symlink to sites-available) (#16979)"
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ slm_nginx_config }}
    dest: /etc/nginx/sites-enabled/{{ slm_nginx_config }}
    state: link
  become: true
  notify:
    - test nginx config
    - reload nginx
  tags: ['slm', 'nginx']

- name: "SLM | Stat sites-enabled after linking (#16979)"
  ansible.builtin.stat:
    path: /etc/nginx/sites-enabled/{{ slm_nginx_config }}
  register: _slm_nginx_sites_enabled_check
  become: true
  tags: ['slm', 'nginx']

# AC3 (#16979): fail loudly rather than let nginx quietly serve the wrong
# file. `lnk_source` is os.path.realpath() of the symlink (see
# ansible.builtin.stat), so this also catches a link that exists but points
# somewhere unexpected, not only a missing/non-symlink entry.
- name: "SLM | Assert sites-enabled resolves to the rendered site (#16979)"
  ansible.builtin.assert:
    that:
      - _slm_nginx_sites_enabled_check.stat.exists
      - _slm_nginx_sites_enabled_check.stat.islnk
      - _slm_nginx_sites_enabled_check.stat.lnk_source == '/etc/nginx/sites-available/' ~ slm_nginx_config
    fail_msg: >-
      /etc/nginx/sites-enabled/{{ slm_nginx_config }} is not a symlink resolving to
      /etc/nginx/sites-available/{{ slm_nginx_config }} -- nginx is not serving the
      rendered SLM site config (#16979).
    success_msg: "sites-enabled/{{ slm_nginx_config }} resolves to the rendered site config."
  tags: ['slm', 'nginx']
