# #14758 back-fill of the envelope root key into an EXISTING SLM secrets file.
# A fresh install gets the key from the slm-secrets.env template; every host
# provisioned before #14758 already has the file, so the template is skipped
# and only this back-fill can add the key.
#
# #19051: it lives in its own file so update-all-nodes.yml Play 1 -- the builtin
# updater, which deploys by unarchive and never runs this role -- includes the
# SAME tasks. While the back-fill sat only in main.yml, a host kept current by
# the updater alone never received a key: the backend rendered
# `AUTOBOT_SECRETS_ROOT_KEY=` and every System vault call returned 503.
#
# NEVER generate over an existing key. The root key derives every vault KEK, so
# a new one makes every already-encrypted secret undecryptable. An existing key
# can live in three places, and the first non-empty one is written as-is:
#   1. the SLM secrets file itself -> nothing to do;
#   2. an operator-supplied `autobot_secrets_root_key` (inventory / vault);
#   3. the backend env on this host (a key placed there by hand).
# Only when all three are empty is a key generated. If 2 and 3 are both set and
# differ, which one encrypted the existing data is unknowable here, so fail.
- name: "SLM | Stat the secrets file for the root-key back-fill (#19051)"
  ansible.builtin.stat:
    path: "{{ slm_credentials_dir }}/{{ slm_credentials_file }}"
  register: _slm_root_key_file
  become: true
  tags: ['slm', 'secrets']

# #19051 F2/F3: tolerate `export KEY=` lines, and run in check mode too so the
# `rc` the next tasks read is always defined. A quoted empty value (`KEY=""`)
# is no key: one character past the optional quote must be neither quote nor
# space, so the back-fill replaces it rather than the backend reading `""`.
- name: "SLM | Check if AUTOBOT_SECRETS_ROOT_KEY present in secrets file (#14758)"
  ansible.builtin.shell:
    cmd: >-
      grep -Eq "^[[:space:]]*(export[[:space:]]+)?AUTOBOT_SECRETS_ROOT_KEY=[\"']?[^\"'[:space:]]"
      {{ slm_credentials_dir }}/{{ slm_credentials_file }}
  register: _slm_root_key_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: _slm_root_key_file.stat.exists
  become: true
  no_log: true
  tags: ['slm', 'secrets']

- name: "SLM | Read an existing root key from the backend env on this host (#19051)"
  ansible.builtin.shell:
    cmd: >-
      grep -oP '^\s*(export\s+)?AUTOBOT_SECRETS_ROOT_KEY=\K.+'
      {{ slm_backend_env_file }} 2>/dev/null || true
  register: _backend_env_root_key
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - _slm_root_key_file.stat.exists
    - _slm_root_key_check.rc != 0
  become: true
  no_log: true
  tags: ['slm', 'secrets']

# The comparison sees both keys, so it runs under no_log and yields only a flag;
# the failure below carries no key and keeps its message readable.
- name: "SLM | Compare the operator and backend-env root keys (#19051)"
  ansible.builtin.set_fact:
    _root_keys_conflict: >-
      {{ (_root_key_operator | length > 0)
         and (_root_key_backend_env | length > 0)
         and (_root_key_operator != _root_key_backend_env) }}
  vars:
    _root_key_operator: "{{ autobot_secrets_root_key | default('') | trim }}"
    _root_key_backend_env: "{{ _backend_env_root_key.stdout | default('') | trim | regex_replace('^[\"\\x27]|[\"\\x27]$', '') }}"
  when:
    - _slm_root_key_file.stat.exists
    - _slm_root_key_check.rc != 0
  no_log: true
  tags: ['slm', 'secrets']

- name: "SLM | Refuse two different existing root keys (#19051)"
  ansible.builtin.fail:
    msg: >-
      autobot_secrets_root_key (inventory/vault) and the backend env on this host
      hold DIFFERENT root keys, and the SLM secrets file has none. Either may have
      encrypted existing vault data; set one value in both places, then re-run.
  when: _root_keys_conflict | default(false) | bool
  tags: ['slm', 'secrets']

- name: "SLM | Add AUTOBOT_SECRETS_ROOT_KEY to existing secrets file (#14758)"
  ansible.builtin.lineinfile:
    path: "{{ slm_credentials_dir }}/{{ slm_credentials_file }}"
    regexp: '^\s*(export\s+)?AUTOBOT_SECRETS_ROOT_KEY='
    # #16405: a generated key is 32 random bytes from openssl rand, never 32
    # characters from a password lookup. `or` short-circuits, so an existing key
    # means the generator is never called (#19051 F1).
    line: "AUTOBOT_SECRETS_ROOT_KEY={{ _root_key_seed }}"
    create: false
  vars:
    _root_key_seed: >-
      {{ (autobot_secrets_root_key | default('') | trim)
         or (_backend_env_root_key.stdout | default('') | trim | regex_replace('^["\x27]|["\x27]$', ''))
         or (lookup('pipe', 'openssl rand -base64 32') | replace('+', '-') | replace('/', '_')) }}
  when:
    - _slm_root_key_file.stat.exists
    - _slm_root_key_check.rc != 0
  become: true
  no_log: true
  tags: ['slm', 'secrets']
