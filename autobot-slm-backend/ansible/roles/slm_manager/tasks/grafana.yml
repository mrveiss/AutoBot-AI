# Grafana Configuration Tasks for SLM Manager Role
# Issue #853: Configure Grafana for embedded dashboards
---

# ==========================================================
# Install Grafana (only when grafana_install is true)
# ==========================================================
- name: "Grafana | Add Grafana GPG key"
  ansible.builtin.apt_key:
    url: https://apt.grafana.com/gpg.key
    state: present
  when: grafana_install | bool
  tags: ['grafana', 'packages']

# #7218: idempotent repo-add — preserve device-shipped Grafana repo if present.
# Refresh handled by the bounded-shell task below (#6719).
- name: "Grafana | Add Grafana APT repository (idempotent, #7218)"
  ansible.builtin.include_tasks: ../../_shared/tasks/add_apt_repository_idempotent.yml
  vars:
    apt_repo_match: "apt.grafana.com"
    apt_repo_spec: "deb https://apt.grafana.com stable main"
    apt_repo_filename: "grafana"
    apt_repo_label: "Grafana"
  when: grafana_install | bool
  tags: ['grafana', 'packages']

# #6719: bounded shell apt-get update — see roles/nginx/tasks/main.yml.
- name: "Grafana | Refresh apt cache after PPA add (best-effort; #6719)"
  ansible.builtin.command:
    cmd: >-
      timeout 60 apt-get update -qq
      -o Acquire::Retries=0
      -o Acquire::http::Timeout=10
  become: true
  changed_when: false
  failed_when: false
  when: grafana_install | bool
  tags: ['grafana', 'packages']

- name: "Grafana | Install Grafana"
  ansible.builtin.apt:
    name: grafana
    state: "{{ 'latest' if grafana_version == 'latest' else 'present' }}"
  when: grafana_install | bool
  tags: ['grafana', 'packages']

# ==========================================================
# Configure Grafana for subpath serving (only when grafana_configure is true)
# ==========================================================
- name: "Grafana | Configure serve_from_sub_path"
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?serve_from_sub_path\s*='
    line: 'serve_from_sub_path = true'
    insertafter: '^\[server\]'
    state: present
  when: grafana_configure | bool
  notify: restart grafana
  tags: ['grafana', 'config']

- name: "Grafana | Enable anonymous authentication"
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?enabled\s*=\s*(false|true)'
    line: 'enabled = true'
    insertafter: '^\[auth.anonymous\]'
    state: present
  when: grafana_configure | bool
  notify: restart grafana
  tags: ['grafana', 'config']

- name: "Grafana | Set anonymous org role"
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?org_role\s*='
    line: 'org_role = Viewer'
    insertafter: '^\[auth.anonymous\]'
    state: present
  when: grafana_configure | bool
  notify: restart grafana
  tags: ['grafana', 'config']

- name: "Grafana | Allow iframe embedding"
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?allow_embedding\s*='
    line: 'allow_embedding = true'
    insertafter: '^\[security\]'
    state: present
  when: grafana_configure | bool
  notify: restart grafana
  tags: ['grafana', 'config']

- name: "Grafana | Set cookie_samesite for embedding"
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?cookie_samesite\s*='
    line: 'cookie_samesite = none'
    insertafter: '^\[security\]'
    state: present
  when: grafana_configure | bool
  notify: restart grafana
  tags: ['grafana', 'config']

# ==========================================================
# Deploy dashboard files (can deploy to local or external Grafana)
# ==========================================================
- name: "Grafana | Create dashboard directory"
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: root
    group: grafana
    mode: "0755"
  when: grafana_deploy_dashboards | bool
  tags: ['grafana', 'dashboards']

- name: "Grafana | Deploy AutoBot dashboards"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../autobot-infrastructure/shared/config/grafana/dashboards/"
    dest: /var/lib/grafana/dashboards/
    owner: root
    group: grafana
    mode: "0640"
  when: grafana_deploy_dashboards | bool
  notify: restart grafana
  tags: ['grafana', 'dashboards']

- name: "Grafana | Configure dashboard provisioning"
  ansible.builtin.copy:
    dest: /etc/grafana/provisioning/dashboards/default.yml
    content: |
      apiVersion: 1
      providers:
        - name: 'AutoBot'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          allowUiUpdates: false
          options:
            path: /var/lib/grafana/dashboards
    owner: root
    group: grafana
    mode: "0640"
  when: grafana_deploy_dashboards | bool
  notify: restart grafana
  tags: ['grafana', 'dashboards']

# ==========================================================
# Start Grafana service (only when grafana_install is true)
# ==========================================================
- name: "Grafana | Enable and start Grafana"
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started
  when: grafana_install | bool
  tags: ['grafana', 'service']

- name: "Grafana | Wait for Grafana to be healthy (retry-based)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/health"
    method: GET
    status_code: 200
  when: grafana_install | bool
  register: _grafana_health
  retries: 60
  delay: 5
  until: _grafana_health is succeeded
  tags: ['grafana', 'service']
