# SLM Manager Role - Default Variables
---

# ==========================================================
# Basic Configuration
# ==========================================================
slm_user: autobot
slm_group: autobot
slm_base_dir: /opt/autobot
slm_backend_dir: "{{ slm_base_dir }}/autobot-slm-backend"
slm_frontend_dir: "{{ slm_base_dir }}/autobot-slm-frontend"
slm_shared_dir: "{{ slm_base_dir }}/autobot_shared"
slm_log_dir: "{{ slm_base_dir }}/logs"
slm_certs_dir: /etc/autobot/certs
slm_credentials_dir: /etc/autobot
slm_credentials_file: slm-secrets.env

# ==========================================================
# Service Configuration
# ==========================================================
slm_backend_service: autobot-slm-backend
slm_backend_host: 127.0.0.1
slm_backend_port: 8000

# ==========================================================
# TLS Configuration
# ==========================================================
slm_tls_cert: "{{ slm_certs_dir }}/server-cert.pem"
slm_tls_key: "{{ slm_certs_dir }}/server-key.pem"
slm_tls_days: 365
slm_tls_subject: "/C=US/ST=State/L=City/O=AutoBot/CN={{ ansible_host }}"

# ==========================================================
# Nginx Configuration
# ==========================================================
slm_nginx_config: autobot-slm

# ==========================================================
# Co-located User Frontend (#2829)
# When SLM and user frontend share the same host, the SLM
# nginx config serves the user frontend at / and SLM at /slm/.
# Set to true + provide paths when deploying single-host.
#
# In co-located mode the SLM nginx proxies directly to uvicorn
# (HTTP on port 8001) instead of through the backend nginx
# (HTTPS on port 8443), eliminating the double-proxy overhead.
# The backend role skips its standalone nginx vhost when this
# flag is true.
# ==========================================================
slm_colocated_frontend: false
frontend_dist_dir: "{{ slm_base_dir }}/autobot-frontend/dist"
frontend_backend_host: 127.0.0.1
frontend_backend_port: 8001
frontend_backend_protocol: http

# ==========================================================
# Frontend Build
# ==========================================================
slm_frontend_build: true

# ==========================================================
# Security Secrets (empty = auto-generate on first run)
# ==========================================================
slm_secret_key: ""
slm_encryption_key: ""
slm_admin_password: ""
# Service token for autobot-backend → SLM WebSocket auth (#7689)
slm_auth_token: ""

# ==========================================================
# Main Backend Proxy (#1791)
# ==========================================================
# Internal API key shared between SLM and main backend.
# REQUIRED for personality and voice proxies — set via Ansible Vault or inventory.
# Injected into nginx proxy headers AND into backend/SLM process environments.
autobot_internal_api_key: ""

# Host and port for the user-facing AutoBot backend (HTTPS).
# Defaults to the inventory-derived backend host so no IP is hardcoded here.
autobot_backend_host: "{{ infrastructure.hosts.backend if infrastructure is defined else '127.0.0.1' }}"
autobot_backend_port: 8443

# noVNC proxy port (used by /tools/novnc/ location)
novnc_port: 6080

# ==========================================================
# Grafana Configuration
# Issue #853: Support both local and external Grafana
# ==========================================================

# Grafana deployment mode:
#   - "local": Install and configure Grafana on this server (default)
#   - "external": Use external Grafana instance (no local installation)
grafana_mode: local

# Grafana host configuration
# For local mode: uses localhost
# For external mode: IP or hostname of external Grafana server
grafana_host: "{{ '127.0.0.1' if grafana_mode == 'local' else grafana_external_host }}"
grafana_external_host: ""  # Set this when using grafana_mode: external

# Grafana port (default: 3000)
grafana_port: 3000

# Install Grafana when in local mode
grafana_install: "{{ grafana_mode == 'local' }}"

# Configure local Grafana when in local mode
grafana_configure: "{{ grafana_mode == 'local' }}"

# Deploy dashboards (both local and external modes)
grafana_deploy_dashboards: true

# Grafana version (only used when grafana_install is true)
grafana_version: latest

# Prometheus URL for Grafana data source
# When Grafana is external, this must be accessible from the external host
prometheus_host: 127.0.0.1
prometheus_port: 9090
prometheus_url: "http://{{ prometheus_host }}:{{ prometheus_port }}"

# CORS configuration for external Grafana
# Enable CORS headers when Grafana is on a different host
grafana_enable_cors: "{{ grafana_mode == 'external' }}"
grafana_cors_origin: "https://{{ ansible_host }}"

# Health checks (retry-based polling instead of fixed timeout)
slm_backend_health_check_retries: 60   # Max attempts (60 × 5s = 300s)
slm_backend_health_check_delay: 5      # Seconds between retries
grafana_health_check_retries: 60       # Max attempts (60 × 5s = 300s)
grafana_health_check_delay: 5          # Seconds between retries
