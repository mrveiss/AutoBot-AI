---
# Install autobot_shared for the SLM agent (#18611, #18606). The single implementation
# behind enroll-slm-agent.yml and deploy-slm-agent.yml, included before the slm_agent role.
# Reads autobot.base_dir (inventory group_vars/all.yml) and optional code_source_dir,
# slm_agent_user, slm_agent_group (default autobot).
#
# Source tree: an explicit code_source_dir, else the tree the playbook itself runs from
# (playbook_dir is <tree>/autobot-slm-backend/ansible/playbooks, so three dirnames up is
# <tree>). The SLM backend passes no code_source_dir (services/deployment.py
# _enrollment_var_args) and runs from settings.ansible_dir, so the playbook's own tree is
# the one that is certainly present; it need not be under autobot.base_dir/code_source.
# Both callers are playbooks that import this file statically, so there is no role_path:
# playbook_dir is the only handle. #20509: the derivation is therefore PROVEN, not trusted --
# the first task below fails unless the derived tree is the one this playbook sits in, so a playbook
# moved to another depth stops here instead of shipping some neighbouring tree's autobot_shared.
# The proof is by content, not by the checkout's name: the derived tree (shared_parent, the tree
# the archive is about to be built from) must hold this very file at its repository-relative path
# (autobot-slm-backend/ansible/roles/_shared/tasks/), so shared_parent is the repository this
# playbook sits in, whatever that checkout is called. It does not prove autobot_shared/ is there
# (the next two tasks check that) nor that the file is byte-identical to the running one.
# It runs only on the derived path: an explicit code_source_dir is the caller's choice and needs no
# repository layout beyond autobot_shared/ itself, which the next two tasks check.
#
# The real agent imports autobot_shared (health_collector -> redis_client); the
# unit's PYTHONPATH includes {{ slm_agent_dir | dirname }} (= autobot.base_dir).
# Not the autobot_shared role: its sync notifies the backend/celery restart
# handlers, which a fresh enrollee lacks, so the run would exit non-zero. And no
# synchronize here: it escalates only with passwordless sudo, which the
# password-auth enrollment does not have until its sudoers task has run.
# The excludes mirror the autobot_shared role's rsync list (a test pins parity).
- name: Ship autobot_shared as one filtered archive
  vars:
    shared_parent: "{{ code_source_dir | default(playbook_dir | dirname | dirname | dirname, true) }}"
    shared_excludes:
      - __pycache__
      - "*.pyc"
      - "*.egg-info"
      - .git
      - .env
      - "*.env"
      - ".env.*"
      - .envrc
  block:
    - name: Find this task file under the derived source tree (#20509)
      ansible.builtin.stat:
        path: "{{ shared_parent }}/autobot-slm-backend/ansible/roles/_shared/tasks/install_agent_autobot_shared.yml"
      register: shared_anchor
      delegate_to: localhost
      run_once: true
      become: false
      when: (code_source_dir | default('', true)) == ''

    - name: Fail when the derived source tree is not the tree this playbook sits in (#20509)
      ansible.builtin.assert:
        that: shared_anchor.stat.exists
        fail_msg: >-
          {{ shared_parent }} (derived from {{ playbook_dir }}) is not the repository this playbook
          belongs to: it holds no autobot-slm-backend/ansible/roles/_shared/tasks/install_agent_autobot_shared.yml,
          so the playbook moved to another depth. Fix the derivation, or set code_source_dir.
      when: (code_source_dir | default('', true)) == ''
      run_once: true

    - name: Check autobot_shared exists in the source tree on the controller
      ansible.builtin.stat:
        path: "{{ shared_parent }}/autobot_shared/__init__.py"
      register: shared_src
      delegate_to: localhost
      run_once: true
      become: false

    - name: Fail clearly when the autobot_shared source tree is missing
      ansible.builtin.assert:
        that: shared_src.stat.exists
        fail_msg: >-
          autobot_shared not found at {{ shared_parent }}/autobot_shared on the controller.
          Set code_source_dir to a checkout that contains autobot_shared/.
      run_once: true

    - name: Create a unique controller temp file for the archive
      ansible.builtin.tempfile:
        state: file
        prefix: autobot_shared-
        suffix: .tar.gz
      register: shared_tar
      delegate_to: localhost
      run_once: true
      become: false

    - name: Build the filtered autobot_shared archive on the controller
      ansible.builtin.command:
        argv: >-
          {{ ['tar', '-czf', shared_tar.path]
             + (shared_excludes | map('regex_replace', '^', '--exclude=') | list)
             + ['--mode=u=rwX,g=rX,o=rX', '--owner=0', '--group=0', '--numeric-owner',
                '-C', shared_parent, 'autobot_shared'] }}
      changed_when: true
      delegate_to: localhost
      run_once: true
      become: false

    - name: Ensure the autobot_shared directory exists
      ansible.builtin.file:
        path: "{{ autobot.base_dir }}/autobot_shared"
        state: directory
        owner: "{{ slm_agent_user | default('autobot') }}"
        group: "{{ slm_agent_group | default('autobot') }}"
        mode: 'u=rwX,g=rX,o=rX'

    - name: Install autobot_shared for the agent (no backend/celery handlers)
      ansible.builtin.unarchive:
        src: "{{ shared_tar.path }}"
        dest: "{{ autobot.base_dir }}/autobot_shared"
        remote_src: false
        owner: "{{ slm_agent_user | default('autobot') }}"
        group: "{{ slm_agent_group | default('autobot') }}"
        extra_opts:
          - --strip-components=1

    # #20942: the floor python_floor.py reads, from the same tree as the archive above.
    - name: Stage .python-version for the agent's Python floor (#20942)
      ansible.builtin.copy:
        src: "{{ shared_parent }}/.python-version"
        dest: "{{ autobot.base_dir }}/.python-version"
        owner: "{{ slm_agent_user | default('autobot') }}"
        group: "{{ slm_agent_group | default('autobot') }}"
        mode: "0644"
  always:
    - name: Remove the controller temp archive
      ansible.builtin.file:
        path: "{{ shared_tar.path }}"
        state: absent
      when: shared_tar.path is defined
      delegate_to: localhost
      run_once: true
      become: false
