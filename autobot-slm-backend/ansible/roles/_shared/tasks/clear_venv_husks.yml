---
# Clear this tool's own dist-info husks from a venv, before pip meets them (#17339).
#
# #17332 stopped the provenance marker CREATING husks and repaired the existing
# ones -- but only on the path that runs `api/venv_reconcile.py`, which is the
# builtin updater's. A host reached only by ansible provisioning never executes
# that code, so its husks survive and every pip step that must upgrade a husked
# package aborts with `uninstall-no-record-file`. pip stops at the FIRST one, so
# a host with several needs several failed runs to discover them all.
#
# The classification is not re-expressed here. `is_provenance_husk` admits only
# a directory that describes no installed distribution (no METADATA, no RECORD),
# carries this tool's marker, and contains nothing else -- and that rule decides
# a deletion, which is the one place a second implementation is least
# acceptable. So this stages the module and calls it, rather than writing a
# `find -name '*.dist-info'` shell step that would fork the rule.
#
# Run with the TARGET VENV'S OWN interpreter, deliberately. A husk is a
# dist-info directory, not a broken interpreter or a broken stdlib, so the venv
# that is broken can repair itself. That matters for `autobot-slm-backend/venv`:
# it runs the builtin updater, which is the only other path to this repair, so
# a husk there can block its own fix. The module imports stdlib only -- the one
# `autobot_shared` import it had is lazy since #17339 for exactly this reason.
#
# Caller contract: set `husk_venv_dir` to the venv to repair. Include this
# BEFORE the role's pip steps; after them the failure has already happened.
#
# THREE roles include this, not two. `api/code_sync._COMPONENT_PIP_PATHS` names
# `autobot-backend` and `autobot-slm-backend`, but `_WORKER_COMPONENT_PIP` makes
# `autobot-ai-stack` marker-capable too, because it is not in
# `EXPLICIT_LIST_COMPONENTS`. The first draft of this task hand-wrote the set as
# those two and missed ai-stack. The set is therefore no longer maintained here:
# `test_the_role_map_covers_every_marker_capable_component` derives it from
# those constants, so a fourth marker-capable component reddens that test rather
# than going quietly unrepaired. Do not re-state the list in this comment.

# #20509: the repo root is the role's own tree (`role_path`, fixed depth) or an explicit
# `repo_source_root` from a caller that is a playbook play and so has no role_path
# (update-all-nodes.yml passes its code_source). Never the playbook's folder; neither
# anchor present is a loud failure here, not a silent read of some other tree.
- name: "Venv husks | Resolve the repo root without playbook_dir (#20509)"
  ansible.builtin.set_fact:
    husk_repo_root: "{{ repo_source_root | default(role_path ~ '/../../../..' if role_path is defined else '', true) }}"

- name: "Venv husks | Fail when no repo root anchor exists (#20509)"
  ansible.builtin.assert:
    that: husk_repo_root | length > 0
    fail_msg: >-
      clear_venv_husks.yml has no repo root: it was included outside a role without
      repo_source_root. Pass repo_source_root (the checkout the update deploys from).

- name: "Venv husks | Stage the provenance module onto the node (#17339)"
  ansible.builtin.copy:
    src: "{{ husk_repo_root }}/autobot-slm-backend/venv_provenance.py"
    dest: "{{ autobot.base_dir }}/venv_provenance.py"
    owner: "{{ autobot.user }}"
    mode: "0644"
  become: true
  # `copy:` reads `src` on the CONTROLLER, which is where `code_source` lives,
  # and writes it to the node -- the #17242/#17331 invariant, that nothing
  # syncs the checkout to a fleet node, is why this is a copy and not a path.

- name: "Venv husks | Does {{ husk_venv_dir }} exist yet? (#17339)"
  ansible.builtin.stat:
    path: "{{ husk_venv_dir }}"
  register: _husk_venv_stat

- name: "Venv husks | Clear husks with the venv's own interpreter (#17339)"
  ansible.builtin.command:
    cmd: "{{ husk_venv_dir }}/bin/python {{ autobot.base_dir }}/venv_provenance.py {{ husk_venv_dir }}"
  register: _husk_clear
  # A venv with nothing to clear is success, not a no-op to hide: the output
  # says which of the two it was, and `changed_when` keeps a clean host quiet
  # without making a repaired one silent.
  changed_when: "'cleared' in _husk_clear.stdout"
  failed_when: _husk_clear.rc != 0
  when: _husk_venv_stat.stat.exists
  become: true

- name: "Venv husks | Report what was cleared (#17339)"
  ansible.builtin.debug:
    msg: "{{ _husk_clear.stdout }}"
  when: _husk_venv_stat.stat.exists and _husk_clear.stdout is defined
