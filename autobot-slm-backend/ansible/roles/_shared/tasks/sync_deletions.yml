---
# Delete files removed from source, right after the role's own synchronize
# task succeeds (#16310 owner decision). One mechanism for co-located and
# remote targets: the plan is always computed on the CONTROLLER (delegate_to
# localhost), which holds the git checkout, and the deletions/marker write
# always apply to whichever host THIS play is currently targeting --
# co-located (the SLM itself) or a remote fleet node, no second code path.
#
# Included immediately after a role's synchronize task, never before it and
# never on its own: if that task failed, the play already aborted and none
# of this runs, so a failed sync leaves both the target tree and this
# module's marker untouched (#16310 review, BLOCKING 1's ordering rule).
#
# #16310 review, BLOCKING 2: everything from the plan onward is wrapped in
# block/rescue -- mirroring "[PLAY 1] SLM Agent | Redeploy agent" in
# update-all-nodes.yml -- so one node's planning failure warns and moves on
# rather than aborting the whole fleet under `any_errors_fatal: true`
# (PLAY 2). The rescue never writes the marker, so the next run retries from
# the same baseline; nothing is recorded as done.
#
# Never reads or writes .deployed_commit — that stays
# _get_slm_deployed_commit()'s C4 self-update skip-gate (#12202). This
# module's own marker is a different file, DELETION_MARKER
# (services/deploy_artifacts.py's SYNC_DELETIONS_MARKER), read here only as
# a one-time bootstrap when THIS module's own marker is absent.
#
# #16310 review round 4, 3(b), accepted residual limitation: a filename
# containing a literal newline still splits into two lines somewhere in the
# find -> ansible -> target-side-file transport below (the `find`/`read -r`
# pipeline has no other record separator available here). This fails SAFE --
# the corrupted "candidate" resolves to a path that does not exist or is
# refused, so the real file is left in place, never deleted -- not
# re-plumbed to a NUL-separated transport, which the ansible module glue
# (stdout_lines, the present-files copy, the delete-list file) does not
# support end to end without a much larger change.
#
# #16310 review round 12:
#   B1: the deletion shell task now declares `args: executable: /bin/bash`
#       (matching every other pipefail task in this repo). Without it,
#       ansible runs `shell:` under `/bin/sh`, which is dash on Ubuntu --
#       dash rejects `set -o pipefail` with "Illegal option", so the task
#       always landed in `rescue` and NOTHING was ever deleted on an Ubuntu
#       host. CI could not catch this because the wiring test ran the script
#       with `bash -c` directly instead of the interpreter the task itself
#       declares.
#   N4: the delete candidates are no longer inlined into the script as a
#       heredoc. A candidate path exactly equal to the old heredoc
#       terminator ended the heredoc early and ran the remaining script
#       lines as shell -- candidates come from git history and are
#       untrusted. The list is now written target-side, with
#       ansible.builtin.copy, to a tempfile the shell script reads a line at
#       a time with `read -r`; the file is removed afterward in `always:`.
#   N5/N6: see the `always:` block and the bootstrap-fallback facts below.
#
# Contract:
#   sync_deletions_label       (str) Display label, e.g. "Backend".
#   sync_deletions_source_dir  (str) This component's source dir under
#                               code_source, absolute, on the CONTROLLER.
#   sync_deletions_target_dir  (str) The deployed component dir, absolute,
#                               on the TARGET host this play is running against.
#   sync_deletions_owner       (str) Account that must own the marker.
#   sync_deletions_planner_python (str, optional) Path to the SLM's own venv
#                               python, on the CONTROLLER. Defaults to
#                               {{ autobot.base_dir }}/autobot-slm-backend/venv/bin/python3.

- name: "{{ sync_deletions_label }} | Deletions"
  tags: ['slm', 'deploy']
  block:
    - name: "{{ sync_deletions_label }} | Deletions: slurp this module's own marker from the target"
      ansible.builtin.slurp:
        src: "{{ sync_deletions_target_dir }}/.autobot_sync_deletions_commit"
      register: _sd_own_marker
      become: true
      ignore_errors: true

    - name: "{{ sync_deletions_label }} | Deletions: slurp the legacy .deployed_commit as a read-only bootstrap"
      ansible.builtin.slurp:
        src: "{{ sync_deletions_target_dir }}/.deployed_commit"
      register: _sd_legacy_marker
      become: true
      ignore_errors: true
      when: _sd_own_marker is failed

    - name: "{{ sync_deletions_label }} | Deletions: settle on the previous commit, if any"
      ansible.builtin.set_fact:
        _sd_previous_commit: >-
          {{ (_sd_own_marker.content | b64decode | trim)
             if (_sd_own_marker is succeeded)
             else ((_sd_legacy_marker.content | b64decode | trim)
                   if (_sd_legacy_marker is defined and _sd_legacy_marker is succeeded)
                   else '') }}

    - name: "{{ sync_deletions_label }} | Deletions: resolve the commit being deployed"
      ansible.builtin.command:
        cmd: git -c safe.directory={{ code_source_dir }} -C {{ code_source_dir }} rev-parse HEAD
      register: _sd_new_commit_git
      changed_when: false
      delegate_to: localhost

    - name: "{{ sync_deletions_label }} | Deletions: compute the diff-based plan (previous commit known)"
      ansible.builtin.command:
        cmd: >-
          {{ sync_deletions_planner_python | default(autobot.base_dir ~ '/autobot-slm-backend/venv/bin/python3') }}
          {{ autobot.base_dir }}/autobot-slm-backend/scripts/sync_deletion_planner.py
          diff --repo-root {{ code_source_dir }} --source-dir {{ sync_deletions_source_dir }}
          --previous-commit {{ _sd_previous_commit }} --new-commit {{ _sd_new_commit_git.stdout | trim }}
      register: _sd_plan_diff
      changed_when: false
      delegate_to: localhost
      when: _sd_previous_commit | length > 0

    # #16310 review round 12, N6: an unknown previous_commit (the marker
    # names a commit this controller clone does not have -- a force-push or
    # a re-clone moved history out from under it) used to fail the diff plan
    # every time, land in rescue, warn, and repeat forever -- nothing ever
    # advanced. services.sync_deletions.compute_deletion_plan now detects
    # that case itself (`git cat-file -e`) and returns bootstrap_required
    # instead of error, so this settles on the SAME one-time bootstrap mode
    # used when no marker exists at all, rather than a permanent skip.
    #
    # #16310 review round 13, finding 3: `| bool` on the fact itself, and on
    # EVERY later `when:`/Jinja use below -- Ansible templating can hand this
    # fact back as the STRING "False" (e.g. round-tripped through a
    # registered var), which is truthy in Jinja, so an unfiltered
    # `if _sd_need_bootstrap` would pick the bootstrap plan on every
    # diff-mode run.
    - name: "{{ sync_deletions_label }} | Deletions: decide whether to fall back to bootstrap mode"
      ansible.builtin.set_fact:
        _sd_need_bootstrap: >-
          {{ ((_sd_previous_commit | length == 0) or
              ((_sd_plan_diff.stdout | from_json).bootstrap_required | default(false)
               if _sd_plan_diff is defined and _sd_plan_diff.stdout is defined else false)) | bool }}

    - name: "{{ sync_deletions_label }} | Deletions: warn that the previous marker commit is unknown to this clone"
      ansible.builtin.debug:
        msg: >-
          {{ sync_deletions_label }}: previous marker commit {{ _sd_previous_commit }} is unknown to
          this controller's clone (force-push or re-clone) -- falling back to bootstrap mode for
          {{ sync_deletions_target_dir }} (#16310 review round 12, N6).
      when: _sd_previous_commit | length > 0 and _sd_need_bootstrap | bool

    # #16310 review, BLOCKING 1: pruned with the SAME ARTIFACT_DIRS/
    # ARTIFACT_DIR_SUFFIXES vocabulary services/deploy_artifacts.py and
    # full_tree_drift.py use, via -prune so `find` never DESCENDS into a
    # venv/ or node_modules/ tree -- an `excludes:` filter on
    # ansible.builtin.find only trims the RESULT list, not the walk, and
    # walking those trees file-by-file is what made a first bootstrap take
    # hours. See repo_tests/sync_deletions_ansible_wiring_16310_test.py's
    # lockstep test asserting this list matches ARTIFACT_DIRS exactly.
    - name: "{{ sync_deletions_label }} | Deletions: enumerate files present on the target (bootstrap mode)"
      ansible.builtin.command:
        cmd: >-
          find {{ sync_deletions_target_dir }}
          \( -name __pycache__ -o -name .git -o -name venv -o -name .venv
          -o -name node_modules -o -name .mypy_cache -o -name .ruff_cache
          -o -name dist -o -name build -o -name '*.egg-info' \) -prune
          -o -type f -print
      register: _sd_present_raw
      become: true
      changed_when: false
      when: _sd_need_bootstrap | bool

    - name: "{{ sync_deletions_label }} | Deletions: allocate a present-files list file for the bootstrap plan"
      ansible.builtin.tempfile:
        state: file
        prefix: autobot-sync-deletions-present-
      register: _sd_present_file
      delegate_to: localhost
      when: _sd_need_bootstrap | bool

    - name: "{{ sync_deletions_label }} | Deletions: write the present-files list for the bootstrap plan"
      ansible.builtin.copy:
        content: |-
          {{ (_sd_present_raw.stdout_lines
              | map('regex_replace', '^' ~ sync_deletions_target_dir ~ '/', '') | list) | join('\n') }}
        dest: "{{ _sd_present_file.path }}"
      delegate_to: localhost
      when: _sd_need_bootstrap | bool

    - name: "{{ sync_deletions_label }} | Deletions: compute the bootstrap plan (no marker, or an unrecognized one)"
      ansible.builtin.command:
        cmd: >-
          {{ sync_deletions_planner_python | default(autobot.base_dir ~ '/autobot-slm-backend/venv/bin/python3') }}
          {{ autobot.base_dir }}/autobot-slm-backend/scripts/sync_deletion_planner.py
          bootstrap --repo-root {{ code_source_dir }} --source-dir {{ sync_deletions_source_dir }}
          --new-commit {{ _sd_new_commit_git.stdout | trim }} --present-file {{ _sd_present_file.path }}
      register: _sd_plan_bootstrap
      changed_when: false
      delegate_to: localhost
      when: _sd_need_bootstrap | bool

    - name: "{{ sync_deletions_label }} | Deletions: settle on the computed plan"
      ansible.builtin.set_fact:
        _sd_plan: "{{ (_sd_plan_bootstrap if _sd_need_bootstrap | bool else _sd_plan_diff).stdout | from_json }}"

    - name: "{{ sync_deletions_label }} | Deletions: fail loudly when the plan could not be computed"
      ansible.builtin.fail:
        msg: "Deletion plan failed for {{ sync_deletions_target_dir }}: {{ _sd_plan.error }} (#16310)"
      when: _sd_plan.error is truthy

    # #16310 review round 12, N4: the delete list travels to the target as a
    # real file (ansible.builtin.copy), never inlined into the script text
    # via a heredoc. A candidate equal to the OLD heredoc terminator, or
    # containing shell metacharacters, is now just a line in this file --
    # `read -r` treats it as inert text, reaching `rm` only as a quoted
    # `$rel`. Removed in `always:` below regardless of how the shell task
    # exits.
    - name: "{{ sync_deletions_label }} | Deletions: allocate a delete-list file on the target"
      ansible.builtin.tempfile:
        state: file
        prefix: autobot-sync-deletions-list-
      register: _sd_delete_list_file
      become: true
      when: _sd_plan.delete | length > 0

    - name: "{{ sync_deletions_label }} | Deletions: write the delete-list file on the target"
      ansible.builtin.copy:
        content: "{{ _sd_plan.delete | join('\n') }}\n"
        dest: "{{ _sd_delete_list_file.path }}"
      become: true
      when: _sd_plan.delete | length > 0

    # #16310 review, HIGH: a symlinked parent under the target could resolve
    # outside it. Resolved with `realpath -m` on the TARGET itself (the
    # controller cannot see the target's real filesystem for a remote node),
    # inside one shell task rather than one ansible round-trip per candidate
    # -- containment is checked before EVERY removal, never trusted from the
    # (already lexically-checked, #16310 review MEDIUM 3) planner output alone.
    - name: "{{ sync_deletions_label }} | Deletions: remove only paths that resolve inside the target root"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          root_real=$(realpath -m -- "{{ sync_deletions_target_dir }}")
          refused=""
          while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            cand_real=$(realpath -m -- "{{ sync_deletions_target_dir }}/$rel")
            # #16310 review round 12, N7: `realpath -m` also refuses a
            # candidate whose final path component is itself a symlink
            # pointing outside the tree -- accepted limitation (this repo
            # tracks 0 symlinks).
            case "$cand_real" in
              "$root_real"|"$root_real"/*)
                rm -f -- "{{ sync_deletions_target_dir }}/$rel"
                ;;
              *)
                refused="$refused $rel"
                ;;
            esac
          done < "{{ _sd_delete_list_file.path }}"
          if [ -n "$refused" ]; then
            echo "REFUSED (resolved outside {{ sync_deletions_target_dir }}):$refused" >&2
            exit 1
          fi
      args:
        # #16310 review round 12, B1: without this, ansible runs `shell:`
        # under /bin/sh -- dash on Ubuntu -- which rejects `set -o pipefail`
        # ("Illegal option", rc 2), sending every run to `rescue` and
        # deleting nothing, silently, forever. The other pipefail tasks in
        # this repo all declare this too.
        executable: /bin/bash
      register: _sd_delete_result
      become: true
      when: _sd_plan.delete | length > 0
      changed_when: _sd_plan.delete | length > 0

    - name: "{{ sync_deletions_label }} | Deletions: write this module's own marker (after deletion succeeds)"
      ansible.builtin.copy:
        content: "{{ _sd_new_commit_git.stdout | trim }}\n"
        dest: "{{ sync_deletions_target_dir }}/.autobot_sync_deletions_commit"
        owner: "{{ sync_deletions_owner }}"
        group: "{{ sync_deletions_owner }}"
        mode: "0644"
      become: true

  rescue:
    - name: "{{ sync_deletions_label }} | Deletions: warn and skip -- marker NOT written, next run retries"
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ sync_deletions_label }} deletion pass failed for
          {{ sync_deletions_target_dir }}: {{ ansible_failed_result.msg | default(ansible_failed_result) }}
          (#16310). Nothing was recorded as done; the next run retries from the same baseline.

  # #16310 review round 12, N5: both temp files must go regardless of how the
  # block exited -- a `rescue`-only or success-only cleanup would leak one of
  # them on the other path. `.path is defined` guards a task that never ran
  # (its own `when:` was false) or never even reached its `register:` (an
  # earlier failure) -- register still creates the variable in the skipped
  # case (`skipped: true`, no `path` key), so checking `.path` rather than
  # just the variable itself is what actually detects "nothing to clean up".
  #
  # #16310 review round 13, finding 2: `always:` has no `rescue:` of its own,
  # so a failing cleanup task here -- an unreachable target during cleanup, a
  # permission error -- would itself abort under PLAY 2's
  # `any_errors_fatal: true`, taking down the whole fleet run over a leaked
  # tempfile and contradicting this module's own "one node's failure warns,
  # never aborts the fleet" contract. `failed_when: false` on both; the
  # target-side task also gets `ignore_unreachable: true` since only it can
  # run against a since-gone-unreachable remote host (the controller-side one
  # always targets localhost).
  always:
    - name: "{{ sync_deletions_label }} | Deletions: remove the controller-side present-files list"
      ansible.builtin.file:
        path: "{{ _sd_present_file.path }}"
        state: absent
      delegate_to: localhost
      when: _sd_present_file is defined and _sd_present_file.path is defined
      failed_when: false

    - name: "{{ sync_deletions_label }} | Deletions: remove the target-side delete-list file"
      ansible.builtin.file:
        path: "{{ _sd_delete_list_file.path }}"
        state: absent
      become: true
      when: _sd_delete_list_file is defined and _sd_delete_list_file.path is defined
      failed_when: false
      ignore_unreachable: true
