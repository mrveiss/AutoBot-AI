# ChromaDB tasks for the database role (MVA-1319 / GH#8786)
# Deploys ChromaDB vector store alongside Redis Stack on database nodes.
---

- name: "ChromaDB | Create install and data directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ redis_owner }}"
    group: "{{ redis_group }}"
  loop:
    - "{{ chromadb_install_dir }}"
    - "{{ chromadb_data_dir }}"
  become: true
  tags: ['redis', 'chromadb']

- name: "ChromaDB | Enforce venv target Python version (env-drift fix)"
  ansible.builtin.include_role:
    name: python_interpreter
    tasks_from: ensure_venv_version
  vars:
    venv_path: "{{ chromadb_install_dir }}/venv"
    venv_python: python3.14
  tags: ['redis', 'chromadb']

- name: "ChromaDB | Create Python venv"
  ansible.builtin.command:
    cmd: "python3.14 -m venv {{ chromadb_install_dir }}/venv --clear"
    creates: "{{ chromadb_install_dir }}/venv/bin/python"
  become: true
  become_user: "{{ redis_owner }}"
  tags: ['redis', 'chromadb']

- name: "ChromaDB | Upgrade pip in venv"
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: "{{ chromadb_install_dir }}/venv"
  become: true
  become_user: "{{ redis_owner }}"
  environment:
    HOME: "{{ chromadb_install_dir }}"
  tags: ['redis', 'chromadb']

# #15598: the standalone ChromaDB service venv has no requirements manifest of
# its own, so the floor must stay literal here. It is the specifier text
# `autobot-backend/requirements.txt` and the ai-stack manifest both declare --
# `>=0.5` admitted a chromadb two majors below the one the backend that reads
# this instance is built against. The upper bound comes across with the floor
# for the reason those manifests state next to it -- it guards against breaking
# API changes above 2.x -- and an unbounded floor in a venv with no `-c` would
# resolve straight past it.
- name: "ChromaDB | Install chromadb package"
  ansible.builtin.pip:
    name: "chromadb>=1.5.9,<2.0.0"
    state: present
    virtualenv: "{{ chromadb_install_dir }}/venv"
    extra_args: "--timeout 300"
  become: true
  become_user: "{{ redis_owner }}"
  environment:
    HOME: "{{ chromadb_install_dir }}"
  timeout: 600
  tags: ['redis', 'chromadb']

- name: "ChromaDB | Fix venv ownership"
  ansible.builtin.file:
    path: "{{ chromadb_install_dir }}/venv"
    state: directory
    owner: "{{ redis_owner }}"
    group: "{{ redis_group }}"
    recurse: true
  become: true
  tags: ['redis', 'chromadb']

# #13535: the token read, the credential file and the unit template moved to
# code_only.yml, which main.yml includes BEFORE importing this file — so the
# mandatory EnvironmentFile (#12513) is already on disk by the time the service
# is started below, on the provisioning path and the updater's path alike.
# Repeating them here would give the fix two definitions and let them drift.
- name: "ChromaDB | Enable and start service"
  ansible.builtin.systemd:
    name: autobot-chromadb
    state: started
    enabled: true
    daemon_reload: true
  become: true
  tags: ['redis', 'chromadb']
