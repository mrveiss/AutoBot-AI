# ChromaDB tasks for the database role (MVA-1319 / GH#8786)
# Deploys ChromaDB vector store alongside Redis Stack on database nodes.
---

- name: "ChromaDB | Create install and data directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ redis_owner }}"
    group: "{{ redis_group }}"
  loop:
    - "{{ chromadb_install_dir }}"
    - "{{ chromadb_data_dir }}"
  become: true
  tags: ['redis', 'chromadb']

- name: "ChromaDB | Enforce venv target Python version (env-drift fix)"
  ansible.builtin.include_role:
    name: python314
    tasks_from: ensure_venv_version
  vars:
    venv_path: "{{ chromadb_install_dir }}/venv"
    venv_python: python3.14
  tags: ['redis', 'chromadb']

- name: "ChromaDB | Create Python venv"
  ansible.builtin.command:
    cmd: "python3.14 -m venv {{ chromadb_install_dir }}/venv --clear"
    creates: "{{ chromadb_install_dir }}/venv/bin/python"
  become: true
  become_user: "{{ redis_owner }}"
  tags: ['redis', 'chromadb']

- name: "ChromaDB | Upgrade pip in venv"
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: "{{ chromadb_install_dir }}/venv"
  become: true
  become_user: "{{ redis_owner }}"
  environment:
    HOME: "{{ chromadb_install_dir }}"
  tags: ['redis', 'chromadb']

- name: "ChromaDB | Install chromadb package"
  ansible.builtin.pip:
    name: "chromadb>=0.5"
    state: present
    virtualenv: "{{ chromadb_install_dir }}/venv"
    extra_args: "--timeout 300"
  become: true
  become_user: "{{ redis_owner }}"
  environment:
    HOME: "{{ chromadb_install_dir }}"
  timeout: 600
  tags: ['redis', 'chromadb']

- name: "ChromaDB | Fix venv ownership"
  ansible.builtin.file:
    path: "{{ chromadb_install_dir }}/venv"
    state: directory
    owner: "{{ redis_owner }}"
    group: "{{ redis_group }}"
    recurse: true
  become: true
  tags: ['redis', 'chromadb']

# #12513: the unit template only emits CHROMA_SERVER_AUTHN_* when
# chromadb_auth_token is non-empty, and its default is "" — so chroma ran
# unauthenticated on every deployment. Read the shared token the SLM generates,
# so the server credential matches the one the backend sends. Never generate one
# here: two independent generators produce two values and a total RAG outage.
- name: "ChromaDB | Read the shared auth token from slm-secrets.env (#12513)"
  ansible.builtin.include_tasks: ../../../_shared/tasks/read_chromadb_auth_token.yml
  tags: ['redis', 'chromadb']

- name: "ChromaDB | Adopt the SLM-managed auth token when present (#12513)"
  ansible.builtin.set_fact:
    chromadb_auth_token: "{{ _chromadb_auth_token_read }}"
  when: (_chromadb_auth_token_read | default('') | trim) | length > 0
  no_log: true
  tags: ['redis', 'chromadb']

- name: "ChromaDB | Deploy systemd service unit"
  ansible.builtin.template:
    src: autobot-chromadb.service.j2
    dest: /etc/systemd/system/autobot-chromadb.service
    mode: "0644"
  become: true
  notify:
    - reload systemd
    - restart chromadb
  tags: ['redis', 'chromadb']

- name: "ChromaDB | Enable and start service"
  ansible.builtin.systemd:
    name: autobot-chromadb
    state: started
    enabled: true
    daemon_reload: true
  become: true
  tags: ['redis', 'chromadb']
