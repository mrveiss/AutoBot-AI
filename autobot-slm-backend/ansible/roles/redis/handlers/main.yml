# Redis role handlers

- name: restart redis-stack
  systemd:
    name: redis-stack-server
    state: restarted
  become: true

- name: reload systemd
  systemd:
    daemon_reload: true
  become: true

- name: reload firewall
  ufw:
    state: reloaded
  become: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart redis_exporter
  ansible.builtin.systemd:
    name: redis_exporter
    state: restarted
  become: true

- name: restart chromadb
  ansible.builtin.systemd:
    name: autobot-chromadb
    state: restarted
  become: true
