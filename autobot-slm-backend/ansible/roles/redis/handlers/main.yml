---
# Redis role handlers

- name: restart redis-stack
  when: autobot_restart_services | default(true) | bool  # #20743: false on a sync without restarts
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: "{{ redis_service_name | default('redis-stack-server') }}"

- name: reload systemd
  systemd:
    daemon_reload: true
  become: true

- name: reload firewall
  ufw:
    state: reloaded
  become: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart redis_exporter
  when: autobot_restart_services | default(true) | bool  # #20743: false on a sync without restarts
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: redis_exporter

- name: restart chromadb
  when: autobot_restart_services | default(true) | bool  # #20743: false on a sync without restarts
  ansible.builtin.include_tasks: ../../../_shared/tasks/restart_unit.yml  # #20772: reset-failed, then restart
  vars:
    restart_unit_name: autobot-chromadb
