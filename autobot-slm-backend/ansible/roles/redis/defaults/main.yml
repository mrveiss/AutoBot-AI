---
# Redis configuration defaults
network_subnet: "{{ lookup('env', 'NETWORK_SUBNET') or lookup('pipe', 'grep -oP \"NETWORK_SUBNET=\\K.*\" /etc/autobot/slm-secrets.env 2>/dev/null') or '' }}"
redis_port: 6379
redis_bind: "0.0.0.0"
redis_password: ""
redis_maxmemory: "2gb"
redis_maxmemory_policy: "allkeys-lru"
redis_data_dir: "/var/lib/redis"
redis_config_file: "/etc/redis/redis.conf"
redis_install_stack: true
redis_install_from_repo: true

# Persistence
redis_save_enabled: true
redis_appendonly: true

# TLS Configuration (Issue #725: mTLS support)
redis_tls_enabled: "{{ lookup('env', 'AUTOBOT_REDIS_TLS_ENABLED') | default('false', true) | lower == 'true' }}"
redis_tls_port: "{{ lookup('env', 'AUTOBOT_REDIS_TLS_PORT') | default(6380, true) }}"
redis_tls_auth_clients: "{{ lookup('env', 'AUTOBOT_REDIS_TLS_AUTH_CLIENTS') | default('optional', true) }}"
redis_tls_disable_plain_port: "{{ lookup('env', 'AUTOBOT_REDIS_TLS_DISABLE_PLAIN') | default('false', true) | lower == 'true' }}"
redis_tls_cert_dir: "{{ lookup('env', 'AUTOBOT_TLS_REMOTE_CERT_DIR') | default('/etc/autobot/certs', true) }}"

# Certificate source: 'local' (files) or 'slm-api' (fetch from SLM)
redis_tls_source: "{{ lookup('env', 'AUTOBOT_TLS_SOURCE') | default('local', true) }}"

# SLM API configuration (for redis_tls_source='slm-api')
slm_api_url: "{{ lookup('env', 'SLM_API_URL') | default('http://' + (slm_host | default('127.0.0.1')) + ':' + (slm_port | default(8000) | string), true) }}"
slm_api_token: "{{ lookup('env', 'SLM_API_TOKEN') | default('', true) }}"
redis_tls_credential_id: "{{ lookup('env', 'REDIS_TLS_CREDENTIAL_ID') | default('', true) }}"

# Certificate source paths (for redis_tls_source='local')
redis_tls_local_cert_dir: "{{ lookup('env', 'AUTOBOT_TLS_CERT_DIR') | default('certs', true) }}"
redis_tls_ca_cert: "{{ redis_tls_local_cert_dir }}/ca/ca-cert.pem"
redis_tls_server_cert: "{{ redis_tls_local_cert_dir }}/redis/server-cert.pem"
redis_tls_server_key: "{{ redis_tls_local_cert_dir }}/redis/server-key.pem"

# File ownership enforcement (#3396)
# User and group that own Redis data, config, log, and run directories.
# Set to autobot:autobot so the application user has consistent read access
# across all VMs; enforced idempotently on every Ansible run.
redis_owner: "autobot"
redis_group: "autobot"

# Redis Exporter (Prometheus metrics)
redis_exporter_version: "1.62.0"
redis_exporter_port: 9121
slm_admin_url: "https://{{ slm_host | default('127.0.0.1') }}"

# Health check (retry-based polling instead of fixed timeout)
redis_health_check_retries: 60       # Max attempts (60 × 5s = 300s)
redis_health_check_delay: 5          # Seconds between retries

# ChromaDB (vector database, co-located with Redis on database nodes — MVA-1319)
chromadb_port: 8100
chromadb_install_dir: /opt/autobot/autobot-db-stack/chromadb
chromadb_data_dir: /opt/autobot/autobot-db-stack/chromadb/data
# CHROMA_SERVER_AUTHN_* token auth (#12513). Empty (default) = auth disabled,
# matching pre-#12513 behaviour. Normally adopted from the SLM-generated value in
# slm-secrets.env (see _shared/tasks/read_chromadb_auth_token.yml); override via
# group_vars/vault only — never commit a real value. Must match
# backend_chromadb_auth_token (backend role) so the client credential matches the
# server's.
chromadb_auth_token: ""
# The one file the chroma unit loads its server credential from (#12513). This
# MUST stay equal to the EnvironmentFile= line in
# templates/autobot-chromadb.service.j2: the unit used to declare an optional
# `-/opt/autobot/autobot-db-stack/.env` that nothing ever wrote, so a missing
# credential produced a running-but-unauthenticated chroma instead of a failure.
# Lives under /etc/autobot with the other credential stores (slm-secrets.env,
# db-credentials.env) rather than under /opt, which decommission-node.yml and
# remove-role.yml wipe.
chromadb_authn_env_file: /etc/autobot/chromadb.env
