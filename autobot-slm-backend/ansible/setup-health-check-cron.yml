# Playbook: Install Daily Health Check Cron Job (MVA-291)
# Replaces the direct crontab manipulation in setup_daily_health_check.sh.
# Wrapper script is deployed to /usr/local/bin/ (stable, survives reboots).
---
- name: Install AutoBot daily health check cron job
  hosts: "{{ target_host | default('all') }}"
  become: true
  gather_facts: true

  roles:
    - role: monitoring
      vars:
        monitoring_install_prometheus: false
        monitoring_install_grafana: false
        monitoring_install_node_exporter: false
        monitoring_install_health_check_cron: true
