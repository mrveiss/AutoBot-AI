# Canonical redirect (#11424).
#
# This top-level file was a STALE DUPLICATE of playbooks/update-all-nodes.yml
# (flagged in BUG_SWEEP #9710). Critically, the stale copy deployed new backend
# code and restarted the service but NEVER ran the database migration sequence —
# so an update through this entrypoint left the DB behind the code, causing
# schema drift and runtime failures (e.g. "unable to create work items" when an
# INSERT hit a missing enum value / column).
#
# Migrations must be part of EVERY update procedure. Rather than maintain two
# divergent copies, this entrypoint now imports the single canonical playbook,
# which runs the strict `alembic upgrade head` sequence (pg_dump backup ->
# baseline adoption -> upgrade, fail-closed) before restarting the backend.
#
# Run this or playbooks/update-all-nodes.yml — both execute the same flow with
# migrations. See docs/runbooks/CODE_UPDATE.md.
- import_playbook: playbooks/update-all-nodes.yml
