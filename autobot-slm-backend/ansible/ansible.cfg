[defaults]
# Ansible Configuration for AutoBot Hyper-V Deployment

# Inventory and Connection Settings
# NOTE: No default inventory is configured. All playbook invocations MUST
# pass -i <inventory> explicitly. This prevents Ansible from merging a
# static production.yml with dynamically-generated wizard inventories
# when both are present (#2837).
roles_path = roles
remote_user = autobot
private_key_file = /etc/autobot/ssh/autobot_key
timeout = 30
forks = 5

# Local Temp Directory (#10006): per-user path (the Ansible default). A fixed
# shared path like /tmp/ansible_local_tmp is created mode 0700 by whichever
# user runs ansible first, locking out every other user (operator debugging as
# themselves vs the SLM's autobot-user playbook executor). The SLM executor
# overrides this via ANSIBLE_LOCAL_TEMP (services/playbook_executor.py), which
# also covers hardened units (ProtectHome) where $HOME is not writable.
local_tmp = ~/.ansible/tmp

# Output and Logging
# #7137: `stdout_callback = yaml` was the legacy short alias for
# `community.general.yaml`, removed in community.general v12. Use the
# ansible-core default callback with `result_format = yaml` per ansible-core
# 2.13+ guidance — same YAML rendering, no community.general dependency.
stdout_callback = ansible.builtin.default
stderr_callback = ansible.builtin.default
result_format = yaml
log_path = /var/log/autobot/ansible.log
display_skipped_hosts = False
display_ok_hosts = True

# Performance Optimization
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout = 86400
pipelining = True

# WSL2 Compatibility (GH#9282)
# Exclude hardware facts to suppress /sys/class/infiniband warnings on WSL2.
# Hardware detection isn't reliable on WSL2 anyway, and other facts remain available.
gather_subset = !hardware

# Security Settings
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# Retry and Error Handling
retry_files_enabled = True
retry_files_save_path = /tmp/ansible-retry

# SSH Settings
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes
pipelining = True
control_path_dir = /tmp/.ansible-cp
control_path = /tmp/.ansible-cp/ansible-ssh-%%h-%%p-%%r

# Privilege Escalation
[privilege_escalation]
become_flags = -H -S -n

# Inventory Settings
[inventory]
enable_plugins = yaml, ini, auto
