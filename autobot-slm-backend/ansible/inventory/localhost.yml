---
# Single-host SLM-Manager deployment inventory
# localhost runs SLM components only.
# Backend, frontend, AI, browser, NPU nodes are deployed
# via the SLM wizard (temp inventory) — not from this file.
# Issue #2961: Single-host deployment runbook

all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_user: "{{ lookup('env', 'USER') }}"
      ansible_become: true
      ansible_become_method: sudo
      slm_node_id: "00-SLM-Manager"

  children:
    slm:
      hosts:
        localhost:

    # SLM-Manager needs a local Redis instance
    database:
      hosts:
        localhost:
