---
# AutoBot Production Inventory - target hosts/VMs (hypervisor-agnostic)
# Update the ansible_host IPs with your actual host/VM addresses

all:
  vars:
    # Global SSH and connection settings - UPDATED FOR PROVIDED VMs
    # Issue #700: SSH key authentication (no plaintext passwords)
    ansible_user: autobot
    ansible_ssh_private_key_file: /etc/autobot/ssh/autobot_key
    ansible_become: true
    # Become password from vault (only needed if passwordless sudo not configured)
    # To use: ansible-playbook ... --ask-vault-pass
    # ansible_become_password: "{{ vault_become_password_autobot }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
    ansible_python_interpreter: /usr/bin/python3

    # Global network configuration - set per-install in .env or override vars
    network_subnet: "{{ lookup('env', 'NETWORK_SUBNET') | default('0.0.0.0/0', true) }}"
    network_gateway: "{{ lookup('env', 'NETWORK_GATEWAY') | default('0.0.0.0', true) }}"
    dns_servers:
      - "{{ dns_nameservers[0] }}"
      - "{{ dns_nameservers[1] }}"

    # Global AutoBot configuration
    autobot_domain: "autobot.internal"
    autobot_environment: "production"
    autobot_version: "2.0.0"

    # Service discovery endpoints - derived from inventory host definitions (#799)
    # Each host IP is defined ONCE in ansible_host; these vars look it up dynamically.
    # Backend uses network_address since ansible_host is 127.0.0.1 (local connection).
    # slm_host: read from install-time secrets (set by install.sh), not hostvars
    #           which gets polluted by gathered facts on multi-interface hosts.
    slm_host: "{{ lookup('env', 'SLM_HOST') | default(lookup('pipe', 'grep -oP \"SLM_HOST=\\K.*\" /etc/autobot/slm-secrets.env 2>/dev/null || echo 127.0.0.1'), true) }}"
    slm_port: 8000
    backend_host: "{{ hostvars['autobot-host']['network_address'] }}"
    backend_port: 8001
    backend_protocol: "https"
    frontend_host: "{{ hostvars['autobot-frontend']['ansible_host'] }}"
    frontend_port: 5173
    npu_worker_host: "{{ hostvars['autobot-npu']['ansible_host'] }}"
    npu_worker_port: 8081
    redis_host: "{{ hostvars['autobot-database']['ansible_host'] }}"
    redis_port: 6379
    ai_stack_host: "{{ hostvars['autobot-aiml']['ansible_host'] }}"
    ai_stack_port: 8080
    browser_host: "{{ hostvars['autobot-browser']['ansible_host'] }}"
    browser_port: 3000

  children:
    slm:
      hosts:
        autobot-slm:
          ansible_host: "{{ lookup('env', 'AUTOBOT_SLM_HOST') | default('127.0.0.1', true) }}"  # SLM Server
          vm_id: "autobot-slm-server"
          vm_role: "slm"
          vm_hostname: "autobot-slm"
          services:
            - slm-backend
            - postgresql
      vars:
        slm_port: 8000

    frontend:
      hosts:
        autobot-frontend:
          ansible_host: "{{ lookup('env', 'AUTOBOT_FRONTEND_HOST') | default('127.0.0.1', true) }}"  # Frontend VM
          vm_id: "autobot-frontend-vm"
          vm_role: "frontend"
          vm_hostname: "autobot-frontend"
          vm_resources:
            ram_mb: 4096     # Test config - dynamic memory
            cpu_cores: 2
            disk_gb: 50      # LVM expansion target
          services:
            - nginx
            - nodejs
            - vue-frontend
            - dns-cache
      vars:
        # Frontend-specific configuration
        frontend_port: 5173
        nginx_port: 80
        nginx_ssl_port: 443
        nodejs_version: "20"
        vue_build_mode: "production"

    backend:
      hosts:
        autobot-host:
          ansible_connection: local    # This is the local WSL machine
          ansible_host: 127.0.0.1      # Local connection
          network_address: "{{ lookup('env', 'AUTOBOT_BACKEND_HOST') | default('127.0.0.1', true) }}"  # IP used by other VMs to reach this host
          ansible_become: false           # Issue #700: Disable become for local host by default
          # Enable become when needed with: --extra-vars "ansible_become=yes"
          # Or use: --ask-become-pass for operations requiring sudo
          vm_id: "autobot-wsl-machine"
          vm_role: "wsl-host"
          vm_hostname: "autobot-host"
          services:
            - fastapi-backend
            - terminal-service
            - novnc-service
            - python3
            - desktop-access
      vars:
        # WSL machine configuration (local)
        # Issue #957: nginx holds 8443 (TLS); uvicorn binds plain HTTP on localhost:8001
        backend_host: "127.0.0.1"    # uvicorn bind address (localhost only)
        backend_port: 8001           # uvicorn plain HTTP port (internal)
        backend_nginx_port: 8443     # nginx external TLS port (LAN-facing)
        backend_protocol: "http"     # uvicorn no longer terminates TLS
        terminal_port: 7681
        novnc_port: 6080
        vnc_port: 5900
        python_version: "3.12"
        fastapi_workers: 4
        log_level: "INFO"

    npu:
      hosts:
        autobot-npu:
          ansible_host: "{{ lookup('env', 'AUTOBOT_NPU_WORKER_HOST') | default('127.0.0.1', true) }}"  # NPU Worker VM
          vm_id: "autobot-npu-vm"
          vm_role: "npu"
          vm_hostname: "autobot-npu"
          vm_resources:
            ram_mb: 8192     # Test config - dynamic memory
            cpu_cores: 4
            disk_gb: 50      # LVM expansion target
          services:
            - npu-worker
            - openvino
            - python3
            - hardware-acceleration
          hardware_features:
            npu_access: true
            gpu_passthrough: true
            pci_passthrough: true
            hardware_acceleration: true
      vars:
        # NPU Worker-specific configuration
        npu_worker_port: 8081
        openvino_device: "AUTO"  # Auto-detect NPU > GPU > CPU
        python_version: "3.11"
        worker_threads: 2
        inference_optimization: true
        # Hardware access configuration
        enable_npu_passthrough: true
        enable_gpu_passthrough: true
        npu_device_path: "/dev/accel"
        gpu_device_path: "/dev/dri"

    database:
      hosts:
        autobot-database:
          ansible_host: "{{ lookup('env', 'AUTOBOT_REDIS_HOST') | default('127.0.0.1', true) }}"  # Database VM
          vm_id: "autobot-database-vm"
          vm_role: "database"
          vm_hostname: "autobot-database"
          vm_resources:
            ram_mb: 8192     # Test config - dynamic memory
            cpu_cores: 2
            disk_gb: 50      # LVM expansion target
          services:
            - redis-stack
            - model-storage
            - backup-service
      vars:
        # Database-specific configuration
        redis_port: 6379
        redis_insight_port: 8002
        redis_memory_limit: "6gb"
        redis_persistence: true
        backup_retention_days: 30

    aiml:
      hosts:
        autobot-aiml:
          ansible_host: "{{ lookup('env', 'AUTOBOT_AI_STACK_HOST') | default('127.0.0.1', true) }}"  # AI/ML VM
          vm_id: "autobot-aiml-vm"
          vm_role: "aiml"
          vm_hostname: "autobot-aiml"
          vm_resources:
            ram_mb: 16384    # Test config - dynamic memory
            cpu_cores: 6
            disk_gb: 50      # LVM expansion target
          services:
            - ai-stack
            - chromadb
            - tts-worker
          hardware_features:
            gpu_passthrough: true
      vars:
        # AI/ML-specific configuration
        ai_stack_port: 8080
        ollama_port: 11434
        # TTS Worker (#928, migrated from .22 -- #1394)
        tts_worker_port: 8082
        model_cache_size: "10gb"
        inference_threads: 4

    browser:
      hosts:
        autobot-browser:
          ansible_host: "{{ lookup('env', 'AUTOBOT_BROWSER_SERVICE_HOST') | default('127.0.0.1', true) }}"  # Browser VM - headless Playwright worker
          vm_id: "autobot-browser-vm"
          vm_role: "browser"
          vm_hostname: "autobot-browser"
          vm_resources:
            ram_mb: 4096     # Test config - dynamic memory
            cpu_cores: 2
            disk_gb: 50      # LVM expansion target
          # (#2989) .25 is a headless Playwright worker, not a VNC host.
          # VNC desktop is on .26 (llm node with vnc role).
          node_roles:
            - browser
          services:
            - playwright
            - browser-automation
      vars:
        # Browser-specific configuration
        playwright_port: 3000
        browser_timeout: 30
        headless_mode: true

    llm:
      hosts:
        autobot-llm:
          ansible_host: "{{ lookup('env', 'AUTOBOT_LLM_HOST') | default('127.0.0.1', true) }}"  # LLM CPU + xrdp RDP desktop (GH#1525 — xrdp replaces VNC)
          vm_id: "autobot-llm-vm"
          vm_role: "llm"
          vm_hostname: "autobot-llm"
          vm_resources:
            ram_mb: 16384
            cpu_cores: 8
            disk_gb: 100
          node_roles:
            - llm
            - xrdp
          services:
            - ollama
            - xrdp
          desktop_features:
            rdp_enabled: true
            rdp_port: 3389
      vars:
        ollama_port: 11434
        xrdp_port: 3389

    reserved:
      hosts:
        autobot-reserved:
          ansible_host: "{{ lookup('env', 'AUTOBOT_RESERVED_HOST') | default('127.0.0.1', true) }}"  # Reserved node - pending role assignment
          vm_id: "autobot-reserved-vm"
          vm_role: "reserved"
          vm_hostname: "autobot-reserved"
          services: []

# Environment-specific groups
production_vms:
  children:
    frontend:
    npu:
    database:
    aiml:
    browser:
    llm:
    reserved:
  vars:
    environment_type: "production"
    monitoring_enabled: true
    backup_enabled: true
    security_hardening: true

# Host machine group (not a VM)
production_host:
  children:
    backend:
  vars:
    environment_type: "production"
    host_machine: true

# Service-type groups for cross-VM operations
web_services:
  children:
    frontend:
    backend:
  vars:
    web_server_type: "nginx"
    ssl_enabled: true

data_services:
  children:
    database:
    aiml:
  vars:
    data_persistence: true
    backup_strategy: "incremental"

compute_services:
  children:
    backend:
    aiml:
    browser:
  vars:
    performance_monitoring: true
    resource_alerts: true

# Groups required by update-all-nodes.yml (#2294)
# These alias the role-based groups to match the SLM node naming convention.
slm_server:
  children:
    slm:

infrastructure:
  children:
    slm:
    backend:
    frontend:
    npu:
    aiml:
    browser:
    llm:
    reserved:

# Cross-inventory aliases (#2515)
# Ensure group names from hosts.yml and slm-nodes.yml resolve in production.yml.
redis:
  children:
    database:

npu_workers:
  children:
    npu:

npu_worker:
  children:
    npu:

ai_stack:
  children:
    aiml:

# LLM inference nodes alias -- used by provision-fleet-roles.yml (#1040)
llm_nodes:
  children:
    llm:

# RDP desktop nodes via xrdp (GH#1525 — xrdp on port 3389 replaces VNC)
rdp_nodes:
  children:
    llm:

# slm_nodes group used by SLM-specific playbooks (deploy-slm-agent, cleanup-nodes, etc.)
# Maps all nodes managed by the SLM system.
slm_nodes:
  children:
    slm:
    backend:
    frontend:
    npu:
    database:
    aiml:
    browser:
    llm:
    reserved:
