# AutoBot Ansible Inventory
all:
  vars:
    ansible_user: autobot
    ansible_ssh_private_key_file: /etc/autobot/ssh/autobot_key
    python_interpreter: /usr/bin/python3

  children:
    autobot_cluster:
      vars:
        # AutoBot Internal network — detected at install time via install.sh
        network_subnet: "{{ lookup('env', 'NETWORK_SUBNET') or lookup('pipe', 'grep -oP \"NETWORK_SUBNET=\\K.*\" /etc/autobot/slm-secrets.env 2>/dev/null') or '' }}"
        network_gateway: "{{ lookup('env', 'NETWORK_GATEWAY') or lookup('pipe', 'grep -oP \"NETWORK_GATEWAY=\\K.*\" /etc/autobot/slm-secrets.env 2>/dev/null') or '' }}"
        dns_servers:
          - "{{ dns_nameservers[0] }}"
          - "{{ dns_nameservers[1] }}"

      children:
        frontend:
          hosts:
            autobot-frontend:
              ansible_host: ${AUTOBOT_FRONTEND_HOST}
              services:
                - { name: "vue-dev", port: 5173, command: "npm run dev" }
                - { name: "nginx", port: 80, command: "nginx -g 'daemon off;'" }

        backend:
          hosts:
            autobot-backend:
              ansible_host: ${AUTOBOT_BACKEND_HOST}
              services:
                - { name: "fastapi", port: 8001, command: "uvicorn backend.fast_app_factory_fix:app --host 0.0.0.0 --port 8001" }
              environment:
                REDIS_HOST: "{{ infrastructure.hosts.database }}"
                AI_STACK_HOST: "{{ infrastructure.hosts.aiml }}"
                NPU_WORKER_HOST: "{{ infrastructure.hosts.npu }}"

        ai_stack:
          hosts:
            autobot-aistack:
              ansible_host: ${AUTOBOT_AI_STACK_HOST}
              services:
                - { name: "llm-server", port: 8080, command: "python -m src.ai_stack_main" }
              gpu_enabled: true
              memory_gb: 16

        npu_workers:
          hosts:
            autobot-npu:
              ansible_host: ${AUTOBOT_NPU_WORKER_HOST}
              services:
                - { name: "npu-service", port: 8081, command: "python -m src.npu_worker_main" }
              npu_enabled: true
              memory_gb: 8

        database:
          hosts:
            autobot-redis:
              ansible_host: ${AUTOBOT_REDIS_HOST}
              services:
                - { name: "redis-stack", port: 6379, command: "redis-stack-server --bind 0.0.0.0" }
              storage_gb: 100

# Cross-inventory aliases (#2515)
# Ensure group names from production.yml resolve in hosts.yml.
aiml:
  children:
    ai_stack:

npu:
  children:
    npu_workers:

redis:
  children:
    database:
