---
# SLM Server Configuration
# Services: SLM Backend, PostgreSQL, Nginx, Prometheus, Grafana, Node Exporter

# ==========================================
# CO-LOCATED SINGLE-BOX BACKEND WORKER COUNT (#11670, #876)
# ==========================================
# On a collapsed single-box deploy the SLM node ALSO runs the managed
# autobot-backend. That box is resource-constrained (often WSL2), and 4 uvicorn
# workers reproduced the #876 initialization deadlock — the reason the one-off
# fix-backend-worker-deadlock scripts hand-placed a single-worker.conf drop-in.
# #11670 removes those manual drop-ins and makes the canonical unit authoritative,
# so we pin the worker count for the co-located box HERE via the env-driven
# backend_workers var (the canonical mechanism) instead of a shadowing drop-in.
# This group_vars applies only to the slm group → the co-located SLM node; a
# DEDICATED multi-VM backend host lives in the `backend`/`main` group (not `slm`),
# so it keeps the role default of 4 workers (roles/backend/defaults/main.yml).
backend_workers: 1

# ==========================================
# FIREWALL CONFIGURATION (Issue #894)
# ==========================================

security:
  # SLM-specific firewall rules (least privilege)
  firewall_rules:
    # SLM Backend API (infrastructure only)
    - rule: allow
      port: 8000
      proto: tcp
      src: "{{ network_subnet }}"
      comment: "SLM Backend API"
    # Web UI (public access)
    - rule: allow
      port: 443
      proto: tcp
      comment: "SLM Frontend HTTPS"
    - rule: allow
      port: 80
      proto: tcp
      comment: "SLM Frontend HTTP (redirects to HTTPS)"
    # Monitoring (infrastructure only)
    - rule: allow
      port: 9090
      proto: tcp
      src: "{{ network_subnet }}"
      comment: "Prometheus"
    - rule: allow
      port: 3000
      proto: tcp
      src: "{{ network_subnet }}"
      comment: "Grafana"
    - rule: allow
      port: 9100
      proto: tcp
      src: "{{ network_subnet }}"
      comment: "Node Exporter"
    # PostgreSQL (infrastructure only)
    - rule: allow
      port: 5432
      proto: tcp
      src: "{{ network_subnet }}"
      comment: "PostgreSQL"
