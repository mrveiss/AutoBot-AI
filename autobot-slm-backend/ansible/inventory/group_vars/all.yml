---
# Global variables for all AutoBot VMs

# ==========================================
# CANONICAL INTER-NODE SSH KEY (#12429)
# ==========================================
# Single source of truth for the fleet private key used by SLM -> node SSH,
# deploy, code-sync and service orchestration. Every inventory
# (ansible_ssh_private_key_file) and every pubkey lookup resolves THIS var
# instead of a per-file literal. Mirrors backend ssot_config.path.ssh_key_path
# (env AUTOBOT_SSH_KEY_PATH / legacy SLM_SSH_KEY). ansible.cfg keeps the same
# literal as its bootstrap default because INI cannot template a var.
autobot_ssh_key_path: "/etc/autobot/ssh/autobot_key"

# ==========================================
# AUTOBOT APPLICATION CONFIGURATION
# ==========================================

# #14516: the canonical Redis unit name.
#
# Reachable where a play runs through PlaybookExecutor, which symlinks this
# directory beside the dynamic inventory (#11781). Two paths do NOT see it and
# fall back to the `| default(...)` literal instead: api/tls.py runs
# enable-tls.yml against a static `inventory.yml` in the ansible dir, and
# services/replication.py runs with an inline `-i "<ip>,"` host string that has
# no directory for group_vars at all. Wiring those two through the same
# group_vars linkage is tracked separately -- until then the default is what
# actually resolves there, so it must stay correct.
#
# The platform installs redis-stack, whose unit is `redis-stack-server`.
# `redis-server` is the plain Debian package and is never installed here, yet
# three playbooks managed that name as a literal and failed with "Could not
# find the requested service redis-server" the moment they ran. The redis
# role's own handlers and package check had the right name all along -- the
# literals drifted because nothing tied them to it.
redis_service_name: "redis-stack-server"

autobot:
  version: "2.0.0"
  environment: "production"
  domain: "autobot.internal"
  base_dir: "/opt/autobot"
  user: "autobot"
  group: "autobot"
  home_dir: "/home/autobot"

  # Service URLs - derived from infrastructure.yml SSOT (#808)
  services:
    frontend: "http://{{ frontend_host }}:{{ frontend_port }}"
    backend: "http://{{ backend_host }}:{{ backend_port }}"
    database: "redis://{{ redis_host }}:{{ redis_port }}"
    ai_stack: "http://{{ ai_stack_host }}:{{ ai_stack_port }}"
    npu_worker: "http://{{ npu_worker_host }}:{{ npu_worker_port }}"
    browser: "http://{{ browser_host }}:{{ browser_port }}"

# ==========================================
# NETWORK CONFIGURATION
# ==========================================

network:
  subnet: "{{ network_subnet }}"
  gateway: "{{ network_gateway }}"
  dns_servers:
    - "{{ dns_nameservers[0] }}"
    - "{{ dns_nameservers[1] }}"
  domain: "autobot.internal"

  # Firewall configuration
  ufw:
    enabled: true
    default_incoming: "deny"
    default_outgoing: "allow"

  # SSH configuration
  ssh:
    port: 22
    permit_root_login: false
    password_authentication: false
    pubkey_authentication: true

# ==========================================
# SYSTEM CONFIGURATION
# ==========================================

system:
  timezone: "Europe/Riga"  # Match main machine timezone (EEST, +0300)
  locale: "en_US.UTF-8"

  # Time synchronization configuration
  time_sync:
    enabled: true
    timezone: "Europe/Riga"  # Main machine timezone
    ntp_servers:
      - "0.lv.pool.ntp.org"
      - "1.lv.pool.ntp.org"
      - "2.lv.pool.ntp.org"
      - "3.lv.pool.ntp.org"
    fallback_servers:
      - "time.google.com"
      - "time.cloudflare.com"
      - "pool.ntp.org"
    monitoring_enabled: true
    force_sync_on_deploy: true

  # Package management
  package_update: true
  package_upgrade: true
  unattended_upgrades: true

  # System users
  users:
    - name: "autobot"
      groups: ["sudo", "docker", "autobot"]
      shell: "/bin/bash"
      create_home: true

  # System directories
  directories:
    - "/opt/autobot"
    - "/var/log/autobot"
    - "/var/lib/autobot"
    - "/etc/autobot"
    - "/opt/autobot/backups"

# ==========================================
# SECURITY CONFIGURATION
# ==========================================

security:
  # SSH hardening
  ssh_hardening:
    disable_root_login: true
    disable_password_auth: true
    change_default_port: false
    fail2ban_enabled: true

  # Base firewall rules (common to ALL VMs)
  # Role-specific rules are defined in group_vars/<role>.yml (Issue #894)
  base_firewall_rules:
    # SSH access from gateway (CRITICAL - prevents lockout)
    - rule: allow
      port: 22
      src: "{{ network_gateway }}"
      comment: "SSH from gateway"
    # Allow established connections (stateful firewall)
    # Note: UFW handles this automatically, no explicit rule needed

# ==========================================
# LOGGING CONFIGURATION
# ==========================================

logging:
  # Log aggregation (centralized on backend VM)
  aggregation:
    enabled: true
    server: "{{ infrastructure.hosts.backend }}"
    port: 514
    protocol: "tcp"

  # Log rotation
  rotation:
    enabled: true
    max_size: "100M"
    max_files: 10
    compress: true

  # Log levels
  levels:
    system: "info"
    autobot: "info"
    security: "warning"

# ==========================================
# MONITORING CONFIGURATION
# ==========================================

monitoring:
  enabled: true

  # Health checks
  health_checks:
    enabled: true
    interval: 30
    timeout: 10
    retries: 3

  # Performance monitoring
  performance:
    node_exporter: true
    custom_metrics: true

  # Alerting
  alerts:
    enabled: true
    cpu_threshold: 80
    memory_threshold: 85
    disk_threshold: 90

# ==========================================
# BACKUP CONFIGURATION
# ==========================================

backup:
  enabled: true

  # Backup schedule
  schedule:
    daily: "02:00"
    weekly: "03:00"
    monthly: "04:00"

  # Retention policy
  retention:
    daily: 7
    weekly: 4
    monthly: 12

  # Backup storage
  storage:
    local_path: "/opt/autobot/backups"
    compress: true
    encryption: true

# ==========================================
# SERVICE DEPENDENCIES
# ==========================================

service_dependencies:
  # Define startup order
  startup_order:
    1: ["database"]
    2: ["backend", "aiml"]
    3: ["frontend"]
    4: ["browser"]

  # Health check dependencies
  health_dependencies:
    backend: ["database"]
    frontend: ["backend"]
    aiml: ["database"]
    browser: ["backend"]

# ==========================================
# DEVELOPMENT/DEBUGGING
# ==========================================

debug:
  enabled: false
  log_level: "debug"
  verbose_output: false

# Package repositories
repositories:
  # Add NodeSource for Node.js
  nodejs:
    key_url: "https://deb.nodesource.com/gpgkey/nodesource.gpg.key"
    repo: "deb https://deb.nodesource.com/node_20.x {{ ansible_facts['distribution_release'] }} main"

  # Add Redis repository
  redis:
    key_url: "https://packages.redis.io/gpg"
    repo: "deb https://packages.redis.io/deb {{ ansible_facts['distribution_release'] }} main"

  # Add Intel OpenVINO repository (for AI/ML VMs)
  openvino:
    key_url: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    repo: "deb https://apt.repos.intel.com/openvino/2024 {{ ansible_facts['distribution_release'] }} main"

# ==========================================
# CANONICAL ROLE NAMES (#7053)
# ==========================================
# All node_roles entries MUST use the canonical form below.
# Short-form aliases (e.g. 'backend') are DEPRECATED; new gates and
# inventory entries must use the canonical 'autobot-X' prefix.
#
# Canonical names:
#   autobot-backend         (deploys /opt/autobot/autobot-backend/)
#   autobot-frontend        (deploys /opt/autobot/autobot-frontend/)
#   autobot-ai-stack        (deploys /opt/autobot/autobot-ai-stack/)
#   autobot-npu-worker      (deploys /opt/autobot/autobot-npu-worker/)
#   autobot-browser-worker  (deploys /opt/autobot/autobot-browser-worker/)
#   autobot-tts-worker      (deploys /opt/autobot/autobot-tts-worker/)
#   vnc                     (VNC/display — no autobot- prefix by convention)
#   llm                     (LLM runtime — no autobot- prefix by convention)
#   redis                   (Redis service — no autobot- prefix by convention)
#
# Short-form → canonical mapping (for reference only; authoritative copy
# is also in tools/lint/check_canonical_role_names.py):
_role_aliases:
  backend: autobot-backend
  frontend: autobot-frontend
  ai-stack: autobot-ai-stack
  npu-worker: autobot-npu-worker
  browser: autobot-browser-worker
  browser-service: autobot-browser-worker
  tts-worker: autobot-tts-worker

# ==========================================
# SHARED ROLE-ACTIVE FACTS (#7031, #7053)
# ==========================================
# Per-host booleans answering "is role X deployed on this host?".
# Used by both:
#   - Provision gates (provision-fleet-roles.yml: when: role_X_active)
#   - Cleanup gates  (roles/*/tasks/clean.yml: when: not role_X_active)
#
# Single source of truth — keeps provision and cleanup decisions in sync.
# Each fact mirrors the union of role checks the provision gate uses:
#   1. Short role name in node_roles (e.g. 'backend')     ← DEPRECATED (#7053)
#   2. autobot-prefixed role name in node_roles (e.g. 'autobot-backend') ← CANONICAL
#   3. Inventory group membership (e.g. groups['main'], groups['backend'])
#
# The OR-chain below (short + canonical forms) is kept for backward
# compatibility with any hosts still configured with the short form.
# New inventory entries MUST use the canonical form (see _role_aliases above).
#
# History: prior to #7031, cleanup gates used only check (1), missing
# (2) and (3). Co-located/single-host installs (where install.sh writes
# node_roles=['autobot-backend', 'vnc']) hit the gap and got their dirs
# wiped between deploy and validate.
# #14560: the five facts below (backend, frontend, ai_stack, npu_worker,
# browser) gate provision-fleet-roles.yml tasks that unpack a tree onto the
# host (npm/vite, ChromaDB, OpenVINO, Playwright). #14513/#14552 filtered the
# GROUP branch of these ORs so a node that only *detected* the role no longer
# joins the ansible group -- but node_roles (declared UNION detected) was
# never filtered, so the node_roles branch alone still activated these facts
# for a detected-only node: the frontend role ran `npx vite build` with no
# Node.js installed, the #14552 failure, reached through provisioning instead
# of the update playbook. node_roles_declared (declared roles only) closes
# that branch; it falls back to node_roles wherever it is not stamped
# (static inventories, the synthetic test hosts below), so a role assigned
# through a static inventory keeps activating unchanged. The other facts
# below (redis, vnc, xrdp, llm, tts_worker) deliberately keep raw node_roles
# -- role_tts_worker_active in particular has NO group fallback at all
# (#9965), so node_roles is its only activation path by design. Guarded by
# services/inventory_privileged_node_roles_test.py, which derives the
# five-fact set from inventory_builder._DECLARED_ONLY_GROUPS instead of
# repeating this list, so it fails loud on a sixth privileged fact.
#
# #14594: the fallback above existed because api/setup_wizard.py -- a SECOND
# node_roles producer -- did not stamp node_roles_declared, relying on the
# NodeRole assignment table happening to be declared-only. It now stamps
# node_roles_declared directly from Node.roles (never the NodeRole table), so
# the fallback is dead for every LIVE producer; it stays only for
# hand-authored static inventories (ansible/inventory/slm-nodes.yml). Guarded
# by services/node_roles_declared_producers_test.py (derives every node_roles
# producer and asserts it also stamps node_roles_declared) and
# api/setup_wizard_privileged_node_roles_test.py (end-to-end reproduction
# through the setup-wizard path specifically).
role_backend_active: >-
  {{ ('backend' in (node_roles_declared | default(node_roles | default([])))) or
     ('autobot-backend' in (node_roles_declared | default(node_roles | default([])))) or
     (inventory_hostname in (groups.get('main', []) | default([]))) or
     (inventory_hostname in (groups.get('backend', []) | default([]))) }}

role_frontend_active: >-
  {{ ('frontend' in (node_roles_declared | default(node_roles | default([])))) or
     ('autobot-frontend' in (node_roles_declared | default(node_roles | default([])))) or
     (inventory_hostname in (groups.get('frontend', []) | default([]))) }}

role_ai_stack_active: >-
  {{ ('ai-stack' in (node_roles_declared | default(node_roles | default([])))) or
     ('autobot-ai-stack' in (node_roles_declared | default(node_roles | default([])))) or
     (inventory_hostname in (groups.get('ai_stack', []) | default([]))) or
     (inventory_hostname in (groups.get('aiml', []) | default([]))) }}

role_npu_worker_active: >-
  {{ ('npu-worker' in (node_roles_declared | default(node_roles | default([])))) or
     ('autobot-npu-worker' in (node_roles_declared | default(node_roles | default([])))) or
     (inventory_hostname in (groups.get('npu_worker', []) | default([]))) or
     (inventory_hostname in (groups.get('npu_workers', []) | default([]))) or
     (inventory_hostname in (groups.get('npu', []) | default([]))) }}

role_browser_active: >-
  {{ ('browser' in (node_roles_declared | default(node_roles | default([])))) or
     ('autobot-browser-worker' in (node_roles_declared | default(node_roles | default([])))) or
     ('browser-service' in (node_roles_declared | default(node_roles | default([])))) or
     (inventory_hostname in (groups.get('browser', []) | default([]))) or
     (inventory_hostname in (groups.get('browser_worker', []) | default([]))) }}

role_slm_active: >-
  {{ (inventory_hostname in (groups.get('slm_server', []) | default([]))) or
     (inventory_hostname in (groups.get('slm', []) | default([]))) }}

# #7051: facts for the remaining provision gates so provision-fleet-roles.yml
# can be refactored to use the shared facts uniformly (matches the cleanup-side
# refactor from #7050).
role_redis_active: >-
  {{ ('redis' in (node_roles | default([]))) or
     (inventory_hostname in (groups.get('redis', []) | default([]))) or
     (inventory_hostname in (groups.get('database', []) | default([]))) }}

# #13060: NO groups['main'] / groups['backend'] fallback. Those clauses pulled the
# full desktop stack (tigervnc, x11vnc, novnc, websockify, xfce4) onto every backend
# and main host, including ones that never selected the role. Activation is explicit,
# matching role_xrdp_active below.
# Migration: a backend/main host that relied on implicit activation must now list
# 'vnc' in node_roles (or join vnc_nodes) to keep its desktop provisioned.
# #13870: ChromaDB is a database, so the db stack owns its unit wherever that
# stack is present. It is also the only venv with chromadb installed — the
# ai-stack fallback exists solely for a topology that runs ai-stack alone.
chromadb_service_owner: "{{ 'redis' if (role_redis_active | default(false) | bool) else 'ai-stack' }}"

role_vnc_active: >-
  {{ ('vnc' in (node_roles | default([]))) or
     (inventory_hostname in (groups.get('vnc_nodes', []) | default([]))) }}

role_xrdp_active: >-
  {{ ('xrdp' in (node_roles | default([]))) or
     ('autobot-xrdp' in (node_roles | default([]))) or
     (inventory_hostname in (groups.get('rdp_nodes', []) | default([]))) }}

# #14567: `ai_stack`/`llm_nodes` are declaration-gated deploy targets, so this
# fact reads node_roles_declared (#14560).
#
# #14678: this is the canonical, single tracked definition of the role-active
# facts. It used to have two byte-identical siblings kept in step by a diff
# guard; the guard worked but enforcing three copies was never the fix #7095
# asked for. The test inventory's copy is now generated from this file at CI
# time (never tracked). One tracked sibling remains --
# playbooks/vars/role_active_facts.yml -- because deploy.yml's only two
# callers invoke it with a bare host inventory that has no group_vars to
# discover; see deploy.yml's own comment and check_role_facts_synced.py.
# #14682: `ai_stack` is NOT an LLM signal. It is granted by `chromadb` and
# `tts-worker` as well as by `ai-stack` and `autobot-llm-*`, so gating on it
# meant declaring a vector database or a speech synthesiser ran roles/llm --
# curl https://ollama.ai/install.sh piped to a root shell, a systemd unit, and
# a model pull -- on that host.
#
# `llm_nodes` carries exactly the two tokens that do mean "runs an LLM runtime"
# (`ai-stack`, `autobot-llm-`), so it is the correct signal and the `ai_stack`
# clause is dropped. A node declaring `llm` still matches on the first clause.
role_llm_active: >-
  {{ ('llm' in (node_roles_declared | default(node_roles | default([])))) or
     (inventory_hostname in (groups.get('llm_nodes', []) | default([]))) }}

role_tts_worker_active: >-
  {{ ('tts-worker' in (node_roles | default([]))) or
     ('autobot-tts-worker' in (node_roles | default([]))) }}

# ==========================================
# SLM MANAGER IDENTITY (#9956)
# ==========================================
# The SLM manager node is identified by the `slm_server` inventory group,
# NOT by a hardcoded display name. Renaming the node (operators may use a
# different name) must not break provisioning, CA setup, code-sync or auth.
#
# `slm_manager_inventory_host` resolves the inventory hostname of the SLM
# manager once, from group membership. Playbooks use it for hostvars
# lookups and delegate_to instead of the literal '00-SLM-Manager'.
#
# The DEFAULT node display-name/id is defined exactly once, in the inventory
# (slm-nodes.yml `slm_server` host + its `slm_node_id`). This fact only
# derives it; it does not redefine it.
slm_manager_inventory_host: >-
  {{ (groups.get('slm_server', []) | default([]))[0]
     | default((groups.get('slm', []) | default([]))[0] | default('00-SLM-Manager')) }}

# Resolved node_id of the SLM manager (its inventory slm_node_id, falling
# back to the inventory hostname). Used by playbooks that write/read the SLM
# manager's DB node_id so the literal display name is never assumed.
slm_manager_node_id: >-
  {{ hostvars[slm_manager_inventory_host]['slm_node_id']
     | default(slm_manager_inventory_host) }}
