#
# Auto-Provision Fleet Nodes by Role (#837, #2678)
#
# Provisions each node with common baseline, SLM agent, and
# role-specific configuration in dependency order.
# Works with both static inventory and dynamic/temp inventories.
#
# Usage:
#   cd autobot-slm-backend/ansible
#   ansible-playbook -i inventory/slm-nodes.yml playbooks/provision-fleet-roles.yml
#
# Limit to specific nodes:
#   --limit "frontend,databases"
#
# Tag filtering (--tags) works correctly with include_role because
# every include_role task carries an apply: block that propagates
# the tag set into the included role's own tasks (#2827).
---

# -------------------------------------------------------------------
# Play 0: Pre-flight — sync code_source from GitHub (#3561)
#
# Pulls the latest committed code before any role runs so that
# Ansible role files, templates, and defaults are always current.
# Uses ignore_errors: yes so offline / air-gapped SLMs still work
# (they deploy from whatever code_source is already on disk and get
# a visible warning).  Mirrors the pattern in update-all-nodes.yml.
# -------------------------------------------------------------------
- name: "Play 0 - Pre-flight: Sync code_source from GitHub"
  hosts: slm_server
  gather_facts: false

  vars:
    github_repo: "https://github.com/mrveiss/AutoBot-AI.git"
    git_repo_root: "/opt/autobot/code_source"
    deploy_ref: "Dev_new_gui"

  tasks:
    - name: "[PRE-FLIGHT] Verify code_source exists"
      ansible.builtin.stat:
        path: "{{ git_repo_root }}/.git"
      register: code_source_stat
      tags: [always]

    - name: "[PRE-FLIGHT] Abort if code_source missing"
      ansible.builtin.fail:
        msg: >-
          Code source not found at {{ git_repo_root }}.
          Initialize with: git clone {{ github_repo }} {{ git_repo_root }}
      when: not code_source_stat.stat.exists
      tags: [always]

    - name: "[PRE-FLIGHT] Get code_source commit before sync"
      ansible.builtin.command:
        cmd: git -c safe.directory={{ git_repo_root }} -C {{ git_repo_root }} log -1 --format='%h %s'
      register: pre_sync_commit
      changed_when: false
      tags: [always]

    # Root-owned files in code_source (e.g. from earlier sudo cp) block
    # git reset --hard.  Fix ownership before the pull so force: yes works.
    - name: "[PRE-FLIGHT] Fix code_source ownership so git reset can overwrite"
      ansible.builtin.file:
        path: "{{ git_repo_root }}"
        state: directory
        owner: "{{ lookup('env', 'USER') | default('autobot') }}"
        group: "{{ lookup('env', 'USER') | default('autobot') }}"
        recurse: true
      become: true
      failed_when: false
      changed_when: false
      tags: [always]

    - name: "[PRE-FLIGHT] Fix log directory and file ownership (#4309)"
      block:
        - name: "[PRE-FLIGHT] Ensure log directory exists with correct ownership"
          ansible.builtin.file:
            path: /var/log/autobot
            state: directory
            owner: autobot
            group: autobot
            mode: "0755"
          become: true
          failed_when: false

        - name: "[PRE-FLIGHT] Fix log file ownership so Ansible can write"
          ansible.builtin.file:
            path: "{{ item }}"
            owner: autobot
            group: autobot
            mode: "0644"
          become: true
          failed_when: false
          with_items:
            - /var/log/autobot/ansible.log
            - /var/log/autobot/backend.log
            - /var/log/autobot/backend-error.log
            - /var/log/autobot/celery.log
            - /var/log/autobot/celery-error.log
      tags: [always]

    - name: "[PRE-FLIGHT] Sync latest code from GitHub (if reachable)"
      ansible.builtin.git:
        repo: "{{ github_repo }}"
        dest: "{{ git_repo_root }}"
        version: "{{ deploy_ref }}"
        update: true
        force: true
      ignore_errors: true
      register: github_sync
      tags: [always]

    - name: "[PRE-FLIGHT] Warn if GitHub sync skipped"
      ansible.builtin.debug:
        msg: >-
          WARNING: GitHub sync failed (no internet access?).
          Deploying from existing code_source at {{ git_repo_root }}.
      when: github_sync is failed
      tags: [always]

    - name: "[PRE-FLIGHT] Show code_source age when sync skipped"
      ansible.builtin.command:
        cmd: "git -c safe.directory={{ git_repo_root }} -C {{ git_repo_root }} log -1 --format='Last commit: %h %s (%cr)'"
      register: code_source_age
      changed_when: false
      when: github_sync is failed
      tags: [always]

    - name: "[PRE-FLIGHT] Display code_source age (offline mode)"
      ansible.builtin.debug:
        msg: "Offline deployment — {{ code_source_age.stdout }}"
      when: github_sync is failed
      tags: [always]

    - name: "[PRE-FLIGHT] Get current deploy commit"
      ansible.builtin.command:
        cmd: git -c safe.directory={{ git_repo_root }} -C {{ git_repo_root }} log -1 --format='%h %s'
      register: deploy_info
      changed_when: false
      tags: [always]

    - name: "[PRE-FLIGHT] Count commits advanced during sync"
      ansible.builtin.command:
        cmd: git -c safe.directory={{ git_repo_root }} -C {{ git_repo_root }} rev-list --count {{ pre_sync_commit.stdout.split()[0] }}..HEAD
      register: sync_commit_count
      changed_when: false
      when: github_sync is not failed
      tags: [always]

    - name: "[PRE-FLIGHT] Display sync delta"
      ansible.builtin.debug:
        msg:
          - "=== Pre-flight Code Sync Summary ==="
          - "Was at: {{ pre_sync_commit.stdout }}"
          - "Now at: {{ deploy_info.stdout }}"
          - "Commits advanced: {{ sync_commit_count.stdout | default('0') }}"
      when: github_sync is not failed
      tags: [always]

    - name: "[PRE-FLIGHT] WARN: code_source was significantly behind"
      ansible.builtin.debug:
        msg: >-
          WARNING: code_source advanced {{ sync_commit_count.stdout }} commits during sync.
          Role behavior may have changed significantly. Review recent changes before proceeding.
      when:
        - github_sync is not failed
        - sync_commit_count.stdout | int > 50
      tags: [always]

    - name: "[PRE-FLIGHT] Display deployed commit"
      ansible.builtin.debug:
        msg: "Deploying from commit: {{ deploy_info.stdout }}"
      when: github_sync is not failed
      tags: [always]

    # GH#9284: When GitHub sync fails, validate that stale code_source
    # has critical frontend dependencies (vega fix from 267b2044a).
    # Prevents late build failures with cryptic Rolldown errors.
    - name: "[PRE-FLIGHT] Validate stale code_source has critical dependencies"
      block:
        - name: "[PRE-FLIGHT] Check if package.json has vega dependency"
          ansible.builtin.command:
            cmd: jq -e '.dependencies.vega' {{ git_repo_root }}/autobot-frontend/package.json
          register: vega_check
          changed_when: false
          failed_when: false

        - name: "[PRE-FLIGHT] Abort if code_source missing critical frontend deps"
          ansible.builtin.fail:
            msg: >-
              CRITICAL: Stale code_source missing vega dependency (GH#9284).
              Frontend build will fail at Phase 4b with Rolldown import error.
              Fix: Restore internet connectivity and re-run provisioning to sync latest code from {{ deploy_ref }}.
              Current commit: {{ deploy_info.stdout }}
              Required commit: 267b2044a or later (fix(frontend): add vega as explicit dep)
          when: vega_check.rc != 0
      when: github_sync is failed
      tags: [always]

# -------------------------------------------------------------------
# Phase 0: Shared Dependencies (nginx, python312, nodejs)
# Resolved from ROLE_DEPENDENCIES map via node_dependencies host var.
# -------------------------------------------------------------------
- name: "Provision Phase 0: Shared Dependencies"
  hosts: all
  become: true
  gather_facts: true

  # #7050/#7051 shared role-active facts — see vars/role_active_facts.yml
  # for why this is needed (SLM-triggered provision uses temp inventory
  # without sibling group_vars/, so this loads the facts directly).
  vars_files:
    - vars/role_active_facts.yml

  tasks:
    - name: "Deps | Install nginx"
      ansible.builtin.include_role:
        name: nginx
        apply:
          tags: ['deps', 'nginx']
      when: "'nginx' in (node_dependencies | default([]))"
      tags: ['deps', 'nginx']

    - name: "Deps | Install Python 3.12"
      ansible.builtin.include_role:
        name: python312
        apply:
          tags: ['deps', 'python312']
      when: "'python312' in (node_dependencies | default([]))"
      tags: ['deps', 'python312']

    - name: "Deps | Install Node.js"
      ansible.builtin.include_role:
        name: nodejs
        apply:
          tags: ['deps', 'nodejs']
      when: "'nodejs' in (node_dependencies | default([]))"
      tags: ['deps', 'nodejs']

    # Orphan removals (admin-approved only)
    - name: "Deps | Remove nginx if marked for removal"
      ansible.builtin.apt:
        name: nginx
        state: absent
        purge: true
      when: "'nginx' in (pending_dep_removals | default([]))"
      tags: ['deps', 'removal']

    - name: "Deps | Remove Python 3.12 if marked for removal"
      ansible.builtin.apt:
        name:
          - python3.12
          - python3.12-venv
          - python3.12-dev
        state: absent
        purge: true
      when: "'python312' in (pending_dep_removals | default([]))"
      tags: ['deps', 'removal']

    - name: "Deps | Remove Node.js if marked for removal"
      ansible.builtin.apt:
        name: nodejs
        state: absent
        purge: true
      when: "'nodejs' in (pending_dep_removals | default([]))"
      tags: ['deps', 'removal']

