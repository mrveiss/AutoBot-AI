# -------------------------------------------------------------------
# Phase 6.5: Mark each provisioned node as synced (#7103)
# -------------------------------------------------------------------
# Without this, wizard-provisioned nodes stay code_status=unknown forever
# (the heartbeat handler intentionally ignores heartbeat.code_version per
# #889; node.code_version is only set by /mark-synced). The SLM Code Sync
# UI then misleadingly shows "All nodes are up to date" instead of real
# drift. Mirrors the pattern used by update-all-nodes.yml lines 365-379.
- name: "Provision Phase 6.5: Mark provisioned nodes as synced"
  hosts: all
  gather_facts: false

  vars:
    # #10317: the wizard runs this playbook with a temp inventory that does NOT
    # load group_vars/all.yml, so slm_manager_inventory_host is undefined here.
    # hostvars[<undefined>] is a fatal Jinja error evaluated BEFORE failed_when
    # applies, so it fails the whole provision (failed=1) and blocks the wizard
    # at the provisioning step. Resolve the SLM API host defensively: use the
    # manager's ansible_host when that host is known in hostvars, else loopback.
    _slm_api_host: >-
      {{ hostvars[slm_manager_inventory_host].ansible_host
         if (slm_manager_inventory_host | default('')) in (hostvars | default({}))
         else '127.0.0.1' }}

  tasks:
    - name: "Mark-synced | Get deployed commit (once on controller)"
      ansible.builtin.command:
        cmd: git rev-parse HEAD
        chdir: "{{ playbook_dir }}/../../.."
      register: _provision_commit
      changed_when: false
      failed_when: false
      run_once: true
      delegate_to: localhost
      become: false
      tags: ['mark-synced']

    - name: "Mark-synced | Login to SLM API"
      ansible.builtin.uri:
        url: "https://{{ _slm_api_host }}/slm/api/auth/login"
        method: POST
        body_format: json
        body:
          username: "admin"
          password: "{{ slm_admin_password | default(lookup('env', 'SLM_ADMIN_PASSWORD')) | default('admin', true) }}"
        validate_certs: false
        status_code: [200, 401, 403]
        timeout: 10
      register: _slm_login
      no_log: true
      failed_when: false
      run_once: true
      delegate_to: localhost
      tags: ['mark-synced']

    - name: "Mark-synced | Warn if login failed (skip mark-synced gracefully)"
      ansible.builtin.debug:
        msg: >-
          WARNING: SLM login returned status {{ _slm_login.status }} —
          mark-synced skipped. Code Sync UI will show this node as 'unknown'
          until next 'Update' run. (#7103)
      when: _slm_login.status != 200
      run_once: true
      tags: ['mark-synced']

    - name: "Mark-synced | POST to /api/code-sync/nodes/{{ inventory_hostname }}/mark-synced"
      ansible.builtin.uri:
        url: "https://{{ _slm_api_host }}/slm/api/code-sync/nodes/{{ inventory_hostname }}/mark-synced"
        method: POST
        headers:
          Authorization: "Bearer {{ _slm_login.json.access_token | default('') }}"
          Content-Type: "application/json"
        body: "{}"
        body_format: json
        validate_certs: false
        status_code: [200, 404]
        timeout: 10
      delegate_to: localhost
      ignore_errors: true
      when: _slm_login.status == 200
      tags: ['mark-synced']

# -------------------------------------------------------------------
# Phase 7: Summary
# -------------------------------------------------------------------
- name: "Provision Summary"
  hosts: slm_server
  connection: local
  gather_facts: false

  tasks:
    - name: "Summary | Fleet provisioning complete"
      ansible.builtin.debug:
        msg:
          - "=== Fleet Auto-Provisioning Complete ==="
          - ""
          - "All targeted nodes provisioned with:"
          - "  Phase 1: Common baseline (SSH, packages, users)"
          - "  Phase 2: SLM Agent + Node Exporter"
          - "  Phase 3-6: Role-specific configuration (when matched)"
          - "  Phase 4c: SLM nginx co-location update (when applicable)"
          - "  Phase 5c: TTS Worker (when tts-worker in node_roles)"
          - ""
          - "Roles deployed based on:"
          - "  - node_roles variable (from DB/API)"
          - "  - Inventory group membership (static inventory)"
          - ""
          - "Next: Verify with health-check.yml"
