#
# Auto-Provision Fleet Nodes by Role (#837, #2678)
#
# Provisions each node with common baseline, SLM agent, and
# role-specific configuration in dependency order.
# Works with both static inventory and dynamic/temp inventories.
#
# Usage:
#   cd autobot-slm-backend/ansible
#   ansible-playbook -i inventory/slm-nodes.yml playbooks/provision-fleet-roles.yml
#
# Limit to specific nodes:
#   --limit "02-Frontend,04-Databases"
---

# -------------------------------------------------------------------
# Phase 0: Shared Dependencies (nginx, python312, nodejs)
# Resolved from ROLE_DEPENDENCIES map via node_dependencies host var.
# -------------------------------------------------------------------
- name: "Provision Phase 0: Shared Dependencies"
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: "Deps | Install nginx"
      ansible.builtin.include_role:
        name: nginx
      when: "'nginx' in (node_dependencies | default([]))"
      tags: ['deps', 'nginx']

    - name: "Deps | Install Python 3.12"
      ansible.builtin.include_role:
        name: python312
      when: "'python312' in (node_dependencies | default([]))"
      tags: ['deps', 'python312']

    - name: "Deps | Install Node.js"
      ansible.builtin.include_role:
        name: nodejs
      when: "'nodejs' in (node_dependencies | default([]))"
      tags: ['deps', 'nodejs']

    # Orphan removals (admin-approved only)
    - name: "Deps | Remove nginx if marked for removal"
      ansible.builtin.apt:
        name: nginx
        state: absent
        purge: true
      when: "'nginx' in (pending_dep_removals | default([]))"
      tags: ['deps', 'removal']

    - name: "Deps | Remove Python 3.12 if marked for removal"
      ansible.builtin.apt:
        name:
          - python3.12
          - python3.12-venv
          - python3.12-dev
        state: absent
        purge: true
      when: "'python312' in (pending_dep_removals | default([]))"
      tags: ['deps', 'removal']

    - name: "Deps | Remove Node.js if marked for removal"
      ansible.builtin.apt:
        name: nodejs
        state: absent
        purge: true
      when: "'nodejs' in (pending_dep_removals | default([]))"
      tags: ['deps', 'removal']

# -------------------------------------------------------------------
# Phase 1: Common baseline on ALL target nodes
# -------------------------------------------------------------------
- name: "Provision Phase 1: Common Baseline"
  hosts: all
  become: true
  gather_facts: true
  serial: "100%"

  tasks:
    - name: "Common | Apply common role to all fleet nodes"
      ansible.builtin.include_role:
        name: common
      tags: ['common', 'provision']

# -------------------------------------------------------------------
# Phase 2: SLM Agent on ALL target nodes
# -------------------------------------------------------------------
- name: "Provision Phase 2: SLM Agent"
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: "Agent | Deploy SLM agent"
      ansible.builtin.import_role:
        name: slm_agent
      tags: ['slm-agent', 'slm_agent', 'provision']

# -------------------------------------------------------------------
# Phase 3: Data layer (Redis, PostgreSQL)
# -------------------------------------------------------------------
- name: "Provision Phase 3: Data Layer"
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: "Data | Deploy Redis role"
      ansible.builtin.import_role:
        name: redis
      when: >-
        'redis' in (node_roles | default([])) or
        inventory_hostname in groups.get('redis', []) or
        inventory_hostname in groups.get('database', [])
      tags: ['redis', 'provision']

# -------------------------------------------------------------------
# Phase 4a: Backend
# -------------------------------------------------------------------
- name: "Provision Phase 4a: Backend"
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: "App | Deploy backend role"
      ansible.builtin.include_role:
        name: backend
      when: >-
        'backend' in (node_roles | default([])) or
        'autobot-backend' in (node_roles | default([])) or
        inventory_hostname in groups.get('main', []) or
        inventory_hostname in groups.get('backend', [])
      tags: ['backend', 'provision']

    - name: "App | Deploy VNC role"
      ansible.builtin.include_role:
        name: vnc
      when: >-
        'vnc' in (node_roles | default([])) or
        inventory_hostname in groups.get('main', []) or
        inventory_hostname in groups.get('backend', [])
      tags: ['vnc', 'provision']

# -------------------------------------------------------------------
# Phase 4b: Frontend
# -------------------------------------------------------------------
- name: "Provision Phase 4b: Frontend"
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: "App | Deploy frontend role"
      ansible.builtin.include_role:
        name: frontend
      when: >-
        'frontend' in (node_roles | default([])) or
        'autobot-frontend' in (node_roles | default([])) or
        inventory_hostname in groups.get('frontend', [])
      tags: ['frontend', 'provision']

# -------------------------------------------------------------------
# Phase 5a: AI Stack
# -------------------------------------------------------------------
- name: "Provision Phase 5a: AI Stack"
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: "AI | Deploy AI stack role"
      ansible.builtin.include_role:
        name: ai-stack
      when: >-
        'ai-stack' in (node_roles | default([])) or
        'autobot-ai-stack' in (node_roles | default([])) or
        inventory_hostname in groups.get('ai_stack', []) or
        inventory_hostname in groups.get('aiml', [])
      tags: ['ai-stack', 'provision']

    - name: "AI | Deploy LLM role"
      ansible.builtin.include_role:
        name: llm
      when: >-
        'llm' in (node_roles | default([])) or
        inventory_hostname in groups.get('ai_stack', []) or
        inventory_hostname in groups.get('llm_nodes', [])
      tags: ['llm', 'provision']

# -------------------------------------------------------------------
# Phase 5b: NPU Worker
# -------------------------------------------------------------------
- name: "Provision Phase 5b: NPU Worker"
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: "AI | Deploy NPU worker role"
      ansible.builtin.include_role:
        name: npu-worker
      when: >-
        'npu-worker' in (node_roles | default([])) or
        'autobot-npu-worker' in (node_roles | default([])) or
        inventory_hostname in groups.get('npu_worker', []) or
        inventory_hostname in groups.get('npu', [])
      tags: ['npu-worker', 'provision']

# -------------------------------------------------------------------
# Phase 5c: Standalone LLM nodes (GPU-aware — #1040)
# -------------------------------------------------------------------
- name: "Provision Phase 5c: LLM Nodes"
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: "LLM | Deploy LLM role (GPU auto-detected)"
      ansible.builtin.include_role:
        name: llm
      when: >-
        inventory_hostname in groups.get('llm_nodes', [])
      tags: ['llm', 'provision']

# -------------------------------------------------------------------
# Phase 6: Browser Automation
# -------------------------------------------------------------------
- name: "Provision Phase 6: Browser Automation"
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: "Auto | Deploy browser role"
      ansible.builtin.include_role:
        name: browser
      when: >-
        'browser' in (node_roles | default([])) or
        'autobot-browser-worker' in (node_roles | default([])) or
        'browser-service' in (node_roles | default([])) or
        inventory_hostname in groups.get('browser_worker', []) or
        inventory_hostname in groups.get('browser', [])
      tags: ['browser', 'provision']

# -------------------------------------------------------------------
# Phase 7: Summary
# -------------------------------------------------------------------
- name: "Provision Summary"
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: "Summary | Fleet provisioning complete"
      ansible.builtin.debug:
        msg:
          - "=== Fleet Auto-Provisioning Complete ==="
          - ""
          - "All targeted nodes provisioned with:"
          - "  Phase 1: Common baseline (SSH, packages, users)"
          - "  Phase 2: SLM Agent + Node Exporter"
          - "  Phase 3-6: Role-specific configuration (when matched)"
          - ""
          - "Roles deployed based on:"
          - "  - node_roles variable (from DB/API)"
          - "  - Inventory group membership (static inventory)"
          - ""
          - "Next: Verify with health-check.yml"
