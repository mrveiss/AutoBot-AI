#
# Seed Fleet Nodes into SLM Database
#
# Registers the SLM manager and any DISTINCT-IP fleet machines via the SLM
# REST API so heartbeats are accepted and the fleet dashboard shows all hosts.
#
# #10110: the legacy NN-Name inventory template (`00-SLM-Manager`,
# `01-Backend`, ...) is NO LONGER the source of node identity. On a co-located
# install every NN-Name host collapses to the SLM manager's own address, so
# seeding them all would mint phantom duplicate records pointing at one machine.
# The DB node registry is the single source of truth: the SLM manager is seeded
# here (the one well-known identity), and every other co-located component is
# owned by runtime self-registration (`_ensure_local_node` + agent enroll),
# which mints real `uuid4()[:8]` node_ids. On a genuine multi-host fleet each
# template host has a distinct real IP and is still seeded normally.
#
# Prerequisites:
#   - SLM backend must be running on the SLM Manager node
#   - Default admin user must exist (auto-created on first boot)
#
# Usage:
#   cd autobot-slm-backend/ansible
#   ansible-playbook -i inventory/slm-nodes.yml playbooks/seed-fleet-nodes.yml
#
# Override credentials:
#   -e "slm_admin_user=myuser" -e "slm_admin_password=mypass"
#
# Override API URL:
#   -e "slm_api_url=https://<slm-host>/slm"
---
- name: Seed Fleet Nodes into SLM Database
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # #9953: /slm prefix is the UNIVERSAL SLM API path — served in both
    # co-located and dedicated nginx modes (#3268). The bare /api/ path routes
    # to the USER backend on co-located hosts, so SLM auth there returns 401.
    slm_api_url: "https://{{ hostvars[slm_manager_inventory_host]['ansible_host'] | default('127.0.0.1') }}/slm"
    slm_admin_user: "admin"
    # Password comes from hostvars (set by slm_manager role) or override
    slm_admin_password: >-
      {{ hostvars[slm_manager_inventory_host]['slm_admin_password']
         | default(lookup('env', 'SLM_ADMIN_PASSWORD'))
         | default('admin') }}

    # #9956: SLM manager roles are looked up by `slm_server` group membership
    # (see register-loop below), so its entry is NOT keyed by display name.
    slm_manager_roles:
      - autobot-slm-agent
      - autobot-slm-database
      - autobot-monitoring

    # #10110: the SLM manager's own inventory address. Any other NN-Name host
    # that resolves to this same address is a co-located collapse, not a real
    # distinct machine, and is left to runtime self-registration.
    slm_manager_ip: "{{ hostvars[slm_manager_inventory_host]['ansible_host'] | default('127.0.0.1') }}"
    _loopback_ips:
      - "127.0.0.1"
      - "localhost"
      - "::1"


  tasks:
    - name: "Authenticate with SLM API"
      ansible.builtin.uri:
        url: "{{ slm_api_url }}/api/auth/login"
        method: POST
        body_format: json
        body:
          username: "{{ slm_admin_user }}"
          password: "{{ slm_admin_password | trim }}"
        status_code: 200
        validate_certs: false
      register: auth_result
      retries: 5
      delay: 5
      until: auth_result.status == 200

    - name: "Register fleet nodes"
      ansible.builtin.uri:
        url: "{{ slm_api_url }}/api/nodes"
        method: POST
        headers:
          Authorization: "Bearer {{ auth_result.json.access_token }}"
        body_format: json
        body:
          hostname: "{{ item }}"
          ip_address: "{{ hostvars[item].ansible_host }}"
          node_id: "{{ hostvars[item].slm_node_id }}"
          # #10110: roles come from the node's own registration (registry-driven);
          # the SLM manager gets its fixed role set, any other seeded host gets
          # the slm-agent baseline and self-registers its real roles afterward.
          roles: >-
            {{ slm_manager_roles
               if item in (groups.get('slm_server', []) | default([]))
               else ['slm-agent'] }}
          ssh_user: "{{ hostvars[item].ansible_user | default('autobot') }}"
          ssh_port: 22
          auth_method: "key"
          import_existing: true
          auto_enroll: false
        # 201 = created, 400 = already exists (idempotent)
        status_code: [201, 400]
        validate_certs: false
      # #10110: seed the SLM manager always; skip any other NN-Name host that
      # collapses to a loopback or to the SLM manager's own address — that is a
      # co-located component owned by runtime self-registration, not a distinct
      # machine. Genuine multi-host fleet members have a distinct real IP and
      # are still seeded.
      when: >-
        item in (groups.get('slm_server', []) | default([]))
        or (hostvars[item].ansible_host not in _loopback_ips
            and hostvars[item].ansible_host != slm_manager_ip)
      loop: "{{ groups['slm_nodes'] }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item].ansible_host }})"
      register: register_results

    - name: "Registration summary"
      ansible.builtin.debug:
        msg: >-
          {{ item.item }} ({{ hostvars[item.item].ansible_host }}):
          {{ 'SKIPPED (co-located — runtime-registered)'
             if (item.skipped | default(false))
             else ('REGISTERED' if item.status == 201 else 'ALREADY EXISTS') }}
      loop: "{{ register_results.results }}"
      loop_control:
        label: "{{ item.item }}"
