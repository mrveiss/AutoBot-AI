---
# Fix Backend Environment Configuration
# Issue #893: Corrects PYTHONPATH, .env paths, and Python venv
#
# Usage from SLM server:
#   ansible-playbook playbooks/fix-backend-environment.yml

- name: Fix Backend Environment Configuration
  hosts: autobot-backend
  become: true
  gather_facts: true

  vars:
    # #13539/B3: this play renders roles/backend/templates/autobot-backend.service.j2
    # directly (below), which derives the deploy root as
    # `backend_install_dir | dirname` -- so backend_install_dir must carry the
    # SAME meaning it has in roles/backend/defaults/main.yml (the component
    # dir), not the deploy root. backend_deployed_root holds the root under
    # its own name for every task below that genuinely wants it.
    backend_deployed_root: /opt/autobot
    backend_code_dir: "{{ backend_deployed_root }}/autobot-backend"
    backend_install_dir: "{{ backend_code_dir }}"
    backend_log_dir: /var/log/autobot
    backend_user: autobot
    backend_group: autobot
    backend_host: "0.0.0.0"
    backend_port: 8443
    backend_workers: 4

  tasks:
    # ============================================================
    # Phase 1: Verify Python venv
    # ============================================================

    - name: Check if Python venv exists
      stat:
        path: "{{ backend_code_dir }}/venv/bin/python"
      register: venv_python

    - name: Verify uvicorn in venv
      stat:
        path: "{{ backend_code_dir }}/venv/bin/uvicorn"
      register: uvicorn_binary
      when: venv_python.stat.exists

    - name: Fail if venv missing
      fail:
        msg: >-
          Python venv not found at {{ backend_code_dir }}/venv.
          Run backend role deployment first (Issue #1898: deadsnakes PPA + python3.14 -m venv).
      when: not venv_python.stat.exists or not uvicorn_binary.stat.exists

    # ============================================================
    # Phase 2: Verify .env File Location
    # ============================================================

    # #15560/2: the canonical .env location is whatever
    # roles/backend/templates/autobot-backend.service.j2 renders into its
    # `EnvironmentFile=` line -- `{{ backend_code_dir }}/.env`. This play used to
    # render that template and then rewrite the line to
    # `{{ backend_deployed_root }}/.env` with lineinfile, so one setting had two
    # writers that disagreed. The template is the canonical writer, so these
    # checks report against the location it names.
    - name: Check for .env in the canonical location
      stat:
        path: "{{ backend_code_dir }}/.env"
      register: env_code_dir

    - name: Check for a stray .env at the deploy root
      stat:
        path: "{{ backend_deployed_root }}/.env"
      register: env_deployed_root

    - name: Display .env location findings
      debug:
        msg: |
          .env in {{ backend_code_dir }} (canonical): {{ env_code_dir.stat.exists }}
          .env in {{ backend_deployed_root }} (stray): {{ env_deployed_root.stat.exists }}

    - name: Warn if the canonical .env is missing
      debug:
        msg: >-
          ⚠️  WARNING: no .env at {{ backend_code_dir }}/.env — that is where the
          unit's EnvironmentFile= points, so the service would start with none.
      when: not env_code_dir.stat.exists

    # ============================================================
    # Phase 3: Update systemd Service Configuration
    # ============================================================
    # #15560/2: the unit is rendered from the template and NOT edited afterwards.
    # Two lineinfile tasks used to rewrite `EnvironmentFile=` and
    # `Environment="PYTHONPATH=..."` a few lines after the template had already
    # written both, which is how this play came to be producing
    # `PYTHONPATH=...:/opt/autobot_shared` -- a directory that does not exist
    # (#13539/B3). #15559 fixed the rendered value; the hand-written duplicate
    # was the second, independent writer of the same setting, and it was a
    # leftover from before the template covered it. Later phases read the value
    # back out of the rendered unit rather than restating it.

    - name: Deploy corrected systemd service file
      template:
        src: ../roles/backend/templates/autobot-backend.service.j2
        dest: /etc/systemd/system/autobot-backend.service
        owner: root
        group: root
        mode: '0644'
      notify: reload systemd

    - name: Read back the rendered systemd unit (#15560)
      ansible.builtin.slurp:
        src: /etc/systemd/system/autobot-backend.service
      register: backend_unit_rendered

    - name: Derive the unit's PYTHONPATH from the rendered unit (#15560)
      ansible.builtin.set_fact:
        backend_unit_pythonpath: >-
          {{ ((backend_unit_rendered.content | b64decode)
              | regex_search('^Environment="PYTHONPATH=([^"]*)"', '\1', multiline=True)
              | default([], true)) | first | default('') }}

    - name: Fail if the rendered unit carries no PYTHONPATH (#15560)
      fail:
        msg: >-
          The rendered autobot-backend.service has no
          Environment="PYTHONPATH=..." line.
          roles/backend/templates/autobot-backend.service.j2 is the only writer
          of that setting, so an absent one means the template changed shape —
          this play must not paper over it with a second writer of its own.
      when: backend_unit_pythonpath | length == 0

    # ============================================================
    # Phase 4: Verify Backend Directory Structure
    # ============================================================

    - name: Ensure main.py exists
      stat:
        path: "{{ backend_code_dir }}/main.py"
      register: main_py

    - name: Fail if main.py missing
      fail:
        msg: "main.py not found at {{ backend_code_dir }}/main.py"
      when: not main_py.stat.exists

    - name: Ensure log directory exists
      file:
        path: "{{ backend_log_dir }}"
        state: directory
        owner: "{{ backend_user }}"
        group: "{{ backend_group }}"
        mode: '0755'

    # ============================================================
    # Phase 5: Test Configuration
    # ============================================================

    - name: Test Python can import main module
      shell: |
        cd {{ backend_code_dir }}
        export PYTHONPATH={{ backend_unit_pythonpath }}
        {{ backend_code_dir }}/venv/bin/python -c "
        import sys
        print('PYTHONPATH:', sys.path[:5])
        try:
            import main
            print('SUCCESS: main.py imports correctly')
        except Exception as e:
            print('ERROR:', str(e))
            import traceback
            traceback.print_exc()
            exit(1)
        "
      become_user: autobot
      register: import_test
      failed_when: import_test.rc != 0

    - name: Display import test results
      debug:
        msg: "{{ import_test.stdout_lines }}"

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: true

  post_tasks:
    - name: Restart backend service
      systemd:
        name: autobot-backend
        state: restarted

    - name: Wait for service to start
      pause:
        seconds: 5

    - name: Check service status
      command: systemctl status autobot-backend --no-pager
      register: service_status
      failed_when: false

    - name: Display service status
      debug:
        msg: "{{ service_status.stdout_lines }}"

    - name: Display next steps
      debug:
        msg: |
          ====================================================
          Environment configuration fixed!

          Changes applied:
          - .env path: {{ backend_code_dir }}/.env
          - PYTHONPATH: {{ backend_unit_pythonpath }}
          - Python venv: {{ backend_code_dir }}/venv (deadsnakes python3.14)

          Next steps:
          1. Monitor: journalctl -u autobot-backend -f
          2. Test: curl http://localhost:8443/api/health
          3. If issues persist, check imports: ansible-playbook diagnose-backend-crash.yml
          ====================================================
