---
# AutoBot - Update All Fleet Nodes (Git-Based Deploy)
# Deploys committed code from a specific branch to all fleet VMs.
# Pulls directly from GitHub to /opt/autobot/code_source on the SLM manager,
# then uses git archive to create deploy tarballs. (#1170)
#
# Runs FROM: SLM Manager host (see inventory) — NOT from the dev machine.
#
# Usage:
#   ansible-playbook playbooks/update-all-nodes.yml
#   ansible-playbook playbooks/update-all-nodes.yml -e deploy_ref=main
#   ansible-playbook playbooks/update-all-nodes.yml -e skip_branch_check=true
#   ansible-playbook playbooks/update-all-nodes.yml --skip-tags restart   # code-only, no restarts
#
# Tags:
#   restart              - all service restart tasks (skip for code-only deploys)
#   deps                 - pip install / npm ci tasks (skip for code-only deploys) (#1603)
#   backend              - autobot-backend deploy + restart tasks
#   frontend             - autobot-frontend deploy + build + nginx restart tasks
#   npu, npu-worker      - NPU worker deploy + restart tasks
#   browser, browser-worker - browser worker deploy + restart tasks
#   slm, slm-backend, slm-frontend - SLM node deploy + build + restart tasks
#   slm-agent            - slm_agent role redeploy (code + secrets + restart) (#11480)
#   shared               - autobot_shared deploy tasks (all nodes)
#
# NOTE (#11480): the slm-agent redeploy imports the slm_agent role, whose restart
# runs via a handler and whose pip install is tagged `packages` (not `deps`).
# So `--skip-tags restart` / `--skip-tags deps` do NOT skip the agent restart or
# its dep install — a code-only push still restarts the agent. Use
# `--skip-tags slm-agent` to exclude agent redeploy entirely.

# =============================================================================
# PLAY 0: Pre-flight Git Safety Check & Create Deploy Archives
# =============================================================================
- name: "Play 0 - Pre-flight & Build Archives"
  hosts: localhost
  gather_facts: false

  vars:
    github_repo: "https://github.com/mrveiss/AutoBot-AI.git"
    git_repo_root: "/opt/autobot/code_source"
    deploy_ref: "Dev_new_gui"
    allowed_branches:
      - Dev_new_gui
      - main
    skip_branch_check: false
    deploy_tmp: "/tmp/autobot-deploy"

  tasks:
    - name: "[PRE-FLIGHT] Verify required host groups exist"
      fail:
        msg: >-
          Required groups 'slm_server' and 'infrastructure' not found.
          Use: ansible-playbook -i inventory/slm-nodes.yml playbooks/update-all-nodes.yml
          Or run against production.yml which now includes these group aliases.
      when: >-
        (groups['slm_server'] | default([]) | length == 0) or
        (groups['infrastructure'] | default([]) | length == 0)

    - name: "[PRE-FLIGHT] Sync code from GitHub"
      git:
        repo: "{{ github_repo }}"
        dest: "{{ git_repo_root }}"
        version: "{{ deploy_ref }}"
        force: true
        depth: 1

    - name: "[PRE-FLIGHT] Get current git branch"
      command: git -c safe.directory={{ git_repo_root }} -C {{ git_repo_root }} branch --show-current
      register: git_branch
      changed_when: false

    - name: "[PRE-FLIGHT] Resolve deploy ref to commit"
      command: >-
        git -c safe.directory={{ git_repo_root }} -C {{ git_repo_root }}
        log -1 --format='%h %s' {{ deploy_ref }}
      register: deploy_info
      changed_when: false

    - name: "[PRE-FLIGHT] Check for uncommitted changes"
      command: git -c safe.directory={{ git_repo_root }} -C {{ git_repo_root }} status --porcelain
      register: git_dirty
      changed_when: false

    - name: "[PRE-FLIGHT] Display deployment summary"
      debug:
        msg:
          - "======================================================="
          - "  AutoBot Fleet Code Update (GitHub Pull)"
          - "======================================================="
          - ""
          - "  Source:  {{ github_repo }}"
          - "  Branch:  {{ deploy_ref }}"
          - "  Commit:  {{ deploy_info.stdout }}"
          - "  Method:  git pull → git archive"
          - ""

    - name: "[PRE-FLIGHT] ABORT - Not on allowed branch"
      fail:
        msg: >-
          Branch '{{ deploy_ref }}' not in allowed list
          ({{ allowed_branches | join(', ') }}).
          Override: -e skip_branch_check=true
      when:
        - not skip_branch_check | bool
        - deploy_ref not in allowed_branches

    - name: "[PRE-FLIGHT] Create deploy archive directory"
      file:
        path: "{{ deploy_tmp }}"
        state: directory
        mode: '0755'

    - name: "[PRE-FLIGHT] Create component archives"
      shell: >-
        git -c safe.directory={{ git_repo_root }} -C {{ git_repo_root }} archive {{ deploy_ref }}
        -- {{ item.path }} | gzip > {{ deploy_tmp }}/{{ item.name }}.tar.gz
      loop:
        - { name: slm-backend, path: autobot-slm-backend/ }
        - { name: slm-frontend, path: autobot-slm-frontend/ }
        - { name: shared, path: autobot_shared/ }
        - { name: backend, path: autobot-backend/ }
        - { name: frontend, path: autobot-frontend/ }
        - { name: npu-worker, path: autobot-npu-worker/ }
        - { name: browser-worker, path: autobot-browser-worker/ }
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    # AI Stack lives under a different path shape (nested docker dir), so it
    # keeps its own archive task (ported from the retired top-level playbook,
    # #11424 — the aiml deploy must not be lost in the canonical consolidation).
    - name: "[PRE-FLIGHT] Create AI Stack archive"
      shell: >-
        git -c safe.directory={{ git_repo_root }} -C {{ git_repo_root }} archive {{ deploy_ref }}
        -- autobot-infrastructure/shared/docker/ai-stack/
        | gzip > {{ deploy_tmp }}/ai-stack.tar.gz
      changed_when: true
      tags: [always, ai-stack, aiml]

    - name: "[PRE-FLIGHT] Archives ready"
      debug:
        msg: "8 deploy archives created from {{ deploy_ref }} ({{ deploy_info.stdout }})"

    # --- Dependency change detection (#1603) ---
    - name: "[PRE-FLIGHT] Get previous commit (before pull)"
      command: >-
        git -c safe.directory={{ git_repo_root }} -C {{ git_repo_root }} rev-parse HEAD~1
      register: prev_commit
      changed_when: false
      failed_when: false

    - name: "[PRE-FLIGHT] Check if Python deps changed"
      shell: >-
        git -c safe.directory={{ git_repo_root }} -C {{ git_repo_root }} diff --name-only
        {{ prev_commit.stdout | default('HEAD') }} HEAD
        -- '*/requirements.txt' 'autobot_shared/pyproject.toml'
      register: python_deps_diff
      changed_when: false
      failed_when: false

    - name: "[PRE-FLIGHT] Check if Node.js deps changed"
      shell: >-
        git -c safe.directory={{ git_repo_root }} -C {{ git_repo_root }} diff --name-only
        {{ prev_commit.stdout | default('HEAD') }} HEAD
        -- '*/package.json' '*/package-lock.json'
      register: node_deps_diff
      changed_when: false
      failed_when: false

    - name: "[PRE-FLIGHT] Set dependency change flags"
      set_fact:
        python_deps_changed: "{{ python_deps_diff.stdout | default('') | length > 0 }}"
        node_deps_changed: "{{ node_deps_diff.stdout | default('') | length > 0 }}"

    - name: "[PRE-FLIGHT] Display dependency change status"
      debug:
        msg:
          - "  Python deps changed: {{ python_deps_changed }}"
          - "  Node.js deps changed: {{ node_deps_changed }}"
          - "  Changed files: {{ (python_deps_diff.stdout_lines | default([])) + (node_deps_diff.stdout_lines | default([])) }}"

    - name: "[PRE-FLIGHT] Get full commit hash"
      command: git -c safe.directory={{ git_repo_root }} -C {{ git_repo_root }} log -1 --format='%H'
      register: deploy_commit_full
      changed_when: false

    - name: "[PRE-FLIGHT] Get commit subject"
      command: git -c safe.directory={{ git_repo_root }} -C {{ git_repo_root }} log -1 --format='%s'
      register: deploy_commit_subject
      changed_when: false

    - name: "[PRE-FLIGHT] Notify SLM of new commit"
      uri:
        url: "https://localhost/api/code-source/notify"
        method: POST
        body_format: json
        body:
          node_id: "{{ slm_manager_node_id }}"
          commit: "{{ deploy_commit_full.stdout }}"
          branch: "{{ deploy_ref }}"
          message: "{{ deploy_commit_subject.stdout }}"
          is_code_source: true
          changed_roles: []
        validate_certs: false
        status_code: [200, 404]
      ignore_errors: true

# =============================================================================
# PLAY 1: Update SLM Server First
# =============================================================================
- name: "Play 1 - Update SLM Server First"
  hosts: slm_server
  gather_facts: false
  serial: 1

  vars:
    deploy_tmp: "/tmp/autobot-deploy"

  tasks:
    - name: "[PLAY 1] Starting SLM Server Update"
      debug:
        msg:
          - "======================================================="
          - "  PLAY 1: SLM Server Update (git archive)"
          - "======================================================="
          - "  Target: {{ inventory_hostname }} ({{ ansible_host }})"

    - name: "[PLAY 1] SLM | Deploy autobot-slm-backend"
      unarchive:
        src: "{{ deploy_tmp }}/slm-backend.tar.gz"
        dest: /opt/autobot/
      become: true
      tags: [slm, slm-backend]

    - name: "[PLAY 1] SLM | Deploy autobot-slm-frontend"
      unarchive:
        src: "{{ deploy_tmp }}/slm-frontend.tar.gz"
        dest: /opt/autobot/
      become: true
      tags: [slm, slm-frontend]

    - name: "[PLAY 1] SLM | Deploy autobot_shared"
      unarchive:
        src: "{{ deploy_tmp }}/shared.tar.gz"
        dest: /opt/autobot/
      become: true
      tags: [slm, shared]

    - name: "[PLAY 1] SLM | Fix ownership (unarchive runs as root)"
      file:
        path: "/opt/autobot/{{ item }}"
        owner: autobot
        group: autobot
        recurse: true
      become: true
      loop:
        - autobot-slm-backend
        - autobot-slm-frontend
        - autobot_shared
      tags: [slm]

    # #12223 (#12202): the self-update path deploys the SLM backend via the
    # unarchive above and never runs the slm_manager role — where the #12202
    # marker-write lives — so without this the .deployed_commit marker is never
    # written and _get_slm_deployed_commit() always returns None (self-update
    # always fires, never skips-when-current). Record the just-deployed commit
    # here too, mirroring the slm_manager role, so the skip-check works.
    - name: "[PLAY 1] SLM | Record deployed commit marker (#12223, #12202)"
      ansible.builtin.shell:
        cmd: >-
          git -C {{ code_source_dir | default('/opt/autobot/code_source') }} rev-parse HEAD
          > /opt/autobot/autobot-slm-backend/.deployed_commit
      changed_when: false
      become: true
      tags: [slm]

    - name: "[PLAY 1] SLM | Own the deployed-commit marker (#12223)"
      file:
        path: /opt/autobot/autobot-slm-backend/.deployed_commit
        owner: autobot
        group: autobot
        mode: "0644"
      become: true
      tags: [slm]

    # Issue #9225: slm-agent needs autobot_shared in PYTHONPATH
    - name: "[PLAY 1] SLM Agent | Create autobot_shared symlink for agent imports"
      ansible.builtin.file:
        src: /opt/autobot/autobot_shared
        dest: /opt/autobot/autobot-slm-agent/autobot_shared
        state: link
        force: true
        owner: autobot
        group: autobot
      become: true
      tags: [slm, slm-agent, shared]

    # Issue #9565: slm-backend needs autobot_shared in PYTHONPATH
    - name: "[PLAY 1] SLM Backend | Create autobot_shared symlink for backend imports"
      ansible.builtin.file:
        src: /opt/autobot/autobot_shared
        dest: /opt/autobot/autobot-slm-backend/autobot_shared
        state: link
        force: true
        owner: autobot
        group: autobot
      become: true
      tags: [slm, slm-backend, shared]

    # #12907/#12959: same role-owned reconciliation as PLAY 2, for the SLM
    # prefix. db-credentials.env is shared between both prefixes, and the parse
    # below takes the FIRST `DATABASE_URL=` match — so a pre-#12224 unmarked
    # duplicate feeds the migration a dead URL. Strip them before reading.
    - name: "[PLAY 1] SLM | Reconcile the SLM credential store (#12907, #12959)"
      ansible.builtin.include_role:
        name: postgresql
        tasks_from: credentials_reconcile
        apply:
          become: true
      vars:
        db_env_prefix: SLM
      tags: [slm, slm-backend, credentials]

    # --- SLM custom migrations (#1630) ---
    - name: "[PLAY 1] SLM | Load db credentials for migration (#2293)"
      slurp:
        src: /etc/autobot/db-credentials.env
      register: db_creds_file
      become: true
      failed_when: false
      tags: [slm, slm-backend, migrate]

    - name: "[PLAY 1] SLM | Parse DATABASE_URL from credentials (#2293)"
      set_fact:
        slm_db_url: "{{ (db_creds_file.content | b64decode | regex_search('DATABASE_URL=(.+)', '\\1'))[0] | default('') }}"
      when: db_creds_file is succeeded
      failed_when: false
      tags: [slm, slm-backend, migrate]

    - name: "[PLAY 1] SLM | Run database migrations (#1630)"
      command:
        cmd: >-
          /opt/autobot/autobot-slm-backend/venv/bin/python
          -m migrations.runner
        chdir: /opt/autobot/autobot-slm-backend
      become: true
      become_user: autobot
      environment:
        PYTHONPATH: /opt/autobot/autobot-slm-backend
        DATABASE_URL: "{{ slm_db_url | default('') }}"
      register: slm_migration_result
      failed_when: false
      tags: [slm, slm-backend, migrate]

    - name: "[PLAY 1] SLM | Warn if migration failed (#1630)"
      debug:
        msg: "WARNING: SLM migration failed: {{ slm_migration_result.stderr | default('') }}"
      when:
        - slm_migration_result is defined
        - slm_migration_result.rc | default(0) != 0
      tags: [slm, slm-backend, migrate]

    # --- Dependency install (#1603) ---
    - name: "[PLAY 1] SLM | Install Python dependencies"
      command:
        cmd: /opt/autobot/autobot-slm-backend/venv/bin/pip install
             -r /opt/autobot/autobot-slm-backend/requirements.txt
             --quiet --timeout 120
      become: true
      become_user: autobot
      environment:
        PIP_DEFAULT_TIMEOUT: "120"
      timeout: 600  # Issue #2835: prevent indefinite hang on dependency resolution conflicts
      when: hostvars['localhost']['python_deps_changed'] | bool
      register: slm_pip_install
      tags: [slm, slm-backend, deps]

    - name: "[PLAY 1] SLM | Install Node.js dependencies"
      command:
        cmd: npm ci --ignore-scripts
        chdir: /opt/autobot/autobot-slm-frontend
      become: true
      become_user: autobot
      when: hostvars['localhost']['node_deps_changed'] | bool
      register: slm_npm_install
      tags: [slm, slm-frontend, deps]

    - name: "[PLAY 1] SLM | Rebuild frontend production build"
      command:
        # build:slm = "VITE_API_URL=/slm vite build" — the SLM frontend is served
        # under /slm, so a plain `npm run build` bakes in the wrong API base and
        # the SLM dashboard calls the wrong endpoints (#9563, #9710). Matches the
        # canonical ansible/update-all-nodes.yml.
        cmd: npm run build:slm
        chdir: /opt/autobot/autobot-slm-frontend
      register: slm_build
      tags: [slm, slm-frontend]

    # #11480/#11492: redeploy the slm-agent BEFORE the backend restart. The
    # backend restart below kills this fire-and-forget playbook (KillMode=
    # control-group, #11492), so anything after it never runs — the agent
    # deploy must land here, and flush_handlers forces the role's restart
    # handler to fire now (handlers otherwise run at play end, i.e. never).
    # Idempotent role; block/rescue keeps a failure from aborting Play 1.
    - name: "[PLAY 1] SLM Agent | Redeploy agent (code + secrets + restart) (#11480)"
      tags: [slm, slm-agent]
      block:
        # #11480: the slm_agent role's version.json/service/config templates use
        # ansible_facts['date_time'], but this play runs gather_facts:false — so
        # the role failed at "Deploy version.json" (AnsibleUndefinedVariable:
        # date_time) and the agent never redeployed. Gather the minimal fact set
        # (includes date_time) just before the import.
        - name: "[PLAY 1] SLM Agent | Gather minimal facts for role templates (#11480)"
          ansible.builtin.setup:
            gather_subset: ["min"]
        - name: "[PLAY 1] SLM Agent | Import slm_agent role"
          ansible.builtin.import_role:
            name: slm_agent
        - name: "[PLAY 1] SLM Agent | Flush handlers so the agent restarts before the backend self-restart"
          ansible.builtin.meta: flush_handlers
      rescue:
        - name: "[PLAY 1] SLM Agent | Warn on agent redeploy failure"
          ansible.builtin.debug:
            msg: >-
              WARNING: slm_agent redeploy failed on {{ inventory_hostname }} —
              agent may run stale code / miss agent-secrets.env (#11480).
              Continuing to backend restart.

    - name: "[PLAY 1] SLM | Restart backend service"
      systemd:
        name: autobot-slm-backend
        state: restarted
        daemon_reload: true
      become: true
      tags: [slm, slm-backend, restart]

    - name: "[PLAY 1] SLM | Restart nginx"
      systemd:
        name: nginx
        state: restarted
      become: true
      tags: [slm, slm-frontend, restart]

    - name: "[PLAY 1] SLM | Wait for API to be ready"
      uri:
        url: "https://{{ ansible_host }}/slm/api/health"
        validate_certs: false
        status_code: 200
      register: slm_health_check
      until: slm_health_check.status == 200
      retries: 12
      delay: 10
      delegate_to: localhost
      tags: [always]

    - name: "[PLAY 1] SLM | Login to get auth token"
      uri:
        url: "https://{{ ansible_host }}/slm/api/auth/login"
        method: POST
        body_format: json
        body:
          username: "admin"
          password: "{{ slm_admin_password | default('admin') }}"
        validate_certs: false
        status_code: [200, 401, 403]
      register: slm_login_play1
      delegate_to: localhost
      no_log: true
      failed_when: false
      tags: [always]

    - name: "[PLAY 1] SLM | Warn if login failed"
      debug:
        msg: "WARNING: SLM login failed (status {{ slm_login_play1.status }}) -- sync-tracking skipped (#2295)"
      when: slm_login_play1.status != 200
      tags: [always]

    - name: "[PLAY 1] SLM | Mark node as synced in DB"
      uri:
        url: "https://{{ ansible_host }}/slm/api/code-sync/nodes/{{ slm_node_id | default(inventory_hostname) }}/mark-synced"
        method: POST
        headers:
          Authorization: "Bearer {{ slm_login_play1.json.access_token | default('') }}"
          Content-Type: "application/json"
        body: "{}"
        body_format: json
        validate_certs: false
        timeout: 30
        status_code: [200, 404]
      register: slm_mark_synced_play1
      # The SLM API is briefly slow on this endpoint right after a restart, so a
      # single attempt read-times-out and the node never gets marked synced
      # (#10634). Retry until it answers; still non-fatal if it never does.
      until: slm_mark_synced_play1.status | default(-1) in [200, 404]
      retries: 6
      delay: 10
      delegate_to: localhost
      ignore_errors: true
      when: slm_login_play1.status == 200
      tags: [always]

    - name: "[PLAY 1] SLM Update Complete"
      debug:
        msg:
          - "SLM Server updated"
          - "  Backend deployed + restarted"
          - "  Frontend built + nginx restarted"
          - "  SLM agent redeployed (#11480)"

# =============================================================================
# PLAY 2: Update All Other Infrastructure Nodes
# =============================================================================
# 11436: no longer excludes slm_server — a co-located SLM node (single-node
# install) joins `infrastructure` via the registry inventory only when it also
# carries app roles, so pure SLM servers still skip this play while co-located
# backend/frontend/worker components finally receive updates. Ordering is
# preserved: Play 1 updates the SLM components first.
- name: "Play 2 - Update Other Infrastructure Nodes"
  hosts: infrastructure
  gather_facts: false
  serial: 3
  # A failed node update (most critically a failed backend database
  # migration) must abort the whole rollout instead of continuing to the
  # next node with a diverged fleet (#10026).
  any_errors_fatal: true

  vars:
    deploy_tmp: "/tmp/autobot-deploy"

  pre_tasks:
    - name: "[PLAY 2] Login to SLM API"
      uri:
        url: "https://{{ slm_host }}/slm/api/auth/login"
        method: POST
        body_format: json
        body:
          username: "admin"
          password: "{{ slm_admin_password | default('admin') }}"
        validate_certs: false
        status_code: [200, 401, 403]
      register: slm_login
      delegate_to: localhost
      run_once: true
      no_log: true
      failed_when: false
      tags: [always]

    - name: "[PLAY 2] Warn if SLM login failed"
      debug:
        msg: "WARNING: SLM login failed (status {{ slm_login.status }}) -- sync-tracking skipped (#2295)"
      when: slm_login.status != 200
      run_once: true
      tags: [always]

    - name: "[PLAY 2] Set SLM auth token"
      set_fact:
        slm_token: "{{ slm_login.json.access_token | default('') }}"
      delegate_to: localhost
      run_once: true
      tags: [always]

  tasks:
    - name: "[PLAY 2] Starting Node Update"
      debug:
        msg:
          - "======================================================="
          - "  PLAY 2: Node Update (git archive)"
          - "======================================================="
          - "  Target: {{ inventory_hostname }} ({{ ansible_host }})"

    # ----- Backend -----
    - name: "[PLAY 2] Backend | Deploy autobot-backend"
      unarchive:
        src: "{{ deploy_tmp }}/backend.tar.gz"
        dest: /opt/autobot/
      become: true
      when: "'backend' in group_names"
      tags: [backend]

    - name: "[PLAY 2] Backend | Deploy autobot_shared"
      unarchive:
        src: "{{ deploy_tmp }}/shared.tar.gz"
        dest: /opt/autobot/
      become: true
      when: "'backend' in group_names"
      tags: [backend, shared]

    - name: "[PLAY 2] Backend | Fix ownership"
      command: chown --no-dereference -R autobot:autobot /opt/autobot/autobot-backend
      become: true
      when: "'backend' in group_names"
      changed_when: true
      tags: [backend]

    - name: "[PLAY 2] Backend | Fix shared ownership (#1632)"
      file:
        path: /opt/autobot/autobot_shared
        owner: autobot
        group: autobot
        recurse: true
      become: true
      when: "'backend' in group_names"
      tags: [backend, shared]

    - name: "[PLAY 2] Backend | Ensure autobot_shared symlink inside backend dir (#2651)"
      ansible.builtin.file:
        src: /opt/autobot/autobot_shared
        dest: /opt/autobot/autobot-backend/autobot_shared
        state: link
        force: true
        owner: autobot
        group: autobot
      become: true
      when: "'backend' in group_names"
      tags: [backend, shared, symlink]

    - name: "[PLAY 2] Backend | Remove legacy backend symlink"
      file:
        path: /opt/autobot/autobot-backend/backend
        state: absent
      become: true
      when: "'backend' in group_names"
      tags: [backend]

    - name: "[PLAY 2] Backend | Install Python dependencies"
      command:
        cmd: /opt/autobot/autobot-backend/venv/bin/pip install
             -r /opt/autobot/autobot-backend/requirements.txt
             --quiet --timeout 120
      become: true
      become_user: autobot
      environment:
        PIP_DEFAULT_TIMEOUT: "120"
      timeout: 600  # Issue #2835: prevent indefinite hang on dependency resolution conflicts
      when:
        - "'backend' in group_names"
        - hostvars['localhost']['python_deps_changed'] | bool
      register: backend_pip_install
      tags: [backend, deps]

    # #12907/#12959: the credential-store reconciliation is owned by
    # roles/postgresql (tasks/credentials_reconcile.yml) and this play applied
    # neither the role nor an inline copy — so the #12907 fix was merged, closed
    # and inert: duplicate keys and the month-stale legacy store survived five
    # full self-update runs untouched. Applying the role's own task file keeps
    # ONE implementation and makes the fix reach hosts.
    #
    # Must precede the credential reads below so they see the reconciled file
    # rather than a stale first-match duplicate.
    - name: "[PLAY 2] Backend | Reconcile the AUTOBOT credential store (#12907, #12959)"
      ansible.builtin.include_role:
        name: postgresql
        tasks_from: credentials_reconcile
        apply:
          become: true
      vars:
        db_env_prefix: AUTOBOT
      when: "'backend' in group_names"
      tags: [backend, env, credentials]

    # Migrations moved AFTER the .env regen so they run with the fresh
    # credentials and BEFORE the service restart — see the
    # "Database migration sequence" block below (#10001/#10026; replaces the
    # old #1608 task that invoked alembic without -c migrations/alembic.ini
    # and swallowed the guaranteed failure with failed_when: false).
    - name: "[PLAY 2] Backend | Read existing secret key before .env regen (#2649)"
      ansible.builtin.shell:
        cmd: grep '^SECRET_KEY=' /opt/autobot/autobot-backend/.env | cut -d= -f2-
      register: existing_secret_key
      become: true
      become_user: autobot
      when: "'backend' in group_names"
      failed_when: false
      changed_when: false
      tags: [backend, env]

    # #10400: align AUTOBOT_JWT_SECRET with SLM_SECRET_KEY so the backend→SLM
    # WebSocket service-JWT verifies (SLM verifies with SLM_SECRET_KEY). The key
    # is written by the slm_manager role into /etc/autobot/slm-secrets.env.
    - name: "[PLAY 2] Backend | Read SLM_SECRET_KEY for backend_jwt_secret (#10400)"
      ansible.builtin.shell:
        cmd: >-
          grep -oP '^SLM_SECRET_KEY=\K.*'
          /etc/autobot/slm-secrets.env 2>/dev/null || true
      register: existing_slm_secret_key
      become: true
      when: "'backend' in group_names"
      failed_when: false
      changed_when: false
      no_log: true
      tags: [backend, env]

    # Internal service API key — backend must use the same key the SLM expects.
    # Written by the backend role into /etc/autobot/autobot-backend.env (#10632).
    - name: "[PLAY 2] Backend | Read AUTOBOT_INTERNAL_API_KEY (#10636)"
      ansible.builtin.shell:
        cmd: >-
          grep -oP '^AUTOBOT_INTERNAL_API_KEY=\K.*'
          /etc/autobot/autobot-backend.env 2>/dev/null || true
      register: existing_internal_api_key
      become: true
      when: "'backend' in group_names"
      failed_when: false
      changed_when: false
      no_log: true
      tags: [backend, env]

    # Full user management requires the autobot_app DB password (#10636).
    #
    # GH#12883: this used to read ONLY /etc/autobot/autobot-db-credentials.env.
    # On a live host that file was a month stale and held a value PostgreSQL
    # rejects — that is what tried to overwrite a working credential and would
    # have taken the database out on the next backend restart.
    #
    # /etc/autobot/db-credentials.env is the canonical store: PLAY 1 already
    # slurps it for the SLM migrations above, and its value is the one that
    # actually authenticates. Prefer it; keep the legacy file as a fallback for
    # hosts provisioned before it existed.
    #
    # `tail -n 1` is load-bearing, not defensive. db-credentials.env is appended
    # to rather than rewritten, so this key can appear more than once with the
    # CURRENT value LAST. That matches `set -a; . file` semantics (last
    # assignment wins); a `head -1` would read the stale first copy and
    # reintroduce the exact outage this fixes.
    - name: "[PLAY 2] Backend | Read autobot_app DB password (#10636, #12883)"
      ansible.builtin.shell:
        cmd: |
          k=AUTOBOT_DB_PASSWORD
          v=$(grep -oP "^${k}=\K.*" /etc/autobot/db-credentials.env 2>/dev/null | tail -n 1)
          if [ -z "$v" ]; then
            v=$(grep -oP "^${k}=\K.*" /etc/autobot/autobot-db-credentials.env 2>/dev/null | tail -n 1)
          fi
          printf '%s' "$v"
      register: existing_autobot_db_password
      become: true
      when: "'backend' in group_names"
      failed_when: false
      changed_when: false
      no_log: true
      tags: [backend, env]

    # Initial platform-admin password — backend seeds the default admin into
    # autobot_users at startup ONLY when this is set (#10636). Installer writes
    # AUTOBOT_ADMIN_PASSWORD alongside SLM_ADMIN_PASSWORD; fall back to the SLM
    # admin password so the user app and SLM share one admin credential.
    - name: "[PLAY 2] Backend | Read admin password for full-user-management seed (#10636)"
      ansible.builtin.shell:
        cmd: >-
          grep -oP '^AUTOBOT_ADMIN_PASSWORD=\K.*' /etc/autobot/slm-secrets.env 2>/dev/null
          || grep -oP '^SLM_ADMIN_PASSWORD=\K.*' /etc/autobot/slm-secrets.env 2>/dev/null
          || true
      register: existing_admin_password
      become: true
      when: "'backend' in group_names"
      failed_when: false
      changed_when: false
      no_log: true
      tags: [backend, env]

    - name: "[PLAY 2] Backend | Load shared backend env vars (#2727)"
      ansible.builtin.include_vars:
        file: vars/backend-env.yml
      when: "'backend' in group_names"
      tags: [backend, env]

    # GH#12883: this render was unreachable until #12871 was fixed, and the first
    # time it ran it overwrote a WORKING AUTOBOT_POSTGRES_PASSWORD with one
    # PostgreSQL rejects — the next backend restart would have lost the database.
    #
    # Two stores claimed to hold this secret and they disagreed:
    #   /etc/autobot/autobot-db-credentials.env   (legacy, observed a month stale)
    #   /etc/autobot/db-credentials.env           (canonical; authenticates)
    #
    # The read task above now prefers the canonical store (last-wins), which is
    # the convergence this issue asked for. This check stays as defence in depth:
    # it costs nothing, and it still catches any host whose stores diverge for a
    # reason we have not seen yet. A visibly failed update is recoverable; a dead
    # credential on next restart is an outage.
    - name: "[PLAY 2] Backend | Read the DB password currently in use (#12883)"
      ansible.builtin.shell:
        cmd: >-
          grep -oP '^AUTOBOT_POSTGRES_PASSWORD=\K.*'
          /opt/autobot/autobot-backend/.env 2>/dev/null || true
      register: current_env_db_password
      become: true
      when: "'backend' in group_names"
      failed_when: false
      changed_when: false
      no_log: true
      tags: [backend, env]

    - name: "[PLAY 2] Backend | Refuse to overwrite a working DB password (#12883)"
      vars:
        _current: "{{ current_env_db_password.stdout | default('') | trim }}"
        _incoming: "{{ existing_autobot_db_password.stdout | default('') | trim }}"
      ansible.builtin.fail:
        msg: >-
          Refusing to rewrite .env: the DB password in
          /etc/autobot/autobot-db-credentials.env differs from the one currently
          authenticating in /opt/autobot/autobot-backend/.env. Writing it would
          break PostgreSQL auth on the next backend restart (#12883). Reconcile
          the two credential stores, then re-run. The working value is the one in
          the live .env.
      when:
        - "'backend' in group_names"
        - _current | length > 0
        - _incoming | length > 0
        - _current != _incoming
      tags: [backend, env]

    # GH#12871: was a bare playbook-level `template:` task, which cannot see the
    # backend role's defaults — it died on AnsibleUndefinedVariable
    # 'backend_chromadb_auth_token', failing PLAY 2 so PLAY 3 never ran. That
    # variable was only the first of 37 the template needs and this play does
    # not define. include_role puts the defaults in scope at role-default
    # precedence, so they fill the other 32 while the secret overrides below
    # (read off the live host) still win. include_vars would NOT be safe here:
    # it outranks task vars, so it would replace those secrets with the role's
    # empty / "change-me-in-production" placeholders.
    - name: "[PLAY 2] Backend | Regenerate .env from template (#2649, #12871)"
      ansible.builtin.include_role:
        name: backend
        tasks_from: env_only
      when: "'backend' in group_names"
      vars:
        backend_env_dest: /opt/autobot/autobot-backend/.env
        backend_env_owner: autobot
        backend_env_group: autobot
        # backend_secret_key uses a register var specific to this playbook
        backend_secret_key: "{{ existing_secret_key.stdout | default(lookup('env', 'AUTOBOT_SECRET_KEY') | default('autobot-dev-secret-' + (9999999999 | random | string), true), true) }}"
        # #10400: prefer SLM_SECRET_KEY when present, else keep the role default.
        backend_jwt_secret: "{{ (existing_slm_secret_key.stdout | default('') | trim) if (existing_slm_secret_key.stdout | default('') | trim) | length > 0 else (existing_secret_key.stdout | default('') | trim) }}"
        # #10636: internal service API key + full-user-management DB password,
        # read from /etc/autobot above.
        autobot_internal_api_key: "{{ existing_internal_api_key.stdout | default('') | trim }}"
        backend_postgres_password: "{{ existing_autobot_db_password.stdout | default('') | trim }}"
        # #10636: seed the default platform admin on first boot (full user mgmt).
        autobot_admin_password: "{{ existing_admin_password.stdout | default('') | trim }}"
      tags: [backend, env]

    - name: "[PLAY 2] Backend | Read backend user mode (#10001)"
      ansible.builtin.shell: "grep -oP '^AUTOBOT_USER_MODE=\\K.*' /opt/autobot/autobot-backend/.env"
      become: true
      register: backend_user_mode_probe
      changed_when: false
      failed_when: false  # absent .env/var = not yet configured; skip until set
      when: "'backend' in group_names"
      tags: [backend, migrate]

    - name: "[PLAY 2] Backend | Database migration sequence (#10001)"
      when:
        - "'backend' in group_names"
        - backend_user_mode_probe.stdout | default('') | trim != ''
      tags: [backend, migrate]
      block:
        # Strict migration sequence consolidated into one shared include
        # (#10046): fail-closed backup -> baseline adoption -> strict
        # `alembic upgrade head`. Single source for both this playbook and
        # setup-user-backend.yml.
        - name: "[PLAY 2] Backend | Run strict backend migration sequence (#10001, #10026, #10046)"
          ansible.builtin.include_tasks: ../_shared/tasks/migrate_backend_db.yml
          vars:
            migration_code_dir: /opt/autobot/autobot-backend
            migration_user: autobot
            migration_become: true
            migration_name_prefix: "[PLAY 2] Backend | "

    # #12777/#12959: the unit template is role-owned and this play never rendered
    # it, so the faulthandler fix stayed in the repo and never reached a host.
    # Must precede the restart below so the new unit is what gets started.
    - name: "[PLAY 2] Backend | Render systemd unit so role changes land (#12777)"
      ansible.builtin.include_role:
        name: backend
        tasks_from: unit_only
      when: "'backend' in group_names"
      tags: [backend, systemd, unit]

    - name: "[PLAY 2] Backend | Restart service"
      systemd:
        name: autobot-backend
        state: restarted
        daemon_reload: true
      become: true
      when: "'backend' in group_names"
      tags: [backend, restart]

    - name: "[PLAY 2] Backend | Wait for API to be ready"
      uri:
        # uvicorn binds plain HTTP on localhost:8001 (backend_port); nginx holds
        # TLS on 443. There is NO 8443 listener (#957/#10378). Probe the direct
        # backend on the loopback — it does not depend on nginx (deployed after
        # this task) and needs no cert validation (#10650).
        #
        # #11455: run ON the backend node (no delegate_to) so 127.0.0.1 is the
        # node's own loopback. 8001 is bound to localhost, so it is unreachable
        # from the controller — delegating to localhost only worked for a
        # co-located single-node backend and spun 42×10s against the wrong host
        # for any remote backend, aborting the rollout via any_errors_fatal.
        url: "http://127.0.0.1:8001/api/health"
        status_code: 200
      register: backend_health_check
      until: backend_health_check.status == 200
      retries: 42
      delay: 10
      when: "'backend' in group_names"
      tags: [backend, restart]

    # ----- Frontend -----
    - name: "[PLAY 2] Frontend | Deploy autobot-frontend"
      unarchive:
        src: "{{ deploy_tmp }}/frontend.tar.gz"
        dest: /opt/autobot/
      become: true
      when: "'frontend' in group_names"
      tags: [frontend]

    - name: "[PLAY 2] Frontend | Fix ownership"
      file:
        path: /opt/autobot/autobot-frontend
        owner: autobot
        group: autobot
        recurse: true
      become: true
      when: "'frontend' in group_names"
      tags: [frontend]

    - name: "[PLAY 2] Frontend | Install Node.js dependencies"
      command:
        cmd: npm ci --ignore-scripts
        chdir: /opt/autobot/autobot-frontend
      become: true
      become_user: autobot
      when:
        - "'frontend' in group_names"
        - hostvars['localhost']['node_deps_changed'] | bool
      register: frontend_npm_install
      tags: [frontend, deps]

    - name: "[PLAY 2] Frontend | Rebuild production dist"
      command:
        cmd: npx vite build
        chdir: /opt/autobot/autobot-frontend
      become_user: autobot
      become: true
      when: "'frontend' in group_names"
      register: frontend_build
      tags: [frontend]

    - name: "[PLAY 2] Frontend | Restart nginx"
      systemd:
        name: nginx
        state: restarted
      become: true
      when: "'frontend' in group_names"
      tags: [frontend, restart]

    - name: "[PLAY 2] Frontend | Wait for nginx to be ready"
      wait_for:
        host: "{{ ansible_host }}"
        port: 443
        timeout: 60
        delay: 5
      delegate_to: localhost
      when: "'frontend' in group_names"
      tags: [frontend, restart]

    # ----- NPU Worker -----
    - name: "[PLAY 2] NPU | Deploy autobot-npu-worker"
      unarchive:
        src: "{{ deploy_tmp }}/npu-worker.tar.gz"
        dest: /opt/autobot/
      become: true
      when: >-
        'npu' in group_names
      tags: [npu, npu-worker]

    - name: "[PLAY 2] NPU | Fix ownership"
      file:
        path: /opt/autobot/autobot-npu-worker
        owner: autobot
        group: autobot
        recurse: true
      become: true
      when: >-
        'npu' in group_names
      tags: [npu, npu-worker]

    - name: "[PLAY 2] NPU | Install Python dependencies"
      command:
        cmd: /opt/autobot/autobot-npu-worker/venv/bin/pip install
             -r /opt/autobot/autobot-npu-worker/requirements.txt
             --quiet --timeout 120
      become: true
      become_user: autobot
      environment:
        PIP_DEFAULT_TIMEOUT: "120"
      timeout: 600  # Issue #2835: prevent indefinite hang on dependency resolution conflicts
      when:
        - >-
          'npu' in group_names
        - hostvars['localhost']['python_deps_changed'] | bool
      register: npu_pip_install
      tags: [npu, npu-worker, deps]

    - name: "[PLAY 2] NPU | Restart service"
      systemd:
        name: autobot-npu-worker
        state: restarted
      become: true
      when: >-
        'npu' in group_names
      failed_when: false
      tags: [npu, npu-worker, restart]

    - name: "[PLAY 2] NPU | Wait for service to stabilize (#1633)"
      command: systemctl is-active autobot-npu-worker
      become: true
      register: npu_status
      retries: 6
      delay: 5
      until: npu_status.rc == 0
      when: >-
        'npu' in group_names
      failed_when: false
      tags: [npu, npu-worker, restart]

    - name: "[PLAY 2] NPU | Warn if service not active (#1633)"
      debug:
        msg: "WARNING: autobot-npu-worker not active after restart: {{ npu_status.stdout | default('unknown') }}"
      when:
        - >-
          'npu' in group_names
        - npu_status is defined
        - npu_status.rc | default(0) != 0
      tags: [npu, npu-worker, restart]

    # ----- TTS Worker -----
    # #12886: the TTS worker had NO update path at all — it is excluded from
    # per-component drift resolve (its deployed file is a rendered template, not
    # a 1:1 sync) and this playbook never mentioned it. So every backend update
    # advanced the caller while the worker stayed behind, and the streaming route
    # the backend calls simply 404'd. That is the #12959 pattern: the fix existed
    # in the role and had no route to the host.
    #
    # Applies the role's code_only task file — the service files that carry code
    # changes — NOT the full role. Provisioning (service account, venv, torch and
    # pocket-tts installs, gated-model pre-download) is slow, needs network, and
    # must not re-run on a box that is already installed correctly.
    # become is required and not inherited: this play sets no play-level become
    # (unlike deploy-full.yml, which the role is normally applied under), and
    # /opt/autobot/autobot-tts-worker is owned by the autobot-tts service
    # account, not the autobot user ansible connects as. Without it the very
    # first task fails "Destination /opt/autobot/autobot-tts-worker not
    # writable" — the same wrong-user ownership class as #12872.
    - name: "[PLAY 2] TTS | Refresh deployed TTS worker service files (#12886)"
      ansible.builtin.include_role:
        name: tts-worker
        tasks_from: code_only
        # `become` is NOT a valid task keyword on include_role (a dynamic
        # include) — ansible rejects the whole playbook with "'become' is not a
        # valid attribute for a IncludeRole", which breaks every self-update.
        # `apply` is how privilege is handed to the included tasks.
        apply:
          become: true
      when: "'npu' in group_names"
      tags: [tts, tts-worker, deploy]

    # Restart explicitly rather than via the role's notify handler, matching how
    # every other component in this play is restarted (NPU, Browser, backend).
    #
    # Handlers are wrong here for two compounding reasons, both observed on a
    # live host (#12886):
    #   1. they flush at END of play, and PLAY 2 has a known terminal failure in
    #      the browser tasks below (#12912) — so the queued restart was discarded
    #      and the worker kept serving 4-day-old code;
    #   2. once the file is already current, the template task reports `ok` and
    #      never notifies at all — so a host that received the file but missed
    #      the restart stays stale forever, with nothing left to trigger it.
    #
    # An unconditional restart is idempotent in effect and cannot be swallowed.
    # Deliberately NOT `failed_when: false`, unlike the NPU/Browser restarts
    # above. This whole issue exists because a worker kept serving stale code
    # while the update reported success — swallowing a failed restart here would
    # reintroduce exactly that: the file lands, the process never reloads, and
    # nothing says so. A restart that cannot complete is a real failure and
    # should be visible.
    - name: "[PLAY 2] TTS | Restart service"
      systemd:
        name: autobot-tts-worker
        state: restarted
      become: true
      when: "'npu' in group_names"
      tags: [tts, tts-worker, restart]

    # ----- Browser Worker -----
    - name: "[PLAY 2] Browser | Deploy autobot-browser-worker"
      unarchive:
        src: "{{ deploy_tmp }}/browser-worker.tar.gz"
        dest: /opt/autobot/
      become: true
      when: >-
        'browser' in group_names
      tags: [browser, browser-worker]

    - name: "[PLAY 2] Browser | Fix ownership"
      file:
        path: /opt/autobot/autobot-browser-worker
        owner: autobot
        group: autobot
        recurse: true
      become: true
      when: >-
        'browser' in group_names
      tags: [browser, browser-worker]

    - name: "[PLAY 2] Browser | Install Python dependencies"
      command:
        cmd: /opt/autobot/autobot-browser-worker/venv/bin/pip install
             -r /opt/autobot/autobot-browser-worker/requirements.txt
             --quiet --timeout 120
      become: true
      become_user: autobot
      environment:
        PIP_DEFAULT_TIMEOUT: "120"
      timeout: 600  # Issue #2835: prevent indefinite hang on dependency resolution conflicts
      when:
        - >-
          'browser' in group_names
        - hostvars['localhost']['python_deps_changed'] | bool
      register: browser_pip_install
      failed_when: false
      tags: [browser, browser-worker, deps]

    # The browser worker ships no package-lock.json (git archive of a dir with
    # only package.json), so `npm ci` (lockfile-required) is wrong here — use
    # `npm install`, matching the provisioning role's `npm:` module.
    - name: "[PLAY 2] Browser | Install npm dependencies"
      command:
        cmd: npm install --omit=dev
        chdir: /opt/autobot/autobot-browser-worker
      become: true
      become_user: autobot
      timeout: 600
      when:
        - >-
          'browser' in group_names
        - hostvars['localhost']['node_deps_changed'] | bool
      failed_when: false
      tags: [browser, browser-worker, deps]

    # #11442: a playwright version bump changes the required browser revision;
    # without re-running install the worker bricks on the next /navigate
    # ("Executable doesn't exist at .../chromium-<rev>"). Gated on node_deps_
    # changed (npm install above ran first, so node_modules/.bin/playwright
    # exists) — playwright skips the download when the revision is present.
    - name: "[PLAY 2] Browser | Ensure Playwright browsers match the installed package (#11442)"
      command:
        cmd: node_modules/.bin/playwright install chromium
        chdir: /opt/autobot/autobot-browser-worker
      environment:
        PLAYWRIGHT_BROWSERS_PATH: /var/lib/autobot/playwright-browsers
      become: true
      timeout: 900
      register: browser_playwright_install
      changed_when: "'downloaded' in (browser_playwright_install.stdout | default('') | lower)"
      failed_when: false
      when:
        - >-
          'browser' in group_names
        - hostvars['localhost']['node_deps_changed'] | bool
      tags: [browser, browser-worker, deps]

    # #5085: a root-run install produces browser files the `autobot` service
    # user cannot traverse/read. Symbolic a+rX adds read to all, plus traverse
    # to dirs and execute only to already-executable files — preserving the
    # chrome binary's +x (a recursive 0644 would strip it and re-brick launch).
    - name: "[PLAY 2] Browser | Make Playwright browsers accessible to the service user (#5085)"
      ansible.builtin.file:
        path: /var/lib/autobot/playwright-browsers
        mode: "a+rX"
        recurse: true
      become: true
      when:
        - >-
          'browser' in group_names
        - hostvars['localhost']['node_deps_changed'] | bool
      failed_when: false
      tags: [browser, browser-worker, deps]

    # #11442: surface a bricked install instead of silently restarting onto a
    # broken worker (pattern from "NPU | Warn if service not active").
    - name: "[PLAY 2] Browser | Warn if Playwright install failed"
      ansible.builtin.debug:
        msg: >-
          WARNING: Playwright browser install returned
          rc={{ browser_playwright_install.rc | default('n/a') }} on
          {{ inventory_hostname }} — /navigate may fail.
          stderr: {{ browser_playwright_install.stderr | default('') | truncate(300) }}
      when:
        - >-
          'browser' in group_names
        - hostvars['localhost']['node_deps_changed'] | bool
        - browser_playwright_install.rc | default(0) != 0
      tags: [browser, browser-worker, deps]

    - name: "[PLAY 2] Browser | Restart service"
      systemd:
        name: autobot-playwright
        state: restarted
      become: true
      when: >-
        'browser' in group_names
      failed_when: false
      tags: [browser, browser-worker, restart]

    # #12912: waited on 3000, which nothing serves — autobot-playwright binds
    # PLAYWRIGHT_PORT (9001, roles/browser/defaults/main.yml). On a live host
    # 3000 is Grafana, bound to loopback only, so this timed out for 61s and
    # failed PLAY 2 every single run — the terminal blocker that also swallowed
    # other components' handlers.
    #
    # `| default(9001)` because role defaults are NOT in scope in a playbook
    # task (the #12871 trap); this mirrors setup-browser-worker.yml.
    - name: "[PLAY 2] Browser | Wait for service to be ready"
      wait_for:
        host: "{{ ansible_host }}"
        port: "{{ playwright_port | default(9001) }}"
        timeout: 60
        delay: 5
      delegate_to: localhost
      when: >-
        'browser' in group_names
      tags: [browser, browser-worker, restart]

    # ----- AI Stack (LangChain/LlamaIndex agent router + ChromaDB) -----
    # Ported from the retired top-level update-all-nodes.yml (#11424) so the
    # aiml node keeps receiving code updates through the canonical entrypoint.
    - name: "[PLAY 2] AI Stack | Deploy ai_api_server and requirements"
      unarchive:
        src: "{{ deploy_tmp }}/ai-stack.tar.gz"
        dest: /opt/autobot/autobot-ai-stack/
        extra_opts: ['--strip-components=4']
        owner: autobot
        group: autobot
      become: true
      when: >-
        'aiml' in group_names
      tags: [ai-stack, aiml]

    - name: "[PLAY 2] AI Stack | Restart autobot-ai-stack service"
      systemd:
        name: autobot-ai-stack
        state: restarted
      become: true
      when: >-
        'aiml' in group_names
      failed_when: false
      tags: [ai-stack, aiml, restart]

    - name: "[PLAY 2] AI Stack | Restart autobot-chromadb service"
      systemd:
        name: autobot-chromadb
        state: restarted
      become: true
      when: >-
        'aiml' in group_names
      failed_when: false
      tags: [ai-stack, aiml, chromadb, restart]

    # ----- Shared (non-backend nodes) -----
    - name: "[PLAY 2] Shared | Deploy autobot_shared"
      unarchive:
        src: "{{ deploy_tmp }}/shared.tar.gz"
        dest: /opt/autobot/
      become: true
      when: "'backend' not in group_names"
      tags: [shared]

    - name: "[PLAY 2] Shared | Fix ownership"
      file:
        path: /opt/autobot/autobot_shared
        owner: autobot
        group: autobot
        recurse: true
      become: true
      when: "'backend' not in group_names"
      tags: [shared]

    # Issue #9225: slm-agent needs autobot_shared in PYTHONPATH
    - name: "[PLAY 2] SLM Agent | Create autobot_shared symlink for agent imports"
      ansible.builtin.file:
        src: /opt/autobot/autobot_shared
        dest: /opt/autobot/autobot-slm-agent/autobot_shared
        state: link
        force: true
        owner: autobot
        group: autobot
      become: true
      when: slm_node_id is defined
      tags: [slm-agent, shared]

    # #11480: redeploy the slm-agent (code + agent-secrets.env + restart) on
    # remote nodes too. block/rescue keeps a single node's agent failure from
    # aborting the whole fleet update (Play 2 has any_errors_fatal: true) —
    # consistent with the failed_when:false used by the other Play 2 tasks.
    # Note: a co-located SLM manager is in both slm_server (Play 1) and
    # infrastructure (Play 2, #11436), so it runs this idempotent role twice
    # per update (harmless — converges to the same state, one extra restart).
    # No flush_handlers here (unlike Play 1): Play 2 reaches its play end so
    # handlers flush normally; Play 1 needs the early flush because the backend
    # self-restart kills the run before play end (#11492).
    - name: "[PLAY 2] SLM Agent | Redeploy agent (code + secrets + restart) (#11480)"
      when: slm_node_id is defined
      tags: [slm-agent]
      block:
        - name: "[PLAY 2] SLM Agent | Gather minimal facts for role templates (#11480)"
          ansible.builtin.setup:
            gather_subset: ["min"]
        - name: "[PLAY 2] SLM Agent | Import slm_agent role"
          ansible.builtin.import_role:
            name: slm_agent
      rescue:
        - name: "[PLAY 2] SLM Agent | Warn on agent redeploy failure"
          ansible.builtin.debug:
            msg: >-
              WARNING: slm_agent redeploy failed on {{ inventory_hostname }} —
              agent may run stale code / miss agent-secrets.env (#11480).
              Continuing fleet update.

    # Issue #9565: slm-backend needs autobot_shared in PYTHONPATH
    - name: "[PLAY 2] SLM Backend | Create autobot_shared symlink for backend imports"
      ansible.builtin.file:
        src: /opt/autobot/autobot_shared
        dest: /opt/autobot/autobot-slm-backend/autobot_shared
        state: link
        force: true
        owner: autobot
        group: autobot
      become: true
      when: slm_node_id is defined
      tags: [slm-backend, shared]

    # ----- Mark synced -----
    - name: "[PLAY 2] Mark node as synced in SLM DB"
      uri:
        url: "https://{{ slm_host }}/slm/api/code-sync/nodes/{{ inventory_hostname }}/mark-synced"
        method: POST
        headers:
          Authorization: "Bearer {{ slm_token }}"
          Content-Type: "application/json"
        body: "{}"
        body_format: json
        validate_certs: false
        timeout: 30
        status_code: [200, 404]
      register: node_mark_synced
      # Retry the briefly-slow post-restart endpoint instead of one-shot
      # timing out so the node actually gets marked synced (#10634).
      until: node_mark_synced.status | default(-1) in [200, 404]
      retries: 6
      delay: 10
      delegate_to: localhost
      ignore_errors: true
      when: slm_token | default('') | length > 0
      tags: [always]

    # =========================================================================
    # #12959: post-update delivery assertions
    #
    # The expensive part of #12959 was not the missing role application — it was
    # that the update REPORTED SUCCESS while delivering nothing, so three issues
    # (#12777, #12886, #12907) were closed against a mechanism that could not
    # deliver them and their symptoms were re-diagnosed weeks later.
    #
    # Each check below asserts an invariant that a task EARLIER IN THIS PLAY
    # just guaranteed, so a failure means delivery silently regressed — never a
    # pre-existing host condition. That is why they are fail-closed: a green run
    # that delivered nothing is the exact outcome this issue is about.
    # =========================================================================
    # `executable: /bin/bash` is load-bearing (#12907): ansible.builtin.shell
    # runs under /bin/sh, which is dash on these hosts, and dash aborts on
    # `set -o pipefail` with rc=2 before the first echo. That left
    # delivery_evidence.stdout EMPTY, and every assert below is gated on it
    # being non-empty — so the delivery checks #12959 added to stop "green but
    # undelivered" were themselves silently skipped on every run.
    - name: "[PLAY 2] Verify | Collect delivery evidence (#12959)"
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          f=/etc/autobot/db-credentials.env
          echo "faulthandler=$(systemctl cat autobot-backend 2>/dev/null \
            | grep -c PYTHONFAULTHANDLER)"
          echo "cred_block=$(grep -c '^# BEGIN AUTOBOT DB CREDENTIALS' \
            "$f" 2>/dev/null)"
          echo "cred_pw=$(grep -cE '^AUTOBOT_DB_PASSWORD=.+' "$f" 2>/dev/null)"
          echo "dup_cred_keys=$(grep -oE '^AUTOBOT_[A-Z0-9_]+=' "$f" 2>/dev/null \
            | sort | uniq -d | wc -l)"
          echo "legacy_store=$(test -f /etc/autobot/autobot-db-credentials.env \
            && echo 1 || echo 0)"
      args:
        executable: /bin/bash
      register: delivery_evidence
      become: true
      changed_when: false
      failed_when: false
      when: "'backend' in group_names"
      tags: [backend, verify]

    - name: "[PLAY 2] Verify | Backend systemd unit reached the host (#12777, #12959)"
      ansible.builtin.assert:
        that:
          # rendered by "Render systemd unit" above via roles/backend unit_only
          - "'faulthandler=0' not in delivery_evidence.stdout"
        fail_msg: >-
          #12959: the update ran green but roles/backend unit_only did not
          render the systemd unit — the #12777 faulthandler diagnostic is not
          active. Evidence: {{ delivery_evidence.stdout | default('(none)') }}.
          Do not close an issue against this run.
        success_msg: "Backend systemd unit delivered (#12777)"
      when:
        - "'backend' in group_names"
        - delivery_evidence.stdout | default('') | length > 0
      tags: [backend, verify]

    # Gated on the canonical store actually holding an AUTOBOT password, NOT on
    # a blockinfile marker (#12907). Marker-gating suppressed this assertion on
    # exactly the hosts that carried the pre-#12224 duplicates — they have no
    # marker — so the check that was supposed to catch non-delivery went quiet
    # on the one host shape where delivery had failed. A host with no AUTOBOT
    # credentials at all has a provisioning gap, not a delivery regression, and
    # is still excluded so it cannot fail the fleet update for the wrong reason.
    - name: "[PLAY 2] Verify | Credential store reconciled (#12907, #12959)"
      ansible.builtin.assert:
        that:
          # Defect 1 — pre-#12224 unmarked duplicates stripped
          - "'dup_cred_keys=0' in delivery_evidence.stdout"
          # Defect 2 — superseded legacy store retired
          - "'legacy_store=0' in delivery_evidence.stdout"
        fail_msg: >-
          #12959: the update ran green but roles/postgresql
          credentials_reconcile did not apply — duplicate keys and/or the
          superseded autobot-db-credentials.env survive, which is how #12883
          became an outage. Evidence:
          {{ delivery_evidence.stdout | default('(none)') }}
        success_msg: "Credential store reconciled (#12907)"
      when:
        - "'backend' in group_names"
        - delivery_evidence.stdout | default('') | length > 0
        - "'cred_pw=0' not in delivery_evidence.stdout"
      tags: [backend, verify]

    - name: "[PLAY 2] Verify | TTS worker carries the streaming route (#12886, #12959)"
      ansible.builtin.command:
        cmd: grep -c '/tts/synthesize/stream' /opt/autobot/autobot-tts-worker/tts-worker.py
      register: tts_stream_route
      become: true
      changed_when: false
      failed_when: false
      when: "'npu' in group_names"
      tags: [tts, verify]

    - name: "[PLAY 2] Verify | Fail if the TTS worker was not refreshed (#12886, #12959)"
      ansible.builtin.assert:
        that:
          - tts_stream_route.stdout | default('0') | trim | int > 0
        fail_msg: >-
          #12959: /opt/autobot/autobot-tts-worker/tts-worker.py lacks
          /tts/synthesize/stream after this update — roles/tts-worker code_only
          did not deliver, so backend TTS calls will 404 (#12886).
        success_msg: "TTS worker refreshed (#12886)"
      # rc != 0 also means "file absent", i.e. the worker is not installed on
      # this node at all — that is a provisioning gap (#12872), not a delivery
      # regression, so it is not this assertion's failure to report.
      when:
        - "'npu' in group_names"
        - tts_stream_route.rc | default(1) == 0
      tags: [tts, verify]

    # =========================================================================
    # #13460: the last four components whose role-owned files the updater could
    # not deliver. Each applies its role's code_only task file — the service
    # units, worker code and configs that carry changes — never the full role,
    # whose provisioning half (apt, venv, OpenVINO, Playwright downloads, npm)
    # must not re-run on an already-installed box.
    #
    # `apply: {become: true}` on every one: this play sets no play-level become,
    # and a bare `become` on include_role makes ansible reject the WHOLE playbook
    # ("'become' is not a valid attribute for a IncludeRole"), breaking every
    # self-update rather than just the task (#12886).
    # =========================================================================
    - name: "[PLAY 2] AI Stack | Deploy role-owned service files (#13460)"
      ansible.builtin.include_role:
        name: ai-stack
        tasks_from: code_only
        apply:
          become: true
      when: "'aiml' in group_names"
      tags: [ai-stack, deploy]

    - name: "[PLAY 2] NPU | Deploy role-owned service files (#13460)"
      ansible.builtin.include_role:
        name: npu-worker
        tasks_from: code_only
        apply:
          become: true
      when: "'npu' in group_names"
      tags: [npu, npu-worker, deploy]

    - name: "[PLAY 2] Frontend | Deploy role-owned nginx config (#13460)"
      ansible.builtin.include_role:
        name: frontend
        tasks_from: code_only
        apply:
          become: true
      when: "'frontend' in group_names"
      tags: [frontend, nginx, deploy]

    - name: "[PLAY 2] Browser | Deploy role-owned service files (#13460)"
      ansible.builtin.include_role:
        name: browser
        tasks_from: code_only
        apply:
          become: true
      when: "'browser' in group_names"
      tags: [browser, deploy]

    - name: "[PLAY 2] Node Update Complete"
      debug:
        msg: "{{ inventory_hostname }} updated"

# =============================================================================
# PLAY 2b: Update Database Nodes
# =============================================================================
# #13535: the database role had NO builtin update route. Play 2 targets the
# `infrastructure` group, and `database` is not one of its children — so nothing
# code-sync / self-update ran ever touched a database host, and roles/redis had
# no code-only task file for a play to apply even if it had. That is why the
# #12513 chroma-auth work merged in #13462/#13537 "looked deployed" while the
# host was unchanged: the #12959 failure shape, one role further along.
#
# A separate play rather than adding `database` to the `infrastructure` group:
# that group is Play 2's host list, and Play 2 is a backend/frontend/worker
# update — package installs, npm builds, alembic migrations, a backend .env
# regeneration. None of it is designed for a database node, and all of it is
# guarded by `'<component>' in group_names` checks a database node would skip
# anyway. Targeting `database` directly runs the one thing that node needs and
# nothing else.
#
# Placed AFTER Play 2, deliberately. Play 2 regenerates backend.env with the
# chroma CLIENT token and restarts the backend; this play then switches the
# chroma SERVER to enforcing. The reverse order would enable server-side auth
# while the backend still ran without the credential — every RAG call 401s for
# the length of Play 2. Same ordering the ai-stack chroma unit already follows
# inside Play 2 (backend tasks first, ai-stack code_only last).
- name: "Play 2b - Update Database Nodes"
  hosts: database
  gather_facts: false
  # Consistent with Play 2: a database node that fails to take the update must
  # stop the rollout rather than leave the fleet diverged (#10026).
  any_errors_fatal: true

  tasks:
    - name: "[PLAY 2b] Starting Database Node Update"
      ansible.builtin.debug:
        msg:
          - "======================================================="
          - "  PLAY 2b: Database Node Update (role-owned files)"
          - "======================================================="
          - "  Target: {{ inventory_hostname }}"

    # Applies the role's code_only task file — the systemd override, the backup
    # script and the ChromaDB credential file + unit — NEVER the full role,
    # whose provisioning half (the redis-stack package, service accounts, the
    # data directory and its recursive chown, the chroma venv and its package
    # installs) must not re-run on an already-installed box.
    #
    # `apply: {become: true}` because this play sets no play-level become, and a
    # bare `become` on include_role makes ansible reject the WHOLE playbook
    # ("'become' is not a valid attribute for a IncludeRole"), breaking every
    # self-update rather than just the task (#12886).
    - name: "[PLAY 2b] Database | Deploy role-owned service files (#13535)"
      ansible.builtin.include_role:
        name: redis
        tasks_from: code_only
        apply:
          become: true
      tags: [database, redis, chromadb, deploy]

    # Flush here rather than letting the handlers fall to the end of the play.
    # #12886 recorded both halves of why that matters: queued handlers are
    # DISCARDED when a later task aborts the play, and a handler that never ran
    # leaves a host holding a new credential file that nothing has read yet.
    # Flushing immediately after the only task that notifies makes the restart
    # part of the delivery instead of a hope, and keeps it before the assertions
    # below — which check the running unit, not the file on disk.
    - name: "[PLAY 2b] Database | Apply pending restarts before verifying (#13535)"
      ansible.builtin.meta: flush_handlers

    # =========================================================================
    # #12959 post-update delivery assertion.
    #
    # The expensive part of #13462 was not the missing fix — it was that the
    # update REPORTED SUCCESS while delivering nothing, so the chroma-auth work
    # was closed against a mechanism that could not deliver it and the symptom
    # was re-diagnosed later. This asserts an invariant the include above just
    # guaranteed, so a failure means delivery silently regressed.
    #
    # `executable: /bin/bash` is load-bearing (#12907): ansible.builtin.shell
    # runs under /bin/sh, which is dash on these hosts, and dash aborts on
    # `set -o pipefail` before the first echo — leaving the evidence empty and
    # every assertion gated on it silently skipped.
    # =========================================================================
    - name: "[PLAY 2b] Verify | Collect ChromaDB delivery evidence (#12513, #13535)"
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          envfile=$(systemctl cat autobot-chromadb 2>/dev/null \
            | sed -n 's/^EnvironmentFile=//p' | head -1)
          echo "envfile_declared=$(test -n "$envfile" && echo 1 || echo 0)"
          echo "envfile_optional=$(case "$envfile" in -*) echo 1 ;; *) echo 0 ;; esac)"
          echo "envfile_present=$(test -n "$envfile" \
            && test -f "${envfile#-}" && echo 1 || echo 0)"
      args:
        executable: /bin/bash
      register: chromadb_delivery_evidence
      become: true
      changed_when: false
      failed_when: false
      tags: [database, chromadb, verify]

    - name: "[PLAY 2b] Verify | ChromaDB unit carries its credential file (#12513, #13535)"
      ansible.builtin.assert:
        that:
          # rendered by roles/redis code_only above, from the unit template
          - "'envfile_declared=1' in chromadb_delivery_evidence.stdout"
          # `EnvironmentFile=-` is why a missing credential ran unauthenticated
          - "'envfile_optional=0' in chromadb_delivery_evidence.stdout"
          # written by _shared/tasks/write_chromadb_authn_env.yml
          - "'envfile_present=1' in chromadb_delivery_evidence.stdout"
        fail_msg: >-
          #13535: the update ran green but roles/redis code_only did not deliver
          the ChromaDB credential file the unit mandates — chroma is running
          unauthenticated or cannot start. Evidence:
          {{ chromadb_delivery_evidence.stdout | default('(none)') }}.
        success_msg: "ChromaDB unit + credential file delivered (#12513)"
      when: chromadb_delivery_evidence.stdout | default('') | trim | length > 0
      tags: [database, chromadb, verify]

    - name: "[PLAY 2b] Database Node Update Complete"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} updated"

# =============================================================================
# PLAY 3: Verify + Cleanup
# =============================================================================
- name: "Play 3 - Verify & Cleanup"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Wait for services to stabilize
      pause:
        seconds: 5

    - name: Check SLM health
      uri:
        url: "https://{{ slm_host }}/slm/api/health"
        validate_certs: false
      register: slm_health
      ignore_errors: true

    - name: Clean up deploy archives
      file:
        path: /tmp/autobot-deploy
        state: absent

    - name: Display update summary
      debug:
        msg:
          - ""
          - "======================================================="
          - "  Fleet Update Complete (Git-Based Deploy)"
          - "======================================================="
          - ""
          - "  Method:  GitHub pull → git archive"
          - "  SLM:     {{ slm_health.json.status | default('Check manually') }}"
          - "  Nodes:   {{ slm_health.json.nodes_online | default('?') }}/{{ slm_health.json.nodes_total | default('9') }}"
          - ""
          - "  SLM Admin:     https://{{ slm_host | default('(not-deployed)') }}/"
          - "  User Frontend: https://{{ frontend_host | default('(not-deployed)') }}/"
          - ""
