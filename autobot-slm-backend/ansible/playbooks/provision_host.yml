---
# AutoBot - AI-Powered Automation Platform
# Copyright (c) 2025 mrveiss
# Author: mrveiss
#
# Provision Host Playbook with Pre-Deployment Validation
# Initial setup of a new host with common role + service-specific role
# Includes pre-deployment validation to ensure all prerequisites are met (#4056)

# Pre-deployment validation (hosts must meet minimum requirements)
- name: "Pre-Deployment Validation"
  import_playbook: pre-deployment-validation.yml
  tags: ['pre-deployment', 'validation']

# Provision the host with required roles
- name: "Provision AutoBot Host"
  hosts: "{{ target_host | default('all') }}"
  gather_facts: true
  become: true

  vars:
    provision_timestamp: "{{ ansible_facts['date_time'].iso8601 }}"

  pre_tasks:
    - name: "Display provisioning information"
      debug:
        msg:
          - "========================================"
          - "AutoBot Host Provisioning"
          - "========================================"
          - "Target Host: {{ inventory_hostname }}"
          - "Host Role: {{ vm_role | default('undefined') }}"
          - "IP Address: {{ ansible_facts['default_ipv4'].address | default('N/A') }}"
          - "Timestamp: {{ provision_timestamp }}"
      tags: ['always']

  roles:
    - role: common
      tags: ['common', 'base']

    - role: frontend
      when: "'frontend' in group_names"
      tags: ['frontend']

    - role: redis
      when: "'database' in group_names"
      tags: ['redis', 'database']

    - role: npu-worker
      when: "'npu' in group_names"
      tags: ['npu-worker', 'npu']

    - role: ai-stack
      when: "'aiml' in group_names"
      tags: ['ai-stack', 'aiml']

    - role: browser
      when: "'browser' in group_names"
      tags: ['browser']

  post_tasks:
    - name: "Display provisioning summary"
      debug:
        msg:
          - "========================================"
          - "Provisioning Complete"
          - "========================================"
          - "Host: {{ inventory_hostname }}"
          - "Roles Applied: {{ ansible_facts['play_role_names'] | join(', ') }}"
          - "Status: Ready for deployment"
          - ""
          - "Next Steps:"
          - "1. Sync application code to host"
          - "2. Start services: ansible-playbook manage_services.yml -e 'target_host={{ inventory_hostname }} service_action=start'"
          - "3. Verify: ansible-playbook health-check.yml -e 'target_host={{ inventory_hostname }}'"
      tags: ['always']
