---
# Fix file ownership across all fleet nodes
# Usage: ansible-playbook -i inventory/slm-nodes.yml playbooks/fix-node-ownership.yml
# Limit to specific node: --limit npu-worker
#
# AutoBot - AI-Powered Automation Platform
# Author: mrveiss

# #11455: target `infrastructure` (not `infrastructure:!slm_server`). A co-located
# single-node host is in BOTH groups after #11436, so `!slm_server` wrongly
# excluded it and its /opt/autobot ownership was never fixed. A pure SLM
# controller is only in `slm_server` (not `infrastructure`), so it is still
# excluded — matching update-all-nodes.yml Play 2's membership model.
- name: "Fix AutoBot file ownership on all nodes"
  hosts: infrastructure
  gather_facts: false
  serial: 3

  tasks:
    - name: "Fix ownership on /opt/autobot"
      file:
        path: /opt/autobot
        owner: autobot
        group: autobot
        recurse: true
      become: true

    - name: "Verify ownership"
      command: stat -c '%U:%G' /opt/autobot
      register: owner_check
      changed_when: false

    - name: "Report"
      debug:
        msg: "{{ inventory_hostname }}: /opt/autobot owned by {{ owner_check.stdout }}"
