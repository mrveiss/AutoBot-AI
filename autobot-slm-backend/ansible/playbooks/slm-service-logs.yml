---
# SLM Service Logs Playbook
# Used by SLM API to fetch systemd journal logs for a service
# Related to Issue #728

- name: "SLM Get Service Logs"
  # #13786: `target` is supplied by the caller at run time, and no shipped
  # inventory defines it. As a bare name, a run that forgets to pass one matches
  # nothing and Ansible skips the play silently -- ok=0, changed=0, exit 0 --
  # which for a service-control playbook reads as "the restart succeeded".
  # Templated, an unset variable is an undefined-variable error instead.
  hosts: "{{ target }}"
  gather_facts: false
  become: true

  vars:
    service_name: "{{ service | mandatory }}"
    log_lines: "{{ lines | default(100) }}"
    since_time: "{{ since | default('') }}"

  tasks:
    - name: "Build journalctl command"
      ansible.builtin.set_fact:
        journal_cmd: >-
          journalctl -u {{ service_name }}
          -n {{ log_lines }}
          --no-pager
          {{ '--since=' ~ since_time if since_time else '' }}

    - name: "Fetch service logs"
      ansible.builtin.shell: "{{ journal_cmd }}"
      register: logs_output
      changed_when: false
      failed_when: false

    - name: "Output logs"
      ansible.builtin.debug:
        var: logs_output.stdout
