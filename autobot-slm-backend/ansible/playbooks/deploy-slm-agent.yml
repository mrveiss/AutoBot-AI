---
# SLM Agent Deployment Playbook
# Deploys the SLM node agent to managed hosts
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/deploy-slm-agent.yml
#
# Required variables per host:
#   slm_node_id: Unique identifier for the node (e.g., "vm1-frontend")
#
# Optional variables:
#   slm_services_to_monitor: List of systemd services to monitor
#   slm_heartbeat_interval: Heartbeat interval in seconds (default: 30)

- name: Deploy SLM Agent to managed nodes
  hosts: slm_nodes
  become: true

  pre_tasks:
    - name: Ensure Python is available
      raw: test -e /usr/bin/python3 || (apt-get update && apt-get install -y python3)
      changed_when: false

  roles:
    - role: common
      tags: ['common']

  tasks:
    # The agent imports autobot_shared (#18611); the same tasks enrollment runs. Not the
    # autobot_shared role: its restart backend/celery handlers do not exist on agent-only nodes.
    - name: Install autobot_shared for the agent
      # Static import: the path is resolved (and checked by --syntax-check) at parse
      # time, relative to this playbook, and tags apply to every imported task.
      ansible.builtin.import_tasks: ../roles/_shared/tasks/install_agent_autobot_shared.yml
      tags: ['slm_agent', 'autobot_shared']

    - name: Deploy the SLM agent (slm_agent role)
      ansible.builtin.import_role:
        name: slm_agent
      tags: ['slm_agent']

  post_tasks:
    - name: Verify agent is running
      command: systemctl is-active slm-agent
      register: agent_status
      changed_when: false
      failed_when: agent_status.rc != 0

    - name: Display agent status
      debug:
        msg: "SLM Agent on {{ inventory_hostname }} ({{ slm_node_id }}): {{ agent_status.stdout }}"
