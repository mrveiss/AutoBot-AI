---

# -------------------------------------------------------------------
# Pre-flight: Sync code_source from GitHub before roles run (#3604)
# -------------------------------------------------------------------
- name: "Pre-flight: Sync code_source"
  import_playbook: pre-flight-code-sync.yml
  tags: ['pre-flight']

# -------------------------------------------------------------------
# Pre-flight: Validate system requirements before deployment (#4056)
# -------------------------------------------------------------------
- name: "Pre-deployment: System Validation"
  import_playbook: pre-deployment-validation.yml
  tags: ['pre-deployment', 'validation']

# AutoBot Full Deployment Playbook
# Orchestrates complete migration from Docker containers to target hosts/VMs.
#
# DEPRECATION NOTICE: This playbook encodes the obsolete separated multi-VM
# topology (one role per VM). AutoBot now deploys co-located, orchestrated by
# the SLM, onto one or more hosts (co-located or distributed). Requirements are
# a supported OS + hardware; the deployment is hypervisor-agnostic. Retained for
# reference and legacy migrations — do not delete.

- name: "AutoBot Full Deployment - Docker to VM Migration"
  hosts: localhost
  gather_facts: false
  vars:
    deployment_start_time: "{{ ansible_facts['date_time'].epoch }}"
    deployment_id: "autobot-{{ ansible_facts['date_time'].date }}-{{ ansible_facts['date_time'].time | replace(':', '') }}"

  tasks:
    - name: Display deployment information
      debug:
        msg:
          - "🤖 AutoBot Deployment Starting"
          - "Deployment ID: {{ deployment_id }}"
          - "Timestamp: {{ ansible_facts['date_time'].iso8601 }}"
          - "Target Infrastructure: one or more hosts (co-located or distributed)"
          - "Migration: Docker Containers → Virtual Machines"

    - name: Create deployment log directory
      file:
        path: "/var/log/autobot/deployment"
        state: directory
        mode: '0755'
      become: true

    - name: Log deployment start
      copy:
        content: |
          Deployment ID: {{ deployment_id }}
          Start Time: {{ ansible_facts['date_time'].iso8601 }}
          Infrastructure: one or more hosts (co-located or distributed)
          Migration: Docker → VM
        dest: "/var/log/autobot/deployment/{{ deployment_id }}.log"
        mode: '0644'
      become: true

# Phase 1: Base System Preparation
- name: "Phase 1: Base System Setup"
  import_playbook: deploy-base.yml
  vars:
    deployment_phase: "base-system"
    phase_description: "Ubuntu base system, security, users, networking"

# Phase 2: Database Infrastructure
- name: "Phase 2: Database Infrastructure"
  import_playbook: deploy-database.yml
  vars:
    deployment_phase: "database"
    phase_description: "Redis Stack, data persistence, model storage"

# Phase 2.5: Service Authentication Keys (#1734)
# Must run after database (Redis needed for key storage) and before backend
# (backend reads keys on startup). Generates keys, stores in Redis, deploys
# .env key files to each VM via the service_auth role.
- name: "Phase 2.5: Service Authentication"
  import_playbook: deploy-service-auth.yml
  vars:
    deployment_phase: "service-auth"
    phase_description: "Generate and deploy service-to-service auth keys"

# Phase 3: Backend Services
- name: "Phase 3: Backend Services"
  import_playbook: deploy-backend.yml
  vars:
    deployment_phase: "backend"
    phase_description: "FastAPI, Python services, log aggregation"

# Phase 4: AI/ML Services
- name: "Phase 4: AI/ML Infrastructure"
  import_playbook: deploy-aiml.yml
  vars:
    deployment_phase: "aiml"
    phase_description: "AI Stack, NPU Worker, Intel OpenVINO"

# Phase 5: Frontend Services
- name: "Phase 5: Frontend Infrastructure"
  import_playbook: deploy-frontend.yml
  vars:
    deployment_phase: "frontend"
    phase_description: "Vue.js frontend, nginx, DNS cache"

# Phase 6: Browser Automation
- name: "Phase 6: Browser Automation"
  import_playbook: deploy-browser.yml
  vars:
    deployment_phase: "browser"
    phase_description: "Playwright, VNC server, desktop environment"

# Phase 7: Data Migration
- name: "Phase 7: Data Migration"
  import_playbook: data-migration.yml
  vars:
    deployment_phase: "data-migration"
    phase_description: "Migrate data from Docker containers"

# Phase 8: Service Integration
- name: "Phase 8: Service Integration and Startup"
  hosts: all
  gather_facts: false
  serial: 1
  vars:
    service_startup_order:
      1: ["database"]
      2: ["backend", "aiml"]
      3: ["frontend"]
      4: ["browser"]

  tasks:
    - name: Display service startup phase
      debug:
        msg: "🚀 Starting AutoBot services in dependency order"
      run_once: true

    - name: Start database services (Phase 1)
      systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - "redis-stack-server"
      when: inventory_hostname in groups['database']
      become: true

    - name: Wait for database readiness
      wait_for:
        host: "{{ redis_host }}"
        port: "{{ redis_port }}"
        timeout: 60
      delegate_to: localhost
      run_once: true

    - name: Start backend and AI/ML services (Phase 2)
      systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - "autobot-backend"
      when: inventory_hostname in groups['backend']
      become: true

    - name: Start AI/ML services (Phase 2)
      systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - "autobot-chromadb"
        - "autobot-ai-stack"
      when: inventory_hostname in groups['aiml']
      become: true

    - name: Start NPU and TTS services (Phase 2)
      systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - "autobot-npu-worker"
        - "autobot-tts-worker"
      when: inventory_hostname in groups['npu']
      become: true

    - name: Wait for backend readiness
      wait_for:
        host: "{{ backend_host }}"
        port: "{{ backend_port }}"
        timeout: 60
      delegate_to: localhost
      run_once: true

    - name: Start frontend services (Phase 3)
      systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - "nginx"
        - "autobot-frontend"
      when: inventory_hostname in groups['frontend']
      become: true

    - name: Start browser services (Phase 4)
      systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - "autobot-vnc-server"
        - "autobot-playwright"
      when: inventory_hostname in groups['browser']
      become: true

# Phase 9: Health Validation
- name: "Phase 9: Health Check and Validation"
  import_playbook: health-check.yml
  vars:
    deployment_phase: "validation"
    phase_description: "Service health checks and integration testing"

# Phase 10: Deployment Summary
- name: "Phase 10: Deployment Summary"
  hosts: localhost
  gather_facts: false
  vars:
    deployment_end_time: "{{ ansible_facts['date_time'].epoch }}"
    # Short aliases for inventory-derived IPs (no hardcoded addresses)
    _frontend_ip: "{{ frontend_host }}"
    _backend_ip: "{{ backend_host }}"
    _redis_ip: "{{ redis_host }}"
    _aiml_ip: "{{ ai_stack_host }}"
    _npu_ip: "{{ npu_worker_host }}"
    _browser_ip: "{{ browser_host }}"
    _backend_port: "{{ backend_port }}"
    _redis_port: "{{ redis_port }}"
    _redis_insight_port: "{{ hostvars['autobot-database']['redis_insight_port'] }}"
    _ai_stack_port: "{{ ai_stack_port }}"
    _npu_worker_port: "{{ npu_worker_port }}"
    _browser_port: "{{ browser_port }}"
    _vnc_port: "{{ hostvars['autobot-browser']['vnc_port'] }}"

  tasks:
    - name: Calculate deployment duration
      set_fact:
        deployment_duration: "{{ (deployment_end_time | int) - (deployment_start_time | int) }}"

    - name: Display deployment summary
      debug:
        msg:
          - "🎉 AutoBot Deployment Completed Successfully!"
          - "======================================================"
          - ""
          - "⏱️  Deployment Duration: {{ deployment_duration }} seconds ({{ (deployment_duration | int / 60) | round(1) }} minutes)"
          - "🆔 Deployment ID: {{ deployment_id }}"
          - "📅 Completed: {{ ansible_facts['date_time'].iso8601 }}"
          - ""
          - "🌐 Service Endpoints:"
          - "   Frontend:     http://{{ _frontend_ip }}"
          - "   Backend API:  https://{{ _backend_ip }}:{{ _backend_port }}/api"
          - "   Redis Stack:  redis://{{ _redis_ip }}:{{ _redis_port }}"
          - "   RedisInsight:  http://{{ _redis_ip }}:{{ _redis_insight_port }}"
          - "   AI Stack:     http://{{ _aiml_ip }}:{{ _ai_stack_port }}"
          - "   NPU Worker:   http://{{ _npu_ip }}:{{ _npu_worker_port }}"
          - "   Browser API:  http://{{ _browser_ip }}:{{ _browser_port }}"
          - "   VNC Access:   vnc://{{ _browser_ip }}:{{ _vnc_port }}"
          - ""
          - "🖥️  SSH Access:"
          - "   Frontend:     ssh autobot@{{ _frontend_ip }}"
          - "   Backend:      ssh autobot@{{ _backend_ip }}"
          - "   Database:     ssh autobot@{{ _redis_ip }}"
          - "   AI/ML:        ssh autobot@{{ _aiml_ip }}"
          - "   Browser:      ssh autobot@{{ _browser_ip }}"
          - ""
          - "✅ Migration Status: Docker Containers → VMs Complete"
          - "📊 Performance: Dedicated resources, native VM performance"
          - "🔒 Security: Internal network isolation, firewall protection"
          - "📈 Scalability: Independent VM scaling and resource allocation"
          - ""
          - "🔧 Next Steps:"
          - "   1. Access AutoBot UI at http://{{ _frontend_ip }}"
          - "   2. Verify all services: ./deploy.sh --health-check"
          - "   3. Setup monitoring dashboards"
          - "   4. Configure automated backups"
          - "   5. Update DNS entries if needed"

    - name: Log deployment completion
      copy:
        content: |
          Deployment ID: {{ deployment_id }}
          Start Time: {{ hostvars['localhost']['deployment_start_time'] }}
          End Time: {{ deployment_end_time }}
          Duration: {{ deployment_duration }} seconds
          Status: SUCCESS

          Service Endpoints:
          - Frontend: http://{{ _frontend_ip }}
          - Backend: https://{{ _backend_ip }}:{{ _backend_port }}
          - Redis: redis://{{ _redis_ip }}:{{ _redis_port }}
          - AI Stack: http://{{ _aiml_ip }}:{{ _ai_stack_port }}
          - NPU Worker: http://{{ _npu_ip }}:{{ _npu_worker_port }}
          - Browser: http://{{ _browser_ip }}:{{ _browser_port }}
          - VNC: vnc://{{ _browser_ip }}:{{ _vnc_port }}

          Migration: Docker Containers → VMs
          Infrastructure: Production-ready with monitoring and backups
        dest: "/var/log/autobot/deployment/{{ deployment_id }}-complete.log"
        mode: '0644'
      become: true

    - name: Create deployment success marker
      file:
        path: "/etc/autobot/deployment-{{ deployment_id }}.success"
        state: touch
        mode: '0644'
      become: true

# Final Notes Display
- name: "Final Deployment Notes"
  hosts: localhost
  gather_facts: false
  vars:
    # Short aliases for inventory-derived IPs (no hardcoded addresses)
    _frontend_ip: "{{ frontend_host }}"
    _redis_ip: "{{ redis_host }}"
    _aiml_ip: "{{ ai_stack_host }}"
    _ai_stack_port: "{{ ai_stack_port }}"

  tasks:
    - name: Display important post-deployment information
      debug:
        msg:
          - ""
          - "🔍 IMPORTANT: Post-Deployment Checklist"
          - "============================================"
          - ""
          - "1. 🌐 Web Access:"
          - "   - Open http://{{ _frontend_ip }} in your browser"
          - "   - Verify frontend loads correctly"
          - "   - Test API connectivity through UI"
          - ""
          - "2. 🏥 Health Monitoring:"
          - "   - Run: ./deploy.sh --health-check"
          - "   - Monitor service logs: journalctl -u autobot-*"
          - "   - Check system resources: htop on each VM"
          - ""
          - "3. 💾 Data Verification:"
          - "   - Verify Redis data: redis-cli -h {{ _redis_ip }}"
          - "   - Check model files: ls -la /var/lib/autobot-ai/models"
          - "   - Validate knowledge base: API call to /api/knowledge"
          - ""
          - "4. 🔐 Security Review:"
          - "   - Verify firewall rules: ufw status on each VM"
          - "   - Check SSH access: ssh-agent and key forwarding"
          - "   - Review service permissions and file ownership"
          - ""
          - "5. 📊 Performance Testing:"
          - "   - Load test frontend: ab -n 100 -c 10 http://{{ _frontend_ip }}/"
          - "   - Test AI inference: curl http://{{ _aiml_ip }}:{{ _ai_stack_port }}/health"
          - "   - Monitor resource usage during load"
          - ""
          - "6. 🚨 Backup Configuration:"
          - "   - Setup automated backups: ./utils/setup-backups.sh"
          - "   - Test backup/restore procedures"
          - "   - Configure backup notifications"
          - ""
          - "For support and troubleshooting, see:"
          - "  - ansible/README.md"
          - "  - /var/log/autobot/deployment/{{ deployment_id }}.log"
          - "  - Individual service logs in /var/log/autobot/"
