# ---------------------------------------------------------------------------
# Post-cleanup: snapshot /opt/autobot/ on all nodes + summary
# ---------------------------------------------------------------------------
- name: "Post-cleanup: Verify /opt/autobot/ layout"
  hosts: slm_nodes
  gather_facts: false
  become: true

  tasks:
    - name: "Verify | List /opt/autobot/ after cleanup"
      ansible.builtin.command:
        cmd: ls -1 /opt/autobot/
      register: post_snapshot
      changed_when: false
      failed_when: false

    - name: "Verify | Show post-cleanup state"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} [AFTER]: {{ post_snapshot.stdout_lines | default([]) }}"

- name: "Summary"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: "Display cleanup summary"
      ansible.builtin.debug:
        msg:
          - ""
          - "Fleet Node Cleanup Complete (Issue #926 Phase 6)"
          - ""
          - "Cleaned nodes:"
          - "  SLM Manager    - removed wrong-node/legacy role dirs"
          - "  01-Backend     - removed legacy dirs + flat Python files"
          - "  02-Frontend    - removed wrong-node autobot-slm-frontend"
          - "  npu-worker     - removed legacy npu-worker dir"
          - "  04-Databases   - removed wrong-node/legacy dirs"
          - "  03-AI-Stack    - removed legacy ai-stack dir"
          - "  browser-automation - removed legacy browser-service dir"
          - ""
          - "Any directory holding data/ was REPORTED and left in place, not removed"
          - "(#14856). Look for 'REFUSING to delete' above — those paths still need"
          - "a deliberate decision about their contents."
          - ""
          - "Run 'ansible-playbook playbooks/cleanup-nodes.yml --check'"
          - "to preview changes without modifying nodes."
          - ""
