# ---------------------------------------------------------------------------
# Play 6: Databases — remove wrong-node and legacy dirs
# ---------------------------------------------------------------------------
- name: "Cleanup: 04-Databases"
  hosts: 04-Databases
  gather_facts: false
  become: true

  tasks:
    # The database node is where the guard below matters most: these paths carry
    # live Redis and PostgreSQL state, and this play used to remove them with no
    # condition at all while a comment asserted it did not (#14856).
    - name: "Databases | Clean: remove wrong-node, legacy and stale dirs (#14856)"
      ansible.builtin.include_tasks: ../roles/_shared/tasks/remove_component_dir.yml
      loop:
        - {dir: autobot-backend, why: "wrong node — the user backend does not run on the database node"}
        - {dir: autobot-frontend, why: "wrong node — the user frontend does not run on the database node"}
        - {dir: autobot-slm-backend, why: "wrong node — the SLM backend does not run on the database node"}
        - {dir: npu-worker, why: "legacy pre-rename path for autobot-npu-worker"}
        - {dir: browser-service, why: "legacy pre-rename path for autobot-browser-worker"}
        - {dir: ai-stack, why: "legacy pre-rename path for autobot-ai-stack"}
        - {dir: scripts, why: "stale loose directory at the /opt/autobot root"}
        - {dir: config, why: "stale loose directory at the /opt/autobot root"}
      loop_control:
        loop_var: _cleanup_target
        label: "{{ _cleanup_target.dir }}"
      vars:
        caller_role: Databases
        remove_dir_path: "/opt/autobot/{{ _cleanup_target.dir }}"
        remove_reason: "{{ _cleanup_target.why }}"

