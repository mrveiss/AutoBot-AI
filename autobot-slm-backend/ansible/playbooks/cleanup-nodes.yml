# AutoBot - AI-Powered Automation Platform
# Author: mrveiss
#
# Node Cleanup Playbook (Issue #926 Phase 6)
#
# Removes legacy directories, wrong-node role dirs, and stale loose files
# from all fleet nodes, then reports the resulting /opt/autobot/ layout.
#
# WARNING: This playbook is for MULTI-NODE deployments ONLY.
# Each play targets a specific host group (slm_server, 01-Backend, etc.)
# and removes directories that should NOT exist on that node. Do NOT run this
# on a single-host deployment — it is aimed at co-located role directories.
# For single-host safety, use the role-level clean.yml tasks which check the
# role-active facts before removing cross-role directories (#2836).
#
# Usage:
#   cd autobot-slm-backend/ansible
#   ansible-playbook playbooks/cleanup-nodes.yml -i inventory/slm-nodes.yml
#
#   # Single node:
#   ansible-playbook playbooks/cleanup-nodes.yml -i inventory/slm-nodes.yml \
#     --limit 02-Frontend
#
#   # Dry run (check mode - shows what WOULD be removed):
#   ansible-playbook playbooks/cleanup-nodes.yml -i inventory/slm-nodes.yml \
#     --check
#
# #14856: every removal below used to be an unconditional `state: absent` on a
# component directory, while this file's own header and closing summary told the
# operator that "data/ and logs/ are NEVER removed (contain runtime data)". That
# was a claim in the prose, not a condition in the code — `state: absent` on
# /opt/autobot/autobot-backend takes data/unified_memory.db,
# data/conversation_files.db, data/transcriber.db and data/service-keys with it,
# and on /opt/autobot/autobot-slm-backend it takes data/.slm_keys.
#
# The removals now delegate to roles/_shared/tasks/remove_component_dir.yml,
# which probes for data/ and refuses rather than deleting. The promise below is
# now enforced by the code that makes it.
#
# Safety notes:
#   - A directory holding data/ is REPORTED and left alone, never removed
#   - All removals use state: absent (idempotent, no error if already gone)
#   - Run with --check first to preview changes

# ---------------------------------------------------------------------------
# Pre-cleanup: snapshot /opt/autobot/ on all nodes
# ---------------------------------------------------------------------------
- name: "Pre-cleanup: Record current /opt/autobot/ layout"
  hosts: slm_nodes
  gather_facts: false
  become: true

  tasks:
    - name: "Snapshot | List /opt/autobot/ before cleanup"
      ansible.builtin.command:
        cmd: ls -1 /opt/autobot/
      register: pre_snapshot
      changed_when: false
      failed_when: false

    - name: "Snapshot | Show pre-cleanup state"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} [BEFORE]: {{ pre_snapshot.stdout_lines | default([]) }}"

# ---------------------------------------------------------------------------
# Play 1: SLM Manager — remove wrong-node and legacy dirs
# ---------------------------------------------------------------------------
- name: "Cleanup: SLM Manager (slm_server)"
  hosts: slm_server
  gather_facts: false
  become: true

  tasks:
    - name: "SLM | Clean: remove wrong-node, legacy and stale dirs (#14856)"
      ansible.builtin.include_tasks: ../roles/_shared/tasks/remove_component_dir.yml
      loop:
        - {dir: autobot-backend, why: "wrong node — the user backend does not run on the SLM manager"}
        - {dir: autobot-frontend, why: "wrong node — the user frontend does not run on the SLM manager"}
        - {dir: autobot-user-backend, why: "legacy pre-rename path for autobot-backend"}
        - {dir: autobot-user-frontend, why: "legacy pre-rename path for autobot-frontend"}
        - {dir: npu-worker, why: "legacy pre-rename path for autobot-npu-worker"}
        - {dir: browser-service, why: "legacy pre-rename path for autobot-browser-worker"}
        - {dir: ai-stack, why: "legacy pre-rename path for autobot-ai-stack"}
        - {dir: autobot-npu-worker, why: "wrong node — the NPU worker does not run on the SLM manager"}
        - {dir: autobot-browser-worker, why: "wrong node — the browser worker does not run on the SLM manager"}
        - {dir: scripts, why: "stale loose directory at the /opt/autobot root"}
        - {dir: config, why: "stale loose directory at the /opt/autobot root"}
      loop_control:
        loop_var: _cleanup_target
        label: "{{ _cleanup_target.dir }}"
      vars:
        caller_role: SLM
        remove_dir_path: "/opt/autobot/{{ _cleanup_target.dir }}"
        remove_reason: "{{ _cleanup_target.why }}"

# ---------------------------------------------------------------------------
# Play 2: Backend — remove legacy dirs + flat Python files
# ---------------------------------------------------------------------------
- name: "Cleanup: 01-Backend"
  hosts: 01-Backend
  gather_facts: false
  become: true

  tasks:
    - name: "Backend | Clean: remove wrong-node, legacy and stale dirs (#14856)"
      ansible.builtin.include_tasks: ../roles/_shared/tasks/remove_component_dir.yml
      loop:
        - {dir: npu-worker, why: "legacy pre-rename path for autobot-npu-worker"}
        - {dir: browser-service, why: "legacy pre-rename path for autobot-browser-worker"}
        - {dir: ai-stack, why: "legacy pre-rename path for autobot-ai-stack"}
        - {dir: autobot-user-backend, why: "legacy pre-rename path for autobot-backend"}
        - {dir: autobot-slm-frontend, why: "wrong node — the SLM frontend does not run on the backend node"}
        - {dir: autobot-slm-backend, why: "wrong node — the SLM backend does not run on the backend node"}
        - {dir: scripts, why: "stale loose directory at the /opt/autobot root"}
        - {dir: config, why: "stale loose directory at the /opt/autobot root"}
      loop_control:
        loop_var: _cleanup_target
        label: "{{ _cleanup_target.dir }}"
      vars:
        caller_role: Backend
        remove_dir_path: "/opt/autobot/{{ _cleanup_target.dir }}"
        remove_reason: "{{ _cleanup_target.why }}"

    - name: "Backend | Find flat Python files at /opt/autobot root"
      ansible.builtin.find:
        paths: /opt/autobot
        patterns: "*.py"
        file_type: file
        depth: 1
      register: flat_py_files
      failed_when: false

    - name: "Backend | Report flat Python files found"
      ansible.builtin.debug:
        msg: "Found flat Python file to remove: {{ item.path }}"
      loop: "{{ flat_py_files.files | default([]) }}"

    # Loose *.py files at the /opt/autobot root are not component directories —
    # nothing keeps state in them — so these do not go through the component
    # guard. `file_type: file` and `depth: 1` keep the match to exactly that.
    - name: "Backend | Remove flat Python files at /opt/autobot root"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ flat_py_files.files | default([]) }}"

# ---------------------------------------------------------------------------
# Play 3: Frontend — remove wrong-node autobot-slm-frontend and others
# ---------------------------------------------------------------------------
- name: "Cleanup: 02-Frontend"
  hosts: 02-Frontend
  gather_facts: false
  become: true

  tasks:
    - name: "Frontend | Clean: remove wrong-node, legacy and stale dirs (#14856)"
      ansible.builtin.include_tasks: ../roles/_shared/tasks/remove_component_dir.yml
      loop:
        - {dir: autobot-user-frontend, why: "legacy pre-rename path for autobot-frontend"}
        - {dir: autobot-slm-frontend, why: "wrong node — the SLM frontend does not run on the frontend node"}
        - {dir: autobot-slm-backend, why: "wrong node — the SLM backend does not run on the frontend node"}
        - {dir: autobot-backend, why: "wrong node — the user backend does not run on the frontend node"}
        - {dir: npu-worker, why: "legacy pre-rename path for autobot-npu-worker"}
        - {dir: browser-service, why: "legacy pre-rename path for autobot-browser-worker"}
        - {dir: scripts, why: "stale loose directory at the /opt/autobot root"}
        - {dir: config, why: "stale loose directory at the /opt/autobot root"}
      loop_control:
        loop_var: _cleanup_target
        label: "{{ _cleanup_target.dir }}"
      vars:
        caller_role: Frontend
        remove_dir_path: "/opt/autobot/{{ _cleanup_target.dir }}"
        remove_reason: "{{ _cleanup_target.why }}"

