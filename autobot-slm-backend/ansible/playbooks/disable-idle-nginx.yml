#
# Issue #1104: Disable idle nginx on worker nodes (.22, .24, .25)
# These nodes have nginx installed but serve zero real traffic.
# Removing reduces attack surface and eliminates false positives in scans.
---
- name: "Disable idle nginx on worker nodes"
  hosts: npu,aiml,browser
  become: true
  gather_facts: false

  tasks:
    - name: "Check if nginx is installed"
      ansible.builtin.command:
        cmd: "dpkg-query -W --showformat=${Status} nginx"
      # (#17387) `dpkg -l <pkg>` answers "does dpkg KNOW this package", NOT "is
      # it installed": a package removed without --purge stays in the database
      # in `rc` state (`deinstall ok config-files`) and `dpkg -l` still exits 0.
      # The comment this replaces asserted the opposite and was copied into four
      # roles, so the false premise propagated with it. `${Status}`
      # distinguishes all three states; `rc` collapsed them into two, and
      # grouped the wrong two.
      register: _nginx_installed
      changed_when: false
      failed_when: false

    - name: "Stop and disable nginx"
      ansible.builtin.systemd:
        name: nginx
        state: stopped
        enabled: false
      when: "'ok installed' in _nginx_installed.stdout"

    - name: "Report nginx status"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: nginx
          {{ 'was stopped and disabled' if 'ok installed' in _nginx_installed.stdout
             else 'not installed (no action needed)' }}
