#
# Provision the user backend's full-user-management database (autobot_app /
# autobot_users) on a COLLAPSED SINGLE-BOX deployment, alongside the SLM's
# own database (slm_app) on the SAME PostgreSQL instance. (#10636)
#
# AutoBot always runs full user management — there is no single_user mode.
# On multi-VM fleets autobot_users lives on its own instance and is
# provisioned by deploy-user-management-db.yml Phase 2. On a single box that
# instance is shared with the SLM, so we must:
#   * add autobot_app's pg_hba rules NON-destructively via
#     community.postgresql.postgresql_pg_hba (edits in place, never rewrites
#     the file) so the SLM's slm_app + remote-access lines stay intact, and
#   * store autobot creds in a SEPARATE file so the SLM's
#     db-credentials.env is never clobbered.
# We deliberately do NOT redeploy postgresql.conf here (reload, not restart)
# to avoid disturbing the live SLM database.
#
# Usage:
#   ansible-playbook -i inventory/slm-nodes.yml playbooks/provision-backend-db-single-box.yml
---
- name: "Provision backend full-user-management DB on the single-box instance"
  hosts: slm_server
  become: true
  gather_facts: false

  vars:
    autobot_db_user: autobot_app
    autobot_db_name: autobot_users
    autobot_creds_file: /etc/autobot/autobot-db-credentials.env
    pg_hba_path: "/etc/postgresql/{{ postgresql_version | default('16') }}/main/pg_hba.conf"

  tasks:
    - name: "Read existing autobot_app password (idempotent reuse)"
      ansible.builtin.shell:
        cmd: "grep '^AUTOBOT_DB_PASSWORD=' {{ autobot_creds_file }} | cut -d= -f2"
      register: _existing_autobot_pw
      changed_when: false
      failed_when: false
      no_log: true

    - name: "Resolve autobot_app password (reuse or generate)"
      ansible.builtin.set_fact:
        autobot_db_password: >-
          {{ (_existing_autobot_pw.stdout | trim)
             if (_existing_autobot_pw.stdout | default('') | trim | length > 0)
             else lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}
      no_log: true

    - name: "Create autobot_app role"
      community.postgresql.postgresql_user:
        name: "{{ autobot_db_user }}"
        password: "{{ autobot_db_password }}"
        state: present
        login_unix_socket: /var/run/postgresql
      become_user: postgres
      no_log: true

    - name: "Ensure autobot_users database exists"
      community.postgresql.postgresql_db:
        name: "{{ autobot_db_name }}"
        encoding: UTF8
        state: present
        login_unix_socket: /var/run/postgresql
      become_user: postgres

    - name: "Grant autobot_app privileges on autobot_users"
      community.postgresql.postgresql_privs:
        database: "{{ autobot_db_name }}"
        privs: ALL
        type: database
        role: "{{ autobot_db_user }}"
        login_unix_socket: /var/run/postgresql
      become_user: postgres

    # Add ONLY autobot_app's entries, leaving every existing line (the SLM's
    # slm_app local/host and any remote-access entries) untouched. This is
    # non-destructive — unlike rendering the whole template — so the live SLM
    # database is never cut off. (#10636, review of #10640)
    - name: "Add pg_hba entries for autobot_app (non-destructive)"
      community.postgresql.postgresql_pg_hba:
        dest: "{{ pg_hba_path }}"
        contype: "{{ item.contype }}"
        users: "{{ autobot_db_user }}"
        databases: all
        address: "{{ item.address | default(omit) }}"
        method: scram-sha-256
        state: present
        backup: true
      loop:
        - { contype: local }
        - { contype: host, address: "127.0.0.1/32" }
        - { contype: host, address: "::1/128" }
      become_user: postgres
      notify: Reload PostgreSQL

    - name: "Write autobot-db-credentials.env (separate from SLM creds)"
      ansible.builtin.copy:
        dest: "{{ autobot_creds_file }}"
        owner: autobot
        group: autobot
        mode: '0600'
        content: |
          # AutoBot - autobot_app full-user-management credentials
          # Generated by Ansible - Do not edit manually
          AUTOBOT_DB_HOST=127.0.0.1
          AUTOBOT_DB_PORT=5432
          AUTOBOT_DB_USER={{ autobot_db_user }}
          AUTOBOT_DB_PASSWORD={{ autobot_db_password }}
          AUTOBOT_DB_NAME={{ autobot_db_name }}
          AUTOBOT_DATABASE_URL=postgresql+asyncpg://{{ autobot_db_user }}:{{ autobot_db_password }}@127.0.0.1:5432/{{ autobot_db_name }}
      no_log: true

    - name: "Verify autobot_app can connect to autobot_users"
      community.postgresql.postgresql_ping:
        db: "{{ autobot_db_name }}"
        login_user: "{{ autobot_db_user }}"
        login_password: "{{ autobot_db_password }}"
        login_host: 127.0.0.1
      no_log: true

  handlers:
    - name: Reload PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        state: reloaded
