---
# Sync User Backend Code to Main Server
# Syncs autobot-backend and autobot_shared from local machine to /opt/autobot
# This playbook runs locally on the WSL machine (backend host)

- name: Sync User Backend Code
  hosts: autobot-host
  gather_facts: false
  vars:
    local_autobot_root: "${AUTOBOT_PROJECT_ROOT:-/opt/autobot/code_source}"
    backend_user: "autobot"
    # #13539/B3: this play never renders roles/backend templates, but the
    # var name backend_install_dir is reserved elsewhere in this repo for the
    # BACKEND COMPONENT directory (roles/backend/defaults/main.yml) -- using it
    # here for the deploy root is exactly the two-meanings hazard B3 exists to
    # remove, so this play names the root explicitly instead.
    backend_deployed_root: "/opt/autobot"
    backend_host: "{{ hostvars[groups['backend'][0]]['ansible_host'] | default('127.0.0.1') }}"

  tasks:
    - name: Stop backend service before sync
      ansible.builtin.systemd:
        name: autobot-backend
        state: stopped
      become: true
      ignore_errors: true  # Service might not be running

    - name: Clean up problematic symlinks
      ansible.builtin.file:
        path: "/opt/autobot/autobot-backend/{{ item }}"
        state: absent
      loop:
        - autobot_shared
        - backend
      become: true
      ignore_errors: true

    - name: Sync code using direct sudo rsync
      ansible.builtin.shell: |
        sudo rsync -a --delete \
          --exclude=.git \
          --exclude=__pycache__ \
          --exclude='*.pyc' \
          --exclude=.pytest_cache \
          --exclude=venv \
          --exclude=.env \
          --exclude=data \
          --exclude=logs \
          {{ local_autobot_root }}/autobot-backend/ \
          {{ backend_deployed_root }}/autobot-backend/

        sudo rsync -a --delete \
          --exclude=.git \
          --exclude=__pycache__ \
          --exclude='*.pyc' \
          {{ local_autobot_root }}/autobot_shared/ \
          {{ backend_deployed_root }}/autobot_shared/
      register: sync_result
      changed_when: true

    - name: Fix ownership of synced files
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ backend_user }}"
        group: "{{ backend_user }}"
        recurse: true
      loop:
        - "{{ backend_deployed_root }}/autobot-backend"
        - "{{ backend_deployed_root }}/autobot_shared"
      become: true

    - name: Start backend service
      ansible.builtin.systemd:
        name: autobot-backend
        state: started
      become: true

    - name: Wait for backend to initialize
      ansible.builtin.pause:
        seconds: 15

    - name: Check backend health
      ansible.builtin.uri:
        url: "http://{{ backend_host }}:8001/api/health"
        timeout: 5
      register: health_check
      ignore_errors: true
      retries: 5
      delay: 3
      until: health_check.status == 200

    - name: Display deployment result
      ansible.builtin.debug:
        msg:
          - "✅ Backend service stopped"
          - "✅ Code synchronized"
          - "✅ Ownership fixed"
          - "✅ Backend service started"
          - "Backend health: {{ health_check.status | default('Unknown - check logs') }}"
          - ""
          - "Test login:"
          - "curl -k -X POST https://{{ hostvars[groups['frontend'][0]]['ansible_host'] | default('127.0.0.1') }}/api/auth/login -H 'Content-Type: application/json' -d '{\"username\":\"admin\",\"password\":\"admin\"}'"
