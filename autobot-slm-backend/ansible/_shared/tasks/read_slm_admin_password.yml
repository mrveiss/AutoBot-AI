#
# #19318: the ONE place a playbook or role resolves the SLM admin password.
#
# Store of record: SLM_ADMIN_PASSWORD in the SLM's own slm-secrets.env. install.sh or
# roles/slm_manager generate it once, `autobot-admin.py reset-password` rewrites it, and
# the SLM backend loads the file as its EnvironmentFile and seeds/syncs the admin from it
# (main.py `_ensure_admin_user`). It is an auth-bootstrap credential -- it unlocks the SLM
# API the vault sits behind -- so it lives in that file, like SLM_SECRET_KEY, not in the
# vault (the #10088 auth-bootstrap class).
#
# Resolution, first non-empty wins. There is NO default password:
#   1. `slm_admin_password` already set (-e @file, install.sh's vars file, slm_manager's fact)
#   2. SLM_ADMIN_PASSWORD in the controller's slm-secrets.env. `delegate_to: localhost`
#      reaches the SLM's own file because the SLM runs every playbook -- including the
#      detached self-update, which forwards no environment (#11492). Same reach as
#      read_redis_password.yml.
#   3. SLM_ADMIN_PASSWORD in the controller environment (docker compose, dev checkout).
#   4. AUTOBOT_SLM_ADMIN_PASSWORD in the controller environment: DEPRECATED alias, kept
#      because install.sh documented it (#7057); warns.
#
# `require_slm_admin_password` (default true): unresolved -> fail naming the variable.
# false (best-effort sync tracking): unresolved -> warn and leave it empty, so the
# caller's login is refused instead of trying a guessed password.
---

- name: "Read SLM_ADMIN_PASSWORD from the SLM's slm-secrets.env (#19318)"
  ansible.builtin.shell:
    cmd: grep -oP '^SLM_ADMIN_PASSWORD=\K.*' /etc/autobot/slm-secrets.env 2>/dev/null || true
  register: _slm_admin_password_probe
  changed_when: false
  failed_when: false
  check_mode: false
  delegate_to: localhost
  run_once: true
  become: false
  no_log: true
  when: slm_admin_password | default('') | trim | length == 0

- name: "Resolve the SLM admin password -- never a default (#19318)"
  ansible.builtin.set_fact:
    slm_admin_password: >-
      {{ (slm_admin_password | default('') | trim)
         or (_slm_admin_password_probe.stdout | default('') | trim)
         or (lookup('env', 'SLM_ADMIN_PASSWORD') | trim)
         or (lookup('env', 'AUTOBOT_SLM_ADMIN_PASSWORD') | trim) }}
  no_log: true

- name: "Warn that AUTOBOT_SLM_ADMIN_PASSWORD is a deprecated alias (#19318)"
  ansible.builtin.debug:
    msg: "AUTOBOT_SLM_ADMIN_PASSWORD is deprecated: set SLM_ADMIN_PASSWORD instead (#19318)"
  run_once: true
  when:
    - lookup('env', 'AUTOBOT_SLM_ADMIN_PASSWORD') | length > 0
    - lookup('env', 'SLM_ADMIN_PASSWORD') | length == 0

- name: "Refuse to continue without the SLM admin password (#19318)"
  ansible.builtin.fail:
    msg: >-
      The SLM admin password is unset. Pass slm_admin_password in an -e @vars-file, set
      SLM_ADMIN_PASSWORD in the environment, or run where /etc/autobot/slm-secrets.env is
      readable. There is no default password (#19318).
  when:
    - require_slm_admin_password | default(true) | bool
    - slm_admin_password | length == 0

- name: "Warn that the SLM admin password is unset -- SLM login will be refused (#19318)"
  ansible.builtin.debug:
    msg: >-
      The SLM admin password is unset (no -e var, no readable slm-secrets.env, no
      SLM_ADMIN_PASSWORD): the SLM login below is refused and its sync tracking skipped (#19318).
  run_once: true
  when:
    - not (require_slm_admin_password | default(true) | bool)
    - slm_admin_password | length == 0
