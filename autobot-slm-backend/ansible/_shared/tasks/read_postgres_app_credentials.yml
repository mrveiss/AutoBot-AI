---
# #21089: the autobot_app Postgres password, read from the role-managed credentials file --
# the single authority the postgresql role applies to the database (#10636, #12520). One
# reader for every env that feeds a process which opens the user database (backend, ai-stack),
# so the two cannot drift. Included with `apply: tags`, as the root-key reader is.

- name: "Read role-managed AUTOBOT_DB_PASSWORD (single authority, #10636, #12520, #21089)"
  ansible.builtin.shell:
    cmd: >-
      grep -oP '^AUTOBOT_DB_PASSWORD=\K.*'
      /etc/autobot/autobot-db-credentials.env 2>/dev/null || true
  register: _postgres_app_password_file
  changed_when: false
  failed_when: false
  no_log: true

- name: "Expose the role-managed AUTOBOT_DB_PASSWORD (#21089)"
  ansible.builtin.set_fact:
    _postgres_app_password_read: "{{ _postgres_app_password_file.stdout | default('') | trim }}"
  no_log: true
