#
# #19370: the ONE read of the main-app admin seed password (#10636).
#
# AUTOBOT_ADMIN_PASSWORD is the autobot_users admin, a different account from the SLM admin
# (ssot_config.admin_password; docker/generate-secrets.sh generates it separately). The
# backend seeds it on first boot from backend.env. When slm-secrets.env carries no
# AUTOBOT_ADMIN_PASSWORD line, the SLM admin password is used, so the two apps share one
# admin credential -- the behaviour the deploy path (roles/backend) and the update path
# (update-all-nodes.yml) each implemented in their own copy until #19370.
#
# Reads the file on the TARGET host, exactly as both copies did (not delegated): it exists
# only where slm_manager wrote it, so a remote backend node reads nothing and renders no
# AUTOBOT_ADMIN_PASSWORD line, as before. Privilege comes from the caller.
#
# Sets `_admin_seed_password_read` ("" when unavailable). Callers map it onto
# `autobot_admin_password` themselves, at the precedence their render needs.
---

- name: "Read the admin seed password (AUTOBOT_ADMIN_PASSWORD, fallback SLM_ADMIN_PASSWORD) (#10636, #19370)"
  ansible.builtin.shell:
    cmd: >-
      grep -oP '^AUTOBOT_ADMIN_PASSWORD=\K.*' /etc/autobot/slm-secrets.env 2>/dev/null
      || grep -oP '^SLM_ADMIN_PASSWORD=\K.*' /etc/autobot/slm-secrets.env 2>/dev/null
      || true
  register: _admin_seed_password_probe
  changed_when: false
  failed_when: false
  no_log: true

- name: "Expose the admin seed password read result (#19370)"
  ansible.builtin.set_fact:
    _admin_seed_password_read: "{{ _admin_seed_password_probe.stdout | default('') | trim }}"
  no_log: true
