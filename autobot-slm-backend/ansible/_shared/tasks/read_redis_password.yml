#
# #16627 (P1b of #13568): read the Redis credential the SLM generated.
#
# The SLM writes AUTOBOT_REDIS_USERNAME and AUTOBOT_REDIS_PASSWORD into its own
# slm-secrets.env (roles/slm_manager). Every consumer sends that username and
# password while the server stays nopass, which accepts AUTH default <password>;
# P2 (#16628) then enforces it. Roles never generate a Redis password -- they read
# this one.
#
# Owner decision (2026-09-13): read on the SLM host, not on each target. The SLM
# runs every playbook, so `delegate_to: localhost` reaches the SLM's own file for
# every node, remote ones included -- unlike the #12513 chroma read, which only
# reaches hosts that carry the file. A run started somewhere without the file reads
# nothing, and callers then keep what they already have.
#
# Sets `_redis_password_read` and `_redis_username_read` (empty strings when
# unavailable; the username falls back to `default` when a password was read but no
# username was). Callers MUST adopt only when `_redis_password_read` is non-empty
# AND their own password is empty -- never overriding a password a server may
# already enforce -- and MUST set the username together with the password: while
# the server's default user is nopass, a password sent without a username
# (AUTH <password>) is refused.
---

- name: "Stat the SLM's slm-secrets.env for the Redis credential read (#16627)"
  ansible.builtin.stat:
    path: /etc/autobot/slm-secrets.env
  register: _redis_slm_secrets_stat
  delegate_to: localhost
  run_once: true
  become: false

- name: "Read AUTOBOT_REDIS_PASSWORD from the SLM's slm-secrets.env (#16627)"
  ansible.builtin.shell:
    cmd: >-
      grep -oP '^AUTOBOT_REDIS_PASSWORD=\K.*'
      /etc/autobot/slm-secrets.env 2>/dev/null || true
  register: _redis_password_probe
  changed_when: false
  failed_when: false
  delegate_to: localhost
  run_once: true
  become: false
  no_log: true
  # #12145 pattern: retry a transient empty read (file mid-write during a
  # concurrent deploy); short-circuits immediately when the file is absent.
  until: >-
    (_redis_password_probe.stdout | default('') | trim | length > 0)
    or (not (_redis_slm_secrets_stat.stat.exists | default(false)))
  retries: 5
  delay: 2

- name: "Read AUTOBOT_REDIS_USERNAME from the SLM's slm-secrets.env (#16627)"
  ansible.builtin.shell:
    cmd: >-
      grep -oP '^AUTOBOT_REDIS_USERNAME=\K.*'
      /etc/autobot/slm-secrets.env 2>/dev/null || true
  register: _redis_username_probe
  changed_when: false
  failed_when: false
  delegate_to: localhost
  run_once: true
  become: false

- name: "Expose the Redis credential read result (#16627)"
  ansible.builtin.set_fact:
    _redis_password_read: "{{ _redis_password_probe.stdout | default('') | trim }}"
    _redis_username_read: >-
      {{ (_redis_username_probe.stdout | default('') | trim)
         or ('default' if (_redis_password_probe.stdout | default('') | trim) else '') }}
  no_log: true
