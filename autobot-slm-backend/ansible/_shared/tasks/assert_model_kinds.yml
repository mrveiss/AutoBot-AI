#
# #19736: every model pull checked the NAME only, never the KIND, so a chat model sat in the
# embedding role and every embed call failed (#18834). After a pull, ask the model server what
# each model can do ("ollama show" -> Capabilities) and fail the install when a model cannot do
# the job its role needs. A model that is not installed is reported, not failed here: presence is
# #19731's check; this one is about kind. A model server that cannot be reached at all fails here,
# since otherwise every model would read ABSENT and the check would pass without asking anything.
#
# Caller sets:
#   model_kind_embedding   -- the embedding role's model id (must have the "embedding" capability)
#   model_kind_completion  -- list of chat/tool model ids (each must have "completion")
#   model_kind_cli         -- optional command prefix that runs the ollama CLI
#                             (default "ollama"; e.g. "docker exec autobot-ollama ollama")
---

- name: "Models | Ask the model server what each model can do (#19736)"
  ansible.builtin.shell:
    cmd: |
      $MODEL_CLI list >/dev/null 2>&1 || { echo "UNREACHABLE model server via: $MODEL_CLI"; exit 1; }
      verdict() {  # $1 model  $2 capability the role needs
        out=$($MODEL_CLI show "$1" 2>/dev/null) || { echo "ABSENT $1"; return; }
        caps=$(printf '%s\n' "$out" | awk '/^[[:space:]]*Capabilities[[:space:]]*$/{f=1;next} f&&NF==0{exit} f{print $1}' | tr '\n' ' ')
        if [ -z "$caps" ]; then echo "UNKNOWN $1"
        elif printf ' %s ' "$caps" | grep -q " $2 "; then echo "OK $1 $2"
        else echo "WRONG-KIND $1 needs=$2 has=[${caps% }]"; fi
      }
      [ -n "$EMBEDDING_MODEL" ] && verdict "$EMBEDDING_MODEL" embedding
      printf '%s\n' "$COMPLETION_MODELS" | while IFS= read -r m; do
        [ -n "$m" ] && [ "$m" != "$EMBEDDING_MODEL" ] && verdict "$m" completion
      done
      exit 0
  environment:
    MODEL_CLI: "{{ model_kind_cli | default('ollama') }}"
    EMBEDDING_MODEL: "{{ model_kind_embedding | default('') }}"
    COMPLETION_MODELS: "{{ (model_kind_completion | default([])) | join('\n') }}"
  register: _model_kind_probe
  changed_when: false
  failed_when: _model_kind_probe.rc != 0
  become: true

- name: "Models | Report models the server could not describe (#19736)"
  ansible.builtin.debug:
    msg: "{{ _model_kind_probe.stdout_lines | select('match', '^(ABSENT|UNKNOWN) ') | list }}"
  when: _model_kind_probe.stdout_lines | select('match', '^(ABSENT|UNKNOWN) ') | list | length > 0

- name: "Models | Fail when a model cannot do its role's job (#19736)"
  ansible.builtin.fail:
    msg: >-
      A model is the wrong kind for its role: {{ _model_kind_probe.stdout_lines | select('match', '^WRONG-KIND ')
      | list | join('; ') }}. An embedding role needs a model with the "embedding" capability, a chat role
      one with "completion" (#19736, #18834).
  when: _model_kind_probe.stdout_lines | select('match', '^WRONG-KIND ') | list | length > 0
