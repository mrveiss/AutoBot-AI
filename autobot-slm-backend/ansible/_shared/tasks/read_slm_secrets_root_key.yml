#
# #20941: read the secrets root key the SLM holds, for a service that is not the backend.
#
# The key's one source is AUTOBOT_SECRETS_ROOT_KEY in the SLM's slm-secrets.env
# (generated by roles/slm_manager, read for the backend by
# roles/backend/tasks/read_secrets_root_key.yml). Every process that opens the
# envelope store must derive its KEKs from that same value, so a service on another
# node reads the SLM's file rather than holding a second key. Same distribution
# path as the Redis credential (read_redis_password.yml): the SLM runs every
# playbook, so `delegate_to: localhost` reaches its file for every node.
#
# THE one implementation of this read: roles/backend/tasks/read_secrets_root_key.yml
# and roles/ai-stack/tasks/env_files.yml both include it, so the two cannot drift.
#
# Sets `_slm_root_key_file_exists` (the SLM file is there), `_slm_root_key_read`
# (empty when the file is absent or carries none) and, when it is non-empty,
# `autobot_secrets_root_key`. An operator-supplied key is kept when the file has
# none. Line shapes accepted: an `export ` prefix and a quoted value. A file that is
# present but cannot be read FAILS the run (grep rc 2): it is never read as "no key".
# What to do about an empty read is the caller's call (the backend fails on it, the
# ai-stack refuses to drop a key its env file already holds).
#
# The path is `slm_secrets_env_path` (inventory/group_vars/all.yml). Callers MUST
# include this with `apply: tags:` so a tag-filtered run still reads the key.
---

- name: "Require the SLM secrets file path (#20941)"
  ansible.builtin.assert:
    that: slm_secrets_env_path is defined and (slm_secrets_env_path | string | trim | length) > 0
    fail_msg: >-
      slm_secrets_env_path is not defined. It is declared in inventory/group_vars/all.yml and
      names the SLM's slm-secrets.env; run with that inventory or pass it with -e.
    quiet: true

- name: "Stat the SLM's secrets file for the root-key read (#20941)"
  ansible.builtin.stat:
    path: "{{ slm_secrets_env_path }}"
  register: _slm_root_key_stat
  delegate_to: localhost
  run_once: true
  become: true  # the file is root:autobot 0640, as for the chroma token read

- name: "Read AUTOBOT_SECRETS_ROOT_KEY from the SLM's slm-secrets.env (#20941)"
  # grep rc 1 is "no such line"; rc 2 is an unreadable file, which stays a failure.
  ansible.builtin.command:
    argv:
      - grep
      - -oP
      - '^\s*(export\s+)?AUTOBOT_SECRETS_ROOT_KEY=\K.+'
      - "{{ slm_secrets_env_path }}"
  register: _slm_root_key_probe
  changed_when: false
  failed_when: _slm_root_key_probe.rc | default(0) > 1
  delegate_to: localhost
  run_once: true
  become: true
  no_log: true
  check_mode: false  # a read: rc must be defined in check mode too
  when: _slm_root_key_stat.stat.exists | default(false)

- name: "Expose the SLM's secrets root key (#20941)"
  ansible.builtin.set_fact:
    _slm_root_key_file_exists: "{{ _slm_root_key_stat.stat.exists | default(false) }}"
    _slm_root_key_read: "{{ _slm_root_key_probe.stdout | default('') | trim | regex_replace('^[\"\\x27]|[\"\\x27]$', '') }}"
  no_log: true

- name: "Adopt the SLM's secrets root key when it has one (#20941)"
  ansible.builtin.set_fact:
    autobot_secrets_root_key: "{{ _slm_root_key_read }}"
  when: _slm_root_key_read | length > 0
  no_log: true
