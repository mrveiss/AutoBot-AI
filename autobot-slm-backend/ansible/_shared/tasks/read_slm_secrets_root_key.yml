#
# #20941: read the secrets root key the SLM holds, for a service that is not the backend.
#
# The key's one source is AUTOBOT_SECRETS_ROOT_KEY in the SLM's slm-secrets.env
# (generated by roles/slm_manager, read for the backend by
# roles/backend/tasks/read_secrets_root_key.yml). Every process that opens the
# envelope store must derive its KEKs from that same value, so a service on another
# node reads the SLM's file rather than holding a second key. Same distribution
# path as the Redis credential (read_redis_password.yml): the SLM runs every
# playbook, so `delegate_to: localhost` reaches its file for every node.
#
# Sets `_slm_root_key_read` (empty when the file is absent or carries none) and,
# when it is non-empty, `autobot_secrets_root_key`. An operator-supplied key is
# kept when the file has none. The same line shapes the backend read accepts: an
# `export ` prefix and a quoted value.
---

- name: "Read AUTOBOT_SECRETS_ROOT_KEY from the SLM's slm-secrets.env (#20941)"
  ansible.builtin.shell:
    cmd: >-
      grep -oP '^\s*(export\s+)?AUTOBOT_SECRETS_ROOT_KEY=\K.+'
      /etc/autobot/slm-secrets.env 2>/dev/null || true
  register: _slm_root_key_probe
  changed_when: false
  failed_when: false
  delegate_to: localhost
  run_once: true
  become: false
  no_log: true

- name: "Expose the SLM's secrets root key (#20941)"
  ansible.builtin.set_fact:
    _slm_root_key_read: "{{ _slm_root_key_probe.stdout | default('') | trim | regex_replace('^[\"\\x27]|[\"\\x27]$', '') }}"
  no_log: true

- name: "Adopt the SLM's secrets root key when it has one (#20941)"
  ansible.builtin.set_fact:
    autobot_secrets_root_key: "{{ _slm_root_key_read }}"
  when: _slm_root_key_read | length > 0
  no_log: true
