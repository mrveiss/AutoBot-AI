#
# #18558: the ONE place a role registers a node's remote-access credentials in the SLM
# database, so they appear in its tools. Log in, skip when the node has some, otherwise POST.
#
# Consumers set these on the include_tasks:
#   node_credentials_label  prefix for the task names ("VNC", "xrdp")
#   node_credentials_kind   the name in the messages ("VNC", "RDP")
#   node_credentials_path   the node's route ("vnc-credentials", "rdp-credentials")
#   node_credentials_body   what to register; it can carry a secret, so it stays under no_log
---
- name: "{{ node_credentials_label }} | Wait for SLM backend to be healthy before credential registration"
  ansible.builtin.uri:
    url: "{{ slm_api_url }}/api/health"
    method: GET
    status_code: 200
    validate_certs: false
  register: _node_credentials_slm_health
  retries: 12
  delay: 5
  until: _node_credentials_slm_health.status == 200
  ignore_errors: true
  when: slm_api_url is defined

- name: "{{ node_credentials_label }} | Resolve the SLM admin password (#19318)"
  ansible.builtin.include_tasks: read_slm_admin_password.yml

- name: "{{ node_credentials_label }} | Authenticate with SLM API for {{ node_credentials_kind }} registration"
  ansible.builtin.uri:
    url: "{{ slm_api_url }}/api/auth/login"
    method: POST
    body_format: json
    body:
      username: "{{ slm_admin_user }}"
      password: "{{ slm_admin_password }}"
    status_code: 200
    validate_certs: false
  register: _node_credentials_auth
  retries: 5
  delay: 5
  until: _node_credentials_auth.status == 200
  no_log: true  # #19764: credentials in the request or response

# The SLM returns access_token, the user backend returns token
- name: "{{ node_credentials_label }} | Extract auth token"
  ansible.builtin.set_fact:
    _node_credentials_token: "{{ _node_credentials_auth.json.access_token | default(_node_credentials_auth.json.token | default('')) }}"

- name: "{{ node_credentials_label }} | Verify SLM auth succeeded"
  ansible.builtin.assert:
    that:
      - _node_credentials_token | length > 0
    fail_msg: "SLM auth failed — check slm_admin_password. HTTP status: {{ _node_credentials_auth.status | default('none') }} (body withheld: it can carry the token, #19764)"

- name: "{{ node_credentials_label }} | Check existing {{ node_credentials_kind }} credentials for this node"
  ansible.builtin.uri:
    url: "{{ slm_api_url }}/api/nodes/{{ slm_node_id }}/{{ node_credentials_path }}"
    method: GET
    headers:
      Authorization: "Bearer {{ _node_credentials_token }}"
    status_code: [200, 404]
    validate_certs: false
  register: _node_credentials_existing
  no_log: true  # #19764: credentials in the request or response

- name: "{{ node_credentials_label }} | Register {{ node_credentials_kind }} credentials in SLM database"
  ansible.builtin.uri:
    url: "{{ slm_api_url }}/api/nodes/{{ slm_node_id }}/{{ node_credentials_path }}"
    method: POST
    headers:
      Authorization: "Bearer {{ _node_credentials_token }}"
    body_format: json
    body: "{{ node_credentials_body }}"
    status_code: [201]
    validate_certs: false
  when:
    - _node_credentials_existing.status == 200
    - (_node_credentials_existing.json.credentials | default([])) | length == 0
  register: _node_credentials_registered
  no_log: true  # #19764: credentials in the request or response

- name: "{{ node_credentials_label }} | Log {{ node_credentials_kind }} credential registration result"
  ansible.builtin.debug:
    msg: >-
      {{ node_credentials_kind }} credentials registered for node {{ slm_node_id }}
      (credential_id: {{ _node_credentials_registered.json.credential_id | default('skipped') }})
  when: _node_credentials_registered is not skipped
