# #20772: the one way an update or a role handler restarts a systemd unit.
#
# A unit parked in `failed` by its start limit (#4090, #20764) refuses a restart until
# StartLimitIntervalSec passes, so a bare `systemd: state=restarted` fails the update on that node.
# #20767 made every other operational restart clear the park first (`systemctl reset-failed`, as the
# SLM watchdog does); this file does the same for the restarts Ansible makes, from one implementation.
# A unit that is not failed is unaffected. argv form (#15879).
#
# Inputs:
#   restart_unit_name              the unit to restart (required)
#   restart_unit_tolerate_failure  true when the unit may legitimately be absent (#2872); default false
#   restart_unit_daemon_reload     true to reload unit files first; default false
# Privilege escalation is set on the two tasks below. The caller must NOT put `become` on its include_tasks:
# ansible-core 2.17 rejects it (`TaskInclude.preprocess_data`: "'become' is not a valid attribute for a
# TaskInclude"). The caller supplies `when` and tags (include_tasks `apply:`).

- name: "Restart | Clear a start-limit park before restarting {{ restart_unit_name }} (#20772)"
  ansible.builtin.command:
    argv: [systemctl, reset-failed, --, "{{ restart_unit_name }}"]
  become: true
  changed_when: false
  failed_when: false

- name: "Restart | {{ restart_unit_name }}"
  ansible.builtin.systemd:
    name: "{{ restart_unit_name }}"
    state: restarted
    daemon_reload: "{{ restart_unit_daemon_reload | default(false) | bool }}"
  become: true
  register: _restart_unit_result
  failed_when: _restart_unit_result is failed and not (restart_unit_tolerate_failure | default(false) | bool)
