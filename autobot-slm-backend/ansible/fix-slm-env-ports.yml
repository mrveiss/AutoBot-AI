---
# Fix incorrect port values in /opt/autobot/.env on SLM server
#
# The .env was generated from a legacy config system with wrong port values.
# This playbook corrects them to match production reality:
#   - Frontend: nginx HTTPS on 443 (not dev server 5173); AUTOBOT_FRONTEND_PORT stays the Vite port (#19326)
#   - NPU Worker: port 8081 (not 8082)
#   - AI Stack: port 8080 (11434 is the Ollama port, a different service)
#
# Usage:
#   cd autobot-slm-backend/ansible
#   ansible-playbook fix-slm-env-ports.yml

- name: Fix SLM Server .env port configuration
  hosts: slm
  become: true
  gather_facts: false

  vars:
    env_file: "{{ autobot.base_dir }}/.env"
    frontend_host: "{{ infrastructure.hosts.frontend }}"
    frontend_tls_port: "443"
    npu_host: "{{ infrastructure.hosts.npu }}"
    npu_port: "8081"
    ai_stack_host: "{{ infrastructure.hosts.backend }}"

  tasks:
    - name: "Fix | Frontend is served by nginx, not the Vite dev server (#19326)"
      lineinfile:
        path: "{{ env_file }}"
        regexp: '^AUTOBOT_FRONTEND_SERVED_BY='
        line: "AUTOBOT_FRONTEND_SERVED_BY=nginx"

    - name: "Fix | Frontend HTTPS on nginx (#19326)"
      lineinfile:
        path: "{{ env_file }}"
        regexp: '^AUTOBOT_FRONTEND_TLS_ENABLED='
        line: "AUTOBOT_FRONTEND_TLS_ENABLED=true"

    - name: "Fix | Frontend HTTPS port 443 (#19326)"
      lineinfile:
        path: "{{ env_file }}"
        regexp: '^AUTOBOT_FRONTEND_TLS_PORT='
        line: "AUTOBOT_FRONTEND_TLS_PORT={{ frontend_tls_port }}"

    - name: "Fix | AUTOBOT_FRONTEND_PORT is the Vite port; drop the 443 an older run wrote (#19326)"
      lineinfile:
        path: "{{ env_file }}"
        regexp: '^AUTOBOT_FRONTEND_PORT='
        state: absent

    - name: "Fix | Frontend URL http:5173 → https:443"
      lineinfile:
        path: "{{ env_file }}"
        regexp: '^AUTOBOT_FRONTEND_URL='
        line: "AUTOBOT_FRONTEND_URL=https://{{ frontend_host }}"

    # VITE_FRONTEND_PORT is the dev port; the SPA's OAuth callback reads the served one (#20058)
    - name: "Fix | SPA served port goes under its own name"
      lineinfile:
        path: "{{ env_file }}"
        regexp: '^VITE_FRONTEND_(SERVED_)?PORT='
        line: "VITE_FRONTEND_SERVED_PORT={{ frontend_tls_port }}"

    - name: "Fix | NPU Worker port 8082 → 8081"
      lineinfile:
        path: "{{ env_file }}"
        regexp: '^AUTOBOT_NPU_WORKER_PORT='
        line: "AUTOBOT_NPU_WORKER_PORT={{ npu_port }}"

    - name: "Fix | NPU Worker URL 8082 → 8081"
      lineinfile:
        path: "{{ env_file }}"
        regexp: '^AUTOBOT_NPU_WORKER_URL='
        line: "AUTOBOT_NPU_WORKER_URL=http://{{ npu_host }}:{{ npu_port }}"

    - name: "Fix | VITE NPU Worker port 8082 → 8081"
      lineinfile:
        path: "{{ env_file }}"
        regexp: '^VITE_NPU_WORKER_PORT='
        line: "VITE_NPU_WORKER_PORT={{ npu_port }}"

    - name: "Fix | AI Stack host .24 → .20 (Ollama is on main VM)"
      lineinfile:
        path: "{{ env_file }}"
        regexp: '^AUTOBOT_AI_STACK_HOST='
        line: "AUTOBOT_AI_STACK_HOST={{ ai_stack_host }}"

    - name: "Fix | AI Stack port 8080 → 11434 (Ollama port)"
      lineinfile:
        path: "{{ env_file }}"
        regexp: '^AUTOBOT_AI_STACK_PORT='
        line: "AUTOBOT_AI_STACK_PORT={{ ai_stack_port }}"

    - name: "Fix | AI Stack URL http:.24:8080 → http:.20:11434"
      lineinfile:
        path: "{{ env_file }}"
        regexp: '^AUTOBOT_AI_STACK_URL='
        line: "AUTOBOT_AI_STACK_URL=http://{{ ai_stack_host }}:{{ ai_stack_port }}"

    - name: "Fix | VITE AI Stack host → .20"
      lineinfile:
        path: "{{ env_file }}"
        regexp: '^VITE_AI_STACK_HOST='
        line: "VITE_AI_STACK_HOST={{ ai_stack_host }}"

    - name: "Fix | VITE AI Stack port 8080 → 11434"
      lineinfile:
        path: "{{ env_file }}"
        regexp: '^VITE_AI_STACK_PORT='
        line: "VITE_AI_STACK_PORT={{ ai_stack_port }}"

    - name: "Restart SLM backend to pick up new env values"
      systemd:
        name: autobot-slm-backend
        state: restarted
      async: 1
      poll: 0

    - name: "Wait for SLM backend to restart"
      pause:
        seconds: 12

    - name: "Verify SLM backend health"
      uri:
        url: "https://{{ ansible_host }}/api/health"
        validate_certs: false
        status_code: 200
      register: health
      retries: 6
      delay: 5
      until: health.status == 200
      failed_when: false

    - name: "Summary"
      debug:
        msg: |
          ╔═══════════════════════════════════════════════════════╗
          ║  SLM .env Port Fix Complete                          ║
          ╚═══════════════════════════════════════════════════════╝
          Fixed values in {{ env_file }}:
            AUTOBOT_FRONTEND_SERVED_BY: nginx, AUTOBOT_FRONTEND_TLS_PORT: 443 (nginx HTTPS)
            AUTOBOT_NPU_WORKER_PORT: 8082 → 8081
            AUTOBOT_AI_STACK_HOST: {{ infrastructure.hosts.aiml }} → {{ infrastructure.hosts.backend }}
            AUTOBOT_AI_STACK_PORT: set to {{ ai_stack_port }} (AI Stack; 11434 is Ollama)
          SLM backend health: {{ health.status | default('unknown') }}
          ═══════════════════════════════════════════════════════
