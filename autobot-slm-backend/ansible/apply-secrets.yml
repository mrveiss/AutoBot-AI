# Apply Secrets Playbook (#11719)
#
# Lightweight secret-propagation path: re-renders ONLY the env-file
# template(s) of the roles that consume a managed system secret and
# restarts their systemd service(s) -- no package installs, venv rebuilds,
# or model downloads (contrast with the "Migrate"/full role redeploy path
# that role.ansible_playbook normally points at).
#
# Invoked by POST /api/secrets/apply via PlaybookExecutor, which
# auto-injects the stored secret values as extra_vars
# (services/ansible_secrets.fetch_deploy_secrets). The secret -> dependent
# role mapping that selects `apply_roles_csv` lives in
# services/ansible_secrets._SECRET_TO_DEPENDENT_ROLES, next to
# _SECRET_TO_ANSIBLE_VAR (single source of truth).
#
# Add a task below (with a `when: "'<role>' in ..."` guard) for each new
# role added to _SECRET_TO_DEPENDENT_ROLES.
---
- name: Apply Secrets - Dependent Role Env Files
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: false

  vars_files:
    - roles/tts-worker/defaults/main.yml

  tasks:
    - name: "Apply Secrets | Render TTS worker .env (hf_token)"
      ansible.builtin.template:
        src: roles/tts-worker/templates/tts-worker.env.j2
        dest: "{{ tts_install_dir }}/.env"
        mode: "0600"
        owner: "{{ tts_user }}"
        group: "{{ tts_group }}"
      when: "'tts-worker' in (apply_roles_csv | default('tts-worker')).split(',')"
      notify: restart tts-worker

  handlers:
    - name: restart tts-worker
      ansible.builtin.systemd:
        name: autobot-tts-worker
        state: restarted
