[pytest]
# AutoBot pytest configuration

# Ensure backend and shared modules are importable before collection starts.
# pytest processes `pythonpath` before any test collection, so bare imports
# like `from models.task_context import ...` resolve correctly.
# Requires pytest >= 7.0 (built-in mechanism; more reliable than conftest.py
# sys.path manipulation which runs too late to prevent collection errors).
# Issue: #1884
pythonpath = . autobot-backend autobot_shared

# Test markers
markers =
    integration: Integration tests that may require external services
    slow: Tests that take a long time to run
    distributed: Tests for distributed multi-VM scenarios
    performance: Performance and load tests
    security: Security-related tests
    real_kb: Tests that run against a real (in-memory) ChromaDB instance
    migration_gate: Alembic migration-path tests requiring a disposable Postgres (#10001/#10026)
    xdist_group: pytest-xdist group marker — tests with the same group run on the same worker

# Test discovery - colocated tests live next to source files (#734)
testpaths =
    autobot-backend
    autobot-slm-backend
    autobot_shared
    repo_tests
# #7082: dropped `*.e2e_test.py` / `*.integration_test.py` (dotted) — they
# break pytest's path-to-module conversion. Files renamed to `*_e2e_test.py`
# / `*_integration_test.py` / `*_performance_test.py` (underscore form),
# which all fall under the `*_test.py` pattern below.
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Exclude directories that are not real test code:
#   - autobot-slm-backend/ansible/ contains Ansible-synced node copies with duplicate tests
#   - autobot-npu-worker/resources/ contains Windows-only tests requiring PySide6
#   - Standard tooling/cache directories
norecursedirs =
    .git
    .tox
    .venv
    venv
    __pycache__
    node_modules
    .worktrees
    dist
    build
    *.egg-info

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --asyncio-mode=auto
    --import-mode=importlib
    --ignore=autobot-slm-backend/ansible
    --ignore=autobot-npu-worker/resources
    # pytest-xdist parallelism (-n auto --dist loadscope) is applied per
    # full-suite invocation (the ci.yml coverage gate), NOT globally here:
    # several CI jobs (e.g. startup-import-smoke) install bare pytest without
    # pytest-xdist and run from this rootdir, so a global -n in addopts would
    # error them with "unrecognized arguments: -n" and break a required gate.
    # Proven stable with --dist loadscope (#10398).

# Coverage options
# Run with: pytest --cov=autobot-backend --cov=autobot-slm-backend --cov-report=html
[coverage:run]
source = autobot-backend,autobot-slm-backend,autobot-npu-worker,autobot_shared
omit = *_test.py,*/test_*,*/venv/*,*/__pycache__/*

[coverage:report]
precision = 2
skip_empty = True
# Minimum 70% coverage required — CI enforces via --cov-fail-under=70 (#3285)
fail_under = 70
