role: autobot-monitoring
description: "Prometheus + Grafana fleet observability stack"
version: "1.0.0"
target_node: slm

deploy:
  source: autobot-monitoring/
  destination: /opt/autobot/autobot-monitoring/
  shared: false
  infrastructure: true

system_dependencies:
  - prometheus
  - grafana

services:
  - name: autobot-monitoring-prometheus
    type: systemd
    system_service: prometheus
    start_order: 1
    user: prometheus
    slm_roles: [slm-monitoring]   # #16025: role_registry name differs from this dir
  - name: autobot-monitoring-grafana
    type: systemd
    system_service: grafana-server
    start_order: 2
    user: grafana

ports:
  - port: 9090
    protocol: http
    public: false
    loopback_only: true
    description: "Prometheus (proxied through nginx on SLM manager)"
  - port: 3000
    protocol: http
    public: false
    loopback_only: true
    description: "Grafana (proxied through nginx on SLM manager)"

health:
  endpoint: "http://localhost:9090/-/healthy"
  interval: "60s"
  timeout: "10s"
  retries: 3
  expected_status: 200

secrets:
  own:
    - grafana_admin_password
  shared:
    - prometheus_scrape_targets

tls:
  auto_rotate: false   # TLS terminated by nginx (autobot-slm-backend role)

system_updates:
  policy: security
  reboot_strategy: scheduled

coexistence:
  compatible_with:
    - autobot-slm-backend
    - autobot-slm-frontend
    - autobot-slm-database
    - autobot-slm-agent
    - autobot-shared
  conflicts_with:
    - autobot-browser-worker   # kept from when both bound one port; the worker binds 9001 since #4662 (#19324)
  warns_with: []

depends_on: []

ansible_role: monitoring
notes: |
  Prometheus and Grafana exposed via nginx proxy on SLM manager (path /prometheus and /grafana).
  Grafana admin password generated by Ansible in /etc/autobot/autobot-monitoring.env.
  Prometheus scrapes all 9 fleet nodes (node_exporter on each + per-service metrics).
  autobot-browser-worker binds 9001 (PLAYWRIGHT_PORT), not Grafana's port; the conflict above predates #4662 (#19324).
