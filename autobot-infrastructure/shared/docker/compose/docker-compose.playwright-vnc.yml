version: '3.8'

services:
  playwright-vnc:
    image: mcr.microsoft.com/playwright:v1.54.0-jammy
    container_name: autobot-playwright-vnc
    restart: unless-stopped
    environment:
      - DISPLAY=:99
      - HEADLESS=false
      - VNC_SERVER_PASSWORD=${VNC_PASSWORD:-autobot123}
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - SCREEN_DEPTH=24
      - DEBIAN_FRONTEND=noninteractive
      - TZ=UTC
    volumes:
      - ./playwright-server.js:/app/server.js
    ports:
      - "3000:3000"    # Playwright API
      - "5901:5901"    # VNC port (avoiding Kali's default 5900)
      - "6080:6080"    # noVNC web interface
    command: >
      bash -c "
        set -e
        echo '🚀 Setting up VNC environment...'

        # Install required packages only if not present
        export DEBIAN_FRONTEND=noninteractive
        if ! command -v supervisord &> /dev/null; then
          apt-get update -qq
          apt-get install -y --no-install-recommends x11vnc xvfb websockify supervisor curl ca-certificates
          apt-get clean && rm -rf /var/lib/apt/lists/*
        fi

        # #13069: noVNC pinned to an upstream release. The distro `novnc` package
        # is 1.0.0 (2018) and predates VeNCrypt support (added in 1.4.0), which is
        # what broke the deploy in #13060. Version and checksum are literals rather
        # than shell vars because docker compose substitutes ${...} before the
        # container sees it. Keep both in sync with
        # autobot-slm-backend/ansible/roles/vnc/defaults/main.yml.
        if [ ! -e /opt/novnc/vnc.html ]; then
          curl -fsSL -o /tmp/novnc.tar.gz \
            https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.tar.gz
          echo 'b1003a11b6e6e8d8f7f5e5586daae7f8ca651d8aee0aa155ff9ac841c48f52c6  /tmp/novnc.tar.gz' | sha256sum -c -
          tar xzf /tmp/novnc.tar.gz -C /opt
          ln -sfn /opt/noVNC-1.7.0 /opt/novnc
          rm -f /tmp/novnc.tar.gz
        fi

        # Create supervisor config directory
        mkdir -p /etc/supervisor/conf.d

        # Create supervisor config file
        echo '[supervisord]' > /etc/supervisor/conf.d/autobot.conf
        echo 'nodaemon=true' >> /etc/supervisor/conf.d/autobot.conf
        echo 'logfile=/var/log/supervisor/supervisord.log' >> /etc/supervisor/conf.d/autobot.conf
        echo 'pidfile=/tmp/supervisord.pid' >> /etc/supervisor/conf.d/autobot.conf
        echo '' >> /etc/supervisor/conf.d/autobot.conf
        echo '[program:xvfb]' >> /etc/supervisor/conf.d/autobot.conf
        echo 'command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac -nolisten tcp' >> /etc/supervisor/conf.d/autobot.conf
        echo 'autostart=true' >> /etc/supervisor/conf.d/autobot.conf
        echo 'autorestart=true' >> /etc/supervisor/conf.d/autobot.conf
        echo 'priority=100' >> /etc/supervisor/conf.d/autobot.conf
        echo '' >> /etc/supervisor/conf.d/autobot.conf
        # x11vnc binds 0.0.0.0 inside the container — Docker network isolation
        # handles security; localhost would block inter-container VNC access
        echo '[program:x11vnc]' >> /etc/supervisor/conf.d/autobot.conf
        echo 'command=/usr/bin/x11vnc -display :99 -rfbauth /home/autobot/.vnc/x11vnc.passwd -listen 0.0.0.0 -xkb -ncache 10 -forever -shared -rfbport 5901' >> /etc/supervisor/conf.d/autobot.conf
        echo 'autostart=true' >> /etc/supervisor/conf.d/autobot.conf
        echo 'autorestart=true' >> /etc/supervisor/conf.d/autobot.conf
        echo 'priority=200' >> /etc/supervisor/conf.d/autobot.conf
        echo '' >> /etc/supervisor/conf.d/autobot.conf
        echo '[program:novnc]' >> /etc/supervisor/conf.d/autobot.conf
        # #13069: upstream renamed utils/launch.sh to utils/novnc_proxy — the old
        # path silently fails to start the proxy on any noVNC >= 1.2.0.
        echo 'command=/opt/novnc/utils/novnc_proxy --vnc localhost:5901 --listen 6080' >> /etc/supervisor/conf.d/autobot.conf
        echo 'autostart=true' >> /etc/supervisor/conf.d/autobot.conf
        echo 'autorestart=true' >> /etc/supervisor/conf.d/autobot.conf
        echo 'priority=300' >> /etc/supervisor/conf.d/autobot.conf
        echo '' >> /etc/supervisor/conf.d/autobot.conf
        echo '[program:playwright]' >> /etc/supervisor/conf.d/autobot.conf
        echo 'command=bash -c \"cd /app && if [ ! -f package.json ]; then npm init -y; fi && npm install express playwright && node server.js\"' >> /etc/supervisor/conf.d/autobot.conf
        echo 'autostart=true' >> /etc/supervisor/conf.d/autobot.conf
        echo 'autorestart=true' >> /etc/supervisor/conf.d/autobot.conf
        echo 'priority=400' >> /etc/supervisor/conf.d/autobot.conf
        echo 'environment=DISPLAY=\":99\",HEADLESS=\"false\"' >> /etc/supervisor/conf.d/autobot.conf

        # Create log directory for supervisor
        mkdir -p /var/log/supervisor /var/log

        echo '🚀 Starting all services with supervisor...'
        exec /usr/bin/supervisord -c /etc/supervisor/supervisord.conf
      "
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - SYS_ADMIN
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health && curl -f http://localhost:6080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  default:
    name: autobot-network
    external: true
