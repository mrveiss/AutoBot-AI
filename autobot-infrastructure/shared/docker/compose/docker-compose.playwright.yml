services:
  playwright-service:
    image: mcr.microsoft.com/playwright:v1.54.0-jammy
    container_name: autobot-playwright
    network_mode: host
    working_dir: /app
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=${XAUTHORITY:-/home/${USER:-autobot}/.Xauthority}
      - HEADLESS=${HEADLESS:-false}
      - PLAYWRIGHT_PORT=${AUTOBOT_BROWSER_SERVICE_PORT:-9001}  # the fleet's port.browser (#19418)
    volumes:
      # One canonical server + its two local modules (#18549)
      - ../../../../autobot-browser-worker/playwright-server.js:/app/server.js
      - ../../../../autobot-browser-worker/session-store.js:/app/session-store.js
      - ../../../../autobot-browser-worker/element-index.js:/app/element-index.js
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:${HOME}/.Xauthority:rw
    # Remove /dev/dri for compatibility
    # devices:
    #   - /dev/dri:/dev/dri
    command: >
      sh -c "
        echo '🚀 Installing dependencies...' &&
        npm init -y &&
        npm install playwright express &&
        echo '🚀 Starting Playwright service with GUI support...' &&
        echo 'Display: ${DISPLAY}' &&
        echo 'HEADLESS: ${HEADLESS}' &&
        export HEADLESS=false &&
        node server.js
      "
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - SYS_ADMIN
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${AUTOBOT_BROWSER_SERVICE_PORT:-9001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  autobot-network:
    driver: bridge
