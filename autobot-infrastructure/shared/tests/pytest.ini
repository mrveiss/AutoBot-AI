[pytest]
# AutoBot Modern Test Suite Configuration

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings
    --maxfail=5
    --color=yes

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require services)
    e2e: End-to-end tests (full system)
    slow: Slow-running tests
    # Registered because `tests/performance/` exists under this rootdir and
    # marker-tests.yml selects `performance`; without it any run rooted here
    # fails on `--strict-markers` above (#15161).
    performance: Performance and benchmark tests
    distributed: Tests requiring distributed VMs
    performance: Performance and load tests (#14979)
    config: Configuration-related tests
    api: API endpoint tests
    chat: Chat system tests
    agent: Agent orchestration tests
    security: Security-related tests
    high_priority: High priority tests requiring immediate attention

# Test paths
#
# #15183: was `unit integration e2e` -- which named a directory that does not
# exist, and omitted `distributed/`, `performance/` and a root-level test file
# that all hold collectable tests.
#
# This setting governs a *bare* `pytest` run from this directory only. CI passes
# `autobot-infrastructure/shared/tests` as an explicit path argument
# (`.github/workflows/ci.yml`), and pytest ignores `testpaths` entirely when
# paths are given on the command line -- so CI has always collected the whole
# tree while a developer running `pytest` here collected three-quarters of it,
# one of which did not exist. That divergence is the defect.
#
# `.` rather than an enumeration, so the two agree by construction: a list has
# to be maintained, and the stale entry above is what happens when it is not.
# `repo_tests/pytest_testpaths_cover_every_test_dir_15183_test.py` asserts every
# directory holding `test_*.py` is reachable from this setting.
testpaths = .

# Asyncio configuration
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_file = logs/pytest.log
log_file_level = DEBUG
