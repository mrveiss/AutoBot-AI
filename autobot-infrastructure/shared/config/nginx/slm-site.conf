# ============================================================================
# REFERENCE ONLY — NOTHING DEPLOYS THIS FILE. DO NOT READ IT AS LIVE ROUTING.
# ============================================================================
# The deployed nginx configuration is rendered by Ansible from
#   autobot-slm-backend/ansible/roles/slm_manager/templates/autobot-slm.conf.j2
# That template is the only source of truth for what any request actually
# reaches. Every location block below may differ from it, and several already
# do — reading this file and reporting what it says as deployed behaviour is a
# mistake that has been made (#15230, corrected in #15236).
#
# Shell variables here (${VAR}) are illustrative only — this file is not
# envsubst-processed.
#
# #15236: the issue numbers in this file record why an example was written the
# way it is. They do NOT assert that the routing below is in effect anywhere.
# Kept rather than deleted because it is the only worked example of the
# non-colocated split; check any claim against the .j2 template before acting.
#
# SLM Admin Machine - Nginx Configuration (illustrative)
# Historical origin: install-slm.sh; example updated alongside Issue #729

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/ssl/slm/cert.pem;
    ssl_certificate_key /etc/ssl/slm/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SLM Admin UI (static files or dev server)
    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint for SLM (must be before /api/ to take priority)
    # Example only (origin: Issue #3108) — the deployed template decides this.
    location /api/ws {
        proxy_pass http://127.0.0.1:8000/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SLM API (local backend at port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AutoBot Backend API (main backend at ${AUTOBOT_BACKEND_HOST}:8001)
    # Example only (origin: Issue #729) — the deployed template decides this.
    location /autobot-api/ {
        proxy_pass http://${AUTOBOT_BACKEND_HOST}:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # AutoBot Backend WebSocket (terminal, etc.)
    location /autobot-api/ws/ {
        proxy_pass http://${AUTOBOT_BACKEND_HOST}:8001/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Grafana (preserve /grafana/ prefix - Grafana expects it with serve_from_sub_path)
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000/grafana/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus (proxied through SLM auth)
    location /prometheus/ {
        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
