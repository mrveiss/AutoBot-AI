# AI Agents Configuration (#2553)
# 3-tier model mapping: routing, classification, quality/tools
# All tool-using agents use qwen3.5:9b for reliable function calling.

llm:
  default_model: qwen3.5:9b

  models:
    # Routing tier — orchestrator only
    orchestrator: llama3.2:1b
    # Classification tier
    classification: gemma3:4b
    gemma_classification: gemma3:4b
    # Quality/tools tier — all tool-using agents
    chat: qwen3.5:9b
    kb_librarian: qwen3.5:9b
    knowledge_extraction: qwen3.5:9b
    knowledge_retrieval: qwen3.5:9b
    json_formatter: qwen3.5:9b
    npu_code_search: qwen3.5:9b
    rag: qwen3.5:9b
    research: qwen3.5:9b
    graph_entity_extractor: qwen3.5:9b
    man_page_knowledge_integrator: qwen3.5:9b
    librarian_assistant: qwen3.5:9b
    step_executor: qwen3.5:9b
    network_discovery: qwen3.5:9b
    system_commands: qwen3.5:9b
    enhanced_system_commands: qwen3.5:9b
    interactive_terminal: qwen3.5:9b
    security_scanner: qwen3.5:9b
    llm_failsafe: qwen3.5:9b

agents:
  chat:
    enabled: true
    max_history: 100
    streaming: true

  classification:
    enabled: true
    fallback_enabled: true
    timeout_seconds: 10
    preferred_model: gemma3:4b
    use_gemma: true

  interactive_terminal:
    enabled: true
    session_timeout_minutes: 30

  kb_librarian:
    enabled: true
    max_results: 5
    timeout_seconds: 15

  rag:
    enabled: true
    max_context_length: 4000

  research:
    browser_enabled: false
    enabled: true
    timeout_seconds: 30

  security_scanner:
    enabled: false
    scan_timeout_seconds: 60

  system_commands:
    approval_required: true
    enabled: true
    safety_enabled: true

knowledge_base:
  enabled: true
  force_embedding_consistency: true
  update_frequency_days: 7

  semantic_chunking:
    enabled: true
    model: nomic-embed-text:latest
    percentile_threshold: 95.0

embeddings:
  model: nomic-embed-text:latest
  dimensions: 768
