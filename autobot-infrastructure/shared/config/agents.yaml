# AI Agents Configuration (#2553)
# Contains all AI agent and LLM-related settings
# Model assignments use 6-tier mapping — change in ssot_config.py to change everywhere

llm:
  # Default model for most operations (quality tier)
  default_model: qwen3.5:9b

  # Model assignments by agent type (6-tier mapping)
  models:
    # Routing tier — fast orchestration
    orchestrator: llama3.2:1b
    # Classification tier — purpose-built
    classification: gemma2:2b
    # Quality tier — user-facing
    chat: qwen3.5:9b
    # Light processing tier — structured tasks
    kb_librarian: phi3:mini
    knowledge_extraction: phi3:mini
    knowledge_retrieval: phi3:mini
    json_formatter: phi3:mini
    npu_code_search: phi3:mini
    # Instruction following tier — RAG, extraction
    rag: mistral:7b-instruct
    research: qwen3.5:9b
    graph_entity_extractor: mistral:7b-instruct
    man_page_knowledge_integrator: mistral:7b-instruct
    librarian_assistant: mistral:7b-instruct
    step_executor: mistral:7b-instruct
    network_discovery: mistral:7b-instruct
    # System/uncensored tier — command execution
    system_commands: dolphin-llama3:8b
    enhanced_system_commands: dolphin-llama3:8b
    interactive_terminal: dolphin-llama3:8b
    security_scanner: dolphin-llama3:8b
    llm_failsafe: dolphin-llama3:8b

agents:
  chat:
    enabled: true
    max_history: 100
    streaming: true

  classification:
    enabled: true
    fallback_enabled: true
    timeout_seconds: 10
    preferred_model: gemma2:2b
    use_gemma: true

  interactive_terminal:
    enabled: true
    session_timeout_minutes: 30

  kb_librarian:
    enabled: true
    max_results: 5
    timeout_seconds: 15

  rag:
    enabled: true
    max_context_length: 4000

  research:
    browser_enabled: false
    enabled: true
    timeout_seconds: 30

  security_scanner:
    enabled: false
    scan_timeout_seconds: 60

  system_commands:
    approval_required: true
    enabled: true
    safety_enabled: true

knowledge_base:
  enabled: true
  force_embedding_consistency: true
  update_frequency_days: 7

  semantic_chunking:
    enabled: true
    model: nomic-embed-text:latest
    percentile_threshold: 95.0

embeddings:
  model: nomic-embed-text:latest
  dimensions: 768
