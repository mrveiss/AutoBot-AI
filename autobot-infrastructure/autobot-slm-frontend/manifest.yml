role: autobot-slm-frontend
description: "SLM admin dashboard — Vue 3 SPA for fleet management, monitoring, and orchestration"
version: "1.0.0"
target_node: slm

deploy:
  source: autobot-slm-frontend/
  destination: /opt/autobot/autobot-slm-frontend/
  shared: false
  infrastructure: true

system_dependencies:
  - nodejs   # v20 via NodeSource — shared with slm-backend

# #15603: no services entry. This used to declare a `oneshot` build step
# (`npm ci && npm run build`, unstaged — the exact defect roles/_shared/tasks/
# build_publish_slm_frontend.yml exists to close) whose `exec_start` nothing
# in the codebase ever reads: `ManifestService.exec_start` is a modeled field
# (autobot-slm-backend/models/manifest.py) with zero consumers. The real,
# live build/publish mechanism is the `ansible_role: slm_manager` named
# below, via that shared task file — this duplicated it, incorrectly, in a
# form nothing executed. Served by nginx managed by autobot-slm-backend
# role; no separate runtime service needed either.
services: []

ports: []   # Port 443 served by nginx from autobot-slm-backend role

health:
  endpoint: "https://localhost/"
  interval: "60s"
  timeout: "10s"
  retries: 2
  expected_status: 200

secrets:
  own: []
  shared:
    - slm_backend_url

tls:
  auto_rotate: false   # TLS managed by autobot-slm-backend/nginx

system_updates:
  policy: security
  reboot_strategy: scheduled

coexistence:
  conflicts_with: []
  compatible_with:
    - autobot-frontend     # nginx virtual hosts — different server_name on same port 443
    - autobot-slm-backend
    - autobot-slm-database
    - autobot-monitoring
    - autobot-slm-agent
    - autobot-shared
  warns_with: []

depends_on:
  - autobot-slm-backend

ansible_role: slm_manager
notes: |
  Built dist/ is served by nginx configured by autobot-slm-backend role.
  Co-deployed with autobot-slm-backend (same Ansible role: slm_manager).
  Can coexist with autobot-frontend on the same node via nginx server_name virtual hosts —
  each frontend gets its own server block proxying to the correct backend endpoint.
