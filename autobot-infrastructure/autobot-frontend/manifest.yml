role: autobot-frontend
description: "User-facing chat interface — Vue 3 SPA served by nginx over HTTPS"
version: "1.0.0"
target_node: frontend

deploy:
  source: autobot-frontend/
  destination: /opt/autobot/autobot-frontend/
  shared: false
  infrastructure: true

system_dependencies:
  - nginx
  - nodejs   # v20 via NodeSource

# #15603: no build oneshot. This declared exec_start: "bash -c 'cd ... && npm
# ci && npm run build'" — unstaged, the exact defect
# roles/_shared/tasks/build_publish_slm_frontend.yml exists to close — and
# ManifestService.exec_start (autobot-slm-backend/models/manifest.py) has zero
# consumers anywhere in the codebase, the same dead field removed from the
# SLM frontend's manifest.yml in the same change. The real, live build/publish
# mechanism is the `ansible_role: frontend` named below, via that shared task
# file.
services:
  - name: autobot-frontend
    type: systemd
    system_service: nginx
    start_order: 1

ports:
  - port: 443
    protocol: https
    public: true
    description: "User HTTPS frontend"
  - port: 80
    protocol: http
    public: true
    description: "HTTP redirect to HTTPS"

health:
  endpoint: "https://localhost/api/health"
  interval: "30s"
  timeout: "10s"
  retries: 3
  expected_status: 200

secrets:
  own:
    - tls_cert
    - tls_key
  shared:
    - backend_host
    - backend_port

tls:
  auto_rotate: true
  rotate_days_before: 14
  reload_command: "systemctl reload nginx"

system_updates:
  policy: full
  reboot_strategy: immediate

coexistence:
  conflicts_with: []
  compatible_with:
    - autobot-slm-frontend   # nginx virtual hosts — different server_name on same port 443
    - autobot-slm-backend
    - autobot-slm-agent
    - autobot-shared
  warns_with: []

depends_on:
  - autobot-backend

ansible_role: frontend
notes: |
  Production build only — never run npm run dev on this node.
  nginx serves built dist/ from /var/www/html/.
  All /api/* and /ws/* requests are proxied to autobot-backend (.20:8443).
  nginx dir owned by www-data; rsync fix: chown -R autobot:autobot /var/www/html/
  Can coexist with autobot-slm-frontend on the same node via nginx server_name virtual hosts.
  Each role gets its own server block (e.g. autobot.example.com vs slm.example.com).
