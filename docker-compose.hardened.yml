# AutoBot — Hardened docker-compose overlay for production deployments.
# Issue #6596
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.hardened.yml \
#     --env-file docker/.env.docker up -d
#
# What this overlay adds on top of the base compose:
#   • read_only: true on all writable-root services (backend, worker, slm, redis, postgres, chromadb)
#   • Additional tmpfs mounts required when read_only is enabled
#   • Docker Secrets replace plain-text env-var credentials (SLM admin password,
#     SLM JWT secret)
#   • PID-namespace limit (deploy.resources.limits.pids) on all services to cap fork-bomb risk
#   • Tighter resource limits (half the base allocation, tunable per operator)
#
# Secret files must be created by the operator before first `up`:
#   mkdir -p secrets/
#   echo -n "$(openssl rand -hex 32)" > secrets/slm_admin_password.txt
#   echo -n "your-jwt-secret"          > secrets/slm_jwt_secret.txt
#   chmod 600 secrets/*.txt
#
# The SLM service reads SLM_ADMIN_PASSWORD_FILE and SLM_JWT_SECRET_FILE
# via autobot_shared.secret_file_utils (see docs/developer/secrets.md).
# Note: Postgres credentials are inherited from the base compose so
# SLM_DATABASE_URL remains consistent with the Postgres user password.
#
# AutoBot - AI-Powered Automation Platform
# Copyright (c) 2025 mrveiss
# Author: mrveiss

secrets:
  slm_admin_password:
    file: ./secrets/slm_admin_password.txt
  slm_jwt_secret:
    file: ./secrets/slm_jwt_secret.txt

services:
  # ── Data layer: make filesystems read-only ────────────────────────────────

  autobot-redis:
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.75'
          pids: 128

  autobot-postgres:
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.75'
          pids: 256

  autobot-chromadb:
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    # NOTE: /data is NOT in tmpfs — it is already writable via the chroma_data
    # named volume in the base compose (named volumes always override
    # read_only: true; adding a second mount at the same path is rejected by
    # Docker Compose with a conflict error).
    #
    # The base compose pins chromadb/chroma:1.5.9 (#9717) — the 1.x Rust server
    # (`dumb-init -- chroma run /config.yaml`). The 0.5.x python/uvicorn app is
    # gone, and with it every 0.5.x workaround this overlay used to carry: the
    # /chroma/.chroma state-dir tmpfs, the /chroma/chroma.log
    # RotatingFileHandler crash, and the command override that dropped
    # --log-config. The 1.x server logs to stdout and writes only to /data and
    # /tmp, so read_only: true plus the tmpfs above is sufficient — verified by
    # starting the service under this overlay until healthy (#9663).
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.75'
          pids: 128

  # ── Application layer ─────────────────────────────────────────────────────

  autobot-backend:
    read_only: true
    tmpfs:
      - /tmp
      - /app/config:mode=1777  # config_manager creates config dir on init
      - /app/.cache:mode=1777  # matplotlib writes to .cache
      - /app/.config:mode=1777  # some libs create .config dir on init
      - /app/autobot-backend/.cache:mode=1777
      - /app/autobot-backend/data:mode=1777  # conversation_file_manager creates data dir on init
      - /app/autobot-backend/logs:mode=1777  # logging_manager creates logs/backup dirs on init
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.5'
          pids: 256

  autobot-worker:
    read_only: true
    tmpfs:
      - /tmp
      - /app/config:mode=1777  # config_manager creates config dir on init
      - /app/.cache:mode=1777  # matplotlib writes to .cache
      - /app/.config:mode=1777  # some libs create .config dir on init
      - /app/autobot-backend/.cache:mode=1777
      - /app/autobot-backend/data:mode=1777  # conversation_file_manager creates data dir on init
      - /app/autobot-backend/logs:mode=1777  # logging_manager creates logs/backup dirs on init
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.5'
          pids: 256

  autobot-slm:
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /app/data/tmp:mode=1777
      - /app/autobot-slm-backend/config:mode=1777
      # /app/logs is writable via slm_logs named volume in base compose
      # /app/data is writable via slm_data named volume; SLM_DATA_DIR=/app/data in base compose
      # ensures .slm_keys is written there, not to the image-layer /app/autobot-slm-backend/data
      # /app/autobot-slm-backend/config is tmpfs; config.py creates it on init
    secrets:
      - slm_admin_password
      - slm_jwt_secret
    environment:
      # Map-style environment merges with base (list-style would replace)
      # The SLM service reads *_FILE variants via autobot_shared.secret_file_utils.
      # SLM_DATA_DIR inherited from base compose (set to /app/data)
      SLM_ADMIN_PASSWORD_FILE: /run/secrets/slm_admin_password
      SLM_JWT_SECRET_FILE: /run/secrets/slm_jwt_secret
      SLM_ADMIN_PASSWORD: ""         # clear the plain-text env var
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.75'
          pids: 256

  autobot-frontend:
    # read_only + tmpfs already set in base compose
    deploy:
      resources:
        limits:
          pids: 64

  # ── Optional services ─────────────────────────────────────────────────────

  autobot-prometheus:
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          pids: 128

  autobot-grafana:
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    deploy:
      resources:
        limits:
          pids: 128
