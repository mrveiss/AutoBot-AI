<!-- Consent Mode v2: defaults before gtag.js -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', {
    analytics_storage:  'denied',
    ad_storage:         'denied',
    ad_user_data:       'denied',
    ad_personalization: 'denied',
    wait_for_update:    500
  });
  (function(){
    var c = localStorage.getItem('ab-consent');
    if (c === 'granted') {
      gtag('consent', 'update', {
        analytics_storage:  'granted',
        ad_storage:         'denied',
        ad_user_data:       'denied',
        ad_personalization: 'denied'
      });
    }
  })();
</script>
