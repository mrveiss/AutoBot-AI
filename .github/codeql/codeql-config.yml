# CodeQL configuration for AutoBot
# Configures scan paths and query packs for Python analysis.
#
# ── How false positives are suppressed (read before adding suppressions) ──────
# Inline `# codeql[query-id]` / `# lgtm[query-id]` source comments are NON-FUNCTIONAL
# for GitHub code scanning — they do NOT dismiss alerts (legacy LGTM.com syntax;
# LGTM.com retired Dec 2022, and the github/codeql-action pipeline does not
# propagate inline-comment suppressions to alert state). See #12307.
#
# Reviewed false positives are suppressed by ONE of:
#   • dismissing the individual alert via the Security tab / REST API
#     (per-alert granularity, persists across runs, does not hide new alerts) —
#     the ONLY way to suppress one query on one file, OR
#   • a `query-filters` exclusion, which removes a QUERY from the whole analysis
#     (every file), OR
#   • a `paths-ignore` entry, which removes a PATH from every query.
#
# A query filter matches QUERY metadata (`id`, `tags`, `kind`, `precision`, ...),
# never a source file. An `exclude:` naming `files:` or `paths:` matches no query
# and suppresses nothing (#16302). Keep each filter's reason in a comment above
# it; repo_tests/codeql_query_filters_match_queries_16302_test.py fails on any
# `query-filters` key CodeQL does not match on.
#
# Full guide: docs/developer/CODEQL_SUPPRESSION.md
#
# Note: Python CodeQL does not support custom sanitizer declarations via
# data extensions (only sourceModel, sinkModel, summaryModel, typeModel).
#
# Related issue: #1826

name: "AutoBot CodeQL Configuration"

# ── Reviewed false positives, applied as code-scanning alert dismissals ───────
# Each pair below is applied as a code-scanning alert dismissal, because a query
# filter cannot scope by file (#16302). These used to be `query-filters` entries
# carrying `files:` / `paths:`, which never suppressed anything. The reasons are
# the reviewed record; a dismissal comment cites the pair's issue.
#
# py/full-ssrf — autobot-backend/skills/external_importer.py
#   URL is validated via _validate_git_url() which enforces SSRF protections:
#   1) Scheme allowlist (https, ssh, git+ssh only)
#   2) For https: is_public_url_async() rejects private IPs
#   3) For ssh: resolve_safe_ip_async() blocks RFC1918/loopback/link-local ranges
#   The validation happens before any use in _run_git(). See #MVA-2605.
#
# py/full-ssrf — autobot_shared/security/ssrf_guard.py
#   This module IS the SSRF guard. Both outbound call sites (fetch_safe_url,
#   pinned_request_with_redirects) are immediately preceded by
#   pinned_connector(url), which runs resolve_safe_ip on that exact URL and pins
#   the resolved public IP into the connector's resolver, defeating DNS-rebind.
#   pinned_request_with_redirects additionally sets allow_redirects=False and
#   re-validates every hop itself rather than letting aiohttp follow one.
#   CodeQL models the caller-supplied URL as reaching the request and cannot
#   see the guard in between. Pre-existing on main (alerts 1042/1045, both
#   dismissed as false positives); surfaced as "new" on #13624 only because
#   that PR edits the line. See #13624.
#
# py/path-injection — autobot-backend/transcriber/upload_security.py
#   validate_upload_path() checks the path before any file operation:
#   1) Prefix check ensures path starts with user_upload_dir (L126-127)
#   2) Path.resolve() canonicalizes and follows symlinks (L132)
#   3) relative_to(user_upload_dir) confirms resolved path is still within allowed directory (L138)
#   4) Symlink rejection (L143)
#   5) File existence and type validation (L147-150)
#   These checks prevent path traversal attacks. See #9214.

packs:
  python:
    - codeql/python-queries
