# CodeQL configuration for AutoBot
# Configures scan paths and query packs for Python analysis.
#
# Note: Python CodeQL does not support custom sanitizer declarations via
# data extensions (only sourceModel, sinkModel, summaryModel, typeModel).
# False positives from custom sanitizers should be dismissed via the
# GitHub Security tab or query filters instead.
#
# Related issue: #1826

name: "AutoBot CodeQL Configuration"

query-filters:
  - exclude:
      id: py/path-injection
      files: autobot-backend/transcriber/upload_security.py
    reason: >-
      Path is validated via multi-layer security checks before any file operation:
      1) Prefix check ensures path starts with user_upload_dir (L126-127)
      2) Path.resolve() canonicalizes and follows symlinks (L132)
      3) relative_to(user_upload_dir) confirms resolved path is still within allowed directory (L137)
      4) Symlink rejection (L144)
      5) File existence and type validation (L149)
      These checks prevent path traversal attacks. See #9214.

packs:
  python:
    - codeql/python-queries

# Paths to scan
paths:
  - autobot-backend
  - autobot_shared
  - autobot-slm-backend

# Paths to ignore
paths-ignore:
  - autobot-frontend/node_modules
  - autobot-backend/venv
  - "**/__pycache__"
  - "**/migrations"
  - "**/tests"
