# Shared environment setup for every job that runs the Python test suite.
#
# #13316: sharding python-suite turns one copy of this block into many (twelve
# matrix shards on the PR gate, twelve more on the nightly coverage run, plus
# the durations job). Duplicating an interpreter version, a dependency set and a
# config fixture that many times guarantees they drift, and a shard that
# installs different packages from the one that measured the durations produces
# a split that is silently wrong rather than visibly broken. Keeping it in one
# composite action makes that class of drift impossible.
#
# It also caches the INSTALLED environment, not just pip's download cache.
# `setup-python`'s `cache: 'pip'` only restores downloaded wheels -- pip still
# resolves the graph and unpacks every package on each run, measured at ~2m30
# per shard. Multiplied across twelve shards that dominated the job.
name: Set up Python suite environment
description: Install the CI-safe Python dependency set and write the CI config fixture.

outputs:
  venv:
    description: >-
      Path to the shared backend virtualenv -- the one this action also
      activates onto $GITHUB_PATH for the rest of the job.
    value: ${{ steps.env.outputs.venv }}
  slm-venv:
    description: >-
      Path to the SLM backend's own virtualenv (#16394), built from
      autobot-slm-backend/requirements.txt instead of the shared
      requirements-ci.txt. Deliberately NOT activated onto $GITHUB_PATH --
      reach it by this path explicitly so it coexists with the backend venv
      above without either clobbering the other's ambient state.
    value: ${{ steps.env-slm.outputs.slm-venv }}

runs:
  using: composite
  steps:
    # #13842: name carries no version -- python-version-file reads the SSOT.
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        # Still worth keeping: this only speeds up the cache-MISS path, where
        # pip has to fetch wheels before building the venv below.
        cache: 'pip'
        cache-dependency-path: |
          requirements*.txt
          autobot-backend/requirements*.txt

    # #14550: system packages ansible installs on every backend host for a
    # real capability (audio extraction here), that setup-python-suite never
    # provisioned. media/audio/ffmpeg_service_test.py::test_real_audio_extraction
    # skip-gates on `shutil.which("ffmpeg")` and was silently skipping on every
    # CI run as a result — a skip that read as a pass in the job summary.
    # tools/lint/check_ci_system_package_provisioning.py enforces the pairing
    # going forward: any new shutil.which(...)-gated test on an ansible-installed
    # binary must have its package added here too, or code-quality fails.
    # Unconditional (not gated on the venv cache hit below): apt state is not
    # part of that cache and must be present on every run regardless.
    #
    # #14550 (post-merge incident): a bare `apt-get install` here hung one
    # shard for the full 60-minute job timeout (ci.yml's python-suite
    # `timeout-minutes: 60`), taking every test in that shard down with it —
    # almost certainly the background apt-daily/unattended-upgrades timer on
    # that runner holding the dpkg lock, the same class of flakiness
    # documented for ansible's own apt-get update at roles/nginx/tasks/main.yml
    # (#6719). `-o DPkg::Lock::Timeout=60` makes apt WAIT up to 60s for the
    # lock instead of an unbounded hang.
    #
    # #14550 (second incident): `timeout-minutes` on THIS step does not exist
    # -- that key is valid on a job, and on a step in a workflow, but a
    # composite action's own steps accept only `run`, `shell`,
    # `working-directory`, `env`, `id`, `if` and `name`. Setting it here made
    # the whole action fail GitHub's template validation before a single step
    # ran, on every shard, not just the one with a stuck lock. Bounding the
    # coreutils `timeout` around each COMMAND instead achieves the same
    # "fail fast, not silently" goal without needing a step-level key that
    # composite actions cannot have. A timeout (exit 124) is a real failure
    # here, deliberately: a wedged apt means the toolchain this PR exists to
    # provision is absent, and the test it gates would pass vacuously again.
    #
    # #14550 (third incident): 6 of 12 shards hit that timeout, one with
    # exit 124 -- the command never finished inside 180s. python-shard runs
    # on `ubuntu-latest` (ci.yml's own comment: "NOT the singleton
    # [self-hosted, Linux, X64] pool"), so each of the 12 shards is a
    # SEPARATE, ephemeral GitHub-hosted VM -- there is no dpkg lock shared
    # BETWEEN shards, and no warm state carried over from a previous run
    # either way (hosted runners are single-use). What twelve INDEPENDENT
    # cold VMs share is the same risk profile: each one independently rolls
    # the dice against its own background apt-daily/unattended-upgrades
    # timer, and with twelve simultaneous trials several are expected to
    # land inside that timer's window. 180s was not enough headroom for
    # that; `command -v ffmpeg` first costs nothing and protects against a
    # future base image that ships ffmpeg (or a future move to a runner
    # pool that reuses state), but does NOT fix today's problem by itself --
    # ffmpeg is absent from ubuntu-latest today, confirmed by this whole
    # PR's own starting point (shutil.which("ffmpeg") returning None is what
    # made test_real_audio_extraction skip in the first place), so every
    # shard still takes the apt path. The actual fix is more headroom on
    # both the per-command wall-clock bound and the dpkg lock wait, sized to
    # the well-documented few-minutes duration of apt-daily on a freshly
    # booted Ubuntu VM, with generous margin against the 60-minute job
    # budget it draws from.
    #
    # #14550 (fourth incident): 11 of 12 shards passed after that increase;
    # one still hit exit 124. A single failed attempt says nothing about
    # whether a second would succeed against a background timer that clears
    # on its own schedule -- that is what a retry is for, and doubling the
    # timeout again would be guessing rather than reasoning about the actual
    # failure mode (transient lock contention, not an undersized budget).
    # Considered making the install lazy instead -- only the one shard whose
    # pytest-split group actually contains ffmpeg_service_test.py would
    # install it, cutting exposure from twelve VMs to one. Rejected: which
    # shard gets that file is decided dynamically by pytest-split's duration
    # balancing (not knowable statically), so determining it here would mean
    # running a `--collect-only` dry pass with the SAME --splits/--group
    # pytest-split sees later, matched exactly or a mismatch silently
    # re-introduces the vacuous-skip bug this PR exists to close -- and
    # tools/lint/check_ci_system_package_provisioning.py already generalises
    # this pairing across every ansible-installed binary, not just ffmpeg;
    # a per-test lazy-install path would only cover this one case and need
    # its own maintenance again for the next one. Three attempts with a
    # short, deliberately modest backoff (the lock holder finishes on its
    # own schedule -- waiting is the point, not a longer single wait)
    # converts a roughly 1-in-12 per-shard race into something far smaller,
    # without pretending to know the right single-attempt budget. Exhausting
    # all three still fails the step: `apt_retry` returns 1, and `set -e`
    # stops the step because the call is a bare statement, not wrapped in an
    # `if`/`&&` that would swallow it -- a genuinely unavailable toolchain
    # must still redden the run.
    #
    # #15515: the retry could not recover from its own timeout. A slow mirror
    # pushed one install past `timeout 300` while dpkg was unpacking. The kill
    # left dpkg interrupted, so attempts 2 and 3 failed at once ("dpkg was
    # interrupted, you must manually run 'sudo dpkg --configure -a'"). Now:
    # - Packages are fetched first, with `--download-only`. Killing a download
    #   is harmless and the next attempt resumes it. The install still runs
    #   under the same bound; a kill there is what the repair below is for.
    #   apt also retries a failed fetch itself, and drops a connection that
    #   has sent nothing for a while.
    # - Between attempts, `dpkg --configure -a` repairs an interrupted unpack.
    # - `apt-get update` is advisory. The runner image carries third-party
    #   sources this step never installs from, and one of them failing fails
    #   update even when the Ubuntu indexes arrived: a Hash Sum mismatch on
    #   dl.google.com's Chrome repository failed all twelve shards of five runs
    #   that way on 2026-09-09. So an exhausted update warns and the installs,
    #   which fail if the Ubuntu indexes are really missing, stay the gate.
    # - Each failure names its step and apt's own exit code, saved before
    #   anything else runs. The last one is an annotation titled as a
    #   provisioning failure, so a red shard that ran no tests says so.
    # Caching or pre-baking the packages was considered and not done: hosted
    # runners are single-use images this repo cannot pre-bake, and a .deb
    # cache keyed on the runner image adds a moving part for a failure mode
    # the recovery above addresses directly. Revisit if provisioning reds
    # persist after it.
    #
    # #13896: the OCR fallback needs the tesseract *binary*, not just the
    # pytesseract binding. Ansible installs tesseract-ocr on every backend host
    # (roles/backend/tasks/main.yml), but nothing installed it here — so
    # pytesseract imported fine, get_tesseract_version() raised, and every OCR
    # test skipped. That is #13885's exact shape reproduced in CI: the binding
    # present, the binary absent, and a green run that proved nothing.
    #
    # Deliberately NOT inside the venv-cache guard below: the cache holds the
    # virtualenv, not apt state, so a cache hit would skip this and the binary
    # would be missing on exactly the runs that reuse a warm cache.
    - name: "Install CI system packages (#14550, #13896)"
      shell: bash
      run: |
        set -euo pipefail
        if command -v ffmpeg >/dev/null 2>&1 && command -v tesseract >/dev/null 2>&1; then
          echo "ffmpeg and tesseract already present"
          exit 0
        fi
        export DEBIAN_FRONTEND=noninteractive

        # Every bound this step uses, named once (#15515).
        readonly APT_ATTEMPTS=3           # tries per apt command
        readonly APT_TIMEOUT_S=300        # wall-clock bound per try, and per dpkg repair
        # #18102: the DOWNLOAD phase gets its own, larger bound, and fewer tries.
        #
        # Why this is not the timeout-doubling #14550 rejected as guessing: that objection
        # was about an undersized budget being one hypothesis among several, with lock
        # contention the likelier. The exit code now rules the alternatives out. apt is
        # configured to drop a connection idle for APT_HTTP_IDLE_S and to retry a failed
        # fetch APT_FETCH_RETRIES times, so a stalled mirror ends an attempt with apt's own
        # non-zero status at roughly 120s. What four occurrences on 2026-10-08 actually
        # showed was exit 124 -- coreutils timeout killing it at the full 300s -- on every
        # attempt. A connection that never stalled for 30s was receiving data; it was simply
        # too slow to finish. So the bound is the constraint, for the download only.
        #
        # Fewer, longer tries is the right shape here precisely because `--download-only`
        # resumes: attempt 2 continues from what attempt 1 fetched, so three restarts of a
        # 300s budget buy less than two of 540s. The install phase keeps the 300s bound --
        # a kill there interrupts dpkg, which is what the repair between attempts is for,
        # and that risk does not improve with a longer wait.
        readonly APT_DOWNLOAD_TIMEOUT_S=540   # wall-clock bound per download try
        readonly APT_DOWNLOAD_ATTEMPTS=2      # tries per download command (it resumes)
        readonly APT_BACKOFF_S=15         # the sleep after try N is N times this
        readonly APT_FETCH_RETRIES=3      # apt's own retries of one failed download
        readonly APT_HTTP_IDLE_S=30       # drop a connection that sends nothing this long
        readonly APT_LOCK_WAIT_S=120      # wait this long for the dpkg lock
        readonly TIMEOUT_KILLED=124       # coreutils timeout's exit status when it kills

        # apt_retry LABEL COMMAND...: up to APT_ATTEMPTS tries (#15515, above).
        # With APT_ADVISORY=1 an exhausted command warns and returns 0.
        # APT_TRIES as a command prefix is scoped to the call: bash applies an assignment
        # preceding a function to that invocation only, so the download calls get
        # APT_DOWNLOAD_ATTEMPTS and the install calls below still get APT_ATTEMPTS.
        # Verified, because POSIX mode would make it persist and silently drop the installs
        # to two tries; this step runs `bash -e`, not `bash --posix`.
        #
        # Bytes already fetched, so a failure says whether it was progressing (#18102).
        #
        # #18102 review: `sudo` is load-bearing, not cosmetic. apt stages in-progress
        # downloads in archives/partial/ at mode 0700, so an unprivileged `du` cannot read
        # them and counts only completed files -- which, for a transfer killed mid-flight,
        # is nothing. The instrument would then print `0 -> 0` and name a *stalled* mirror
        # on the exact failure it exists to diagnose, reporting the opposite of the truth.
        #
        # It reports `unknown` rather than 0 when the measurement itself fails: a `0` from a
        # failed command is not a measurement (docs/developer/MEASUREMENT_DISCIPLINE.md),
        # and collapsing the two would reintroduce that same confusion by another route.
        # The `|| echo 0` this replaces could not work anyway -- the exit status of
        # `du | cut` is cut's, so a failed du still exited 0 with empty output.
        apt_cached_bytes() {
          local out n
          out=$(sudo du -sb /var/cache/apt/archives 2>/dev/null) || { printf 'unknown'; return 0; }
          n=${out%%[!0-9]*}
          printf '%s' "${n:-unknown}"
        }

        apt_retry() {
          local label=$1 attempt rc=0 why="" tries="${APT_TRIES:-$APT_ATTEMPTS}" before after
          shift
          for ((attempt = 1; attempt <= tries; attempt++)); do
            rc=0
            before=$(apt_cached_bytes)
            "$@" || rc=$?
            if [ "$rc" -eq 0 ]; then return 0; fi
            after=$(apt_cached_bytes)
            why=""
            if [ "$rc" -eq "$TIMEOUT_KILLED" ]; then why=", timed out"; fi
            # #18102 AC1: a bound that is too small and a mirror that is stalled both end
            # here with the same exit code. The delta tells them apart, so the next
            # occurrence is diagnosable from its own log instead of being inferred.
            echo "apt: ${label}: attempt ${attempt}/${tries} failed (exit ${rc}${why}); archive cache ${before} -> ${after} bytes" >&2
            if [ "$attempt" -eq "$tries" ]; then break; fi
            timeout "$APT_TIMEOUT_S" sudo dpkg --configure -a || echo "apt: dpkg --configure -a exited $?; the next attempt reports why" >&2
            sleep $((attempt * APT_BACKOFF_S))
          done
          if [ "${APT_ADVISORY:-0}" = 1 ]; then
            echo "::warning title=apt ${label} failed (continuing)::${label} failed ${tries} times, last exit ${rc}${why}; the installs decide" >&2
            return 0
          fi
          echo "::error title=CI toolchain provisioning failed (no tests ran)::${label} failed ${tries} times, last exit ${rc}${why}, archive cache at $(apt_cached_bytes) bytes" >&2
          return 1
        }

        # Retry and lock settings for every apt call below. Unlike the image
        # builds (#16291) there is no Error-Mode here: the runner image's own
        # sources are outside this repo, and one of them failing must not fail
        # a shard whose packages come from the Ubuntu archive.
        printf '%s\n' "Acquire::Retries \"${APT_FETCH_RETRIES}\";" "Acquire::http::Timeout \"${APT_HTTP_IDLE_S}\";" \
          "DPkg::Lock::Timeout \"${APT_LOCK_WAIT_S}\";" \
          | sudo tee /etc/apt/apt.conf.d/80-ci-provisioning >/dev/null

        APT_ADVISORY=1 apt_retry "update" timeout "$APT_TIMEOUT_S" sudo apt-get update -qq

        # #18102: install from prefetched .debs when a caller supplied them, touching the
        # network not at all.
        #
        # The twelve shards used to run this same ~100MB fetch each, so one CI run made the
        # same download up to twelve times and a different shard drew the slow mirror every
        # time -- four reds on 2026-10-08 were shards 4, 1, 2 and 6. ci.yml now fetches once
        # in `provision-packages` and hands the archives to every shard as an artifact.
        #
        # Placed AFTER `apt-get update` deliberately (#18102 review): `--no-download`
        # resolves the version to install from THIS runner's package indexes, and a
        # GitHub-hosted image can ship indexes older than the provisioning runner's. If
        # the shard's stale index selects a different version than the archive on disk,
        # `--no-download` cannot satisfy it and the shard silently falls back to the
        # network -- restoring the twelve downloads this change exists to remove. Both
        # sides now resolve against freshly updated indexes. The update itself is
        # advisory and small; the ~100MB of packages is what was being repeated.
        #
        # This branch is OPTIONAL on purpose. coverage.yml and test-durations.yml call this
        # action without that job, so an absent directory must fall through to the fetch
        # below rather than fail -- and an insufficient set must fall through too, since a
        # stale artifact that cannot satisfy the install is not a reason to lose the suite.
        readonly PREFETCHED_DEBS="${RUNNER_TEMP:-/tmp}/apt-debs"
        if [ -n "$(find "$PREFETCHED_DEBS" -maxdepth 1 -name '*.deb' -print -quit 2>/dev/null)" ]; then
          echo "provisioning from $(find "$PREFETCHED_DEBS" -maxdepth 1 -name '*.deb' | wc -l) prefetched .deb(s) — no network (#18102)"
          sudo cp "$PREFETCHED_DEBS"/*.deb /var/cache/apt/archives/
          # Installed exactly as they were downloaded: ffmpeg without recommends and
          # tesseract-ocr with them, so the cached set matches what apt resolves here.
          if sudo apt-get install -y --no-download --no-install-recommends ffmpeg \
            && sudo apt-get install -y --no-download tesseract-ocr; then
            echo "installed: $(ffmpeg -version | head -1); $(tesseract --version 2>&1 | head -1)"
            exit 0
          fi
          echo "::warning title=prefetched .debs did not satisfy the install::falling back to a network fetch (#18102)" >&2
        fi
        APT_TRIES=$APT_DOWNLOAD_ATTEMPTS apt_retry "download ffmpeg" \
          timeout "$APT_DOWNLOAD_TIMEOUT_S" sudo apt-get install -y --download-only --no-install-recommends ffmpeg
        APT_TRIES=$APT_DOWNLOAD_ATTEMPTS apt_retry "download tesseract-ocr" \
          timeout "$APT_DOWNLOAD_TIMEOUT_S" sudo apt-get install -y --download-only tesseract-ocr
        apt_retry "install ffmpeg" timeout "$APT_TIMEOUT_S" sudo apt-get install -y --no-install-recommends ffmpeg
        apt_retry "install tesseract-ocr" timeout "$APT_TIMEOUT_S" sudo apt-get install -y tesseract-ocr
        echo "installed: $(ffmpeg -version | head -1); $(tesseract --version 2>&1 | head -1)"

    # The venv lives OUTSIDE the workspace on purpose. Inside it, `actions/
    # checkout` and the several `rm -rf .venv` cleanup steps elsewhere in this
    # repo would fight over it, and pytest would try to collect tests out of
    # site-packages.
    - name: Resolve environment paths
      id: env
      shell: bash
      run: |
        echo "venv=$HOME/.venv-python-suite" >> "$GITHUB_OUTPUT"
        # The exact patch version matters: a venv records an absolute path to
        # the interpreter that created it, so restoring one built against
        # 3.14.6 onto a runner with 3.14.7 yields a venv whose python is a
        # dangling symlink. Keying on the full version makes that a clean miss.
        echo "pyversion=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"

    - name: Restore cached virtualenv
      id: venv-cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.env.outputs.venv }}
        # No `restore-keys`. A partial-match restore would hand back an
        # environment built from DIFFERENT requirements, which is precisely the
        # silent-staleness failure this cache must avoid. Exact hit or full
        # reinstall, nothing in between.
        #
        # requirements-ci-test.txt is in the hash on purpose: that list used to
        # be inline in the workflow, where no cache key could see it, so a test
        # tool bump would have silently reused an environment still holding the
        # old versions.
        key: venv-python-suite-${{ runner.os }}-py${{ steps.env.outputs.pyversion }}-${{ hashFiles('requirements-ci.txt', 'requirements-ci/*.txt', 'requirements-ci-test.txt', 'constraints/*.txt') }}

    - name: Install Python dependencies
      # Only on a miss. On a hit the venv is already complete and this whole
      # step is skipped, which is where the saving comes from.
      if: steps.venv-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VENV: ${{ steps.env.outputs.venv }}
      run: |
        set -euo pipefail
        # Rebuild from scratch so a partially-populated directory left behind by
        # a failed earlier attempt can never masquerade as a complete env.
        rm -rf "$VENV"
        python -m venv "$VENV"
        "$VENV/bin/python" -m pip install --upgrade pip setuptools wheel

        echo "Installing CI-safe requirements..."
        # #13316: requirements-ci.txt never names torch -- it arrives
        # transitively via sentence-transformers. Resolved against PyPI that
        # pulls the CUDA build, whose dependency closure is ~1.6GB of nvidia-*
        # wheels plus a 526MB torch, onto a runner with no GPU (3.1GB per run).
        # Resolving against PyTorch's CPU index instead yields `torch==X.Y.Z+cpu`
        # with a 10-package closure and ZERO nvidia-* wheels (verified with
        # `pip install --dry-run --report` for cp314/manylinux_2_28_x86_64). The
        # local version segment `+cpu` sorts above the plain PyPI release under
        # PEP 440, so the CPU build wins without torch being pinned anywhere.
        #
        # It is also what makes this cache viable: a ~3GB environment would cost
        # more to upload and restore than skipping the install ever saves.
        "$VENV/bin/python" -m pip install -r requirements-ci.txt --prefer-binary \
          --extra-index-url https://download.pytorch.org/whl/cpu

        echo "Installing testing dependencies..."
        "$VENV/bin/python" -m pip install -r requirements-ci-test.txt --prefer-binary \
          --extra-index-url https://download.pytorch.org/whl/cpu

    # #16394: a SECOND, PARALLEL venv for the SLM backend's tests, built from
    # its own requirements.txt instead of the shared requirements-ci.txt the
    # backend venv above installs. autobot-backend/requirements.txt's
    # langgraph-sdk caps websockets<16; autobot-slm-backend/requirements.txt
    # declares websockets>=17.1,<18 -- the version already running in SLM
    # production. One venv cannot satisfy both floors, so before this, ci.yml's
    # "Run unit tests — slm-backend" step (#13300) always ran SLM's tests
    # against websockets 15.0.1, a version SLM's own manifest forbids and
    # production never runs. #16391 tried lowering SLM's floor to fit the
    # shared venv; a reviewer rejected that as downgrading SLM production for a
    # CI convenience, and carried a named exemption in
    # pipeline-scripts/check_dependency_floors.py instead, pointing at this
    # issue for the real fix. This block, plus ci.yml pointing the slm-backend
    # test step at $SLM_VENV instead of the ambient `python`, is that fix --
    # and it is what lets that exemption be removed.
    #
    # Placed BEFORE "Activate virtualenv for subsequent steps" below on
    # purpose: that step swaps the ambient `python` on $GITHUB_PATH for the
    # BACKEND venv's interpreter, and `python -m venv` below must still resolve
    # to the plain system interpreter actions/setup-python@v7 provisioned --
    # the same one "Resolve environment paths" and "Install Python
    # dependencies" above already used -- not to a venv nested inside another
    # venv.
    - name: Resolve SLM environment paths
      id: env-slm
      shell: bash
      run: |
        echo "slm-venv=$HOME/.venv-python-suite-slm" >> "$GITHUB_OUTPUT"

    - name: Restore cached SLM virtualenv
      id: venv-cache-slm
      uses: actions/cache@v6
      with:
        path: ${{ steps.env-slm.outputs.slm-venv }}
        # Mirrors "Restore cached virtualenv" above: no `restore-keys` -- exact
        # hit or full reinstall, so a partial match can never hand back an
        # environment built from a DIFFERENT autobot-slm-backend/requirements.txt.
        #
        # Keyed on requirements-ci-test.txt (the shared pytest/xdist/pytest-split
        # toolchain both venvs need), NOT requirements-ci.txt -- that file is the
        # backend's own combined set, and installing it here is exactly the
        # venv-sharing this split exists to undo. Same pyversion as the backend
        # key: this step runs before the backend venv is activated onto
        # $GITHUB_PATH (see the comment above), so `steps.env.outputs.pyversion`
        # already names the same interpreter this venv is about to be built
        # from -- recomputing it here would just repeat that same command.
        key: venv-python-suite-slm-${{ runner.os }}-py${{ steps.env.outputs.pyversion }}-${{ hashFiles('autobot-slm-backend/requirements.txt', 'requirements-ci-test.txt', 'constraints/*.txt') }}

    - name: Install SLM Python dependencies
      # Only on a miss, same as the backend install above.
      if: steps.venv-cache-slm.outputs.cache-hit != 'true'
      shell: bash
      env:
        SLM_VENV: ${{ steps.env-slm.outputs.slm-venv }}
      run: |
        set -euo pipefail
        rm -rf "$SLM_VENV"
        python -m venv "$SLM_VENV"
        "$SLM_VENV/bin/python" -m pip install --upgrade pip setuptools wheel

        echo "Installing SLM-safe requirements..."
        # Unlike requirements-ci.txt, autobot-slm-backend/requirements.txt names
        # no torch-pulling package -- checked, it declares no torch,
        # sentence-transformers, transformers or onnx entry at all. So unlike
        # the backend install above, there is no CUDA-build-off-PyPI problem
        # for a --extra-index-url to solve here; adding one anyway would be
        # cargo-culting a fix for a problem this file does not have.
        "$SLM_VENV/bin/python" -m pip install -r autobot-slm-backend/requirements.txt --prefer-binary

        echo "Installing testing dependencies..."
        "$SLM_VENV/bin/python" -m pip install -r requirements-ci-test.txt --prefer-binary

    - name: Verify the SLM environment is complete
      shell: bash
      env:
        SLM_VENV: ${{ steps.env-slm.outputs.slm-venv }}
      run: |
        set -euo pipefail
        # Same reasoning as "Verify the environment is complete" below: a
        # restored cache is only useful if it actually satisfies the pinned set.
        if [ ! -x "$SLM_VENV/bin/python" ]; then
          echo "::error::SLM virtualenv at $SLM_VENV is missing or broken after setup."
          exit 1
        fi
        "$SLM_VENV/bin/python" -m pytest --version
        "$SLM_VENV/bin/python" -c "import xdist, pytest_split; print('xdist + pytest-split present')"
        "$SLM_VENV/bin/python" -m pip check \
          || echo "::warning::pip check reported dependency conflicts (pre-existing, not introduced by the cache)"

    - name: Activate virtualenv for subsequent steps
      shell: bash
      env:
        VENV: ${{ steps.env.outputs.venv }}
        CACHE_HIT: ${{ steps.venv-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        # Fail loudly rather than silently falling back to the system
        # interpreter, which would run the suite against a different and
        # incomplete dependency set.
        if [ ! -x "$VENV/bin/python" ]; then
          echo "::error::Virtualenv at $VENV is missing or broken after setup."
          exit 1
        fi
        echo "$VENV/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$VENV" >> "$GITHUB_ENV"
        echo "venv cache-hit: ${CACHE_HIT:-false}"
        echo "Using $("$VENV/bin/python" -V) from $VENV"

    - name: Verify the environment is complete
      shell: bash
      env:
        VENV: ${{ steps.env.outputs.venv }}
      run: |
        set -euo pipefail
        # A restored cache is only useful if it actually satisfies the pinned
        # set. This turns a subtly incomplete environment into an immediate,
        # named failure instead of a confusing test error many minutes later.
        "$VENV/bin/python" -m pytest --version
        "$VENV/bin/python" -c "import xdist, pytest_split; print('xdist + pytest-split present')"
        "$VENV/bin/python" -m pip check \
          || echo "::warning::pip check reported dependency conflicts (pre-existing, not introduced by the cache)"

    - name: Create necessary directories and config files
      shell: bash
      run: |
        mkdir -p data logs static config
        touch data/.gitkeep logs/.gitkeep static/.gitkeep

        # Minimal config.yaml for CI testing. `redis.host`/`redis.port` point at
        # the service container the calling job declares (#13316).
        cat > config/config.yaml << 'EOF'
        # CI Testing Configuration
        llm:
          orchestrator_llm: "mock"
          task_llm: "mock"
          ollama:
            model: "mock-model"
            models: {}
          unified:
            embedding:
              providers:
                ollama:
                  selected_model: "mock-embed"

        deployment:
          mode: "local"

        data:
          reliability_stats_file: "data/reliability_stats.json"

        diagnostics:
          enabled: false
          use_llm_for_analysis: false
          use_web_search_for_analysis: false
          auto_apply_fixes: false

        redis:
          host: "localhost"
          port: 6379
          db: 0
        EOF
