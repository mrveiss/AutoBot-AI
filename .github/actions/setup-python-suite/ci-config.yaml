# CI Testing Configuration
llm:
  orchestrator_llm: "mock"
  task_llm: "mock"
  ollama:
    model: "mock-model"
    models: {}
  unified:
    embedding:
      providers:
        ollama:
          selected_model: "mock-embed"

# #19316: no deployment.mode -- AUTOBOT_DEPLOYMENT_MODE is the one home; unset is auto-detect.

data:
  reliability_stats_file: "data/reliability_stats.json"

diagnostics:
  enabled: false
  use_llm_for_analysis: false
  use_web_search_for_analysis: false
  auto_apply_fixes: false

redis:
  host: "localhost"
  port: 6379
  db: 0
