# Copyright (c) 2025 mrveiss
# Author: mrveiss
#
# Regenerate the backend and SLM generated types and report any drift with the patch
# that fixes it (#10817, #14368, #15362). The steps behind auto-fix-generated-types.yml
# (pull_request) and dispatch-generated-types.yml (workflow_dispatch, #18500); each
# caller checks out its own tree first and then runs this. Their history is in
# auto-fix-generated-types.yml's header.
#
# A composite action rather than a reusable workflow (#18500): a reusable workflow
# needs the ref as an input, and CodeQL reads a checkout of `inputs.ref` -- or of
# `github.head_ref` -- in any dispatch-triggerable workflow as untrusted code with
# default-branch cache access (actions/cache-poisoning/poisonable-step), whatever
# guards it. Here the dispatch caller does a plain checkout with no ref at all.

name: Generated types autofix
description: Regenerate api.ts for the backend and the SLM and report drift with its patch

runs:
  using: composite
  steps:
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        cache: 'pip'
        cache-dependency-path: |
          requirements*.txt
          autobot-backend/requirements*.txt
          autobot-slm-backend/requirements.txt

    - name: Install backend dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -r requirements-ci.txt --prefer-binary

    - name: Dump authoritative OpenAPI schema
      shell: bash
      run: |
        set -o pipefail
        export PYTHONPATH="$PWD:$PWD/autobot-backend:${PYTHONPATH:-}"
        mkdir -p data logs static config
        if ! python scripts/audit_api_wiring.py --dump-openapi openapi.raw.json; then
          echo "::error::Backend app.openapi() build failed — cannot regenerate types (see startup-import-smoke)."
          exit 1
        fi
        # Strip the audit-only x-websocket-paths extension so the schema matches
        # exactly what verify-generated-types diffs against.
        python -c "import json; s=json.load(open('openapi.raw.json')); s.pop('x-websocket-paths', None); json.dump(s, open('openapi.json','w'))"

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'
        cache-dependency-path: |
          autobot-frontend/package-lock.json
          autobot-slm-frontend/package-lock.json

    - name: Install frontend dependencies
      shell: bash
      working-directory: autobot-frontend
      # #13410: no CI job runs Cypress (only `test:e2e` needs the binary), so
      # skip the ~100MB CDN download — a Cypress CDN 504 must never red out a
      # required check. Local dev `npm ci` is unaffected and still gets it.
      env:
        CYPRESS_INSTALL_BINARY: '0'
      run: npm ci

    - name: Regenerate api.ts from authoritative schema
      shell: bash
      working-directory: autobot-frontend
      run: npx --no-install openapi-typescript ../openapi.json -o src/types/generated/api.ts --additional-properties

    - name: Set up isolated venv for SLM backend dependencies
      shell: bash
      # #14368: autobot-slm-backend/requirements.txt pins its own
      # fastapi/pydantic/starlette range plus packages the backend never
      # imports (croniter, authlib, ldap3, pysaml2, pyotp, bcrypt,
      # PyJWT[crypto], ...) — the same reason `verify-generated-types-slm`
      # runs as a separate job from `verify-types-run` rather than sharing
      # its environment. A venv gets the same isolation here without a
      # second job, so this stays the one push/approve pair the backend
      # already has.
      run: python -m venv .venv-slm

    - name: Install SLM backend dependencies
      shell: bash
      run: |
        .venv-slm/bin/python -m pip install --upgrade pip setuptools wheel
        .venv-slm/bin/python -m pip install -r autobot-slm-backend/requirements.txt --prefer-binary

    - name: Dump authoritative SLM OpenAPI schema
      shell: bash
      run: |
        set -o pipefail
        mkdir -p data logs static config autobot-slm-backend/data
        export PYTHONPATH="$PWD:$PWD/autobot-slm-backend:${PYTHONPATH:-}"
        if ! .venv-slm/bin/python scripts/audit_api_wiring.py --dump-slm-openapi slm_openapi.raw.json; then
          echo "::error::SLM backend app.openapi() build failed — cannot regenerate types (see startup-import-smoke)."
          exit 1
        fi
        # Same recipe as verify-generated-types-slm: strip the audit-only
        # x-websocket-paths extension and write with the exact formatting
        # (indent=2, sort_keys, trailing newline) `npm run gen:types:openapi`
        # produces locally, so the two can never disagree on the diff.
        .venv-slm/bin/python -c "
        import json
        s = json.load(open('slm_openapi.raw.json'))
        s.pop('x-websocket-paths', None)
        with open('autobot-slm-frontend/openapi.json', 'w', encoding='utf-8') as f:
            json.dump(s, f, indent=2, sort_keys=True, ensure_ascii=False)
            f.write('\n')
        "

    - name: Install SLM frontend dependencies
      shell: bash
      working-directory: autobot-slm-frontend
      run: npm ci

    - name: Regenerate SLM api.ts from authoritative schema
      shell: bash
      working-directory: autobot-slm-frontend
      run: npx --no-install openapi-typescript openapi.json -o ../libs/slm-contract/src/generated/api.ts --additional-properties

    - name: Report drift with the command that fixes it (#15362)
      shell: bash
      run: |
        rm -f openapi.raw.json openapi.json slm_openapi.raw.json
        rm -rf .venv-slm
        GENERATED="autobot-frontend/src/types/generated/api.ts autobot-slm-frontend/openapi.json libs/slm-contract/src/generated/api.ts"
        # shellcheck disable=SC2086  # deliberate word splitting over the path list
        if git diff --quiet -- $GENERATED; then
          echo "Generated types already fresh - nothing to report."
          echo "Generated types are in sync with the OpenAPI schema(s)." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # The patch goes to an artifact so the fix can be applied without re-deriving
        # it, and the summary names the command. #15362 AC3: the fix has to be
        # discoverable, not merely detected.
        # shellcheck disable=SC2086
        git diff -- $GENERATED > generated-types.patch
        {
          echo "### Generated API types have drifted"
          echo
          echo "The committed types do not match the OpenAPI schema(s). This workflow no"
          echo "longer pushes the fix to your branch: that invalidated every check already"
          echo "running and cost a full CI pass for a codegen nit (#15362)."
          echo
          echo "Apply the patch from this run's artifacts:"
          echo
          echo "    git apply generated-types.patch"
          echo
          echo "The required verify-generated-types check stays red until the regenerated"
          echo "files are committed."
        } >> "$GITHUB_STEP_SUMMARY"

        echo "::error title=Generated types drifted::Apply generated-types.patch from this run's artifacts, or regenerate and commit. The required verify-generated-types gate stays red until you do (#15362)."
        exit 1

    - name: Upload the patch that fixes the drift
      if: failure()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: generated-types-patch
        path: generated-types.patch
        if-no-files-found: warn
        retention-days: 7
