#
# Composite action: Setup Python + install CI dependencies (GH#7086)
#
# Encapsulates the repeated "setup Python + pip bootstrap + install deps"
# pattern, so the interpreter version, pip cache and dependency install live in
# one place rather than a copy per workflow.
#
# #13517: this previously claimed to be "shared across ci.yml, code-quality.yml,
# and other workflows" while having ZERO callers — neither of those files used
# it, and nothing else did either. A description that names callers it does not
# have is worse than none: it reads as load-bearing shared infrastructure, so
# nobody checks, and the three expression-injection sites it carried (#13516)
# sat unreviewed because the file looked established.
#
# Current callers (keep this list honest — it is the only thing standing between
# this file and being orphaned again):
#   api-wiring.yml            enforce-precommit.yml   migration-gate.yml
#   auto-fix-formatting.yml   marker-tests.yml        startup-import-smoke.yml
#   canonical-audit.yml       constraint-drift.yml    coverage.yml
#
# 12 workflows still call actions/setup-python directly. Converting them is
# worthwhile but not required for this action to be legitimate — each needs its
# own cache-dependency-path carried across, which is why it is going in
# tranches rather than one sweep.
#
# #15313: actions/setup-python resolves a version by downloading a build from
# actions/python-versions when it is not already in the runner's tool cache.
# That publisher only ships builds for LTS Ubuntu releases (22.04, 24.04,
# 26.04...); this repo's self-hosted runners are on 25.10, a non-LTS release
# with no published build, so any self-hosted job needing a version GitHub
# has not pre-cached fails outright (proven live on PR #15311). Moving the
# runner OS to an LTS release is the fix that closes the whole class, but it
# is a host change this repo cannot make. What IS available from here: on a
# self-hosted runner, skip actions/setup-python's download path entirely and
# use the interpreter already on that host's PATH -- if it is missing, this
# fails with a clear, actionable message instead of setup-python's opaque
# "not found for Ubuntu 25.10". GitHub-hosted runners are unaffected; they
# keep using actions/setup-python's normal (cached) path below.
#
# Usage:
#   - uses: ./.github/actions/setup-python-ci
#     with:
#       python-version: '3.14'
#       requirements-file: 'requirements-ci.txt'
#       extra-packages: 'pytest pytest-asyncio mypy'

name: Setup Python CI
description: 'Set up Python with pip caching, upgrade pip/setuptools/wheel, and install project dependencies.'

inputs:
  python-version:
    description: 'Python version to install (e.g. "3.14")'
    required: false
    default: '3.14'
  requirements-file:
    description: 'Path to requirements file to install (relative to repo root). Empty to skip.'
    required: false
    default: ''
  extra-packages:
    description: 'Space-separated list of additional pip packages to install after requirements-file.'
    required: false
    default: ''
  cache-dependency-path:
    description: >-
      Files whose hashes key pip's download cache. Most callers pin this to their
      own requirements files; without it setup-python keys on a default glob, so
      unrelated workflows share and evict each other's cache entries (#13517).
    required: false
    default: ''

outputs:
  python-version:
    description: 'The resolved Python version that was installed.'
    value: ${{ steps.setup.outputs.python-version || steps.setup-self-hosted.outputs.python-version }}
  cache-key:
    description: 'The pip cache key used (for documentation and debugging).'
    value: ${{ steps.cache-key.outputs.value }}

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }} (github-hosted)
      id: setup
      if: runner.environment != 'self-hosted'
      # #13517: was pinned to a v5 SHA while every workflow in this repo is
      # already on v7. Adopting the action as-was would have silently
      # downgraded setup-python across 21 jobs.
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    # #15313: no download here. If the requested interpreter is not already
    # on PATH, this fails loudly (exit 1, ::error::) rather than falling
    # through to a mismatched system Python silently.
    - name: Resolve system Python ${{ inputs.python-version }} (self-hosted)
      id: setup-self-hosted
      if: runner.environment == 'self-hosted'
      shell: bash
      env:
        PY_VERSION: ${{ inputs.python-version }}
      run: |
        BIN="python${PY_VERSION}"
        if ! command -v "$BIN" >/dev/null 2>&1; then
          echo "::error::Self-hosted runner has no '$BIN' on PATH. actions/setup-python" \
            "cannot download a build for this runner's OS release when it is not an LTS" \
            "GitHub publishes for (#15313) -- install $BIN on this host, or move this job" \
            "back to a GitHub-hosted runner." >&2
          exit 1
        fi
        RESOLVED="$("$BIN" -c 'import platform; print(platform.python_version())')"
        echo "python-version=${RESOLVED}" >> "$GITHUB_OUTPUT"

        # #15310: build a venv from the resolved interpreter and put it first
        # on PATH. This replaces an earlier symlink shim, and solves three
        # problems that the shim solved none or one of:
        #
        #   PEP 668. Debian/Ubuntu mark their Python installs
        #   externally-managed, so `pip install` into system site-packages is
        #   refused outright ("externally-managed-environment"). Observed live:
        #   one runner refused, its sibling did not, because the two hosts had
        #   been provisioned differently -- an intermittent failure that depends
        #   on which runner picks the job.
        #
        #   Console scripts on PATH. pip puts them in the user script directory
        #   when site-packages is not writable, which is not on a service
        #   runner's PATH -- `pre-commit: command not found`, swallowed by a
        #   step that then reports success.
        #
        #   Host cleanliness. Nothing is installed outside RUNNER_TEMP, so the
        #   runners stay in their default GitHub configuration: no packages
        #   added to the system interpreter, no .path or .env edits, nothing to
        #   undo. The venv dies with the job.
        #
        # `python`, `python3` and `pip` all resolve here, so later steps need no
        # knowledge of any of this.
        VENV_DIR="${RUNNER_TEMP}/setup-python-ci-venv"
        rm -rf "$VENV_DIR"
        if ! "$BIN" -m venv "$VENV_DIR"; then
          echo "::error::Could not create a venv with $BIN. Install the" \
               "matching python venv package on this runner (#15310)."
          exit 1
        fi
        echo "$VENV_DIR/bin" >> "$GITHUB_PATH"
        echo "Built venv at $VENV_DIR from $BIN (#15310)."

        echo "Resolved $BIN -> $RESOLVED with no download (#15313)."

    # #13516: every input reaches the shell through `env:`, never inline
    # `${{ }}` in a `run:` body. Inline interpolation is textual substitution
    # into the script *before* bash sees it, so a value containing shell
    # metacharacters becomes code rather than data. The `env:` hop makes it a
    # variable, which bash cannot re-interpret.
    #
    # These were unreachable while this action had no callers (#13517). They are
    # fixed FIRST precisely so wiring it up cannot turn `pip install -r $X` into
    # RCE on the runner.
    - name: Compute cache key
      id: cache-key
      shell: bash
      env:
        PY_VERSION: ${{ inputs.python-version }}
        REQ_HASH: ${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
      run: |
        echo "value=python-${PY_VERSION}-pip-${REQ_HASH}" >> "$GITHUB_OUTPUT"

    # actions/setup-python's `cache: 'pip'` above only runs on the
    # github-hosted branch. Self-hosted gets the equivalent explicitly, since
    # skipping actions/setup-python there (#15313) also skips its caching.
    - name: Cache pip downloads (self-hosted)
      if: runner.environment == 'self-hosted'
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ steps.cache-key.outputs.value }}
        restore-keys: |
          python-${{ inputs.python-version }}-pip-

    - name: Upgrade pip, setuptools, wheel
      shell: bash
      run: python -m pip install --upgrade pip setuptools wheel

    - name: Install requirements file
      if: inputs.requirements-file != ''
      shell: bash
      env:
        REQ_FILE: ${{ inputs.requirements-file }}
      run: python -m pip install -r "$REQ_FILE" --prefer-binary

    - name: Install extra packages
      if: inputs.extra-packages != ''
      shell: bash
      env:
        EXTRA_PKGS: ${{ inputs.extra-packages }}
      # Deliberately unquoted: this input is a space-separated package list and
      # word-splitting is the intent. The `env:` hop still defeats expression
      # injection — the value can no longer become shell syntax, only arguments.
      run: python -m pip install $EXTRA_PKGS
