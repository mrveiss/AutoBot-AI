      - "security"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # context7 MCP tool has its own npm deps — Dockerfile FROM is tracked above
  # but the package.json runtime deps need their own ecosystem.
  # (#7170 self-review found this — surfaced after #7163 + #7170 merged)
  - package-ecosystem: "npm"
    directory: "/autobot-infrastructure/shared/mcp/tools/context7"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "devops"
    groups:
      all-dependencies:
        patterns:
          - "*"

  # === #7182 P1: Production worker dirs ===
  # Comprehensive audit of all manifest files vs Dependabot coverage caught
  # 8+ uncovered dirs. Workers below all deploy via autobot-infrastructure
  # (per autobot-infrastructure/README.md): browser→.25, npu→.22, ai-stack→.24.
  - package-ecosystem: "pip"
    directory: "/autobot-browser-worker"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
