# Dependabot configuration — Issue #1938
# Guards against incompatible major version bumps in pip and npm deps.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/autobot-backend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    ignore:
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/autobot-shared"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "pip"
    directory: "/autobot-slm-backend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "npm"
    directory: "/autobot-frontend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "devops"
