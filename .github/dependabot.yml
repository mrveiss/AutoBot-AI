# Dependabot configuration — Issue #1938
# Guards against incompatible major version bumps in pip and npm deps.
#
# Grouping (Issue #9755): every entry batches all minor + patch updates into a
# single grouped PR per ecosystem/directory to avoid a per-dependency PR flood.
# Named groups (opentelemetry, frontend-core) are listed first so they keep
# their own grouping; `all-minor-patch` catches everything else. Major updates
# still arrive individually (and dangerous majors stay in the `ignore:` lists).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/autobot-backend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      all-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/autobot_shared"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "backend"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      all-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic-settings"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "starlette"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/autobot-slm-backend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "backend"
    groups:
      all-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic-settings"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/autobot-frontend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-core:
        patterns:
          - "vue"
          - "vite"
          - "@vitejs/*"
          - "typescript"
      all-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vega"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vega-embed"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vega-lite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/autobot-slm-frontend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "frontend"
    groups:
      all-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "devops"
    groups:
      all-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base images (Issue #7157 — supply-chain hardening, sister of #7091/#7120)
  # Dependabot auto-PRs digest updates when new versions publish.
  #
  # Major version bumps are explicitly ignored — `python:3.12` should NOT auto-PR
  # to `python:3.13` until autobot_shared/pyproject.toml's `requires-python` is
  # bumped first. Same logic for node-major and ubuntu-major.
  - package-ecosystem: "docker"
    directory: "/docker/backend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "devops"
      - "security"
    groups:
      all-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/docker/slm"
