  # === #7182 P2: Root-level manifests ===
  # Catches root-level requirements*.txt (requirements.txt, requirements-ci.txt,
  # requirements-dev.txt) AND root pyproject.toml — used by ci.yml + security.yml.
  # Risk of stale CI tooling without this entry.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
      - "devops"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "starlette"
        update-types: ["version-update:semver-major"]
      - dependency-name: "protobuf"
        # #10474: cap <7.0 — opentelemetry-proto (otel 1.42) requires protobuf<7.0.
        update-types: ["version-update:semver-major"]
      - dependency-name: "websockets"
        # #10474: cap <16 — langgraph-sdk 0.4.2 requires websockets >=14,<16.
        update-types: ["version-update:semver-major"]
