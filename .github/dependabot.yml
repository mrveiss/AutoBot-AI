  - package-ecosystem: "npm"
    directory: "/autobot-frontend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-core:
        patterns:
          - "vue"
          - "vite"
          - "@vitejs/*"
          - "typescript"
      # #12798: eslint-plugin-oxlint declares a peer on its OWN matching oxlint
      # minor (plugin 1.75.0 -> peer oxlint ~1.75.0). Under all-dependencies
      # nothing kept the pair in lockstep, so a run advanced the plugin while
      # leaving oxlint at ~1.73.0 — npm ci then died on ERESOLVE and took four
      # required checks down with it (#12792). Their own group forces them to
      # move together. A version cap (the @pinia/testing remedy below) is wrong
      # here: both SHOULD keep advancing, just never apart.
      # Must stay ABOVE all-dependencies — first matching group wins.
      oxlint:
        patterns:
          - "oxlint"
          - "eslint-plugin-oxlint"
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vega"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vega-embed"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vega-functions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vega-lite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@pinia/testing"
        # #11753: @pinia/testing 2.x requires peer pinia>=4 while the group
        # keeps pinia 3 — grouped bump re-proposes an unsatisfiable member
        # (ERESOLVE on every PR, see #11746). Same pattern as the protobuf/
        # websockets caps above. Unblock when the pinia 4 major is taken.
        versions: [">=2.0.0"]

  - package-ecosystem: "npm"
    directory: "/autobot-slm-frontend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "frontend"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
