# Dependabot configuration — Issue #1938
# Guards against incompatible major version bumps in pip and npm deps.
#
# Grouping (Issue #9755, widened #10146-followup): every entry batches ALL
# update types — minor, patch AND major — into a single grouped PR per
# ecosystem/directory, so a weekly run produces a handful of grouped PRs instead
# of a per-dependency flood (clogs the single self-hosted CI runner). Named
# groups (opentelemetry, frontend-core) are listed first so they keep their own
# grouping; `all-dependencies` catches everything else. Dangerous majors are
# still blocked via the per-ecosystem `ignore:` lists below — including
# python/ubuntu Docker semver-MINOR (3.12→3.14, 22.04→22.10 are minor in
# tag-semver but breaking for us: py3.14 is the project-wide version (#9825); 22.04 is the LTS).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/autobot-backend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "openai"
        # #14431: cap <3.0 — every published llama-index-llms-openai release pins
        # openai<3, so a grouped bump to 3.x is unsatisfiable and dies with
        # ResolutionImpossible at the Docker pip layer, taking smoke-test with it.
        # semver-major ignore alone does NOT stop the grouped all-dependencies bump
        # from re-proposing it (same lesson as protobuf above). Hard-exclude so it
        # stops. Unblock when llama-index-llms-openai supports 3.x.
        versions: [">=3.0.0"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "protobuf"
        # #10474/#10615/#10616 hard-excluded >=7.0.0 because opentelemetry-proto
        # (otel 1.42) required protobuf<7.0 and a grouped bump kept re-proposing
        # 7.x. That is no longer the state of the tree: the manifest now pins
        # `protobuf>=7.36.0,<8.0.0` and the Docker images build green, so 7.x is
        # demonstrably installable here.
        # #14727: an exclusion at or below a manifest's own floor leaves
        # dependabot nothing it may propose — protobuf was FROZEN in this block,
        # not capped. The range now mirrors the manifest's real ceiling, <8.0.0.
        # The stale <7.0 rationale was confirmed stale and corrected in #15622:
        # the cap mirrors what opentelemetry-proto and googleapis-common-protos
        # declare, and grpcio -- named there as a blocker -- does not depend on
        # protobuf at all.
        versions: [">=8.0.0"]
      - dependency-name: "websockets"
        # #10474/#10386: cap <16 — langgraph-sdk 0.4.2 requires websockets >=14,<16.
        # semver-major ignore alone did not stop the grouped bump from re-proposing 16.x.
        # Hard-exclude >=16.0.0. Unblock when langgraph-sdk supports 16.x.
        versions: [">=16.0.0"]

