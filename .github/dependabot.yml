# Dependabot configuration — Issue #1938
# Guards against incompatible major version bumps in pip and npm deps.
#
# Grouping (Issue #9755, widened #10146-followup): every entry batches ALL
# update types — minor, patch AND major — into a single grouped PR per
# ecosystem/directory, so a weekly run produces a handful of grouped PRs instead
# of a per-dependency flood (clogs the single self-hosted CI runner). Named
# groups (opentelemetry, frontend-core) are listed first so they keep their own
# grouping; `all-dependencies` catches everything else. Dangerous majors are
# still blocked via the per-ecosystem `ignore:` lists below — including
# python/ubuntu Docker semver-MINOR (3.12→3.14, 22.04→22.10 are minor in
# tag-semver but breaking for us: py3.14 is the project-wide version (#9825); 22.04 is the LTS).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/autobot-backend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "protobuf"
        # #10474/#10615/#10616: cap <7.0 — opentelemetry-proto (otel 1.42) requires
        # protobuf<7.0. semver-major ignore alone did NOT stop the grouped
        # all-dependencies bump from re-proposing 7.x (unsatisfiable → ResolutionImpossible
        # on every PR). Hard-exclude >=7.0.0 so it stops. Unblock when otel supports 7.x.
        versions: [">=7.0.0"]
      - dependency-name: "websockets"
        # #10474/#10386: cap <16 — langgraph-sdk 0.4.2 requires websockets >=14,<16.
        # semver-major ignore alone did not stop the grouped bump from re-proposing 16.x.
        # Hard-exclude >=16.0.0. Unblock when langgraph-sdk supports 16.x.
        versions: [">=16.0.0"]

  - package-ecosystem: "pip"
    directory: "/autobot_shared"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "backend"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic-settings"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "starlette"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/autobot-slm-backend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "backend"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic-settings"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/autobot-frontend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-core:
        patterns:
          - "vue"
          - "vite"
          - "@vitejs/*"
          - "typescript"
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vega"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vega-embed"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vega-lite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/autobot-slm-frontend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "frontend"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "devops"
    groups:
      all-dependencies:
        patterns:
          - "*"

  # Docker base images (Issue #7157 — supply-chain hardening, sister of #7091/#7120)
  # Dependabot auto-PRs digest updates when new versions publish.
  #
  # Major version bumps are explicitly ignored — `python:3.14` should NOT auto-PR
  # past 3.14 until autobot_shared/pyproject.toml's `requires-python` is
  # bumped first. Same logic for node-major and ubuntu-major.
  - package-ecosystem: "docker"
    directory: "/docker/backend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "devops"
      - "security"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "python"
        # Pinned at 3.14 (single project-wide version, #9825 done). Block minor/major
        # too — 3.12→3.14 is tag-semver-MINOR but a breaking runtime jump.
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/docker/slm"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "devops"
      - "security"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "python"
        # Pinned at 3.14 (single project-wide version, #9825 done). Block minor/major
        # too — 3.12→3.14 is tag-semver-MINOR but a breaking runtime jump.
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/docker/frontend"
    target-branch: "Dev_new_gui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "devops"
      - "security"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ubuntu"
        # Stay on the 22.04 LTS. Block minor too — 22.04→22.10 is tag-semver-
        # MINOR but 22.10 is an EOL interim release. LTS bumps are done by hand.
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

