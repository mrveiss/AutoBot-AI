# Copyright 2025-2026 mrveiss
# SPDX-License-Identifier: Apache-2.0
# Enforces the "no commit trailers" policy — mrveiss is sole author. Fails a PR
# whose commits carry Co-authored-by / "Generated with [Claude ...]" / the
# cross-project Paperclip identity in the message body. Runs on a GitHub-hosted
# runner so it never occupies the single self-hosted CI runner.
name: No Commit Trailers

on:
  # #14054: the merge queue builds each entrant against base + the entries
  # ahead of it and expects the required contexts to report against that
  # temporary ref. A required context with no `merge_group:` trigger never
  # fires, and the queue waits on it forever. Inert until the `merge_queue`
  # ruleset rule is enabled -- this event does not exist before then.
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]

# #14434: without this, every push left its predecessors queued. 42 of a 271-run
# sample were for commits no longer at their branch tip - work nothing would ever
# read, each still fetching its actions. During GitHub's 2026-08-17 archive-download
# degradation that wasted load became failures on unrelated pull requests (#14444).
#
# cancel-in-progress is guarded on the event rather than set to a bare `true`:
# #13432 found that cancelling base-branch runs meant each merge cancelled the
# previous merge's verification, and merges arrive faster than a suite completes -
# of 39 completed base runs, 26 were cancelled and NONE succeeded. Six of the
# workflows this was applied to also trigger on push to Dev_new_gui, so the guard
# is load-bearing there and harmless where it is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-trailers:
    name: No commit trailers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan PR commits for banned trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          echo "Scanning commits ${BASE_SHA}..${HEAD_SHA}"
          # Agent/tooling trailers are never allowed, for any author (#13654).
          #
          # #15848: ALL THREE ARMS ARE NOW ANCHORED to a trailer position. The
          # promo and paperclip arms were deliberately left unanchored, on the
          # reasoning that their tokens are implausible in prose. That reasoning
          # did not survive contact: a commit message DOCUMENTING this policy has
          # to quote the strings it bans, and was rejected by the check it
          # describes. Measured cost in one session: three separate writes about
          # the hazard refused for naming it, one of them a commit explaining the
          # fix.
          #
          # Anchoring loses nothing, because a trailer is a line-position
          # construct by definition -- git's own interpret-trailers only reads the
          # final block, and every tool that emits these writes them at line
          # start. `^[[:space:]]*` keeps an indented trailer caught, which is the
          # form the Claude-Session arm was already written for.
          #
          # This is the mention-versus-invocation class #15835 fixed in
          # .claude/hooks/block-dangerous-commands.sh: a pattern matching raw text
          # cannot tell a use from a mention, and the cost lands on whoever
          # documents the rule.
          # The paperclip arm needs a trailer KEY before it, not `.*`: a bare
          # `.*noreply@paperclip` re-defeats the anchor it sits behind, matching
          # the address anywhere on the line. A trailer is `Key: value`, so that
          # is what is required.
          agent_re='^[[:space:]]*(Generated with \[?Claude|[A-Za-z0-9_-]+:.*noreply@paperclip|Claude-Session:)'
          # A Co-authored-by trailer is allowed only when the identity it names is
          # the commit's OWN author, the repository owner, or a bot. That lets
          # dependabot's self-attribution on its security bumps through — which is
          # bookkeeping, not an attribution claim — while still rejecting a genuine
          # third-party human co-author.
          #
          # Matched on the identity in the TRAILER, not on the commit author's name:
          # "%an" is client-set, so a bot-name pattern there would be bypassed by
          # `git config user.name 'x[bot]'`.
          owner_re='martins\.veiss@gmail\.com|Martins Veiss'
          # GitHub's squash merge stamps "Co-authored-by: github-actions[bot]" onto
          # the owner's own commit whenever the auto-fix workflow pushed to the
          # branch. 22 of the last 60 commits on Dev_new_gui carry exactly that, so
          # a rule without this arm would reject a third of normal work.
          bot_ident_re='\[bot\]@users\.noreply\.github\.com|\[bot\]>'
          coauthor_re='^[[:space:]]*Co-authored-by:'
          # Ratchet of commits that predate the identity fix (#15310 session).
          # Entries may only be REMOVED. See the file header for why these four
          # exist and why rewriting shared history was rejected.
          baseline_file='.github/commit-trailer-baseline.txt'
          baseline=''
          if [ -f "${baseline_file}" ]; then
            baseline="$(sed 's/#.*//' "${baseline_file}" | tr -d '[:blank:]' | grep -v '^$' || true)"
            echo "Baseline exemptions: $(printf '%s\n' "${baseline}" | grep -c . || true)"
          fi

          bad=()
          while IFS= read -r sha; do
            [ -z "${sha}" ] && continue
            # Exempt only on an EXACT full-SHA match, so a short or partial entry
            # cannot silently widen the exemption to other commits.
            if [ -n "${baseline}" ] && printf '%s\n' "${baseline}" | grep -qxF "${sha}"; then
              echo "Baselined, skipping: ${sha}"
              continue
            fi
            body="$(git log -1 --format='%B' "${sha}")"
            # #15850 review: anchoring to `^` stops a MID-LINE mention being read
            # as a trailer, but not one that BEGINS a line — and a commit body
            # explaining this policy naturally starts a line with the string it
            # quotes. Git's definition is positional: a trailer lives in the
            # message's FINAL block. `interpret-trailers --parse` returns exactly
            # that block, so prose above it is structurally out of scope rather
            # than excluded by a pattern that has to guess. Falls back to the
            # whole body if the helper is unavailable, which fails closed.
            trailers="$(printf '%s\n' "${body}" | git interpret-trailers --parse 2>/dev/null || printf '%s\n' "${body}")"
            subject="$(git log -1 --format='%s' "${sha}")"

            if printf '%s\n' "${trailers}" | grep -iqE "${agent_re}"; then
              bad+=("${sha} ${subject}")
              continue
            fi

            an="$(git log -1 --format='%an' "${sha}")"
            ae="$(git log -1 --format='%ae' "${sha}")"
            offending=0
            while IFS= read -r line; do
              [ -z "${line}" ] && continue
              ident="${line#*:}"
              # Compare the trailer's email EXACTLY. A substring test is wrong here:
              # grep -F "me@example.com" matches inside "some@example.com", so an
              # unrelated third party would have been accepted as the author.
              ident_email="$(printf '%s' "${ident}" | sed -n 's/.*<\([^>]*\)>.*/\1/p')"
              if printf '%s' "${ident}" | grep -qiE "${owner_re}"; then continue; fi
              if printf '%s' "${ident}" | grep -qiE "${bot_ident_re}"; then continue; fi
              if [ -n "${ident_email}" ] && [ "${ident_email}" = "${ae}" ]; then continue; fi
              if [ -z "${ident_email}" ] && [ -n "${an}" ] && [ "$(printf '%s' "${ident}" | xargs)" = "${an}" ]; then
                continue
              fi
              echo "Third-party co-author on ${sha}: ${ident}"
              offending=1
            done < <(printf '%s\n' "${body}" | grep -iE "${coauthor_re}" || true)

            if [ "${offending}" -eq 1 ]; then
              bad+=("${sha} ${subject}")
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")

          if [ "${#bad[@]}" -gt 0 ]; then
            echo "::error::Commit trailers are not allowed (mrveiss is sole author)."
            printf 'Offending commit: %s\n' "${bad[@]}"
            echo "Strip them and force-push, e.g.:"
            echo "  FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --msg-filter \\"
            echo "    'grep -viE \"^[[:space:]]*Co-authored-by:|Generated with \\[?Claude|noreply@paperclip\"' \\"
            echo "    ${BASE_SHA}..HEAD && git push --force-with-lease"
            exit 1
          fi
          echo "No banned commit trailers found."
