# Close stale Dependabot pull requests (no activity for 30+ days).
#
# Everything else about a Dependabot PR goes through the same review and merge train
# as any other PR, so this workflow merges nothing.
#
# See: https://github.com/mrveiss/AutoBot-AI/issues/4110

name: Close stale Dependabot PRs

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close-stale:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Close stale Dependabot PRs
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const DAYS_STALE = 30;
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - DAYS_STALE);

            // pulls.list has no creator filter, so the author is checked here.
            const open = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const prs = open.filter((pr) => pr.user.login === 'dependabot[bot]');

            console.log('Checking ' + prs.length + ' Dependabot PRs for staleness');

            for (const pr of prs) {
              const updatedAt = new Date(pr.updated_at);

              if (updatedAt < cutoffDate) {
                console.log('Closing stale PR #' + pr.number + ' (last updated ' + pr.updated_at + ')');

                try {
                  await github.rest.pulls.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    state: 'closed',
                  });

                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: 'Auto-closed stale Dependabot PR (no activity for ' + DAYS_STALE + '+ days). Feel free to reopen if needed.',
                  });

                  console.log('Closed PR #' + pr.number);
                } catch (error) {
                  console.log('Could not close PR #' + pr.number + ': ' + error.message);
                }
              }
            }

      - name: Generate summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Stale Dependabot PRs

          Stale Dependabot PRs (30+ days) are closed with a notification; nothing is merged.

          See workflow run for detailed logs.
          EOF
