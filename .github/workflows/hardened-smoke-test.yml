name: Hardened Smoke Test

# Verifies that docker-compose.hardened.yml starts correctly on top of
# the base compose — read-only filesystems, secrets, and PID limits
# are only tested in CI via this job. Closes GH#8094.

on:
  push:
    branches:
      - Dev_new_gui
  pull_request:
    branches:
      - Dev_new_gui
    # #13388: SAFE — this workflow publishes `hardened-smoke-test`, which is NOT
    # one of the ten required contexts (the required `smoke-test` comes from
    # docker-smoke-test.yml, which is deliberately left unfiltered).
    #
    # `paths-ignore` rather than `paths` ON PURPOSE. This job builds all three
    # images and starts the hardened compose overlay, so almost any source,
    # dependency, Dockerfile or compose edit can legitimately break it and an
    # allow-list would eventually miss one. An ignore-list inverts the risk: the
    # run still happens for everything except changes that are purely
    # documentation, which cannot alter a container's runtime behaviour. GitHub
    # skips the run only when EVERY changed file matches, so a pull request
    # mixing docs with code still runs the full smoke test.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: '0 11 * * 0'  # Every Sunday at 11 AM UTC (offset from regular smoke test)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardened-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          min-free-gb: '15'  # Increased from 10GB due to MVA-2869

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-hardened-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-hardened-
            ${{ runner.os }}-buildx-

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Create Docker secrets for hardened config
        run: |
          mkdir -p secrets
          openssl rand -hex 32 > secrets/postgres_password.txt
          openssl rand -hex 32 > secrets/slm_admin_password.txt
          openssl rand -hex 32 > secrets/slm_jwt_secret.txt
          chmod 600 secrets/*.txt

      - name: Generate signing secrets (GH#9775)
        run: |
          # Base compose now fail-fasts on unset AUTOBOT_JWT_SECRET / SECRET_KEY
          # (no static fallback). Generate them and expose to all later compose
          # steps via $GITHUB_ENV so interpolation succeeds.
          bash docker/generate-secrets.sh
          cat docker/.env.secrets >> "$GITHUB_ENV"

      - name: Build images with layer cache
        run: |
          echo "=== Building backend image ==="
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to   type=local,dest=/tmp/.buildx-cache-new,mode=min \
            --file docker/backend/Dockerfile \
            --tag autobot/backend:latest \
            --load \
            .
          echo "Backend build complete. Disk space:"
          df -h / | grep -v Filesystem

          echo ""
          echo "=== Building SLM image ==="
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to   type=local,dest=/tmp/.buildx-cache-new,mode=min \
            --file docker/slm/Dockerfile \
            --tag autobot/slm:latest \
            --load \
            .
          echo "SLM build complete. Disk space:"
          df -h / | grep -v Filesystem

          echo ""
          echo "=== Building frontend image ==="
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to   type=local,dest=/tmp/.buildx-cache-new,mode=min \
            --file docker/frontend/Dockerfile \
            --tag autobot/frontend:latest \
            --load \
            .
          echo "Frontend build complete. Disk space:"
          df -h / | grep -v Filesystem

          echo ""
          echo "=== Rotating cache ==="
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

          echo "Final disk space:"
          df -h

      - name: Start services with hardened overlay
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.hardened.yml \
            --env-file docker/.env.docker \
            up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for hardened services to become healthy..."
          max_attempts=90
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: Checking service health..."

            frontend_ok=false
            backend_ok=false
            slm_ok=false

            curl -s -f http://localhost > /dev/null 2>&1            && frontend_ok=true
            curl -s -f http://localhost/api/system/health > /dev/null 2>&1 && backend_ok=true
            curl -s -f http://localhost/slm/api/health > /dev/null 2>&1    && slm_ok=true

            if $frontend_ok && $backend_ok && $slm_ok; then
              echo "OK Frontend responding on port 80"
              echo "OK Backend health check passed"
              echo "OK SLM health check passed"
              exit 0
            fi

            $frontend_ok || echo "  waiting: frontend not yet responding"
            $backend_ok  || echo "  waiting: backend not yet responding"
            $slm_ok      || echo "  waiting: SLM not yet responding"

            sleep 10
          done

          echo "Hardened services failed to become healthy within 15 minutes (900s)"
          echo ""
          echo "=== Docker Compose Logs ==="
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.hardened.yml \
            --env-file docker/.env.docker \
            logs
          exit 1

      - name: Verify hardened constraints are active
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Service status ==="
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.hardened.yml \
            --env-file docker/.env.docker \
            ps

          echo ""
          echo "=== Verify read-only root filesystem on backend ==="
          if docker exec autobot-backend sh -c "touch /readonly-test 2>/dev/null"; then
            echo "FAIL: backend root filesystem is writable (read_only not enforced)"
            exit 1
          else
            echo "OK backend root filesystem is read-only"
          fi

          echo ""
          echo "=== Verify PID limit is set on backend ==="
          pids_limit=$(docker inspect autobot-backend --format '{{.HostConfig.PidsLimit}}')
          if [ "$pids_limit" = "0" ] || [ -z "$pids_limit" ]; then
            echo "FAIL: backend PID limit not set (got: $pids_limit)"
            exit 1
          else
            echo "OK backend PID limit: $pids_limit"
          fi

          echo ""
          echo "=== Health endpoint checks ==="
          curl -v http://localhost 2>&1 | head -20 || true
          echo ""
          curl -v http://localhost/api/system/health 2>&1 | head -20 || true
          echo ""
          curl -v http://localhost/slm/api/health 2>&1 | head -20 || true

      - name: Dump diagnostics for unhealthy containers on failure
        # #14417: #11516 hardcoded this step to autobot-slm, which was the
        # failing container back then. When the failing container was
        # anything else (e.g. autobot-backend on PR #14413), this step
        # printed a healthy SLM and named nothing — the traceback that
        # explained the failure appeared nowhere in the inline job output.
        #
        # Derive the failing container(s) from compose state instead of
        # assuming one: a service is "unhealthy" here if its container was
        # never created, isn't running, or reports a failing healthcheck.
        # Dump full diagnostics (state + healthcheck probe log + tail of
        # logs) for each one found, INLINE (not just the uploaded artifact
        # from the next step). If none look unhealthy — the failure happened
        # somewhere else in the job, e.g. a curl assertion — fall back to
        # dumping every service so this step is never silent.
        if: failure()
        shell: bash
        run: |
          # Default GitHub Actions bash flags are `-eo pipefail`; a docker
          # inspect/logs call on a container that never started exits
          # non-zero and must not abort this step before later containers
          # are dumped, so turn both off for the whole post-mortem.
          set +e +o pipefail

          services=$(docker compose \
            -f docker-compose.yml \
            -f docker-compose.hardened.yml \
            --env-file docker/.env.docker \
            config --services 2>/dev/null)
          services=$(echo "$services" | xargs)

          if [ -z "$services" ]; then
            echo "(could not enumerate compose services from the compose config)"
          fi

          unhealthy=""
          for svc in $services; do
            status=$(docker inspect "$svc" --format '{{.State.Status}}' 2>/dev/null)
            if [ -z "$status" ]; then
              echo "-> ${svc}: container not found (never created)"
              unhealthy="$unhealthy $svc"
              continue
            fi
            health=$(docker inspect "$svc" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>/dev/null)
            echo "-> ${svc}: status=${status} health=${health:-none}"
            if [ "$health" = "unhealthy" ] || [ "$status" != "running" ]; then
              unhealthy="$unhealthy $svc"
            fi
          done
          unhealthy=$(echo "$unhealthy" | xargs)

          if [ -z "$unhealthy" ]; then
            echo ""
            echo "No container looked unhealthy from compose state -- the failure happened elsewhere in the job. Dumping every service so this step is never silent."
            unhealthy="$services"
          fi

          echo ""
          echo "=== Containers identified as failing: ${unhealthy:-<none enumerable>} ==="

          for svc in $unhealthy; do
            echo ""
            echo "::group::${svc} diagnostics"

            echo "=== ${svc} container state ==="
            if ! docker inspect "$svc" \
              --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
              2>&1; then
              echo "(${svc} container not found)"
            fi

            echo ""
            echo "=== ${svc} healthcheck probe log (each attempt: ExitCode + Output) ==="
            probe=$(docker inspect "$svc" --format '{{json .State.Health}}' 2>/dev/null)
            if [ -n "$probe" ] && [ "$probe" != "null" ]; then
              if ! echo "$probe" | python3 -m json.tool 2>/dev/null; then
                echo "$probe"
              fi
            else
              echo "(no healthcheck state on ${svc})"
            fi

            echo ""
            echo "=== ${svc} logs (last 300 lines) ==="
            if ! docker compose \
              -f docker-compose.yml \
              -f docker-compose.hardened.yml \
              --env-file docker/.env.docker \
              logs --no-color --tail 300 "$svc" 2>&1; then
              if ! docker logs --tail 300 "$svc" 2>&1; then
                echo "(no ${svc} logs available)"
              fi
            fi

            echo "::endgroup::"
          done

      - name: Collect logs on failure
        if: failure()
        run: |
          # Backstop for the per-container diagnostics above: full compose
          # logs, printed inline (not just the uploaded artifact) AND kept
          # as an artifact, matching docker-smoke-test.yml. (#14417)
          #
          # Same trap as the post-mortem step above: default Actions bash is
          # `-eo pipefail`, so `docker compose logs` failing (compose already
          # torn down, daemon hiccup) would abort the pipe before the
          # `::endgroup::` below runs, leaving an unclosed fold in the job
          # log. Turn both off so the fold always closes, whatever `docker
          # compose logs` did.
          set +e +o pipefail
          echo "::group::docker compose logs (all services)"
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.hardened.yml \
            --env-file docker/.env.docker \
            logs --no-color | tee failure-logs.txt
          echo "::endgroup::"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hardened-docker-compose-logs
          path: failure-logs.txt

      - name: Clean up
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.hardened.yml \
            --env-file docker/.env.docker \
            down
          rm -rf secrets/
