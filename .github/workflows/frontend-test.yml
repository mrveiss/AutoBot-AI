# Frontend Testing Suite workflow
# Uses self-hosted runner to avoid GitHub Actions quota limits

name: Frontend Testing Suite

on:
  push:
    branches: [main, develop, 'Dev_*']
    # Mirror of .github/filters/frontend-paths.yml. GitHub requires event path
    # filters to be inline, so this copy cannot be shared — but it only decides
    # whether a POST-merge run happens here, never which job publishes the
    # required context, so a drift is visible rather than dangerous. The filter
    # file stays authoritative (#13405).
    paths:
      - 'autobot-frontend/**'
      - '.github/workflows/frontend-test.yml'
      - '.github/workflows/frontend-required-context.yml'
      - '.github/filters/frontend-paths.yml'
      # Canonical source for the cross-language parity guard (#13073, #13074):
      # a port/enum edit here with no frontend edit must still run the suite.
      - 'autobot_shared/ssot_config.py'
  pull_request:
    # 'Dev_*' covers the Dev_new_gui integration branch — every frontend PR
    # merges here, so the suite must run pre-merge, not only post-merge on the
    # push trigger (#10019). main/develop kept for promotion PRs.
    #
    # NOTE: no pull_request.paths filter — this workflow ALWAYS runs on PRs so
    # its required-check context ("Unit & Integration Tests") always reports a
    # conclusion when the suite applies. A path-filtered required check that
    # never triggers leaves the PR deadlocked on "Expected — Waiting for
    # status". The real work is gated on the `changes` job below.
    #
    # When no frontend paths are touched the context is reported green by
    # `unit-tests-skip` in .github/workflows/frontend-required-context.yml — a
    # SEPARATE workflow, so it shares no concurrency group and no runner with
    # the self-hosted jobs here (#10527, #13405). Branch-protection promotion to
    # required is the separate owner-confirmed follow-up (#10022).
    branches: [main, develop, 'Dev_*']

# Only the heavy, self-hosted half of the frontend CI lives in this workflow, so
# superseding a predecessor is the right default: the runner is a singleton and
# re-testing a stale head wastes the only machine that can test the new one.
#
# KNOWN LIMITATION (#13405): `cancel-in-progress` reaps an *in-progress*
# predecessor, never a *queued* one. While the self-hosted runner is offline a
# predecessor never reaches in-progress, so it holds this group and successor
# runs sit in `status: pending` with an empty `jobs` array until something
# force-cancels the predecessor. That is survivable HERE because nothing in this
# workflow is on the critical path of a non-frontend PR any more: the required
# `Unit & Integration Tests` context is published by frontend-required-context.yml
# when the suite does not apply, and when it DOES apply a blocked run is a
# correct block — the tests genuinely have not run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'


permissions:
  contents: read

jobs:
  # Job 0: Detect changed paths — always runs so the required contexts report
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          # Shared file, NOT an inline list: frontend-required-context.yml's
          # `changes` job loads the very same path set. Its shim job and the
          # `unit-tests` job below carry the same required context name under
          # exactly complementary conditions, so the split is only correct while
          # both compute the same answer — one file, one answer (#13405).
          filters: .github/filters/frontend-paths.yml

  # Job 1: Unit and Integration Tests
  unit-tests:
    name: Unit & Integration Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30  # #11077: fail fast (self-hosted); not GitHub's 24h default
    # vue-tsc (the `type-check` and `check-ts-delta` steps) is near the default
    # V8 old-space ceiling on this project and intermittently OOMs
    # ("Reached heap limit … JavaScript heap out of memory"), flaking this
    # required check (#10298). Give Node enough heap.
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: autobot-frontend/package-lock.json

      - name: Install dependencies
        working-directory: autobot-frontend
        # #13410: no CI job runs Cypress (only `test:e2e` needs the binary), so
        # skip the ~100MB CDN download — a Cypress CDN 504 must never red out a
        # required check. Local dev `npm ci` is unaffected and still gets it.
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: npm ci

      - name: Verify generated API types exist (#5209)
        working-directory: autobot-frontend
        run: |
          # Fails if someone edits src/types/generated/api.ts by hand.
          # Full drift detection (regenerate against live backend, diff)
          # runs separately where a backend is available — see
          # docs/developer/frontend-type-generation.md.
          test -f src/types/generated/api.ts || (
            echo "Missing src/types/generated/api.ts — run 'npm run gen:types' against a running backend and commit the result."
            exit 1
          )
          npm run verify:types

      - name: Run type checking
        working-directory: autobot-frontend
        run: npm run type-check


      - name: Check TypeScript error delta
        working-directory: autobot-frontend
        # #13341: bound the STEP, not just the job. GitHub enforces
        # `timeout-minutes` from the RUNNER side, so when the runner process
        # stops making progress the job-level cancellation may never be issued
        # — observed here as a run of over three hours against the declared
        # 30-minute limit above, on the singleton self-hosted runner, holding
        # a REQUIRED context and starving every other job needing that machine.
        # `timeout` runs inside this step's own process tree, so it fires at a
        # known point whether or not GitHub's cancellation ever arrives, and the
        # step fails with a diagnosable "timed out" instead of hanging silently.
        # 600s is roughly seven times the ~89s this step took on its last clean
        # run; TERM first so vue-tsc can flush, KILL 60s later if it will not.
        # `--verbose` matters: without it `timeout` prints NOTHING, so the log
        # ends at "Process completed with exit code 124" and the operator is
        # left to know that 124 means a timeout. With it the step says
        # "timeout: sending signal TERM to command 'npm'", which is the
        # diagnosable failure this bound exists to produce.
        # The hang itself is fixed at the root in scripts/check-ts-delta.sh
        # (npx removed) — this bound is the guard for the NEXT unknown cause,
        # not the fix for the known one.
        run: timeout --verbose --kill-after=60s 600 npm run check-ts-delta

      - name: Run linting
        working-directory: autobot-frontend
        run: npm run lint

      - name: Check i18n keys
        working-directory: autobot-frontend
        run: npm run check:i18n


      - name: Check locale completeness
        working-directory: autobot-frontend
        run: npm run check:locales
      # #10365: the unit suite runs once, with coverage — `test:coverage` is
      # `vitest run --coverage` over the same default config as `test:unit`, so a
      # separate `test:unit` step just ran every unit test twice on the self-hosted runner.
      - name: Run integration tests
        working-directory: autobot-frontend
        run: npm run test:integration

      - name: Run unit tests with coverage
        working-directory: autobot-frontend
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6
        with:
          files: ./autobot-frontend/coverage/lcov.info
          directory: ./autobot-frontend/coverage
          flags: frontend
          name: autobot-frontend-coverage
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-unit
          path: |
            autobot-frontend/test-results/
            autobot-frontend/coverage/
          retention-days: 30

      - name: Cleanup node_modules
        if: always()
        run: |
          rm -rf autobot-frontend/node_modules || true

  # Job 1b (RELOCATED, not removed): the skip-success shim for the required
  # "Unit & Integration Tests" context now lives in
  # .github/workflows/frontend-required-context.yml.
  #
  # It still carries the identical job `name:`, still runs on ubuntu-latest and
  # still fires only when frontend paths did NOT change — the exact complement
  # of `unit-tests` above, evaluated from the same
  # .github/filters/frontend-paths.yml. What changed is only WHICH RUN hosts it.
  #
  # It had to leave this file. A shim cannot report a context from a run that
  # never starts, and this workflow's run does not start while a `queued`
  # predecessor holds its concurrency group — the state the singleton
  # self-hosted runner going offline puts every open PR into (#13405).

  # Job 2: Security Scanning
  security-scan:
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20  # #11077: fail fast (self-hosted); not GitHub's 24h default

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: autobot-frontend/package-lock.json

      - name: Install dependencies
        working-directory: autobot-frontend
        # #13410: no CI job runs Cypress (only `test:e2e` needs the binary), so
        # skip the ~100MB CDN download — a Cypress CDN 504 must never red out a
        # required check. Local dev `npm ci` is unaffected and still gets it.
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: npm ci

      - name: Run npm audit
        working-directory: autobot-frontend
        run: |
          npm audit --audit-level=high || true
          npm audit --json > audit-results.json || true

      - name: Run dependency vulnerability scan
        working-directory: autobot-frontend
        run: |
          npx auditjs ossi || true

      - name: Upload security scan results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-scan-results
          path: autobot-frontend/audit-results.json
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          rm -rf autobot-frontend/node_modules || true

  # Job 3: Build Test
  build-test:
    name: Build Test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30  # #11077: fail fast (self-hosted); not GitHub's 24h default
    # `changes` added so the dependency graph is consistent; build-test already
    # self-skips when unit-tests skips (path-untouched PRs).
    needs: [changes, unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: autobot-frontend/package-lock.json

      - name: Install dependencies
        working-directory: autobot-frontend
        # #13410: no CI job runs Cypress (only `test:e2e` needs the binary), so
        # skip the ~100MB CDN download — a Cypress CDN 504 must never red out a
        # required check. Local dev `npm ci` is unaffected and still gets it.
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: npm ci

      - name: Build application
        working-directory: autobot-frontend
        run: npm run build

      - name: Analyze bundle size
        working-directory: autobot-frontend
        shell: bash
        run: |
          set -euo pipefail
          du -sh dist/
          find dist/ -name "*.js" -exec du -h {} \; | sort -hr

      - name: Cleanup
        if: always()
        run: |
          rm -rf autobot-frontend/node_modules autobot-frontend/dist || true

  # Job 4: Test Summary and Reporting
  test-summary:
    name: Test Summary
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15  # #11077: fail fast (self-hosted); not GitHub's 24h default
    needs: [changes, unit-tests, security-scan, build-test]
    # `always()` so the summary still reports when a test job FAILED, but gated
    # on the same `changes` output as the jobs it summarises. Without the gate
    # this was the ONLY job a non-frontend PR placed on the singleton
    # self-hosted runner, and all it summarised was three skipped jobs —
    # verified on run 30853514624, where `Test Summary` succeeded on
    # self-hosted while `Unit & Integration Tests`, `Security Scan` and
    # `Build Test` were all skipped. While the runner is offline those pointless
    # jobs are exactly what keeps a superseded run `queued`, and a `queued`
    # predecessor holds this workflow's concurrency group indefinitely (#13405).
    if: always() && needs.changes.outputs.frontend == 'true'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: test-artifacts

      - name: Generate test summary
        run: |
          {
            echo "# 🧪 Frontend Test Results"
            echo ""
            echo "## Test Jobs Status:"
            echo "- Unit Tests: ${{ needs.unit-tests.result }}"
            echo "- Security Scan: ${{ needs.security-scan.result }}"
            echo "- Build Test: ${{ needs.build-test.result }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -d "test-artifacts/test-results-unit/coverage" ]; then
            {
              echo "## Coverage Report Available"
              echo "Coverage reports have been uploaded to Codecov."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -d "test-artifacts" ]; then
            {
              echo "## Available Artifacts:"
              find test-artifacts -type d -name "*results*" | while read -r dir; do
                echo "- $(basename "$dir")"
              done
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "## Quick Links:"
            echo "- [View Coverage Report](https://app.codecov.io/gh/${{ github.repository }})"
            echo "- [Download Test Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
