# AutoBot Release Workflow
# Automatically creates releases on merge to release using git-cliff
# Analyzes conventional commits to determine version bump and generate changelog
#
# Changelog strategy (A+B):
#   A — git-cliff writes a per-version file: changelog/{version}.md
#   B — changelog/unreleased/*.md fragments are compiled into that file first
#       (human-written highlights precede the git-cliff commit log)
#
# Issue: #1296

name: Release

on:
  push:
    branches: [release]
    # The workflow's own "chore(release): changelog…" commit touches ONLY these
    # paths. Ignoring pushes limited to them stops release.yml from re-triggering
    # on its own changelog PR merge — otherwise git-cliff patch-bumps off the
    # release range and mints a spurious release every time (infinite loop once
    # the changelog PR can actually merge, #11855). A real promotion always
    # touches other files too, so it still triggers exactly one release.
    paths-ignore:
      - CHANGELOG.md
      - changelog/**

permissions:
  contents: write
  # The final "Open changelog PR to release" step calls `gh pr create`, which
  # needs pull-requests:write — without it GITHUB_TOKEN fails with
  # "Resource not accessible by integration (createPullRequest)" and the
  # changelog history never lands on release (#11853).
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          if ! command -v jq &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi

      # #13835: compute the range explicitly instead of letting git-cliff decide
      # what "unreleased" means. A promotion lands as a MERGE commit, and the
      # first-parent range from the previous tag is then exactly one commit —
      # the merge itself, which cliff.toml skips via `{ message = "^Merge " }`.
      # git-cliff therefore found nothing to bump and returned the current
      # version, and the run reported success having minted no release, with the
      # 276 commits it should have covered sitting on release.
      #
      # Passing `<tag>..HEAD` makes the walk semantics irrelevant: cliff is told
      # the range rather than inferring it.
      - name: Compute the release range
        id: range
        run: |
          CURRENT_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [[ -n "$CURRENT_TAG" ]]; then
            RANGE="${CURRENT_TAG}..HEAD"
            COUNT="$(git rev-list --count "$RANGE")"
          else
            RANGE=""
            COUNT="$(git rev-list --count HEAD)"
          fi
          # Printed so a "nothing to release" outcome can be told apart from a
          # walk that never saw the commits — the failure this replaces.
          echo "Release range: ${RANGE:-<all history>} (${COUNT} commits)"
          {
            echo "range=$RANGE"
            echo "commit_count=$COUNT"
            echo "current_tag=$CURRENT_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Determine next version
        id: version
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff  # v4
        with:
          config: cliff.toml
          args: --bumped-version ${{ steps.range.outputs.range }}
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Check if release needed
        id: check
        env:
          # The action's `version` output is broken for `--bumped-version` args:
          # its run.sh re-runs git-cliff with `--context`, which then emits the
          # plain version string instead of JSON, so its internal
          # `jq -r '.[0].version'` fails and `version` is always empty (#9870).
          # The bumped version is the output FILE content -> `content` output.
          CLIFF_CONTENT: ${{ steps.version.outputs.content }}
          # The range outputs reach the script through env, never its text (#18666 review).
          CURRENT_TAG: ${{ steps.range.outputs.current_tag }}
          COMMIT_COUNT: ${{ steps.range.outputs.commit_count }}
        run: |
          NEXT_VERSION="$(tr -d '[:space:]' <<<"$CLIFF_CONTENT")"
          if [[ ! "$NEXT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "No version bump needed (git-cliff returned: '$NEXT_VERSION')"
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --bumped-version returns the CURRENT version (latest tag reachable
          # from HEAD) when there is nothing to bump — that, not "a tag with
          # this name exists somewhere", is the no-release condition. A name
          # collision with a NON-ancestor tag must not skip the release (#11826).
          if [[ "$NEXT_VERSION" == "$CURRENT_TAG" ]]; then
            # #13835: a no-release outcome is legitimate only when the range is
            # genuinely empty. Reaching here with commits in range means the
            # version decision could not see them, and exiting 0 quietly is how
            # that went unnoticed for a 276-commit promotion.
              if [[ "$COMMIT_COUNT" -gt 0 ]]; then
              echo "::error::git-cliff found nothing to bump, but ${COMMIT_COUNT} commits are in ${CURRENT_TAG}..HEAD — the version decision is not seeing the release range (#13835)."
              exit 1
            fi
            echo "::notice::Nothing to release since ${CURRENT_TAG} — the range is empty."
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Monotonic guard (#11826): legacy tags can sit off the release history
          # (they pointed at squashed-away changelog commits), so git-cliff may
          # bump from an older ancestor tag and mint a version that regresses
          # or collides. Never release a version <= any existing tag: fall back
          # to patch-bump of the highest existing tag instead.
          HIGHEST_TAG="$(git tag --list 'v[0-9]*' | sort -V | tail -1)"
          # When the guard rewrites the version, the notes step's `--latest`
          # range is computed from git-cliff's OWN version view and no longer
          # matches the guard-overridden tag. Pin the notes range to
          # <highest_tag>..HEAD so the published notes cover exactly what the
          # new tag ships (#11861). Empty when the guard is inert -> `--latest`.
          NOTES_RANGE=""
          if [[ -n "$HIGHEST_TAG" ]] && \
             [[ "$(printf '%s\n%s\n' "$NEXT_VERSION" "$HIGHEST_TAG" | sort -V | tail -1)" == "$HIGHEST_TAG" ]]; then
            IFS=. read -r MAJ MIN PAT <<<"${HIGHEST_TAG#v}"
            NEXT_VERSION="v${MAJ}.${MIN}.$((PAT + 1))"
            NOTES_RANGE="${HIGHEST_TAG}..HEAD"
            echo "Monotonic guard: git-cliff bump not above existing ${HIGHEST_TAG}; releasing ${NEXT_VERSION} (notes range ${NOTES_RANGE})"
          fi
          echo "Next version: $NEXT_VERSION"
          {
            echo "release_needed=true"
            echo "version=$NEXT_VERSION"
            echo "notes_range=$NOTES_RANGE"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes (git-cliff)
        if: steps.check.outputs.release_needed == 'true'
        id: cliff_notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff  # v4
        with:
          config: cliff.toml
          # Guard-fire pins an explicit <highest_tag>..HEAD range so notes match
          # the published version; inert guard keeps git-cliff's --latest (#11861).
          args: ${{ steps.check.outputs.notes_range != '' && format('{0} --strip header', steps.check.outputs.notes_range) || '--latest --strip header' }}
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Compile changelog fragments + write per-version file (A+B)
        if: steps.check.outputs.release_needed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}  # via env, never interpolated into the script
        run: |
          python3 scripts/compile_changelog.py \
            --version "${VERSION}" \
            --cliff-notes RELEASE_NOTES.md
          # Use the compiled per-version file as the GitHub Release body
          cp "changelog/${VERSION}.md" RELEASE_NOTES.md

      - name: Update CHANGELOG.md (full history index)
        if: steps.check.outputs.release_needed == 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff  # v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      # #18666: classify the signing key BEFORE the tag is created and pushed. Once the tag is
      # out, a signing failure strands a tagged release with no assets. A missing or empty
      # cosign.pub, or a real key with no private-key secret, fails here instead, while nothing
      # has been published. The placeholder (#19126) publishes checksum-only, with a warning.
      # COSIGN_PASSWORD is not checked: a cosign key pair may legitimately have an empty one.
      - name: Check the signing key is real (#18666)
        id: signkey
        if: steps.check.outputs.release_needed == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ ! -s cosign.pub ]]; then
            echo "::error::cosign.pub is missing or empty; refusing to tag a release that cannot be verified (#18666)"
            exit 1
          fi
          if grep -q PLACEHOLDER cosign.pub; then
            echo "real=false" >> "$GITHUB_OUTPUT"
            echo "::warning::cosign.pub is still the placeholder (#19126): install.sh is published UNSIGNED (checksum only) until the owner generates the signing key"
            if [[ -n "${COSIGN_PRIVATE_KEY}" ]]; then
              echo "::warning::COSIGN_PRIVATE_KEY is set but cosign.pub is still the placeholder: commit the matching public key (#19126)"
            fi
          elif [[ -z "${COSIGN_PRIVATE_KEY}" ]]; then
            echo "::error::cosign.pub is a real key but the COSIGN_PRIVATE_KEY secret is empty; refusing to tag a release that would ship unsigned (#18666)"
            exit 1
          else
            echo "real=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changelog files and tag
        id: commit
        if: steps.check.outputs.release_needed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}  # via env, never interpolated into the script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md "changelog/${VERSION}.md" changelog/
          if git diff --staged --quiet; then
            echo "No changelog changes"
            echo "has_changelog=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): changelog and fragments for ${VERSION}"
            echo "has_changelog=true" >> "$GITHUB_OUTPUT"
          fi
          # Tag the commit that was pushed to release (GITHUB_SHA) — NOT the
          # changelog commit made above. That commit only reaches release via a
          # squash-merged PR (different SHA), so tagging it strands every
          # release tag off the release history: git-cliff then bumps from a
          # stale ancestor tag and release notes cover the wrong range (#11826).
          git tag -a "${VERSION}" -m "Release ${VERSION}" "${GITHUB_SHA}"
          # Push the tag first and on its own. Tags are not branch-protected, so
          # this always lands and guarantees the "Create GitHub Release" step
          # below has a ref to release from (#10608). The changelog commit lands
          # on release via a PR (see "Open changelog PR to release" below, #10845) —
          # a direct bot push is rejected by release's required status checks.
          git push origin "refs/tags/${VERSION}"

      # #18666: the documented one-liner ran an unpinned `main` install.sh as root with no
      # integrity check. Each release publishes a copy whose DEFAULT_BRANCH is this release's tag
      # (so it installs exactly that release) and its SHA256, plus a cosign signature made with the
      # key image-sign.yml uses -- once that key exists. Until the owner replaces the placeholder
      # cosign.pub (#19126) the installer ships checksummed but UNSIGNED, with a warning, and never
      # with a fake signature. The key was classified before the tag (signkey, above).
      - name: Build the release's pinned installer (#18666)
        if: steps.check.outputs.release_needed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::release version '${VERSION}' is not vX.Y.Z[-suffix]; refusing to pin install.sh to it"; exit 1; }
          # The tag name alone is mutable: pin the commit it points at too, and install.sh refuses a
          # checkout whose HEAD differs, so the signature covers the code it installs (#18666).
          COMMIT="$(git rev-parse "refs/tags/${VERSION}^{commit}")"
          [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tag ${VERSION} does not resolve to a commit"; exit 1; }
          mkdir -p dist
          sed "s/^readonly DEFAULT_BRANCH=\"main\" PINNED_COMMIT=\"\"/readonly DEFAULT_BRANCH=\"${VERSION}\" PINNED_COMMIT=\"${COMMIT}\"/" install.sh > dist/install.sh
          grep -q "^readonly DEFAULT_BRANCH=\"${VERSION}\" PINNED_COMMIT=\"${COMMIT}\"" dist/install.sh \
            || { echo "::error::install.sh's DEFAULT_BRANCH line changed; the release pin did not apply"; exit 1; }
          (cd dist && sha256sum install.sh > install.sh.sha256)

      - name: Install cosign
        if: steps.check.outputs.release_needed == 'true' && steps.signkey.outputs.real == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign the pinned installer (key-based, #18666)
        if: steps.check.outputs.release_needed == 'true' && steps.signkey.outputs.real == 'true'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="$(mktemp)"
          trap 'rm -f "${key}"' EXIT
          (umask 077 && printf '%s' "${COSIGN_PRIVATE_KEY}" | base64 -d > "${key}")
          cosign sign-blob --yes --key "${key}" --output-signature dist/install.sh.sig dist/install.sh
          # Self-check: what a user runs from INSTALL.md must pass here first.
          cosign verify-blob --key cosign.pub --signature dist/install.sh.sig dist/install.sh
          (cd dist && sha256sum -c install.sh.sha256)
          # The key's fingerprint in the release notes, so a verifier need not trust on first use.
          # shellcheck disable=SC2016  # the backticks are literal Markdown code spans, not command substitution
          printf '\n\n---\nInstaller signing key (`cosign.pub`) SHA256: `%s`\n' "$(sha256sum cosign.pub | cut -d' ' -f1)" >> RELEASE_NOTES.md

      - name: Create GitHub Release
        if: steps.check.outputs.release_needed == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ steps.check.outputs.version }}
          body_path: RELEASE_NOTES.md
          # DELIBERATE, not an oversight: every release stays a prerelease
          # until 1.0. The consequence is worth stating because it looks like a
          # bug from the outside — GitHub's `releases/latest` excludes
          # prereleases, so the "Latest release" badge pins to the newest
          # *stable* tag (v0.2.0, 2026-03-26) no matter how many versions ship
          # after it. Ten had shipped by 2026-08 without moving it.
          #
          # Do not flip this to make the badge move. At 1.0, drive it from the
          # version instead — prerelease only for `-rc`/`-beta` suffixes.
          prerelease: true
          generate_release_notes: false
          # #18666: the pinned installer, its checksum and its signature.
          # The signature exists only when the key is real (signkey); list it only then.
          files: |
            dist/install.sh
            dist/install.sh.sha256
            ${{ steps.signkey.outputs.real == 'true' && 'dist/install.sh.sig' || '' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # #10845: a direct bot push of the changelog commit to protected release is
      # rejected by release's required status checks. Land it via a PR instead so
      # CHANGELOG.md history on release includes released versions. The tag + Release
      # are already published above, so this step is non-fatal to the release.
      - name: Open changelog PR to release
        if: steps.check.outputs.release_needed == 'true' && steps.commit.outputs.has_changelog == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # #16563: the branch name carries no slash. A ref cannot be both a file
          # and a directory, so "release/changelog-${VERSION}" became unpushable
          # the moment a branch named "release" existed — every run since the
          # 2026-09-12 rename failed here with "directory file conflict". A flat
          # name cannot collide with a branch name that is a prefix of it.
          BRANCH="changelog-${VERSION}"
          # HEAD holds the changelog commit (made in the commit step). Push it to
          # a dedicated branch and open/refresh a PR to release.
          git push origin "HEAD:refs/heads/${BRANCH}" --force

          # #15167: whether this workflow may open the PR is a REPOSITORY setting
          # — "Allow GitHub Actions to create and approve pull requests", stored
          # as `can_approve_pull_request_reviews`. It is currently false, so
          # `gh pr create` fails with "GitHub Actions is not permitted to create
          # or approve pull requests", and no `permissions:` block can grant it.
          # Nor can the setting be read from here to decide in advance: that needs
          # admin rights, and `administration` is not a workflow permission scope
          # at all — actionlint rejects it outright. So attempt the creation and
          # classify what comes back, rather than probing a setting this token can
          # never see. The branch above is pushed first, so the changelog is never
          # lost and the run never fails at this step.
          MANUAL="Open it by hand: gh pr create --base release --head ${BRANCH} --title \"chore(release): changelog for ${VERSION}\""
          if gh pr view "${BRANCH}" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "Changelog PR for ${BRANCH} already open."
          else
            if ! CREATE_ERR="$(gh pr create --base release --head "${BRANCH}" \
              --title "chore(release): changelog for ${VERSION}" \
              --body "Automated changelog for release ${VERSION}. Merging lands the CHANGELOG.md history and per-version file on release (#10845). The tag and GitHub Release for ${VERSION} are already published." 2>&1)"; then
              case "${CREATE_ERR}" in
                *"not permitted to create or approve pull requests"*)
                  echo "::notice::Changelog is on branch ${BRANCH}. This repository does not allow Actions to open pull requests — the setting is \"Allow GitHub Actions to create and approve pull requests\" (#15167). ${MANUAL} Enabling it restores the automatic path with no code change."
                  ;;
                *)
                  echo "::warning::Changelog is on branch ${BRANCH}, but opening its PR failed for a reason other than the known permission block: ${CREATE_ERR}. ${MANUAL}"
                  ;;
              esac
              exit 0
            fi
          fi
          # Land automatically once required checks pass; non-fatal if the token
          # cannot enable auto-merge (the PR stays open for a manual merge).
          gh pr merge "${BRANCH}" --squash --auto \
            || echo "::notice::Auto-merge unavailable for ${BRANCH}; merge the changelog PR manually."
