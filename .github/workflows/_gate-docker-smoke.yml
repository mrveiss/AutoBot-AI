#
# #18208: this file is the reusable BODY of one gate. ci.yml calls it; the triggers, the
# `changes` job, the concurrency group and any required-context job that used to live here
# are in ci.yml now. Nothing in this file may publish a required context: a job in a called
# workflow reports as `<caller job> / <job>`, which is not the name branch protection matches.

name: Docker Smoke Test (reusable body)

on:
  workflow_call:
    outputs:
      ok:
        description: "'true' only when every step of the smoke test passed"
        value: ${{ jobs.docker-smoke.outputs.ok }}

permissions:
  contents: read

jobs:
  docker-smoke:
    name: Docker Image Build and Compose Smoke
    outputs:
      ok: ${{ steps.done.outputs.ok }}
    # Whether this runs is decided by the `smoke-test` gate in ci.yml, from the one
    # `changes` job (#18208). #17126 once ran the build when detection FAILED ("we could
    # not tell, so build"); the gate now fails closed instead, because a second publisher
    # of the same context racing the shim is what #17391 and #14922 measured as unsafe.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          # The run itself consumes ~17 GB (images, layer cache, service images);
          # 30 leaves headroom, and the toolchain removal runs only below it (#19527).
          min-free-gb: '30'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        with:
          # #19527: tearing the builder down cost 30-60s per run on a runner that is
          # discarded anyway. A persistent self-hosted runner still cleans up.
          cleanup: ${{ runner.environment == 'self-hosted' }}

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Pick the management network range (#16833)
        # docker-compose.yml has no default autobot-mgmt range; this is the pick
        # docker/generate-secrets.sh makes for a user, exported for every compose step.
        run: |
          prefix="$(python3 docker/pick_mgmt_prefix.py)"
          echo "AUTOBOT_DOCKER_MGMT_PREFIX=${prefix}" >> "$GITHUB_ENV"

      - name: Required credentials (#17793)
        # Compose has no fallback for these and refuses to start without them; for a user,
        # docker/generate-secrets.sh writes them. Only these are exported: the signing secrets
        # stay unset, so the GH#9905 auto-provisioning path is still what this run tests.
        # repo_tests/compose_exposure_and_credentials_17500_test.py keeps this list equal to
        # the credentials compose requires.
        run: |
          for key in AUTOBOT_DB_PASSWORD GRAFANA_ADMIN_PASSWORD AUTOBOT_ADMIN_PASSWORD SLM_ADMIN_PASSWORD; do
            value="$(openssl rand -hex 16)Aa1"  # the admin schema wants upper, lower and a digit
            echo "::add-mask::${value}"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done

      - name: Build images
        # Concurrent bake with a per-image layer cache, pulling the service images
        # meanwhile -- which is why the two compose-environment steps above now
        # run first (#19527).
        uses: ./.github/actions/build-smoke-images
        with:
          group: smoke
          cache-key-prefix: buildx-bake-smoke

      - name: Start services with Docker Compose
        # GH#9905: no manual secret step — the stack auto-provisions unique
        # signing secrets via the autobot-secrets-init service + shared volume.
        # Starting with NO secret in env IS the real out-of-the-box test: if the
        # auto-gen/loader path regresses, services won't reach healthy below.
        run: docker compose --env-file docker/.env.docker up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          max_attempts=90
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: Checking service health..."

            # Frontend (nginx), backend, and SLM must all be healthy
            frontend_ok=false
            backend_ok=false
            slm_ok=false

            curl -s -f http://localhost > /dev/null 2>&1 && frontend_ok=true
            curl -s -f http://localhost/api/system/health > /dev/null 2>&1 && backend_ok=true
            curl -s -f http://localhost/slm/api/health > /dev/null 2>&1 && slm_ok=true

            if $frontend_ok && $backend_ok && $slm_ok; then
              echo "✓ Frontend responding on port 80"
              echo "✓ Backend health check passed"
              echo "✓ SLM health check passed"
              exit 0
            fi

            $frontend_ok || echo "  waiting: frontend not yet responding"
            $backend_ok  || echo "  waiting: backend not yet responding"
            $slm_ok      || echo "  waiting: SLM not yet responding"

            sleep 10
          done

          echo "Services failed to become healthy within 15 minutes (900s)"
          echo ""
          echo "=== Docker Compose Logs ==="
          docker compose --env-file docker/.env.docker logs
          exit 1

      - name: The management network uses the picked range, and fleet node IPs match it (#16833)
        # #16833 AC1: the picked AUTOBOT_DOCKER_MGMT_PREFIX is the subnet Docker actually
        # created. AC2 (#9761 regression): every node the SLM registered reports an address
        # in that range, and each compose service's registered IP is the address Docker gave
        # its container -- compose_fleet.mgmt_ip() computes them, so drift shows up here.
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          net="$(docker network ls -q --filter label=com.docker.compose.network=autobot-mgmt)"
          [ -n "$net" ] || fail "no autobot-mgmt network found"
          net_name="$(docker network inspect -f '{{.Name}}' "$net")"
          subnet="$(docker network inspect -f '{{(index .IPAM.Config 0).Subnet}}' "$net")"
          echo "autobot-mgmt (${net_name}) subnet: ${subnet}; picked prefix: ${AUTOBOT_DOCKER_MGMT_PREFIX}"
          [ "$subnet" = "${AUTOBOT_DOCKER_MGMT_PREFIX}.0/24" ] || fail "subnet ${subnet} is not the picked ${AUTOBOT_DOCKER_MGMT_PREFIX}.0/24"

          # Expected nodes: every compose service that declares an autobot-mgmt address (the eight
          # compose_fleet hosts). Each must be running at its declared address, and each must be
          # registered at that address -- one matching node is not enough (#16833 AC2).
          declare -A declared actual
          while read -r svc ip; do declared[$svc]="$ip"; done < <(
            docker compose --env-file docker/.env.docker config --format json \
              | jq -r '.services | to_entries[] | select(.value.networks["autobot-mgmt"].ipv4_address? != null)
                       | "\(.key) \(.value.networks["autobot-mgmt"].ipv4_address)"')
          [ "${#declared[@]}" -gt 0 ] || fail "no compose service declares an autobot-mgmt address"
          for c in $(docker compose --env-file docker/.env.docker ps -q); do
            svc="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' "$c")"
            actual[$svc]="$(docker inspect -f "{{with index .NetworkSettings.Networks \"${net_name}\"}}{{.IPAddress}}{{end}}" "$c")"
          done
          for svc in "${!declared[@]}"; do
            [ "${actual[$svc]:-}" = "${declared[$svc]}" ] || fail "service ${svc} declares ${declared[$svc]}, but its container has '${actual[$svc]:-not running}'"
          done

          # compare_nodes ROWS: 0 when every declared service is registered at its address. The SLM
          # registers itself under AUTOBOT_SLM_NODE_ID (#19322), not its service name, so it is matched by address.
          compare_nodes() {
            local -A reg=()
            local id ip svc
            while read -r id ip; do [ -z "$id" ] || reg[$id]="$ip"; done <<< "$1"
            for id in "${!reg[@]}"; do
              [[ "${reg[$id]}" == "${AUTOBOT_DOCKER_MGMT_PREFIX}."* ]] || { echo "node ${id} reports ${reg[$id]}, outside ${AUTOBOT_DOCKER_MGMT_PREFIX}.0/24"; return 1; }
            done
            for svc in "${!declared[@]}"; do
              if [ "$svc" = "autobot-slm" ]; then
                printf '%s\n' "${reg[@]}" | grep -qxF "${declared[$svc]}" || { echo "no node is registered at the SLM manager's address ${declared[$svc]}"; return 1; }
              elif [ "${reg[$svc]:-}" != "${declared[$svc]}" ]; then
                echo "node ${svc} is registered at '${reg[$svc]:-missing}', but its container has ${declared[$svc]}"; return 1
              fi
            done
          }

          # The SLM seeds compose nodes at startup; allow it a minute. A failed query (table not
          # created yet, connection refused) or an incomplete set is a retry, not a step failure under
          # `set -e`. User and database come from the container, where compose set them.
          rows="" why="the SLM registered no fleet nodes"
          for _ in $(seq 1 12); do
            rows="$(docker compose --env-file docker/.env.docker exec -T autobot-postgres \
              sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -F " " -c "SELECT node_id, ip_address FROM nodes ORDER BY node_id"' \
              2>/dev/null)" || rows=""
            if [ -n "$rows" ]; then why="$(compare_nodes "$rows")" && { why=""; break; }; fi
            sleep 5
          done
          while IFS= read -r row; do echo "  node $row"; done <<< "$rows"
          [ -z "$why" ] || fail "$why"
          echo "✓ all ${#declared[@]} compose services are registered at the address Docker gave them, all in ${subnet}"

      - name: Verify services are running
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying services..."
          docker compose --env-file docker/.env.docker ps

          # #7066: || true to swallow SIGPIPE from curl when head exits early.
          # These pipelines are informational only — the actual smoke gate is
          # the docker-compose healthchecks above. With set -o pipefail (added
          # by #7019), curl receives SIGPIPE → exit 23 → step fails.
          echo ""
          echo "=== Frontend Health Check ==="
          curl -v http://localhost 2>&1 | head -20 || true

          echo ""
          echo "=== Backend Health Check ==="
          curl -v http://localhost/api/system/health 2>&1 | head -20 || true

          echo ""
          echo "=== SLM Health Check ==="
          curl -v http://localhost/slm/api/health 2>&1 | head -20 || true

      - name: Collect logs on failure
        if: failure()
        run: |
          # Print inline (diagnosable without downloading the artifact) AND keep the
          # artifact. Grouped so it collapses in the UI. (#10706)
          echo "::group::docker compose logs (backend / slm / frontend)"
          docker compose --env-file docker/.env.docker logs --no-color | tee failure-logs.txt
          echo "::endgroup::"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-compose-logs
          path: failure-logs.txt

      - name: Clean up
        if: always()
        run: docker compose --env-file docker/.env.docker down

      # Positive evidence for the `smoke-test` gate in ci.yml (#18208): this step is
      # reached only when every step above it succeeded, so the output below is
      # 'true' on a full pass and empty on a failure, a cancel or a timeout.
      - name: Record that every step passed
        id: done
        shell: bash
        run: echo "ok=true" >> "$GITHUB_OUTPUT"
