# A merge train's members keep their content, read from the content (#20406).
#
# Train PR #20271 merged a member with an empty diff: its commits were reachable and the PR read
# MERGED, while its files were not on main. On a train PR this judges each member at its own merge
# commit, so a loss stops the train before it lands. When a train lands it checks that what the
# train changed reached main.
#
# Only `train-*` heads from this repo run it. A read-only token, and no
# `pull_request` trigger (#20825): ci.yml's `fan-out` dispatches it before the train lands, and a push to main checks
# it after. Making `train-content` a required status on main is a branch-protection setting
# (maintainer), recorded on #20406.

name: train-content-gate

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Train pull request this run is for (set by ci.yml's fan-out; empty on a manual run)
        required: false
        default: ''
        type: string
      head_sha:
        description: Head commit the coordinator read; the run cancels itself when the branch tip differs
        required: false
        default: ''
        type: string
      base_sha:
        description: Merge base of the head with the pull request's base branch
        required: false
        default: ''
        type: string

concurrency:
  group: train-content-gate-${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || github.sha }}
  cancel-in-progress: ${{ inputs.pr_number != '' }}

permissions: {}

jobs:
  # Before the train lands: judge each member at its own merge commit.
  train-content:
    name: train-content
    if: ${{ inputs.pr_number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/pr-context
        id: pr
        with:
          pr-number: ${{ inputs.pr_number }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

      - name: Set up Python from .python-version
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Every member's content is present at its merge
        env:
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          TITLE: ${{ steps.pr.outputs.title }}
          BODY_FILE: ${{ steps.pr.outputs.body-file }}
        run: python3 pipeline-scripts/train_content_gate.py --range "$(git merge-base "$BASE_SHA" "$HEAD_SHA")..$HEAD_SHA" --title="$TITLE" --body="$(cat "$BODY_FILE")"

  # After the push to main: when the pushed commit is a train's merge, what the train changed reached main.
  train-landed:
    name: train-content (landed)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Is the pushed commit a train's merge
        id: train
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only the pull request whose OWN merge commit is the pushed commit, from this repository, with a `train-*` head.
          n=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq \
            "[.[] | select(.merge_commit_sha == \"${GITHUB_SHA}\" and .merged_at != null and (.head.ref | startswith(\"train-\")) and .head.repo.full_name == \"${GITHUB_REPOSITORY}\")] | length")
          echo "train=$([ "${n}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Python from .python-version
        if: steps.train.outputs.train == 'true'
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: What the train changed reached main
        if: steps.train.outputs.train == 'true'
        run: python3 pipeline-scripts/train_content_gate.py --landed "$GITHUB_SHA"
