# SLM Frontend Check — type-check + lint + build + unit tests for autobot-slm-frontend
# (#10493, #15667)
#
# The /slm operator console (autobot-slm-frontend) had NO CI gate, so broken
# TypeScript/build changes could merge undetected and cross-app migrations
# (#10488 Workstream A) had no way to be verified. This adds that gate.
#
# Mirrors the "changes filter + self-skip" pattern so the check always reports
# a conclusion. The two halves now live in different files: the changes filter
# in frontend-test.yml, the self-skip job in frontend-required-context.yml
# after the #13405 split (a path-filtered required check that never fires
# would deadlock the PR on "Expected — Waiting for status").

name: SLM Frontend Check

on:
  push:
    branches: [release, main, develop]
    paths:
      - 'autobot-slm-frontend/**'
      - '.github/workflows/slm-frontend-check.yml'
      - 'autobot-frontend/scripts/check-i18n-keys.mjs'
  pull_request:
    branches: [release, main, develop]
    # #13388: SAFE — "SLM Frontend Check" is NOT one of the ten required contexts
    # on main, so this workflow may skip its run entirely. (The header note
    # above about a path-filtered required check deadlocking a pull request is why
    # the job-level self-skip exists; it applies to required contexts, and this is
    # not one.) Mirrors the `slm_frontend` filter in `changes` below.
    paths:
      - 'autobot-slm-frontend/**'
      - '.github/workflows/slm-frontend-check.yml'
      - 'autobot-frontend/scripts/check-i18n-keys.mjs'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Always runs so the check reports a conclusion even when nothing matched.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      slm_frontend: ${{ steps.filter.outputs.slm_frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            slm_frontend:
              - 'autobot-slm-frontend/**'
              - '.github/workflows/slm-frontend-check.yml'
              - 'autobot-frontend/scripts/check-i18n-keys.mjs'

  slm-frontend-check:
    name: SLM Frontend Check
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autobot-slm-frontend
    steps:
      - uses: actions/checkout@v7

      - name: Self-skip when no SLM frontend changes
        if: needs.changes.outputs.slm_frontend != 'true'
        run: echo "No autobot-slm-frontend changes — skipping (reporting success)."

      - name: Set up Node
        if: needs.changes.outputs.slm_frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: autobot-slm-frontend/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.slm_frontend == 'true'
        run: npm ci

      - name: Type-check (vue-tsc)
        if: needs.changes.outputs.slm_frontend == 'true'
        run: npm run type-check

      - name: Lint
        if: needs.changes.outputs.slm_frontend == 'true'
        run: npx eslint .

      # #15665: the SLM console had no i18n gate, so a key used in code but missing
      # from en.json shipped unnoticed. Same checker as the main GUI, pointed here
      # with --root/--en; it checks key existence, not bare literals.
      - name: i18n keys
        if: needs.changes.outputs.slm_frontend == 'true'
        run: npm run check:i18n

      # #14781: the console now ships all 11 locales. Two things can rot: a key
      # present in one locale and not the others (vue-i18n then falls back
      # silently, so the gap is invisible until someone reads that language),
      # and a hand-edited locale drifting from what the lifting rule produces.
      # The first is `check:locales`; the second is the generator's own --check,
      # which is why the generation is a script in the repo rather than a
      # one-off someone ran.
      - name: Locale parity
        if: needs.changes.outputs.slm_frontend == 'true'
        run: npm run check:locales

      - name: Locales match the lifting rule
        if: needs.changes.outputs.slm_frontend == 'true'
        working-directory: .
        run: python3 scripts/lift_locale_translations.py --app autobot-slm-frontend/src/locales --check

      # The two repo_tests guards run HERE as well as in the python suite, and
      # the reason is #15900: they declare `*.vue` / `*.json` globs, which the
      # python path filter does not cover. That gap is recorded deliberately in
      # `repo_tests/glob_declared_reads_15900_test.py` -- widening the filter to
      # those trees would cost twelve shards on nearly every pull request -- but
      # the consequence is that a .vue-only change would not run them. A gate
      # that does not fire on the change it guards is the vacuous shape #15665
      # exists to close, so this workflow, which DOES trigger on
      # autobot-slm-frontend/**, runs them on exactly those changes.
      # This job sets up Node and nothing else, so the pytest step below needs
      # an interpreter. Minimal on purpose: both guards import only the stdlib
      # (`json`, `re`, `html.parser`) plus `repo_tests._paths`, so pytest is the
      # whole dependency -- no requirements file, no cache key to invalidate.
      - name: Set up Python for the i18n guards
        if: needs.changes.outputs.slm_frontend == 'true'
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Install pytest
        if: needs.changes.outputs.slm_frontend == 'true'
        working-directory: .
        # pytest-asyncio as well as pytest, because `pytest.ini`'s global
        # `addopts` carries `--asyncio-mode=auto` and this job runs from that
        # rootdir. Bare pytest exits with "unrecognized arguments:
        # --asyncio-mode=auto" before it collects anything -- the same hazard
        # pytest.ini's own comment documents for a global `-n`, which it keeps
        # out of addopts precisely so bare-pytest jobs like this one survive.
        # These two guards are synchronous and need none of pytest-asyncio's
        # behaviour; it is here to satisfy the rootdir's arguments.
        run: python3 -m pip install --quiet pytest pytest-asyncio

      - name: i18n guards (bare literals, locale parity)
        if: needs.changes.outputs.slm_frontend == 'true'
        working-directory: .
        run: |
          python3 -m pytest -q \
            repo_tests/slm_frontend_bare_ui_literals_test.py \
            repo_tests/slm_frontend_i18n_parity_test.py

      - name: Build
        if: needs.changes.outputs.slm_frontend == 'true'
        # build:slm sets VITE_API_URL=/slm (the co-located base the vite config requires).
        run: npm run build:slm

      # #15667: this app's 55 vitest files — an entire suite, including the
      # #15640 regression guards — were invoked by no workflow at all. Every
      # `vitest` / `test:unit` reference in the other workflows belongs to
      # autobot-frontend, a different app. Gated on the same changes filter as
      # its sibling steps, and deliberately WITHOUT continue-on-error: a gate
      # that cannot turn the check red is not a gate.
      - name: Unit tests (vitest)
        if: needs.changes.outputs.slm_frontend == 'true'
        run: npm run test:unit
