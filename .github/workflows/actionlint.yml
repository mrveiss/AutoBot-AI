name: actionlint

on:
  push:
    branches: [release, main]
    paths: [".github/workflows/**"]
  pull_request:
    # ready_for_review is REQUIRED here: the jobs below are gated on
    # draft == false, and marking a PR ready fires ONLY this event. Without
    # it a required context stays `skipped` and the PR can never merge.
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [".github/workflows/**"]

# Least privilege (#15331). Lints workflow files; no token writes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12
