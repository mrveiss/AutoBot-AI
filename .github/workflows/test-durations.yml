# Regenerates the stored per-test durations that `python-suite` splits on.
#
# #10691: pytest-split's default `duration_based_chunks` algorithm cuts the
# collected list into contiguous chunks of equal *estimated time*. With no
# durations file every test is assumed to cost the same, so the split degrades
# to equal test COUNTS — and because this suite's per-test cost is wildly
# uneven, one shard ends up carrying a disproportionate share of the wall clock
# and a 6-way split delivers nowhere near 6x. The durations file is what makes
# the split balanced, so it has to be regenerated as the suite changes.
#
# This job deliberately does NOT pass --splits/--group: with both options
# pytest-split registers the cache plugin alongside the split plugin and stores
# only the durations of the group that ran, silently truncating the file to a
# twelfth of the suite. Regeneration therefore has to be an unsharded run.
name: test-durations

on:
  schedule:
    # Weekly. The suite is ~1-2h unsharded, so this is deliberately infrequent;
    # durations only need to be approximately right, and pytest-split assigns
    # the mean duration to any test it has no timing for, so tests added between
    # regenerations degrade the balance gradually rather than breaking anything.
    - cron: '0 3 * * 0'
  workflow_dispatch:
  pull_request:
    branches: [ release, main ]
    paths:
      # A workflow that only ever runs on a schedule is never exercised until
      # the day it silently breaks, and nobody is watching a 3am cron. Running
      # it on PRs that change it is what makes it reviewable — and it is what
      # produced the first committed .test_durations (#10691).
      - '.github/workflows/test-durations.yml'
      - '.github/actions/setup-python-suite/action.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store-durations:
    # Renamed (#17313): it measures and uploads; the `land` job below is what
    # stores. The old name described an outcome this job never produced.
    name: Measure per-test durations
    runs-on: ubuntu-latest
    # Unsharded, so this needs the full pre-sharding budget. Observed runner
    # variance on this suite is roughly 2x (50m to 1h24m for identical work),
    # hence the wide margin.
    timeout-minutes: 180

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python-suite

      # Both invocations mirror python-suite exactly EXCEPT for coverage, which
      # is omitted here. Only the RELATIVE cost of tests matters to the split,
      # and coverage instrumentation is a broadly proportional multiplier, so
      # dropping it makes regeneration substantially cheaper without meaningfully
      # changing the chunk boundaries. Everything that does affect which tests
      # exist — the marker exclusion, the target trees, the interpreter split —
      # is identical, because a durations file whose keys do not match the
      # collected node IDs is worth nothing.
      #
      # #13084: two separate interpreter sessions, for the same package-name
      # collision reason as python-suite. Two separate durations files, because
      # a single --durations-path would have the second invocation overwrite the
      # first (--clean-durations discards timings for tests not in the run).
      - name: Store durations — backend, shared, tts-worker, repo_tests
        run: |
          # #14917: `tools scripts pipeline-scripts` were wired into ci.yml by #13368,
          # #13653, #13879 and #13880 and into none of the other invocations. The four
          # root lists must agree — repo_tests/hook_suites_run_in_ci_test.py compares
          # them to each other, so a fifth invocation is checked on arrival.
          # Until now they had no entries here, so the
          # shard balancer placed them by hash with zero weight.
          # #14986: `.claude/skills/claims-audit` -- 42 tests of the claims-audit skill
          # that no workflow collected, because pytest.ini's testpaths is an allowlist
          # and `.claude` was not on it. Six were red against real defects in the
          # verifiers; all six are fixed and all 42 pass, so this is a wiring fix, not a
          # quarantine. Named in all four carriers because they are required to agree
          # (#14917). Narrow on purpose: `.claude/` as a whole is harness territory.
          # #15051: `autobot-infrastructure/shared/tests` and `libs` were named by no
          # pytest invocation in any workflow -- 17 of their test functions ran
          # nowhere at all, ever. Named in all four `repo_tests`-carrying invocations
          # together so hook_suites_run_in_ci_test.py's root-set agreement stays true.
          python -m pytest \
            autobot-backend autobot_shared autobot-tts-worker repo_tests tools scripts pipeline-scripts autobot-infrastructure/shared/scripts/hooks .claude/skills/claims-audit autobot-infrastructure/shared/tests libs \
            -n auto --dist loadscope \
            -m "not integration and not slow and not distributed and not performance" \
            --store-durations \
            --clean-durations \
            --durations-path .test_durations \
            --tb=no \
            -q \
          || echo "::warning::pytest exited non-zero; durations are still recorded for every test that ran"

      - name: Store durations — slm-backend
        if: ${{ !cancelled() }}
        run: |
          python -m pytest \
            autobot-slm-backend \
            -n auto --dist loadscope \
            -m "not integration and not slow and not distributed and not performance" \
            --store-durations \
            --clean-durations \
            --durations-path .test_durations_slm \
            --tb=no \
            -q \
          || echo "::warning::pytest exited non-zero; durations are still recorded for every test that ran"

      - name: Summarise the split these durations produce
        if: ${{ !cancelled() }}
        run: |
          python scripts/ci/summarize_test_durations.py \
            --splits 12 \
            .test_durations .test_durations_slm >> "$GITHUB_STEP_SUMMARY"

      - name: Upload durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-durations
          # Both paths are dotfiles; upload-artifact excludes hidden files
          # unless told otherwise, which would silently produce an empty
          # artifact.
          include-hidden-files: true
          path: |
            .test_durations
            .test_durations_slm
          if-no-files-found: error
          retention-days: 30

  # #17313: the measuring always worked; the landing never existed. This job
  # was named "Measure and store" while its last step was upload-artifact, so
  # every weekly run did 2-3h of real work and threw the result away. The
  # committed files aged 37 and 51 days, last written by ordinary feature PRs
  # rather than by the workflow that owns them.
  #
  # A SEPARATE job, deliberately. The obvious fix -- give the measuring job
  # `contents: write` -- would put a repository-write token in the same job
  # that runs the entire test suite, so any test, fixture or transitive import
  # could reach it. The token belongs where the suite is not. `store-durations` stays
  # read-only and hands over an artifact; `land` never runs a test.
  land:
    name: Land the refreshed durations
    needs: store-durations
    # Only where a refresh is the point. A pull_request run exercises the
    # workflow (that is why the path filter exists) and must not open a PR of
    # its own -- that would be a workflow opening pull requests about itself
    # every time someone edits it.
    if: >
      !cancelled() && needs['store-durations'].result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: test-durations

      - name: Open or update the durations PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/test-durations
        run: |
          set -euo pipefail

          # Fail closed. An empty or missing durations file must never be
          # committed over a good one: pytest-split would then give every test
          # the mean and the split would be worse than the stale data it
          # replaced. if-no-files-found:error covers the artifact being absent;
          # this covers it arriving truncated.
          for f in .test_durations .test_durations_slm; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty -- refusing to commit it"; exit 1; }
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if len(d) > 100 else 1)" "$f" \
              || { echo "::error::$f holds fewer than 100 timings -- the run did not measure the suite"; exit 1; }
          done

          if git diff --quiet -- .test_durations .test_durations_slm; then
            # The distinction this workflow could not previously express: a run
            # that completed and found nothing to change is NOT the same as a
            # run that never landed anything, and both used to look identical
            # from outside.
            echo "::notice::durations unchanged -- the committed files already match this run"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add .test_durations .test_durations_slm
          git commit -m "chore(ci): refresh per-test split durations (#17313)"
          git push --force-with-lease origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "::notice::updated the existing durations PR"
          else
            # A heredoc, not printf with single-quoted lines. The body wants
            # literal Markdown backticks, and shellcheck reads a backtick inside
            # single quotes as command substitution that will not expand
            # (SC2016). Quoted delimiter, so nothing in the text expands; the
            # two leading spaces per line are the YAML block's indent and are
            # stripped back off, and one placeholder carries the run URL.
            BODY_FILE="$(mktemp)"
            sed 's/^    //' > "$BODY_FILE" <<'BODY'
              ## Thinking Path

              Generated by `test-durations.yml`. pytest-split assigns the mean duration to
              any test it has no timing for, so the split degrades as tests are added
              between regenerations. This is the regeneration.

              ## What Changed

              Measured timings for `.test_durations` and `.test_durations_slm`. No source
              change.

              ## Verification

              __RUN_URL__

              The step summary of that run carries the split these durations produce.

              ## Model Used

              None — generated by CI.

              Refs #17313
          BODY
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            sed -i "s|__RUN_URL__|Run: ${RUN_URL}|" "$BODY_FILE"
            gh pr create --base main --head "$BRANCH" \
              --title "chore(ci): refresh per-test split durations (#17313)" \
              --body-file "$BODY_FILE"
            rm -f "$BODY_FILE"
          fi
