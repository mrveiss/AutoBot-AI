# GitHub Actions workflow to enforce pre-commit hooks installation
# Ensures developers have pre-commit configured to catch issues before push
# Related: MVA-2111, MVA-2108 (6 PRs required admin override due to missing local checks)

name: Enforce Pre-commit Hooks

on:
  pull_request:
    branches: [ main, Dev_new_gui, develop ]
    # No `paths:` filter — this workflow is a REQUIRED status check (#12174), and
    # a required check that is path-filtered out never reports, wedging any PR
    # that touches only non-matching files (docs, .sh, .css, .json). Running on
    # every PR guarantees it always reports, and also closes the SPDX coverage
    # gap: the header check covers .sh/.css/.js/.mjs/.tsx, which the old filter
    # (.py/.ts/.vue/.yml only) never triggered on.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-precommit-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # fetch-depth: 2 (not the actions/checkout default of 1) so the PR
          # base commit is present. On a pull_request the checkout is the
          # merge commit: depth 2 supplies both parents — HEAD^1 (base tip)
          # and HEAD^2 (PR head) — which the #14137 symlink-diff step below
          # needs. Same reasoning as code-quality.yml (#13880).
          fetch-depth: 2

      - name: Check for pre-commit config
        run: |
          if [ ! -f .pre-commit-config.yaml ]; then
            echo "::error::.pre-commit-config.yaml is missing from the repository"
            echo "Pre-commit hooks are required to catch code quality issues locally."
            echo "This file should exist in the repository root."
            exit 1
          fi
          echo "✓ .pre-commit-config.yaml found"

      - name: Validate pre-commit config
        run: |
          if ! grep -q "black" .pre-commit-config.yaml; then
            echo "::error::Black hook missing from .pre-commit-config.yaml"
            exit 1
          fi
          if ! grep -q "isort" .pre-commit-config.yaml; then
            echo "::error::isort hook missing from .pre-commit-config.yaml"
            exit 1
          fi
          if ! grep -q "flake8" .pre-commit-config.yaml; then
            echo "::error::flake8 hook missing from .pre-commit-config.yaml"
            exit 1
          fi
          if ! grep -q "autoflake" .pre-commit-config.yaml; then
            echo "::error::autoflake hook missing from .pre-commit-config.yaml"
            exit 1
          fi
          if ! grep -q "mypy" .pre-commit-config.yaml; then
            echo "::error::mypy hook missing from .pre-commit-config.yaml"
            exit 1
          fi
          echo "✓ All required hooks (black, isort, flake8, autoflake, mypy) are configured"

      # #13517: shared composite action (also upgrades pip/setuptools/wheel).
      - name: Set up Python
        uses: ./.github/actions/setup-python-ci
        with:
          extra-packages: pre-commit

      # #13517: pre-commit is installed by the composite action above via
      # extra-packages, which also upgrades pip/setuptools/wheel — this step
      # duplicated both.

      - name: Run pre-commit on all files
        run: |
          # This validates that the hooks are properly configured and can run
          # We expect this to potentially fail on the first run if code doesn't meet standards
          # The goal is to catch configuration errors, not necessarily code issues
          pre-commit run --all-files --show-diff-on-failure || {
            echo "::warning::Pre-commit hooks found issues. Developers should run 'pre-commit run --all-files' locally."
            echo "::warning::Note: This is informational. The main goal is verifying hooks are configured."
            # Don't fail the workflow - we just want to verify hooks work
            exit 0
          }

      - name: Enforce SPDX/Apache-2.0 license header (#9840)
        run: |
          # BLOCKING: every first-party .py/.ts/.tsx/.js/.mjs/.sh/.css file must
          # carry the Apache-2.0 SPDX header. Scan mode (no --fix) fails CI when
          # a header-less file lands, so coverage from the #9826 relicense sweep
          # can no longer drift. Run check_spdx_header.py over all tracked files;
          # in_scope()/EXCLUDE_RE in the script skip vendored/generated/.vue/
          # workflow/infrastructure paths (same scope as the original sweep).
          git ls-files -z | xargs -0 python3 tools/lint/check_spdx_header.py

      - name: Block newly tracked symlinks into or out of the working tree (#14137)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # BLOCKING, and diff-scoped rather than a full-tree scan: #14149
          # found a PRE-EXISTING tracked symlink (already broken, tracked
          # separately) that a full-tree scan would fail on every unrelated
          # PR until it's fixed. Same changed-files scoping #13950/#14051
          # established for the hardcoded-value and print guards — a NEWLY
          # added or modified mode-120000 entry still fails; #14149's,
          # untouched by a given PR, does not block that PR.
          #
          # Resolve through HEAD's own parents first (#13880): on a
          # pull_request the checkout is the merge commit, so HEAD^1 is the
          # base tip and HEAD^2 is the PR head — no event payload needed.
          have() { git cat-file -e "${1}^{commit}" 2>/dev/null; }
          if have 'HEAD^2' && have 'HEAD^1'; then
            base="HEAD^1"
          elif have "${PR_BASE_SHA:-x}"; then
            base="$PR_BASE_SHA"
          else
            echo "::error::cannot resolve a base commit — refusing to report 0 changed files as clean"
            exit 1
          fi
          # No extension pathspec: the destructive entries in both #14137
          # (venv) and #14149 (all.yml) are exactly the shapes a
          # source-extension filter would exclude — one has no extension at
          # all, the other isn't a source file.
          if ! raw_files=$(git diff --name-only "$base" HEAD); then
            echo "::error::git diff failed for ${base}..HEAD — refusing to report clean."
            exit 1
          fi
          if [ -z "$raw_files" ]; then
            echo "No changed files — skipping pre-commit-no-tracked-symlink."
            exit 0
          fi
          echo "$raw_files" | xargs -d '\n' bash autobot-infrastructure/shared/scripts/hooks/pre-commit-no-tracked-symlink

      - name: Block tracked paths shadowing the virtualenv ignore names (#14137)
        run: |
          # Full-tree (git ls-files inside the hook): zero pre-existing
          # violations as of #14137 (verified — every currently-tracked
          # bin/lib/venv-named path is covered by a .gitignore '!' negation),
          # so unlike the symlink guard above there is nothing pre-existing
          # to blame an unrelated PR for.
          bash autobot-infrastructure/shared/scripts/hooks/pre-commit-no-gitignore-shadow

  check-instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify CONTRIBUTING.md mentions pre-commit
        run: |
          if ! grep -qi "pre-commit" CONTRIBUTING.md; then
            echo "::warning::CONTRIBUTING.md does not mention pre-commit setup"
            echo "Developers may not know to install pre-commit hooks."
            echo "Consider adding installation instructions to CONTRIBUTING.md"
            # Warning only - don't fail
            exit 0
          fi
          echo "✓ CONTRIBUTING.md mentions pre-commit"
