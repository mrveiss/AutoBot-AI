# Auto-regenerate the frontend generated types (api.ts) on PR branches.
# Companion to verify-generated-types.yml (the REQUIRED gate): rather than
# force every author to hand-run `npm run gen:types` against a py3.14 backend
# (the deployed/dev boxes may run a different Python and produce a schema that
# never matches the gate), this job regenerates api.ts in the SAME py3.14
# environment the gate uses. It no longer commits the result back to the PR branch
# (#15362, see `permissions` below). Runs on GitHub-hosted runners so it never
# competes with the self-hosted runner.
#
# #14368: autobot-slm-frontend carries the identical drift risk (verified by
# `verify-generated-types-slm`, the SLM sibling of the required gate above)
# but had no auto-fix, so an SLM schema change simply reddened and the author
# had to regenerate by hand — which needs a locally-running SLM app, something
# contributors and agents cannot do in this repo. The steps below reuse the
# EXACT recipe `verify-generated-types-slm` runs (scripts/audit_api_wiring.py
# --dump-slm-openapi against autobot-slm-backend/main.py's `app`), so the two
# cannot drift apart. They stay in this one job, not a second parallel one:
# one push, one commit, one `approve-parked-runs` follow-up, matching the
# backend shape exactly instead of forking a second push/approve pair.

name: Auto-fix Generated Types

on:
  pull_request:
    paths:
      # Backend changes can alter the OpenAPI schema that api.ts is generated from.
      - 'autobot-backend/**/*.py'
      - 'autobot_shared/**/*.py'
      - 'autobot-frontend/src/types/generated/api.ts'
      # #14368: SLM backend changes can alter the OpenAPI schema
      # autobot-slm-frontend's openapi.json + api.ts are generated from.
      # openapi.json (unlike the backend's, which is an ephemeral CI temp
      # file never committed) IS a checked-in artifact here, so it is watched
      # too — a hand-edit or bad merge of it must also trigger the fix-back.
      - 'autobot-slm-backend/**/*.py'
      # #12986: completes the canonical `backend-python` set from .github/filters/backend-python-paths.yml;
      # enforced by pipeline-scripts/check_workflow_path_filters.py.
      - '.github/filters/backend-python-paths.yml'
      - 'autobot-slm-frontend/openapi.json'
      - 'autobot-slm-frontend/src/types/generated/api.ts'
      - '.github/workflows/auto-fix-generated-types.yml'

# #16360: a run caused by this workflow's OWN push (github-actions[bot]
# committing the regenerated types) gets a group of its own. Before this, the
# `approve-parked-runs` job below released that parked run, the released run
# joined this group, and its cancel-in-progress cancelled the very run the
# approver lives in: on #16351 the released run 34615151655 started at
# 15:23:12Z and the approver's run 34612780429 was cancelled at 15:23:15Z.
# Separating the GROUP is used rather than a per-run cancel-in-progress
# expression because it does not depend on which run's setting governs a
# cancel, which GitHub does not document. `github.actor` is the bot on that run
# (run API: actor and triggering_actor both github-actions[bot]; the human run
# it cancelled: both the PR author) and, unlike `github.triggering_actor`, stays
# the bot if a human later approves or re-runs it.
#
# #16363 review: "a bot" is any `[bot]` actor, not only github-actions[bot].
# The checkout below pushes with AUTOBOT_PUSH_TOKEN when it is set; if that token
# belongs to a GitHub App or another bot identity, the fork policy parks the push
# and the approver releases it exactly as in the fallback case. dependabot[bot]
# is excluded: its runs are never parked, so there is no approver to protect,
# and its rebases should keep superseding each other.
#
# Accepted trade-off: two bot-caused runs for DIFFERENT head SHAs no longer
# cancel each other. Each is the regen run of its own commit, which pushes
# nothing when the types already match, and a stale one's push, if it made one,
# would be rejected as a non-fast-forward.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}${{ endsWith(github.actor, '[bot]') && github.actor != 'dependabot[bot]' && format('-regen-{0}', github.event.pull_request.head.sha) || '' }}
  cancel-in-progress: true

# #15362: `read`, not `write`. `autofix-types` used to commit the regenerated types
# back to the PR branch, which invalidated every check already in flight and
# restarted the whole ~20-minute pass for a codegen nit. It now reports the drift
# with the command that fixes it.
#
# Dropping the permission rather than only deleting the `git push` line is the
# point: a workflow without `contents: write` CANNOT push, so the property is
# enforced by the token rather than by whoever edits this file next. The
# `approve-parked-runs` job below declares its own `contents: read` plus
# `actions: write`, so it never relied on this default.
permissions:
  contents: read

jobs:
  autofix-types:
    runs-on: ubuntu-latest
    # #14153: fork-hostile by construction — this job pushes a commit back to
    # the PR branch, which needs write access to the head repo that a fork PR
    # never grants. Skip rather than fail. (auto-fix-formatting.yml carried the
    # identical guard until #15934 removed it as redundant; this is now the
    # only workflow of the shape.)
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          # #13791: prefer a token attributed to a human. Pushing with the
          # default GITHUB_TOKEN attributes the commit to github-actions[bot],
          # and this repository's fork-PR policy (all_external_contributors)
          # treats that bot as external — so every run the push triggers is
          # created with conclusion=action_required and never starts. Falls back
          # to GITHUB_TOKEN so this workflow keeps working before the secret is
          # configured; the runs simply park as they do today. #14311's
          # `approve-parked-runs` job below repairs that fallback case
          # immediately instead of leaving it parked.
          token: ${{ secrets.AUTOBOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}


      # The steps are the generated-types-autofix composite action, shared with the
      # dispatch caller (#18500).
      - name: Regenerate the generated types and report drift
        uses: ./.github/actions/generated-types-autofix

  # #15362: `approve-parked-runs` below is now VESTIGIAL and deliberately kept.
  # `autofix-types` no longer pushes, so nothing parks and there is nothing for it
  # to approve: it will run, find no parked run for this PR, and exit clean.
  #
  # It is not removed here because nothing in #15362 requires it, and removing it
  # would retire three guard files that belong to other issues --
  # `approver_self_cancel_16360_test.py` (#16360),
  # `git_hooks_formatter_dispatch_16923_test.py` (#16923) and the approval wiring
  # pinned for #14311. Reversing those rulings inside a PR about CI invalidation
  # would be a scope change disguised as tidying. Retiring the job and its guards
  # together is its own issue.
  # #14311: when the token above falls back to the default GITHUB_TOKEN (or
  # even with AUTOBOT_PUSH_TOKEN configured but still resolving to a bot/app
  # identity the fork-PR approval policy does not recognise as a human), the
  # push in `autofix-types` is authored by github-actions[bot]. This
  # repository's fork-PR approval policy (all_external_contributors) treats
  # that bot as an external contributor, so the `pull_request` run the push
  # triggers is created with conclusion=action_required and never starts —
  # the same defect as #12823, guarded in general by ci-dispatch-watchdog.yml.
  #
  # That watchdog's own `pull_request` trigger cannot self-repair THIS case:
  # the `synchronize` event the push raises is itself attributed to
  # github-actions[bot], so a watchdog run it triggers would park too,
  # awaiting the very approval it exists to grant (see the header comment in
  # ci-dispatch-watchdog.yml). Its `schedule` cron is not a dependable
  # backstop: GitHub fires that `*/15` cron every few hours, not every 15
  # minutes (7 `schedule` runs among the 200 watchdog runs up to 2026-09-11,
  # #16360), and the PR sits parked with zero visible failing checks until
  # then. This job repairs it immediately — in the SAME workflow run
  # that did the push, which was triggered by whatever human action opened or
  # updated the PR and is therefore not itself parked — using the identical
  # script the watchdog runs (`ci_dispatch_watchdog.py --check dispatch`), not
  # a reimplementation of it.
  #
  # This explanation lived in auto-fix-formatting.yml until #15934 deleted that
  # workflow. It is reproduced here rather than cited, because a pointer into a
  # file that no longer exists is worse than no pointer. #14368 added
  # SLM steps into `autofix-types` itself rather than a second job, so this
  # approval job's `needs`/guard are unchanged — one push, one approval.
  approve-parked-runs:
    needs: autofix-types
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      statuses: write
      pull-requests: read
    # One base branch for the sweep and for the hand-off step's dispatch.
    env:
      WATCHDOG_BASE_BRANCH: main

    steps:
      - uses: actions/checkout@v7

      # The sweep's output is kept for the summary step below. pipefail keeps
      # the script's exit code, which `| tee` would otherwise discard.
      - name: Approve the run this push just parked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WATCHDOG_ONLY_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -o pipefail
          python3 pipeline-scripts/ci_dispatch_watchdog.py --check dispatch | tee "$RUNNER_TEMP/approval-sweep.log"

      # #16360 AC3: the sweep's result where a human looks, not only in the log.
      - name: Summarise the approval sweep
        if: always()
        shell: bash
        run: |
          {
            echo "## Parked-run approval for PR #${{ github.event.pull_request.number }}"
            echo
            grep -E "Sweep complete:|could NOT approve|left with parked runs|leaving .* parked" \
              "$RUNNER_TEMP/approval-sweep.log" 2>/dev/null || echo "The sweep printed no result line; see its step log."
          } >> "$GITHUB_STEP_SUMMARY"

      # #16360 AC3: a cancelled approver cannot report from inside the sweep,
      # and whatever it had not approved yet stays parked. A `cancelled()` step
      # still runs, so it names the gap and hands the sweep to the watchdog:
      # workflow_dispatch is the one trigger the GITHUB_TOKEN may use to start
      # a run.
      - name: Hand an interrupted sweep to the watchdog
        if: cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::error title=Parked-run approval was cancelled::PR #${{ github.event.pull_request.number }} may still have runs awaiting approval; dispatching the CI Dispatch Watchdog sweep (#16360)."
          echo "Approval sweep cancelled before it finished; CI Dispatch Watchdog dispatched to finish it (#16360)." >> "$GITHUB_STEP_SUMMARY"
          gh workflow run ci-dispatch-watchdog.yml --repo "${{ github.repository }}" --ref "$WATCHDOG_BASE_BRANCH"
