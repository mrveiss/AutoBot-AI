# #7227: vue-tsc regression guard.
#
# Runs `vue-tsc --noEmit -p tsconfig.app.json` on every PR that touches
# the frontend. Fails if the error count exceeds the BASELINE below.
#
# BASELINE is 0 as of #10093: #9724/#10073 cleared the historical type-debt
# (was 249 on 2026-06-04, see #7227) and the frontend-test gate (#10019)
# now enforces 0 via `npm run type-check`. This guard is the lightweight
# path-filtered companion — keep BASELINE at 0 so any new TS error fails.
#
# If a future change must temporarily raise the baseline, also reconcile
# the frontend-test type-check step (which has no tolerance), and lower it
# back to 0 as soon as the cluster is cleaned up.
#
# Security: this workflow does NOT interpolate any untrusted GitHub
# event data into run: commands. All inputs are static repo paths.

name: frontend-typecheck-regression

on:
  pull_request:
    paths:
      - 'autobot-frontend/src/**/*.ts'
      - 'autobot-frontend/src/**/*.vue'
      - 'autobot-frontend/tsconfig*.json'
      - 'autobot-frontend/package*.json'
      - '.github/workflows/frontend-typecheck-regression.yml'
  push:
    branches: [Dev_new_gui]
    paths:
      - 'autobot-frontend/src/**/*.ts'
      - 'autobot-frontend/src/**/*.vue'

permissions:
  contents: read

jobs:
  vue-tsc-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: autobot-frontend/package-lock.json

      - name: Install dependencies
        working-directory: autobot-frontend
        run: npm ci --no-audit --no-fund

      - name: Run vue-tsc and check error count
        working-directory: autobot-frontend
        env:
          # 0 since #9724/#10073 cleared the type-debt; the frontend-test gate
          # (#10019) now also enforces 0 via `npm run type-check`. Keep at 0 so
          # this guard actually blocks any new TS error (#10093).
          BASELINE: 0
        run: |
          set -uo pipefail
          # #13341: this step carried the same fail-open as check-ts-delta.sh —
          # `set +e` plus a bare `grep -c` meant a vue-tsc that CRASHED or could
          # not read its tsconfig produced ERRORS=0, which against BASELINE=0 is
          # a pass. The "any new TS error fails" guard was therefore green in
          # every case where the compiler never checked anything.
          #
          # Also dropped `npx`, for the reason recorded in check-ts-delta.sh:
          # it resolves packages (network), prompts on stdin when resolution
          # misses, and takes npm-cache locks — all unbounded waits, and the
          # cause of a required check hanging for three hours. vue-tsc is a
          # devDependency and is on disk after `npm ci`.
          TSC_BIN=node_modules/.bin/vue-tsc
          if [ ! -x "$TSC_BIN" ]; then
            echo "ERROR: vue-tsc not found at $TSC_BIN — did 'npm ci' run?"
            exit 1
          fi

          TSC_OUTPUT=$(mktemp)
          trap 'rm -f "$TSC_OUTPUT"' EXIT
          TSC_STATUS=0
          "$TSC_BIN" --noEmit -p tsconfig.app.json >"$TSC_OUTPUT" 2>&1 </dev/null || TSC_STATUS=$?
          ERRORS=$(grep -cE "error TS" "$TSC_OUTPUT" || true)

          # vue-tsc returns TypeScript's ExitStatus: 0 clean, 1 a configuration
          # diagnostic, 2 "type errors found", 3/4 invalid project. Above 2 it
          # never completed a check; non-zero with no diagnostics is a crash.
          if [ "$TSC_STATUS" -gt 2 ] || { [ "$TSC_STATUS" -ne 0 ] && [ "$ERRORS" -eq 0 ]; }; then
            echo "ERROR: vue-tsc exited $TSC_STATUS without completing a check."
            cat "$TSC_OUTPUT"
            exit 1
          fi
          # TS5xxx/TS6xxx are config/command-line diagnostics, reported INSTEAD
          # of checking the sources — a missing tsconfig emits exactly one and
          # would otherwise read as a single tolerable error.
          if grep -qE "error TS[56][0-9]{3}" "$TSC_OUTPUT"; then
            echo "ERROR: vue-tsc reported a configuration error; nothing was type-checked."
            cat "$TSC_OUTPUT"
            exit 1
          fi

          cat "$TSC_OUTPUT"
          echo "BASELINE: $BASELINE errors (see #7227 for breakdown)"
          echo "CURRENT:  $ERRORS errors"
          if [ "$ERRORS" -gt "$BASELINE" ]; then
            echo ""
            echo "❌ Regression: $ERRORS > $BASELINE errors"
            echo "This PR introduced $((ERRORS - BASELINE)) new TypeScript errors."
            echo "Run \`npm run type-check\` in autobot-frontend/ locally to inspect."
            exit 1
          fi
          if [ "$ERRORS" -lt "$BASELINE" ]; then
            echo ""
            echo "✅ Improvement: $ERRORS < $BASELINE errors"
            echo "Reduce BASELINE in .github/workflows/frontend-typecheck-regression.yml to $ERRORS to lock in the gain."
          else
            echo ""
            echo "✅ No regression: $ERRORS == $BASELINE"
          fi
          exit 0
