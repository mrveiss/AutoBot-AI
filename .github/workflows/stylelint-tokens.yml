name: Stylelint Token Guard

# Tokenisation enforcement (#11515 Task 1, #17567). Lints the WHOLE tree of
# autobot-frontend, autobot-slm-frontend and libs/autobot-ui for hardcoded hex
# colours, and BLOCKS on any hit. The gate used to lint only the files a PR changed
# and never failed the PR, because #14554 measured a backlog of 386 + 23
# violations that predated it. That backlog is now zero in all three projects, so
# the gate is a property of the tree, not of the diff: a PR that adds a hex literal
# anywhere in a lint scope fails here. Token-definition files stay out of scope through
# each project's own ignoreFiles (design-tokens.css, themes/*.css, tailwind.css in the
# user frontend; main.css, slm-scheme.css in the SLM) and the kit's contract.css below.
#
# #14554: stylelint + postcss-html are real devDependencies of both
# autobot-frontend/package.json and autobot-slm-frontend/package.json (not an
# ad-hoc `npm install --no-save` here), so `npx stylelint` resolves the same way in
# this job, in CI's other frontend jobs, and in a developer's fresh `npm ci`.

on:
  pull_request:
    # ready_for_review is REQUIRED here: the jobs below are gated on
    # draft == false, and marking a PR ready fires ONLY this event. Without
    # it a required context stays `skipped` and the PR can never merge.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "autobot-frontend/**/*.vue"
      - "autobot-frontend/**/*.css"
      - "autobot-slm-frontend/**/*.vue"
      - "autobot-slm-frontend/**/*.css"
      # The shared kit's CSS is a third project with no node_modules of its own;
      # it is linted with the user frontend's pinned stylelint (#14579).
      - "libs/autobot-ui/**/*.vue"
      - "libs/autobot-ui/**/*.css"
      # Self-validate when the guard or either config changes.
      - "autobot-frontend/.stylelintrc.json"
      - "autobot-slm-frontend/.stylelintrc.json"
      - "libs/autobot-ui/.stylelintrc.json"
      - ".github/workflows/stylelint-tokens.yml"
      # A stylelint or postcss bump changes what the gate accepts, so a manifest change runs it.
      - "autobot-frontend/package.json"
      - "autobot-slm-frontend/package.json"
      - "libs/autobot-ui/package.json"

# #14434: without this, every push left its predecessors queued. 42 of a 271-run
# sample were for commits no longer at their branch tip - work nothing would ever
# read, each still fetching its actions. During GitHub's 2026-08-17 archive-download
# degradation that wasted load became failures on unrelated pull requests (#14444).
#
# cancel-in-progress is guarded on the event rather than set to a bare `true`:
# #13432 found that cancelling base-branch runs meant each merge cancelled the
# previous merge's verification, and merges arrive faster than a suite completes -
# of 39 completed base runs, 26 were cancelled and NONE succeeded. Six of the
# workflows this was applied to also trigger on push to main, so the guard
# is load-bearing there and harmless where it is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  stylelint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Stylelint (whole tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: |
            autobot-frontend/package-lock.json
            autobot-slm-frontend/package-lock.json
      - name: Stylelint autobot-frontend (whole tree)
        working-directory: autobot-frontend
        env:
          # #13410: no job here needs the Cypress binary; skip the ~100MB CDN
          # download so a Cypress CDN outage can never red out this job.
          CYPRESS_INSTALL_BINARY: "0"
        run: |
          npm ci
          # No --config: stylelint auto-resolves autobot-frontend/.stylelintrc.json.
          npx stylelint "src/**/*.{vue,css}"
      - name: Stylelint autobot-slm-frontend (whole tree)
        working-directory: autobot-slm-frontend
        run: |
          npm ci
          npx stylelint "src/**/*.{vue,css}"
      - name: Stylelint libs/autobot-ui (whole tree)
        # The kit has no package.json devDependencies of its own, so it borrows the
        # user frontend's stylelint + postcss-html (both pinned there), installed by
        # the first step: --config-basedir makes customSyntax resolve from there.
        # contract.css is the token DEFINITION site and is excluded here, not only by
        # the kit config's ignoreFiles: --config-basedir is the user frontend, and
        # stylelint resolves relative ignoreFiles globs against that base, so the
        # kit's own ignore never matches ../libs/... paths.
        working-directory: autobot-frontend
        run: |
          git -C .. ls-files -- 'libs/autobot-ui/**/*.vue' 'libs/autobot-ui/**/*.css' \
            ':!libs/autobot-ui/src/tokens/contract.css' \
            | sed -e 's|^|../|' > "$RUNNER_TEMP/kit-files.txt"
          test -s "$RUNNER_TEMP/kit-files.txt"
          xargs -a "$RUNNER_TEMP/kit-files.txt" npx stylelint \
            --config ../libs/autobot-ui/.stylelintrc.json --config-basedir "$PWD"
