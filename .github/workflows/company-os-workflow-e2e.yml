#
# Company OS workflow exit proof (#19253, milestone M2.10)
#
# One scripted scenario through the public API of the REAL backend (create_app() and its
# lifespan, started as a subprocess) against REAL Postgres and Redis service containers:
#   create a company, hire a CEO and two heartbeat-enabled agents, set a goal, a project and
#   work items, assign a task, wait for a scheduled heartbeat run, exhaust a budget, pause and
#   resume an agent, gate a hire behind an approval, and read the audit log.
# Only the model call is stubbed, at the adapter registry (autobot-backend/tests/company_os_e2e).
#
# Distinct from company-os-contract.yml, whose `company-os-e2e` job is a hermetic SQLite
# core-loop test with no Postgres, no Redis and mounted routers: that one proves the loop's
# services, this one proves the milestone. Neither replaces the other.
#
# A known open defect is recorded with pytest.xfail(reason) at the single assertion that encodes
# it, after the step's preconditions were asserted for real, so this job is green while the issue
# is open and a broken setup is still red. The step names and the M2.x issue each maps to are in tests/company_os_e2e/_scenario.py (STEPS).
#
# Not a required context. The scenario waits on real cron boundaries (about ten minutes).
# Migrations are not in the path filter: migration-gate.yml owns that surface; the nightly run
# covers the combination.

name: Company OS Workflow E2E

on:
  push:
    branches: [ release, main ]
    paths: &paths
      - 'autobot-backend/llc/**'
      - 'autobot-backend/api/llc/**'
      - 'autobot-backend/models/agent_org.py'
      - 'autobot-backend/initialization/lifespan*.py'
      - 'autobot-backend/app_factory.py'
      - 'autobot-backend/auth_middleware.py'
      - 'autobot-backend/api/user_management/**'
      - 'autobot-backend/tests/company_os_e2e/**'
      - '.github/workflows/company-os-workflow-e2e.yml'
  # Nightly, so a regression the path filter cannot see (a shared module, a dependency bump) still
  # shows up. GitHub registers `schedule` from the default branch only.
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request this run is for (set by ci.yml's fan-out; empty on a manual run)
        required: false
        default: ''
        type: string
      head_sha:
        description: Head commit the coordinator read; the run cancels itself when the branch tip differs
        required: false
        default: ''
        type: string
      base_sha:
        description: Merge base of the head with the pull request's base branch
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || github.ref }}
  cancel-in-progress: ${{ inputs.pr_number != '' }}

permissions:
  contents: read
  packages: read  # pull the ghcr CI image mirror (#18160)

jobs:
  # #20825: a dispatched run validates its pins and ends CANCELLED when its head is stale. Parallel to the work on
  # purpose: this workflow is advisory, and ci.yml's fan-out only passes values its own `changes` job validated.
  pr-context:
    name: pr-context
    if: ${{ inputs.pr_number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/pr-context
        with:
          pr-number: ${{ inputs.pr_number }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

  company-os-workflow:
    name: Company OS workflow end-to-end
    # Held (dependabot / release promotion), draft and un-admitted pull requests never reach this job: ci.yml's `fan-out` dispatches only what its `changes` job marked ready (#20825).
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        # Mirror of the upstream image (ci-image-mirror.yml, #18160): anonymous pulls hit the
        # per-IP quota. Same image and credentials as migration-gate.yml.
        image: ghcr.io/mrveiss/ci-postgres:16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: ghcr.io/mrveiss/ci-redis:7-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: ./.github/actions/setup-python-ci
        with:
          cache-dependency-path: |
            requirements*.txt
            .github/workflows/company-os-workflow-e2e.yml

      - name: Install CI requirements
        uses: ./.github/actions/install-ci-requirements

      # The test is an HTTP client plus a subprocess launcher; the server needs uvicorn.
      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio httpx asyncpg bcrypt uvicorn

      - name: Run the Company OS workflow scenario
        working-directory: autobot-backend
        env:
          # PG_USER and PG_PASSWORD must match the postgres service container above.
          AUTOBOT_COMPANY_OS_E2E_PG_HOST: 127.0.0.1
          AUTOBOT_COMPANY_OS_E2E_PG_PORT: 5432
          AUTOBOT_COMPANY_OS_E2E_PG_USER: e2e
          AUTOBOT_COMPANY_OS_E2E_PG_PASSWORD: e2e  # pragma: allowlist secret
          AUTOBOT_COMPANY_OS_E2E_REDIS_HOST: 127.0.0.1
          AUTOBOT_COMPANY_OS_E2E_REDIS_PORT: 6379
          AUTOBOT_COMPANY_OS_E2E_ARTIFACT_DIR: ${{ runner.temp }}/company-os-e2e-logs
        run: |
          export PYTHONPATH="$PWD/..:$PWD:${PYTHONPATH:-}"
          python -m pytest tests/company_os_e2e -v -rA -p no:cacheprovider \
            -c ../pytest.ini --rootdir=..

      - name: Upload server and stub logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: company-os-workflow-e2e-logs
          path: ${{ runner.temp }}/company-os-e2e-logs
          if-no-files-found: ignore
          retention-days: 7
