# GitHub Actions workflow — backend startup-import smoke test (#6789 / #6540)
#
# Catches the recurring #6042 migration-regression family at PR time:
#   #6536 BaseModel orphan imports, #6569 Metadata orphan, #6604 duplicate-class
#   collisions, #6609 required-field-no-default, #6613 stale singleton attr.
#
# Fails the PR if any new backend module loses the ability to fresh-import.
# Known-broken modules tracked in KNOWN_BROKEN_AT_TEST_INTRODUCTION inside
# tests/test_startup_imports.py with issue refs.

name: Backend Startup Import Smoke

on:
  # #14054: the merge queue builds each entrant against base + the entries
  # ahead of it and expects the required contexts to report against that
  # temporary ref. A required context with no `merge_group:` trigger never
  # fires, and the queue waits on it forever. Inert until the `merge_queue`
  # ruleset rule is enabled -- this event does not exist before then.
  merge_group:
  push:
    branches: [main, Dev_new_gui, develop]
    #
    # #12986: the backend-Python entries are the canonical `backend-python` set
    # from .github/filters/backend-python-paths.yml; GitHub cannot include a file here, so
    # pipeline-scripts/check_workflow_path_filters.py enforces the match.
    paths:
      - 'autobot-backend/**/*.py'
      - 'autobot-slm-backend/**/*.py'
      - 'autobot_shared/**/*.py'
      - '.github/filters/backend-python-paths.yml'
      - '**/requirements*.txt'
      - 'requirements-ci/**'
      - '.github/workflows/startup-import-smoke.yml'
      - '.github/workflows/backend-required-context.yml'
  # NOTE: no pull_request.paths filter — this workflow ALWAYS runs on PRs so its
  # required-check context ("startup-import-smoke") always reports a conclusion.
  # A path-filtered required check that never triggers leaves the PR deadlocked
  # on "Expected — Waiting for status". The real work is gated on the `changes`
  # job below.
  #
  # That gating job SKIPS when no backend paths are touched — it does NOT report
  # success, which is what this comment used to claim. A skipped job publishes a
  # check run whose conclusion is `skipped`, and branch protection does not accept
  # that for a required context, so a pull request touching no backend Python sat
  # blocked on a context nothing could turn green. The green in that case comes
  # from the complement shim in backend-required-context.yml, exactly as
  # python-required-context.yml serves `python-suite` (#14353).
  # Branch-protection promotion to required happened separately (#10022).
  pull_request:
    branches: [main, Dev_new_gui, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          # #14054: dorny/paths-filter errors on an event it does not
          # recognise unless `base` is given, and a failed `changes` job
          # skips every job that needs it -- i.e. the required context
          # never reports and the queue deadlocks. Empty on push/PR, so
          # their existing behaviour is unchanged.
          base: ${{ github.event.merge_group.base_sha || '' }}
          # #12986: `backend` is defined in the canonical filter file.
          filters: .github/filters/backend-python-paths.yml

  startup-import-smoke:
    needs: changes
    if: github.event_name == 'merge_group' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: ./.github/actions/setup-python-ci
        with:
          cache-dependency-path: |
            requirements*.txt
            autobot-backend/requirements*.txt

      - name: Install backend dependencies
        # #6947: pipefail required so pip install failures surface (was masked by `| tail -5`).
        # #7018: switched from `autobot-backend/requirements.txt` to `requirements-ci.txt`
        # because the former pulls torch>=2.11.0 + transitive vllm 0.19.x (requires torch==2.10.0),
        # an unsatisfiable resolver state. `requirements-ci.txt` is purpose-built to exclude
        # vllm and other GPU-dependent packages — see `security.yml` which has used it for years.
        # autobot_shared is installed separately (editable, from repo root, no CWD trickery).
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install pytest >/dev/null
          python -m pip install -r requirements-ci.txt --prefer-binary
          python -m pip install -e autobot_shared

      - name: Run startup-import smoke test
        run: |
          python -m pytest autobot-backend/tests/test_startup_imports.py -q --tb=line || {
            echo ""
            echo "Backend startup-import smoke test FAILED."
            echo ""
            echo "If known-broken, add to KNOWN_BROKEN_AT_TEST_INTRODUCTION in"
            echo "autobot-backend/tests/test_startup_imports.py with issue ref."
            exit 1
          }

      # #14035: this is the only CI job that runs `pip install -e autobot_shared`
      # (the sharded python-suite job relies on pytest.ini's `pythonpath =`
      # instead), so it is the only place a broken editable-install mapping can
      # actually be caught. The guard skips itself everywhere else.
      - name: Run editable-install packaging guard
        run: |
          python -m pytest autobot_shared/editable_install_layout_test.py -v --tb=short || {
            echo ""
            echo "autobot_shared editable-install packaging guard FAILED (#14035)."
            echo ""
            echo "The editable finder is registering autobot_shared's submodules"
            echo "as top-level names instead of (or in addition to) autobot_shared"
            echo "itself. Check autobot_shared/pyproject.toml's"
            echo "[tool.setuptools]/[tool.setuptools.packages.find] config."
            exit 1
          }

      # #13041: this guard has stdlib-only deps (ast/pathlib — no imports of
      # backend modules) and was never collected by any CI workflow, letting
      # the raw-ClientSession ceiling silently regress 12->13 unnoticed. This
      # job already runs pytest against autobot-backend/tests/ with the full
      # backend dependency set and is a required check, so it is the natural
      # (smallest-blast-radius) place to add it rather than expanding #10691's
      # broader "enable all backend tests in CI" scope.
      - name: Run raw ClientSession ceiling guard
        run: |
          python -m pytest autobot-backend/tests/test_raw_client_session_ceiling_12992.py -v --tb=short || {
            echo ""
            echo "Raw aiohttp.ClientSession(...) ceiling guard FAILED (#12992/#13041)."
            echo ""
            echo "A new raw ClientSession site was added without routing it through"
            echo "autobot_shared.http_client.get_http_client(), or without documenting"
            echo "it as an intentional carve-out in the test's module docstring."
            exit 1
          }
