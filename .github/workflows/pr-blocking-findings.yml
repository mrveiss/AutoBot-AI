# Merge-blocking findings gate (#10024)
#
# Closes the review-to-merge race: a reviewer who files an issue describing a
# problem in an open PR (e.g. a security finding) can label that issue
# `blocks-merge`, and this required check goes red until the issue is
# resolved/closed or the label is removed. Prevents a caught-in-review finding
# from being merged anyway (the #9968 / PR #9955 timeline).
#
# An issue "references" a PR by mentioning `#<pr-number>` (or `/pull/<n>`) in
# its body. To make this enforce the merge button, add it as a required status
# check on main/release (repo owner; not code).

name: PR Blocking Findings

on:
  # #14054: the merge queue builds each entrant against base + the entries
  # ahead of it and expects the required contexts to report against that
  # temporary ref. A required context with no `merge_group:` trigger never
  # fires, and the queue waits on it forever. Inert until the `merge_queue`
  # ruleset rule is enabled -- this event does not exist before then.
  merge_group:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, release]
  # #21577: run on a pull request head the branch sync left on a `[skip ci]` merge:
  #   gh workflow run pr-blocking-findings.yml --ref <pull request branch>
  workflow_dispatch:

# #14434: without this, every push left its predecessors queued. 42 of a 271-run
# sample were for commits no longer at their branch tip - work nothing would ever
# read, each still fetching its actions. During GitHub's 2026-08-17 archive-download
# degradation that wasted load became failures on unrelated pull requests (#14444).
#
# cancel-in-progress is guarded on the event rather than set to a bare `true`:
# #13432 found that cancelling base-branch runs meant each merge cancelled the
# previous merge's verification, and merges arrive faster than a suite completes -
# of 39 completed base runs, 26 were cancelled and NONE succeeded. Six of the
# workflows this was applied to also trigger on push to main, so the guard
# is load-bearing there and harmless where it is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read  # #21577: the dispatch resolver is fetched with a sparse checkout
  issues: read
  pull-requests: read

jobs:
  blocking-findings:
    name: No open blocks-merge issues reference this PR
    runs-on: ubuntu-latest
    steps:
      # #21577: a dispatch carries no pull_request payload; the resolver turns the dispatched branch
      # into the facts read below, or refuses it (the same rules as ci.yml's `changes` job).
      - name: Fetch the dispatch resolver
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          sparse-checkout: pipeline-scripts/dispatched_pr.py
          sparse-checkout-cone-mode: false
          path: dispatch-resolver
          persist-credentials: false

      - name: Resolve the pull request this dispatch stands for
        id: pr
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 dispatch-resolver/pipeline-scripts/dispatched_pr.py

      - name: Check blocks-merge issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || steps.pr.outputs.number }}
          # #14054: a merge_group event carries no pull_request object. The
          # queue ref does carry the number --
          #   refs/heads/gh-readonly-queue/<base>/pr-<N>-<sha>
          # -- so the entrant is still identifiable, and this gate keeps
          # asking the question it exists to ask rather than passing by
          # default on the one event where merging actually happens.
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ] && [ -n "${MERGE_GROUP_REF:-}" ]; then
            PR_NUMBER=$(printf '%s' "$MERGE_GROUP_REF" |
              sed -n 's|.*/pr-\([0-9][0-9]*\)-[0-9a-f]*$|\1|p')
            echo "merge_group entrant resolved to PR #${PR_NUMBER:-<none>}"
          fi
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::could not resolve a PR number from event"
            echo "::error::ref='${MERGE_GROUP_REF:-}' -- refusing to report"
            echo "::error::this gate green without having run it (#14054)."
            exit 1
          fi

          # Candidate open issues labeled blocks-merge that mention this PR
          # number somewhere. A missing label / no matches yields an empty list
          # (fail-safe: the gate stays green).
          mapfile -t candidates < <(gh issue list --repo "$REPO" --state open \
            --label "blocks-merge" --search "$PR_NUMBER in:body" \
            --json number --jq '.[].number' 2>/dev/null || true)

          blocking=()
          for n in "${candidates[@]:-}"; do
            [ -z "$n" ] && continue
            body=$(gh issue view "$n" --repo "$REPO" --json body --jq '.body' 2>/dev/null || echo "")
            # Require an EXACT reference (#NNNN / pull/NNNN), word-bounded so
            # #1234 does not match #12340.
            if printf '%s' "$body" | grep -qE "(#${PR_NUMBER}([^0-9]|$)|/pull/${PR_NUMBER}([^0-9]|$))"; then
              blocking+=("$n")
            fi
          done

          if [ "${#blocking[@]}" -gt 0 ]; then
            echo "::error::Merge blocked by open \`blocks-merge\` issue(s): ${blocking[*]}"
            echo "Resolve/close the issue(s) or remove the blocks-merge label, then re-run this check."
            exit 1
          fi
          echo "No open blocks-merge issues reference PR #${PR_NUMBER}. OK to merge."
