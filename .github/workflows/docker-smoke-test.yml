name: Docker Smoke Test

on:
  # #14054: the merge queue builds each entrant against base + the entries
  # ahead of it and expects the required contexts to report against that
  # temporary ref. A required context with no `merge_group:` trigger never
  # fires, and the queue waits on it forever. Inert until the `merge_queue`
  # ruleset rule is enabled -- this event does not exist before then.
  merge_group:
  push:
    branches:
      - Dev_new_gui
  pull_request:
    branches:
      - Dev_new_gui
    # Required status check via branch protection (#6723) — must run on PR
  schedule:
    - cron: '0 10 * * 0'  # Every Sunday at 10 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege (#15299). The workflow only checks out, builds images, starts
# the compose stack and uploads an artifact — none of which needs write. It had
# no block at all until CodeQL flagged both jobs once this file was touched;
# hardened-smoke-test.yml and co-located-smoke.yml already declare exactly this.
permissions:
  contents: read

jobs:
  # Gated because the build is the whole cost: on PR #15250 (one markdown file)
  # `smoke-test` spent 373s building images and 65s starting the stack for a
  # change that cannot reach an image (#15299). Unlike the pre-commit sweep this
  # cannot be scoped to changed files — an image either gets built or it does
  # not — so the required context moves to a shim on the exact complement, the
  # pattern #14353 established for `python-suite`.
  changes:
    name: Detect changed paths (docker smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      # Pull requests only: on `push` the base is the previous commit and on
      # `schedule` there is no diff at all, so the filter would be meaningless.
      # Both of those events keep running the smoke test unconditionally below.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/filters/docker-paths.yml

  smoke-test:
    needs: changes
    # Fail-closed on pull requests: if `changes` errors, `needs` skips this job
    # rather than reporting green, and the shim's complement leaves the context
    # unreported — which blocks the pull request, the safe direction.
    if: github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          min-free-gb: '15'  # Increased from 10GB due to MVA-2869

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Ensure cache directory exists
        run: mkdir -p /tmp/.buildx-cache

      - name: Build images with layer cache
        run: |
          echo "=== Building backend image ==="
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to   type=local,dest=/tmp/.buildx-cache-new,mode=min \
            --file docker/backend/Dockerfile \
            --tag autobot/backend:latest \
            --load \
            .
          echo "Backend build complete. Disk space:"
          df -h / | grep -v Filesystem

          echo ""
          echo "=== Building SLM image ==="
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to   type=local,dest=/tmp/.buildx-cache-new,mode=min \
            --file docker/slm/Dockerfile \
            --tag autobot/slm:latest \
            --load \
            .
          echo "SLM build complete. Disk space:"
          df -h / | grep -v Filesystem

          echo ""
          echo "=== Building frontend image ==="
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to   type=local,dest=/tmp/.buildx-cache-new,mode=min \
            --file docker/frontend/Dockerfile \
            --tag autobot/frontend:latest \
            --load \
            .
          echo "Frontend build complete. Disk space:"
          df -h / | grep -v Filesystem

          echo ""
          echo "=== Rotating cache ==="
          # Rotate cache so next run gets the freshest layers (mode=min keeps only
          # final exported layers; mode=max kept all intermediate layers and exhausted disk)
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

          echo "Final disk space:"
          df -h

      - name: Start services with Docker Compose
        # GH#9905: no manual secret step — the stack auto-provisions unique
        # signing secrets via the autobot-secrets-init service + shared volume.
        # Starting with NO secret in env IS the real out-of-the-box test: if the
        # auto-gen/loader path regresses, services won't reach healthy below.
        run: docker compose --env-file docker/.env.docker up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          max_attempts=90
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: Checking service health..."

            # Frontend (nginx), backend, and SLM must all be healthy
            frontend_ok=false
            backend_ok=false
            slm_ok=false

            curl -s -f http://localhost > /dev/null 2>&1 && frontend_ok=true
            curl -s -f http://localhost/api/system/health > /dev/null 2>&1 && backend_ok=true
            curl -s -f http://localhost/slm/api/health > /dev/null 2>&1 && slm_ok=true

            if $frontend_ok && $backend_ok && $slm_ok; then
              echo "✓ Frontend responding on port 80"
              echo "✓ Backend health check passed"
              echo "✓ SLM health check passed"
              exit 0
            fi

            $frontend_ok || echo "  waiting: frontend not yet responding"
            $backend_ok  || echo "  waiting: backend not yet responding"
            $slm_ok      || echo "  waiting: SLM not yet responding"

            sleep 10
          done

          echo "Services failed to become healthy within 15 minutes (900s)"
          echo ""
          echo "=== Docker Compose Logs ==="
          docker compose --env-file docker/.env.docker logs
          exit 1

      - name: Verify services are running
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying services..."
          docker compose --env-file docker/.env.docker ps

          # #7066: || true to swallow SIGPIPE from curl when head exits early.
          # These pipelines are informational only — the actual smoke gate is
          # the docker-compose healthchecks above. With set -o pipefail (added
          # by #7019), curl receives SIGPIPE → exit 23 → step fails.
          echo ""
          echo "=== Frontend Health Check ==="
          curl -v http://localhost 2>&1 | head -20 || true

          echo ""
          echo "=== Backend Health Check ==="
          curl -v http://localhost/api/system/health 2>&1 | head -20 || true

          echo ""
          echo "=== SLM Health Check ==="
          curl -v http://localhost/slm/api/health 2>&1 | head -20 || true

      - name: Collect logs on failure
        if: failure()
        run: |
          # Print inline (diagnosable without downloading the artifact) AND keep the
          # artifact. Grouped so it collapses in the UI. (#10706)
          echo "::group::docker compose logs (backend / slm / frontend)"
          docker compose --env-file docker/.env.docker logs --no-color | tee failure-logs.txt
          echo "::endgroup::"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs
          path: failure-logs.txt

      - name: Clean up
        if: always()
        run: docker compose --env-file docker/.env.docker down
