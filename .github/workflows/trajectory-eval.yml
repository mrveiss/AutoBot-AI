#
# Trajectory-level eval & regression harness (GH#10546)
# Replays the golden trajectory set (eval/golden/) against the current
# candidate and emits a per-task-class pass/regress report.
#
# NON-BLOCKING signal (continue-on-error): this does NOT gate merges yet —
# mirroring how other advisory checks (api-wiring pre-#9864) were introduced.
#
# It does not report drift yet either, and the header used to say it did.
# Without recorded runs to replay against, eval.run falls through to the
# self-consistency baseline, which answers with each golden's own expectations;
# every comparison is then a file against itself and nothing can turn it red
# (#16157). --require-real-candidate makes that state visible as UNMEASURED
# rather than as a pass.
#
# Promotion to a gate needs three things, not one: recorded runs so the
# comparison has two sides (#16157), trigger paths that include the behaviour
# being asserted rather than only this harness (#16158), and a corpus
# proportioned to a measured backlog (#16159). Only then does dropping
# continue-on-error and passing --fail-on-regression mean anything (#16115).

name: Trajectory Eval (non-blocking)

on:
  push:
    branches: [ main, Dev_new_gui ]
    paths: &paths
      - 'autobot-backend/eval/**'
      - 'autobot-backend/rlm/**'
      - 'autobot-backend/llc/**/replay*'
      - '.github/workflows/trajectory-eval.yml'
  pull_request:
    branches: [ main, Dev_new_gui ]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  trajectory-eval:
    runs-on: ubuntu-latest
    # NON-BLOCKING: report drift without gating the merge (GH#10546).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            autobot-backend/requirements*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # #11062: drop `|| true` so a genuine install crash surfaces (red step);
          # the step's continue-on-error keeps the eval non-blocking regardless.
          python -m pip install -r requirements-ci.txt --prefer-binary
          python -m pip install pytest pytest-asyncio --prefer-binary

      - name: Run harness unit tests
        working-directory: autobot-backend
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/autobot-backend
        run: python -m pytest eval/tests -q

      - name: Replay golden trajectories (non-blocking report)
        working-directory: autobot-backend
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/autobot-backend
        run: |
          # #11062: keep pipefail but drop `|| true` so a harness crash surfaces
          # as a red step; continue-on-error on the step keeps it non-blocking.
          set -o pipefail
          # --require-real-candidate: refuse to report a pass when the replay fell
          # through to the self-consistency baseline, which answers with each
          # golden's own expectations and therefore cannot go red (#16157). Until
          # recordings exist this step is UNMEASURED rather than green -- a true
          # red that says nothing was compared, instead of a green that reads as
          # drift detection. continue-on-error keeps it non-blocking either way.
          python -m eval.run --require-real-candidate --json trajectory-eval-report.json \
            | tee trajectory-eval-report.md

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trajectory-eval-report
          path: |
            autobot-backend/trajectory-eval-report.json
            autobot-backend/trajectory-eval-report.md
          if-no-files-found: ignore
