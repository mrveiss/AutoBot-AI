# PR Template Compliance Check
#
# Validates that required sections in the PR template are filled in.
# Fails if any required section contains only the placeholder comment or is empty.
# See: https://github.com/mrveiss/AutoBot-AI/issues/6474

name: PR Template Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, release]

# #14434: without this, every push left its predecessors queued. 42 of a 271-run
# sample were for commits no longer at their branch tip - work nothing would ever
# read, each still fetching its actions. During GitHub's 2026-08-17 archive-download
# degradation that wasted load became failures on unrelated pull requests (#14444).
#
# cancel-in-progress is guarded on the event rather than set to a bare `true`:
# #13432 found that cancelling base-branch runs meant each merge cancelled the
# previous merge's verification, and merges arrive faster than a suite completes -
# of 39 completed base runs, 26 were cancelled and NONE succeeded. Six of the
# workflows this was applied to also trigger on push to main, so the guard
# is load-bearing there and harmless where it is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-template:
    name: Validate PR template sections
    # #12796: bots (Dependabot et al.) write their own fixed PR body and can
    # never fill this human template, so the job failed 100% of the time on
    # their PRs. That permanent red buried the REAL failures on bot PRs — e.g.
    # a broken frontend dep bump whose genuine smoke-test/vue-tsc reds sat in
    # the same list as this known-meaningless one. Skip (not pass) so the gate
    # stays honest for human PRs; it is not in the required-checks set, so
    # skipping changes nothing about what can merge.
    #
    # #14153: same reasoning applies to fork PRs. The template IS published
    # (.github/PULL_REQUEST_TEMPLATE.md, linked from CONTRIBUTING.md), but a
    # drive-by external contributor can still open a PR without ever seeing
    # GitHub's web compose UI populate it (e.g. a PR opened through the API).
    # Penalizing them for a convention the tooling didn't show them inverts
    # the point of the check, so fork PRs skip it the same way bot PRs do.
    if: >
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
    # #16793: the check moved into scripts/check_pr_template_sections.py, which
    # has unit tests, so the two failure states cannot silently collapse back
    # into one message. That needs the repo on disk; the inline awk did not.
    - uses: actions/checkout@v7

    - name: Check required sections
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        # Fetch PR body via CLI (avoids direct expression injection).
        #
        # #13929: this used to end in `2>/dev/null || echo ""`, which turned a
        # failed fetch into an *empty body* — and an empty body extracts to empty
        # sections, so the job reported the author's mistake instead of its own.
        # Observed on a PR whose body was complete: three sections reported empty,
        # a re-run with no change passed. The `opened` trigger races PR creation,
        # so a transient miss is expected and must not read as a violation.
        PR_BODY=""
        for attempt in 1 2 3; do
          if PR_BODY=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '.body'); then
            break
          fi
          echo "::notice::PR body fetch attempt ${attempt} failed; retrying"
          PR_BODY=""
          sleep 5
        done

        if [ -z "${PR_BODY//[[:space:]]/}" ]; then
          # Two distinct causes, neither of which is "the sections are empty":
          # the fetch never succeeded, or the author opened a PR with no body.
          echo "::error::PR body is empty or could not be read after 3 attempts."
          echo "If the description is filled in, this is a fetch failure (#13929) — re-run the job."
          exit 1
        fi

        # #16793: this used to be an inline awk extraction whose empty result
        # meant EITHER "the heading is missing" OR "the heading is there and has
        # nothing under it", and it reported both as empty. An author who opened
        # the PR with `gh pr create --body` -- which never loads the template --
        # then read "empty" on a body that was entirely filled in. Seen on
        # #16778, #16790 and #16791 in one afternoon. The two states now have
        # their own messages and their own tests.
        PR_BODY="$PR_BODY" python3 scripts/check_pr_template_sections.py
