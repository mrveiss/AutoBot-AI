#
# GitHub Actions workflow for SSOT configuration compliance
# Issue: #642 - Centralize Environment Variables with SSOT Config Validation
#
# Runs hardcoded value detection with SSOT validation on PRs
# Reports compliance percentage and highlights violations
# Every VIOLATION-severity finding is blocking — both the `ssot` class and the
# `other` class — and the verdict is the detector's own `status` field, not a
# count re-interpreted here (Issue #2874, #14914).

name: SSOT Coverage

on:
  push:
    branches: [ release, main ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request this run is for (set by ci.yml's fan-out; empty on a manual run)
        required: false
        default: ''
        type: string
      head_sha:
        description: Head commit the coordinator read; the run cancels itself when the branch tip differs
        required: false
        default: ''
        type: string
      base_sha:
        description: Merge base of the head with the pull request's base branch
        required: false
        default: ''
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || github.ref }}
  cancel-in-progress: ${{ inputs.pr_number != '' }}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # #20825: a dispatched run validates its pins and ends CANCELLED when its head is stale. Parallel to the work on
  # purpose: this workflow is advisory, and ci.yml's fan-out only passes values its own `changes` job validated.
  pr-context:
    name: pr-context
    if: ${{ inputs.pr_number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/pr-context
        with:
          pr-number: ${{ inputs.pr_number }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

  ssot-coverage:
    # Held (dependabot / release promotion), draft and un-admitted pull requests never reach this job: ci.yml's `fan-out` dispatches only what its `changes` job marked ready (#20825).
    name: SSOT Configuration Compliance
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # fetch-depth: 2, not the actions/checkout default of 1. On a
        # pull_request the checkout is the MERGE commit, and the baseline
        # no-growth guard below has to diff this branch's baseline against the
        # base's. Depth 2 supplies both parents, so scripts/lib/git-scope.sh
        # resolves HEAD^1 without any event payload. At depth 1 it resolves
        # nothing and the guard fails CLOSED — correct, but it would red every
        # run rather than actually comparing.
        fetch-depth: 2

    - name: Run SSOT-aware hardcoded value detection
      id: ssot_check
      shell: bash
      run: |
        set -euo pipefail
        # No chmod: the script is tracked 100755 (#14371). `core.fileMode=false`
        # in this repository means a chmod never reaches the index, so a script
        # that needed one here was a script that did not work on a fresh clone.
        # Run with JSON output for parsing
        set +e  # Don't exit on error
        JSON_OUTPUT=$(./pipeline-scripts/detect-hardcoded-values.sh --json 2>/dev/null)
        EXIT_CODE=$?
        set -e

        # Parse JSON output
        TOTAL_VIOLATIONS=$(echo "$JSON_OUTPUT" | grep -o '"total_violations": [0-9]*' | grep -o '[0-9]*' || echo "0")
        SSOT_VIOLATIONS=$(echo "$JSON_OUTPUT" | grep -o '"ssot_violations": [0-9]*' | grep -o '[0-9]*' || echo "0")
        OTHER_VIOLATIONS=$(echo "$JSON_OUTPUT" | grep -o '"other_violations": [0-9]*' | grep -o '[0-9]*' || echo "0")
        STATUS=$(echo "$JSON_OUTPUT" | grep -o '"status": "[^"]*"' | grep -o '"[^"]*"$' | tr -d '"' || echo "unknown")

        # Set outputs for subsequent steps
        {
          echo "total_violations=$TOTAL_VIOLATIONS"
          echo "ssot_violations=$SSOT_VIOLATIONS"
          echo "other_violations=$OTHER_VIOLATIONS"
          echo "status=$STATUS"
          echo "exit_code=$EXIT_CODE"
        } >> "$GITHUB_OUTPUT"

        # Output summary
        echo "::group::SSOT Coverage Summary"
        echo "Total violations: $TOTAL_VIOLATIONS"
        echo "SSOT violations (have config equivalent): $SSOT_VIOLATIONS"
        echo "Other violations: $OTHER_VIOLATIONS"
        echo "Status: $STATUS"
        echo "::endgroup::"

    - name: Generate detailed report
      if: steps.ssot_check.outputs.total_violations != '0'
      run: |
        echo "::group::Detailed SSOT Compliance Report"
        ./pipeline-scripts/detect-hardcoded-values.sh --report 2>/dev/null || true
        echo "::endgroup::"

    - name: Audit the hardcoded-value baseline for stranded entries (#14371)
      shell: bash
      run: |
        set -euo pipefail
        # BLOCKING. pipeline-scripts/hardcoded_values_baseline.txt only ever
        # shrinks: a fixed violation must take its baseline line with it. An
        # entry naming a path that has moved exempts nothing, silently, and
        # re-permits the value the moment the path comes back.
        ./pipeline-scripts/detect-hardcoded-values.sh --audit-baseline

    - name: Fail if the hardcoded-value baseline GREW (#14371)
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        # BLOCKING, and the other half of the audit above. That one checks the
        # baseline references nothing stale; this one checks it has not quietly
        # acquired anything. Without it the whole gate is bypassed in one line:
        # hardcode a value and append its key to the baseline in the same
        # change, and the detector's correct finding is suppressed under a
        # green check. The invariant was written in a comment and asserted
        # nowhere.
        ./pipeline-scripts/check_baseline_no_growth.sh

    - name: Build the SSOT status comment
      # #14153: this is a nicety on top of the analysis above, not the
      # analysis itself. On a fork PR, GITHUB_TOKEN is read-only — the
      # comment call fails with 403, and without continue-on-error that
      # step failure marks the whole job "fail" even when the analysis
      # found zero violations. `Set job status` below is what should decide
      # pass/fail, based on the actual violation count, not on whether a
      # comment could be posted.
      if: inputs.pr_number != ''
      continue-on-error: true
      uses: actions/github-script@v9
      with:
        script: |
          const totalViolations = '${{ steps.ssot_check.outputs.total_violations }}';
          const ssotViolations = '${{ steps.ssot_check.outputs.ssot_violations }}';
          const otherViolations = '${{ steps.ssot_check.outputs.other_violations }}';
          const status = '${{ steps.ssot_check.outputs.status }}';

          let emoji = status === 'pass' ? '✅' : '⚠️';
          let statusText = status === 'pass' ? 'Passing' : 'Violations Found';

          let body = `## ${emoji} SSOT Configuration Compliance: ${statusText}\n\n`;

          if (status === 'pass') {
            // #14914: state precisely what green means. It used to say "no
            // hardcoded values that have SSOT config equivalents", which was
            // true of the `ssot` class only — the other eight rule classes were
            // reported in this very comment and blocked nothing.
            body += '🎉 No new hardcoded values of either class — `ssot` and `other` both block.\n\n';
            body += '_Known backlog in `pipeline-scripts/hardcoded_values_baseline.txt` is suppressed and tracked in #14371._\n\n';
          } else {
            body += `| Metric | Count |\n`;
            body += `|--------|-------|\n`;
            body += `| **Total Violations** | ${totalViolations} |\n`;
            body += `| SSOT Violations (high priority) | ${ssotViolations} |\n`;
            body += `| Other Violations | ${otherViolations} |\n\n`;

            if (parseInt(ssotViolations) > 0) {
              body += `### ⚠️ ${ssotViolations} values have SSOT config equivalents!\n\n`;
              body += `These should be replaced with SSOT config imports:\n\n`;
              body += `**Python:**\n`;
              body += '```python\n';
              body += 'from src.config.ssot_config import config\n';
              body += '# Use: config.vm.main, config.port.backend, config.backend_url\n';
              body += '```\n\n';
              body += `**TypeScript:**\n`;
              body += '```typescript\n';
              body += "import config from '@/config/ssot-config'\n";
              body += '// Use: config.vm.main, config.port.backend, config.backendUrl\n';
              body += '```\n\n';
            }

            body += `📖 See [SSOT_CONFIG_GUIDE.md](docs/developer/SSOT_CONFIG_GUIDE.md) for documentation.\n`;
          }

          require('fs').writeFileSync(process.env.RUNNER_TEMP + '/ssot-comment.md', body, 'utf8');

    - name: Post or update the SSOT status comment
      # #12984: the one shared upsert. It reads every page of comments, so a PR
      # with more than 30 comments no longer collects a new report per run.
      # Same fork-hostile caveat as the step above: continue-on-error.
      if: inputs.pr_number != ''
      continue-on-error: true
      uses: ./.github/actions/upsert-pr-comment
      with:
        marker: '<!-- ssot-coverage -->'
        number: ${{ inputs.pr_number }}
        body-file: ${{ runner.temp }}/ssot-comment.md

    - name: Set job status
      shell: bash
      run: |
        set -euo pipefail
        # #14914: this used to re-derive the verdict here, from
        # `ssot_violations` alone, in a second copy of a policy the detector
        # already owns. Two consequences, both live on the merged base:
        #
        #   * the eight `other`-class rules blocked nothing, so nine hardcoded
        #     /opt/autobot paths sat on main under a green check;
        #   * the parse above falls back to "0" when the JSON is missing, so a
        #     detector that died (a missing scan directory is FATAL by design)
        #     reported clean. An absent result read as a clean result.
        #
        # Now there is one verdict, computed once, in
        # pipeline-scripts/detect-hardcoded-values.sh, and this step only
        # enforces it. `status` has no numeric fallback: an unparseable JSON
        # yields "unknown", which is not "pass", which fails.
        STATUS="${{ steps.ssot_check.outputs.status }}"
        EXIT_CODE="${{ steps.ssot_check.outputs.exit_code }}"
        TOTAL_VIOLATIONS="${{ steps.ssot_check.outputs.total_violations }}"
        SSOT_VIOLATIONS="${{ steps.ssot_check.outputs.ssot_violations }}"
        OTHER_VIOLATIONS="${{ steps.ssot_check.outputs.other_violations }}"

        if [ "$EXIT_CODE" != "0" ]; then
          echo "::error::detect-hardcoded-values.sh exited ${EXIT_CODE} — it reports no"
          echo "::error::verdict on a run it could not complete. Refusing to report clean."
          exit 1
        fi

        if [ "$STATUS" != "pass" ]; then
          echo "::error::SSOT compliance status '${STATUS}': ${TOTAL_VIOLATIONS} new hardcoded value(s)"
          echo "::error::(ssot=${SSOT_VIOLATIONS}, other=${OTHER_VIOLATIONS}). Both classes block (#14914)."
          echo "::error::Run './pipeline-scripts/detect-hardcoded-values.sh --report' locally for details"
          exit 1
        fi

        echo "SSOT compliance: pass — 0 new violations of either class"
