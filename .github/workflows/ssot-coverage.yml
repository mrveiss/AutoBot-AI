#
# GitHub Actions workflow for SSOT configuration compliance
# Issue: #642 - Centralize Environment Variables with SSOT Config Validation
#
# Runs hardcoded value detection with SSOT validation on PRs
# Reports compliance percentage and highlights violations
# SSOT violations are blocking — merges require compliance (Issue #2874)

name: SSOT Coverage

on:
  push:
    branches: [ main, Dev_new_gui, develop ]
  pull_request:
    branches: [ main, Dev_new_gui, develop ]
    # #13388: SAFE — "SSOT Configuration Compliance" is not a required context.
    # pipeline-scripts/detect-hardcoded-values.sh scans with
    # `grep -rn --include="*.py" --include="*.ts" --include="*.vue" --include="*.sh"
    # --include="*.yml" --include="*.yaml"` and nothing else (#14316 added the last
    # three — shell scripts and Ansible YAML are where hardcoded accounts and
    # paths actually live), so a pull request touching none of those six
    # extensions cannot change the violation count this workflow reports. The
    # script itself and this file are included because either can change the
    # verdict.
    paths:
      - '**/*.py'
      - '**/*.ts'
      - '**/*.vue'
      - '**/*.sh'
      - '**/*.yml'
      - '**/*.yaml'
      - 'pipeline-scripts/detect-hardcoded-values.sh'
      # #14371: the rules moved into a shared library and the known backlog into
      # a baseline. Either one changes the verdict this workflow reports, so
      # either one must trigger it — an entry-point-only filter would let a rule
      # change land without the check that judges it ever running.
      - 'scripts/lib/hardcoded-value-rules.sh'
      - 'pipeline-scripts/hardcoded_values_baseline.txt'
      - '.github/workflows/ssot-coverage.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ssot-coverage:
    name: SSOT Configuration Compliance
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # fetch-depth: 2, not the actions/checkout default of 1. On a
        # pull_request the checkout is the MERGE commit, and the baseline
        # no-growth guard below has to diff this branch's baseline against the
        # base's. Depth 2 supplies both parents, so scripts/lib/git-scope.sh
        # resolves HEAD^1 without any event payload. At depth 1 it resolves
        # nothing and the guard fails CLOSED — correct, but it would red every
        # run rather than actually comparing.
        fetch-depth: 2

    - name: Run SSOT-aware hardcoded value detection
      id: ssot_check
      shell: bash
      run: |
        set -euo pipefail
        # No chmod: the script is tracked 100755 (#14371). `core.fileMode=false`
        # in this repository means a chmod never reaches the index, so a script
        # that needed one here was a script that did not work on a fresh clone.
        # Run with JSON output for parsing
        set +e  # Don't exit on error
        JSON_OUTPUT=$(./pipeline-scripts/detect-hardcoded-values.sh --json 2>/dev/null)
        EXIT_CODE=$?
        set -e

        # Parse JSON output
        TOTAL_VIOLATIONS=$(echo "$JSON_OUTPUT" | grep -o '"total_violations": [0-9]*' | grep -o '[0-9]*' || echo "0")
        SSOT_VIOLATIONS=$(echo "$JSON_OUTPUT" | grep -o '"ssot_violations": [0-9]*' | grep -o '[0-9]*' || echo "0")
        OTHER_VIOLATIONS=$(echo "$JSON_OUTPUT" | grep -o '"other_violations": [0-9]*' | grep -o '[0-9]*' || echo "0")
        STATUS=$(echo "$JSON_OUTPUT" | grep -o '"status": "[^"]*"' | grep -o '"[^"]*"$' | tr -d '"' || echo "unknown")

        # Set outputs for subsequent steps
        {
          echo "total_violations=$TOTAL_VIOLATIONS"
          echo "ssot_violations=$SSOT_VIOLATIONS"
          echo "other_violations=$OTHER_VIOLATIONS"
          echo "status=$STATUS"
          echo "exit_code=$EXIT_CODE"
        } >> "$GITHUB_OUTPUT"

        # Output summary
        echo "::group::SSOT Coverage Summary"
        echo "Total violations: $TOTAL_VIOLATIONS"
        echo "SSOT violations (have config equivalent): $SSOT_VIOLATIONS"
        echo "Other violations: $OTHER_VIOLATIONS"
        echo "Status: $STATUS"
        echo "::endgroup::"

    - name: Generate detailed report
      if: steps.ssot_check.outputs.total_violations != '0'
      run: |
        echo "::group::Detailed SSOT Compliance Report"
        ./pipeline-scripts/detect-hardcoded-values.sh --report 2>/dev/null || true
        echo "::endgroup::"

    - name: Audit the hardcoded-value baseline for stranded entries (#14371)
      shell: bash
      run: |
        set -euo pipefail
        # BLOCKING. pipeline-scripts/hardcoded_values_baseline.txt only ever
        # shrinks: a fixed violation must take its baseline line with it. An
        # entry naming a path that has moved exempts nothing, silently, and
        # re-permits the value the moment the path comes back.
        ./pipeline-scripts/detect-hardcoded-values.sh --audit-baseline

    - name: Fail if the hardcoded-value baseline GREW (#14371)
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        # BLOCKING, and the other half of the audit above. That one checks the
        # baseline references nothing stale; this one checks it has not quietly
        # acquired anything. Without it the whole gate is bypassed in one line:
        # hardcode a value and append its key to the baseline in the same
        # change, and the detector's correct finding is suppressed under a
        # green check. The invariant was written in a comment and asserted
        # nowhere.
        ./pipeline-scripts/check_baseline_no_growth.sh

    - name: Comment on PR with SSOT status
      # #14153: this is a nicety on top of the analysis above, not the
      # analysis itself. On a fork PR, GITHUB_TOKEN is read-only — the
      # comment call fails with 403, and without continue-on-error that
      # step failure marks the whole job "fail" even when the analysis
      # found zero violations. `Set job status` below is what should decide
      # pass/fail, based on the actual violation count, not on whether a
      # comment could be posted.
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v9
      with:
        script: |
          const totalViolations = '${{ steps.ssot_check.outputs.total_violations }}';
          const ssotViolations = '${{ steps.ssot_check.outputs.ssot_violations }}';
          const otherViolations = '${{ steps.ssot_check.outputs.other_violations }}';
          const status = '${{ steps.ssot_check.outputs.status }}';

          let emoji = status === 'pass' ? '✅' : '⚠️';
          let statusText = status === 'pass' ? 'Passing' : 'Violations Found';

          let body = `## ${emoji} SSOT Configuration Compliance: ${statusText}\n\n`;

          if (status === 'pass') {
            body += '🎉 No hardcoded values detected that have SSOT config equivalents!\n\n';
          } else {
            body += `| Metric | Count |\n`;
            body += `|--------|-------|\n`;
            body += `| **Total Violations** | ${totalViolations} |\n`;
            body += `| SSOT Violations (high priority) | ${ssotViolations} |\n`;
            body += `| Other Violations | ${otherViolations} |\n\n`;

            if (parseInt(ssotViolations) > 0) {
              body += `### ⚠️ ${ssotViolations} values have SSOT config equivalents!\n\n`;
              body += `These should be replaced with SSOT config imports:\n\n`;
              body += `**Python:**\n`;
              body += '```python\n';
              body += 'from src.config.ssot_config import config\n';
              body += '# Use: config.vm.main, config.port.backend, config.backend_url\n';
              body += '```\n\n';
              body += `**TypeScript:**\n`;
              body += '```typescript\n';
              body += "import config from '@/config/ssot-config'\n";
              body += '// Use: config.vm.main, config.port.backend, config.backendUrl\n';
              body += '```\n\n';
            }

            body += `📖 See [SSOT_CONFIG_GUIDE.md](docs/developer/SSOT_CONFIG_GUIDE.md) for documentation.\n`;
          }

          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const botComment = comments.find(comment =>
            comment.user.type === 'Bot' && comment.body.includes('SSOT Configuration Compliance')
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

    - name: Set job status
      run: |
        SSOT_VIOLATIONS="${{ steps.ssot_check.outputs.ssot_violations }}"

        # Fail the job if there are SSOT violations (Issue #2874)
        if [ "$SSOT_VIOLATIONS" -gt "0" ]; then
          echo "::error::Found $SSOT_VIOLATIONS hardcoded values that have SSOT config equivalents"
          echo "::error::Run './pipeline-scripts/detect-hardcoded-values.sh --report' locally for details"
          exit 1
        fi
