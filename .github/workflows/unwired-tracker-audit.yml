# Weekly audit: find production modules whose docstring cites a CLOSED tracker
# but have zero production callers. Each finding represents a feature whose
# tracker was closed prematurely (#6836 pattern).
#
# Runs Monday 06:00 UTC. Files up to 10 wire-in discovery issues per run,
# deduped against existing open audit issues. Manually triggerable via the
# Actions tab.

name: Unwired Tracker Audit

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      file_issues:
        description: "File discovery issues (false = dry-run / report only)"
        required: true
        type: boolean
        default: true
      max_issues:
        description: "Maximum issues to file in this run"
        required: true
        type: number
        default: 10

permissions:
  contents: read
  issues: write

concurrency:
  group: unwired-tracker-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            autobot-backend/requirements*.txt
            autobot-slm-backend/requirements*.txt

      - name: Install pytest
        run: pip install pytest

      - name: Test audit script (#6929)
        run: pytest pipeline-scripts/test_audit_unwired_trackers.py -v

      - name: Run audit (dry-run, JSON output)
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          python3 pipeline-scripts/audit_unwired_trackers.py --json > findings.json || true
          count=$(jq 'length' findings.json)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          jq -r '"\(.file)\t#\(.tracker)"' findings.json | head -50

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unwired-tracker-findings
          path: findings.json
          retention-days: 30

      - name: File discovery issues (capped)
        if: |
          (github.event_name == 'schedule' || github.event.inputs.file_issues == 'true')
          && steps.scan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_ISSUES: ${{ github.event.inputs.max_issues || '10' }}
        run: |
          python3 pipeline-scripts/audit_unwired_trackers.py \
            --file-issues --max-issues "$MAX_ISSUES"

      - name: Summary
        if: always()
        shell: bash
        env:
          FINDING_COUNT: ${{ steps.scan.outputs.count }}
        run: |
          set -euo pipefail
          {
            echo "### Unwired Tracker Audit"
            echo ""
            echo "Findings: ${FINDING_COUNT}"
            echo ""
            if [ "${FINDING_COUNT}" != "0" ] && [ -f findings.json ]; then
              echo '```'
              jq -r '"\(.file)  tracker=#\(.tracker)  callers=\(.production_callers)"' findings.json | head -50
              echo '```'
            fi
            echo ""
            echo "See [#6836](https://github.com/mrveiss/AutoBot-AI/issues/6836) for the systemic premature-closure pattern this guard prevents."
          } >> "$GITHUB_STEP_SUMMARY"
