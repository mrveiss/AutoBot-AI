#
# Company OS Contract Gate (GH#9861, renamed GH#19546)
# Blocking gate for the Company OS module. `llc` is its internal code name:
# packages, routes (/api/llc), symbols and LLC_* env vars keep it, while every
# name a person sees (workflow, job and step names) says Company OS.
#   1. Every /api/llc/* path the frontend calls must resolve to a real backend
#      route (authoritative OpenAPI audit, scoped to /api/llc).
#   2. The core Company OS loop e2e test must pass.
#
# Unlike the repo-wide api-wiring.yml (non-blocking, has tracked false
# positives elsewhere), this gate is scoped to Company OS and IS blocking — its
# surface was brought to zero unwired calls in #9861 and must stay there.

name: Company OS Contract Gate

on:
  push:
    branches: [ release, main ]
    paths: &paths
      - 'autobot-backend/llc/**'
      - 'autobot-backend/api/llc/**'
      - 'autobot-backend/models/agent_org.py'
      - 'autobot-frontend/src/views/llc/**'
      - 'autobot-frontend/src/composables/llc/**'
      - 'scripts/audit_api_wiring.py'
      - 'scripts/audit_api_wiring_args.py'
      - '.github/workflows/company-os-contract.yml'
      - '.github/actions/free-disk-space/**'
      - '.github/actions/install-ci-requirements/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request this run is for (set by ci.yml's fan-out; empty on a manual run)
        required: false
        default: ''
        type: string
      head_sha:
        description: Head commit the coordinator read; the run cancels itself when the branch tip differs
        required: false
        default: ''
        type: string
      base_sha:
        description: Merge base of the head with the pull request's base branch
        required: false
        default: ''
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || github.ref }}
  cancel-in-progress: ${{ inputs.pr_number != '' }}

permissions:
  contents: read

jobs:
  # #20825: a dispatched run validates its pins and ends CANCELLED when its head is stale. Parallel to the work on
  # purpose: this workflow is advisory, and ci.yml's fan-out only passes values its own `changes` job validated.
  pr-context:
    name: pr-context
    if: ${{ inputs.pr_number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/pr-context
        with:
          pr-number: ${{ inputs.pr_number }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

  company-os-wiring-audit:
    name: Company OS wiring audit
    # Held (dependabot / release promotion), draft and un-admitted pull requests never reach this job: ci.yml's `fan-out` dispatches only what its `changes` job marked ready (#20825).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            autobot-backend/requirements*.txt

      - name: Install CI requirements
        uses: ./.github/actions/install-ci-requirements

      - name: Audit /api/llc wiring (blocking)
        run: |
          set -o pipefail
          export PYTHONPATH="$PWD:$PWD/autobot-backend:${PYTHONPATH:-}"
          mkdir -p data logs static config
          # Absolute path: --dump-openapi chdir()s into autobot-backend/.
          python scripts/audit_api_wiring.py --dump-openapi "$PWD/openapi.json"
          python scripts/audit_api_wiring.py \
            --openapi "$PWD/openapi.json" \
            --only-prefix /api/llc \
            --fail-on-unwired

  company-os-e2e:
    name: Company OS end-to-end
    # Held (dependabot / release promotion), draft and un-admitted pull requests never reach this job: ci.yml's `fan-out` dispatches only what its `changes` job marked ready (#20825).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            autobot-backend/requirements*.txt

      - name: Install CI requirements
        uses: ./.github/actions/install-ci-requirements

      - name: Install backend dependencies
        run: |
          # Hermetic e2e essentials (no Postgres/Redis/network needed).
          python -m pip install aiosqlite pytest pytest-asyncio httpx --prefer-binary

      - name: Run Company OS core-loop + org-chart e2e tests (blocking)
        working-directory: autobot-backend
        run: |
          export PYTHONPATH="$PWD/..:$PWD:${PYTHONPATH:-}"
          python -m pytest llc/tests/test_llc_e2e_loop.py llc/tests/test_llc_org_chart.py -x -q
