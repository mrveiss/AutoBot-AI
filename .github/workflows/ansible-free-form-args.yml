# Every free-form shell block in the Ansible tree parses (#20693). Its own small workflow, because it
# has to run on any Ansible file, and the role-facts workflow is scoped to far fewer.
---
name: ansible-free-form-args

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request this run is for (set by ci.yml's fan-out; empty on a manual run)
        required: false
        default: ''
        type: string
      head_sha:
        description: Head commit the coordinator read; the run cancels itself when the branch tip differs
        required: false
        default: ''
        type: string
      base_sha:
        description: Merge base of the head with the pull request's base branch
        required: false
        default: ''
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || github.ref }}
  cancel-in-progress: ${{ inputs.pr_number != '' }}

permissions:
  contents: read

jobs:
  # #20825: a dispatched run validates its pins and ends CANCELLED when its head is stale. Parallel to the work on
  # purpose: this workflow is advisory, and ci.yml's fan-out only passes values its own `changes` job validated.
  pr-context:
    name: pr-context
    if: ${{ inputs.pr_number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/pr-context
        with:
          pr-number: ${{ inputs.pr_number }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

  free-form-args:
    runs-on: ubuntu-latest
    # Held (dependabot / release promotion), draft and un-admitted pull requests never reach this job: ci.yml's `fan-out` dispatches only what its `changes` job marked ready (#20825).
    steps:
      - uses: actions/checkout@v7
      # The runner's python3, as ansible-role-facts-test.yml does: this ansible-core predates .python-version.
      - name: "Install the fleet's ansible-core"
        run: |
          python3 -m venv "${RUNNER_TEMP}/ansible-venv"
          "${RUNNER_TEMP}/ansible-venv/bin/pip" install --quiet -r constraints/ansible-core.txt
      - name: "Every free-form block parses (#20693)"
        run: '"${RUNNER_TEMP}/ansible-venv/bin/python" tools/lint/check_ansible_free_form_args.py'
