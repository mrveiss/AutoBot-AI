name: Build AutoResearch Docker Image

on:
  push:
    paths:
      - 'autobot-backend/services/autoresearch/Dockerfile'
      - 'autobot-backend/services/autoresearch/run_experiment.py'
      - 'autobot-backend/services/autoresearch/requirements*.txt'
    branches:
      - main
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # required for keyless cosign signing via OIDC

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: autobot-backend/services/autoresearch
          file: autobot-backend/services/autoresearch/Dockerfile
          push: true
          tags: |
            ghcr.io/mrveiss/autobot-autoresearch:${{ github.sha }}
            ${{ github.ref == 'refs/heads/release' && 'ghcr.io/mrveiss/autobot-autoresearch:latest' || '' }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Sign container image (keyless / Sigstore OIDC)
        # Signs by digest so the signature is bound to exactly this image content,
        # not a mutable tag. Verifiable with:
        #   cosign verify ghcr.io/mrveiss/autobot-autoresearch@<digest> \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     --certificate-identity-regexp https://github.com/mrveiss/AutoBot-AI
        run: |
          cosign sign --yes \
            ghcr.io/mrveiss/autobot-autoresearch@${{ steps.build-push.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"
