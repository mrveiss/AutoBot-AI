# Sync Dev_new_gui → main after pushes to Dev_new_gui
#
# Dev_new_gui is the working branch. When it receives new commits
# (merged PRs, direct pushes), this workflow fast-forwards main
# to match. If fast-forward fails (main has diverged), it opens
# a PR instead for manual resolution.
#
# See: https://github.com/mrveiss/AutoBot-AI/issues/2445

name: Sync Dev_new_gui → main

on:
  push:
    branches: [Dev_new_gui]

jobs:
  sync:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Dev_new_gui is ahead of main
        id: check
        run: |
          git fetch origin main
          AHEAD=$(git rev-list --count origin/main..origin/Dev_new_gui)
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "Dev_new_gui is $AHEAD commit(s) ahead of main"

      - name: Fast-forward main to Dev_new_gui
        if: steps.check.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try fast-forward push
          if git push origin origin/Dev_new_gui:main 2>&1; then
            echo "main fast-forwarded to Dev_new_gui successfully."
            exit 0
          fi

          echo "Fast-forward failed — main has diverged. Creating PR."

          # Check if a sync PR already exists
          EXISTING=$(gh pr list \
            --base main \
            --head Dev_new_gui \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING" -gt 0 ]; then
            echo "Sync PR already exists — skipping creation."
            exit 0
          fi

          AHEAD=${{ steps.check.outputs.ahead }}

          gh pr create \
            --base main \
            --head Dev_new_gui \
            --title "chore(sync): merge Dev_new_gui → main ($AHEAD commit(s))" \
            --body "$(cat <<'EOF'
          ## Automated sync: Dev_new_gui → main

          Dev_new_gui has commits not yet in main. Fast-forward failed
          (main may have diverged), so this PR is created for manual merge.

          **Review carefully** — if there are merge conflicts, resolve them
          locally before merging.

          > Created automatically by the sync-main-to-dev workflow.
          > See issue #2445 for context.
          EOF
          )"
