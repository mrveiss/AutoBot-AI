# Sync Dev_new_gui → main (weekly, and on a confirmed manual trigger)
#
# Dev_new_gui is the working branch. This workflow opens a release PR from it
# into main, or brings the one already open up to date.
#
# Until the owner's decision on #16221 it ran only when triggered by hand. It now
# also runs weekly (#16246). The schedule only opens or updates a PR: merging is
# still a person's action, gated by main's checks, so untested code still cannot
# land on main unreviewed.
#
# It opens a PR rather than pushing: main requires status checks, so a direct
# push is declined by the protected-branch hook (GH006). Detail at the step.
# The PR itself is opened or updated by pipeline-scripts/release_sync_main.py:
# at most one sync PR, a body naming the scheduled workflows the merge changes,
# and the instruction to merge with a merge commit. Nothing here merges.
# Where GitHub refuses the PR (this repository syncs by hand, #15834), it keeps
# one tracking issue with the compare link and the command instead.
#
# See: https://github.com/mrveiss/AutoBot-AI/issues/2445

name: Sync Dev_new_gui → main

on:
  schedule:
    # Weekly, Monday 05:43 UTC, off the top of the hour. GitHub dispatches
    # `schedule` from the default branch only, so this fires once the file is
    # on main.
    - cron: '43 5 * * 1'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to confirm pushing Dev_new_gui to main'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: release-sync-main
    permissions:
      contents: write
      pull-requests: write
      # #15834: where GitHub refuses the PR, the script keeps a tracking issue,
      # and this repository's default token permission is read-only.
      issues: write

    steps:
      # #13516: `inputs.confirm` reaches the shell through `env:`, not inline
      # `${{ }}`. Triggering this needs repo write access, so it is
      # privilege-equivalent rather than an escalation — but this job holds
      # `contents: write` (see permissions above), which makes it the one site
      # in the batch worth fixing on its own merits.
      #
      # #16246: the confirmation gates MANUAL runs only. A scheduled run has no
      # inputs, and it only opens or updates the PR; the merge stays a person's.
      - name: Validate confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'release'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          echo "::error::You must type 'release' to confirm. Got: '$CONFIRM'"
          exit 1

      # #16246: the push below uses this credential. Pushed with GITHUB_TOKEN,
      # the refreshed PR head is attributed to github-actions[bot] and its runs
      # park (docs/developer/CI_BOT_ATTRIBUTION.md), so main's required checks
      # never report on it. Falls back so a missing secret behaves as before.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOBOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check if Dev_new_gui is ahead of main
        id: check
        run: |
          git fetch origin main
          AHEAD=$(git rev-list --count origin/main..origin/Dev_new_gui)
          BEHIND=$(git rev-list --count origin/Dev_new_gui..origin/main)

          # #13974: BEHIND counts the merge commit this very workflow's release PR
          # creates on main, so a successful promotion armed the guard against the
          # next one. That is why main sat 41 commits behind for five days: the
          # error blamed "divergence" for a commit the release process itself made.
          #
          # DIVERGENT counts only NON-merge commits on main that the trunk lacks —
          # actual work committed to main directly, which is what the guard exists
          # to protect. A merge commit carries no content of its own, so it is not
          # divergence in any sense that matters to a fast-forward.
          #
          # Limitation, stated rather than hidden: an "evil merge" (a merge commit
          # edited to carry content from neither parent) would not be counted. That
          # cannot arise from the PR-merge path this workflow uses, and catching it
          # needs `git merge-tree --write-tree` (git >= 2.38) comparing the merge
          # result against the trunk tree — worth doing if direct pushes to main are
          # ever allowed.
          DIVERGENT=$(git rev-list --count --no-merges origin/Dev_new_gui..origin/main)

          {
            echo "ahead=$AHEAD"
            echo "behind=$BEHIND"
            echo "divergent=$DIVERGENT"
          } >> "$GITHUB_OUTPUT"
          echo "Dev_new_gui is $AHEAD ahead, $BEHIND behind main ($DIVERGENT non-merge commit(s) only on main)"

      # #15834: no `if:` on the ahead count. With nothing to sync the script still
      # runs, to close the tracking issue; only the push needs commits to carry.
      - name: Open the release sync PR
        id: sync
        env:
          # #16246: the push token, for the same reason as the checkout above: a
          # PR opened with GITHUB_TOKEN starts no checks. The PR body tells a
          # reader what to do if the fallback was used.
          GITHUB_TOKEN: ${{ secrets.AUTOBOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AHEAD: ${{ steps.check.outputs.ahead }}
          BEHIND: ${{ steps.check.outputs.behind }}
          DIVERGENT: ${{ steps.check.outputs.divergent }}
        run: |
          if [ "$AHEAD" != "0" ]; then
            if [ "$DIVERGENT" != "0" ]; then
              echo "::error::main has $DIVERGENT non-merge commit(s) not in Dev_new_gui — work committed straight to main. Resolve manually first."
              exit 1
            fi
            if [ "$BEHIND" != "0" ]; then
              echo "::notice::main carries $BEHIND merge commit(s) the trunk lacks (from previous promotions). No content of their own, so not a blocker — see #13974."
            fi

            # This step used to `git push origin origin/Dev_new_gui:main`, which
            # can never succeed: `main` requires two status checks ("No open
            # blocks-merge issues reference this PR", "No commit trailers"), and a
            # direct push moves the branch to a commit that has neither, so the
            # protected-branch hook declines it:
            #
            #   remote: error: GH006: Protected branch update failed for refs/heads/main.
            #   ! [remote rejected] origin/Dev_new_gui -> main (protected branch hook declined)
            #
            # Routing through a PR lets those checks run against the release head,
            # which is what the protection is for. Precedent: #13816 synced this
            # way by hand.
            git push --force origin "origin/Dev_new_gui:refs/heads/$SYNC_BRANCH"
          fi

          # #16246, #15834: opens the sync PR, or rewrites the body of the oldest
          # one open (from $SYNC_BRANCH or from the trunk), and never opens a
          # second. Where GitHub refuses the PR it keeps ONE tracking issue with
          # the compare link and the command instead, and fails if it cannot.
          python3 pipeline-scripts/release_sync_main.py \
            --head "$SYNC_BRANCH" --source Dev_new_gui --base main
