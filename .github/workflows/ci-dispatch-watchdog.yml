# CI dispatch watchdog — #12823, #13045
#
# Guards the two ways a pull request ends up reading as "waiting for CI" with
# nothing actually queued:
#
#   #12823  auto-update-pr-branches (retired by #19548) refreshed PR branches with the default
#           GITHUB_TOKEN, so the merge commit is pushed as github-actions[bot].
#           The repository's fork-PR approval policy treats that bot as an
#           external contributor, so every run it triggers is created with
#           conclusion=action_required and never starts. The head commit then
#           carries zero executed checks, and `gh pr checks` reports nothing at
#           all — not pending, not failing. Tooling that reads "no failures" as
#           "ready" will happily merge it.
#
#   #13045  While the singleton self-hosted runner pool is empty, runs are
#           created but never allocate a job. A required context never reports,
#           `commits/{sha}/status` stays pending forever, and the PR shows
#           "19 success / 0 failures" while being structurally unmergeable.
#
# This workflow approves what it is permitted to approve, and — regardless of
# whether approval succeeds — publishes a `ci-dispatch-watchdog` commit status
# on every open PR head. Absence of CI therefore becomes a visible, named,
# non-green context instead of silence.
#
# FORK SAFETY: `POST /actions/runs/{id}/approve` is the approve-a-fork-run
# endpoint. This repository is public, takes fork pull requests, and runs
# `pull_request` jobs on the self-hosted runner, so approving a fork run would
# execute contributor-supplied code on the owner's machine — the very thing the
# `all_external_contributors` policy exists to stop. The sweep therefore
# approves only runs whose head repository is this repository AND whose
# triggering actor is the branch-update bot. Fork pull requests get a published
# status; they never get an approval.
#
# runs-on is ubuntu-latest on every job by design: the self-hosted runner is a
# singleton, and a watchdog that queues behind the outage it exists to report
# is useless.

name: CI Dispatch Watchdog

on:
  schedule:
    # Every 15 minutes. Scheduled runs are attributed to the repository, not to
    # github-actions[bot] as a contributor, so this workflow itself is never
    # subject to the approval policy it repairs.
    #
    # LIVE as of #13791. GitHub only dispatches `schedule` from the DEFAULT
    # branch, so for the first 100 runs of this workflow — 73 `pull_request`,
    # 27 `push`, zero `schedule` — the cron did nothing: the file existed only
    # on main. #13791 added it to `release` (then the default branch) too,
    # which made the sweep periodic rather than incidental. #16461 later made
    # `main` itself the default, so this duplication is no longer load-bearing
    # for the schedule, though the two copies still must stay byte-identical
    # (see below).
    #
    # This file exists on both `release` and `main` and the two copies must
    # stay byte-identical — a direction-specific note here makes them permanently
    # conflict on every release sync. The push hook below is not redundant: it catches
    # a head parking within seconds rather than up to 15 minutes later. There is no
    # `pull_request` hook any more (#20825): the PR coordinator dispatches CI itself.
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel a sweep in flight — a half-finished sweep leaves some PRs
  # without a published status, which is the exact condition being guarded.
  #
  # The group is scoped to WHAT IS BEING SWEPT, not to the workflow (#13384).
  # A repo-global group looks like it honours `cancel-in-progress: false`, but
  # by default (`queue: single`) GitHub keeps one in-progress AND one pending run
  # per group: the third arrival cancels the pending one. With a `pull_request` trigger on
  # every synchronize and a busy queue, the watchdog's own sweeps therefore
  # cancelled each other and nothing was published. Observed 2026-08-03 (two
  # cancelled one second apart, ~120 runs left parked for a human) and again
  # 2026-08-16 (16 of 30 consecutive runs cancelled).
  #
  # Every run is the one repo-wide sweep (schedule, base push, manual dispatch), so they share the single
  # `base` group and stay serialised.
  group: ci-dispatch-watchdog-base
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  statuses: write
  pull-requests: read

jobs:
  watchdog:
    name: Approve parked runs and publish dispatch state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # #20903: the repo scripts import autobot_shared, which refuses an interpreter
      # below the .python-version floor; the runner default python3 is not guaranteed to meet it.
      - name: Set up Python from .python-version
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      # Answers "may this workflow's GITHUB_TOKEN approve a parked run?" and
      # nothing else. It POSTs approve against a run that already succeeded,
      # which GitHub rejects on state grounds, so it has no side effect and is
      # safe on an unreviewed branch. It is a separate step from the sweep
      # because --dry-run deliberately issues no approve request and so cannot
      # answer the question — the omission that made an earlier self-test report
      # "probe skipped" while the job passed.
      - name: Report approval capability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 pipeline-scripts/ci_dispatch_watchdog.py --check probe

      # #15139: a red tile does not say WHICH condition produced it — a run that
      # never got a runner, toolchain provisioning failing, a superseded run, or
      # a real test failure all render identically, and `gh pr checks` buckets
      # every one of them under `fail`. The classifier names it, reading
      # GET /actions/jobs/{id} because that is the only endpoint carrying a
      # `steps` array; /commits/{sha}/check-runs has none, so anything reading
      # `steps` off the listing finds nothing on every check and classifies by
      # its default instead.
      #
      # It publishes no status and re-queues nothing, so it can never turn a red
      # check green. --exit-zero keeps a *classification* from being mistaken for
      # a gate — the required contexts remain the gate — but it cannot suppress
      # exit 2, so a head with no check runs, or an unreachable API, still fails
      # this step loudly instead of reading as "all clear". continue-on-error
      # keeps that informational failure from reddening the sweep it rides on,
      # the same idiom pr-queue-gate.yml uses for its never-blocks job.
      #
      # This runs before the self-modification guard below for the same reason
      # the capability probe does: the classifier issues GET requests only —
      # it approves nothing, publishes no status, and writes nothing back — so
      # a PR head's copy of it cannot spend the job's write permissions.
      - name: Classify any red checks on the swept head
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # The exit code is the point, so it is captured rather than piped away:
          # `... | tee` would report tee's status and this step could never fail.
          # `|| rc=$?` rather than a bare capture on the next line: this step runs
          # under bash -e, which would abort on exit 2 before rc is captured (#16237).
          REPORT="$RUNNER_TEMP/ci-red-cause.txt"
          rc=0
          python3 pipeline-scripts/ci_red_cause.py --sha "$HEAD_SHA" --exit-zero \
            >"$REPORT" 2>&1 || rc=$?
          {
            echo "### Red-check causes for \`$HEAD_SHA\`"
            echo ''
            echo '```'
            cat "$REPORT"
            echo "exit=$rc"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat "$REPORT"
          exit "$rc"

      - name: Sweep open PRs
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WATCHDOG_BASE_BRANCH: main
        run: |
          set -euo pipefail
          # Every run is the full sweep: with no pull_request event there is no firing PR to narrow it to.
          python3 pipeline-scripts/ci_dispatch_watchdog.py --check dispatch

      # #15139: the classifier above NAMES the cause but re-queues nothing, so a
      # run that never obtained a runner keeps a red tile that reads exactly like
      # a test failure. This step acts on that classification.
      #
      # This step never runs on `pull_request` (see the `if:` below), so
      # `github.event.pull_request.head.sha` never resolves for it — a single
      # `--sha` had nothing left to fall back to but `github.sha`, the BASE
      # branch tip, never the red PR head this exists to repair. It sweeps
      # every open PR against the base branch instead, the same pattern the
      # "Sweep open PRs" step above already uses.
      #
      # AFTER the self-modification guard, deliberately. The classifier can run
      # ahead of it because it only ever issues GETs; this step writes, so a pull
      # request's own copy of it must not execute while the job holds
      # `actions: write`. The guard's case pattern covers ci_dispatch_retry too.
      #
      # Admission-controlled, because an eager retry re-queues into the very
      # condition that produced the failure: it refuses to spend when the REST
      # budget is low OR unreadable, when in-progress runs are at the ceiling,
      # and the per-sweep re-run budget is spent across every open PR, not reset
      # per PR — after one retry per run, a second non-dispatch is a capacity
      # signal and must stay visible rather than be retried away.
      #
      # continue-on-error and an unconditional exit 0 inside the script: a
      # watchdog that reddens the sweep it rides on has made the pipeline noisier,
      # which is the problem #15139 is about.
      - name: Re-dispatch infrastructure-caused reds (#15139)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WATCHDOG_BASE_BRANCH: main
        run: |
          set -uo pipefail
          python3 pipeline-scripts/ci_dispatch_retry.py \
            | tee -a "$GITHUB_STEP_SUMMARY"
