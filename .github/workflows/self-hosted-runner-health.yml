# Self-hosted runner health — #13045
#
# The previous probe called `GET /repos/{owner}/{repo}/actions/runners` and
# selected a runner by hard-coded name. Both halves were broken:
#
#   * `/actions/runners` is an administration endpoint. GITHUB_TOKEN cannot read
#     it — every run failed with `gh: Resource not accessible by integration
#     (HTTP 403)`, and because the step ran under `set -euo pipefail` the job
#     aborted on that very first line. The workflow had therefore been red on
#     100% of its scheduled runs while reporting nothing about the runner, so a
#     real outage was indistinguishable from its own standing failure.
#   * The hard-coded runner name no longer matched the registered runner, so
#     even with a privileged token the `select(...)` would have yielded an empty
#     result and the desync branch could never have fired.
#
# The replacement probes the same user-visible symptom through an endpoint the
# workflow token can actually read: work queued past a threshold that never
# allocated a job means no runner is serving the pool. That is precisely the
# condition of #13045, and it needs no runner name, so a runner rename can never
# silently disable this check again.
#
# It now also reports the OPPOSITE fault (#13341): a self-hosted job that
# started and then stopped making progress. That case defeated the starvation
# probe rather than being caught by it — a wedged job is `in_progress` on a
# `self-hosted` label, which the probe read as proof the pool was healthy, so
# the work piling up behind it was dismissed as "contention, not an outage".
# The required frontend check ran three hours past a declared 30-minute timeout
# under exactly that reading. Wedged jobs are now excluded from the liveness
# verdict and reported in their own right.

name: self-hosted-runner-health

on:
  schedule:
    # LIVE (#14444). This block used to read "DORMANT ON THIS BRANCH", on the
    # reasoning that GitHub dispatches `schedule` from the default branch and
    # the default branch carried the pre-#13045 version querying the
    # `/actions/runners` endpoint GITHUB_TOKEN cannot read. The 2026-09-12
    # rename made `main` the default branch, so that copy IS this file and the
    # cron now dispatches this probe. Measured on 2026-09-17: the last 20 runs
    # were green, four of them `schedule`-dispatched.
    #
    # The stale note mattered more than a wrong comment usually does — it said
    # the probe was inert and failing, so a reader deciding whether to retire it
    # would have been deciding about a check that is in fact running and green.
    #
    # GitHub throttles `schedule` on busy repositories, so the observed gap runs
    # to hours rather than the half hour asked for here. The cron stays at 30
    # minutes because it is a ceiling, not a promise: the push trigger below is
    # what gives this probe its dependable cadence.
    - cron: "*/30 * * * *"
  workflow_dispatch:
  # One short ubuntu-latest job per push to the integration branch, which is
  # where the code that could wedge CI lands. This is the trigger that carries
  # the probe in practice — 16 of the last 20 runs — and it is what kept the
  # repaired probe exercised through the period the cron could not reach it.
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  check:
    # ubuntu-latest, never the self-hosted pool: a runner-outage detector that
    # queues behind the outage it is meant to report cannot report it. Since the
    # migration there is no self-hosted pool at all — all 107 `runs-on:`
    # declarations across the 65 workflows are `ubuntu-latest` — so what the
    # probe below actually watches is hosted-runner saturation, which #14364
    # repointed it at. The workflow keeps its original name so its run history
    # stays continuous; #14444 holds the rename question.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Probe for starved workflow runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 pipeline-scripts/ci_dispatch_watchdog.py --check runner-starvation
