# Issue Triage
#
# triage (#13050): area/difficulty labels on opened/edited, decided by
#   .github/scripts/issue-triage-labels.js.
# structure (#19522): every open issue needs a goal milestone `M<n> - ...`, a
#   `phase:M<n>.<k>` label with the same <n>, and a native parent unless it is an
#   umbrella with sub-issues. `Parent: #N` in the body links an orphan as a native
#   sub-issue (never re-parents) when its author is OWNER/MEMBER/COLLABORATOR and
#   #N is an open issue; otherwise the comment says why. A gap adds `needs-structure` plus ONE marked
#   comment, updated in place; the label clears when all three are present. Logic
#   and fixture tests: pipeline-scripts/issue_structure.py.
#   Native parent/sub-issue changes emit no workflow event (the `sub_issues`
#   webhook is not an Actions trigger), so `schedule` lists EVERY open issue
#   (paginated) and fully checks those whose label disagrees with their listed
#   facts, or that carry an unlinked maintainer `Parent:`, at most
#   SWEEP_MAX_CHECKS (issue_structure.py) per run (the rest next run), which also
#   labels the backlog that predates the guard; `workflow_dispatch` re-checks
#   one issue or sweeps.
# wording (#19645): flags automation session ids and internal process roles in an
#   issue body on opened/edited; see the job's own comment.

name: Issue Triage

on:
  issues:
    types: [opened, edited, milestoned, demilestoned, labeled, unlabeled]
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to re-check (empty: sweep every open issue)'
        required: false
        default: ''

permissions: {}

jobs:
  triage:
    if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'edited')
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-triage-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Triage issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            // #13050: the label decision lives in .github/scripts/issue-triage-labels.js
            // so it is a pure function with unit tests, instead of untestable
            // inline substring matching that mislabelled #13032-#13036.
            const { selectLabels } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-triage-labels.js`);
            const issue = context.payload.issue;

            const { labels, reason, suppressed } = selectLabels(issue);
            console.log(`Triage decision: ${labels.length ? labels.join(', ') : '(none)'} — ${reason}`);

            if (labels.length === 0) {
              // #13050: no label beats a wrong one — but only ASK when we are
              // genuinely uncertain. `suppressed` means the author already
              // triaged it, and this workflow also fires on `edited`, so
              // commenting there would nag a correctly-labelled issue on every
              // checklist tick. Ask once, on creation, and never again.
              if (!suppressed && context.payload.action === 'opened') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `👋 Auto-triage could not confidently classify this issue (${reason}). Could a maintainer add the appropriate labels (\`frontend\`, \`backend\`, \`infrastructure\`, \`docs\`, \`testing\` and \`good-first-issue\`, \`intermediate\`, \`advanced\`)?`
                });
              }
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels
            });
            console.log(`Triage complete! Applied labels: ${labels.join(', ')}`);

  structure:
    name: Issue structure (milestone, phase, parent)
    if: github.event_name != 'issues' || !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Every run re-reads the issue and reconciles to its current state, so the
      # newest event supersedes an older one safely.
      group: ${{ github.workflow }}-structure-${{ github.event.issue.number || inputs.issue || 'sweep' }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            pipeline-scripts
            .github/actions/upsert-pr-comment

      - name: Check one issue
        if: github.event_name == 'issues' || inputs.issue != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: python3 pipeline-scripts/issue_structure.py check --number "$ISSUE_NUMBER"

      - name: Sweep every open issue
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.issue == '')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 pipeline-scripts/issue_structure.py sweep

  # #19645: issue bodies must make sense to an outside contributor -- no automation
  # session ids, no internal process roles. Flagged, never blocked: a hit adds the
  # `needs-wording` label and ONE marker-identified comment, updated in place; a
  # clean edit updates that comment and clears the label. The detector is
  # scripts/lib/outward_wording.py, the same one behind the PR body check and the
  # commit-msg hook.
  wording:
    name: Issue wording (session ids, internal roles)
    # Body text changes only on opened/edited; the structure job's milestone and label
    # triggers (#19522) must not re-scan an unchanged body.
    if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'edited') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-wording-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # A job holding a write token runs code from the default branch only.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/lib
            .github/actions/upsert-pr-comment

      - name: Scan the issue body
        id: scan
        run: python3 scripts/lib/outward_wording.py issue --event "$GITHUB_EVENT_PATH" --out "$RUNNER_TEMP/wording.md"

      - name: Post or update the wording comment
        if: steps.scan.outputs.comment == 'true'
        uses: ./.github/actions/upsert-pr-comment
        with:
          marker: ${{ steps.scan.outputs.marker }}
          body-file: ${{ runner.temp }}/wording.md
          number: ${{ steps.scan.outputs.number }}

      - name: Add or clear the needs-wording label
        if: steps.scan.outputs.label == 'add' || steps.scan.outputs.label == 'remove'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.scan.outputs.number }}
          LABEL_ACTION: ${{ steps.scan.outputs.label }}
          LABEL_NAME: ${{ steps.scan.outputs.label_name }}
        run: |
          set -euo pipefail
          # The REST add-labels call creates the label on first use; `gh issue edit
          # --add-label` refuses a label the repository does not have yet.
          if [ "$LABEL_ACTION" = add ]; then
            gh api --method POST "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$LABEL_NAME" >/dev/null
          else
            gh api --method DELETE "repos/$REPO/issues/$NUMBER/labels/$LABEL_NAME" >/dev/null
          fi
