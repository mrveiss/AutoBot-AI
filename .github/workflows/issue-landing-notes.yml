# Landing notes on the issues a PR or merge train merged to main references (#19520)
#
# Replaces the comment-only notifier of #1601/#1659, which went silent once
# `main` became the default branch: GitHub now auto-closes a `Closes #N` issue
# on the merge BEFORE a workflow runs, the old script skipped closed issues,
# and a train PR's body does not carry its members' Closes/Refs lines.
#
# landing-notes: for every Closes/Fixes/Resolves/Refs #N in the merged PR -- or,
#   for a train (head `train-*`), in each member PR resolved from the train's
#   own merge commits -- one comment per issue, deduplicated on the hidden
#   `<!-- landing-note:<merge sha> -->` marker, closed issues included. A closed
#   issue referenced with a closing keyword gets `needs-ac-evidence`. A member
#   PR GitHub marks merged when its train lands defers to the train's run.
#
# It runs on the PUSH to main (#20825), not on `pull_request: closed`: a pull request
# creates no workflow run at all unless it holds a CI slot, and a merge to main is a push
# whatever route merged it. The pull requests a push merged are resolved from its commits
# (`GET commits/{sha}/pulls`). There is no `issue_comment` leg: it ran once per comment on
# every issue and pull request. Its `evidence` work (clear `needs-ac-evidence` when an owner comments an
# AC evidence table) is the `sweep` command now: a schedule and a manual dispatch list the issues that
# carry the label and clear it from each one that holds a trusted AC evidence table. No per-comment run.
#
# The job ticks, closes, reopens or edits no issue. The logic and its fixture tests
# live in pipeline-scripts/landing_notes.py.
#
# Fork heads are skipped: a fork PR's GITHUB_TOKEN cannot write issues.

name: Issue landing notes

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

concurrency:
  # Never cancel: a half-finished run leaves some issues without their note.
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  landing-notes:
    name: Post landing notes on referenced issues
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            pipeline-scripts
            .github/actions/upsert-pr-comment

      - name: Set up Python from .python-version
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Post landing notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 pipeline-scripts/landing_notes.py pushed --before "$BEFORE" --after "$AFTER" --branch main

  evidence-sweep:
    name: Clear needs-ac-evidence where an owner posted the AC table
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            pipeline-scripts
            .github/actions/upsert-pr-comment

      - name: Set up Python from .python-version
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Sweep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 pipeline-scripts/landing_notes.py sweep
