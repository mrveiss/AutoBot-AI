# Docker smoke required-context publisher — #15299
#
# `smoke-test` is a REQUIRED status check on the integration branch (#6723).
# Exactly one of two mutually exclusive jobs publishes it:
#
#   docker paths changed   -> `smoke-test` in docker-smoke-test.yml, which builds
#                             the images and starts the compose stack. That is
#                             the real gate (this workflow reports nothing then).
#   docker paths untouched -> `smoke-test` below, which reports the context green
#                             because the image build does not apply.
#
# WITHOUT THIS SHIM the job could not be gated at all: docker-smoke-test.yml's
# `smoke-test` is guarded by `needs.changes.outputs.docker == 'true'`, so on a
# docs-only pull request it would never run, never report, and the pull request
# would sit blocked forever on a context nobody can produce. That is the exact
# deadlock #14353 removed for `python-suite`.
#
# WHY ITS OWN FILE — the same reason python-required-context.yml is its own file.
# docker-smoke-test.yml declares a WORKFLOW-level concurrency group with
# `cancel-in-progress` on pull requests. A shim living inside it shares that
# group, so a superseded run takes the shim down with it and the required context
# goes missing exactly when a rapid push sequence needs it most.
#
# NO `concurrency:` BLOCK — DELIBERATE, for that same reason. This job finishes
# in seconds, so there is nothing to save by cancelling it and a great deal to
# lose.
#
# THE FILTER IS SHARED, NOT COPIED — .github/filters/docker-paths.yml. The two
# `if:` conditions are exact complements, and the failure direction is silent: a
# shim that thinks nothing Docker-related changed while docker-smoke-test.yml
# thinks otherwise would publish green for a build that never ran.

name: docker-smoke-required-context

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths (docker required context)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: .github/filters/docker-paths.yml

  smoke-test:
    # IDENTICAL to the job name in docker-smoke-test.yml on purpose: the required
    # status context is the JOB name, so this reports the same context when the
    # real smoke test legitimately does not run.
    name: smoke-test
    needs: changes
    # `always()` and then the complement, in that order, because the order is
    # the fix (#17126).
    #
    # This used to read `if: needs.changes.outputs.docker != 'true'` under a
    # comment asserting fail-closed: "if `changes` errors, `needs` skips this
    # job rather than reporting green ... which blocks the pull request". A
    # skipped job does not block anything -- GitHub counts a SKIPPED check run
    # as SATISFYING a required status check. So a failed or cancelled `changes`
    # skipped this job AND the real one in docker-smoke-test.yml, and the
    # required `smoke-test` context was met with no Docker smoke test run.
    #
    # Now: this job runs unless the real one is going to, and refuses when its
    # own detector did not answer:
    #
    #   changes ok, docker != true   -> this job runs and succeeds (legitimate)
    #   changes ok, docker == true   -> this job SKIPS; the real build reports
    #   changes NOT ok               -> this job runs and FAILS
    #
    # THE FIRST TWO ARE MUTUALLY EXCLUSIVE. THE THIRD IS NOT A THIRD CASE, and
    # an earlier version of this comment claimed it was -- that "exactly one
    # check run named `smoke-test` ever carries a conclusion". It does not.
    # There are TWO `changes` jobs, one per workflow, and this one can only see
    # its own. When both detectors fail, this job reports failure and the real
    # build also runs (its own `needs.changes.result != 'success'` fires) and
    # reports whatever the build does -- two check runs, one context, possibly
    # opposite conclusions, resolved by whichever completed last.
    #
    # What holds is narrower: THIS JOB CANNOT REPORT GREEN UNLESS ITS OWN
    # DETECTOR SAID NO DOCKER PATHS CHANGED. That is true and it is not
    # sufficient, which the first correction of this comment also got wrong.
    # With S = this workflow's detector and R = the real build's, on a pull
    # request where both succeed:
    #
    #   S.docker  R.docker   publishers
    #   true      true       real only          correct
    #   false     false      shim only          correct
    #   true      false      NEITHER            no context is created at all
    #   false     true       BOTH               shim green + the build's result
    #
    # The third row is #17126's own hole by another door: a required check that
    # satisfies the gate by never existing. The fourth is worse than
    # conservative -- the shim's green does NOT mean a build ran, and whether it
    # or a failing build decides the context depends on which completed last.
    #
    # Neither row is a defect in either condition: each is correct for the value
    # its own detector computed. The design asks ONE question of TWO detectors
    # and assumes they agree, and two `dorny/paths-filter` runs in separate
    # workflow runs can resolve a moving base differently. That is the
    # single-publisher problem, not a condition bug, and it is #17391 -- not
    # closable inside this file, and stated here so nobody reads the invariant
    # above as a safety guarantee it does not carry.
    if: >-
      always() && (
        needs.changes.result != 'success'
        || needs.changes.outputs.docker != 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the required context, or refuse when detection failed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCKER_CHANGED: ${{ needs.changes.outputs.docker }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Path detection did not succeed (changes job: $CHANGES_RESULT)."
            echo "This shim reports the required 'smoke-test' context only when it KNOWS"
            echo "no Docker-related path changed. It cannot know that now, so it refuses"
            echo "rather than reporting green -- a skipped or absent run would otherwise"
            echo "satisfy the required check with no smoke test at all (#17126)."
            exit 1
          fi
          echo "No Docker-related paths changed in this pull request."
          echo "The image build and compose smoke test in docker-smoke-test.yml"
          echo "do not apply, so the required 'smoke-test' context is reported"
          echo "green from here."
          echo "Path set: .github/filters/docker-paths.yml (#15299)."
