      - "autobot_shared/monitoring/prometheus_query.py"
      - "autobot_shared/network_constants.py"
      - "autobot_shared/paths.py"
      - "autobot_shared/pinned_model_registry.py"
      - "autobot_shared/rate_limiter.py"
      - "autobot_shared/redis_client.py"
      - "autobot_shared/redis_management/__init__.py"
      - "autobot_shared/redis_management/config.py"
      - "autobot_shared/redis_management/connection_manager.py"
      - "autobot_shared/redis_management/database_names.py"
      - "autobot_shared/redis_management/pool_params.py"
      - "autobot_shared/redis_management/pool_stats.py"
      - "autobot_shared/redis_management/statistics.py"
      - "autobot_shared/redis_management/types.py"
      - "autobot_shared/retry_mechanism.py"
      - "autobot_shared/secret_redaction.py"
      - "autobot_shared/secret_redaction_vocabulary.py"
      - "autobot_shared/secrets_vault.py"
      - "autobot_shared/security/__init__.py"
      - "autobot_shared/security/input_sanitizer.py"
      - "autobot_shared/security/password_weakness.py"
      - "autobot_shared/security/path_validator.py"
      - "autobot_shared/security/redaction.py"
      - "autobot_shared/security/safe_response.py"
      - "autobot_shared/security/sql_identifier.py"
      - "autobot_shared/security/ssrf_guard.py"
      - "autobot_shared/service_signing.py"
      - "autobot_shared/singleton_factory.py"
      - "autobot_shared/ssot_config.py"
      - "autobot_shared/ssot_constants.py"
      - "autobot_shared/ssot_tls.py"
      - "autobot_shared/status_enums.py"
      - "autobot_shared/stream_logging.py"
      - "autobot_shared/token_count.py"
      - "autobot_shared/url_safety.py"
      - ".github/workflows/llm-optimization-real-torch.yml"

# Least privilege (#15331). Runs tests only; no token writes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-torch:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOBOT_REQUIRE_REAL_TORCH: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # the job runs PR code and needs no authenticated git
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - name: Install CPU torch at the repo's declared pin
        run: |
          # One version, declared once: autobot-backend/requirements.txt.
          pin="$(grep -m1 -E '^torch==[0-9][^ #]*' autobot-backend/requirements.txt | sed -E 's/^(torch==[^ #]+).*/\1/')"
          test -n "$pin" || { echo "no torch== pin in autobot-backend/requirements.txt"; exit 1; }
          python -m pip install --upgrade pip
          python -m pip install "$pin" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -c "import torch; print('torch', torch.__version__)"
      - name: Install backend test dependencies
        run: >
          python -m pip install --prefer-binary
          -r requirements-ci/framework.txt
          -r requirements-ci/utilities.txt
          -r requirements-ci-test.txt
      - name: Run the real-torch optimization tests
        run: >
          python -m pytest
          autobot-backend/llm_shared/optimization/meta_eviction_equivalence_test.py
          autobot-backend/llm_shared/optimization/meta_eviction_test.py
          autobot-backend/llm_shared/optimization/taxonomy_test.py
          -q
