  pull_request:
    # ready_for_review is REQUIRED: the job is gated on draft == false, and
    # marking a PR ready fires ONLY this event (see actionlint.yml).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "autobot-backend/llm_shared/**"
      - "autobot_shared/__init__.py"
      - "autobot_shared/alert_cooldown.py"
      - "autobot_shared/async_compat.py"
      - "autobot_shared/auth/__init__.py"
      - "autobot_shared/auth/jwt_core.py"
      - "autobot_shared/circuit_breaker.py"
      - "autobot_shared/coordination/__init__.py"
      - "autobot_shared/coordination/run_progress.py"
      - "autobot_shared/credential_gated_registry.py"
      - "autobot_shared/doc_chunking.py"
      - "autobot_shared/egress_allowlist.py"
      - "autobot_shared/env_utils.py"
      - "autobot_shared/http_client.py"
      - "autobot_shared/http_client_manager.py"
      - "autobot_shared/http_egress_guard.py"
      - "autobot_shared/llm_provider_candidates.py"
