name: canonical-audit

on:
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: canonical-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-python-ci

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"

      - name: Generate audit reports
        id: audit
        run: |
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p audit-output
          python tools/lint/canonical_check.py --all --format markdown \
            --output "audit-output/canonical-audit-py-$DATE.md"
          python tools/lint/canonical_check.py --all --format json \
            --output "audit-output/canonical-audit-py-$DATE.json"
          python tools/lint/canonical_check_infra.py --all --format markdown \
            --output "audit-output/canonical-audit-infra-$DATE.md"
          python tools/lint/canonical_check_infra.py --all --format json \
            --output "audit-output/canonical-audit-infra-$DATE.json"
          # #17571: the frontend audit is wired in. It used to write a placeholder
          # saying --all was unimplemented, which was true -- the flag was accepted
          # and walked nothing, so it reported a clean tree it had never opened.
          #
          # The exit code is CAPTURED rather than allowed to fail this step: a
          # blocking diagnostic must still reach the artifact and the job summary,
          # so the gate below runs after the upload. `bash -e` would otherwise
          # abort here and publish nothing, which is the failure mode that makes
          # people stop reading a gate.
          FE_RC=0
          node autobot-frontend/scripts/canonical_check.mjs --all --format pretty \
            --output "audit-output/canonical-audit-fe-$DATE.md" || FE_RC=$?
          node autobot-frontend/scripts/canonical_check.mjs --all --format json \
            --output "audit-output/canonical-audit-fe-$DATE.json" || true
          echo "fe_rc=$FE_RC" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Upload audit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: canonical-audit-${{ steps.audit.outputs.date }}
          path: audit-output/
          retention-days: 365
          if-no-files-found: error

      - name: Job summary
        run: |
          echo "## Canonical audit — ${{ steps.audit.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          for f in audit-output/*.md; do
            {
              echo ""
              cat "$f"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # #17571: the audit had no failing step at all -- it generated, uploaded and
      # summarised, so a `block` diagnostic landed in an artifact nobody opened.
      # A rule that cannot fail anything is a report, and the design system was
      # advisory for exactly that reason.
      #
      # Only `block` fails. The severity vocabulary is block | warn | audit, and
      # `makeDiagnostic` rejects anything else -- a rule cannot opt into failing
      # by inventing a level, it says block or it is advisory.
      - name: Fail on a blocking canonical violation
        if: steps.audit.outputs.fe_rc != '0'
        run: |
          echo "::error::canonical-audit: a blocking canonical violation was found — see the job summary above and the uploaded artifact."
          exit 1
