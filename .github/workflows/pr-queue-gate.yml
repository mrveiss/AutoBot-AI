name: PR Queue Gate

on:
  pull_request:
    types: [opened, reopened]

# #14434: without this, every push left its predecessors queued. 42 of a 271-run
# sample were for commits no longer at their branch tip - work nothing would ever
# read, each still fetching its actions. During GitHub's 2026-08-17 archive-download
# degradation that wasted load became failures on unrelated pull requests (#14444).
#
# cancel-in-progress is guarded on the event rather than set to a bare `true`:
# #13432 found that cancelling base-branch runs meant each merge cancelled the
# previous merge's verification, and merges arrive faster than a suite completes -
# of 39 completed base runs, 26 were cancelled and NONE succeeded. Six of the
# workflows this was applied to also trigger on push to main, so the guard
# is load-bearing there and harmless where it is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-pr-limit:
    runs-on: ubuntu-latest
    permissions:
      # Declaring any `permissions:` sets every unlisted scope to `none`, so the
      # checkout below needs `contents` named explicitly (#14718).
      contents: read
      pull-requests: write
    steps:
      # #14718: the notice's open-PR list is built by a script in the repo, so
      # this job needs the tree. Without a checkout the script is absent, the
      # fallback fires, and the notice degrades silently — the exact fail-open
      # shape this fix exists to remove.
      - uses: actions/checkout@v7
        # A warn-only job must not go red because a checkout blipped. The run
        # block below already degrades gracefully when the script is absent,
        # so tolerating this step keeps the never-blocks contract whole
        # (#14718) — same idiom as ssot-coverage.yml and trajectory-eval.yml.
        continue-on-error: true

      - name: Warn only on a runaway PR queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # AUTOBOT_OPEN_PR_CAP (default 40) is the actual limit (#17006):
          # pre-push refuses a push that opens a NEW branch once open PRs
          # (excluding forks/bots) reach it -- tools/git-hooks/pre-push.
          # CLAUDE.md states this under **Never violate** as "Open-PR cap".
          #
          # This workflow is a separate, earlier, warn-only notice. It runs on
          # `opened`/`reopened`, after a PR already exists, so it cannot block
          # anything the way pre-push can -- it only flags a queue depth worth
          # a glance well before the hard cap.
          #
          # This threshold is NOT that cap and must never be read as one. It
          # is a runaway detector: a number high enough that reaching it means
          # something is opening PRs in a loop, or that the merge pipeline has
          # stalled so nothing is draining. Warn-only — it posts a comment and
          # never fails a check.
          #
          # History, because the drift is the lesson: this gate said 10 while
          # CLAUDE.md said 5 and UMBRELLA_PLAN said 5. Three files, three
          # numbers, and the only one that executed was the one nobody had
          # read. If this number ever starts meaning "defer work", delete it
          # rather than tune it.
          RUNAWAY_THRESHOLD=25

          # Count open PRs excluding the one just opened. #14718: if the count
          # itself fails there is no runaway to report, and a warn-only gate
          # must not turn that into a red check — fall back to the quiet path.
          TOTAL=$(gh pr list --repo "$REPO" --state open --json number --jq 'length') \
            || { echo "Could not count open PRs — continuing, this gate never blocks."; TOTAL=0; }
          EXISTING=$(( TOTAL - 1 ))

          echo "Open PRs excluding this one: $EXISTING (runaway threshold $RUNAWAY_THRESHOLD)"

          if [ "$EXISTING" -ge "$RUNAWAY_THRESHOLD" ]; then
            echo "Runaway threshold reached — posting a notice on PR #$PR_NUMBER"

            # #14718: this used to pass `--argjson` to `gh pr list`, which has no
            # such flag — gh took it as the VALUE of `--jq` and errored on the
            # leftovers, killing the step under `set -e` before it could post.
            # The list building now lives in a script so a test can execute it.
            OPEN_LIST=$(bash pipeline-scripts/pr-queue-open-list.sh "$REPO" "$PR_NUMBER") \
              || OPEN_LIST="_(could not list the open PRs — see this job's log)_"

            # Build the comment with an indented printf rather than a column-0
            # heredoc: an unindented heredoc body breaks out of the `run: |` YAML
            # block scalar, making the whole workflow invalid YAML (#9722).
            # shellcheck disable=SC2016  # backticks/$ in single-quoted lines are intentionally literal
            BODY=$(printf '%s\n' \
              "## Notice: $EXISTING open PRs — past the runaway threshold ($RUNAWAY_THRESHOLD)" \
              "" \
              "**This is not a request to defer this PR.** The actual limit is the open-PR cap (\`AUTOBOT_OPEN_PR_CAP\`, default 40), enforced at pre-push against NEW branches only -- pushing more commits to this PR's own branch is never blocked by it." \
              "" \
              "This notice only means the count is high enough to be worth a glance for a *runaway* — something opening PRs in a loop, or a merge pipeline that has stalled so nothing is draining." \
              "" \
              "**Currently open:**" \
              "$OPEN_LIST" \
              "" \
              "**If the queue is draining normally, ignore this.** Otherwise:" \
              '1. Check whether CI is dispatching at all — see the `ci-dispatch-watchdog` status on these PRs' \
              '2. Merge the ones whose CI has finished and review has passed: `gh pr merge <number> --squash --delete-branch`' \
              "3. Look for a loop opening near-identical PRs" \
              "" \
              '> Warn-only runaway detector — `.github/workflows/pr-queue-gate.yml`. It never blocks a merge.')

            # Warn-only is a contract, so enforce it in code rather than only
            # asserting it in prose: a detector whose own failure can redden a
            # required check is worse than no detector at all (#14718).
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY" \
              || echo "Could not post the runaway notice — continuing, this gate never blocks."
          else
            echo "No runaway — $EXISTING open PRs, below the $RUNAWAY_THRESHOLD threshold"
          fi
