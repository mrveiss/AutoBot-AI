name: PR Queue Gate

on:
  pull_request:
    types: [opened, reopened]

jobs:
  check-pr-limit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Warn when PR queue is full
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Single source of the number is CLAUDE.md 'PR queue limit'. Raised
          # from 5 to 8 on 2026-08-02 (owner-approved): the figure was set when
          # python-suite took ~51 minutes and now takes ~11 after sharding, so
          # the old limit idled finished work instead of protecting the runner.
          # This gate had drifted to 10 while CLAUDE.md still said 5 — two
          # numbers, neither enforced. They are one number now.
          LIMIT=8

          # Count open PRs excluding the one just opened
          TOTAL=$(gh pr list --repo "$REPO" --state open --json number --jq 'length')
          EXISTING=$(( TOTAL - 1 ))

          echo "Existing open PRs (excluding this one): $EXISTING / $LIMIT"

          if [ "$EXISTING" -ge "$LIMIT" ]; then
            echo "Queue is full — posting warning on PR #$PR_NUMBER"

            # shellcheck disable=SC2016  # $skip is a jq variable, not a shell variable
            OPEN_LIST=$(gh pr list \
              --repo "$REPO" \
              --state open \
              --json number,title \
              --jq --argjson skip "$PR_NUMBER" \
              '[.[] | select(.number != $skip) | "- #\(.number) \(.title)"] | join("\n")')

            # Build the comment with an indented printf rather than a column-0
            # heredoc: an unindented heredoc body breaks out of the `run: |` YAML
            # block scalar, making the whole workflow invalid YAML (#9722).
            # shellcheck disable=SC2016  # backticks/$ in single-quoted lines are intentionally literal
            BODY=$(printf '%s\n' \
              "## ⚠️ PR Queue Warning: $EXISTING/$LIMIT PRs Already Open" \
              "" \
              "This PR was opened while the queue is at capacity. **Please do not merge new work until existing PRs are reviewed and merged first.**" \
              "" \
              "**Open PRs to clear:**" \
              "$OPEN_LIST" \
              "" \
              "**Action required (agent or author):**" \
              "1. Check CI status on each open PR above" \
              '2. Merge any that are green: `gh pr merge <number> --squash --delete-branch`' \
              "3. Fix CI on failing ones if straightforward" \
              "4. Only then should this PR proceed to review/merge" \
              "" \
              '> Queue gate enforced by `.github/workflows/pr-queue-gate.yml`')

            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"
          else
            echo "Queue OK — $EXISTING/$LIMIT open PRs"
          fi
