# Security Scanning workflow
#
# Security checks are blocking — failures prevent merge (Issue #2874).
#
# #13543 — PER-SCANNER GATING DECISIONS. Every scanner below used to end in
# `|| true`, so `Dependency Security Scan` and `Static Application Security
# Testing (SAST)` could go red only on checkout, toolchain setup or dependency
# install. The names claimed a substantive control; a green tick meant nothing
# about security. Each scanner now runs its report through
# `pipeline-scripts/security_scan_gate.py`, which fails the step on findings
# beyond a RECORDED allowance and writes a severity table to the job summary.
#
# The backlog was measured before each decision, not assumed:
#
#   | scanner   | backlog measured        | decision                            |
#   |-----------|-------------------------|-------------------------------------|
#   | bandit    | 0 findings, all severities, against `.bandit` over the three
#   |           | scanned trees           | GATES at `any`, no allowance        |
#   | pip-audit | 4 advisories, all in chromadb==1.5.9 (run 32834864623)
#   |           |                         | GATES at `any`, 4 named allowances  |
#   | npm audit | 0 advisories at every severity across 1191 deps (#13400),
#   |           | re-confirmed by the same run
#   |           |                         | GATES at `high`, no allowance       |
#   | safety    | not measurable in CI — unauthenticated `safety check` is
#   |           | deprecated upstream and needs an API key
#   |           |                         | REPORT ONLY, stated in the summary  |
#   | flake8    | 24,256 findings (23,758 E501, 500 E402) over the same trees
#   |           |                         | REPORT ONLY, stated in the summary  |
#   | semgrep   | gates already (#6597)   | unchanged                           |
#
# A `|| true` on a SCANNER line is fine and deliberate: the scanner's own exit
# code only says "findings exist", which is the gate's job to judge, and the
# scanner must still write its report. A `|| true` on a GATE line is the defect
# this issue is about — `pipeline-scripts/security_scan_gate_test.py` fails the
# build if one is ever added.
#
# ALLOWANCES ARE NAMED, NOT COUNTED. `--allow-id` tolerates one specific
# advisory; there is deliberately no "tolerate N findings" knob, because four
# fixed advisories replaced by four new ones passes such a gate without a word.
# An allowance the scanner no longer reports FAILS the step, so the list is
# forced to shrink as findings are fixed and cannot rot into a blanket.
#
# Do NOT relax a gate to clear a red build. A red here means a real finding
# reached the tree; add an allowance only by naming the advisory and recording
# why, exactly as #13400 established.

name: Security Scanning

on:
  push:
    branches: [ main, dev, Dev_new_gui ]
  pull_request:
    branches: [ main, Dev_new_gui ]  # Issue #6597: Semgrep blocks merge on all feature PRs
    # #13388: SAFE — this workflow publishes no required status context (none of
    # the ten on Dev_new_gui comes from here), so skipping the run cannot deadlock
    # a pull request on a check that never reports.
    #
    # Exact UNION of the `python` and `deps` filters in `changes` below, which
    # gate `dependency-security` and `static-analysis`. `compliance-check` is
    # ungated but only greps the three backend package trees and writes counts to
    # the step summary — it has no failure path, so losing it on a pull request
    # that touches none of those trees removes no signal.
    #
    # The `schedule:` trigger below is NOT affected by path filters, so the daily
    # full scan still covers everything unconditionally.
    #
    # #12986: the backend-Python entries below are the canonical
    # `backend-python` set from .github/filters/backend-python-paths.yml. GitHub has no include mechanism for
    # event path filters, so this copy is unavoidable —
    # pipeline-scripts/check_workflow_path_filters.py fails the build if it
    # ever stops matching the canonical set.
    paths:
      - 'autobot-backend/**/*.py'
      - 'autobot-slm-backend/**/*.py'
      - 'autobot_shared/**/*.py'
      - '.github/filters/backend-python-paths.yml'
      - '**/requirements*.txt'
      - 'requirements-ci/**'
      - 'pyproject.toml'
      - 'autobot_shared/pyproject.toml'
      - 'autobot-frontend/package*.json'
      - '.github/workflows/security.yml'
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'


permissions:
  contents: read
  security-events: write

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          # #12986: the `python` and `deps` sets live in the canonical filter
          # file, which defines the backend-Python paths exactly once.
          filters: .github/filters/backend-python-paths.yml

  dependency-security:
    name: Dependency Security Scan
    needs: changes
    # Always run on schedule (daily security scan); gate on `deps` for push/PR.
    if: github.event_name == 'schedule' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
        cache-dependency-path: |
          requirements*.txt
          autobot-backend/requirements*.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install pip-audit bandit safety
        # Use CI-safe requirements (excludes vllm and other GPU-dependent packages)
        python -m pip install -r requirements-ci.txt --prefer-binary || {
          echo "::error::Some dependencies failed to install — security tools may be incomplete"
          exit 1
        }

    # GATES (#13543). pip-audit reports no severity field at all, so the gate
    # runs at `any` — filtering by a severity the tool never emits would pass
    # everything through while looking like a threshold.
    #
    # MEASURED BACKLOG: 4 advisories, every one of them in `chromadb==1.5.9`
    # (PYSEC-2026-311, CVE-2026-45830, CVE-2026-45831, CVE-2026-45833). They are
    # named individually below rather than absorbed by a count, so a FIFTH
    # advisory — or a different advisory in a different package — turns this step
    # red on the run it appears. An allowance the scanner has stopped reporting
    # also fails, so this list must shrink as the fix lands. Bumping chromadb is
    # tracked as #15052: it is a core RAG dependency and the bump needs its own
    # verification, not a line in a CI-wiring change.
    #
    # #15520 — PYSEC-2026-3740 (CVE-2026-81726, GHSA-8mgp-746c-j5xp) against
    # `nltk<=3.10.3` is a fifth allowance, added deliberately rather than fixed
    # by a bump: the nltk security advisory records `first_patched_version:
    # null` — there is no fixed release to bump to. The finding is a pathsec
    # bypass in `TransitionParser`, `AveragedPerceptron`, `PerceptronTagger`
    # and the maxent save/load helpers; grepping the tree for `import nltk` /
    # `from nltk` across autobot-backend, autobot-slm-backend and
    # autobot_shared returns no matches — nothing in this repository imports
    # nltk at all, so none of the vulnerable model-persistence APIs are ever
    # called and pathsec enforcement (opt-in, off by default upstream) is
    # never reached from AutoBot code. RE-CHECK BY 2026-12-01: re-run
    # `pip-audit` for a patched nltk release and remove this allowance the
    # moment the scanner stops reporting it (an allowance the scanner no
    # longer reports fails the step, so removal is enforced, not optional).
    - name: Python Dependency Audit
      run: |
        set -euo pipefail
        # `|| true` on the SCANNER only: its non-zero exit merely means
        # "advisories exist", which the gate below is what judges. The report
        # must still be written, and an absent report is a hard failure there.
        pip-audit --format=json --output=python-audit.json || true
        python3 pipeline-scripts/security_scan_gate.py \
          --format pip-audit \
          --report python-audit.json \
          --title "Python dependency audit (pip-audit)" \
          --fail-on any \
          --allow-id PYSEC-2026-311 \
          --allow-id CVE-2026-45830 \
          --allow-id CVE-2026-45831 \
          --allow-id CVE-2026-45833 \
          --allow-id PYSEC-2026-3740

    # REPORT ONLY, and the step name says so (#13543). `safety check` without
    # credentials is deprecated upstream and cannot be relied on to produce a
    # verdict in CI, so gating on it would gate on whether an unauthenticated
    # call happened to succeed. Its advisory source is the same PyPI data
    # pip-audit already gates on above, so nothing is ungated by this decision —
    # what changes is that the step no longer reads as a control it is not.
    - name: Safety Check (report only — does not gate)
      # #13543: `!cancelled()` so an earlier scanner's GATE failing does not skip
      # this one. Before the gates existed no scanner could fail, so ordering was
      # free; now a bandit finding would otherwise hide every later scanner's
      # result — the same decoupling ci.yml applies between its suites (#13300).
      if: ${{ !cancelled() }}
      run: |
        {
          echo "## Safety Security Report (report only)"
          echo
          echo "**This step does not gate.** Unauthenticated \`safety check\` is deprecated"
          echo "upstream; the same advisories are gated by pip-audit above (#13543)."
        } >> "$GITHUB_STEP_SUMMARY"
        safety check --json --output safety-report.json || true
        safety check || true

    - name: Setup Node.js
      # #13543: `!cancelled()` so an earlier scanner's GATE failing does not skip
      # this one. Before the gates existed no scanner could fail, so ordering was
      # free; now a bandit finding would otherwise hide every later scanner's
      # result — the same decoupling ci.yml applies between its suites (#13300).
      if: ${{ !cancelled() }}
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: autobot-frontend/package-lock.json

    - name: Install Frontend dependencies
      # #13543: `!cancelled()` so an earlier scanner's GATE failing does not skip
      # this one. Before the gates existed no scanner could fail, so ordering was
      # free; now a bandit finding would otherwise hide every later scanner's
      # result — the same decoupling ci.yml applies between its suites (#13300).
      if: ${{ !cancelled() }}
      # #13410: no CI job runs Cypress (only `test:e2e` needs the binary), so
      # skip the ~100MB CDN download — a Cypress CDN 504 must never red out a
      # required check. Local dev `npm ci` is unaffected and still gets it.
      env:
        CYPRESS_INSTALL_BINARY: '0'
      run: |
        cd autobot-frontend
        npm ci

    # GATES at high/critical (#13543). Backlog measured at 0 advisories across
    # every severity over 1191 dependencies when #13400 armed the same lockfile
    # in frontend-test.yml. The duplication with that job is deliberate: this
    # workflow also runs on a daily `schedule`, where frontend-test.yml does not.
    - name: Node.js Dependency Audit
      # #13543: `!cancelled()` so an earlier scanner's GATE failing does not skip
      # this one. Before the gates existed no scanner could fail, so ordering was
      # free; now a bandit finding would otherwise hide every later scanner's
      # result — the same decoupling ci.yml applies between its suites (#13300).
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        # Subshell rather than a bare `cd`, so the gate below is invoked on the
        # canonical repo-root path — a `../` prefix here would be a script
        # reference that repo-root path checks cannot resolve.
        ( cd autobot-frontend && npm audit --audit-level=moderate --json > npm-audit.json ) || true
        python3 pipeline-scripts/security_scan_gate.py \
          --format npm-audit \
          --report autobot-frontend/npm-audit.json \
          --title "Frontend dependency audit (npm audit)" \
          --fail-on high

    - name: Upload Security Reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: dependency-security-reports
        path: |
          python-audit.json
          safety-report.json
          autobot-frontend/npm-audit.json
        retention-days: 30

    - name: Cleanup
      if: always()
      run: |
        rm -rf .venv || true

  static-analysis:
    name: Static Application Security Testing (SAST)
    needs: changes
    # Always run on schedule (daily SAST scan); gate on `python` for push/PR.
    if: github.event_name == 'schedule' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
        cache-dependency-path: |
          requirements*.txt
          autobot-backend/requirements*.txt

    - name: Install SAST tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install bandit semgrep flake8 pylint

    # GATES (#13543). Backlog measured at 0 findings at every severity, running
    # `bandit -c .bandit -r autobot-backend/ autobot-slm-backend/ autobot_shared/`
    # — the exact invocation below — immediately before the gate was armed, so
    # arming it broke no open pull request and needed no triage campaign.
    #
    # A new finding here is a real one. Fix it, or suppress it at the call site
    # with a specific-ID `# nosec` and a stated reason, which is the convention
    # `.bandit` already documents. Do not re-add `|| true`.
    - name: Bandit Security Linter
      run: |
        set -euo pipefail
        # `|| true` on the SCANNER only — bandit exits non-zero when it finds
        # anything, and the gate below is what turns that into a verdict.
        python3 -m bandit -c .bandit -r autobot-backend/ autobot-slm-backend/ autobot_shared/ -f json -o bandit-report.json || true
        python3 pipeline-scripts/security_scan_gate.py \
          --format bandit \
          --report bandit-report.json \
          --title "Static analysis (bandit)" \
          --fail-on any

    - name: Semgrep SAST Scan
      # #13543: `!cancelled()` so an earlier scanner's GATE failing does not skip
      # this one. Before the gates existed no scanner could fail, so ordering was
      # free; now a bandit finding would otherwise hide every later scanner's
      # result — the same decoupling ci.yml applies between its suites (#13300).
      if: ${{ !cancelled() }}
      # Blocking: exits non-zero when ERROR-severity findings are present.
      # Uses only local .semgrep/rules.yaml — community configs (p/python,
      # p/secrets) require SEMGREP_APP_TOKEN and are not available in CI.
      # semgrep.sarif is pre-initialised so the upload step always has a file.
      run: |
        set -euo pipefail
        echo "## Semgrep Security Analysis" >> "$GITHUB_STEP_SUMMARY"
        # Pre-initialise so the SARIF upload step succeeds even if semgrep exits
        # early (e.g. config error) before writing its own output file.
        echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif
        semgrep \
          --config=.semgrep/rules.yaml \
          --severity ERROR \
          --sarif \
          --output=semgrep.sarif \
          --error \
          autobot-backend/ autobot-slm-backend/ autobot_shared/
        semgrep \
          --config=.semgrep/rules.yaml \
          --json \
          --output=semgrep-report.json \
          autobot-backend/ autobot-slm-backend/ autobot_shared/ || true

    - name: Upload Semgrep SARIF to GitHub Security tab
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v3
      if: always()
      with:
        sarif_file: semgrep.sarif
        category: semgrep

    # REPORT ONLY, and the step name says so (#13543). Measured backlog over the
    # same three trees: 24,256 findings, of which 23,758 are E501 and 500 are
    # E402. Gating that would red every pull request on day one, so the honest
    # move is to keep it non-blocking, print the count where it is visible, and
    # say in the summary that the step is not a verdict. Draining the backlog is
    # its own work, not a `|| true` hidden behind a confident step name.
    - name: Python Lint Report (report only — does not gate)
      # #13543: `!cancelled()` so an earlier scanner's GATE failing does not skip
      # this one. Before the gates existed no scanner could fail, so ordering was
      # free; now a bandit finding would otherwise hide every later scanner's
      # result — the same decoupling ci.yml applies between its suites (#13300).
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        python3 -m flake8 autobot-backend/ autobot-slm-backend/ autobot_shared/ --max-line-length=88 --extend-ignore=E203,W503 \
          --output-file=flake8-report.txt || true
        python3 pipeline-scripts/security_scan_gate.py \
          --format flake8 \
          --report flake8-report.txt \
          --title "Python lint report (flake8)" \
          --fail-on never

    - name: Secret Detection
      # #13543: `!cancelled()` so an earlier scanner's GATE failing does not skip
      # this one. Before the gates existed no scanner could fail, so ordering was
      # free; now a bandit finding would otherwise hide every later scanner's
      # result — the same decoupling ci.yml applies between its suites (#13300).
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        set -euo pipefail
        echo "## Secret Detection" >> "$GITHUB_STEP_SUMMARY"
        # Check for common secret patterns (without Docker)
        echo "Scanning for potential secrets..."

        # Check for hardcoded API keys, passwords, tokens
        SECRETS_FOUND=0

        # Check for AWS keys
        if grep -rE "AKIA[0-9A-Z]{16}" --exclude="*_test.py" --exclude="test_*.py" autobot-backend/ autobot-slm-backend/ autobot_shared/ 2>/dev/null; then
          echo "::error::Potential AWS access key found"
          SECRETS_FOUND=$((SECRETS_FOUND + 1))
        fi

        # Check for private keys
        if grep -rE "-----BEGIN (RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----" autobot-backend/ autobot-slm-backend/ autobot_shared/ 2>/dev/null; then
          echo "::error::Potential private key found"
          SECRETS_FOUND=$((SECRETS_FOUND + 1))
        fi

        # Check for common password patterns in code (excluding tests)
        if grep -rE "password\s*=\s*['\"][^'\"]{8,}['\"]" autobot-backend/ autobot-slm-backend/ autobot_shared/ --include="*.py" 2>/dev/null | grep -v "test\|example\|placeholder"; then
          echo "::error::Potential hardcoded password found"
          SECRETS_FOUND=$((SECRETS_FOUND + 1))
        fi

        if [ "$SECRETS_FOUND" -eq 0 ]; then
          echo "No obvious secrets detected" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::error::Found $SECRETS_FOUND potential secret(s) — review required"
          echo "Found $SECRETS_FOUND potential secret(s) — please review" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Upload SAST Reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: sast-security-reports
        path: |
          bandit-report.json
          semgrep-report.json
          semgrep.sarif
          flake8-report.txt
        retention-days: 30

    - name: Cleanup
      if: always()
      run: |
        rm -rf .venv || true

  compliance-check:
    name: Security Compliance Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Check for Security Files
      run: |
        echo "## Security Compliance Check" >> "$GITHUB_STEP_SUMMARY"

        # Check for required security files
        files=(
          ".gitignore"
          "requirements.txt"
        )

        missing_files=()
        for file in "${files[@]}"; do
          if [ ! -e "$file" ]; then
            missing_files+=("$file")
          fi
        done

        if [ ${#missing_files[@]} -eq 0 ]; then
          echo "All required security files present" >> "$GITHUB_STEP_SUMMARY"
        else
          {
            echo "Missing security files:"
            printf '%s\n' "${missing_files[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Security Best Practices Check
      shell: bash
      run: |
        set -euo pipefail
        echo "## Security Best Practices" >> "$GITHUB_STEP_SUMMARY"

        # Check for security-related imports
        # shellcheck disable=SC2126
        security_imports=$(grep -r "hashlib\|secrets\|cryptography\|bcrypt" autobot-backend/ autobot-slm-backend/ autobot_shared/ | wc -l)
        echo "Security-related imports found: $security_imports" >> "$GITHUB_STEP_SUMMARY"

        # Check for input validation patterns
        # shellcheck disable=SC2126
        validation_patterns=$(grep -r "validator\|sanitize\|escape\|validate" autobot-backend/ autobot-slm-backend/ autobot_shared/ | wc -l)
        echo "Input validation patterns found: $validation_patterns" >> "$GITHUB_STEP_SUMMARY"

        # Check for error handling
        # shellcheck disable=SC2126
        error_handling=$(grep -r "try:\|except\|raise" autobot-backend/ autobot-slm-backend/ autobot_shared/ | wc -l)
        echo "Error handling patterns found: $error_handling" >> "$GITHUB_STEP_SUMMARY"

  security-summary:
    name: Security Summary Report
    runs-on: ubuntu-latest
    needs: [changes, dependency-security, static-analysis, compliance-check]
    if: always()

    steps:
    - name: Download all security reports
      uses: actions/download-artifact@v8

    # #13516: `github.ref_name` / `github.sha` through `env:`. Neither is
    # attacker-settable here — on `pull_request` these resolve to the PR number,
    # not the fork's branch name — so this is defence in depth, fixed as a pair.
    - name: Generate Security Summary
      env:
        REF_NAME: ${{ github.ref_name }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        {
          echo "# Security Scan Summary"
          echo ""
          echo "**Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "**Branch:** $REF_NAME"
          echo "**Commit:** $COMMIT_SHA"
          echo ""
        } > security-summary.md

        # Check if reports exist and summarize
        if [ -d "dependency-security-reports" ]; then
          {
            echo "## Dependency Security"
            echo "- Python audit completed"
            echo "- Node.js audit completed"
            echo ""
          } >> security-summary.md
        fi

        if [ -d "sast-security-reports" ]; then
          {
            echo "## Static Analysis Security Testing"
            echo "- Bandit security linting completed"
            echo "- Semgrep security analysis completed"
            echo "- Secret detection completed"
            echo ""
          } >> security-summary.md
        fi

        {
          echo "## Recommendations"
          echo "1. Review all security reports for critical findings"
          echo "2. Update dependencies with known vulnerabilities"
          echo "3. Address any SAST findings in critical code paths"
        } >> security-summary.md

    - name: Upload Security Summary
      uses: actions/upload-artifact@v7
      with:
        name: security-summary
        path: security-summary.md
        retention-days: 90
