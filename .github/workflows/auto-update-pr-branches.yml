# Auto-update PR branches when Dev_new_gui advances
#
# Whenever Dev_new_gui receives a push (merge, direct commit),
# this workflow finds every open PR targeting Dev_new_gui that is
# behind the base and merges the base into it automatically.
# Eliminates the manual "Update branch" click and prevents stale
# merge-conflict surprises at review time.
#
# See: #9300 post-mortem — direct hotfixes on main caused drift

name: Auto-update PR branches

on:
  push:
    branches:
      - Dev_new_gui

jobs:
  auto-update:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15  # #11077: fail fast (self-hosted); not GitHub's 24h default
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Install GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
          fi

      - name: Update out-of-date PR branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Dev_new_gui was updated — checking open PRs for staleness..."

          # List all open PRs targeting Dev_new_gui that are behind.
          # .number is always a GitHub-assigned integer — safe to iterate.
          #
          # #12801: this used `--json number,behindBy`, but `behindBy` is not a
          # field the installed gh exposes — it exits non-zero with "Unknown JSON
          # field". Because this is an assignment from a command substitution and
          # Actions runs `run:` under `bash -e`, that aborted the whole step here,
          # before the `exit 0` below could apply. Net effect: the workflow never
          # updated a single branch, so every stale PR needed the manual "Update
          # branch" click this job exists to remove.
          #
          # #12818: do NOT filter on mergeStateStatus. It is computed LAZILY by
          # GitHub, and immediately after a push — exactly when this workflow
          # fires — it comes back UNKNOWN for the very PRs that just went stale.
          # The filter then matched nothing, the script took the "all up to
          # date" branch and exited 0, so the job went GREEN while updating
          # nothing. That is worse than the #12801 crash: a passing check
          # asserting work that never happened.
          #
          # `compare/{base}...{head}` is evaluated on demand and is always
          # accurate at push time, so no retry loop is needed.
          # `|| true` on each call keeps a transient API failure from
          # re-introducing the abort-before-exit-0 behaviour.
          OPEN_PRS=$(gh pr list \
            --repo "$REPO" \
            --base Dev_new_gui \
            --state open \
            --json number,headRefName \
            --jq '.[] | "\(.number) \(.headRefName)"' || true)

          OUTDATED=""
          while read -r PR HEAD_REF; do
            [ -n "$PR" ] || continue
            # $HEAD_REF is interpolated into an API PATH, so validate it the same
            # way $PR is validated numerically below. A branch may legitimately
            # contain '/', '.', '-' and '_', but '..' would traverse to a
            # different endpoint — reject anything outside that charset or
            # containing a dot-dot segment.
            case "$HEAD_REF" in
              ''|*..*|-*) echo "  Skipping unsafe head ref for PR #$PR"; continue ;;
            esac
            if ! printf '%s' "$HEAD_REF" | grep -qE '^[A-Za-z0-9._/-]+$'; then
              echo "  Skipping unsafe head ref for PR #$PR"
              continue
            fi
            BEHIND=$(gh api \
              "repos/$REPO/compare/Dev_new_gui...$HEAD_REF" \
              --jq '.behind_by' 2>/dev/null || echo "")
            case "$BEHIND" in
              ''|0) ;;
              *) OUTDATED="$OUTDATED $PR"; echo "  PR #$PR is $BEHIND commit(s) behind" ;;
            esac
          done <<< "$OPEN_PRS"

          if [ -z "$OUTDATED" ]; then
            echo "All PR branches are up to date (or none could be listed)."
            exit 0
          fi

          echo "PRs behind Dev_new_gui: $(echo "$OUTDATED" | tr '\n' ' ')"

          UPDATED=0
          FAILED=0
          for PR in $OUTDATED; do
            # Validate numeric to guard against unexpected jq output
            if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
              echo "  Skipping non-numeric value: $PR"
              continue
            fi
            echo "Updating PR #$PR..."
            # #12801: `gh pr update-branch` does not exist in the installed gh
            # build (same class as the missing `behindBy` field above), so this
            # branch could never have succeeded even if the listing worked. The
            # REST endpoint is always available and is what the "Update branch"
            # button calls; a conflicting PR returns non-2xx and is counted as
            # needing manual resolution rather than failing the job.
            if gh api -X PUT "repos/$REPO/pulls/$PR/update-branch" 2>&1; then
              echo "  ✓ PR #$PR updated"
              UPDATED=$((UPDATED + 1))
            else
              echo "  ✗ PR #$PR failed (conflicts need manual resolution)"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "Done: $UPDATED updated, $FAILED need manual attention."
          # Never fail — conflicting PRs just need human resolution
          exit 0
