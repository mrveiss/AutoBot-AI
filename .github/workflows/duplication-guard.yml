#
# Duplication regression guard (#9794).
#
# Runs the copy-paste detector (jscpd, the `cpd` 5.x CLI) over the backend and
# frontend source with the exact flags used for the 2026-06-10 dedup sweep, and
# fails if the duplication percentage exceeds the documented post-cleanup
# baseline. This is a *threshold* gate, not a "zero duplication" gate: the repo
# carries known, deliberately-deferred clusters (broken security package #9856,
# the Vue CSS/HTML campaign #9859) that need their own PRs. The gate ensures no
# PR grows duplication past where the sweep left it.
#
# Post-cleanup baseline (2026-06-10, after PRs landing #9794):
#   duplication = 1.04%  (14,983 duplicated lines / 776 clones)
# THRESHOLD is set a hair above (1.05) to absorb measurement jitter from minor
# jscpd version drift. When a cleanup PR lowers duplication, tighten THRESHOLD
# in the same PR so the ratchet only ever goes down.
#
# Why --threshold and not bare --exit-code: --exit-code fails whenever ANY
# duplicate exists (always true here), which can't express "no growth past
# baseline". --threshold N exits 1 only when the percentage exceeds N.
#
# Security: no untrusted GitHub event data is interpolated into run: commands;
# all inputs are static repo paths and constants.

name: duplication-guard

on:
  pull_request:
    paths:
      - 'autobot-backend/**/*.py'
      - 'autobot-frontend/src/**/*.ts'
      - 'autobot-frontend/src/**/*.js'
      - 'autobot-frontend/src/**/*.vue'
      # #13044: these three trees were ungated. A PR touching only
      # `autobot_shared/` did not trigger this workflow at all, so the
      # guard reported nothing rather than reporting clean.
      - 'autobot_shared/**/*.py'
      - 'autobot-slm-backend/**/*.py'
      - 'autobot-slm-frontend/src/**/*.ts'
      - 'autobot-slm-frontend/src/**/*.js'
      - 'autobot-slm-frontend/src/**/*.vue'
      - '.github/workflows/duplication-guard.yml'
  push:
    branches: [Dev_new_gui]
    paths:
      - 'autobot-backend/**/*.py'
      - 'autobot-frontend/src/**/*.ts'
      - 'autobot-frontend/src/**/*.js'
      - 'autobot-frontend/src/**/*.vue'
      - 'autobot_shared/**/*.py'
      - 'autobot-slm-backend/**/*.py'
      - 'autobot-slm-frontend/src/**/*.ts'
      - 'autobot-slm-frontend/src/**/*.js'
      - 'autobot-slm-frontend/src/**/*.vue'

# #14434: without this, every push left its predecessors queued. 42 of a 271-run
# sample were for commits no longer at their branch tip - work nothing would ever
# read, each still fetching its actions. During GitHub's 2026-08-17 archive-download
# degradation that wasted load became failures on unrelated pull requests (#14444).
#
# cancel-in-progress is guarded on the event rather than set to a bare `true`:
# #13432 found that cancelling base-branch runs meant each merge cancelled the
# previous merge's verification, and merges arrive faster than a suite completes -
# of 39 completed base runs, 26 were cancelled and NONE succeeded. Six of the
# workflows this was applied to also trigger on push to Dev_new_gui, so the guard
# is load-bearing there and harmless where it is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  duplication-guard:
    runs-on: ubuntu-latest
    env:
      # Maximum allowed duplication percentage. Ratchet DOWN only.
      THRESHOLD: '1.05'
      # #13044: the three trees this guard never scanned get their OWN number
      # rather than being folded into THRESHOLD above. That one is documented
      # "Ratchet DOWN only", and widening its scope would force it up to absorb
      # a population it never measured — which is how a down-only ratchet gets
      # quietly re-licensed. Two scopes, two numbers, each meaning one thing.
      #
      # Measured on this PR's first run — the first time these trees were
      # scanned in the repo's history: 754 files, 134 clones, **1.81%**
      # duplicated lines. Pinned to 1.82, one hundredth above, so the current
      # state passes and any increase fails.
      #
      # Worth recording beside the number: the trees nobody was measuring carry
      # **2.4x** the duplication of the trees that were. The gated scan on the
      # same run reported 4,168 files at 0.74%. That gap is the cost of the
      # blind spot, not a coincidence — and it is why this gets its own ratchet
      # rather than being averaged into THRESHOLD, where 1.81% of a small tree
      # would disappear inside 0.74% of a large one.
      #
      # Ratchet DOWN only, as with THRESHOLD above.
      SLM_THRESHOLD: '1.82'
      JSCPD_VERSION: '5.0.6'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run duplication detector
        run: |
          npx --yes "jscpd@${JSCPD_VERSION}" \
            autobot-backend autobot-frontend/src \
            -k 70 -l 8 --skip-comments \
            -f python,typescript,javascript,vue \
            -i "**/node_modules/**,**/__pycache__/**,**/tests/**,**/test_*,**/*_test.py,**/*.test.ts,**/__tests__/**,**/*.stories.*,**/generated/**,**/migrations/**,**/mocks/**,**/i18n/**" \
            -r threshold,console \
            --threshold "${THRESHOLD}"

      - name: Run duplication detector on the previously ungated trees
        run: |
          set -o pipefail
          npx --yes "jscpd@${JSCPD_VERSION}" \
            autobot_shared autobot-slm-backend autobot-slm-frontend/src \
            -k 70 -l 8 --skip-comments \
            -f python,typescript,javascript,vue \
            -i "**/node_modules/**,**/__pycache__/**,**/tests/**,**/test_*,**/*_test.py,**/*.test.ts,**/__tests__/**,**/*.stories.*,**/generated/**,**/migrations/**,**/mocks/**,**/i18n/**" \
            -r console 2>&1 | tee /tmp/slm-dup.log

      - name: Gate the previously ungated trees
        run: |
          if [ "${SLM_THRESHOLD}" = "UNMEASURED" ]; then
            echo "::error::SLM_THRESHOLD is still UNMEASURED. The scan above printed"
            echo "the real figure for autobot_shared + autobot-slm-backend +"
            echo "autobot-slm-frontend/src. Pin SLM_THRESHOLD to it (rounded UP"
            echo "to 2dp). This step exists so an unmeasured threshold cannot"
            echo "land as a guard that never fails."
            exit 1
          fi
          npx --yes "jscpd@${JSCPD_VERSION}" \
            autobot_shared autobot-slm-backend autobot-slm-frontend/src \
            -k 70 -l 8 --skip-comments \
            -f python,typescript,javascript,vue \
            -i "**/node_modules/**,**/__pycache__/**,**/tests/**,**/test_*,**/*_test.py,**/*.test.ts,**/__tests__/**,**/*.stories.*,**/generated/**,**/migrations/**,**/mocks/**,**/i18n/**" \
            -r threshold,console \
            --threshold "${SLM_THRESHOLD}"

      - name: Explain failure
        if: failure()
        run: |
          echo "::error::A duplication scope exceeded its baseline. There are TWO,"
          echo "and this step cannot tell which failed — read the step above."
          echo "  THRESHOLD=${THRESHOLD}%      autobot-backend + autobot-frontend/src"
          echo "  SLM_THRESHOLD=${SLM_THRESHOLD}%  autobot_shared + autobot-slm-backend + autobot-slm-frontend/src"
          echo "Reduce duplication (extract shared modules / shims) or, if the new"
          echo "duplication is unavoidable and justified, raise the ONE that failed"
          echo "in .github/workflows/duplication-guard.yml with a documented reason."
          echo "See docs/reports/DEDUP_REPORT.md and the dedup methodology in #9794."
