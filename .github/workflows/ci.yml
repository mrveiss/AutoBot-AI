# AutoBot CI/CD Pipeline

name: AutoBot CI/CD Pipeline

on:
  push:
    branches: [ main, Dev_new_gui ]
  pull_request:
    # Dev_new_gui is the integration branch every PR targets; without it the
    # backend suite below only ran post-merge on the push trigger, so backend
    # regressions were only discovered once already on the shared branch
    # (#10691). main kept for promotion PRs.
    branches: [ main, Dev_new_gui ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - '**/requirements*.txt'
              - 'requirements-ci/**'
              - 'pyproject.toml'
              - 'autobot_shared/pyproject.toml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'autobot-frontend/**'
              - '.github/workflows/ci.yml'

  python-suite:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    # #13045: without an explicit budget this job inherits GitHub's 6-hour
    # default, so a wedged suite reads as "still running" for most of a day and
    # the required context never reports. 150 minutes is comfortably above the
    # measured ~51-minute backend invocation plus the slm-backend invocation
    # that #13300 restored, and fails visibly instead of hanging.
    timeout-minutes: 150

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
        cache-dependency-path: |
          requirements*.txt
          autobot-backend/requirements*.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel

        echo "Installing CI-safe requirements..."
        python -m pip install -r requirements-ci.txt --prefer-binary

        echo "Installing testing dependencies..."
        python -m pip install pytest pytest-asyncio pytest-cov pytest-xdist==3.8.0 'fakeredis[lua]' flake8 black isort mypy bandit

    - name: Create necessary directories and config files
      run: |
        mkdir -p data logs static config
        touch data/.gitkeep logs/.gitkeep static/.gitkeep

        # Create minimal config.yaml for CI testing
        cat > config/config.yaml << 'EOF'
        # CI Testing Configuration
        llm:
          orchestrator_llm: "mock"
          task_llm: "mock"
          ollama:
            model: "mock-model"
            models: {}
          unified:
            embedding:
              providers:
                ollama:
                  selected_model: "mock-embed"

        deployment:
          mode: "local"

        data:
          reliability_stats_file: "data/reliability_stats.json"

        diagnostics:
          enabled: false
          use_llm_for_analysis: false
          use_web_search_for_analysis: false
          auto_apply_fixes: false

        redis:
          host: "localhost"
          port: 6379
          db: 0
        EOF

    # Static checks (black / isort / flake8 / bandit) deliberately live in
    # code-quality.yml, NOT here (#13162). They were duplicated across both
    # workflows over the same three trees; code-quality.yml's bandit has no
    # severity floor where this one filtered to medium+, so it is the stricter
    # of the two and nothing is lost by removing this copy. Keeping them here
    # also meant four checks that finish in minutes were gated behind a
    # ~105-minute pytest run in the same job.

    # #13300: these two invocations used to live in ONE `run:` block. GitHub's
    # default shell is `bash -e`, so the first invocation's non-zero exit on the
    # standing failures aborted the step and the second NEVER executed. The job
    # log contained exactly one "test session starts" and 50m40s of pytest
    # inside a 50m55s step. Consequences: autobot-slm-backend unit tests had
    # never run in CI at all, `--cov-fail-under=70` on the second invocation
    # never evaluated despite the comment claiming enforcement, and coverage.xml
    # was never produced so the upload step had no input.
    #
    # Two separate steps with `!cancelled()` on the second decouple them: each
    # reports its own conclusion in the job UI, both contribute to the job
    # result, and neither can silently swallow the other. `!cancelled()` rather
    # than `always()` so a cancelled job (concurrency, timeout) stops promptly
    # instead of starting another hour of pytest.
    - name: Run unit tests — backend, shared, tts-worker, repo_tests
      run: |
        echo "Running unit tests for autobot-backend / autobot_shared / autobot-tts-worker / repo_tests..."
        # Run all unit tests excluding slow/integration/distributed/performance
        # markers. Those markers are NOT a way to retire a test: marker-tests.yml
        # runs exactly the excluded set on a schedule (#13286).
        # -n auto --dist loadscope parallelizes across workers (#10398); pytest-cov
        # auto-combines per-worker coverage, and loadscope keeps same-module tests
        # on one worker so shared-fixture/ordering behaviour matches serial.
        #
        # #13084: two SEPARATE pytest invocations, not one combined session.
        # autobot-backend/ and autobot-slm-backend/ each define top-level
        # packages with identical names (api, services, user_management,
        # middleware, migrations). Collecting both in one interpreter session
        # makes whichever backend's file collects first bind that dotted name
        # in sys.modules for the rest of the session, breaking the other
        # backend's own tests (~95% of a full single-session run's collection
        # errors — see #13084). A fresh interpreter per invocation eliminates
        # the collision entirely; --cov-append on the second merges coverage
        # across both. This does NOT add a second CI job (the singleton
        # self-hosted runner concern from #10691) — both invocations run
        # sequentially in this same ubuntu-latest job.
        python -m pytest \
          autobot-backend autobot_shared autobot-tts-worker repo_tests \
          -n auto --dist loadscope \
          -m "not integration and not slow and not distributed and not performance" \
          --cov=autobot-backend \
          --cov=autobot_shared \
          --cov-report= \
          --tb=short \
          --durations=25 \
          --durations-min=10.0 \
          -q

    - name: Run unit tests with coverage gate — slm-backend
      # Runs even when the invocation above failed: it is a separate interpreter
      # testing a separate tree, and it carries the combined coverage gate and
      # the only coverage.xml producer (#13300).
      if: ${{ !cancelled() }}
      run: |
        echo "Running unit tests for autobot-slm-backend with the 70% coverage gate (#3285)..."
        # --cov-append merges this tree's coverage onto the data written by the
        # previous step, so --cov-fail-under=70 is evaluated against the WHOLE
        # suite, not just slm-backend. This is the only place the gate runs; if
        # it is ever removed, remove the claim in pytest.ini's [coverage:report]
        # too rather than leaving a comment asserting enforcement that does not
        # happen.
        python -m pytest \
          autobot-slm-backend \
          -n auto --dist loadscope \
          -m "not integration and not slow and not distributed and not performance" \
          --cov=autobot-slm-backend \
          --cov-append \
          --cov-report=xml:coverage.xml \
          --cov-report=term-missing \
          --cov-fail-under=70 \
          --tb=short \
          --durations=25 \
          --durations-min=10.0 \
          -q

    - name: Run integration tests
      # #13300: previously skipped whenever the unit steps failed, so the
      # directory-based integration suite went unreported for as long as the
      # unit suite was red.
      if: ${{ !cancelled() }}
      run: |
        echo "🔄 Running integration tests..."
        # Integration tests remain in shared directory (#734)
        TEST_DIR="infrastructure/shared/tests/integration"
        if [ -d "$TEST_DIR" ]; then
          python -m pytest "$TEST_DIR" -v --tb=short --maxfail=5
        else
          echo "⚠️ No integration test directory found - skipping"
        fi

    - name: Upload coverage reports
      # #13300: coverage.xml is produced by the slm-backend step above even when
      # tests fail; skipping the upload on failure discarded it.
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Cleanup
      if: always()
      run: |
        rm -rf .venv || true

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: autobot-frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd autobot-frontend
        npm ci

    - name: Run frontend linting
      run: |
        cd autobot-frontend
        npm run lint

    - name: Check i18n keys
      run: |
        cd autobot-frontend
        npm run check:i18n

    - name: Run frontend type checking
      env:
        # Baseline from #7227: known type-debt. Same gate as frontend-typecheck-regression.yml.
        BASELINE: 240
      run: |
        cd autobot-frontend
        set +e
        ERRORS=$(npx vue-tsc --noEmit -p tsconfig.app.json 2>&1 | grep -cE "error TS")
        echo "Type error baseline: $BASELINE  current: $ERRORS"
        if [ "$ERRORS" -gt "$BASELINE" ]; then
          echo "Regression: $ERRORS > $BASELINE type errors"
          exit 1
        fi
        echo "Type check passed ($ERRORS errors within baseline of $BASELINE)"

    - name: Build frontend
      run: |
        cd autobot-frontend
        npm run build

    - name: Run frontend unit tests with coverage gate
      run: |
        cd autobot-frontend
        # test:coverage enforces 70% threshold via vitest.config.ts thresholds (#3285)
        npm run test:coverage

    - name: Cleanup
      if: always()
      run: |
        rm -rf autobot-frontend/node_modules autobot-frontend/dist || true

  deployment-check:
    runs-on: ubuntu-latest
    needs: [changes, python-suite, frontend-tests]
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Dev_new_gui') &&
      (needs.python-suite.result == 'success' || needs.python-suite.result == 'skipped') &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped')

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
        cache-dependency-path: |
          requirements*.txt
          autobot-backend/requirements*.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -r requirements-ci.txt --prefer-binary

    - name: Create necessary directories and config files
      run: |
        mkdir -p data logs static config
        touch data/.gitkeep logs/.gitkeep static/.gitkeep

        # Create minimal config.yaml for CI testing
        cat > config/config.yaml << 'EOF'
        # CI Testing Configuration
        llm:
          orchestrator_llm: "mock"
          task_llm: "mock"
          ollama:
            model: "mock-model"
            models: {}
          unified:
            embedding:
              providers:
                ollama:
                  selected_model: "mock-embed"

        deployment:
          mode: "local"

        data:
          reliability_stats_file: "data/reliability_stats.json"

        diagnostics:
          enabled: false
          use_llm_for_analysis: false
          use_web_search_for_analysis: false
          auto_apply_fixes: false

        redis:
          host: "localhost"
          port: 6379
          db: 0
        EOF

    - name: Test production configuration
      run: |
        echo "🚀 Testing production readiness..."

        # Check that all required files exist
        echo "Checking required files..."
        test -f main.py || (echo "❌ main.py missing" && exit 1)
        test -f requirements.txt || (echo "❌ requirements.txt missing" && exit 1)
        echo "✅ All required files present"

        # Test configuration loading (PYTHONPATH includes backend for imports)
        PYTHONPATH="autobot-backend:autobot_shared:$PYTHONPATH" \
          python3 -c 'from config import config; print("Configuration system working")'

        # Test core imports
        PYTHONPATH="autobot-backend:autobot_shared:$PYTHONPATH" \
          python3 -c 'from security_layer import SecurityLayer; from security.secure_command_executor import SecureCommandExecutor; from app_factory import create_app; print("Core imports working")'

    - name: Generate deployment artifact
      run: |
        echo "📦 Generating deployment summary..."
        {
          echo "# AutoBot Deployment Summary"
          echo "Generated at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          echo ""
          echo "## Test Results"
          echo "- ✅ Security tests passed"
          echo "- ✅ Integration tests passed"
          echo "- ✅ Frontend build successful"
          echo ""
          echo "## Security Features"
          echo "- Command execution sandboxing ✅"
          echo "- Risk assessment system ✅"
          echo "- Audit logging ✅"
          echo "- Role-based access control ✅"
          echo "- API security endpoints ✅"
        } > DEPLOYMENT_SUMMARY.md

        cat DEPLOYMENT_SUMMARY.md

    - name: Upload deployment artifact
      uses: actions/upload-artifact@v7
      with:
        name: deployment-summary
        path: DEPLOYMENT_SUMMARY.md

    - name: Cleanup
      if: always()
      run: |
        rm -rf .venv || true

  notify:
    runs-on: ubuntu-latest
    needs: [changes, python-suite, frontend-tests, deployment-check]
    if: always()

    steps:
    - name: Notify results
      run: |
        echo "🎯 CI/CD Pipeline Results:"
        echo "=========================="

        if [ "${{ needs.python-suite.result }}" == "success" ]; then
          echo "✅ Security tests: PASSED"
        else
          echo "❌ Security tests: FAILED"
        fi

        if [ "${{ needs.frontend-tests.result }}" == "success" ]; then
          echo "✅ Frontend tests: PASSED"
        else
          echo "❌ Frontend tests: FAILED"
        fi

        if [ "${{ needs.deployment-check.result }}" == "success" ]; then
          echo "✅ Deployment check: PASSED"
        else
          echo "❌ Deployment check: FAILED"
        fi

        echo ""
        if [ "${{ needs.python-suite.result }}" == "success" ] &&
           [ "${{ needs.frontend-tests.result }}" == "success" ] &&
           [ "${{ needs.deployment-check.result }}" == "success" ]; then
          echo "🎉 All checks passed! AutoBot is ready for deployment."
        else
          echo "⚠️ Some checks failed. Review the logs above."
        fi
