# #7122: Drift guard for frontend TypeScript types generated from
# canonical Python dataclasses.
#
# Runs `gen_frontend_types.py --check`. If the committed
# `autobot-frontend/src/types/_generated/workflow.ts` differs from what
# the script would emit today (i.e. a backend dataclass field was added,
# removed, or retyped without re-running the generator), the job fails
# and asks the contributor to re-run the script and commit.
#
# Catches the same class of drift bug as #7044 (frontend `TemplateStep`
# silently mismatched the backend `to_status_dict()` shape for 18
# months). Codegen + this guard makes the drift impossible to introduce
# silently.
#
# #7226: extended path filter to cover all MANIFEST sources
# (status_enums + workflow_automation models).
# #7269 followup: install pydantic so backend Pydantic-using sources
# (like services/workflow_automation/models.py) load correctly. Source
# files are loaded via spec_from_file_location, bypassing package
# __init__.py, but they still need their direct imports installed.
#
# Security: this workflow does NOT interpolate any untrusted GitHub
# event data (no issue titles, PR bodies, commit messages, head_ref,
# etc.) into run: commands. All inputs are static repo paths.

name: frontend-codegen-drift

on:
  pull_request:
    paths:
      # Canonical sources covered by MANIFEST (#7122 / #7226)
      - 'autobot_shared/workflow/types.py'
      - 'autobot_shared/status_enums.py'
      - 'autobot-backend/services/workflow_automation/models.py'
      # Codegen output + tooling
      - 'autobot-frontend/src/types/_generated/**'
      - 'autobot-infrastructure/shared/scripts/gen_frontend_types.py'
      - '.github/workflows/frontend-codegen-drift.yml'
  push:
    branches: [Dev_new_gui]
    paths:
      - 'autobot_shared/workflow/types.py'
      - 'autobot_shared/status_enums.py'
      - 'autobot-backend/services/workflow_automation/models.py'
      - 'autobot-frontend/src/types/_generated/**'
      - 'autobot-infrastructure/shared/scripts/gen_frontend_types.py'

# #14434: without this, every push left its predecessors queued. 42 of a 271-run
# sample were for commits no longer at their branch tip - work nothing would ever
# read, each still fetching its actions. During GitHub's 2026-08-17 archive-download
# degradation that wasted load became failures on unrelated pull requests (#14444).
#
# cancel-in-progress is guarded on the event rather than set to a bare `true`:
# #13432 found that cancelling base-branch runs meant each merge cancelled the
# previous merge's verification, and merges arrive faster than a suite completes -
# of 39 completed base runs, 26 were cancelled and NONE succeeded. Six of the
# workflows this was applied to also trigger on push to Dev_new_gui, so the guard
# is load-bearing there and harmless where it is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            autobot-backend/requirements*.txt
            autobot-slm-backend/requirements*.txt

      - name: Install minimal codegen deps
        # pydantic is the only non-stdlib import any MANIFEST source file
        # currently needs. Pin to <3 to keep CI fast.
        run: pip install 'pydantic>=2,<3'

      - name: Run codegen drift check
        run: |
          python3 autobot-infrastructure/shared/scripts/gen_frontend_types.py --check
