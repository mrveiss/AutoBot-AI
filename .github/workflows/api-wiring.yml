#
# API Wiring Audit (GH#9851)
# Cross-references every /api/ path the frontend calls against the backend's
# actual route table and flags router modules that exist but are never mounted.
#
# Authoritative mode builds the app and dumps app.openapi(); if the build fails
# in CI it falls back to static (regex) mode so the job still reports.
#
# BLOCKING gate since #9864: the audit's false-positive classes were fixed
# (segment-wise template matching, base-URL strings, websocket routes via
# x-websocket-paths, include_router aggregation chains, comment-line doc
# examples) and the two real drift bugs they masked were fixed with them.
# If this gate goes red, the diff genuinely broke the frontend/backend
# contract — fix the wiring, do not re-add continue-on-error.

name: API Wiring Audit

on:
  push:
    branches: [ main, Dev_new_gui ]
    # No YAML anchor here: #12934 removed the pull_request.paths filter that
    # used to alias it, so naming the anchor now fails actionlint's
    # syntax-check as "defined but not used".
    paths:
      - 'autobot-backend/**/*.py'
      - 'autobot-slm-backend/**/*.py'
      - 'autobot-frontend/src/**'
      - 'scripts/audit_api_wiring.py'
      - 'scripts/api_wiring_baseline.txt'
      - 'requirements*.txt'
      - '.github/workflows/api-wiring.yml'
  pull_request:
    # NOTE: no pull_request.paths filter (#12934). This workflow ALWAYS runs on
    # PRs so its required-check context ("api-wiring") always reports a
    # conclusion. A path-filtered required check simply never triggers, and an
    # absent required context is treated as unsatisfied, not passed — the PR is
    # then permanently blocked and can only land with --admin, which trains the
    # habit of merging past unreported gates. Same fix and reasoning as
    # frontend-test.yml (#10019, #10527). The real audit is gated on the
    # `changes` job below; the `api-wiring-skip` shim (same `name:`) reports the
    # context green when no relevant path was touched.
    branches: [ main, Dev_new_gui ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job 0: detect relevant paths — always runs so the required context reports.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      wiring: ${{ steps.filter.outputs.wiring }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            wiring:
              - 'autobot-backend/**/*.py'
              - 'autobot-slm-backend/**/*.py'
              - 'autobot-frontend/src/**'
              - 'scripts/audit_api_wiring.py'
              - 'scripts/api_wiring_baseline.txt'
              - 'requirements*.txt'
              - '.github/workflows/api-wiring.yml'

  api-wiring:
    needs: changes
    if: needs.changes.outputs.wiring == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: ./.github/actions/setup-python-ci
        with:
          cache-dependency-path: |
            requirements*.txt
            autobot-backend/requirements*.txt
            autobot-slm-backend/requirements*.txt

      - name: Install backend dependencies (best-effort)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-ci.txt --prefer-binary || true

      - name: Install SLM backend dependencies (best-effort)
        # #12381: --dump-slm-openapi imports autobot-slm-backend/main.py, which
        # needs its OWN requirements (croniter, authlib, ldap3, pysaml2, pyotp,
        # ...) — requirements-ci.txt only covers autobot-backend. Without this,
        # the SLM dump always fails ("No module named 'croniter'") and the SLM
        # route union never happens, leaving every getSLMUrl()/slmFetch() call
        # false-flagged as unwired. Best-effort/non-fatal like the step above —
        # dump_slm_openapi() already degrades gracefully if something's still
        # missing (audits against autobot-backend routes only).
        continue-on-error: true
        run: |
          python -m pip install -r autobot-slm-backend/requirements.txt --prefer-binary || true

      - name: Run API wiring audit
        run: |
          set -o pipefail
          mkdir -p data logs static config
          export PYTHONPATH="$PWD:$PWD/autobot-backend:${PYTHONPATH:-}"
          if python scripts/audit_api_wiring.py --dump-openapi openapi.json; then
            echo "::notice::Authoritative OpenAPI dump succeeded — auditing against real route table."

            # #12381: also dump the SLM control-plane backend's route table
            # (separate FastAPI app, :8000) and union it in — otherwise every
            # getSLMUrl()/slmFetch() call is false-flagged as unwired.
            SLM_ARGS=()
            export PYTHONPATH="$PWD:$PWD/autobot-slm-backend:${PYTHONPATH:-}"
            if python scripts/audit_api_wiring.py --dump-slm-openapi slm_openapi.json; then
              echo "::notice::SLM OpenAPI dump succeeded — unioning SLM route table."
              SLM_ARGS=(--slm-openapi slm_openapi.json)
            else
              echo "::warning::SLM app build failed — auditing against autobot-backend routes only."
            fi
            export PYTHONPATH="$PWD:$PWD/autobot-backend:${PYTHONPATH:-}"

            python scripts/audit_api_wiring.py --openapi openapi.json "${SLM_ARGS[@]}" \
              --baseline scripts/api_wiring_baseline.txt --fail-on-unwired
          else
            echo "::warning::App build failed in CI — falling back to static (heuristic) audit."
            python scripts/audit_api_wiring.py
          fi

  # Mutually exclusive with `api-wiring` above, and deliberately sharing its
  # check-context name so a PR always sees exactly one terminal "api-wiring"
  # conclusion — the real audit when wiring-relevant paths changed, an explicit
  # green here when they did not (#12934). Mirrors `unit-tests-skip` in
  # frontend-test.yml (#10527).
  api-wiring-skip:
    name: api-wiring
    needs: changes
    if: needs.changes.outputs.wiring != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: No wiring-relevant changes — reporting required context as success
        run: |
          echo "No backend/frontend/audit-script paths changed in this PR."
          echo "The API wiring audit has nothing to check, so the required"
          echo "'api-wiring' context is reported as success (#12934)."
