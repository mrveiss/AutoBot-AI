#
# Constraint drift guard (#10524).
#
# Shared dependency versions (currently numpy) live in ONE place:
# constraints/shared.txt. Components reference it via `-c <rel>/constraints/shared.txt`
# and list the package bare. This guard fails any PR that re-declares a version for a
# constrained package in a component requirements file — preventing the per-file
# version skew that breaks pip when Ansible co-locates roles on one host and corrupts
# the numpy ABI for shared .npy / pickled embeddings.
#
# Security: no untrusted event data is interpolated into run: commands.

name: constraint-drift

on:
  pull_request:
    paths:
      - '**/requirements*.txt'
      - 'constraints/shared.txt'
      - 'scripts/check_constraint_drift.py'
      - 'scripts/check_websockets_cap.py'
      - '.github/workflows/constraint-drift.yml'
  push:
    branches: [Dev_new_gui]
    paths:
      - '**/requirements*.txt'
      - 'constraints/shared.txt'
      - 'scripts/check_constraint_drift.py'
      - 'scripts/check_websockets_cap.py'

# #14434: without this, every push left its predecessors queued. 42 of a 271-run
# sample were for commits no longer at their branch tip - work nothing would ever
# read, each still fetching its actions. During GitHub's 2026-08-17 archive-download
# degradation that wasted load became failures on unrelated pull requests (#14444).
#
# cancel-in-progress is guarded on the event rather than set to a bare `true`:
# #13432 found that cancelling base-branch runs meant each merge cancelled the
# previous merge's verification, and merges arrive faster than a suite completes -
# of 39 completed base runs, 26 were cancelled and NONE succeeded. Six of the
# workflows this was applied to also trigger on push to Dev_new_gui, so the guard
# is load-bearing there and harmless where it is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  constraint-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # #13517: shared composite action, so the interpreter version, pip cache
      # and dependency install live in one place rather than 21 copies.
      - uses: ./.github/actions/setup-python-ci
        with:
          extra-packages: packaging

      - name: Check single-source constraint compliance
        run: python3 scripts/check_constraint_drift.py

      # #11030: fail fast with a clear message if autobot-backend's websockets pin
      # is bumped past the langgraph-sdk <16 cap (the opaque ResolutionImpossible
      # that dependabot #10997 caused). Auto-relaxes if langgraph is dropped.
      - name: Check websockets <16 cap (langgraph-sdk)
        run: python3 scripts/check_websockets_cap.py
