# Monthly branch health report
#
# This workflow generates a comprehensive report on branch health metrics:
# - Total branches (local/remote)
# - Landed vs. unproven branches
# - Stale branches
# - Worktree status
# - Recommendations
#
# WHY NOT `git branch --merged` (#15036). This repository squash-merges, so the
# base branch is never a descendant of a merged branch's commits. `--merged`
# (and `--is-ancestor`) therefore report ~0 merged branches no matter how much
# has landed, and the "merged branches to clean up" recommendation built on it
# was never actionable. The landed/unproven split below uses
# `branch_landing_evidence` from scripts/lib/branch-guards.sh instead.
#
# Reports via GitHub Issue for visibility and historical tracking.
#
# See: https://github.com/mrveiss/AutoBot-AI/issues/4110

name: Monthly branch health report

on:
  schedule:
    # Run on the 1st of each month at 05:00 UTC
    - cron: '0 5 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # branch_landing_evidence asks whether a merged PR had this branch as its head.
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch latest refs
        run: |
          git fetch --all

      - name: Collect metrics
        id: metrics
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Relative to the checkout, as branch-cleanup.yml does: asking git for
          # the toplevel is the unscrubbed-GIT_DIR hazard of #15176/#15245.
          # shellcheck source=scripts/lib/branch-guards.sh
          source scripts/lib/branch-guards.sh

          # The PR base for this repository, which is not the GitHub default branch.
          BASE_REF=origin/Dev_new_gui

          # Count branches
          total_local=$(git branch | wc -l)
          total_remote=$(git branch -r | wc -l)

          # Count stale branches (30+ days), and split every candidate by
          # landing evidence rather than by ancestry (#15036).
          DAYS_STALE=30
          CUTOFF_DATE=$(date -d "$DAYS_STALE days ago" +%s)
          stale_count=0
          landed_count=0
          archival_count=0
          unproven_count=0

          all_branches=$(git branch -r \
            | sed 's|^ *origin/||' \
            | grep -v "HEAD\|main\|master\|Dev_new_gui" || true)

          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            last_commit_ts=$(git log -1 --format=%ct "origin/$branch" 2>/dev/null || echo "0")
            if [ "$last_commit_ts" -lt "$CUTOFF_DATE" ]; then
              stale_count=$((stale_count + 1))
            fi
            evidence=$(branch_landing_evidence "$BASE_REF" "$branch" "origin/$branch")
            case "${evidence%%|*}" in
              landed)   landed_count=$((landed_count + 1)) ;;
              archival) archival_count=$((archival_count + 1)) ;;
              *)        unproven_count=$((unproven_count + 1)) ;;
            esac
          done <<< "$all_branches"

          # Count worktrees
          worktree_count=0
          if [ -d ".worktrees" ]; then
            worktree_count=$(find .worktrees -maxdepth 1 -type d -not -name ".worktrees" | wc -l)
          fi

          # Count open PRs
          open_prs=0
          if command -v gh &>/dev/null; then
            open_prs=$(gh pr list --state open --json number -q 'length' 2>/dev/null || echo "0")
          fi

          # Count open issues
          open_issues=0
          if command -v gh &>/dev/null; then
            open_issues=$(gh issue list --state open --json number -q 'length' 2>/dev/null || echo "0")
          fi

          {
            echo "total_local=$total_local"
            echo "total_remote=$total_remote"
            echo "landed=$landed_count"
            echo "archival=$archival_count"
            echo "unproven=$unproven_count"
            echo "stale=$stale_count"
            echo "worktrees=$worktree_count"
            echo "open_prs=$open_prs"
            echo "open_issues=$open_issues"
          } >> "$GITHUB_OUTPUT"

      - name: Create health report issue
        uses: actions/github-script@v9
        env:
          TOTAL_LOCAL: ${{ steps.metrics.outputs.total_local }}
          TOTAL_REMOTE: ${{ steps.metrics.outputs.total_remote }}
          LANDED: ${{ steps.metrics.outputs.landed }}
          ARCHIVAL: ${{ steps.metrics.outputs.archival }}
          UNPROVEN: ${{ steps.metrics.outputs.unproven }}
          STALE: ${{ steps.metrics.outputs.stale }}
          WORKTREES: ${{ steps.metrics.outputs.worktrees }}
          OPEN_PRS: ${{ steps.metrics.outputs.open_prs }}
          OPEN_ISSUES: ${{ steps.metrics.outputs.open_issues }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const totalLocal = process.env.TOTAL_LOCAL;
            const totalRemote = process.env.TOTAL_REMOTE;
            const landed = process.env.LANDED;
            const archival = process.env.ARCHIVAL;
            const unproven = process.env.UNPROVEN;
            const stale = process.env.STALE;
            const worktrees = process.env.WORKTREES;
            const openPrs = process.env.OPEN_PRS;
            const openIssues = process.env.OPEN_ISSUES;

            const now = new Date();
            const timestamp = now.getFullYear() + '-' +
                             String(now.getMonth() + 1).padStart(2, '0') + '-' +
                             String(now.getDate()).padStart(2, '0');

            const issueTitle = 'Branch health report: ' + timestamp;

            const issueBody = '## Repository Branch Health Report\n' +
              '\n' +
              '**Report Date:** ' + timestamp + '\n' +
              '\n' +
              '### Key Metrics\n' +
              '\n' +
              '| Metric | Count |\n' +
              '|--------|-------|\n' +
              '| Local branches | ' + totalLocal + ' |\n' +
              '| Remote branches | ' + totalRemote + ' |\n' +
              '| Landed (merged PR, or base carries its issue) | ' + landed + ' |\n' +
              '| Archival (rescued/, release/changelog-) | ' + archival + ' |\n' +
              '| Unproven landing | ' + unproven + ' |\n' +
              '| Stale branches (30+ days) | ' + stale + ' |\n' +
              '| Active worktrees | ' + worktrees + ' |\n' +
              '| Open PRs | ' + openPrs + ' |\n' +
              '| Open issues | ' + openIssues + ' |\n' +
              '\n' +
              '### Health Assessment\n' +
              '\n' +
              'Active development: ' + openPrs + ' open PRs, ' + openIssues + ' open issues\n' +
              '\n' +
              'Branch cleanup: ' + landed + ' landed, ' + unproven + ' unproven, ' + stale + ' stale\n' +
              '\n' +
              'Landing is decided by merged-PR head ref, or by a commit on the base carrying the\n' +
              'branch\'s `(#issue)`. It is NOT decided by ancestry: this repository squash-merges,\n' +
              'so `git branch --merged` is false for every branch it has ever merged (#15036).\n' +
              '\n' +
              '### Recommendations\n' +
              '\n' +
              '1. Read the ' + unproven + ' unproven branches against base and record a verdict each\n' +
              '2. Investigate ' + stale + ' stale branches\n' +
              '3. Manage ' + worktrees + ' active worktrees\n' +
              '4. Address ' + openPrs + ' open PRs\n' +
              '\n' +
              '---\n' +
              'Generated by branch-health-report workflow\n' +
              'See: https://github.com/mrveiss/AutoBot-AI/issues/4110';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['automation', 'infrastructure', 'report'],
            });

            console.log('Created health report for ' + timestamp);

      - name: Generate summary
        if: always()
        env:
          TOTAL_LOCAL: ${{ steps.metrics.outputs.total_local }}
          TOTAL_REMOTE: ${{ steps.metrics.outputs.total_remote }}
          LANDED: ${{ steps.metrics.outputs.landed }}
          UNPROVEN: ${{ steps.metrics.outputs.unproven }}
          STALE: ${{ steps.metrics.outputs.stale }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Monthly Branch Health Report

          **Summary:**
          - Total local branches: $TOTAL_LOCAL
          - Total remote branches: $TOTAL_REMOTE
          - Landed branches: $LANDED
          - Unproven landing: $UNPROVEN
          - Stale branches: $STALE

          See generated GitHub Issue for full details.
          EOF
