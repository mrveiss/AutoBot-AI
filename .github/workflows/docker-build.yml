# AutoBot Docker Build — Build and push images via Docker Build Cloud (#1809)
#
# Triggers on pushes to Dev_new_gui/main when Docker-related files change.
# Uses Docker Build Cloud (mrveiss/test-builer) for fast builds.
#
# Required secrets:
#   DOCKER_PAT — Docker Hub personal access token
# Required variables:
#   DOCKER_USER — Docker Hub username

name: docker-build

on:
  push:
    branches:
      - Dev_new_gui
      - main
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "autobot-backend/**"
      - "autobot-shared/**"
      - "autobot-slm-backend/**"
      - "autobot-frontend/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ vars.DOCKER_USER }}/autobot

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "mrveiss/test-builer"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          tags: |
            ${{ env.IMAGE_PREFIX }}-host:latest
            ${{ env.IMAGE_PREFIX }}-host:${{ github.sha }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}

  build-slm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "mrveiss/test-builer"

      - name: Build and push SLM
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/slm/Dockerfile
          tags: |
            ${{ env.IMAGE_PREFIX }}-slm:latest
            ${{ env.IMAGE_PREFIX }}-slm:${{ github.sha }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "mrveiss/test-builer"

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
