# GitHub Actions workflow for code quality enforcement
# Runs on every push and pull request

name: Code Quality

on:
  push:
    branches: [ main, Dev_new_gui, develop ]
    paths:
      - '**/*.py'
      - '**/requirements*.txt'
      - 'requirements-ci/**'
      - 'pyproject.toml'
      - '.flake8'
      - '.bandit'
      - '.pre-commit-config.yaml'
      - 'pipeline-scripts/**'
      - 'tools/lint/**'
      - 'autobot-infrastructure/shared/scripts/hooks/**'
      - 'autobot-infrastructure/ansible/roles/slm_agent/files/**'
      - 'docs/developer/**'
      - '.github/workflows/code-quality.yml'
  # NOTE: no pull_request.paths filter — this workflow ALWAYS runs on PRs so its
  # required-check context ("code-quality") always reports a conclusion. A
  # path-filtered required check that never triggers leaves the PR deadlocked on
  # "Expected — Waiting for status". The real work is gated on the `changes` job
  # below and self-skips (reporting success) when no backend paths are touched.
  # Branch-protection promotion to required is the separate owner-confirmed
  # follow-up (#10022).
  pull_request:
    branches: [ main, Dev_new_gui, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            backend:
              - '**/*.py'
              - '**/requirements*.txt'
              - 'requirements-ci/**'
              - 'pyproject.toml'
              - '.flake8'
              - '.bandit'
              - '.pre-commit-config.yaml'
              - 'pipeline-scripts/**'
              - 'tools/lint/**'
              - 'autobot-infrastructure/shared/scripts/hooks/**'
              - 'autobot-infrastructure/ansible/roles/slm_agent/files/**'
              - 'docs/developer/**'
              - '.github/workflows/code-quality.yml'

  code-quality:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest  # Temporary: self-hosted runner offline (MVA-2605)

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Required, not cosmetic (#13880). The default fetch-depth: 1 leaves the
        # PR base commit out of the clone, so every changed-files step here
        # diffed against a missing object, treated the fatal as "no changes",
        # and went green having scanned nothing. Those steps now hard-fail on an
        # unresolvable ref, so without full history the job would fail outright.
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
        cache-dependency-path: |
          requirements*.txt
          autobot-backend/requirements*.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pin versions to match .pre-commit-config.yaml (Issue #2128)
        python -m pip install black==26.3.1 isort==8.0.1 flake8==7.3.0 autoflake==2.3.3 'bandit[toml]==1.9.4'
        # mypy and stubs (GH#7105)
        python -m pip install \
          mypy==1.16.0 \
          pydantic-settings \
          types-redis \
          types-requests \
          types-PyYAML \
          types-setuptools \
          opentelemetry-api \
          opentelemetry-sdk

    - name: Check code formatting with Black
      run: |
        python3 -m black --check --line-length=120 autobot-backend/ autobot-slm-backend/ autobot_shared/ || {
          echo "Black formatting check failed"
          echo "Run 'python3 -m black --line-length=120 autobot-backend/ autobot-slm-backend/ autobot_shared/' to fix"
          exit 1
        }

    - name: Check import sorting with isort
      run: |
        # Use --settings-path to read pyproject.toml (profile, src_paths, known_first_party) (#2679)
        python3 -m isort --check-only --settings-path=. --line-length=120 autobot-backend/ autobot-slm-backend/ autobot_shared/ || {
          echo "isort check failed"
          echo "Run 'python3 -m isort --settings-path=. --line-length=120 autobot-backend/ autobot-slm-backend/ autobot_shared/' to fix"
          exit 1
        }

    - name: Lint with flake8
      run: |
        # Uses .flake8 config for consistency with pre-commit (Issue #2128)
        python3 -m flake8 --config=.flake8 autobot-backend/ autobot-slm-backend/ autobot_shared/ || {
          echo "⚠️ flake8 linting issues found"
          exit 1
        }

    - name: Block datetime.utcnow().isoformat() regressions (#5178 #5238 #5268)
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        # Pre-commit covers local dev — this CI step closes the bypass gap
        # (devs without pre-commit installed, or `--no-verify` users).
        # Changed-files-only mode mirrors pre-commit semantics: doesn't
        # block on the 59 pre-existing violations tracked by #5263.
        # After #5263 closes, swap to full-scan mode (no argv).
        if [ -n "${BASE_SHA:-}" ]; then
          # PR context — diff against the merge base
          base="$BASE_SHA"
        else
          # Push context — diff against the previous commit on the branch
          base="${HEAD_SHA}^"
        fi
        # A guard that cannot compute its scope must FAIL, not report "no
        # changed files" (#13880) — see the same fix in
        # pipeline-scripts/check-pre-commit-hook-pr.sh.
        for _ref in "$base" "$HEAD_SHA"; do
          git cat-file -e "${_ref}^{commit}" 2>/dev/null || {
            echo "::error::'${_ref}' does not resolve — shallow clone cannot diff against the base. Refusing to report no-changes for an uncomputed scope."
            exit 1
          }
        done
        # `git diff --name-only` may return non-existent paths (deleted
        # files); filter to existing .py files before passing to the hook.
        if ! raw_files=$(git diff --name-only "$base" "$HEAD_SHA" -- '*.py'); then
          echo "::error::git diff failed for ${base}..${HEAD_SHA} — refusing to report clean."
          exit 1
        fi
        # `|| true` normalises the while-loop's EOF status under `set -e`; it is
        # scoped to the filter only, since git's status is checked above.
        files=$(printf '%s\n' "$raw_files" \
          | while read -r f; do [ -n "$f" ] && [ -f "$f" ] && printf '%s\n' "$f"; done \
          || true)
        if [ -z "$files" ]; then
          echo "No changed Python files — skipping #5178 regression check."
          exit 0
        fi
        echo "Checking $(echo "$files" | wc -l) changed .py file(s) for banned patterns..."
        echo "$files" | xargs python3 tools/lint/check_no_utcnow_isoformat.py

    - name: Block hardcoded value regressions (#694, #6725)
      run: bash pipeline-scripts/check-pre-commit-hook-pr.sh pre-commit-hardcoded-values

    - name: Block hardcoded-IP fallback regressions (#6783, #6991)
      run: bash pipeline-scripts/check-pre-commit-hook-pr.sh --python tools/lint/check_no_hardcoded_ip_fallbacks.py --ext py

    - name: Block direct redis client regressions (#1086, #6785)
      run: bash pipeline-scripts/check-pre-commit-hook-pr.sh pre-commit-no-direct-redis

    - name: Block print/console regressions (#1082, #6785)
      run: bash pipeline-scripts/check-pre-commit-hook-pr.sh pre-commit-no-print-console

    - name: Check repo conventions — third-party names, doc cross-links (#13876)
      env:
        CONVENTIONS_DENYLIST_CONTENT: ${{ secrets.CONVENTIONS_DENYLIST }}
        # Bound through env rather than interpolated into the script body.
        # These are GitHub-generated SHAs, but keeping every ${{ }} out of
        # `run:` is the rule that does not need a per-field risk judgement.
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        # The denylist of third-party product names is NOT stored in this repo:
        # committing it would violate the anonymisation rule it enforces. It
        # arrives as a masked secret and is written to a runner-local temp file.
        #
        # When the secret is absent the name check reports SKIPPED, never PASSED
        # — a guard that silently no-ops is worse than no guard. The doc
        # cross-link and commit-format checks need no secret and always run.
        # Once the secret is configured this step hardens automatically.
        # actions/checkout defaults to fetch-depth: 1, and on a pull_request
        # event it checks out the MERGE commit — so neither base.sha nor
        # head.sha from the event payload is present. Resolve through HEAD's
        # own parents instead, which needs no payload and no merge-base:
        #   HEAD^1 = base tip, HEAD^2 = PR head, HEAD = their merge.
        # HEAD^1..HEAD is therefore exactly this PR's changes, and excludes
        # whatever other PRs landed on the base meanwhile.
        #
        # Deliberately NOT setting fetch-depth: 0 on the job — several sibling
        # steps are already dead for this same reason, and reviving them all
        # here would redden this PR with unrelated pre-existing findings.
        # Tracked separately in #13880.
        # A bare `--deepen` deepens the DEFAULT refspec, not the checked-out
        # PR merge ref, so it resolved only by luck. Fetch the specific objects
        # instead, then pick the first range that actually resolves.
        if [ -n "${PR_NUMBER:-}" ]; then
          git fetch --no-tags --quiet --depth=2 origin "+refs/pull/${PR_NUMBER}/merge" 2>/dev/null || true
        fi
        if [ -n "${PR_BASE_SHA:-}" ] && [ -n "${PR_HEAD_SHA:-}" ]; then
          git fetch --no-tags --quiet --depth=1 origin "$PR_BASE_SHA" "$PR_HEAD_SHA" 2>/dev/null || true
        fi
        git fetch --no-tags --quiet --deepen=10 2>/dev/null || true

        have() { git cat-file -e "${1}^{commit}" 2>/dev/null; }
        if have 'HEAD^2' && have 'HEAD^1'; then
          RANGE="HEAD^1..HEAD"          # merge ref: exactly this PR's changes
        elif have "${PR_BASE_SHA:-x}" && have "${PR_HEAD_SHA:-x}"; then
          RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
        elif have 'HEAD~1'; then
          RANGE="HEAD~1..HEAD"
        else
          echo "::error::cannot resolve a diff range — refusing to scan 0 files and report clean"
          git log --oneline -3 2>&1 | sed 's/^/  /' || true
          exit 1
        fi
        # Anti-no-op guard. The original defect was a broken range yielding
        # "0 file(s) in scope" and three green checks. Any change set reaches
        # this job with at least one file, so 0 means the range is wrong —
        # fail red rather than pass having scanned nothing.
        CHANGED=$(git diff --name-only "$RANGE" | wc -l)
        echo "conventions scope: $RANGE ($CHANGED file(s))"
        if [ "$CHANGED" -eq 0 ]; then
          echo "::error::0 files in scope for '$RANGE' — the range is wrong. Refusing to report clean on an unscanned tree."
          exit 1
        fi
        if [ -n "${CONVENTIONS_DENYLIST_CONTENT:-}" ]; then
          CONVENTIONS_DENYLIST=$(mktemp)
          export CONVENTIONS_DENYLIST
          printf '%s\n' "$CONVENTIONS_DENYLIST_CONTENT" > "$CONVENTIONS_DENYLIST"
          trap 'rm -f "$CONVENTIONS_DENYLIST"' EXIT
          scripts/lint-conventions.sh --range "$RANGE" --require-denylist
        else
          echo "::warning::CONVENTIONS_DENYLIST secret not configured — the third-party-name check is SKIPPED, not passed. Configure it to harden this gate."
          scripts/lint-conventions.sh --range "$RANGE"
        fi

    - name: Block developer absolute-path regressions (#13409, #13149)
      run: |
        set -euo pipefail
        # An absolute /home/<developer>/... path in tracked source only ever
        # resolves on the machine it was written on. #13409 fixed four such
        # files: one was a guard test that raised FileNotFoundError on every
        # CI run, three pointed into a worktree that had been deleted.
        # Full-tree scan (not changed-files-only): the tree is clean as of
        # #13409, so any new hit is a genuine regression.
        #
        # ALLOWED_HOMES — deployment/CI service accounts that legitimately
        # appear as absolute paths in playbooks, units and container images.
        # Templated homes (/home/{{ ansible_user }}, /home/$USER) never match
        # the username character class and need no exemption.
        ALLOWED_HOMES='autobot|kali|user|ubuntu|runner|vagrant|sandbox|node'
        # ALLOWED_FILES — synthetic fixtures only. The generated third-party
        # config that used to sit here was untracked instead (#13429), which is
        # the right fix: exemptions for real files become permanent.
        # Do NOT extend this list to work around a violation.
        ALLOWED_FILES='^(autobot-frontend/src/components/audit/AuditTimeline\.stories\.ts|pipeline-scripts/test_audit_unwired_trackers\.py):'
        PATTERN="(^|[^A-Za-z0-9_])/home/(?!(?:${ALLOWED_HOMES})[/\"'[:space:]]|\{)[A-Za-z0-9._-]+/"
        set +e
        raw=$(git grep -nIP "$PATTERN" -- \
          '*.py' '*.sh' '*.bash' '*.ts' '*.tsx' '*.vue' '*.js' '*.mjs' '*.cjs' \
          '*.yml' '*.yaml' '*.json' '*.toml' '*.ini' '*.cfg' '*.j2' '*.conf')
        rc=$?
        set -e
        if [ "$rc" -gt 1 ]; then
          echo "git grep failed (exit $rc) — PCRE (-P) support missing or bad pattern"
          exit 1
        fi
        violations=""
        if [ -n "$raw" ]; then
          violations=$(printf '%s\n' "$raw" | grep -vE "${ALLOWED_FILES}" || true)
        fi
        if [ -n "$violations" ]; then
          echo "$violations"
          echo ""
          echo "⚠️ Hardcoded developer absolute path(s) detected in tracked source"
          echo "Resolve paths from __file__ instead, e.g."
          echo "  Path(__file__).resolve().parents[N] / 'sub' / 'dir'"
          echo "Do NOT use autobot_shared.ssot_config.PROJECT_ROOT for this — its"
          echo ".env marker-walk escapes git worktrees and resolves to the wrong"
          echo "checkout (#13357)."
          exit 1
        fi
        echo "No hardcoded developer absolute paths found."

    - name: Check design-token contrast meets WCAG AA (#12730)
      run: python3 scripts/check_token_contrast.py

    - name: Check script exec bits agree with how the docs invoke them (#13355)
      run: python3 scripts/check_script_exec_bits.py

    - name: Check nosec annotations reach bandit intact (#13521, #13528)
      run: python3 scripts/check_nosec_format.py

    - name: Check for unused imports with autoflake
      run: |
        python3 -m autoflake --check --recursive \
          --remove-all-unused-imports \
          --remove-unused-variables \
          --expand-star-imports \
          --ignore-init-module-imports \
          autobot-backend/ autobot-slm-backend/ autobot_shared/ || {
          echo "⚠️ Unused imports/variables detected"
          exit 1
        }

    - name: Security check with bandit
      run: |
        python3 -m bandit -c .bandit -r autobot-backend/ autobot-slm-backend/ autobot_shared/ || {
          echo "⚠️ Security issues detected - review bandit output"
          exit 1
        }

    - name: Check Ansible agent code drift (#1629)
      run: |
        bash pipeline-scripts/detect-agent-code-drift.sh || {
          echo "Ansible slm_agent role has drifted from canonical source"
          echo "See Issue #1629 for details"
          exit 1
        }


    - name: Check developer docs reference existing files (#3425)
      run: |
        python3 pipeline-scripts/check-doc-references.py || {
          echo "One or more developer docs reference files that no longer exist."
          echo "Update the doc to point to the current file path."
          exit 1
        }

    - name: Type-check autobot_shared (required)
      run: |
        # autobot_shared is the shared library and must be strictly typed.
        # Errors in the backends are tracked in GH#7105.
        python3 -m mypy autobot_shared/ || {
          echo "mypy found type errors in autobot_shared/"
          echo "Fix the errors above or suppress with '# type: ignore[code]  # GH#7105'"
          exit 1
        }

    - name: Type-check autobot-backend (informational)
      run: |
        # Non-blocking: surfaces new regressions in trend output.
        # 4133 pre-existing errors tracked for resolution in GH#7105.
        python3 -m mypy autobot-backend/ 2>&1 | tail -5 || true

    - name: Type-check autobot-slm-backend (informational)
      run: |
        # Non-blocking: 1281 SQLAlchemy Column[T] errors tracked in GH#7105.
        python3 -m mypy autobot-slm-backend/ 2>&1 | tail -5 || true

    - name: Enforce extension/skill/plugin import boundaries (#7372)
      run: |
        # Scan all extension, skill, and plugin Python files for layer-boundary violations.
        # Rules: no core-backend imports, no sibling cross-imports.
        # See docs/developer/plugin-boundaries.md and
        #     security/semgrep/extension-import-boundaries.yaml
        # Scans only tracked source directories — no user-supplied input.
        find autobot-backend/middleware/builtin \
             autobot-backend/skills/builtin \
             plugins/core-plugins \
             -name "*.py" -print0 \
          | xargs -0 python3 tools/lint/check_extension_import_boundaries.py

    - name: Code quality summary
      if: always()
      run: |
        echo "Code Quality Check Complete"
        echo ""
        echo "All checks enforce strict mode — failures will block the pipeline."

    - name: Cleanup virtual environment
      if: always()
      run: |
        rm -rf .venv || true
