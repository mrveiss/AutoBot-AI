# #7056: regression guard for the shared role_*_active facts.
#
# Runs the test playbook (autobot-slm-backend/ansible/tests/playbooks/
# test_role_active_facts.yml) against synthetic inventories that exercise
# every code path in inventory/group_vars/all.yml.
#
# Catches:
#   - Forgotten `autobot-X` variant when adding a new role
#   - Forgotten group-membership check
#   - Drift between provision-fleet-roles.yml gates and group_vars facts
#   - Cleanup-gate regressions of the #7031 class
#   - The test inventory's group_vars/all.yml silently resolving to nothing
#     (#14149) — see the "Assert test inventory resolves group_vars" step
#
# Security note: this workflow does NOT interpolate any untrusted GitHub
# event data (no issue titles, PR bodies, commit messages, head_ref, etc.)
# into run: commands. All inputs are static file paths under the repo.
---
name: ansible-role-facts-test

on:
  pull_request:
    paths:
      - 'autobot-slm-backend/ansible/ansible.cfg'
      - 'autobot-slm-backend/ansible/inventory/group_vars/**'
      - 'autobot-slm-backend/ansible/playbooks/provision-fleet-roles.yml'
      - 'autobot-slm-backend/ansible/playbooks/pre-flight-code-sync.yml'
      - 'autobot-slm-backend/ansible/playbooks/update-all-nodes.yml'
      - 'autobot-slm-backend/ansible/update-all-nodes.yml'
      - 'autobot-slm-backend/ansible/roles/*/tasks/clean.yml'
      - 'autobot-slm-backend/ansible/roles/_shared/tasks/**'
      # #13746: the venv-producer guard reads every play and role task file,
      # so it has to trigger on them — otherwise the check cannot fire on the
      # change that breaks it.
      - 'autobot-slm-backend/ansible/playbooks/**'
      - 'autobot-slm-backend/ansible/roles/**'
      - 'autobot-slm-backend/ansible/tests/**'
      - 'autobot-slm-backend/ansible/tests/**'
      - '.github/workflows/ansible-role-facts-test.yml'
  push:
    branches:
      - Dev_new_gui
      - main
    paths:
      - 'autobot-slm-backend/ansible/ansible.cfg'
      - 'autobot-slm-backend/ansible/inventory/group_vars/**'
      - 'autobot-slm-backend/ansible/playbooks/provision-fleet-roles.yml'
      - 'autobot-slm-backend/ansible/playbooks/pre-flight-code-sync.yml'
      - 'autobot-slm-backend/ansible/playbooks/update-all-nodes.yml'
      - 'autobot-slm-backend/ansible/update-all-nodes.yml'
      - 'autobot-slm-backend/ansible/roles/*/tasks/clean.yml'
      - 'autobot-slm-backend/ansible/roles/_shared/tasks/**'
      # #13746: the venv-producer guard reads every play and role task file,
      # so it has to trigger on them — otherwise the check cannot fire on the
      # change that breaks it.
      - 'autobot-slm-backend/ansible/playbooks/**'
      - 'autobot-slm-backend/ansible/roles/**'
      - 'autobot-slm-backend/ansible/tests/**'
      - 'autobot-slm-backend/ansible/tests/**'

# #14434: without this, every push left its predecessors queued. 42 of a 271-run
# sample were for commits no longer at their branch tip - work nothing would ever
# read, each still fetching its actions. During GitHub's 2026-08-17 archive-download
# degradation that wasted load became failures on unrelated pull requests (#14444).
#
# cancel-in-progress is guarded on the event rather than set to a bare `true`:
# #13432 found that cancelling base-branch runs meant each merge cancelled the
# previous merge's verification, and merges arrive faster than a suite completes -
# of 39 completed base runs, 26 were cancelled and NONE succeeded. Six of the
# workflows this was applied to also trigger on push to Dev_new_gui, so the guard
# is load-bearing there and harmless where it is not.
# Least privilege (#15331). Checks out and runs ansible assertions only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Ansible (system Python is fine for this test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible-core

      # #14678: tests/inventory/group_vars/all.yml is GENERATED, not tracked.
      # It was a third tracked copy of the role-active facts kept byte-equal by
      # a diff guard. Copied rather than symlinked: #14149 -- a tracked symlink
      # is materialised as a plain-text path string on core.symlinks=false
      # checkouts, and the playbook then resolves zero variables.
      - name: "Generate the test inventory's group_vars from the single source (#14678)"
        working-directory: autobot-slm-backend/ansible
        run: |
          mkdir -p tests/inventory/group_vars
          cp inventory/group_vars/all.yml tests/inventory/group_vars/all.yml

      - name: "Assert that copy is fresh and is a real file (#14678)"
        working-directory: autobot-slm-backend/ansible
        run: |
          python3 tests/check_test_inventory_is_generated.py

      - name: Run role_*_active facts test (group_vars codepath)
        working-directory: autobot-slm-backend/ansible
        run: |
          ansible-playbook -i tests/inventory/test_role_facts.yml tests/playbooks/test_role_active_facts.yml

      # #14149: tests/inventory/group_vars/all.yml used to be a symlink to the
      # canonical inventory/group_vars/all.yml. GitHub-hosted Linux runners keep
      # core.symlinks=true, so the playbook run above passed here even while it
      # silently resolved to zero variables on core.symlinks=false checkouts.
      # This asserts the test inventory actually resolves a known group_vars key.
      - name: "Assert test inventory resolves group_vars (#14149)"
        working-directory: autobot-slm-backend/ansible
        run: |
          python3 tests/check_test_inventory_group_vars.py

      - name: Run role_*_active facts test (deploy.yml's vars_files codepath, #14678)
        working-directory: autobot-slm-backend/ansible
        # #7094 named this the SLM-triggered provision path; that shape no longer
        # exists (#11781, #14286 link group_vars/ beside every dynamic inventory).
        # It now stands in for deploy.yml's actual callers (services/deployment.py,
        # services/blue_green.py), which invoke deploy.yml with a bare `-i "<host>,"`
        # string -- not a directory, so no group_vars discovery either (#14678).
        # tests/inventory_dynamic/ is a copy of tests/inventory/ WITHOUT the
        # group_vars/all.yml symlink, so the playbook MUST succeed loading facts
        # via vars_files alone.
        run: |
          ansible-playbook -i tests/inventory_dynamic/test_role_facts.yml tests/playbooks/test_role_active_facts_no_group_vars.yml

      - name: "Diff guard: the two tracked role_*_active copies stay in sync (#14678)"
        working-directory: autobot-slm-backend/ansible
        run: |
          python3 tests/check_role_facts_synced.py

      # #13746: three producers built /opt/autobot/venv with two interpreters.
      # Co-location puts them on one host, and the loser's site-packages
      # survives — a native ImportError at startup, never a deploy error.
      - name: Check no venv path has two interpreters
        working-directory: autobot-slm-backend/ansible
        run: |
          python3 tests/check_venv_producers.py

      - name: "Run clean.yml include_tasks loops test (#7058)"
        working-directory: autobot-slm-backend/ansible
        # #7058: each role's clean.yml is now a thin include_tasks loop over
        # roles/_shared/tasks/clean_*_dir.yml. Test in --check mode to catch
        # typos in loop_var/vars wiring before they reach a real host.
        run: |
          ansible-playbook --check --connection=local -i 'localhost,' tests/playbooks/test_clean_yml_loops.yml

      # #15822: the --check run above proves the loops unroll and nothing else.
      # It stayed green through eleven days in which wrong-node cleanup did not
      # fire on a single host, because a task that decides nothing and a task
      # that decides correctly look identical in check mode. This one runs for
      # real against fixture directories it creates itself and asserts on the
      # filesystem: the wrong-node dir is gone, the right-node dir and the
      # undecidable dir are still there.
      - name: "Run wrong-node cleanup EFFECT test (#15822)"
        working-directory: autobot-slm-backend/ansible
        run: |
          ansible-playbook --connection=local -i 'localhost,' tests/playbooks/test_wrong_node_cleanup_effect.yml

      # #13747 AC4: "verified by deliberate failure: the guard rejects a venv
      # left at the old version." Runs for real (not --check) against a
      # fabricated venv, so it needs no NPU hardware and no python3.14 binary
      # on the runner — see the playbook header for what it proves.
      - name: "Run ensure_venv_version deliberate-failure test (#13747)"
        working-directory: autobot-slm-backend/ansible
        run: |
          ansible-playbook --connection=local -i 'localhost,' tests/playbooks/test_ensure_venv_version.yml

      - name: Lint test playbook + inventory YAML
        working-directory: autobot-slm-backend/ansible
        run: |
          python3 -c "import yaml; yaml.safe_load(open('tests/playbooks/test_role_active_facts.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('tests/playbooks/test_role_active_facts_no_group_vars.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('tests/playbooks/test_clean_yml_loops.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('tests/playbooks/test_wrong_node_cleanup_effect.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('tests/playbooks/test_ensure_venv_version.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('tests/inventory/test_role_facts.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('tests/inventory/group_vars/all.yml'))"
