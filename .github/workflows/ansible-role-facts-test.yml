# #7056: regression guard for the shared role_*_active facts.
#
# Runs the test playbook (autobot-slm-backend/ansible/tests/playbooks/
# test_role_active_facts.yml) against synthetic inventories that exercise
# every code path in inventory/group_vars/all.yml.
#
# Catches:
#   - Forgotten `autobot-X` variant when adding a new role
#   - Forgotten group-membership check
#   - Drift between provision-fleet-roles.yml gates and group_vars facts
#   - Cleanup-gate regressions of the #7031 class
#
# Security note: this workflow does NOT interpolate any untrusted GitHub
# event data (no issue titles, PR bodies, commit messages, head_ref, etc.)
# into run: commands. All inputs are static file paths under the repo.
---
name: ansible-role-facts-test

on:
  pull_request:
    paths:
      - 'autobot-slm-backend/ansible/ansible.cfg'
      - 'autobot-slm-backend/ansible/inventory/group_vars/**'
      - 'autobot-slm-backend/ansible/playbooks/provision-fleet-roles.yml'
      - 'autobot-slm-backend/ansible/playbooks/pre-flight-code-sync.yml'
      - 'autobot-slm-backend/ansible/playbooks/update-all-nodes.yml'
      - 'autobot-slm-backend/ansible/update-all-nodes.yml'
      - 'autobot-slm-backend/ansible/roles/*/tasks/clean.yml'
      - 'autobot-slm-backend/ansible/roles/_shared/tasks/**'
      - 'autobot-slm-backend/ansible/tests/**'
      - '.github/workflows/ansible-role-facts-test.yml'
  push:
    branches:
      - Dev_new_gui
      - main
    paths:
      - 'autobot-slm-backend/ansible/ansible.cfg'
      - 'autobot-slm-backend/ansible/inventory/group_vars/**'
      - 'autobot-slm-backend/ansible/playbooks/provision-fleet-roles.yml'
      - 'autobot-slm-backend/ansible/playbooks/pre-flight-code-sync.yml'
      - 'autobot-slm-backend/ansible/playbooks/update-all-nodes.yml'
      - 'autobot-slm-backend/ansible/update-all-nodes.yml'
      - 'autobot-slm-backend/ansible/roles/*/tasks/clean.yml'
      - 'autobot-slm-backend/ansible/roles/_shared/tasks/**'
      - 'autobot-slm-backend/ansible/tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Install Ansible (system Python is fine for this test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible-core

      - name: Run role_*_active facts test (group_vars codepath)
        working-directory: autobot-slm-backend/ansible
        run: |
          ansible-playbook -i tests/inventory/test_role_facts.yml tests/playbooks/test_role_active_facts.yml

      - name: Run role_*_active facts test (vars_files codepath, #7094)
        working-directory: autobot-slm-backend/ansible
        # #7094: tests/inventory_dynamic/ is a copy of tests/inventory/ WITHOUT
        # the group_vars/all.yml symlink. Mimics the SLM-triggered provision
        # path where the temp inventory in /tmp/ has no sibling group_vars/.
        # The playbook MUST succeed loading facts via vars_files alone.
        run: |
          ansible-playbook -i tests/inventory_dynamic/test_role_facts.yml tests/playbooks/test_role_active_facts_no_group_vars.yml

      - name: "Diff guard: ensure both fact-file copies stay byte-equal (#7095)"
        working-directory: autobot-slm-backend/ansible
        run: |
          python3 tests/check_role_facts_synced.py

      - name: "Run clean.yml include_tasks loops test (#7058)"
        working-directory: autobot-slm-backend/ansible
        # #7058: each role's clean.yml is now a thin include_tasks loop over
        # roles/_shared/tasks/clean_*_dir.yml. Test in --check mode to catch
        # typos in loop_var/vars wiring before they reach a real host.
        run: |
          ansible-playbook --check --connection=local -i 'localhost,' tests/playbooks/test_clean_yml_loops.yml

      - name: Lint test playbook + inventory YAML
        working-directory: autobot-slm-backend/ansible
        run: |
          python3 -c "import yaml; yaml.safe_load(open('tests/playbooks/test_role_active_facts.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('tests/playbooks/test_role_active_facts_no_group_vars.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('tests/playbooks/test_clean_yml_loops.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('tests/inventory/test_role_facts.yml'))"
