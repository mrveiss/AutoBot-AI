# Phase Validation Integration workflow
#
# IS THIS A REQUIRED CONTEXT? (#17674, answered explicitly rather than left
# implicit.) No, and it CANNOT be one as triggered: `pull_request` below is
# filtered to `release`, so this workflow never runs on a PR into `main` and a
# required context that never reports would block every such PR forever. It
# runs on PUSH to main, i.e. after the merge, where a red result is advisory by
# construction -- which is how this gate stayed red, run after run, with
# nothing blocked and nobody paged. (No count is quoted here on purpose: the
# one originally written was never derived from anything, and a number in a
# comment goes stale with nothing re-checking it. `gh run list
# --workflow=phase_validation.yml --branch main` is the measurement.) Making it required is a two-part
# change, both outside this file's reach: add `main` to the `pull_request`
# branches here AND add the context in branch protection, which is a repo
# setting and an owner action. Until both happen, treat a red run on main as a
# merge-blocking defect by convention, not by enforcement.

name: Phase Validation Integration

on:
  push:
    branches: [ release, main ]
    # #12986: the backend-Python entries are the canonical `backend-python`
    # set from .github/filters/backend-python-paths.yml; GitHub cannot include a file in an event path filter,
    # so pipeline-scripts/check_workflow_path_filters.py enforces the match.
    paths: &phase_paths
      - 'autobot-backend/**/*.py'
      - 'autobot-slm-backend/**/*.py'
      - 'autobot_shared/**/*.py'
      - '.github/filters/backend-python-paths.yml'
      - '**/requirements*.txt'
      - 'requirements-ci/**'
      - 'pipeline-scripts/**'
      - 'tools/lint/**'
      - '.github/workflows/phase_validation.yml'
  pull_request:
    # ready_for_review is REQUIRED here: the jobs below are gated on
    # draft == false, and marking a PR ready fires ONLY this event. Without
    # it a required context stays `skipped` and the PR can never merge.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ release ]
    paths: *phase_paths
  workflow_dispatch:
    inputs:
      phase_filter:
        description: 'Specific phase to validate (leave empty for all phases)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phase-validation:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: AutoBot Phase Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        cache: 'pip'
        cache-dependency-path: |
          requirements*.txt
          autobot-backend/requirements*.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install aiohttp psutil requests pyyaml
        # phase_validation_system.py imports autobot_shared.network_constants —
        # install the package so the script doesn't crash at import (line 25)
        # with ModuleNotFoundError, which masked overall_maturity as 0 and
        # tripped the 60% gate. (#7496)
        python -m pip install -e ./autobot_shared

    - name: Create necessary directories and config files
      run: |
        mkdir -p data logs static config
        touch data/.gitkeep logs/.gitkeep static/.gitkeep

        # Create minimal config for validation
        cat > config/config.yaml << 'EOF'
        llm:
          orchestrator_llm: "mock"
          task_llm: "mock"
          ollama:
            model: "mock-model"
            models: {}
          unified:
            embedding:
              providers:
                ollama:
                  selected_model: "mock-embed"
        deployment:
          mode: "local"
        data:
          reliability_stats_file: "data/reliability_stats.json"
        diagnostics:
          enabled: false
          use_llm_for_analysis: false
          use_web_search_for_analysis: false
          auto_apply_fixes: false
        redis:
          host: "localhost"
          port: 6379
          db: 0
        EOF

    - name: Run Phase Validation System
      env:
        # STALE JUSTIFICATION, kept deliberately (#15877, #15894). This said
        # `network_constants.py` bare-imports `from config.registry` at module
        # scope (the citation named line 34, which is blank), so
        # autobot-backend had to be on the path or importing autobot_shared would
        # raise ModuleNotFoundError. That is no longer true: the import is lazy,
        # inside `_get_config_value`, AND wrapped in `except (ImportError,
        # ModuleNotFoundError)` -- so it cannot raise, and the stated reason for
        # this entry is void.
        #
        # The entry is NOT removed here, because "the stated reason is void" and
        # "nothing needs it" are different claims and only the first is proven.
        # Other imports in the phase-validation script may depend on it. #15894
        # settles whether it can go. (#7496 -- the underlying architectural smell.)
        PYTHONPATH: .:autobot-backend
      run: |
        echo "Running AutoBot Phase Validation System..."

        # Run the validation system in CI mode (#7496): skips
        # endpoint/service/feature checks that require a live backend stack
        # (the workflow doesn't ``docker compose up`` first). Structural
        # file/directory presence is what we can measure pre-deploy.
        #
        # #17674: the exit code is CAPTURED AND REPORTED, not swallowed by a
        # blanket `|| true`. It stays non-fatal -- the gate below is what
        # decides, and the validator exits non-zero for reasons that are not
        # gate failures -- but `|| true` meant a crash and a clean run produced
        # the same silence. Observed in run 37154687221 on `main`: the step log
        # carries `ERROR: Validation failed: '<' not supported between
        # instances of 'NoneType' and 'int'` AFTER a complete report had been
        # written, and the step reported nothing. (One run inspected; the cause
        # is unconditional in `--ci-mode`, which is the only mode CI runs.)
        #   0 completion measured and at/above the bar
        #   1/2 completion measured and below it
        #   3 the run itself failed
        #   4 the run completed and completion was NOT measured (EXIT_NOT_MEASURED,
        #     the normal --ci-mode outcome: no live stack)
        set +e
        python3 autobot-infrastructure/shared/scripts/phase_validation_system.py \
          --ci-mode --output-format json \
          > phase_validation_results.json
        VALIDATOR_RC=$?
        set -e
        echo "phase_validation_system.py exited ${VALIDATOR_RC}"
        if [ "$VALIDATOR_RC" = "3" ]; then
          echo "::warning::phase_validation_system.py exited 3 -- the validation run itself failed; the gate below reads whatever report survived"
        fi
        # Only apply zero-maturity fallback when the script produced no valid JSON
        # (e.g. import error). A non-zero exit due to Redis unavailability still
        # writes valid JSON — overwriting it with 0 was the cause of false failures.
        # #17674: `structural_presence` is null, NOT 0. This branch means the
        # validator produced no parseable report, so nothing was measured --
        # and a 0 here is what let "the instrument is broken" render as "the
        # repo scores 0%", run after run. The gate below refuses a null loudly.
        python3 -c 'import json; json.load(open("phase_validation_results.json"))' 2>/dev/null \
          || echo '{"structural_presence": null, "overall_maturity": null, "measures": "nothing ran -- the validator produced no parseable JSON", "skipped_detail": {}, "phases": []}' > phase_validation_results.json

        # Display results summary
        echo "## Phase Validation Results" >> "$GITHUB_STEP_SUMMARY"
        # No backslashes: `sh` passes them through a single-quoted argument
        # verbatim, and a backslash inside an f-string expression is a
        # SyntaxError on every Python version (#15122). The maturity value is
        # bound to a name first so the format spec needs no nested quoting.
        # #17089: this run is --ci-mode, which cannot reach a live stack, so it
        # measures STRUCTURAL PRESENCE and not completion. Reporting it as
        # "maturity" was how "Phase 6: Enhanced UI/UX 100%" came to mean
        # "App.vue and package.json exist". `overall_maturity` is null whenever
        # a group was skipped, and the summary says so rather than printing a
        # figure with a name it did not earn.
        # #17674: `.get("structural_presence", 0)` printed "0.0%" whenever the
        # producer stopped emitting the key -- a fabricated number, and the
        # quiet twin of the gate failure below. An absent figure now says so and
        # lists what the report DID carry. No `2>/dev/null`: a crashed reader is
        # a third fact and its traceback belongs in the log.
        python3 -c 'import json; r=json.load(open("phase_validation_results.json")); v=r.get("structural_presence"); shown=("{:.1f}%".format(v) if isinstance(v, (int, float)) and not isinstance(v, bool) else "NOT MEASURED (it is {!r}; top-level keys present: {})".format(v, sorted(r))); print("**Structural presence:** " + shown); print(""); print("Measures: {}".format(r.get("measures", "unknown"))); print("Completion: {}".format("measured" if r.get("overall_maturity") is not None else "NOT measured in CI (no live stack)"))' >> "$GITHUB_STEP_SUMMARY" || echo "Validation summary unavailable -- see the Phase Validation Gate step" >> "$GITHUB_STEP_SUMMARY"
        # One line, and `chr(10)` rather than an escape: a bare newline here made
        # the `for` start at column 0, which YAML read as a new mapping key, and
        # a backslash inside an f-string expression is a SyntaxError (#15122).
        python3 -c 'import json; r=json.load(open("phase_validation_results.json")); d=r.get("skipped_detail", {}); print(chr(10) + ("Not checked:" + chr(10) + chr(10).join("- {}: {}".format(k, v) for k, v in d.items()) if d else "Nothing skipped."))' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

    - name: Generate Validation Dashboard
      env:
        # Same PYTHONPATH dependency as Run Phase Validation System (#7496).
        PYTHONPATH: .:autobot-backend
      run: |
        echo "Generating validation dashboard..."
        python3 autobot-infrastructure/shared/scripts/validation_dashboard_generator.py --ci-mode > validation_dashboard.html || echo "Dashboard generation failed"

    # #13516: `github.ref` through `env:`. Not attacker-settable — on
    # `pull_request` it resolves to `refs/pull/<N>/merge` (a number), and `push`
    # is branch-filtered — so defence in depth.
    - name: Phase Validation Gate
      shell: bash
      env:
        GH_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        echo "Checking phase validation gate..."

        # #17089: gate on `structural_presence`, which is what a --ci-mode run
        # actually measures. It reads the same number the old gate did -- the
        # thresholds below are unchanged -- but under a name that does not claim
        # the live checks contributed to it. `overall_maturity` is null here by
        # design, and `.get("overall_maturity", 0)` would have returned None and
        # broken `bc` rather than failing loudly.
        # #17674: no `|| echo "0"` and no `2>/dev/null`. An absent key, an
        # unreadable file and a crashed reader are three different facts and
        # none of them is "0%". `phase_report_figure.py` exits 3 with a message
        # naming the key it wanted and the keys the report actually carries;
        # `set -euo pipefail` turns that into a loud step failure instead of a
        # silent "0% < 60%". NO PATH HERE PRINTS A NUMBER IT DID NOT READ.
        MATURITY=$(python3 autobot-infrastructure/shared/scripts/phase_report_figure.py \
          phase_validation_results.json structural_presence)

        echo "Structural presence: ${MATURITY}% (completion is NOT measured in CI mode)"

        # Set minimum maturity threshold for different branches
        if [ "$GH_REF" == "refs/heads/release" ]; then
          THRESHOLD=80
          echo "Release branch - requiring ${THRESHOLD}% maturity"
        else
          THRESHOLD=60
          echo "Development branch - requiring ${THRESHOLD}% maturity"
        fi

        # Compare maturity to threshold
        if (( $(echo "$MATURITY >= $THRESHOLD" | bc -l) )); then
          echo "Structural presence gate passed: $MATURITY% >= $THRESHOLD%"
        else
          echo "::error::Structural presence below threshold: $MATURITY% < $THRESHOLD%"
          echo "## Structural Presence Below Threshold" >> "$GITHUB_STEP_SUMMARY"
          echo "Structural presence ($MATURITY%) is below threshold ($THRESHOLD%)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Upload Validation Reports
      uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: phase-validation-reports
        path: |
          phase_validation_results.json
          validation_dashboard.html
        retention-days: 30

    - name: Comment Phase Status on PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');

          try {
            const results = JSON.parse(fs.readFileSync('phase_validation_results.json', 'utf8'));

            let comment = '## AutoBot Phase Validation Results\n\n';
            // #17674, same class as the gate: this read two names the report
            // does not carry. `overall_maturity` is null in --ci-mode by design
            // and `completion_percentage` is omitted entirely for any phase
            // with a skipped group (#17089) -- both rendered as `undefined%`.
            // A figure that was not measured now says so by name.
            const pct = (v) => (typeof v === 'number' ? `${v.toFixed(1)}%` : 'not measured');
            comment += `**Structural presence:** ${pct(results.structural_presence)}\n`;
            comment += `**Completion:** ${pct(results.overall_maturity)} (a --ci-mode run has no live stack)\n\n`;
            comment += '### Phase Status:\n\n';

            for (const phase of results.phases || []) {
              const emoji = phase.status === 'complete' ? 'PASS' :
                           phase.status === 'in_progress' ? 'IN PROGRESS' : 'FAIL';
              comment += `${emoji} **${phase.name}**: ${pct(phase.structural_presence_percentage)}\n`;
            }

            comment += '\n### Recommendations:\n';
            for (const rec of results.recommendations || []) {
              comment += `- ${rec.title}: ${rec.action}\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not post phase validation comment:', error.message);
          }

    - name: Phase Validation Summary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        echo "Phase Validation Summary"
        echo "=========================="
        if [ -f "phase_validation_results.json" ]; then
          echo "Phase validation results available"
          cat phase_validation_results.json | python3 -m json.tool | head -20 || true
        else
          echo "No validation results found"
        fi

    - name: Cleanup
      if: always()
      run: |
        rm -rf .venv || true

  integration-validation:
    name: Integration Phase Validation
    runs-on: ubuntu-latest
    needs: phase-validation
    if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Download validation results
      uses: actions/download-artifact@v8
      with:
        name: phase-validation-reports

    - name: Integration readiness check
      shell: bash
      run: |
        set -euo pipefail
        echo "Checking integration readiness..."

        # #17674, THE CHOICE, STATED. This gate read `overall_maturity`, which
        # the producer sets to null whenever a check group was skipped -- and
        # --ci-mode, the only mode CI runs, always skips the live-stack groups.
        # So the key is PRESENT and None, `.get(key, 0)` never reaches its
        # default, `print(None)` emitted the string "None", and `bc` was handed
        # `None >= 70`. The gate was unreachable-by-construction, and only
        # looked healthy because the job it `needs:` was already failing.
        #
        # It is NOT retired: the job is wired up and runs on main/release, and a
        # gate that cannot pass is a defect in the gate, not a reason to drop
        # the check. It now gates on `structural_presence`, which is the figure
        # this run actually produces, at the unchanged threshold of 70 -- and it
        # says outright that completion was not assessed, rather than implying
        # it. Restoring a completion gate needs a live stack in this job, which
        # is a separate change.
        #
        # WHAT THIS GATE IS WORTH NOW, STATED RATHER THAN IMPLIED. Re-pointing
        # it changed what it means: it asked "completion >= 70" (a figure that
        # is null by design here) and it now asks "structural presence >= 70",
        # which is the same number the gate above reads at 60. So on `release`
        # this job is strictly redundant with that gate, on `main` it adds only
        # the 60-70 band, and on current data it cannot fail -- structural
        # presence sits at 100. It is kept because a redundant check that CAN
        # fail when phases disappear is cheap, and because deleting a wired-up
        # job to make a report look tidier is not a fix. What would make it
        # earn its name is a live stack in this job so `overall_maturity` is a
        # real figure again; until then it is a second reading of the first
        # gate's number at a higher bar.
        INTEGRATION_THRESHOLD=70
        MATURITY=$(python3 autobot-infrastructure/shared/scripts/phase_report_figure.py \
          phase_validation_results.json structural_presence)

        if (( $(echo "$MATURITY >= $INTEGRATION_THRESHOLD" | bc -l) )); then
          echo "Structural presence sufficient for integration (${MATURITY}% >= ${INTEGRATION_THRESHOLD}%)"
          echo "## Integration Ready (structurally)" >> "$GITHUB_STEP_SUMMARY"
          echo "Structural presence: ${MATURITY}% - completion was NOT assessed (no live stack in CI)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::error::Structural presence below the integration threshold (${MATURITY}% < ${INTEGRATION_THRESHOLD}%)"
          echo "## Integration Not Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Structural presence: ${MATURITY}% - below the ${INTEGRATION_THRESHOLD}% integration threshold" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Update phase progression status
      run: |
        echo "Updating phase progression status..."

        # This could integrate with your phase progression system
        # to automatically update the current system phase based on validation
        echo "Phase validation completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "Results available in validation dashboard"
