# Canonical path set for "does this change require the Docker smoke test?"
#
# SINGLE SOURCE OF TRUTH -- do not inline a copy back into a workflow.
#
# Read once, by ci.yml's `changes` job, and published as `run_docker_smoke`. The
# `smoke-test` gate job in ci.yml reports the REQUIRED context green ("not
# affected") when this set does not match and requires the image build and
# compose smoke test when it does (#15299, #18208). The complement shim that
# used to read this file from a second workflow is gone.
#
# Deliberately broad: the smoke test builds the images and starts the compose
# stack, so any application source that ends up inside an image belongs here.
# Prose does not.
docker:
  - 'docker/**'
  - '**/Dockerfile*'
  - 'docker-compose*.yml'
  - 'docker-compose*.yaml'
  - '.dockerignore'
  - '.env.example'
  - '**/requirements*.txt'
  - 'constraints/**'
  - 'requirements-ci/**'
  - 'autobot-ai-stack/**'
  - 'autobot-backend/**'
  - 'autobot-browser-worker/**'
  - 'autobot-database/**'
  - 'autobot-frontend/**'
  - 'autobot-infrastructure/**'
  - 'autobot-monitoring/**'
  - 'autobot-npu-worker/**'
  - 'autobot-plugins/**'
  - 'autobot-slm-backend/**'
  - 'autobot-slm-database/**'
  - 'autobot-slm-frontend/**'
  - 'autobot-tts-worker/**'
  - 'autobot_shared/**'
  - 'libs/**'
  - 'plugins/**'
  - '.github/filters/docker-paths.yml'
