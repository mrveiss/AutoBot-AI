# Canonical path set for "does this change require the frontend test suite?"
#
# SINGLE SOURCE OF TRUTH -- do not inline a copy back into a workflow.
#
# Read once, by ci.yml's `changes` job, and published as two outputs of the same
# set: `run_unit_tests` (the REQUIRED `Unit & Integration Tests` context, also
# forced on merge_group) and `run_frontend_tests` (ci.yml's own `frontend-tests`
# job). Before #18208 ci.yml carried a second, narrower inline `frontend` set
# (autobot-frontend/**, ci.yml, the terminal plugin) under the same name; that
# was a defined-twice defect, and its three patterns are all inside this file.
# The consequence of unifying them is that `frontend-tests` now also runs when
# only the shared kit, ssot_config.py or the npm audit gate changes -- the safe
# direction.
#
# The list used to be mirrored in frontend-test.yml's `on.push.paths`; that
# trigger went away with the workflow (#18208), so there is no copy to keep in
# step any more.
frontend:
  - 'autobot-frontend/**'
  # #14786: the shared kit both frontends consume via a `file:` dependency.
  # It carries its own test suite (libs/autobot-ui/src/**/__tests__/**) that
  # nothing else runs -- without this line the suite is invisible to CI
  # entirely (no workflow referenced it at all before #14786 batch 1), so a
  # kit-only change would take this workflow's REQUIRED context green while
  # its own tests never executed.
  - 'libs/autobot-ui/**'
  - '.github/filters/frontend-paths.yml'
  # Canonical source for the cross-language parity guard (#13073, #13074):
  # a port/enum edit here with no frontend edit must still run the suite.
  - 'autobot_shared/ssot_config.py'
  # #16337: the Security Scan job's audit gate lives here, so a change to the
  # gate must run the gate.
  - 'pipeline-scripts/npm_audit_gate.py'
  # #15002: the redactor drift guard runs in this suite and reads the terminal
  # plugin's copy, so a plugin-only edit must still run it.
  - 'autobot-plugins/terminal/**'
