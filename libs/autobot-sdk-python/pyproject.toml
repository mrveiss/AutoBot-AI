[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autobot-sdk"
version = "0.1.0"
description = "Typed Python SDK for the AutoBot API"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["autobot_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
