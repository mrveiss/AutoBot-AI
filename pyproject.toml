[tool.black]
line-length = 120
# Stays py312 (NOT py314): the backend runs Python 3.14, but the NPU/OpenVINO
# worker runs Python 3.11 (roles/npu-worker/tasks/main.yml). A py314 target
# makes black emit PEP 758 unparenthesized `except A, B:`, a SyntaxError on
# that worker's cross-imported shared code.
#
# Bump only when the worker itself is on 3.14 — never before, or the reformat
# lands syntax the running worker cannot parse. As of 2026-08-08 that move is
# unblocked for the Linux worker: openvino 2026.3.0, torch 2.13.0 and numpy
# 2.5.1 all ship cp314 wheels, so #10877's "OpenVINO has no 3.14 wheels" no
# longer holds. The Windows worker still pins onnxruntime-openvino, which has
# no cp314 — settle whether it shares this code before bumping (#10877).
# Audit: docs/audit/python_314_consistency.md
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["autobot-backend", "autobot_shared", "autobot-slm-backend"]
known_first_party = ["autobot_shared"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
# Exclude test files — loose typing in tests is expected; this baseline
# mirrors the pre-existing state tracked in GH#7105.
exclude = [
    ".*_test\\.py$",
    ".*/tests/.*",
    ".*conftest\\.py$",
    # code_analysis/ is a standalone analysis tool with its own setup.py;
    # its src/ layout conflicts with the mypy module resolver. GH#7105.
    "autobot-backend/code_analysis/.*",
]

# redis_client / workflow_memory / message_bus use a dual async/sync
# dispatch pattern whose overloads aren't modeled in type stubs.
# Fix tracked in GH#7105.
[[tool.mypy.overrides]]
module = [
    "autobot_shared.redis_client",
    "autobot_shared.workflow_memory",
    "autobot_shared.message_bus",
]
ignore_errors = true
