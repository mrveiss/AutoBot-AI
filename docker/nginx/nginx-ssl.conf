# AutoBot nginx Configuration — TLS/HTTPS (#1896)
# Use with: AUTOBOT_DOCKER_NGINX_CONF=./docker/nginx/nginx-ssl.conf
#
# AutoBot - AI-Powered Automation Platform
# Copyright (c) 2025 mrveiss
# Author: mrveiss

worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/nginx-common.conf;
    include /etc/nginx/nginx-backend-upstream.conf;

    # HTTP -> HTTPS redirect, except /health (#18593)
    include /etc/nginx/nginx-tls-redirect.conf;

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name _;

        include /etc/nginx/nginx-tls.conf;

        include /etc/nginx/nginx-locations.conf;
    }
}
