# AutoBot nginx SLM-only configuration (#18585)
# Serves the SLM web GUI at /slm and proxies /slm/api to autobot-slm, with no
# dependency on the main backend — used by the autobot-slm-gui service
# (compose profile "slm"). The full stack uses nginx.conf instead.
#
# AutoBot - AI-Powered Automation Platform
# Copyright (c) 2025 mrveiss
# Author: mrveiss

worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/nginx-common.conf;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        # Relative Location: the redirect stays right if the host port is remapped
        absolute_redirect off;

        location = / {
            return 302 /slm/;
        }

        include /etc/nginx/nginx-slm-locations.conf;
    }
}
