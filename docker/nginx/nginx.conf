# AutoBot nginx Configuration (#1809)
# Unified config for Docker deployment
# Frontend at /, SLM at /slm, Backend API at /api
#
# AutoBot - AI-Powered Automation Platform
# Copyright (c) 2025 mrveiss
# Author: mrveiss

worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/nginx-common.conf;

    server {
        listen 80;
        server_name _;

        include /etc/nginx/nginx-locations.conf;
    }
}
