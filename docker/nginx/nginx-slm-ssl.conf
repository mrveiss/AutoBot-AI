# AutoBot nginx Configuration -- SLM web GUI only, TLS/HTTPS (#18593)
# Use with: AUTOBOT_DOCKER_SLM_NGINX_CONF=./docker/nginx/nginx-slm-ssl.conf
# Same routes as nginx-slm.conf; same certificates (./docker/certs) and TLS settings as
# the full stack's nginx-ssl.conf. Never names the main backend: the SLM-only path has none.
#
# AutoBot - AI-Powered Automation Platform
# Copyright (c) 2025 mrveiss
# Author: mrveiss

worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/nginx-common.conf;

    # HTTP -> HTTPS redirect, except /health
    include /etc/nginx/nginx-tls-redirect.conf;

    server {
        listen 443 ssl http2;
        server_name _;
        root /usr/share/nginx/html;
        absolute_redirect off;

        include /etc/nginx/nginx-tls.conf;

        location = / {
            return 302 /slm/;
        }

        include /etc/nginx/nginx-slm-locations.conf;
    }
}
