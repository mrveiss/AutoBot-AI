# AutoBot nginx -- TLS settings for a 443 server block (#18593)
# Included inside `server { listen 443 ssl ...; }` by nginx-ssl.conf (full stack) and
# nginx-slm-ssl.conf (SLM-only). One copy: certificates from ./docker/certs.
#
# AutoBot - AI-Powered Automation Platform
# Copyright (c) 2025 mrveiss
# Author: mrveiss

ssl_certificate /etc/nginx/certs/autobot.crt;
ssl_certificate_key /etc/nginx/certs/autobot.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# Enable for CA-signed certificates:
# ssl_stapling on;
# ssl_stapling_verify on;
# resolver <your DNS resolvers> valid=300s;

# Security headers (server-level; locations with their own add_header
# also repeat these — see nginx-locations.conf for the reason)
add_header Strict-Transport-Security $hsts always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
