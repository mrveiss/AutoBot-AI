# AutoBot nginx shared http-block settings (#6252)
# Include inside http {} in nginx.conf and nginx-ssl.conf
#
# AutoBot - AI-Powered Automation Platform
# Copyright (c) 2025 mrveiss
# Author: mrveiss

include /etc/nginx/mime.types;
default_type application/octet-stream;

# Strict-Transport-Security value: set on HTTPS, empty on plain HTTP. nginx sends no
# header for an empty value, so `add_header Strict-Transport-Security $hsts always;`
# is safe in locations shared by HTTP and HTTPS servers (#18593).
map $scheme $hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent"';

access_log /dev/stdout main;

sendfile on;
tcp_nopush on;
tcp_nodelay on;
keepalive_timeout 65;
types_hash_max_size 2048;
client_max_body_size 100M;

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript
           text/xml application/xml application/xml+rss text/javascript
           image/svg+xml;

# SLM upstream (Docker service name). The main backend's upstream lives in
# nginx-backend-upstream.conf, included only by configs that serve the full
# stack: nginx resolves upstream hosts at startup, so the SLM-only GUI
# (nginx-slm.conf) must not name a backend that is not running (#18585).
upstream slm {
    server autobot-slm:8000;
}
