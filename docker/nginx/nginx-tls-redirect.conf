# AutoBot nginx -- the port-80 server of a TLS config (#18593)
# Included at http level by nginx-ssl.conf and nginx-slm-ssl.conf. Everything is
# redirected to HTTPS except /health, which the container healthcheck fetches over
# plain HTTP: following the redirect would fail on a self-signed certificate.
#
# AutoBot - AI-Powered Automation Platform
# Copyright (c) 2025 mrveiss
# Author: mrveiss

server {
    listen 80;
    server_name _;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
