# AutoBot nginx SLM location blocks (#18585)
# Include inside a server {} block. Shared by the full stack (via
# nginx-locations.conf) and the SLM-only GUI (nginx-slm.conf), so the SLM
# routes, health check and static caching have one home.
#
# AutoBot - AI-Powered Automation Platform
# Copyright (c) 2025 mrveiss
# Author: mrveiss

# --- SLM WebSocket (must come before /slm/api/ to take priority) ---
location /slm/api/ws/ {
    proxy_pass http://slm/api/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
}

# --- SLM API (must come before SLM frontend catch-all) ---
location /slm/api/ {
    proxy_pass http://slm/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# --- SLM Admin UI at /slm ---
location /slm/ {
    alias /usr/share/nginx/html/slm/;
    try_files $uri $uri/ /slm/index.html;
}

# --- Health check endpoint ---
# Security headers repeated here because nginx does not inherit server-level
# add_header directives into locations that define their own add_header.
location /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# --- Static file caching ---
# Security headers repeated here for same nginx inheritance reason as /health.
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
}
