[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autobot_shared"
version = "1.0.0"
description = "Shared utilities for AutoBot platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "mrveiss" }]
license = { text = "Proprietary" }
dependencies = [
    "redis>=7.4.0",
    "pyyaml>=6.0.3",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.0.0",   # ssot_config.py
    "python-dotenv>=1.2.2",
    "aiohttp>=3.9.0",
    "prometheus-client>=0.20.0",
    "fastapi>=0.100.0",            # models/pagination.py (Query, Depends)
    "starlette>=0.27.0",           # proxy_utils.py (starlette.requests.Request)
    "PyJWT[crypto]>=2.8.0",        # auth/jwt_core.py
    "bcrypt>=4.0.0",               # auth/jwt_core.py
    # OpenTelemetry distributed tracing (Issue #697)
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-exporter-otlp>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-instrumentation-redis>=0.62b1",
    "opentelemetry-instrumentation-aiohttp-client>=0.62b1",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "*_test*"]
