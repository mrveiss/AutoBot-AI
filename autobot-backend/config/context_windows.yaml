  default:
    name: qwen3.5:9b
    context_window_tokens: 32768
    max_output_tokens: 4096
    compression_threshold: 32768
    essential_story_tokens: 600
    message_budget:
      system_prompt: 500
      recent_messages: 20
      max_history_tokens: 3000

