# AutoBot Docker Compose — Single-Node Deployment (#1809)
# All core services on one machine. Frontend at /, SLM at /slm.
#
# Usage:
#   docker compose up -d                    # Start all core services
#   docker compose --profile monitoring up -d  # Include Prometheus + Grafana
#   docker compose --profile ollama up -d      # Include local Ollama LLM
#
# AutoBot - AI-Powered Automation Platform
# Copyright (c) 2025 mrveiss
# Author: mrveiss

services:
  # ---- Data Layer ----

  autobot-redis:
    image: redis/redis-stack:7.4.0-v1
    container_name: autobot-redis
    restart: unless-stopped
    ports:
      - "${AUTOBOT_REDIS_PORT:-6379}:6379"
      - "8001:8001"  # RedisInsight UI
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--appendonly yes --save 60 1 --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - autobot

  autobot-postgres:
    image: postgres:16-bookworm
    container_name: autobot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    environment:
      - POSTGRES_USER=${AUTOBOT_DB_USER:-autobot}
      - POSTGRES_PASSWORD=${AUTOBOT_DB_PASSWORD:-autobot}
      - POSTGRES_DB=${AUTOBOT_DB_NAME:-autobot_slm}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTOBOT_DB_USER:-autobot}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - autobot

  autobot-chromadb:
    image: chromadb/chroma:0.5.23
    container_name: autobot-chromadb
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=False
      - IS_PERSISTENT=TRUE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - autobot

  # ---- Application Layer ----

  autobot-backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: autobot/backend:latest
    container_name: autobot-backend
    restart: unless-stopped
    env_file:
      - docker/.env.docker
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    environment:
      - AUTOBOT_ENVIRONMENT=production
      - AUTOBOT_DEPLOYMENT_MODE=local
      - AUTOBOT_LOG_LEVEL=${AUTOBOT_LOG_LEVEL:-INFO}
      - AUTOBOT_REDIS_HOST=autobot-redis
      - AUTOBOT_REDIS_PORT=6379
      - AUTOBOT_OLLAMA_HOST=${AUTOBOT_OLLAMA_HOST:-autobot-ollama}
      - AUTOBOT_OLLAMA_PORT=11434
      - AUTOBOT_OLLAMA_ENDPOINT=http://${AUTOBOT_OLLAMA_HOST:-autobot-ollama}:11434
      - AUTOBOT_BACKEND_HOST=0.0.0.0
      - AUTOBOT_BACKEND_PORT=8000
      - AUTOBOT_LLM_PROVIDER=${AUTOBOT_LLM_PROVIDER:-ollama}
      - AUTOBOT_DEFAULT_LLM_MODEL=${AUTOBOT_DEFAULT_LLM_MODEL:-mistral:7b-instruct}
      - AUTOBOT_EMBEDDING_MODEL=${AUTOBOT_EMBEDDING_MODEL:-nomic-embed-text:latest}
      - AUTOBOT_LLM_FAILSAFE_PROVIDER=${AUTOBOT_LLM_PROVIDER:-ollama}
      - AUTOBOT_LLM_FAILSAFE_ENDPOINT=http://${AUTOBOT_OLLAMA_HOST:-autobot-ollama}:11434
      - AUTOBOT_CHROMADB_HOST=autobot-chromadb
      - AUTOBOT_CHROMADB_PORT=8000
      - AUTOBOT_LLAMAINDEX_LLM_ENDPOINT=http://${AUTOBOT_OLLAMA_HOST:-autobot-ollama}:11434
      - AUTOBOT_LLAMAINDEX_EMBEDDING_ENDPOINT=http://${AUTOBOT_OLLAMA_HOST:-autobot-ollama}:11434
    depends_on:
      autobot-redis:
        condition: service_healthy
      autobot-chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - autobot

  autobot-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: autobot/backend:latest
    container_name: autobot-worker
    restart: unless-stopped
    command: >
      python3.12 -m celery -A celery_app worker
      --loglevel=info
      --queues=celery,deployments,provisioning,services
      --concurrency=2
    working_dir: /app/autobot-backend
    env_file:
      - docker/.env.docker
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    environment:
      - AUTOBOT_ENVIRONMENT=production
      - AUTOBOT_DEPLOYMENT_MODE=local
      - AUTOBOT_LOG_LEVEL=${AUTOBOT_LOG_LEVEL:-INFO}
      - AUTOBOT_REDIS_HOST=autobot-redis
      - AUTOBOT_REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://autobot-redis:6379/1
      - CELERY_RESULT_BACKEND=redis://autobot-redis:6379/2
      - AUTOBOT_CHROMADB_HOST=autobot-chromadb
      - AUTOBOT_CHROMADB_PORT=8000
    depends_on:
      autobot-redis:
        condition: service_healthy
      autobot-chromadb:
        condition: service_healthy
    networks:
      - autobot

  autobot-slm:
    build:
      context: .
      dockerfile: docker/slm/Dockerfile
    image: autobot/slm:latest
    container_name: autobot-slm
    restart: unless-stopped
    volumes:
      - slm_data:/app/data
      - slm_logs:/app/logs
    environment:
      - AUTOBOT_ENVIRONMENT=production
      - AUTOBOT_LOG_LEVEL=${AUTOBOT_LOG_LEVEL:-INFO}
      - AUTOBOT_REDIS_HOST=autobot-redis
      - AUTOBOT_REDIS_PORT=6379
      - SLM_DATABASE_URL=postgresql+asyncpg://${AUTOBOT_DB_USER:-autobot}:${AUTOBOT_DB_PASSWORD:-autobot}@autobot-postgres:5432/${AUTOBOT_DB_NAME:-autobot_slm}
      - SLM_USERS_DATABASE_URL=postgresql+asyncpg://${AUTOBOT_DB_USER:-autobot}:${AUTOBOT_DB_PASSWORD:-autobot}@autobot-postgres:5432/slm_users
      - SLM_POSTGRES_HOST=autobot-postgres
    depends_on:
      autobot-redis:
        condition: service_healthy
      autobot-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - autobot

  autobot-frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: autobot/frontend:latest
    container_name: autobot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - autobot-backend
      - autobot-slm
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - autobot

  # ---- Optional: Local LLM ----

  autobot-ollama:
    image: ollama/ollama:latest
    container_name: autobot-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - autobot
    profiles:
      - ollama

  # ---- Optional: Monitoring ----

  autobot-prometheus:
    image: prom/prometheus:v2.53.0
    container_name: autobot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - autobot
    profiles:
      - monitoring

  autobot-grafana:
    image: grafana/grafana:11.1.0
    container_name: autobot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-autobot}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - autobot-prometheus
    networks:
      - autobot
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  backend_data:
  backend_logs:
  slm_data:
  slm_logs:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  autobot:
    driver: bridge
