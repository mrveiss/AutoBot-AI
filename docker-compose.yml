# AutoBot Docker Compose — Single-Node Deployment (#1809)
# All core services on one machine. Frontend at /, SLM at /slm.
# Requires Docker Compose v2+ for resource limits (deploy.resources).
#
# Usage — first `bash docker/generate-secrets.sh` once per host: it picks the
# management network range (AUTOBOT_DOCKER_MGMT_PREFIX, no default, #16833):
#   docker compose --env-file docker/.env.docker --env-file docker/.env.secrets up -d --build
#   ... --profile monitoring up -d   /   ... --profile ollama up -d
#
# SECRETS (GH#9775, GH#9905): AUTOBOT_JWT_SECRET / SECRET_KEY have NO committed
# fallback — a shared committed signing secret allows token forgery. On first
# `up`, the `autobot-secrets-init` service auto-generates UNIQUE per-deployment
# secrets into the shared `autobot_secrets` volume (never in git, reused across
# restarts); with-secrets.sh loads them into backend/worker/slm at runtime.
# To pin your own (production), set AUTOBOT_JWT_SECRET / SECRET_KEY in the
# environment or root .env, or run docker/generate-secrets.sh + --env-file —
# an explicit value always overrides the auto-generated one.
#
# NOTE: --env-file docker/.env.docker is required when the root .env contains
# fleet-specific values that are invalid in a Docker context. See #2458.
#
# Healthcheck convention (#7456):
#   - Default to ``["CMD", ...]`` (exec form) — no shell, no env-var
#     expansion, no I/O redirection. Faster + safer.
#   - Use ``["CMD-SHELL", "..."]`` ONLY when the check needs a shell
#     feature: ``${VAR}`` expansion, ``$HOSTNAME`` reference, redirection
#     (``>/dev/null 2>&1``), or piped commands. Audit confirmed all 3
#     current CMD-SHELL uses (postgres, celery, ollama) are justified.
#
# AutoBot - AI-Powered Automation Platform
# Copyright (c) 2025 mrveiss
# Author: mrveiss

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ---- Data Layer ----

  autobot-redis:
    image: redis/redis-stack:7.4.0-v1
    container_name: autobot-redis
    restart: unless-stopped
    ports:
      # #17500: loopback only, like Postgres and ChromaDB; containers reach Redis on the network.
      - "127.0.0.1:${AUTOBOT_REDIS_PORT:-6379}:6379"
      - "127.0.0.1:8001:8001"  # RedisInsight UI (localhost only)
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--appendonly yes --save 60 1 --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      autobot-mgmt:
        ipv4_address: ${AUTOBOT_DOCKER_MGMT_PREFIX}.10
      autobot-data:

  autobot-postgres:
    image: postgres:16-bookworm
    container_name: autobot-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    environment:
      # Canonical names first; AUTOBOT_DB_USER, AUTOBOT_DB_NAME and AUTOBOT_USERS_DB_NAME still
      # work for one release, and the SLM logs a deprecation warning naming them (#19408).
      - POSTGRES_USER=${AUTOBOT_POSTGRES_USER:-${AUTOBOT_DB_USER:-autobot}}
      - POSTGRES_PASSWORD=${AUTOBOT_DB_PASSWORD:?run docker/generate-secrets.sh and pass --env-file docker/.env.secrets (INSTALL.md)}
      - POSTGRES_DB=${SLM_DB_NAME:-${AUTOBOT_DB_NAME:-autobot_slm}}
      # Read by docker/postgres/init-databases.sh, which creates this database. Postgres runs that
      # script only on an empty volume; on an existing one, create a renamed database by hand.
      - AUTOBOT_POSTGRES_DB=${AUTOBOT_POSTGRES_DB:-${AUTOBOT_USERS_DB_NAME:-autobot_users}}
    healthcheck:
      # -d targets an existing DB; without it pg_isready connects to db=user
      # ("autobot"), which is never created → FATAL spam every interval (#9713).
      test: ["CMD-SHELL", "pg_isready -U ${AUTOBOT_POSTGRES_USER:-${AUTOBOT_DB_USER:-autobot}} -d ${SLM_DB_NAME:-${AUTOBOT_DB_NAME:-autobot_slm}}"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      autobot-mgmt:
        ipv4_address: ${AUTOBOT_DOCKER_MGMT_PREFIX}.11
      autobot-data:

  autobot-chromadb:
    # Match the v1 client (chromadb>=1.5.9 in autobot-backend/requirements.txt).
    # The old 0.5.23 server couldn't parse v1 client requests → KeyError '_type'
    # spam (#9717). v1.x persists to /data (was /chroma/chroma in 0.5.x).
    image: chromadb/chroma:1.5.9
    container_name: autobot-chromadb
    restart: unless-stopped
    ports:
      # #19321: two ports, two meanings. Host side = PortConfig.chromadb (8100, what
      # bare-metal ChromaDB listens on and host clients dial). Container side = the
      # image's own listen port (8000), which in-network clients below dial as
      # AUTOBOT_CHROMADB_PORT. repo_tests/chromadb_port_one_home_19321_test.py pins both.
      - "127.0.0.1:8100:8000"
    volumes:
      - chroma_data:/data
    environment:
      - ANONYMIZED_TELEMETRY=False
      - IS_PERSISTENT=TRUE
      # #12513: CHROMA_SERVER_AUTHN_* token auth, driven by a SINGLE knob
      # (AUTOBOT_CHROMADB_AUTH_TOKEN — same var name as the ssot_config field
      # and the client-side env var below) via Compose's "${VAR:+alt}"
      # substitution operator. This is deliberately atomic: the provider line
      # only ever gets a value when the token is also set, so it's never
      # possible to have the provider configured with empty credentials
      # (chroma crashes at boot on that combination) or a token sent by
      # clients while the server silently stays unauthenticated. Unset token
      # = both lines empty = auth disabled, matching pre-#12513 behaviour
      # (dev/local, unauthenticated HttpClient). To enable: set
      # AUTOBOT_CHROMADB_AUTH_TOKEN in the root .env (never commit real
      # values) — both lines below populate together.
      - CHROMA_SERVER_AUTHN_PROVIDER=${AUTOBOT_CHROMADB_AUTH_TOKEN:+chromadb.auth.token_authn.TokenAuthenticationServerProvider}
      - CHROMA_SERVER_AUTHN_CREDENTIALS=${AUTOBOT_CHROMADB_AUTH_TOKEN:-}
    healthcheck:
      # The chroma 1.x image is minimal (no curl/wget); use bash /dev/tcp to hit
      # the v2 heartbeat and confirm a 200 (#9717).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      autobot-mgmt:
        ipv4_address: ${AUTOBOT_DOCKER_MGMT_PREFIX}.12
      autobot-data:

  # ---- Application Layer ----

  # GH#9905: auto-provision per-deployment signing secrets into the shared
  # autobot_secrets volume so `docker compose up` works out of the box with no
  # committed secret. Runs once, idempotently; all app services wait for it.
  autobot-secrets-init:
    image: alpine:3.20
    container_name: autobot-secrets-init
    restart: "no"
    volumes:
      - autobot_secrets:/secrets
      - ./docker/secrets-init.sh:/secrets-init.sh:ro
    command: ["/bin/sh", "/secrets-init.sh"]
    networks:
      - autobot-mgmt

  autobot-backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      # claude CLI version pin (GH#9950): optional exact package version for a
      # reproducible build (e.g. 2.1.89). Empty default = current stable-channel
      # build from Anthropic's signed apt repo (integrity verified by apt).
      args:
        CLAUDE_CLI_VERSION: "${CLAUDE_CLI_VERSION:-}"
    image: autobot/backend:latest
    container_name: autobot-backend
    restart: unless-stopped
    # GH#9905: load the shared auto-generated signing secret, then chain the
    # image's own entrypoint (/app/entrypoint.sh), which runs Alembic
    # migrations for Postgres-backed user modes before exec'ing the app
    # (#9759). NB: overriding entrypoint clears the image CMD, so the command
    # is re-declared here (kept in sync with docker/backend/Dockerfile).
    entrypoint: ["/bin/sh", "/usr/local/bin/with-secrets.sh", "/app/entrypoint.sh"]
    command: ["python3", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1", "--app-dir", "/app/autobot-backend"]
    env_file:
      - docker/.env.docker
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
      - autobot_secrets:/secrets:ro
      - ./docker/with-secrets.sh:/usr/local/bin/with-secrets.sh:ro
    environment:
      # #19316: no AUTOBOT_DEPLOYMENT_MODE -- unset is auto-detect, docker_local in a container.
      - AUTOBOT_ENVIRONMENT=production
      # #19395: this environment also selects the lenient feature-router boot mode
      # (deployment_profile.feature_routers_strict_default).
      # #14081/#14110 security review: with no AUTOBOT_BASE_DIR set, the
      # canonical secrets-store/JWT-key/project-state location
      # (ssot_config.path.data_path) resolved to /opt/autobot/data — the
      # container's ephemeral writable layer, NOT the persistent
      # backend_data volume mounted at /app/data below. The one-time
      # migration was moving real secrets OFF the volume and deleting the
      # source, so the next recreate destroyed them. Pinning this to the
      # volume's mount point makes canonical == legacy for this service, so
      # the migration correctly no-ops instead of relocating anything.
      - AUTOBOT_DATA_DIR=${AUTOBOT_DATA_DIR:-/app/data}
      # #18293: the retired chat-transcript store (read-only legacy), where its old writer put
      # it -- data/conversation_transcripts under the image WORKDIR (/app). Pinned, not inferred.
      - AUTOBOT_LEGACY_TRANSCRIPTS_DIR=${AUTOBOT_LEGACY_TRANSCRIPTS_DIR:-/app/data/conversation_transcripts}
      # No AI Stack VM ships with compose — disable the poll to stop the per-boot
      # connection-error warning flood (#9782). Set to true if you run an AI Stack.
      - AUTOBOT_AI_STACK_ENABLED=${AUTOBOT_AI_STACK_ENABLED:-false}
      - AUTOBOT_LOG_LEVEL=${AUTOBOT_LOG_LEVEL:-INFO}
      - AUTOBOT_REDIS_HOST=autobot-redis
      - AUTOBOT_REDIS_PORT=6379
      - AUTOBOT_OLLAMA_HOST=${AUTOBOT_OLLAMA_HOST:-autobot-ollama}
      - AUTOBOT_OLLAMA_PORT=11434
      - AUTOBOT_OLLAMA_ENDPOINT=http://${AUTOBOT_OLLAMA_HOST:-autobot-ollama}:11434
      - AUTOBOT_BACKEND_HOST=0.0.0.0
      - AUTOBOT_BACKEND_PORT=8001
      - AUTOBOT_LLM_PROVIDER=${AUTOBOT_LLM_PROVIDER:-ollama}
      - AUTOBOT_DEFAULT_LLM_MODEL=${AUTOBOT_DEFAULT_LLM_MODEL:-qwen3.5:9b}
      - AUTOBOT_EMBEDDING_MODEL=${AUTOBOT_EMBEDDING_MODEL:-nomic-embed-text:latest}
      - AUTOBOT_LLM_FAILSAFE_PROVIDER=${AUTOBOT_LLM_PROVIDER:-ollama}
      - AUTOBOT_LLM_FAILSAFE_ENDPOINT=http://${AUTOBOT_OLLAMA_HOST:-autobot-ollama}:11434
      - AUTOBOT_CHROMADB_HOST=autobot-chromadb
      - AUTOBOT_CHROMADB_PORT=8000
      # #12513: shared secret for CHROMA_SERVER_AUTHN_* token auth on the
      # autobot-chromadb service above — empty by default (auth disabled,
      # dev/local); ssot_config.misc.chromadb_auth_token omits client auth
      # settings entirely when unset, matching an unauthenticated server.
      - AUTOBOT_CHROMADB_AUTH_TOKEN=${AUTOBOT_CHROMADB_AUTH_TOKEN:-}
      - AUTOBOT_LLAMAINDEX_LLM_ENDPOINT=http://${AUTOBOT_OLLAMA_HOST:-autobot-ollama}:11434
      - AUTOBOT_LLAMAINDEX_EMBEDDING_ENDPOINT=http://${AUTOBOT_OLLAMA_HOST:-autobot-ollama}:11434
      - AUTOBOT_AUDIT_LOG_FILE=/app/logs/audit.log
      # single_user mode is retired (#10636): AutoBot always runs Postgres-backed user
      # management, and the entrypoint bootstraps the schema via `alembic upgrade head`
      # (#9759). single_company is the default the backend falls back to anyway; naming
      # it here keeps the retired value from logging an "invalid mode" warning (#18729).
      - AUTOBOT_USER_MODE=${AUTOBOT_USER_MODE:-single_company}
      # The first platform admin is seeded on startup from this (#10199). generate-secrets.sh
      # writes it to docker/.env.secrets; compose refuses to start without it (#17793).
      - AUTOBOT_ADMIN_PASSWORD=${AUTOBOT_ADMIN_PASSWORD:?run docker/generate-secrets.sh and pass --env-file docker/.env.secrets (INSTALL.md)}
      - AUTOBOT_ADMIN_USERNAME=${AUTOBOT_ADMIN_USERNAME:-admin}
      - AUTOBOT_POSTGRES_HOST=autobot-postgres
      - AUTOBOT_POSTGRES_PORT=5432
      - AUTOBOT_POSTGRES_DB=${AUTOBOT_POSTGRES_DB:-${AUTOBOT_USERS_DB_NAME:-autobot_users}}
      - AUTOBOT_POSTGRES_USER=${AUTOBOT_POSTGRES_USER:-${AUTOBOT_DB_USER:-autobot}}
      - AUTOBOT_POSTGRES_PASSWORD=${AUTOBOT_DB_PASSWORD:?run docker/generate-secrets.sh and pass --env-file docker/.env.secrets (INSTALL.md)}
      - AUTOBOT_ENCRYPTION_KEY=${AUTOBOT_ENCRYPTION_KEY:-}
      # config.slm_url builds from AUTOBOT_SLM_HOST/PORT. The 127.0.0.1 default
      # left the node unable to reach SLM → connection spam + host shown offline
      # in the SLM dashboard. Point it at the service name (#9715).
      - AUTOBOT_SLM_HOST=autobot-slm
      - AUTOBOT_SLM_PORT=8000
      # Which fleet node hosts Redis (colocated on the SLM manager in compose) so
      # backend Redis service routing can target it instead of an empty id (#9761).
      - REDIS_NODE_ID=${REDIS_NODE_ID:-00-SLM-Manager}
      # Shared signing secrets — must match SLM so the node JWT verifies (#9715)
      # GH#9905: no parse-time fail. If unset, with-secrets.sh loads a unique
      # per-deployment secret auto-generated by secrets-init into the shared
      # autobot_secrets volume. An explicit value here (prod) still wins.
      - AUTOBOT_JWT_SECRET=${AUTOBOT_JWT_SECRET:-}
      - SECRET_KEY=${SECRET_KEY:-}
      # LLC subprocess agent CLIs (GH#9793): the spawned claude / gh process
      # inherits os.environ from the backend process, so these must be present
      # in the container environment.  All three default to empty so the image
      # boots without them; set real values in the host shell or in a copy of
      # docker/.env.docker passed with --env-file (compose skips the root .env then, #18555).
      - LLC_AGENT_API_BASE_URL=http://localhost:8001/api
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GH_TOKEN=${GH_TOKEN:-}
    depends_on:
      autobot-secrets-init:
        condition: service_completed_successfully
      autobot-redis:
        condition: service_healthy
      autobot-chromadb:
        condition: service_healthy
      # Startup migrations (#9759) need Postgres reachable before the
      # entrypoint runs `alembic upgrade head`.
      autobot-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/system/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      autobot-mgmt:
        ipv4_address: ${AUTOBOT_DOCKER_MGMT_PREFIX}.13
      autobot-data:
      autobot-app:

  autobot-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      # claude CLI version pin (GH#9950): optional exact package version for a
      # reproducible build (e.g. 2.1.89). Empty default = current stable-channel
      # build from Anthropic's signed apt repo (integrity verified by apt).
      args:
        CLAUDE_CLI_VERSION: "${CLAUDE_CLI_VERSION:-}"
    image: autobot/backend:latest
    container_name: autobot-worker
    restart: unless-stopped
    # GH#9905: load the shared secret, then exec celery. Exec-form command so it
    # survives the with-secrets.sh entrypoint's `exec "$@"` as proper argv.
    entrypoint: ["/bin/sh", "/usr/local/bin/with-secrets.sh"]
    command:
      - python3.14
      - -m
      - celery
      - -A
      - celery_app
      - worker
      - --loglevel=info
      # provisioning/services queues removed — no tasks route to them since
      # deployment tasks moved to the SLM server (#729, cleanup #11608).
      # #11631: memory + analytics added — task_routes sends memory write-path
      # and background-analytics tasks there; with no consumer they sat in
      # Redis until eviction. Must stay a superset of the queues task_routes
      # targets (SSOT: task_queues in autobot-backend/celery_app.py; guarded
      # by autobot-backend/celery_queue_coverage_test.py).
      - --queues=celery,deployments,memory,analytics
      - --concurrency=2
    working_dir: /app/autobot-backend
    env_file:
      - docker/.env.docker
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
      - autobot_secrets:/secrets:ro
      - ./docker/with-secrets.sh:/usr/local/bin/with-secrets.sh:ro
    environment:
      - AUTOBOT_ENVIRONMENT=production
      # #14081/#14110 security review: this service's working_dir differs
      # from autobot-backend's, so its own legacy CWD-relative resolver
      # would disagree with the backend's — pinning canonical here too
      # means both converge on the same persistent backend_data volume
      # (see autobot-backend's AUTOBOT_DATA_DIR comment above for the full
      # data-loss mechanism this closes).
      - AUTOBOT_DATA_DIR=${AUTOBOT_DATA_DIR:-/app/data}
      # No AI Stack VM ships with compose — disable the poll to stop the per-boot
      # connection-error warning flood (#9782). Set to true if you run an AI Stack.
      - AUTOBOT_AI_STACK_ENABLED=${AUTOBOT_AI_STACK_ENABLED:-false}
      - AUTOBOT_LOG_LEVEL=${AUTOBOT_LOG_LEVEL:-INFO}
      - AUTOBOT_REDIS_HOST=autobot-redis
      - AUTOBOT_REDIS_PORT=6379
      # Broker/result URLs: celery_app builds them from AUTOBOT_REDIS_HOST/PORT above and
      # redis-databases.yaml (+ AUTOBOT_REDIS_DB_CELERY_*), #19232 -- no URL or DB literal here.
      - AUTOBOT_CHROMADB_HOST=autobot-chromadb
      - AUTOBOT_CHROMADB_PORT=8000
      # #12513: shared secret for CHROMA_SERVER_AUTHN_* token auth on the
      # autobot-chromadb service above — empty by default (auth disabled,
      # dev/local); ssot_config.misc.chromadb_auth_token omits client auth
      # settings entirely when unset, matching an unauthenticated server.
      - AUTOBOT_CHROMADB_AUTH_TOKEN=${AUTOBOT_CHROMADB_AUTH_TOKEN:-}
      - AUTOBOT_AUDIT_LOG_FILE=/app/logs/audit.log
      # User-mgmt/RBAC tasks need the same Postgres + mode wiring as the backend.
      # single_user is retired (#10636); single_company matches the backend's
      # default, and the backend entrypoint bootstraps the schema (#9759) (#18729).
      - AUTOBOT_USER_MODE=${AUTOBOT_USER_MODE:-single_company}
      - AUTOBOT_POSTGRES_HOST=autobot-postgres
      - AUTOBOT_POSTGRES_PORT=5432
      - AUTOBOT_POSTGRES_DB=${AUTOBOT_POSTGRES_DB:-${AUTOBOT_USERS_DB_NAME:-autobot_users}}
      - AUTOBOT_POSTGRES_USER=${AUTOBOT_POSTGRES_USER:-${AUTOBOT_DB_USER:-autobot}}
      - AUTOBOT_POSTGRES_PASSWORD=${AUTOBOT_DB_PASSWORD:?run docker/generate-secrets.sh and pass --env-file docker/.env.secrets (INSTALL.md)}
      - AUTOBOT_ENCRYPTION_KEY=${AUTOBOT_ENCRYPTION_KEY:-}
      - AUTOBOT_SLM_HOST=autobot-slm
      - AUTOBOT_SLM_PORT=8000
      # Which fleet node hosts Redis (colocated on the SLM manager in compose) so
      # backend Redis service routing can target it instead of an empty id (#9761).
      - REDIS_NODE_ID=${REDIS_NODE_ID:-00-SLM-Manager}
      # Shared signing secrets — must match SLM so the node JWT verifies (#9715)
      # GH#9905: no parse-time fail. If unset, with-secrets.sh loads a unique
      # per-deployment secret auto-generated by secrets-init into the shared
      # autobot_secrets volume. An explicit value here (prod) still wins.
      - AUTOBOT_JWT_SECRET=${AUTOBOT_JWT_SECRET:-}
      - SECRET_KEY=${SECRET_KEY:-}
    healthcheck:
      # $$HOSTNAME (escaped) expands inside the container at runtime. A single
      # $HOSTNAME is interpolated by Compose at parse time to an empty string,
      # making --destination "celery@" match no node → false unhealthy (#9714).
      test: ["CMD-SHELL", "python3.14 -m celery -A celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      autobot-secrets-init:
        condition: service_completed_successfully
      autobot-redis:
        condition: service_healthy
      autobot-chromadb:
        condition: service_healthy
      # The backend entrypoint runs the schema migrations (#9759); waiting for
      # it to be healthy stops worker tasks hitting a not-yet-migrated DB on
      # first boot in Postgres-backed user modes.
      autobot-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      autobot-mgmt:
        ipv4_address: ${AUTOBOT_DOCKER_MGMT_PREFIX}.14
      autobot-data:
      autobot-app:

  autobot-celery-beat:
    # #18584: builds the shared backend image itself, like autobot-worker. With
    # only `image:`, a first run (or `up autobot-celery-beat` alone) found no
    # local autobot/backend and tried to pull it from a registry where it does
    # not exist ("pull access denied").
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: autobot/backend:latest
    container_name: autobot-celery-beat
    restart: unless-stopped
    # #18910: no image ENTRYPOINT. /app/entrypoint.sh always migrates since #18729, and
    # beat used to skip it only because AUTOBOT_USER_MODE was unset. Beat has no Postgres
    # settings, so it migrated against localhost, exited and crash-looped. The backend
    # alone runs `alembic upgrade head`; beat must not, since alembic takes no advisory
    # lock and two would race. With no entrypoint celery is PID 1, which the procfs
    # healthcheck below expects.
    entrypoint: []
    command: >
      python3.14 -m celery -A celery_app beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
      --schedule /app/data/celerybeat-schedule
    working_dir: /app/autobot-backend
    env_file:
      - docker/.env.docker
    volumes:
      # Schedule db lives on the writable backend_data volume. The old
      # /var/lib/autobot mount was root-owned → gdbm EACCES crash loop (#9712).
      - backend_data:/app/data
      - backend_logs:/app/logs
    environment:
      - AUTOBOT_ENVIRONMENT=production
      # #14081/#14110 security review: kept consistent with autobot-backend
      # and autobot-worker so any secrets-store access this process makes
      # (task modules it loads may import services.secrets_service)
      # resolves to the same persistent backend_data volume, not the
      # container's ephemeral writable layer.
      - AUTOBOT_DATA_DIR=${AUTOBOT_DATA_DIR:-/app/data}
      # No AI Stack VM ships with compose — disable the poll to stop the per-boot
      # connection-error warning flood (#9782). Set to true if you run an AI Stack.
      - AUTOBOT_AI_STACK_ENABLED=${AUTOBOT_AI_STACK_ENABLED:-false}
      - AUTOBOT_LOG_LEVEL=${AUTOBOT_LOG_LEVEL:-INFO}
      - AUTOBOT_REDIS_HOST=autobot-redis
      - AUTOBOT_REDIS_PORT=6379
      # Broker/result URLs: celery_app builds them from AUTOBOT_REDIS_HOST/PORT above and
      # redis-databases.yaml (+ AUTOBOT_REDIS_DB_CELERY_*), #19232 -- no URL or DB literal here.
      - AUTOBOT_CHROMADB_HOST=autobot-chromadb
      - AUTOBOT_CHROMADB_PORT=8000
      # #12513: shared secret for CHROMA_SERVER_AUTHN_* token auth on the
      # autobot-chromadb service above — empty by default (auth disabled,
      # dev/local); ssot_config.misc.chromadb_auth_token omits client auth
      # settings entirely when unset, matching an unauthenticated server.
      - AUTOBOT_CHROMADB_AUTH_TOKEN=${AUTOBOT_CHROMADB_AUTH_TOKEN:-}
    depends_on:
      autobot-redis:
        condition: service_healthy
      autobot-chromadb:
        condition: service_healthy
    healthcheck:
      # Beat serves no HTTP port, so it can't use the backend image's inherited
      # curl healthcheck (which always failed → false "unhealthy"). Check the
      # beat process (PID 1) is alive via procfs — no extra tools needed.
      test: ["CMD-SHELL", "grep -q celery /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      autobot-mgmt:
        ipv4_address: ${AUTOBOT_DOCKER_MGMT_PREFIX}.15
      autobot-data:

  autobot-slm:
    build:
      context: .
      dockerfile: docker/slm/Dockerfile
    image: autobot/slm:latest
    container_name: autobot-slm
    restart: unless-stopped
    # GH#9905: load the shared secret, then chain the image's own entrypoint
    # (/app/entrypoint.sh) so SLM startup is unchanged. Overriding entrypoint
    # clears the image CMD, so it is re-declared here (kept in sync with
    # docker/slm/Dockerfile); /app/entrypoint.sh runs migrations then exec "$@".
    entrypoint: ["/bin/sh", "/usr/local/bin/with-secrets.sh", "/app/entrypoint.sh"]
    command: ["python3", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--app-dir", "/app/autobot-slm-backend"]
    volumes:
      - slm_data:/app/data
      - slm_logs:/app/logs
      - autobot_secrets:/secrets:ro
      - ./docker/with-secrets.sh:/usr/local/bin/with-secrets.sh:ro
    environment:
      - AUTOBOT_ENVIRONMENT=production
      - AUTOBOT_LOG_LEVEL=${AUTOBOT_LOG_LEVEL:-INFO}
      - AUTOBOT_REDIS_HOST=autobot-redis
      - AUTOBOT_REDIS_PORT=6379
      - SLM_DATABASE_URL=postgresql+asyncpg://${SLM_POSTGRES_USER:-${AUTOBOT_POSTGRES_USER:-${AUTOBOT_DB_USER:-autobot}}}:${AUTOBOT_DB_PASSWORD:?run docker/generate-secrets.sh and pass --env-file docker/.env.secrets (INSTALL.md)}@autobot-postgres:5432/${SLM_DB_NAME:-${AUTOBOT_DB_NAME:-autobot_slm}}
      - SLM_USERS_DATABASE_URL=postgresql+asyncpg://${SLM_POSTGRES_USER:-${AUTOBOT_POSTGRES_USER:-${AUTOBOT_DB_USER:-autobot}}}:${AUTOBOT_DB_PASSWORD:?run docker/generate-secrets.sh and pass --env-file docker/.env.secrets (INSTALL.md)}@autobot-postgres:5432/slm_users
      # #19406: without this the SLM falls back to 127.0.0.1 and role slm_app for autobot_users.
      # A non-default SLM_POSTGRES_USER must already exist: compose creates only the owner role (#19408).
      - AUTOBOT_USERS_DATABASE_URL=postgresql+asyncpg://${SLM_POSTGRES_USER:-${AUTOBOT_POSTGRES_USER:-${AUTOBOT_DB_USER:-autobot}}}:${AUTOBOT_DB_PASSWORD:?run docker/generate-secrets.sh and pass --env-file docker/.env.secrets (INSTALL.md)}@autobot-postgres:5432/${AUTOBOT_POSTGRES_DB:-${AUTOBOT_USERS_DB_NAME:-autobot_users}}
      - AUTOBOT_COMPOSE_LEGACY_DB_VARS=${AUTOBOT_DB_USER:+AUTOBOT_DB_USER }${AUTOBOT_DB_NAME:+AUTOBOT_DB_NAME }${AUTOBOT_USERS_DB_NAME:+AUTOBOT_USERS_DB_NAME}
      - SLM_POSTGRES_HOST=autobot-postgres
      - SLM_ADMIN_PASSWORD=${SLM_ADMIN_PASSWORD:?run docker/generate-secrets.sh and pass --env-file docker/.env.secrets (INSTALL.md)}
      - SLM_DATA_DIR=/app/data
      # Point LoggingManager at the writable slm_logs volume so read_only: true
      # in the hardened overlay doesn't fail with EROFS when mkdir("logs") is
      # called relative to the /app/autobot-slm-backend working directory (#11574).
      - AUTOBOT_LOGS_DIR=/app/logs
      # Surface each compose service container as a fleet node (#9761). The default
      # lives in the SLM config (#19323): on here, because the SLM detects docker_local.
      # Passed through only when set (true|false) -- never restated.
      - SLM_COMPOSE_NODES
      - AUTOBOT_DOCKER_MGMT_PREFIX=${AUTOBOT_DOCKER_MGMT_PREFIX}  # compose_fleet node IPs (#16833)
      # Shared signing secrets so the backend node's JWT verifies on SLM —
      # without a shared secret each service generates its own and SLM rejects
      # the node WS with 401, leaving the host shown offline (#9715). CHANGE in
      # production via AUTOBOT_JWT_SECRET / SECRET_KEY / SLM_SECRET_KEY.
      # GH#9905: no parse-time fail. If unset, with-secrets.sh loads a unique
      # per-deployment secret auto-generated by secrets-init into the shared
      # autobot_secrets volume. An explicit value here (prod) still wins.
      # GH#9852: SLM_SECRET_KEY must equal SECRET_KEY so the backend-minted
      # service JWT passes auth_service.decode_token on the SLM side.
      - AUTOBOT_JWT_SECRET=${AUTOBOT_JWT_SECRET:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - SLM_SECRET_KEY=${SLM_SECRET_KEY:-}
    depends_on:
      autobot-secrets-init:
        condition: service_completed_successfully
      autobot-redis:
        condition: service_healthy
      autobot-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      # #11283: SLM (FastAPI + model/registry init) can exceed 60s on a busy CI
      # runner, so it was intermittently marked unhealthy before ready, failing
      # smoke-test's compose startup ~60% of the time. Match autobot-backend's 120s.
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      autobot-mgmt:
        ipv4_address: ${AUTOBOT_DOCKER_MGMT_PREFIX}.16
      autobot-data:
      autobot-app:

  autobot-frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: autobot/frontend:latest
    container_name: autobot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx config: HTTP-only by default.
      # For TLS: set AUTOBOT_DOCKER_NGINX_CONF=./docker/nginx/nginx-ssl.conf
      # Uses AUTOBOT_DOCKER_* prefix to avoid conflict with fleet .env vars (#2458)
      - ${AUTOBOT_DOCKER_NGINX_CONF:-./docker/nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/nginx-common.conf:/etc/nginx/nginx-common.conf:ro
      - ./docker/nginx/nginx-backend-upstream.conf:/etc/nginx/nginx-backend-upstream.conf:ro
      - ./docker/nginx/nginx-locations.conf:/etc/nginx/nginx-locations.conf:ro
      - ./docker/nginx/nginx-slm-locations.conf:/etc/nginx/nginx-slm-locations.conf:ro
      - ./docker/nginx/nginx-tls.conf:/etc/nginx/nginx-tls.conf:ro
      - ./docker/nginx/nginx-tls-redirect.conf:/etc/nginx/nginx-tls-redirect.conf:ro
      # TLS certificates directory (mounted read-only)
      # Generate dev certs: bash docker/certs/generate-self-signed.sh
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      autobot-backend:
        condition: service_healthy
      autobot-slm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging: *default-logging
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
      - /var/lib/nginx
      # nginx opens its compiled-in default error log before parsing config;
      # on a read_only rootfs this path must be writable or it alerts (#9718).
      - /var/log/nginx
    security_opt:
      - no-new-privileges:true
    networks:
      autobot-mgmt:
        ipv4_address: ${AUTOBOT_DOCKER_MGMT_PREFIX}.17
      autobot-app:

  # ---- Optional: SLM web GUI only (#18585) ----
  # `docker compose --profile slm up -d autobot-slm-gui` brings up the SLM web
  # GUI with only what it needs (secrets-init, redis, postgres, autobot-slm) —
  # not the full platform. It binds port 80 like autobot-frontend: run one or
  # the other. Add the rest of the fleet from the GUI afterwards.
  autobot-slm-gui:
    profiles: ["slm"]
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: slm-gui
    image: autobot/slm-gui:latest
    container_name: autobot-slm-gui
    restart: unless-stopped
    ports:
      - "80:80"
      # Host port for HTTPS; change it when host port 443 is taken (#18593).
      - "${AUTOBOT_DOCKER_SLM_HTTPS_PORT:-443}:443"
    volumes:
      # nginx config: HTTP-only by default, like autobot-frontend.
      # For TLS: set AUTOBOT_DOCKER_SLM_NGINX_CONF=./docker/nginx/nginx-slm-ssl.conf (#18593)
      - ${AUTOBOT_DOCKER_SLM_NGINX_CONF:-./docker/nginx/nginx-slm.conf}:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/nginx-common.conf:/etc/nginx/nginx-common.conf:ro
      - ./docker/nginx/nginx-slm-locations.conf:/etc/nginx/nginx-slm-locations.conf:ro
      - ./docker/nginx/nginx-tls.conf:/etc/nginx/nginx-tls.conf:ro
      - ./docker/nginx/nginx-tls-redirect.conf:/etc/nginx/nginx-tls-redirect.conf:ro
      # TLS certificates directory (mounted read-only); generate dev certs with
      # bash docker/certs/generate-self-signed.sh
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      autobot-slm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    logging: *default-logging
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
      - /var/lib/nginx
      - /var/log/nginx
    security_opt:
      - no-new-privileges:true
    networks:
      autobot-mgmt:
      autobot-app:

  # ---- Optional: Local LLM ----

  autobot-ollama:
    image: ollama/ollama:latest
    container_name: autobot-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G  # 7B models need ~5.5GB; increase for larger models
          cpus: '4.0'
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - autobot-mgmt
      - autobot-app
    profiles:
      - ollama

  # ---- Optional: Monitoring ----

  autobot-prometheus:
    image: prom/prometheus:v2.53.0
    container_name: autobot-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      # Whole directory, not just prometheus.yml: the alerts-*.yml rule files
      # sit beside it and were otherwise absent from the container (#12460).
      - ./autobot-monitoring:/etc/prometheus:ro
      # #16375: the backend scrape token file (prometheus_scrape_token). The
      # volume's autobot.env is 0640 999:999, unreadable to this container.
      - autobot_secrets:/run/autobot-secrets:ro
    depends_on:
      autobot-secrets-init:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging: *default-logging
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - autobot-mgmt
      - autobot-app
    profiles:
      - monitoring

  autobot-grafana:
    image: grafana/grafana:11.1.0
    container_name: autobot-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./autobot-monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?run docker/generate-secrets.sh and pass --env-file docker/.env.secrets (INSTALL.md)}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      autobot-prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
      - /var/run
    security_opt:
      - no-new-privileges:true
    networks:
      - autobot-mgmt
      - autobot-app
    profiles:
      - monitoring

volumes:
  autobot_secrets:
  postgres_data:
  redis_data:
  chroma_data:
  backend_data:
  backend_logs:
  slm_data:
  slm_logs:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  autobot-data:
    driver: bridge
  autobot-app:
    driver: bridge
  # Shared management network: every service joins this single subnet so all
  # fleet nodes report IPs from one range, regardless of app/data tier (#9761).
  # No default range (#16833): a fixed one took over the host's route on a LAN
  # using the same /24. docker/generate-secrets.sh picks a free private /24 per
  # host and writes AUTOBOT_DOCKER_MGMT_PREFIX (its first three octets).
  autobot-mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: "${AUTOBOT_DOCKER_MGMT_PREFIX:?run docker/generate-secrets.sh and pass --env-file docker/.env.secrets (INSTALL.md)}.0/24"
